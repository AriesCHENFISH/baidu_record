<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Borcelle Farm</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- Google Fonts (Domestic CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* Global Reset & Strict Rules */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* The Main Container */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF; /* Global White Background */
            overflow: hidden;
        }

        /* Typography Utilities for Specific Colors */
        .text-primary { color: #3B4D21; }
        .text-secondary { color: #666666; }
        .text-accent { color: #8B9A45; }
        .bg-primary { background-color: #3B4D21; }
        .bg-accent { background-color: #8B9A45; }
        .border-primary { border-color: #3B4D21; }
        .border-accent { border-color: #8B9A45; }

        /* Custom Scrollbar hide just in case */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Page Container -->
    <div id="page_container">
        
        <!-- Grid Layout Wrapper -->
        <div class="w-full h-full p-12 flex flex-col justify-between">
            
            <!-- Header Section -->
            <div class="flex justify-between items-center w-full z-10">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-leaf text-lg"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-primary tracking-tight">Borcelle Farm</h2>
                </div>

                <!-- Center Date Pill -->
                <div class="border border-accent rounded-full px-8 py-2">
                    <p class="text-primary font-medium tracking-wider">1998 - 2028</p>
                </div>

                <!-- Right Presentation Badge -->
                <div class="bg-primary rounded-full px-8 py-2 shadow-md">
                    <p class="text-white font-medium tracking-wide">Presentation</p>
                </div>
            </div>

            <!-- Main Content Area (Split Layout) -->
            <div class="flex-1 grid grid-cols-12 gap-10 items-center mt-8 mb-4">
                
                <!-- Left Column: Typography -->
                <div class="col-span-5 flex flex-col justify-center relative pl-4">
                    <!-- Decorative Element -->
                    <div class="absolute -left-2 top-0 w-1 h-32 bg-accent rounded-full opacity-50"></div>
                    
                    <!-- Main Title -->
                    <h1 class="text-9xl font-bold text-primary leading-[0.85] tracking-tighter drop-shadow-sm mb-8">
                        Thank<br>You
                    </h1>

                    <!-- Quote -->
                    <div class="mt-2">
                        <p class="text-xl text-secondary font-light italic leading-relaxed border-l-4 border-accent pl-6">
                            "Cultivating Tomorrow's<br>Harvest Today"
                        </p>
                    </div>
                </div>

                <!-- Right Column: Visual Imagery -->
                <div class="col-span-7 h-full w-full relative group">
                    <!-- Abstract Backdrop Shape -->
                    <div class="absolute right-0 bottom-0 w-[95%] h-[95%] bg-accent rounded-[3rem] opacity-20 transform translate-x-4 translate-y-4"></div>
                    
                    <!-- Image Container -->
                    <div class="w-full h-full rounded-[2.5rem] overflow-hidden shadow-2xl relative bg-gray-100">
                        <!-- High-Quality Farm Image -->
                        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600&auto=format&fit=crop" 
                             alt="Green pasture landscape" 
                             class="w-full h-full object-cover transform scale-105 group-hover:scale-110 transition-transform duration-700 ease-in-out">
                        <!-- Dimensions Comment -->
                        <!-- 700*450 -->
                        
                        <!-- Overlay Gradient for depth -->
                        <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"></div>
                    </div>
                </div>
            </div>

            <!-- Footer Section -->
            <div class="w-full border-t border-gray-200 pt-6">
                <div class="grid grid-cols-3 gap-4 text-secondary font-medium">
                    <!-- Footer Item 1 -->
                    <div class="flex items-center gap-2">
                        <i class="fa-regular fa-user text-accent"></i>
                        <p>Olivia Wilson</p>
                    </div>

                    <!-- Footer Item 2 -->
                    <div class="flex items-center justify-center gap-2">
                        <i class="fa-solid fa-microphone-lines text-accent"></i>
                        <p>Olivia Wilson</p>
                    </div>

                    <!-- Footer Item 3 -->
                    <div class="flex items-center justify-end gap-2">
                        <i class="fa-solid fa-pen-nib text-accent"></i>
                        <p>Olivia Wilson</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
