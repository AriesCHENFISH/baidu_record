<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Presentation Slide</title>
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts (Domestic Mirror as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* 1. Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 2. Page Container Configuration */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF; /* Palette: Background */
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif; /* Fallback to system fonts if needed */
        }

        /* Custom Utilities */
        .text-primary { color: #3B4D21; }
        .text-secondary { color: #666666; }
        .text-accent { color: #8B9A45; }
        .bg-primary { background-color: #3B4D21; }
        .bg-accent { background-color: #8B9A45; }
        .border-accent { border-color: #8B9A45; }
        .border-primary { border-color: #3B4D21; }

        /* Typography Enhancements */
        h1 { font-weight: 700; letter-spacing: -0.03em; line-height: 0.9; }
        p { line-height: 1.5; }
        
        /* Subtle Background Decoration */
        .decorative-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #f3f7e8, #ffffff);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 0;
            opacity: 0.6;
            filter: blur(60px);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- Background Decoration -->
        <div class="decorative-blob"></div>

        <!-- Header Section (Padding top 40px, side 50px) -->
        <header class="flex justify-between items-center w-full px-12 pt-10 relative z-10">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white">
                    <i class="fa-solid fa-leaf text-sm"></i>
                </div>
                <h2 class="text-xl font-bold text-primary tracking-tight">Borcelle Farm</h2>
            </div>

            <!-- Date (Capsule) -->
            <div class="border border-accent rounded-full px-6 py-1.5">
                <span class="text-primary font-medium text-sm tracking-wide">1998 - 2028</span>
            </div>

            <!-- Presentation Tag (Capsule/Button style) -->
            <div class="bg-primary px-6 py-1.5 rounded-full">
                <span class="text-white text-sm font-medium">Presentation</span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="grid grid-cols-12 gap-8 px-12 mt-8 h-[520px] relative z-10">
            
            <!-- Left Column: Typography & Info (5 cols) -->
            <div class="col-span-5 flex flex-col justify-between py-4">
                
                <!-- Title Section -->
                <div class="mt-8">
                    <p class="text-accent font-semibold tracking-widest uppercase text-sm mb-4">
                        <i class="fa-solid fa-seedling mr-2"></i>Sustainability
                    </p>
                    <h1 class="text-[130px] text-primary leading-none -ml-1">
                        Agri<br>culture
                    </h1>
                </div>

                <!-- Arrow & Quote Section -->
                <div class="flex flex-col gap-8">
                    <!-- Action Arrow -->
                    <div class="w-16 h-16 rounded-full border border-primary flex items-center justify-center text-primary text-2xl">
                        <i class="fa-solid fa-arrow-right -rotate-45"></i>
                    </div>

                    <!-- Quote -->
                    <div class="border-l-4 border-accent pl-4">
                        <p class="text-secondary text-lg italic font-medium">
                            “Cultivating Tomorrow's Harvest Today”
                        </p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Visual & Presenters (7 cols) -->
            <div class="col-span-7 flex flex-col h-full pl-8">
                
                <!-- Main Image Container -->
                <!-- Design Choice: Large rounded rectangle with deep shadow for depth -->
                <div class="w-full h-[380px] rounded-[40px] overflow-hidden shadow-2xl relative mb-8">
                    <!-- Image Source: Sheep/Farm Aerial View -->
                    <img src="https://images.unsplash.com/photo-1484557985045-6f5e98486c95?q=80&w=1280&auto=format&fit=crop" 
                         alt="Aerial view of green farm pastures with sheep" 
                         class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700">
                    <!-- 700*380 -->

                    <!-- Overlay Badge for visual interest -->
                    <div class="absolute bottom-6 right-6 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-lg shadow-lg">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-accent"></i>
                            <span class="text-xs font-bold text-primary">North Hills, UK</span>
                        </div>
                    </div>
                </div>

                <!-- Footer / Presenters Grid -->
                <!-- Aligning with the image width -->
                <div class="grid grid-cols-3 gap-4 border-t border-gray-200 pt-5">
                    
                    <!-- Presenter 1 -->
                    <div class="flex flex-col gap-1">
                        <span class="text-xs text-secondary uppercase tracking-wider">Presentation by</span>
                        <p class="text-primary font-bold text-base">Olivia Wilson</p>
                    </div>

                    <!-- Presenter 2 -->
                    <div class="flex flex-col gap-1">
                        <span class="text-xs text-secondary uppercase tracking-wider">Presentation by</span>
                        <p class="text-primary font-bold text-base">Aaron Loeb</p>
                    </div>

                    <!-- Presenter 3 -->
                    <div class="flex flex-col gap-1">
                        <span class="text-xs text-secondary uppercase tracking-wider">Presentation by</span>
                        <p class="text-primary font-bold text-base">Juliana Silva</p>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
