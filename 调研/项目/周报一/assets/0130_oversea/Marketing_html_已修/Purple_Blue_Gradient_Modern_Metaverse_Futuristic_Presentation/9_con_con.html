<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Experience - Modified</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #05020D; overflow: hidden;
        }
        .blur-blob { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 1; }
        h1, h2, h3, h4, h5, h6 { line-height: 1.1; }
    </style>
</head>
<body>

    <div id="page_container">

        <div style="position: absolute; top: 60px; left: 80px; z-index: 50; display: flex; align-items: center; opacity: 0.9;">
             <div style="width: 40px; height: 40px; border: 2px solid #FF99D6; border-radius: 4px; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); box-shadow: 0 0 15px rgba(255,153,214,0.4);">
                <div style="width: 20px; height: 20px; background-color: rgba(112, 243, 255, 0.8); border-radius: 2px;"></div>
            </div>
            <div style="display: flex; flex-direction: column; justify-content: center; margin-left: 16px;">
                 <h6 style="color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1; margin-bottom: 4px;">Studio</h6>
                 <h6 style="color: #D1C7E0; font-size: 12px; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1;">Shodwe</h6>
            </div>
        </div>

        <div class="blur-blob" style="width: 500px; height: 500px; top: -150px; left: -100px; background-color: #140A26; opacity: 0.8;"></div>
        <div class="blur-blob" style="width: 400px; height: 400px; bottom: -100px; left: -100px; background-color: #23153C; opacity: 0.6;"></div>
        <div class="blur-blob" style="width: 600px; height: 600px; top: 50px; right: -200px; background-color: #05020D; box-shadow: 0 0 100px #3A2459;"></div>

        <div class="relative z-10 grid grid-cols-12 h-full w-full pl-24 pr-16 pt-16 pb-12">
            
            <div class="col-span-5 flex flex-col justify-center relative">
                
                <div class="h-20"></div>

                <div class="mb-8">
                    <h1 class="text-7xl font-black text-white tracking-tighter leading-[0.85] uppercase" style="text-shadow: 0 0 20px rgba(122, 62, 156, 0.4);">
                        User<br>
                        <span class="text-[#D1C7E0]">Experience</span>
                    </h1>
                </div>

                <div class="mb-12 pr-8">
                    <p class="text-[#D1C7E0] text-lg font-light leading-relaxed">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. 
                        <b class="text-[#70F3FF] font-normal">Volutpat est velit</b> egestas dui id ornare arcu.
                    </p>
                </div>

                <div class="h-10"></div>
            </div>

            <div class="col-span-7 relative flex flex-col justify-center items-center pl-10">
                
                <div class="relative z-20 bg-[#05020D] p-3 rounded-t-2xl rounded-b-md border border-[#3A2459] shadow-[0_0_50px_-10px_rgba(122,62,156,0.5)]" style="width: 640px;">
                    <div class="absolute top-1 left-1/2 transform -translate-x-1/2 w-1 h-1 bg-[#3A2459] rounded-full"></div>
                    <div class="w-full h-[360px] bg-[#140A26] overflow-hidden rounded border border-[#23153C] relative group">
                        <div class="w-full h-full relative">
                            <div class="absolute top-0 left-0 w-full h-full z-10 pointer-events-none border-[1px] border-[#70F3FF] opacity-20 m-4 rounded" style="width: calc(100% - 2rem); height: calc(100% - 2rem);"></div>
                            <div class="absolute top-10 right-10 w-20 h-20 border-t-2 border-r-2 border-[#FF99D6] opacity-50 z-10"></div>
                            <img src="https://images.unsplash.com/photo-1592478411213-61535fdd861d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1280&q=80" 
                                 alt="VR Experience" 
                                 class="w-full h-full object-cover opacity-90 mix-blend-screen"
                                 style="filter: contrast(1.1) brightness(1.1);">
                        </div>
                    </div>
                    <div class="h-3 w-full bg-[#140A26] mt-0 rounded-b-md flex justify-center items-center border-t border-[#000]">
                         <div class="w-16 h-1 bg-[#23153C] rounded-full"></div>
                    </div>
                </div>
                
                <div class="w-[700px] h-3 bg-[#D1C7E0] rounded-b-xl relative z-20 shadow-lg mt-[-2px]"></div>

                <div class="absolute bottom-[100px] w-[500px] h-[100px] rounded-[100%] border-[2px] border-[#7A3E9C] z-0 flex items-center justify-center opacity-80"
                     style="background: linear-gradient(180deg, rgba(20,10,38,0), rgba(122,62,156,0.1)); transform: perspective(800px) rotateX(60deg) translateY(80px);">
                </div>
                <div class="absolute bottom-[100px] w-[460px] h-[80px] rounded-[100%] border-[4px] border-[#70F3FF] z-0 shadow-[0_0_20px_#70F3FF]"
                     style="background: transparent; transform: perspective(800px) rotateX(60deg) translateY(80px); opacity: 0.6;">
                </div>

            </div>
        </div>

        <div class="absolute bottom-10 right-10 z-30">
            <div class="w-12 h-12 rounded-full border border-white flex items-center justify-center text-white opacity-80">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>

        <div class="absolute top-0 right-0 w-1/3 h-full z-0 opacity-10 pointer-events-none" 
             style="background-image: linear-gradient(#7A3E9C 1px, transparent 1px), linear-gradient(90deg, #7A3E9C 1px, transparent 1px); background-size: 40px 40px; mask-image: linear-gradient(to left, black, transparent);">
        </div>

        <div style="position: absolute; bottom: 50px; left: 80px; z-index: 20;">
            <p style="color: #FFFFFF; font-size: 14px; letter-spacing: 2px; margin-bottom: 4px; font-weight: 700;">PAGE</p>
            <p style="color: #70F3FF; font-size: 14px; letter-spacing: 1px;">09 / 15</p>
        </div>

    </div>
</body>
</html>
