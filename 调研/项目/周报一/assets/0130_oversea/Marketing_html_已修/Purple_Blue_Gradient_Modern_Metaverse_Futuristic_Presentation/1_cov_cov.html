<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaverse Cover - Boxed Redesign</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#05020D',
                        cyberViolet: '#7A3E9C',
                        holoPink: '#FF99D6',
                        auroraCyan: '#70F3FF',
                        mistGrey: '#D1C7E0',
                        glassDark: 'rgba(15, 10, 30, 0.85)',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        mono: ['"Courier New"', 'monospace'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #05020D; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }

        /* --- Background Textures --- */
        .bg-noise {
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 1; mix-blend-mode: overlay;
        }

        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; }

        /* --- The Main Text Box (Cyber Panel) --- */
        .cyber-panel {
            position: relative;
            background: rgba(20, 12, 38, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            /* Cut Corners using clip-path */
            clip-path: polygon(
                40px 0, 100% 0, 
                100% calc(100% - 40px), calc(100% - 40px) 100%, 
                0 100%, 0 40px
            );
        }

        /* Decorative Grid inside the panel */
        .panel-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(112, 243, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(112, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none; z-index: 0;
        }

        /* Typography */
        .title-gradient {
            background: linear-gradient(180deg, #FFFFFF 20%, #A5B4FC 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(112, 243, 255, 0.4));
        }

        .subtitle-stroke {
            font-family: 'Arial Black', sans-serif;
            -webkit-text-stroke: 1px #70F3FF;
            color: transparent;
            letter-spacing: 0.5em;
        }

        /* Footer Glitch Bar */
        .footer-bar {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, #7A3E9C, #FF99D6, #70F3FF);
            position: absolute; bottom: 0; left: 0;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="bg-noise"></div>
        
        <div class="bg-orb top-[-200px] left-[-100px] w-[800px] h-[800px]" style="background: radial-gradient(circle, rgba(58, 36, 89, 0.5) 0%, transparent 70%);"></div>
        <div class="bg-orb bottom-[-300px] right-[-100px] w-[900px] h-[900px]" style="background: radial-gradient(circle, rgba(112, 243, 255, 0.15) 0%, transparent 70%);"></div>
        
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] border border-white/5 rounded-full opacity-30 animate-[spin_60s_linear_infinite] pointer-events-none -z-10"></div>


        <div style="position: absolute; top: 60px; left: 80px; z-index: 50; display: flex; align-items: center; opacity: 0.9;">
             <div style="width: 40px; height: 40px; border: 2px solid #FF99D6; border-radius: 4px; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); box-shadow: 0 0 15px rgba(255,153,214,0.4);">
                <div style="width: 20px; height: 20px; background-color: rgba(112, 243, 255, 0.8); border-radius: 2px;"></div>
            </div>
            <div style="display: flex; flex-direction: column; justify-content: center; margin-left: 16px;">
                 <h6 style="color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1; margin-bottom: 4px;">Studio</h6>
                 <h6 style="color: #D1C7E0; font-size: 12px; font-weight: 300; letter-spacing: 0.3em; text-transform: uppercase; line-height: 1;">Shodwe</h6>
            </div>
        </div>


        <div class="absolute inset-0 flex items-center justify-center z-10 p-12">
            
            <div class="cyber-panel w-[900px] h-[480px] flex flex-col items-center justify-center text-center animate-float">
                
                <div class="panel-grid"></div>

                <div class="absolute top-0 left-0 w-[150px] h-[2px] bg-gradient-to-r from-holoPink to-transparent"></div>
                <div class="absolute top-0 left-0 w-[2px] h-[100px] bg-gradient-to-b from-holoPink to-transparent"></div>
                <div class="absolute bottom-0 right-0 w-[150px] h-[2px] bg-gradient-to-l from-auroraCyan to-transparent"></div>
                <div class="absolute bottom-0 right-0 w-[2px] h-[100px] bg-gradient-to-t from-auroraCyan to-transparent"></div>

                <div class="relative z-10 flex flex-col items-center">
                    
                    <div class="flex items-center gap-4 mb-6 opacity-80">
                        <div class="w-2 h-2 bg-auroraCyan rounded-full animate-pulse"></div>
                        <span class="font-mono text-auroraCyan text-xs tracking-[0.4em] uppercase">Keynote Presentation</span>
                        <div class="w-2 h-2 bg-auroraCyan rounded-full animate-pulse"></div>
                    </div>

                    <h1 class="text-[110px] font-black leading-[0.9] tracking-tighter title-gradient uppercase mb-2">
                        Metaverse
                    </h1>
                    
                    <h2 class="text-4xl font-light tracking-[0.6em] text-white uppercase relative inline-block pl-[0.6em]">
                        Expansion
                        <span class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-1/3 h-[1px] bg-gradient-to-r from-transparent via-holoPink to-transparent"></span>
                    </h2>

                    <div class="mt-16 flex items-center gap-12 text-mistGrey/60 font-mono text-xs">
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-white font-bold text-lg">2025</span>
                            <span class="tracking-widest font-size: 16px">VISION</span>
                        </div>
                        
                        <div class="h-8 w-[1px] bg-white/10"></div>
                        
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-white font-bold text-lg">v.2.0</span>
                            <span class="tracking-widest font-size: 16px">RELEASE</span>
                        </div>
                        
                        <div class="h-8 w-[1px] bg-white/10"></div>
                        
                        <div class="flex flex-col items-center gap-1">
                            <span class="text-white font-bold text-lg">Q3</span>
                            <span class="tracking-widest font-size: 16px">REPORT</span>
                        </div>
                    </div>

                </div>

            </div>
        </div>


        <div style="position: absolute; bottom: 50px; left: 80px; z-index: 20;">
            <p style="color: #FFFFFF; font-size: 14px; letter-spacing: 2px; margin-bottom: 4px; font-weight: 700;">PAGE</p>
            <p style="color: #70F3FF; font-size: 14px; letter-spacing: 1px;">01 / 15</p>
        </div>

        <div class="absolute bottom-[40px] right-[80px] z-20 group cursor-pointer">
            <div class="w-14 h-14 rounded-full border border-mistGrey/30 flex items-center justify-center transition-all duration-300 group-hover:bg-white group-hover:border-white group-hover:shadow-[0_0_20px_#fff]">
                <i class="fa-solid fa-arrow-right text-white text-xl transition-transform duration-300 group-hover:text-deepBlack group-hover:translate-x-1"></i>
            </div>
        </div>

    </div>

</body>
</html>
