<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Larana Company</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 
         * Page Container Logic 
         * Fixed 1280x720 dimension
         */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050505; /* Deep Space Black */
            overflow: hidden;
            color: #FFFFFF;
        }

        /* Custom Utility Classes for specific visual effects */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Horizon Light Beam Effect */
        .horizon-light {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            box-shadow: 0 0 60px 10px rgba(245, 194, 212, 0.3); /* Soft Glow Pink Shadow */
        }
    </style>
</head>
<body>

    <!-- Main PPT Container -->
    <div id="page_container">
        
        <!-- Background Ambient Lighting (Gradients) -->
        <!-- Purpose: Create depth and the "Subtle Ambient Purple" atmosphere -->
        <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full opacity-30" 
             style="background: radial-gradient(circle, #1A1520, transparent);"></div>
        <div class="absolute bottom-[-20%] left-[-10%] w-[800px] h-[500px] rounded-full opacity-20" 
             style="background: radial-gradient(circle, #F5C2D4, transparent);"></div>

        <!-- 1. Header Section -->
        <!-- Layout: Flexbox for Top Bar (Logo Left, Date Right) -->
        <div class="absolute top-0 left-0 w-full p-10 flex justify-between items-center z-20">
            <!-- Logo Area -->
            <div class="flex items-center gap-4">
                <!-- Icon: Soft Glow Pink -->
                <div class="text-[#F5C2D4] text-3xl">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <!-- Company Name: Pure White -->
                <h2 class="text-white text-2xl font-light tracking-wide">Larana Company</h2>
            </div>

            <!-- Date Badge: Frosted Glass Grey -->
            <div class="glass-panel px-8 py-2 rounded-full">
                <p class="text-[#D1D1D1] text-lg font-medium tracking-wide">August 2025</p>
            </div>
        </div>

        <!-- 2. Main Hero Content -->
        <!-- Layout: Centered Flex Column -->
        <div class="absolute inset-0 flex flex-col justify-center items-center z-10 pt-10">
            
            <!-- Main Title: Huge Typography -->
            <h1 class="text-[140px] leading-none font-bold text-white text-glow mb-2" style="font-family: 'Helvetica Neue', Arial, sans-serif;">
                Thank You
            </h1>

            <!-- Decorative Horizon Line (The Light Beam) -->
            <!-- Visual restoration of the light streak in original image -->
            <div class="w-2/3 h-[2px] horizon-light my-6 opacity-80"></div>

            <!-- Subtitle: High Tracking (Letter Spacing) -->
            <div class="text-center mt-2">
                <p class="text-2xl text-[#D1D1D1] uppercase tracking-[0.4em] font-light">
                    Let’s Create Something
                </p>
                <p class="text-2xl text-white uppercase tracking-[0.4em] font-medium mt-3 text-glow">
                    Amazing Together
                </p>
            </div>
        </div>

        <!-- 3. Footer Contact Bar -->
        <!-- Layout: Glassmorphism container with grid for contact details -->
        <div class="absolute bottom-10 left-10 right-10 glass-panel rounded-xl py-4 px-6 z-20">
            <div class="grid grid-cols-4 gap-4 items-center justify-items-center text-sm">
                
                <!-- Phone -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#F5C2D4] text-[#050505] flex items-center justify-center">
                        <i class="fa-solid fa-phone text-xs"></i>
                    </div>
                    <p class="text-[#D1D1D1] font-light">+123-456-7890</p>
                </div>

                <!-- Email -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#F5C2D4] text-[#050505] flex items-center justify-center">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </div>
                    <p class="text-[#D1D1D1] font-light">hello@reallygreatsite.com</p>
                </div>

                <!-- Website -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#F5C2D4] text-[#050505] flex items-center justify-center">
                        <i class="fa-solid fa-globe text-xs"></i>
                    </div>
                    <p class="text-[#D1D1D1] font-light">www.reallygreatsite.com</p>
                </div>

                <!-- Address -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#F5C2D4] text-[#050505] flex items-center justify-center">
                        <i class="fa-solid fa-location-dot text-xs"></i>
                    </div>
                    <p class="text-[#D1D1D1] font-light truncate max-w-[200px]">123 Anywhere St., Any City</p>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
