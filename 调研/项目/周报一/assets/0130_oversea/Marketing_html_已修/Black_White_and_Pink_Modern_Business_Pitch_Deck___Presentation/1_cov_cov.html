<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck - Larana Company</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Main Container setup */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050505; /* Deep Black */
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Glassmorphism Utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Subtle Ambient Background */
        .ambient-glow {
            position: absolute;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Pink Gradient Text Utility */
        .text-gradient-pink {
            /* Linear Gradient: Top (White) -> Bottom (Soft Pink) */
            background: linear-gradient(180deg, #FFFFFF 30%, #F5C2D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">
        
        <!-- Background: Subtle Depth -->
        <div class="ambient-glow" style="top: -40%; left: 20%;"></div>
        <div class="ambient-glow" style="bottom: -40%; right: -10%; opacity: 0.5;"></div>

        <!-- 1. Unified Header (Strict Consistency) -->
        <div class="relative z-20 flex justify-between items-center px-12 pt-8">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="text-[#F5C2D4] text-xl">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <h2 class="text-white text-lg font-medium tracking-wide">Larana Company</h2>
            </div>
            <!-- Navigation -->
            <div class="glass-panel rounded-full p-1 pl-1 pr-6 flex items-center gap-6">
                <div class="bg-[#F5C2D4] text-[#050505] px-6 py-2 rounded-full">
                    <span class="text-sm font-bold tracking-tight">Pitch Deck Business Presentation</span>
                </div>
                <span class="text-[#D1D1D1] text-sm font-light tracking-widest">August 2025</span>
            </div>
        </div>

        <!-- 2. Main Content (Hero) -->
        <div class="flex flex-col items-center justify-center relative z-10 mt-16">
            
            <!-- Main Title (Pink Gradient Applied) -->
            <!-- Changed text-white to text-gradient-pink -->
            <h1 class="text-gradient-pink text-[150px] leading-[0.9] font-bold tracking-tighter drop-shadow-2xl">
                PITCH DECK
            </h1>

            <!-- Subtitle -->
            <div class="mt-6 mb-10">
                <p class="text-[#D1D1D1] text-2xl uppercase tracking-[0.6em] font-light">
                    Business Presentation
                </p>
            </div>

            <!-- Simple Divider Line -->
            <div class="w-full max-w-[1000px] h-[1px] bg-white/20 mb-14 relative">
                <!-- Center decorative dot -->
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-[#F5C2D4] rounded-full"></div>
            </div>

            <!-- Bottom Information Cards Grid -->
            <div class="flex gap-10 w-full max-w-[1000px] justify-center">
                
                <!-- Card 1: Presenter Info -->
                <div class="glass-panel rounded-2xl p-5 flex items-center gap-5 w-[420px] hover:bg-white/5 transition-colors duration-300">
                    <!-- Presenter Image -->
                    <div class="relative">
                        <div class="w-16 h-16 rounded-full overflow-hidden border border-white/20">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Olivia Wilson" class="w-full h-full object-cover grayscale opacity-90">
                        </div>
                    </div>
                    
                    <!-- Text Info -->
                    <div class="flex flex-col">
                        <span class="text-[#D1D1D1] text-xs font-light tracking-wide mb-1 uppercase">Presented By</span>
                        <span class="text-white text-lg font-bold">Olivia Wilson</span>
                    </div>
                </div>

                <!-- Card 2: Key Stats -->
                <div class="glass-panel rounded-2xl p-5 flex items-center gap-6 w-[420px] hover:bg-white/5 transition-colors duration-300">
                    <!-- Icon -->
                    <div class="w-14 h-14 flex items-center justify-center rounded-full bg-white/5">
                         <i class="fa-solid fa-chart-line text-3xl text-[#F5C2D4]"></i>
                    </div>

                    <!-- Stat Content -->
                    <div class="flex flex-col">
                        <span class="text-white text-3xl font-bold tracking-tight mb-1">+250k</span>
                        <p class="text-[#D1D1D1] text-[11px] leading-tight opacity-70">
                            Join us in creating innovation that truly makes a difference
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
