<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Impact Slide</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgDark: '#040710', textPrimary: '#FFFFFF', textSecondary: '#B0B3B8', accentCyan: '#4FB0C0', accentBlue: '#2C6FCA', cardBg: '#1A1B1F', },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'], },
                    backgroundImage: { 'gradient-tech': 'linear-gradient(to right, #2C6FCA, #4FB0C0)', }
                }
            }
        }
    </script>
    <style>
        #page_container { width: 1280px; height: 720px; background-color: #040710; margin: 0 auto; position: relative; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="grid grid-cols-12 h-full w-full">
            
            <div class="col-span-7 relative h-full overflow-hidden">
                <div class="absolute inset-0 z-10 bg-accentBlue/10 mix-blend-overlay pointer-events-none"></div>
                <div class="absolute inset-0 z-20 bg-gradient-to-r from-bgDark via-transparent to-transparent"></div>
                
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1280&auto=format&fit=crop" 
                     alt="Global Network Map" 
                     class="w-full h-full object-cover opacity-60 mix-blend-screen scale-110">
                
                <div class="absolute top-1/3 left-1/4 z-30 flex items-center">
                    <div class="w-3 h-3 bg-accentCyan rounded-full animate-ping absolute"></div>
                    <div class="w-3 h-3 bg-accentCyan rounded-full relative mr-2"></div>
                    <span class="text-textPrimary text-xs font-bold bg-bgDark/80 px-2 py-1 rounded">NorAm Hub Active</span>
                </div>
                <div class="absolute bottom-1/3 right-1/3 z-30 flex items-center">
                    <div class="w-3 h-3 bg-accentBlue rounded-full animate-ping absolute"></div>
                    <div class="w-3 h-3 bg-accentBlue rounded-full relative mr-2"></div>
                    <span class="text-textPrimary text-xs font-bold bg-bgDark/80 px-2 py-1 rounded">APAC Threats Blocked</span>
                </div>
            </div>

            <div class="col-span-5 h-full flex flex-col justify-center pr-16 pl-8 relative z-30">
                
                <div class="mb-12">
                    <div class="w-16 h-1 bg-accentCyan mb-6"></div>
                    <h2 class="text-textSecondary text-2xl font-light tracking-widest mb-2 uppercase">Worldwide Reach</h2>
                    <h1 class="text-textPrimary text-6xl font-bold leading-tight uppercase">
                        GLOBAL <span class="text-accentCyan">IMPACT</span>
                    </h1>
                </div>

                <div class="space-y-6">
                    
                    <div class="bg-cardBg/80 backdrop-blur-md p-6 rounded-r-xl border-l-4 border-accentBlue flex items-center justify-between">
                        <div>
                            <h3 class="text-textSecondary text-sm uppercase font-bold mb-1">Threats Blocked Daily</h3>
                            <div class="text-5xl font-bold text-textPrimary flex items-baseline">
                                1.5 <span class="text-accentCyan text-3xl ml-1">Billion</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-shield-virus text-4xl text-accentBlue opacity-50"></i>
                    </div>

                     <div class="bg-cardBg/80 backdrop-blur-md p-6 rounded-r-xl border-l-4 border-accentCyan flex items-center justify-between shadow-[0_5px_15px_rgba(79,176,192,0.2)]">
                        <div>
                            <h3 class="text-textSecondary text-sm uppercase font-bold mb-1">Enterprise Clients</h3>
                            <div class="text-5xl font-bold text-textPrimary flex items-baseline">
                                500 <span class="text-accentCyan text-3xl ml-1">+</span>
                            </div>
                        </div>
                         <i class="fa-solid fa-building-shield text-4xl text-accentCyan opacity-80"></i>
                    </div>

                     <div class="bg-cardBg/80 backdrop-blur-md p-6 rounded-r-xl border-l-4 border-accentBlue flex items-center justify-between">
                        <div>
                            <h3 class="text-textSecondary text-sm uppercase font-bold mb-1">Global Data Nodes</h3>
                            <div class="text-5xl font-bold text-textPrimary flex items-baseline">
                                64 <span class="text-accentCyan text-3xl ml-1">Countries</span>
                            </div>
                        </div>
                         <i class="fa-solid fa-globe text-4xl text-accentBlue opacity-50"></i>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
