<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Information Protection</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts: Noto Sans SC (Specified in prompt) & Inter for English parts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Strict Page Container Dimensions */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #040710; /* Global Background */
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* Typography Utilities */
        h1, h2, h3, h4, h5, h6 {
            line-height: 1.1;
        }

        /* Custom Gradients as per strict syntax requirements */
        .bg-gradient-primary {
            background: linear-gradient(180deg, #2C6FCA, #4FB0C0);
        }
        
        /* Utility for image masking/overlay */
        .image-overlay {
            background: linear-gradient(90deg, #040710, transparent);
        }

        /* Card Styles */
        .feature-card {
            background-color: #1A1B1F;
            transition: all 0.3s ease;
        }

        /* Text Colors */
        .text-brand {
            color: #4FB0C0;
        }
        
        .text-secondary {
            color: #B0B3B8;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div class="page_container">
        
        <!-- Decorative Background Elements (Geometric) -->
        <!-- Top Right Circuit Line Decoration -->
        <div class="absolute top-0 right-0 w-64 h-1 bg-gradient-primary opacity-50 z-20"></div>
        <div class="absolute top-0 right-20 w-1 h-32 bg-gradient-primary opacity-50 z-20"></div>
        
        <!-- Main Grid Layout -->
        <div class="grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Content (7 cols) -->
            <div class="col-span-7 flex flex-col justify-center pl-20 pr-10 z-20">
                
                <!-- Header Section -->
                <div class="mb-12">
                    <!-- Main Title: White Part -->
                    <h1 class="text-white text-6xl font-bold tracking-tight mb-2">
                        MODERN INFORMATION
                    </h1>
                    <!-- Main Title: Brand Color Part -->
                    <h1 class="text-brand text-6xl font-extrabold tracking-tight mb-8">
                        PROTECT FROM HACKERS
                    </h1>
                    
                    <!-- Subtitle / Description -->
                    <div class="w-3/4">
                        <p class="text-secondary text-lg font-light leading-relaxed">
                            Utilizing cutting-edge encryption to safeguard data from hackers. We provide comprehensive security protocols to ensure your digital assets remain impenetrable.
                        </p>
                    </div>
                </div>

                <!-- Features/Cards Section -->
                <div class="flex gap-6 mt-4 w-full">
                    
                    <!-- Card 1: Threat Detection (Default Dark) -->
                    <div class="feature-card w-1/3 p-8 rounded-xl flex flex-col items-center justify-center text-center border border-gray-800">
                        <!-- Icon Container -->
                        <div class="mb-6 text-4xl text-white">
                            <i class="fa-solid fa-file-shield"></i>
                        </div>
                        <!-- Text -->
                        <h3 class="text-white text-lg font-bold mb-1">Threat</h3>
                        <h3 class="text-white text-lg font-bold">Detection</h3>
                    </div>

                    <!-- Card 2: Firewall Defense (Highlighted Gradient) -->
                    <div class="w-1/3 p-8 rounded-xl flex flex-col items-center justify-center text-center bg-gradient-primary shadow-2xl relative overflow-hidden">
                        <!-- Subtle gloss effect -->
                        <div class="absolute top-0 left-0 w-full h-full bg-white opacity-10"></div>
                        
                        <!-- Icon Container -->
                        <div class="mb-6 text-4xl text-white relative z-10">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <!-- Text -->
                        <h3 class="text-white text-lg font-bold mb-1 relative z-10">Firewall</h3>
                        <h3 class="text-white text-lg font-bold relative z-10">Defense</h3>
                    </div>

                    <!-- Card 3: Security Updates (Default Dark) -->
                    <div class="feature-card w-1/3 p-8 rounded-xl flex flex-col items-center justify-center text-center border border-gray-800">
                        <!-- Icon Container -->
                        <div class="mb-6 text-4xl text-white">
                            <i class="fa-solid fa-laptop-code"></i>
                        </div>
                        <!-- Text -->
                        <h3 class="text-white text-lg font-bold mb-1">Security</h3>
                        <h3 class="text-white text-lg font-bold">Updates</h3>
                    </div>

                </div>
            </div>

            <!-- Right Column: Visuals (5 cols) -->
            <div class="col-span-5 relative h-full">
                <!-- Image Container with Masking -->
                <div class="absolute inset-0 z-0">
                    <!-- Image Source: High-tech cyberpunk vibe -->
                    <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop" 
                         alt="Cybersecurity Professional VR" 
                         class="w-full h-full object-cover opacity-80"
                         style="object-position: center right;">
                    <!-- w:533 h:720 -->
                </div>

                <!-- Gradient Overlay to blend image with dark background -->
                <div class="absolute inset-0 image-overlay z-10"></div>
                
                <!-- Decorative Elements on top of image -->
                <div class="absolute bottom-10 right-10 z-20 flex flex-col items-end gap-2">
                   <!-- Decorative Status Badge -->
                   <div class="px-4 py-2 bg-black bg-opacity-70 backdrop-blur-md rounded-md border border-gray-700">
                       <p class="text-brand text-xs font-mono font-bold tracking-widest">
                           <i class="fa-solid fa-circle-check mr-2"></i>SYSTEM SECURE
                       </p>
                   </div>
                </div>
            </div>

        </div>

        <!-- Bottom Tech Decoration Line -->
        <div class="absolute bottom-0 left-0 w-full h-1 bg-[#1A1B1F] flex items-center">
            <div class="w-1/3 h-full bg-gradient-primary"></div>
        </div>
    </div>

</body>
</html>
