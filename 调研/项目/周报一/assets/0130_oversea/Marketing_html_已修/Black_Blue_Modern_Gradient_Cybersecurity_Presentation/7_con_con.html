    <style>
        /* Global CSS Reset & Essentials */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - 1280x720 Fixed */
        .page_container {
            width: 1280px;
            height: 720px;
            background-color: #040710; /* Deep Dark Background */
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            /* No outer shadow as requested */
        }

        /* Custom Gradient for Cards */
        .gradient-bg {
            background: linear-gradient(to bottom, #2C6FCA, #4FB0C0);
        }

        /* Subtle Glow Background Decoration */
        .glow-effect {
            position: absolute;
            width: 800px;
            height: 400px;
            background: radial-gradient(circle, rgba(44, 111, 202, 0.15) 0%, rgba(4, 7, 16, 0) 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Tech Line Decoration */
        .tech-line {
            position: absolute;
            background-color: #4FB0C0;
            opacity: 0.7;
        }
        
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #4FB0C0;
            border-radius: 50%;
            box-shadow: 0 0 8px #4FB0C0;
        }

        /* Card Image Styling */
        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
    </style>
</head>
