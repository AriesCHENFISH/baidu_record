<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Materials - Keynote Slide</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }

        /* Page Container - Strict 1280x720 Fixed Layout */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #0A0A0A; /* Primary Background */
            overflow: hidden;
        }

        /* Custom Utility for Text Shadow to ensure readability on architectural backgrounds */
        .text-glow {
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
        }
        
        .glass-border {
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="page_container">

        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1486748723228-59695679905c?q=80&w=2000&auto=format&fit=crop" 
                 alt="Architectural Ceiling Grid" 
                 class="w-full h-full object-cover opacity-60 grayscale brightness-75">
            
            <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0.4) 40%, rgba(10,10,10,0.95) 100%);"></div>
        </div>

        <div class="absolute inset-10 z-10 border border-white/20 rounded-3xl pointer-events-none"></div>

        <div class="absolute top-14 left-14 right-14 z-50 flex justify-between items-center">
            
            <div class="bg-[#F2F2F2] rounded-full px-6 py-2 flex items-center gap-3 shadow-lg">
                <i class="fa-solid fa-circle text-[#6E6C66] text-xs"></i>
                <h6 class="text-black font-bold text-sm tracking-wide uppercase">Ingoude Company</h6>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-[#F2F2F2] text-black px-6 py-2 rounded-full font-bold text-sm tracking-wider cursor-default shadow-lg">
                    <span>HOME</span>
                </div>
                <div class="border border-white/80 text-white px-6 py-2 rounded-full text-sm font-medium tracking-wider backdrop-blur-sm">
                    <span>MATERIALS</span>
                </div>
                <div class="border border-white/80 text-white px-6 py-2 rounded-full text-sm font-medium tracking-wider backdrop-blur-sm">
                    <span>MORE</span>
                </div>
                <div class="flex flex-col gap-1 ml-2 opacity-80">
                    <i class="fa-solid fa-square text-white text-xs"></i>
                    <i class="fa-solid fa-square text-white/50 text-xs"></i>
                </div>
            </div>
        </div>

        <div class="absolute inset-0 z-30 flex flex-col justify-center items-center text-center px-20 pt-10">
            <h1 class="text-white font-bold text-9xl tracking-tighter leading-none text-glow uppercase" style="font-size: 7.5rem;">
                Construction<br>Materials
            </h1>

            <div class="mt-8 max-w-3xl border-t border-white/20 pt-8">
                <p class="text-[#F2F2F2] text-2xl font-light tracking-wide text-glow">
                    A Comprehensive Guide for Civil Engineering and Architecture
                </p>
            </div>
        </div>

        <div class="absolute right-0 top-1/3 w-16 h-32 bg-[#F2F2F2] z-40 shadow-2xl flex items-center justify-center"></div>
        <div class="absolute left-0 bottom-32 w-24 h-32 bg-[#F2F2F2] z-40 shadow-2xl"></div>

        <div class="absolute bottom-14 left-14 z-50 flex items-center gap-8 pl-4">
            
            <div class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center bg-white/5 backdrop-blur-sm group-hover:bg-white/10 transition-colors">
                    <i class="fa-solid fa-user text-[#F2F2F2] text-sm"></i>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-[10px] text-white/50 uppercase tracking-widest font-bold">Presenter</span>
                    <span class="text-white text-sm font-medium tracking-wide">Simon H.</span>
                </div>
            </div>

            <div class="w-px h-8 bg-white/20"></div>

            <div class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-full border border-white/30 flex items-center justify-center bg-white/5 backdrop-blur-sm group-hover:bg-white/10 transition-colors">
                    <i class="fa-regular fa-calendar text-[#F2F2F2] text-sm"></i>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-[10px] text-white/50 uppercase tracking-widest font-bold">Date</span>
                    <span class="text-white text-sm font-medium tracking-wide">Oct 24, 2025</span>
                </div>
            </div>

        </div>

        <div class="absolute bottom-14 right-14 z-50">
            <div class="border border-white/60 text-white px-8 py-2 rounded-full text-sm font-bold tracking-widest uppercase backdrop-blur-sm hover:bg-white/10 transition-colors">
                <span>Page 1</span>
            </div>
        </div>

        <div class="absolute inset-0 z-20 opacity-10 pointer-events-none" 
             style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 40px 40px;">
        </div>

    </div>

</body>
</html>
