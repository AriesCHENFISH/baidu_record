            text: '#666666'
        };

        // Function to create standard bar chart options
        function createBarOption(data) {
            return {
                grid: {
                    top: '5%',
                    left: '2%',
                    right: '5%',
                    bottom: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    splitLine: { show: false },
                    axisLabel: { show: false },
                    axisLine: { show: false }
                },
                yAxis: {
                    type: 'category',
                    data: ['Conv.', 'Clicks', 'Imp.'],
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: {
                        color: colors.text,
                        fontSize: 10,
                        fontWeight: 500
                    }
                },
                series: [
                    {
                        type: 'bar',
                        data: data,
                        barWidth: 16,
                        itemStyle: {
                            color: colors.primary,
                            borderRadius: [0, 4, 4, 0] // Rounded ends
                        },
                        label: {
                            show: false
                        }
                    }
                ]
            };
        }

        // Initialize Charts
        
        // Campaign A
        // Note: Data is [Conversions, Clicks, Impressions] based on Y-axis order
        // Scaled for visual representation since absolute numbers vary too much
        // Real data: 10k, 120k, 2M. 
        const chartA = echarts.init(document.getElementById('chart_campaign_a'));
        chartA.setOption(createBarOption([
            {value: 10000, itemStyle: {color: colors.tertiary}}, 
            {value: 120000, itemStyle: {color: colors.secondary}}, 
            {value: 2000000, itemStyle: {color: colors.primary}}
        ]));

        // Campaign B

        const chartB = echarts.init(document.getElementById('chart_campaign_b'));
        chartB.setOption(createBarOption([
            {value: 8000, itemStyle: {color: colors.tertiary}}, 
            {value: 100000, itemStyle: {color: colors.secondary}}, 
            {value: 1500000, itemStyle: {color: colors.primary}}
        ]));

        // Campaign C
        // Real data: 7k, 80k, 1.5M
        const chartC = echarts.init(document.getElementById('chart_campaign_c'));
        chartC.setOption(createBarOption([
            {value: 7000, itemStyle: {color: colors.tertiary}}, 
            {value: 80000, itemStyle: {color: colors.secondary}}, 
            {value: 1500000, itemStyle: {color: colors.primary}}
        ]));

        // Ad Spend Donut Chart

                        borderWidth: 2
                    },
                    label: {
                        show: false,
                        position: 'center'
                    },
                    emphasis: {

                            formatter: '{c}'
                        },

                        scaleSize: 5
                    },
                    labelLine: {
                        show: false
                    },
                    data: [

                        { value: 50000, name: 'Campaign B', itemStyle: { color: colors.secondary } },
                        { value: 40000, name: 'Campaign C', itemStyle: { color: colors.tertiary } }
                    ]
                }
            ]
        };
        chartSpend.setOption(optionSpend);

        // Handle Resize
        window.addEventListener('resize', () =&gt; {
            chartA.resize();
            chartB.resize();
            chartC.resize();

   // 自动调整iframe高度
    function resizeIframes() {
        document.querySelectorAll('.responsive-iframe').forEach(iframe => {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const height = Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight,
                    doc.body.offsetHeight,
                    doc.documentElement.offsetHeight,
                    doc.body.clientHeight,
                    doc.documentElement.clientHeight
                );
                iframe.style.height = height + 'px';
            } catch (e) {
                console.log('无法调整iframe高度:', e);
            }
        });
    }
    
    // 初始调整
    window.addEventListener('load', resizeIframes);
    
    // 内容加载后调整
    document.querySelectorAll('.responsive-iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            resizeIframes();
            // 对动态内容进行定期检查
            setInterval(resizeIframes, 1000);
        });
    });
