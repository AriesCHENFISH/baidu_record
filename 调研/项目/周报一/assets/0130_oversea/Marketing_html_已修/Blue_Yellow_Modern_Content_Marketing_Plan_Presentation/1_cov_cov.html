<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Marketing Plan - Slide</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror as requested) -->
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">

    <style>
        /* 
         * CSS Reset & Global Styles
         * -------------------------
         * Resetting margins, padding, and box-sizing for consistency.
         */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Enforcing Font Family */
        body {
            font-family: 'Noto Sans SC', sans-serif;
            /* No styling on body tag strictly, layout handled in .page_container */
        }

        /* 
         * Page Container Configuration
         * ----------------------------
         * Fixed dimensions: 1280x720px
         * Centered layout
         * Relative positioning for absolute children
         */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF; /* Base Background */
            overflow: hidden; /* Ensure no spillover */
        }

        /* 
         * Typography & Utility Overrides
         * ------------------------------
         */
        .text-primary { color: #0A33B3; }
        .bg-primary { background-color: #0A33B3; }
        .text-accent { color: #FCEE7D; }
        .bg-accent { background-color: #FCEE7D; }
        
        /* Custom Gradient for Decoration */
        .decoration-gradient {
            background: linear-gradient(135deg, #F0F4FF 0%, #FFFFFF 100%);
        }

        /* Decorative dots logic to mimic the original "Plan" styling but cleaner */
        .title-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #FCEE7D;
            border-radius: 50%;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div class="page_container">
        
        <!-- 
            Background Decoration Layer 
            ---------------------------
            Using a soft shape to create depth without overwhelming the content.
        -->
        <div class="absolute top-0 left-0 w-full h-full decoration-gradient z-0"></div>
        
        <!-- Organic Shape Background Element (Abstract Blue) -->
        <div class="absolute top-[-100px] left-[-100px] w-[600px] h-[600px] rounded-full bg-[#F0F4FF] z-0 opacity-50 blur-3xl"></div>

        <!-- 
            Layout Grid
            -----------
            Using Grid to split the content (Left: Text, Right: Image).
            This creates a cleaner, more editorial look than the original full-overlay.
        -->
        <div class="relative z-10 grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Content & Typography (Col-span 7) -->
            <div class="col-span-6 flex flex-col justify-between pl-16 py-12 pr-8">
                
                <!-- Logo Section -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#0A33B3] rounded-lg flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </div>
                    <!-- Brand Name -->
                    <h2 class="text-[#0A33B3] font-bold text-xl tracking-wide uppercase">Borcelle</h2>
                </div>

                <!-- Main Title Area -->
                <div class="flex flex-col gap-2 mt-4">
                    <!-- Decorative Line -->
                    <div class="w-16 h-1.5 bg-[#FCEE7D] mb-4 rounded-full"></div>
                    
                    <!-- Headline H1 -->
                    <h1 class="text-[#0A33B3] text-[5.5rem] font-bold leading-[0.9] tracking-tight">
                        Content<br>
                        Marketing<br>
                        Plan
                        <!-- Yellow Accent Dots mimicking the reference style -->
                        <span class="text-[#FCEE7D] text-6xl align-top">.</span>
                    </h1>

                    <!-- Subtitle / Slogan -->
                    <div class="mt-8">
                        <p class="text-[#2248C3] text-xl font-medium leading-relaxed max-w-md">
                            Driving Engagement, Building Trust, and Growing Business through strategic storytelling.
                        </p>
                    </div>
                </div>

                <!-- Footer Info Pills (Presenter & Date) -->
                <div class="flex gap-4 mt-4">
                    <!-- Presenter Pill -->
                    <div class="bg-[#FCEE7D] px-6 py-3 rounded-full shadow-sm flex items-center gap-3">
                        <i class="fa-regular fa-user text-[#0A33B3]"></i>
                        <span class="text-[#0A33B3] font-bold text-lg">Samira Hadid</span>
                    </div>

                    <!-- Date Pill -->
                    <div class="bg-[#0A33B3] px-6 py-3 rounded-full shadow-sm flex items-center gap-3">
                        <i class="fa-regular fa-calendar text-white"></i>
                        <span class="text-white font-bold text-lg">20 July 2027</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Visual Imagery (Col-span 5) -->
            <div class="col-span-6 h-full relative flex items-center justify-end pr-8">
                
                <!-- 
                    Image Container 
                    ---------------
                    Styling: Large rounded rectangle with heavy shadow to pop off the page.
                    This replaces the background overlay method for a cleaner "Modern Card" aesthetic.
                -->
                <div class="relative w-full h-[85%] rounded-[40px] overflow-hidden shadow-2xl border-4 border-white">
                    <!-- 
                       Placeholder Image from Unsplash 
                       Keywords: Business, Strategy, Planning, Technology
                    -->
                    <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=2940&auto=format&fit=crop" 
                         alt="Content Marketing Planning Workspace" 
                         class="w-full h-full object-cover">
                    <!-- 600*612 -->

                    <!-- Subtle Gradient Overlay on Image for depth -->
                    <div class="absolute inset-0" style="background: linear-gradient(to bottom, rgba(10, 51, 179, 0.1), rgba(10, 51, 179, 0.4));"></div>

                    <!-- Floating Decorative Element (Glassmorphism) -->
                    <div class="absolute bottom-8 right-8 bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-lg w-48">
                        <div class="flex items-center gap-3 mb-2">
                             <i class="fa-solid fa-chart-line text-[#0A33B3] text-xl"></i>
                             <span class="text-[#0A33B3] font-bold text-sm">Growth Target</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div class="bg-[#0A33B3] h-2.5 rounded-full" style="width: 75%"></div>
                        </div>
                        <p class="text-xs text-gray-500 mt-2 text-right font-medium">+124% Engagement</p>
                    </div>
                </div>

                <!-- Abstract Decor: Yellow Circle behind the image -->
                <div class="absolute bottom-16 left-[-40px] w-24 h-24 bg-[#FCEE7D] rounded-full -z-10"></div>
                
                <!-- Abstract Decor: Blue Dashed Pattern -->
                 <div class="absolute top-20 right-4 text-[#0A33B3] opacity-20 -z-10 text-6xl">
                    <i class="fa-solid fa-quote-right"></i>
                 </div>
            </div>
        </div>
    </div>

</body>
</html>
