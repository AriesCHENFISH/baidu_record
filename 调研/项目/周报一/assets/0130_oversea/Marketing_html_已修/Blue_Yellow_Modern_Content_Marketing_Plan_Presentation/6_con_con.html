<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Content Strategy - Borcelle</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts via Baidu CDN (Required) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Utility for specific text rendering */
        .tracking-wide { letter-spacing: 0.025em; }
        
        /* Font Awesome Icon sizing tweaks */
        .icon-lg { font-size: 3rem; }
    </style>
    
    <!-- Tailwind Configuration for Design System Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A33B3',    // Deep Blue
                        secondary: '#2248C3',  // Lighter Blue
                        accent: '#FCEE7D',     // Yellow
                        decorative: '#F0F4FF', // Pale Blue/White
                        neutral: '#FFFFFF',
                        textDark: '#0A33B3',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Page Container -->
    <div id="page_container" class="w-[1280px] h-[720px] bg-white relative overflow-hidden shadow-none mx-auto">
        
        <!-- Decorative Background Elements (Stars) -->
        <!-- Top Right Star -->
        <div class="absolute top-8 right-8 text-primary opacity-80 text-4xl">
            <i class="fa-solid fa-star-of-life"></i>
        </div>
        <!-- Bottom Left Star -->
        <div class="absolute bottom-8 left-8 text-primary opacity-80 text-3xl">
            <i class="fa-solid fa-star-of-life"></i>
        </div>
        
        <!-- Main Layout Grid -->
        <div class="grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Visual Image (42% width) -->
            <div class="col-span-5 h-full p-12 flex items-center justify-center relative">
                <!-- Image Container with soft shadow and rounded corners -->
                <div class="w-full h-[90%] bg-decorative rounded-[40px] overflow-hidden shadow-2xl relative z-10 border-4 border-white">
                    <img src="https://images.unsplash.com/photo-1573496359-e36b6edf0df1?q=80&w=1280&auto=format&fit=crop" 
                         alt="Business professionals discussing strategy" 
                         class="w-full h-full object-cover">
                    <!-- 460*580 -->
                </div>
                
                <!-- Decorative Graphic Element behind image (Bottom Right) -->
                <div class="absolute bottom-16 right-8 w-24 h-24 bg-accent rounded-full -z-0 opacity-50 blur-xl"></div>
            </div>

            <!-- Right Column: Content (58% width) -->
            <div class="col-span-7 h-full pr-16 pl-4 py-12 flex flex-col justify-between">
                
                <!-- Header Section -->
                <div class="flex items-center justify-between mb-2 border-b-2 border-gray-100 pb-4">
                    <!-- Logo Area -->
                    <div class="flex items-center gap-3">
                        <div class="text-primary text-2xl">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <span class="text-textDark text-xl font-bold tracking-wide">Borcelle</span>
                    </div>

                    <!-- Title -->
                    <h1 class="text-5xl font-extrabold text-primary tracking-tight drop-shadow-sm">
                        Content Strategy
                    </h1>
                </div>

                <!-- Content Body: List of Strategies -->
                <div class="flex flex-col gap-6 justify-center flex-grow py-4">
                    
                    <!-- Card 1: Content Types -->
                    <div class="bg-primary rounded-[30px] p-6 shadow-lg flex items-center justify-between group transform transition-transform">
                        <div class="flex flex-col gap-2 w-3/4">
                            <!-- Label Pill -->
                            <div>
                                <h2 class="inline-block bg-accent text-primary px-6 py-1.5 rounded-full text-lg font-bold shadow-sm">
                                    Content Types:
                                </h2>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg font-light leading-relaxed pl-1 opacity-95">
                                Blog articles, video tutorials, infographics, podcasts, and email newsletters.
                            </p>
                        </div>
                        <!-- Icon Area -->
                        <div class="w-1/4 flex justify-end pr-4 text-white opacity-90">
                            <i class="fa-regular fa-pen-to-square icon-lg"></i>
                        </div>
                    </div>

                    <!-- Card 2: Tone & Style -->
                    <div class="bg-primary rounded-[30px] p-6 shadow-lg flex items-center justify-between group">
                        <div class="flex flex-col gap-2 w-3/4">
                            <!-- Label Pill -->
                            <div>
                                <h2 class="inline-block bg-accent text-primary px-6 py-1.5 rounded-full text-lg font-bold shadow-sm">
                                    Tone & Style:
                                </h2>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg font-light leading-relaxed pl-1 opacity-95">
                                Educational, inspirational, solution-oriented.
                            </p>
                        </div>
                        <!-- Icon Area -->
                        <div class="w-1/4 flex justify-end pr-4 text-white opacity-90">
                            <i class="fa-solid fa-head-side-virus icon-lg"></i>
                        </div>
                    </div>

                    <!-- Card 3: Content Pillars -->
                    <div class="bg-primary rounded-[30px] p-6 shadow-lg flex items-center justify-between group">
                        <div class="flex flex-col gap-2 w-3/4">
                            <!-- Label Pill -->
                            <div>
                                <h2 class="inline-block bg-accent text-primary px-6 py-1.5 rounded-full text-lg font-bold shadow-sm">
                                    Content Pillars:
                                </h2>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg font-light leading-relaxed pl-1 opacity-95">
                                Education, brand storytelling, customer testimonials.
                            </p>
                        </div>
                        <!-- Icon Area -->
                        <div class="w-1/4 flex justify-end pr-4 text-white opacity-90">
                            <i class="fa-regular fa-window-maximize icon-lg"></i>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
