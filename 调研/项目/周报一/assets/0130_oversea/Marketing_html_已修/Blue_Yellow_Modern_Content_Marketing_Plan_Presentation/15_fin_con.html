<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Slide - High End Redesign</title>
    <!-- Google Fonts: Noto Sans SC for compatibility and Inter for modern look -->
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Specs */
        .page-container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            box-shadow: none; /* Forbidden by rules */
            margin: 0 auto;
        }

        /* Gradient Utility based on rules */
        .bg-gradient-primary {
            background: linear-gradient(135deg, #0A33B3, #2248C3);
        }
        
        .bg-gradient-yellow {
             background: linear-gradient(90deg, #FCEE7D, #F0E050);
        }

        /* Text Utilities */
        .text-primary { color: #0A33B3; }
        .text-accent { color: #FCEE7D; }
        .text-secondary { color: #2248C3; }
        
        /* Decorative Elements */
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            background-color: #F0F4FF;
            z-index: 0;
        }

    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- Decorative Background Elements -->
        <!-- Large soft circle to ground the content area -->
        <div class="decorative-circle" style="width: 600px; height: 600px; top: -100px; right: -100px;"></div>
        
        <!-- Left Section: Visual Imagery (40% width) -->
        <div class="absolute left-0 top-0 h-full w-[45%] overflow-hidden">
            <!-- Image Container -->
            <div class="relative w-full h-full">
                <!-- Main Visual: Workspace/Laptop to match context -->
                <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=2015&auto=format&fit=crop" 
                     alt="Business Analytics Workspace" 
                     class="w-full h-full object-cover">
                <!-- 576*720 -->

                <!-- Gradient Overlay for Brand Consistency & Text Readability if needed -->
                <div class="absolute inset-0 bg-gradient-primary opacity-80 mix-blend-multiply"></div>
                
                <!-- Decorative Pattern on top of image -->
                <div class="absolute inset-0 opacity-10" 
                     style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 20px 20px;">
                </div>
            </div>
        </div>

        <!-- Right Section: Content (55% width) -->
        <div class="absolute right-0 top-0 h-full w-[55%] flex flex-col justify-between p-16 z-10">
            
            <!-- Header: Logo Area -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#0A33B3] rounded-lg flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-layer-group text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight text-[#0A33B3]">
                    Borcelle
                </h2>
            </div>

            <!-- Main Content: Heading & Quote -->
            <div class="flex flex-col gap-6 mt-8">
                <!-- Decorative Sparkle Icon -->
                <div class="text-[#FCEE7D] text-4xl mb-[-20px] ml-[-10px]">
                    <i class="fa-solid fa-star-of-life fa-spin-pulse" style="animation-duration: 3s;"></i>
                </div>

                <!-- Headline: Corrected typo "Tank You" to "Thank You" for professional standard -->
                <h1 class="text-8xl font-black text-[#0A33B3] tracking-tight leading-none drop-shadow-sm">
                    Thank You<span class="text-[#FCEE7D]">.</span>
                </h1>

                <!-- Quote / Subhead -->
                <div class="relative pl-6 border-l-4 border-[#FCEE7D]">
                    <p class="text-2xl text-gray-600 font-serif italic leading-relaxed">
                        “Let’s create content that converts.”
                    </p>
                </div>
            </div>

            <!-- Footer: Contact Grid -->
            <!-- Restructured from vertical list to a grid for better space utilization -->
            <div class="grid grid-cols-2 gap-x-8 gap-y-6 mt-8">
                
                <!-- Phone -->
                <div class="flex items-center gap-4 group">
                    <div class="w-12 h-12 rounded-full bg-[#F0F4FF] flex items-center justify-center text-[#0A33B3] group-hover:bg-[#0A33B3] group-hover:text-[#FCEE7D] transition-colors duration-300">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Phone</span>
                        <p class="text-lg font-bold text-gray-800">+123-456-7890</p>
                    </div>
                </div>

                <!-- Website -->
                <div class="flex items-center gap-4 group">
                    <div class="w-12 h-12 rounded-full bg-[#F0F4FF] flex items-center justify-center text-[#0A33B3] group-hover:bg-[#0A33B3] group-hover:text-[#FCEE7D] transition-colors duration-300">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Website</span>
                        <p class="text-lg font-bold text-gray-800">www.reallygreatsite.com</p>
                    </div>
                </div>

                <!-- Email -->
                <div class="flex items-center gap-4 group">
                    <div class="w-12 h-12 rounded-full bg-[#F0F4FF] flex items-center justify-center text-[#0A33B3] group-hover:bg-[#0A33B3] group-hover:text-[#FCEE7D] transition-colors duration-300">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Email</span>
                        <p class="text-lg font-bold text-gray-800">hello@reallygreatsite.com</p>
                    </div>
                </div>

                <!-- Address -->
                <div class="flex items-center gap-4 group">
                    <div class="w-12 h-12 rounded-full bg-[#F0F4FF] flex items-center justify-center text-[#0A33B3] group-hover:bg-[#0A33B3] group-hover:text-[#FCEE7D] transition-colors duration-300">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Location</span>
                        <p class="text-lg font-bold text-gray-800">123 Anywhere St., Any City</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Floating Decorative Element (Bottom Right) -->
        <div class="absolute bottom-0 right-0 w-32 h-32 bg-[#FCEE7D] rounded-tl-full opacity-20"></div>

    </div>

</body>
</html>
