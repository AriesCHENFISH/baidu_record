<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Strategy Presentation</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (via Baidu CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A33B3',      // Deep Blue
                        secondary: '#2248C3',    // Lighter Blue
                        accent: '#FCEE7D',       // Yellow
                        neutral: '#FFFFFF',      // White
                        decorative: '#F0F4FF',   // Pale Blue
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }



        /* Custom Utilities */
        .clip-superellipse {
            border-radius: 40px; /* Soft modern radius */
        }
        
        /* FontAwesome Icon thickness adjustment */
        .fa-light {
            font-weight: 300;
        }
    </style>
</head>
<body>

    <!-- Page Container: Fixed 1280x720 -->
    <div id="page_container" class="relative w-[1280px] h-[720px] mx-auto bg-neutral overflow-hidden">
        
        <!-- Decorative Elements (Stars) -->
        <!-- Top Right Star -->
        <div class="absolute top-10 right-10 text-primary opacity-90 text-4xl z-10">
            <i class="fa-solid fa-star"></i>
        </div>
        <!-- Bottom Left Star (Near Image) -->
        <div class="absolute bottom-12 left-12 text-primary opacity-90 text-4xl z-10">
            <i class="fa-solid fa-star"></i>
        </div>

        <!-- Main Grid Layout: 12 Columns -->
        <div class="grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Visual/Image Area (5/12) -->
            <div class="col-span-5 h-full flex items-center justify-center pl-16 pr-4 relative">
                <!-- Image Container with soft shadow and rounded corners -->
                <div class="relative w-full h-[80%] rounded-[40px] overflow-hidden shadow-lg border-4 border-white z-20">
                    <img 
                        src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1280&auto=format&fit=crop" 
                        alt="Business women collaborating on strategy" 
                        class="w-full h-full object-cover"
                    >
                    <!-- 430*580 -->
                </div>
                
                <!-- Decorative Graphic behind image (Abstract shape) -->
                <div class="absolute bottom-16 left-10 w-24 h-24 bg-accent rounded-full -z-10 opacity-50 blur-xl"></div>
            </div>

            <!-- Right Column: Content Area (7/12) -->
            <div class="col-span-7 h-full flex flex-col justify-center px-12 pr-20 py-10">
                
                <!-- Header Section -->
                <div class="flex items-end justify-between mb-10 border-b-2 border-decorative pb-4">
                    <!-- Brand/Logo Area -->
                    <div class="flex items-center gap-3">
                        <div class="text-primary text-2xl">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <h2 class="text-xl font-bold text-primary tracking-wide">Borcelle</h2>
                    </div>
                    
                    <!-- Slide Title -->
                    <h1 class="text-5xl font-extrabold text-primary tracking-tight">
                        Content Strategy
                    </h1>
                </div>

                <!-- Content Blocks Container -->
                <div class="flex flex-col gap-6 w-full">

                    <!-- Block 1: Content Types -->
                    <div class="bg-primary rounded-[30px] p-6 flex items-center justify-between shadow-md relative overflow-hidden group">
                        <!-- Left Content -->
                        <div class="flex flex-col gap-2 max-w-[80%] z-10">
                            <!-- Label Pill -->
                            <div class="self-start bg-accent text-primary px-5 py-1.5 rounded-full shadow-sm">
                                <h3 class="text-base font-extrabold tracking-wide uppercase">Content Types:</h3>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg leading-snug font-light opacity-95 pl-1">
                                Blog articles, video tutorials, infographics, podcasts, and email newsletters.
                            </p>
                        </div>
                        <!-- Right Icon -->
                        <div class="text-white text-5xl opacity-90 pr-4 z-10">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </div>
                        <!-- Subtle Background Decoration -->
                        <div class="absolute right-[-20px] top-[-20px] w-32 h-32 bg-secondary rounded-full opacity-30"></div>
                    </div>

                    <!-- Block 2: Tone & Style -->
                    <div class="bg-primary rounded-[30px] p-6 flex items-center justify-between shadow-md relative overflow-hidden group">
                        <!-- Left Content -->
                        <div class="flex flex-col gap-2 max-w-[80%] z-10">
                            <!-- Label Pill -->
                            <div class="self-start bg-accent text-primary px-5 py-1.5 rounded-full shadow-sm">
                                <h3 class="text-base font-extrabold tracking-wide uppercase">Tone & Style:</h3>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg leading-snug font-light opacity-95 pl-1">
                                Educational, inspirational, solution-oriented.
                            </p>
                        </div>
                        <!-- Right Icon -->
                        <div class="text-white text-5xl opacity-90 pr-4 z-10">
                            <i class="fa-solid fa-lightbulb"></i>
                        </div>
                         <!-- Subtle Background Decoration -->
                         <div class="absolute right-[-20px] top-[-20px] w-32 h-32 bg-secondary rounded-full opacity-30"></div>
                    </div>

                    <!-- Block 3: Content Pillars -->
                    <div class="bg-primary rounded-[30px] p-6 flex items-center justify-between shadow-md relative overflow-hidden group">
                        <!-- Left Content -->
                        <div class="flex flex-col gap-2 max-w-[80%] z-10">
                            <!-- Label Pill -->
                            <div class="self-start bg-accent text-primary px-5 py-1.5 rounded-full shadow-sm">
                                <h3 class="text-base font-extrabold tracking-wide uppercase">Content Pillars:</h3>
                            </div>
                            <!-- Description Text -->
                            <p class="text-white text-lg leading-snug font-light opacity-95 pl-1">
                                Education, brand storytelling, customer testimonials.
                            </p>
                        </div>
                        <!-- Right Icon -->
                        <div class="text-white text-5xl opacity-90 pr-4 z-10">
                            <i class="fa-solid fa-table-columns"></i>
                        </div>
                         <!-- Subtle Background Decoration -->
                         <div class="absolute right-[-20px] top-[-20px] w-32 h-32 bg-secondary rounded-full opacity-30"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
