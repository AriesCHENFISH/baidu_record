<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Goals & Objectives</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Fixed container constraint */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #FFFFFF;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Custom Bullet Styling */
        .custom-bullet {
            width: 24px;
            height: 24px;
            background-color: #FCEE7D; /* Accent Color */
            border-radius: 6px;
            flex-shrink: 0;
        }

        /* Decorative Star Shape */
        .star-shape {
            color: #0A33B3;
            font-size: 2rem;
            position: absolute;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="star-shape" style="top: 20px; right: 280px;">
            <i class="fa-solid fa-star-of-life"></i>
        </div>
        <div class="star-shape" style="bottom: 20px; left: 20px;">
            <i class="fa-solid fa-star-of-life"></i>
        </div>

        <div class="grid grid-cols-12 gap-8 h-full p-10">
            
            <div class="col-span-9 bg-[#0A33B3] rounded-[48px] p-10 flex flex-col justify-between relative shadow-sm">
                
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-[#FCEE7D] rounded-lg flex items-center justify-center text-[#0A33B3]">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </div>
                    <h2 class="text-white text-2xl font-bold tracking-wide">Borcelle</h2>
                </div>

                <div class="flex gap-10 flex-1 items-center pb-24">
                    
                    <div class="w-5/12 h-[420px] bg-white/10 p-2 rounded-[32px] relative overflow-hidden flex-shrink-0">
                        <div class="w-full h-full rounded-[24px] overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1544531320-98514ea28924?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                                 alt="Man presenting business goals" 
                                 class="w-full h-full object-cover">
                        </div>
                    </div>

                    <div class="w-7/12 flex flex-col gap-6">
                        
                        <div>
                            <h1 class="text-white text-6xl font-bold leading-tight">
                                Business Goals <br />
                                <span class="text-[#FCEE7D]">& Objectives</span>
                            </h1>
                        </div>

                        <div class="mt-2">
                            <div class="bg-[#FCEE7D] w-fit px-8 py-2 rounded-full mb-6">
                                <h3 class="text-[#0A33B3] text-lg font-bold uppercase tracking-wider">Main Goals</h3>
                            </div>

                            <ul class="space-y-5">
                                <li class="flex items-center gap-4">
                                    <div class="custom-bullet"></div>
                                    <p class="text-white text-xl font-medium">Increase brand awareness.</p>
                                </li>
                                <li class="flex items-center gap-4">
                                    <div class="custom-bullet"></div>
                                    <p class="text-white text-xl font-medium">Generate high-quality leads.</p>
                                </li>
                                <li class="flex items-center gap-4">
                                    <div class="custom-bullet"></div>
                                    <p class="text-white text-xl font-medium">Boost customer engagement.</p>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-3 flex flex-col items-center pt-8 h-full">
                
                <div class="w-full aspect-[4/5] rounded-[48px] overflow-hidden mb-6 shadow-sm border border-gray-100">
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" 
                         alt="Woman working on laptop" 
                         class="w-full h-full object-cover">
                </div>

                <div class="bg-[#0A33B3] w-full py-3 rounded-full text-center mb-10 shadow-md">
                    <h3 class="text-white text-lg font-bold uppercase tracking-wider">SMART Objectives</h3>
                </div>

                <div class="flex flex-col gap-5 text-center w-full">
                    <div class="bg-[#F0F4FF] py-2 rounded-lg">
                        <p class="text-[#0A33B3] text-2xl font-bold">Specific</p>
                    </div>
                    <div>
                        <p class="text-[#2248C3] text-xl font-medium">Measurable</p>
                    </div>
                    <div class="bg-[#F0F4FF] py-2 rounded-lg">
                        <p class="text-[#0A33B3] text-2xl font-bold">Achievable</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
