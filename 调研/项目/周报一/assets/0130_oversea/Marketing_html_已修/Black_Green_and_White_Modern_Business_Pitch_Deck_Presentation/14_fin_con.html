<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Modern Keynote</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- Google Fonts via Baidu CDN -->
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 
         * Layout Constraint: 
         * We strictly avoid setting styles on the body tag directly as per instructions.
         * The main styles are applied to the .page-container class.
         */
        
        /* Utility for absolute centering if needed */
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom Blur for Glow Effect */
        .glow-effect {
            filter: blur(80px);
        }
    </style>
</head>
<body>

    <!-- 
      Page Container 
      Dimensions: 1280x720px Fixed
      Background: #E5E5E5 (Main Background Color)
      Font: Noto Sans SC
    -->
    <div id="page_container" class="relative w-[1280px] h-[720px] mx-auto bg-[#E5E5E5] overflow-hidden font-['Noto_Sans_SC'] text-[#000000]">

        <!-- ============================================ -->
        <!-- BACKGROUND ATMOSPHERE (Glows)                -->
        <!-- ============================================ -->
        
        <!-- Top Left Glow - Using Gradient Glow Color #D6E8C7 -->
        <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] bg-[#D6E8C7] rounded-full glow-effect opacity-60 z-0"></div>
        
        <!-- Bottom Right Glow - Subtle ambient light -->
        <div class="absolute bottom-[-100px] right-[-100px] w-[600px] h-[600px] bg-[#D6E8C7] rounded-full glow-effect opacity-40 z-0"></div>

        <!-- ============================================ -->
        <!-- GEOMETRIC ART COMPOSITION (Left Side)        -->
        <!-- Recreating the circle motif from the original-->
        <!-- ============================================ -->
        
        <!-- Decorative Circle 1: Stroke Outline (Top/Middle Left) -->
        <div class="absolute top-[50px] left-[150px] w-[280px] h-[280px] rounded-full border-[2px] border-[#666666] opacity-30 z-10"></div>
        
        <!-- Decorative Circle 2: Visual Accent Color #6FE6AA (Mint Green) -->
        <!-- This represents the green circle in the original design -->
        <div class="absolute top-[180px] left-[260px] w-[260px] h-[260px] rounded-full bg-[#6FE6AA] shadow-xl z-20"></div>

        <!-- Decorative Circle 3: Stroke Outline (Behind White) -->
        <div class="absolute top-[320px] left-[80px] w-[240px] h-[240px] rounded-full border-[2px] border-[#666666] opacity-30 z-10"></div>

        <!-- Decorative Circle 4: White Accent (Bottom Left) -->
        <!-- High contrast element replacing the white circle in original -->
        <div class="absolute bottom-[80px] left-[-40px] w-[320px] h-[320px] rounded-full bg-white shadow-2xl z-30 flex items-center justify-center">
            <!-- Subtle internal decoration -->
            <div class="w-[20px] h-[20px] rounded-full bg-[#E5E5E5]"></div>
        </div>

        <!-- Decorative Circle 5: Top Left "Sun" element (Pale Yellow/Green from Palette) -->
        <!-- Using a lighter tint of the accent to simulate the yellow circle -->
        <div class="absolute top-[-40px] left-[-40px] w-[220px] h-[220px] rounded-full bg-[#D6E8C7] z-20 opacity-90"></div>

        <!-- ============================================ -->
        <!-- MAIN CONTENT (Typography)                    -->
        <!-- ============================================ -->

        <div class="absolute top-[220px] right-[100px] z-40 text-right">
            <!-- Main Title: Huge, Modern, Bold -->
            <!-- Primary Text Color #000000 -->
            <h1 class="text-[140px] leading-[0.85] font-bold tracking-tight text-[#000000]">
                Thank<br>
                <span class="text-[#333333]">You</span>
            </h1>
            
            <!-- Subtitle / Slogan -->
            <!-- Secondary Text Color #333333 -->
            <div class="mt-8 flex justify-end">
                <div class="h-[2px] w-[60px] bg-[#6FE6AA] mt-3 mr-4"></div>
                <p class="text-[24px] text-[#333333] font-light tracking-wide max-w-[400px]">
                    Let’s Create Something<br>
                    <span class="font-normal text-[#000000]">Amazing Together</span>
                </p>
            </div>
        </div>

        <!-- ============================================ -->
        <!-- FOOTER (Contact Info & Logo)                 -->
        <!-- ============================================ -->

        <div class="absolute bottom-[50px] w-full px-[60px] flex items-end justify-between z-50">
            
            <!-- Left: Logo Area -->
            <div class="flex items-center gap-3 mb-2">
                <!-- Abstract Logo Icon -->
                <div class="w-10 h-10 bg-[#000000] rounded-lg flex items-center justify-center text-[#6FE6AA]">
                    <i class="fa-solid fa-shapes text-xl"></i>
                </div>
                <!-- Logo Text -->
                <h2 class="text-2xl font-bold tracking-tight text-[#000000]">Fauget</h2>
            </div>

            <!-- Right: Contact Pill Bar -->
            <!-- Using Graphic Stroke Color #666666 for border -->
            <!-- Using White background for cleanliness -->
            <div class="h-[60px] border border-[#666666] rounded-full bg-white/80 backdrop-blur-sm px-8 flex items-center gap-10 shadow-sm">
                
                <!-- Phone -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#E5E5E5] flex items-center justify-center text-[#000000]">
                        <i class="fa-solid fa-phone text-xs"></i>
                    </div>
                    <p class="text-sm font-medium text-[#333333]">+123-456-7890</p>
                </div>

                <!-- Separator Line -->
                <div class="w-[1px] h-[20px] bg-[#666666] opacity-30"></div>

                <!-- Website -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#E5E5E5] flex items-center justify-center text-[#000000]">
                        <i class="fa-solid fa-globe text-xs"></i>
                    </div>
                    <p class="text-sm font-medium text-[#333333]">www.reallygreatsite.com</p>
                </div>

                <!-- Separator Line -->
                <div class="w-[1px] h-[20px] bg-[#666666] opacity-30"></div>

                <!-- Email -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-[#6FE6AA] flex items-center justify-center text-[#000000]">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </div>
                    <p class="text-sm font-medium text-[#333333]">hello@reallygreatsite.com</p>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
