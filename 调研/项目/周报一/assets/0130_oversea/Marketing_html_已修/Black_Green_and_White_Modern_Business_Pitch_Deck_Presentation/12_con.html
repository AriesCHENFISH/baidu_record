<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Results - Keynote Slide</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        .page_container {
            width: 1280px;
            height: 720px;
            background-color: #E5E5E5; /* Main Background Color */
            position: relative;
            overflow: hidden;
            box-shadow: none;
            margin: 0 auto;
        }

        /* Typography Utilities */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            color: #000000;
            line-height: 1.2;
        }

        p {
            color: #333333;
            line-height: 1.6;
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#333333',
                        bgMain: '#E5E5E5',
                        accent: '#6FE6AA',
                        stroke: '#666666',
                        glow: '#D6E8C7'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div class="page_container">
        
        <div class="absolute top-[-150px] left-[-150px] w-[600px] h-[600px] rounded-full opacity-60 pointer-events-none"
             style="background: radial-gradient(circle, #D6E8C7 0%, rgba(229, 229, 229, 0) 70%);">
        </div>

        <div class="absolute bottom-[-200px] right-[-100px] w-[700px] h-[700px] rounded-full opacity-50 pointer-events-none"
             style="background: radial-gradient(circle, #D6E8C7 0%, rgba(229, 229, 229, 0) 70%);">
        </div>

        <div class="relative w-full h-full flex flex-col px-20 py-16 justify-between z-10">

            <div class="w-full flex justify-between items-center mb-10 pl-2 pr-2">
                <ul class="flex w-full justify-between items-center list-none m-0 p-0 gap-6">
                    <li class="w-24 h-24 rounded-full border-[2px] border-stroke flex items-center justify-center opacity-40"></li>
                    <li class="w-24 h-24 rounded-full border-[2px] border-stroke flex items-center justify-center opacity-40"></li>
                     <li class="w-24 h-24 rounded-full bg-accent shadow-lg shadow-accent/20 flex items-center justify-center scale-110 transition-transform">
                         <i class="fa-solid fa-check text-primary text-2xl opacity-50"></i>
                    </li>
                    <li class="w-24 h-24 rounded-full border-[2px] border-stroke flex items-center justify-center opacity-40"></li>
                    <li class="w-24 h-24 rounded-full border-[2px] border-stroke flex items-center justify-center opacity-40"></li>
                    <li class="w-24 h-24 rounded-full border-[2px] border-stroke flex items-center justify-center opacity-40"></li>
                </ul>
            </div>

            <div class="flex flex-col w-full h-full justify-start">
                
                <div class="w-full flex flex-col mb-12">
                     <div class="w-16 h-1 bg-primary mb-6"></div>
                     <h1 class="text-7xl font-bold tracking-tight mb-4 leading-[0.9]">
                        Key <span class="font-light">Results</span>
                    </h1>
                    <p class="text-secondary text-lg font-light w-2/3">
                        Measuring success through tangible metrics. Here is a snapshot of the performance improvements achieved in the latest quarter.
                    </p>
                </div>

                <div class="flex flex-row w-full h-full gap-12 items-stretch pb-8">
                    
                    <div class="w-1/2 flex flex-row justify-between items-center">
                        <div class="flex flex-col justify-center">
                            <span class="text-8xl font-bold text-accent leading-none mb-2">85%</span>
                            <span class="text-xl text-primary font-medium">Efficiency Boost</span>
                            <span class="text-sm text-secondary opacity-70">Year over year</span>
                        </div>
                        
                        <div class="h-32 w-[1px] bg-stroke/30"></div>

                        <div class="flex flex-col justify-center">
                            <span class="text-8xl font-bold text-accent leading-none mb-2">3x</span>
                            <span class="text-xl text-primary font-medium">Faster Delivery</span>
                            <span class="text-sm text-secondary opacity-70">In deployment cycles</span>
                        </div>
                    </div>

                     <div class="w-1/2 h-full bg-white/50 rounded-3xl border-[3px] border-accent/50 flex items-center justify-center relative overflow-hidden shadow-sm">
                        <div class="absolute inset-0 bg-accent/10 blur-xl pointer-events-none"></div>
                        
                        <div class="text-center z-10 opacity-40 flex flex-col items-center">
                            <i class="fa-solid fa-chart-pie text-7xl text-primary mb-4"></i>
                            <span class="text-2xl font-light uppercase tracking-widest">Performance Visualization</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
