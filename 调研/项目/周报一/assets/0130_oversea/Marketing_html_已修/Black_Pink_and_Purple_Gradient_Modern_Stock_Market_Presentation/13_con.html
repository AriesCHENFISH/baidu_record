<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #0F1115; position: relative; margin: 0 auto; overflow: hidden; }
        .brand-gradient { background: linear-gradient(90deg, #E56B6F 0%, #9D4EDD 100%); }
        .brand-gradient-text { background: linear-gradient(90deg, #E56B6F 0%, #9D4EDD 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bg-texture { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1611974765270-ca1258634369?q=80&w=1280&auto=format&fit=crop'); background-size: cover; background-position: center; opacity: 0.08; mix-blend-mode: overlay; z-index: 1; }
        .content-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; padding: 40px 60px; }
        
        .decor-dots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; position: absolute; top: 200px; right: 40px; z-index: 5; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: #E56B6F; opacity: 0.6; }
        .brand-gradient-bg { background: linear-gradient(90deg, #E56B6F 0%, #9D4EDD 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .nav-link { text-decoration: none; color: rgba(255, 255, 255, 0.7); font-size: 13px; font-weight: 500; letter-spacing: 0.5px; transition: all 0.3s ease; position: relative; display: block; }
        .nav-link:hover, .nav-link.active { color: #FFFFFF; }
        .nav-link.active::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background-color: #E56B6F; border-radius: 50%; box-shadow: 0 0 8px #E56B6F; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.8); transition: all 0.3s ease; cursor: pointer; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #FFFFFF; }

        /* Page Specific */
        .dashboard-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        
        /* Simulated Chart Bars */
        .chart-bar-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 100%;
            padding-bottom: 20px;
            gap: 12px;
        }
        .chart-bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            opacity: 0.8;
            transition: height 1s ease;
            position: relative;
        }
        .chart-bar:hover { opacity: 1; }
        
        /* Progress Bars */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-texture"></div>
        <div class="decor-dots">
            <div class="dot" style="opacity: 1;"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot" style="opacity: 0.4;"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot" style="opacity: 0.2;"></div>
        </div>

        <div class="content-layer">
            <!-- Header -->
            <header style="position: relative; z-index: 20; padding: 0px 0px 32px 0px; display: flex; justify-content: space-between; align-items: center;">
                <div class="brand-gradient-bg" style="padding: 10px 30px; border-radius: 50px;">
                    <span style="color: #FFFFFF; font-weight: 500; font-size: 16px;">Thynk Unlimited</span>
                </div>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <nav class="glass-panel" style="display: flex; gap: 32px; border-radius: 50px; padding: 10px 36px; align-items: center; height: 48px;">
                        <a href="#" class="nav-link active">HOME</a>
                        <a href="#" class="nav-link">SERVICE</a>
                        <a href="#" class="nav-link">CONTACT</a>
                    </nav>
                    <div class="glass-panel" style="display: flex; gap: 8px; border-radius: 50px; padding: 6px; height: 48px; align-items: center;">
                        <div class="icon-btn"><i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i></div>
                        <div class="icon-btn" style="background: rgba(255,255,255,0.1);"><i class="fa-regular fa-user" style="font-size: 14px;"></i></div>
                    </div>
                </div>
            </header>

            <div class="text-center mb-6">
                <h1 class="text-white text-6xl font-bold tracking-tight mb-1">
                    Portfolio <span class="brand-gradient-text">Performance</span>
                </h1>
                <p class="text-[#A0A5B0] text-sm font-light">Real-time data visualization of your assets</p>
            </div>

            <!-- Dashboard Grid -->
            <div class="flex flex-col gap-6 px-8 pb-8 h-full">
                
                <!-- Top Row: Chart & Allocation -->
                <div class="flex gap-6 h-[55%]">
                    
                    <!-- Main Chart (Growth) -->
                    <div class="dashboard-card w-2/3">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-white font-medium">Annual Yield</h3>
                            <div class="text-xs text-[#A0A5B0] bg-white/5 px-2 py-1 rounded">2024-2025</div>
                        </div>
                        
                        <div class="chart-bar-container border-b border-white/10">
                            <!-- Simulated Bars -->
                            <div class="chart-bar brand-gradient-bg" style="height: 40%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 55%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 45%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 70%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 60%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 85%;"></div>
                            <div class="chart-bar brand-gradient-bg" style="height: 75%;"></div>
                            <div class="chart-bar bg-white" style="height: 95%;"></div> <!-- Highlighted -->
                        </div>
                        <div class="flex justify-between text-[#6B7280] text-xs mt-2">
                            <span>Q1</span><span>Q2</span><span>Q3</span><span>Q4</span>
                        </div>
                    </div>

                    <!-- Asset Allocation -->
                    <div class="dashboard-card w-1/3 justify-center gap-6">
                        <h3 class="text-white font-medium mb-2">Allocation</h3>
                        
                        <div>
                            <div class="flex justify-between text-xs text-[#A0A5B0] mb-1">
                                <span>Equities</span> <span class="text-white">45%</span>
                            </div>
                            <div class="progress-track"><div class="progress-fill bg-[#E56B6F]" style="width: 45%"></div></div>
                        </div>
                        
                        <div>
                            <div class="flex justify-between text-xs text-[#A0A5B0] mb-1">
                                <span>Crypto</span> <span class="text-white">30%</span>
                            </div>
                            <div class="progress-track"><div class="progress-fill bg-[#9D4EDD]" style="width: 30%"></div></div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs text-[#A0A5B0] mb-1">
                                <span>Cash / Bonds</span> <span class="text-white">25%</span>
                            </div>
                            <div class="progress-track"><div class="progress-fill bg-white/30" style="width: 25%"></div></div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Row: KPI Cards -->
                <div class="flex gap-6 h-[25%]">
                    
                    <div class="dashboard-card w-1/3 justify-center border-l-4 border-l-[#E56B6F]">
                        <p class="text-[#A0A5B0] text-xs uppercase tracking-wider">Total Balance</p>
                        <p class="text-white text-3xl font-bold mt-2">$2,405,000</p>
                    </div>

                    <div class="dashboard-card w-1/3 justify-center border-l-4 border-l-[#9D4EDD]">
                        <p class="text-[#A0A5B0] text-xs uppercase tracking-wider">YTD Profit</p>
                        <div class="flex items-baseline gap-2 mt-2">
                            <p class="text-white text-3xl font-bold">+$124k</p>
                            <span class="text-[#E56B6F] text-sm font-bold"><i class="fa-solid fa-arrow-trend-up"></i> 12%</span>
                        </div>
                    </div>

                    <div class="dashboard-card w-1/3 justify-center border-l-4 border-l-white">
                        <p class="text-[#A0A5B0] text-xs uppercase tracking-wider">Active Trades</p>
                        <p class="text-white text-3xl font-bold mt-2">14</p>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>
</html>
