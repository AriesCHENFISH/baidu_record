<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Presentation</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0F1115',
                        primary: '#FFFFFF',
                        secondary: '#A0A5B0',
                        accentLine: '#D65A63',
                        borderDark: '#2A2E35'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'Roboto', 'sans-serif'],
                    },
                    backgroundImage: {
                        'brand-gradient': 'linear-gradient(90deg, #E56B6F 0%, #9D4EDD 100%)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Slide Container */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #0F1115;
            overflow: hidden;
            /* Box shadow is strictly forbidden per instructions */
        }

        /* Utility for Background Overlay */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.85); /* Dark overlay to make text readable */
            z-index: 1;
        }

        /* Content Layer */
        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 64px;
        }

        /* Geometric Decoration - Zig Zag */
        .zigzag-deco {
            width: 50px;
            height: 50px;
            border-left: 3px solid #D65A63;
            border-bottom: 3px solid #D65A63;
            position: absolute;
        }
        
        .zigzag-deco::after {
            content: '';
            position: absolute;
            top: -25px;
            left: -3px; /* Align with border width */
            width: 25px;
            height: 25px;
            border-left: 3px solid #D65A63;
            border-bottom: 3px solid #D65A63;
        }

        /* --- 新增：顶部导航样式 (统一风格) --- */
        .bg-brand-gradient {
            background: linear-gradient(90deg, #E56B6F 0%, #9D4EDD 100%);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .nav-link {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            display: block;
        }

        .nav-link:hover, .nav-link.active {
            color: #FFFFFF;
        }

        /* 选中状态的小圆点 */
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background-color: #E56B6F;
            border-radius: 50%;
            box-shadow: 0 0 8px #E56B6F;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <div class="page_container">
        
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1611974765270-ca1258634369?q=80&w=1280&auto=format&fit=crop" 
                 alt="Stock Market Chart Background" 
                 class="w-full h-full object-cover opacity-60">
            </div>

        <div class="bg-overlay" style="background: linear-gradient(180deg, rgba(15,17,21,0.7) 0%, rgba(15,17,21,0.95) 100%);"></div>

        <div class="content-layer">
            
            <header class="flex justify-between items-center w-full relative z-20" style="padding-bottom: 20px;">
                <div class="bg-brand-gradient rounded-full px-8 py-2.5 shadow-lg">
                    <span class="text-white font-bold text-sm tracking-wide">Thynk Unlimited</span>
                </div>

                <div style="display: flex; gap: 16px; align-items: center;">
                    <nav class="glass-panel" style="display: flex; gap: 32px; border-radius: 50px; padding: 10px 36px; align-items: center; height: 48px;">
                        <a href="#" class="nav-link active">HOME</a>
                        <a href="#" class="nav-link">SERVICE</a>
                        <a href="#" class="nav-link">CONTACT</a>
                    </nav>
                    <div class="glass-panel" style="display: flex; gap: 8px; border-radius: 50px; padding: 6px; height: 48px; align-items: center;">
                        <div class="icon-btn">
                            <i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i>
                        </div>
                        <div class="icon-btn" style="background: rgba(255,255,255,0.1);">
                            <i class="fa-regular fa-user" style="font-size: 14px;"></i>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-grow flex flex-col justify-center items-center relative w-full">
                
                <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-4">
                     <div class="zigzag-deco opacity-80"></div>
                </div>

                <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-4 flex flex-col gap-2">
                    <div class="flex gap-2 justify-end">
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/40"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/60"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine"></div>
                    </div>
                    <div class="flex gap-2 justify-end">
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/40"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/60"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine"></div>
                    </div>
                    <div class="flex gap-2 justify-end">
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/40"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine/60"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-accentLine"></div>
                    </div>
                </div>

                <div class="text-center z-10">
                    <h1 class="text-primary text-9xl font-black tracking-tighter mb-4 drop-shadow-2xl uppercase" style="font-size: 8rem; line-height: 1;">
                        Stock Market
                    </h1>
                    <div class="w-24 h-1 bg-brand-gradient mx-auto mb-6 rounded-full"></div>
                    <p class="text-secondary text-2xl font-light tracking-wide">
                        Your Gateway to Financial Growth
                    </p>
                </div>
            </main>

            <footer class="flex justify-between items-end w-full">
                
                <div class="flex flex-col gap-1">
                    <p class="text-secondary text-sm font-medium uppercase tracking-wider">Presented by</p>
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-700 overflow-hidden border border-borderDark">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=100&auto=format&fit=crop" 
                                 alt="Jacqueline Thompson" 
                                 class="w-full h-full object-cover">
                            </div>
                        <h3 class="text-primary text-lg font-bold">Jacqueline Thompson</h3>
                    </div>
                </div>

                <div class="flex flex-col gap-1 text-right">
                    <p class="text-secondary text-sm font-medium uppercase tracking-wider">Date</p>
                    <h3 class="text-primary text-lg font-bold">August 25<sup>th</sup>, 2028</h3>
                </div>
            </footer>

        </div>
    </div>

</body>
</html>
