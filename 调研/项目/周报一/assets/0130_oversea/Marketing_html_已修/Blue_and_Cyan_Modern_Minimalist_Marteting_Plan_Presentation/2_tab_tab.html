<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Design - 16 Items</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #8BA4F9 0%, #A8D0E6 50%, #C8F7C5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Grid Container for 16 items */
        .agenda-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 Columns */
            grid-template-rows: repeat(4, 1fr);    /* 4 Rows */
            gap: 20px;
            width: 100%;
        }

        /* Individual Item Style */
        .agenda-item {
            background-color: #8BA4F9;
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        /* Number Style */
        .item-num {
            font-size: 18px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            margin-right: 10px;
            min-width: 30px;
        }

        /* Text Style */
        .item-text {
            font-size: 16px;
            font-weight: 500;
            color: #FFFFFF;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

    </style>
</head>
<body>

    <!-- Main PPT Container -->
    <div id="page_container">

        <!-- 1. Main Title Area (Centered) -->
        <div style="margin-bottom: 30px; text-align: center;">
            <div style="background-color: #FFFFFF; display: inline-block; padding: 15px 80px; border-radius: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <h1 style="font-size: 48px; font-weight: 800; letter-spacing: 4px; color: #333333; line-height: 1;">
                    AGENDA
                </h1>
            </div>
        </div>

        <!-- 2. Content Container (White Box) -->
        <div style="background-color: rgba(255, 255, 255, 0.95); border-radius: 30px; padding: 40px 50px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1); width: 1100px; height: 500px; display: flex; align-items: center;">
            
            <!-- Grid System for 16 Items -->
            <div class="agenda-grid">

                <!-- Row 1 -->
                <div class="agenda-item">
                    <span class="item-num">01</span>
                    <span class="item-text">Project Overview</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">02</span>
                    <span class="item-text">Core Objectives</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">03</span>
                    <span class="item-text">Market Analysis</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">04</span>
                    <span class="item-text">Target Audience</span>
                </div>

                <!-- Row 2 -->
                <div class="agenda-item">
                    <span class="item-num">05</span>
                    <span class="item-text">Brand Strategy</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">06</span>
                    <span class="item-text">Design Concept</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">07</span>
                    <span class="item-text">Content Plan</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">08</span>
                    <span class="item-text">Social Media</span>
                </div>

                <!-- Row 3 -->
                <div class="agenda-item">
                    <span class="item-num">09</span>
                    <span class="item-text">Marketing Channels</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">10</span>
                    <span class="item-text">Sales Funnel</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">11</span>
                    <span class="item-text">Budget Allocation</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">12</span>
                    <span class="item-text">Resource Needs</span>
                </div>

                <!-- Row 4 -->
                <div class="agenda-item">
                    <span class="item-num">13</span>
                    <span class="item-text">Key Milestones</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">14</span>
                    <span class="item-text">Risk Management</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">15</span>
                    <span class="item-text">KPIs & Metrics</span>
                </div>
                <div class="agenda-item">
                    <span class="item-num">16</span>
                    <span class="item-text">Q&A Session</span>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
