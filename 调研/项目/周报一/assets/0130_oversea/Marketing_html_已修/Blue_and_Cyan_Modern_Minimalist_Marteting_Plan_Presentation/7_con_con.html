<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Team Slide</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Page Container Specs */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #8BA4F9 0%, #A8D0E6 50%, #C8F7C5 100%);
        }

        /* Utility for absolute centering */
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Custom image styling to ensure fit */
        .profile-img {
            object-fit: cover;
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div class="page_container">
        
        <!-- Decorative Background Elements (Abstract Shapes) -->
        <!-- Top Right Fluid Shape Simulation -->
        <div style="position: absolute; top: -50px; right: -50px; width: 400px; height: 400px; background: rgba(255,255,255,0.15); border-radius: 50%; filter: blur(40px); z-index: 1;"></div>
        <div style="position: absolute; top: 50px; right: 80px; width: 20px; height: 20px; z-index: 2;">
            <i class="fa-solid fa-star text-white text-2xl opacity-80"></i>
        </div>
        <div style="position: absolute; top: 120px; right: 150px; width: 10px; height: 10px; z-index: 2;">
            <i class="fa-solid fa-star text-white text-sm opacity-60"></i>
        </div>

        <!-- Content Wrapper -->
        <div class="relative z-10 flex flex-col items-center w-full h-full pt-16">

            <!-- Header Section -->
            <div class="mb-12">
                <div class="bg-white px-16 py-5 rounded-full shadow-lg">
                    <h1 class="text-[#000000] text-5xl font-bold tracking-wider uppercase text-center">
                        Marketing Team
                    </h1>
                </div>
            </div>

            <!-- Team Grid Section -->
            <div class="grid grid-cols-3 gap-12 w-full px-20 items-end justify-items-center h-[480px]">

                <!-- Member 01 (Left) - Outlined Style -->
                <div class="w-full flex flex-col items-center">
                    <!-- Card Container -->
                    <div class="w-full border-[3px] border-white rounded-[40px] p-2 bg-white/10 backdrop-blur-sm relative mb-4">
                        <!-- Image Container -->
                        <div class="w-full h-[280px] rounded-[32px] overflow-hidden bg-gray-200">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                                 alt="Team Member 1" 
                                 class="profile-img h-full w-full">
                            <!-- 280*280 -->
                        </div>
                    </div>
                    
                    <!-- Text Info -->
                    <h3 class="text-[#000000] text-2xl font-bold mb-3 mt-2">Team Member</h3>
                    
                    <!-- Role Pill -->
                    <div class="bg-white/80 px-6 py-2 rounded-full shadow-sm">
                        <p class="text-[#555555] text-xs font-bold tracking-widest uppercase">Add Role Here</p>
                    </div>
                </div>

                <!-- Member 02 (Center) - Solid White Highlight Style -->
                <div class="w-full flex flex-col items-center relative -top-6 transform scale-110 origin-bottom">
                    <!-- Card Container: Solid White -->
                    <div class="w-full bg-white rounded-[40px] p-3 shadow-2xl relative mb-4">
                        <!-- Image Container -->
                        <div class="w-full h-[300px] rounded-[32px] overflow-hidden bg-gray-100">
                            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                                 alt="Team Member Leader" 
                                 class="profile-img h-full w-full">
                            <!-- 300*300 -->
                        </div>
                    </div>

                    <!-- Text Info -->
                    <h3 class="text-[#000000] text-2xl font-bold mb-3 mt-2">Team Member</h3>
                    
                    <!-- Role Pill: Accent Color -->
                    <div class="bg-[#8BA4F9] px-8 py-2 rounded-full shadow-md">
                        <p class="text-white text-xs font-bold tracking-widest uppercase">Add Role Here</p>
                    </div>
                </div>

                <!-- Member 03 (Right) - Outlined Style -->
                <div class="w-full flex flex-col items-center">
                    <!-- Card Container -->
                    <div class="w-full border-[3px] border-white rounded-[40px] p-2 bg-white/10 backdrop-blur-sm relative mb-4">
                        <!-- Image Container -->
                        <div class="w-full h-[280px] rounded-[32px] overflow-hidden bg-gray-200">
                            <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                                 alt="Team Member 3" 
                                 class="profile-img h-full w-full">
                            <!-- 280*280 -->
                        </div>
                    </div>
                    
                    <!-- Text Info -->
                    <h3 class="text-[#000000] text-2xl font-bold mb-3 mt-2">Team Member</h3>
                    
                    <!-- Role Pill -->
                    <div class="bg-white/80 px-6 py-2 rounded-full shadow-sm">
                        <p class="text-[#555555] text-xs font-bold tracking-widest uppercase">Add Role Here</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Subtle Gradient Overlay at bottom for depth -->
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: linear-gradient(to top, rgba(255,255,255,0.3), transparent); pointer-events: none;"></div>

    </div>

</body>
</html>
