<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet the Founding Team - Salford & Co.</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#181818',
                        cardBg: '#2D2D2D',
                        accentBlue: '#3B71F3',
                        textPrimary: '#FFFFFF',
                        textSecondary: '#B3B3B3',
                        iconDetail: '#5A8AF5',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Definition */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #181818;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Custom Scrollbar hide just in case */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Utility for image object fit */
        .img-cover {
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-bl from-[#3B71F3] to-transparent opacity-5 rounded-full blur-3xl pointer-events-none" style="transform: translate(30%, -30%);"></div>

        <header class="relative z-10 w-full px-12 pt-10 flex justify-between items-center shrink-0 mb-8">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center rounded-full" style="background-color: rgba(59, 113, 243, 0.2);">
                    <i class="fa-solid fa-sun text-[#3B71F3] text-sm"></i>
                </div>
                <h3 class="text-[#FFFFFF] text-lg font-bold tracking-wide">Salford & Co.</h3>
            </div>
            <div class="flex items-center gap-4">
                <div class="px-5 py-1.5 rounded-full border border-[#2D2D2D] bg-[#2D2D2D]">
                    <span class="text-[#FFFFFF] text-sm font-semibold">2030</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-[#3B71F3] flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-arrow-right text-white"></i>
                </div>
            </div>
        </header>

        <main class="px-12 w-full z-10 relative">
            <div class="w-full text-center mb-10">
                <h1 class="text-textPrimary text-5xl font-bold tracking-tight">Meet the Founding Team</h1>
            </div>

            <div class="grid grid-cols-5 gap-6 w-full">
                
                <div class="bg-cardBg rounded-2xl p-4 flex flex-col items-center h-[420px] shadow-lg border border-white/5">
                    <div class="w-full h-[240px] mb-5 overflow-hidden rounded-xl bg-gray-700">
                        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop" alt="Juliana Silva" class="w-full h-full img-cover">
                        </div>
                    <div class="w-full text-center">
                        <h3 class="bg-white/10 text-textPrimary py-2 px-4 rounded-full text-sm font-bold mb-3 inline-block w-full border border-white/5">
                            Juliana Silva
                        </h3>
                        <p class="text-accentBlue font-semibold text-xs uppercase tracking-wider mb-1">
                            Chief Executive Officer
                        </p>
                        <p class="text-textSecondary text-xs italic">
                            (CEO)
                        </p>
                    </div>
                </div>

                <div class="bg-cardBg rounded-2xl p-4 flex flex-col items-center h-[420px] shadow-lg border border-white/5">
                    <div class="w-full h-[240px] mb-5 overflow-hidden rounded-xl bg-gray-700">
                        <img src="https://images.unsplash.com/photo-1506277886164-e25aa3f4ef7f?q=80&w=600&auto=format&fit=crop" alt="Aaron Loeb" class="w-full h-full img-cover">
                        </div>
                    <div class="w-full text-center">
                        <h3 class="bg-white/10 text-textPrimary py-2 px-4 rounded-full text-sm font-bold mb-3 inline-block w-full border border-white/5">
                            Aaron Loeb
                        </h3>
                        <p class="text-accentBlue font-semibold text-xs uppercase tracking-wider mb-1">
                            Chief Operating Officer
                        </p>
                        <p class="text-textSecondary text-xs italic">
                            (COO)
                        </p>
                    </div>
                </div>

                <div class="bg-cardBg rounded-2xl p-4 flex flex-col items-center h-[420px] shadow-lg border border-white/5">
                    <div class="w-full h-[240px] mb-5 overflow-hidden rounded-xl bg-gray-700">
                        <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=600&auto=format&fit=crop" alt="Olivia Wilson" class="w-full h-full img-cover">
                        </div>
                    <div class="w-full text-center">
                        <h3 class="bg-white/10 text-textPrimary py-2 px-4 rounded-full text-sm font-bold mb-3 inline-block w-full border border-white/5">
                            Olivia Wilson
                        </h3>
                        <div class="mt-4"></div>
                        <p class="text-accentBlue font-semibold text-xs uppercase tracking-wider">
                            Director
                        </p>
                    </div>
                </div>

                <div class="bg-cardBg rounded-2xl p-4 flex flex-col items-center h-[420px] shadow-lg border border-white/5">
                    <div class="w-full h-[240px] mb-5 overflow-hidden rounded-xl bg-gray-700">
                        <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=600&auto=format&fit=crop" alt="Neil Tran" class="w-full h-full img-cover">
                        </div>
                    <div class="w-full text-center">
                        <h3 class="bg-white/10 text-textPrimary py-2 px-4 rounded-full text-sm font-bold mb-3 inline-block w-full border border-white/5">
                            Neil Tran
                        </h3>
                        <div class="mt-4"></div>
                        <p class="text-accentBlue font-semibold text-xs uppercase tracking-wider">
                            Head Manager
                        </p>
                    </div>
                </div>

                <div class="bg-cardBg rounded-2xl p-4 flex flex-col items-center h-[420px] shadow-lg border border-white/5">
                    <div class="w-full h-[240px] mb-5 overflow-hidden rounded-xl bg-gray-700">
                        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600&auto=format&fit=crop" alt="Shawn Garcia" class="w-full h-full img-cover">
                        </div>
                    <div class="w-full text-center">
                        <h3 class="bg-white/10 text-textPrimary py-2 px-4 rounded-full text-sm font-bold mb-3 inline-block w-full border border-white/5">
                            Shawn Garcia
                        </h3>
                        <div class="mt-4"></div>
                        <p class="text-accentBlue font-semibold text-xs uppercase tracking-wider">
                            Head of Marketing
                        </p>
                    </div>
                </div>

            </div>
        </main>

        <footer class="absolute bottom-0 left-0 w-full px-12 py-6 flex justify-end items-end z-10">
            <div class="flex items-center">
                <p class="text-textSecondary text-sm">
                    Page <span class="text-white font-bold ml-1">13</span>
                </p>
            </div>
        </footer>

    </div>
</body>
</html>
