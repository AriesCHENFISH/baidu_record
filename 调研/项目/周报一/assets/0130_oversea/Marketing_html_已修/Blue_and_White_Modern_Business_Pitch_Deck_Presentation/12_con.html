<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Metrics - Salford & Co.</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #181818; overflow: hidden; display: flex; flex-direction: column;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .metric-card {
            background: linear-gradient(145deg, #2D2D2D, #262626);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-bl from-[#3B71F3]/20 to-transparent blur-[120px] pointer-events-none"></div>

        <header class="relative z-10 w-full px-12 pt-10 flex justify-between items-center shrink-0 mb-12">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center rounded-full" style="background-color: rgba(59, 113, 243, 0.2);">
                    <i class="fa-solid fa-sun text-[#3B71F3] text-sm"></i>
                </div>
                <h3 class="text-[#FFFFFF] text-lg font-bold tracking-wide">Salford & Co.</h3>
            </div>
            <div class="flex items-center gap-4">
                <div class="px-5 py-1.5 rounded-full border border-[#2D2D2D] bg-[#2D2D2D]">
                    <span class="text-[#FFFFFF] text-sm font-semibold">2030</span>
                </div>
                <div class="w-10 h-10 rounded-full bg-[#3B71F3] flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-arrow-right text-white"></i>
                </div>
            </div>
        </header>

        <main class="px-12 w-full flex-1 z-10 flex flex-col justify-center">
             <div class="mb-12">
                <h1 class="text-5xl font-bold text-white tracking-tight mb-4">Key Performance <span class="text-[#3B71F3]">Metrics</span></h1>
                <p class="text-[#B3B3B3] text-lg max-w-2xl">Tracking our progress towards strategic goals through Q4.</p>
            </div>

            <div class="grid grid-cols-3 gap-8 w-full h-[320px]">
                <div class="metric-card rounded-3xl p-8 flex flex-col justify-between border border-white/5 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity">
                        <i class="fa-solid fa-users text-8xl text-[#3B71F3]"></i>
                    </div>
                    <div>
                        <div class="w-14 h-14 rounded-2xl bg-[#3B71F3]/20 flex items-center justify-center mb-6 text-[#3B71F3]">
                            <i class="fa-solid fa-user-plus text-2xl"></i>
                        </div>
                        <h3 class="text-[#B3B3B3] font-medium text-lg uppercase tracking-wider mb-2">Total User Growth</h3>
                        <div class="flex items-baseline gap-4">
                            <span class="text-white font-bold text-6xl tracking-tight">2.5M+</span>
                            <span class="text-[#3B71F3] font-semibold text-lg flex items-center"><i class="fa-solid fa-arrow-trend-up mr-2"></i> 125% YoY</span>
                        </div>
                    </div>
                    <div class="w-full bg-[#181818] h-2 rounded-full mt-6 overflow-hidden">
                        <div class="h-full bg-[#3B71F3] w-[85%] rounded-full"></div>
                    </div>
                </div>

                <div class="metric-card rounded-3xl p-8 flex flex-col justify-between border border-white/5 relative overflow-hidden group">
                     <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity">
                        <i class="fa-solid fa-sack-dollar text-8xl text-[#5A8AF5]"></i>
                    </div>
                    <div>
                        <div class="w-14 h-14 rounded-2xl bg-[#5A8AF5]/20 flex items-center justify-center mb-6 text-[#5A8AF5]">
                            <i class="fa-solid fa-chart-pie text-2xl"></i>
                        </div>
                        <h3 class="text-[#B3B3B3] font-medium text-lg uppercase tracking-wider mb-2">Annual Recurring Revenue</h3>
                        <div class="flex items-baseline gap-4">
                            <span class="text-white font-bold text-6xl tracking-tight">$150M</span>
                            <span class="text-[#5A8AF5] font-semibold text-lg flex items-center"><i class="fa-solid fa-arrow-trend-up mr-2"></i> 45% YoY</span>
                        </div>
                    </div>
                     <div class="w-full bg-[#181818] h-2 rounded-full mt-6 overflow-hidden">
                        <div class="h-full bg-[#5A8AF5] w-[65%] rounded-full"></div>
                    </div>
                </div>

                <div class="metric-card rounded-3xl p-8 flex flex-col justify-between border border-white/5 relative overflow-hidden group">
                     <div class="absolute top-0 right-0 p-6 opacity-10 group-hover:opacity-20 transition-opacity">
                        <i class="fa-solid fa-handshake text-8xl text-[#8FB3FF]"></i>
                    </div>
                    <div>
                        <div class="w-14 h-14 rounded-2xl bg-[#8FB3FF]/20 flex items-center justify-center mb-6 text-[#8FB3FF]">
                            <i class="fa-regular fa-face-smile text-2xl"></i>
                        </div>
                        <h3 class="text-[#B3B3B3] font-medium text-lg uppercase tracking-wider mb-2">Customer Retention Rate</h3>
                        <div class="flex items-baseline gap-4">
                            <span class="text-white font-bold text-6xl tracking-tight">94.5%</span>
                             <span class="text-[#8FB3FF] font-semibold text-lg flex items-center"><i class="fa-solid fa-minus mr-2"></i> Stable</span>
                        </div>
                    </div>
                     <div class="w-full bg-[#181818] h-2 rounded-full mt-6 overflow-hidden">
                        <div class="h-full bg-[#8FB3FF] w-[94.5%] rounded-full"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="w-full h-16 px-12 flex items-center justify-end text-[#B3B3B3] text-sm font-medium opacity-60 shrink-0">
            <p>Page 12</p>
        </footer>
    </div>
</body>
</html>
