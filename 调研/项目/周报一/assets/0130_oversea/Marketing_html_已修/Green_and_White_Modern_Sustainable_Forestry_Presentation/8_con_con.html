<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Conservation Solutions</title>
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts (Domestic Mirror as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Custom Config to match Strict Requirements -->
    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* No styling allowed on body per instructions */
        }

        /* Font Family Application */
        .font-sans {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Specific Utilities */
        .clip-organic {
            /* Creating the organic/rock edge effect using polygon */
            clip-path: polygon(0 0, 68% 0, 65% 15%, 70% 30%, 62% 55%, 68% 75%, 60% 100%, 0 100%);
        }

        .text-shadow-sm {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF',
                        darkGreen: '#1A2818',
                        accent: '#5A6F41',
                        natureTone: '#7FA948'
                    },
                    spacing: {
                        '1280': '1280px',
                        '720': '720px',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Page Container: Fixed 1280x720, Centered, Relative -->
    <div id="page_container" class="relative w-[1280px] h-[720px] mx-auto overflow-hidden bg-gray-900 font-sans">

        <!-- Layer 1: Background Image (Right Side Focus) -->
        <!-- Using a high-quality gorilla/forest image to match original intent but elevated aesthetics -->
        <div class="absolute inset-0 z-0">
            <img 
                src="https://images.unsplash.com/photo-1542646898-1f19c0177700?q=80&w=1280&auto=format&fit=crop" 
                class="w-full h-full object-cover object-right" 
                alt="Gorilla in dense forest"
            >
            <!-- 1280*720 -->
            
            <!-- Subtle gradient overlay on the image side to ensure smooth transition -->
            <div class="absolute inset-0 bg-gradient-to-r from-black/60 to-transparent"></div>
        </div>

        <!-- Layer 2: Content Overlay (Left Side with Organic Edge) -->
        <div class="absolute top-0 left-0 w-full h-full z-10 clip-organic bg-[#1A2818]">
            
            <!-- Inner Content Wrapper -->
            <!-- Using grid/flex to align content perfectly within the clipped area (approx 65% of screen) -->
            <div class="w-[65%] h-full flex flex-col justify-center px-24 py-16 relative">

                <!-- Decorative Background Element (Subtle Glow) -->
                <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-[#2a3d27] to-[#1A2818] -z-10 opacity-50"></div>

                <!-- Top Decoration: Wavy Icon (Replica of original graphic) -->
                <div class="mb-8">
                    <i class="fa-solid fa-water text-[#5A6F41] text-4xl opacity-80"></i>
                </div>

                <!-- Main Title -->
                <h1 class="text-white text-7xl font-bold leading-tight mb-8 tracking-wide">
                    Conservation<br>
                    <span class="text-[#7FA948]">Solutions</span>
                </h1>

                <!-- Divider Line -->
                <div class="w-24 h-1 bg-[#5A6F41] mb-10 rounded-full"></div>

                <!-- Paragraph Content -->
                <p class="text-gray-300 text-lg leading-relaxed font-light mb-12 pr-12 text-justify">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.
                </p>

                <!-- Action/Decorative Elements -->
                <div class="flex items-center gap-4 mt-4">
                    <!-- Styled Button-like indicator -->
                    <div class="px-6 py-3 border border-[#5A6F41] rounded-full text-white text-sm font-medium tracking-widest uppercase">
                        Explore Mission
                    </div>
                    
                    <!-- Arrow Indicators (Visual cue from original) -->
                    <div class="flex gap-2 ml-6 text-[#7FA948]">
                        <i class="fa-solid fa-chevron-right text-sm opacity-40"></i>
                        <i class="fa-solid fa-chevron-right text-sm opacity-70"></i>
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </div>
                </div>

                <!-- Footer/Metadata area (Optional but adds polish) -->
                <div class="absolute bottom-12 left-24 flex items-center gap-3 opacity-50">
                    <div class="w-2 h-2 rounded-full bg-white"></div>
                    <p class="text-xs text-white tracking-widest uppercase">Ecological Report 2024</p>
                </div>

            </div>
        </div>

        <!-- Layer 3: Accent Graphic on the "Cut" Edge (Optional Polish) -->
        <!-- Mimics a subtle light reflection on the torn edge -->
        <div class="absolute top-0 left-[68%] w-[2px] h-[200px] bg-gradient-to-b from-transparent via-white/20 to-transparent z-20 mix-blend-overlay"></div>

    </div>

</body>
</html>
