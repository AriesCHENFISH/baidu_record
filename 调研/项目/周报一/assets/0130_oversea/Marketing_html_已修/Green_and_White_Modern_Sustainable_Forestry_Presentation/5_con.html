<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodiversity Hotspots - Eco Theme</title>
    <!-- Domestic Google Fonts CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <style>
        /* CSS Reset & Basics */
        body, html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Page Container */
        .page-container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #1A2818; /* Dark Jungle Green Base */
        }

        /* Typography Override for Serif Title */
        .font-serif-display {
            font-family: 'Playfair Display', serif;
        }

        /* Custom Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .photo-card {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        /* Organic decorative shape */
        .organic-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- 1. Background Layer with Deep Overlay -->
        <div class="absolute inset-0 z-0">
            <!-- Background Image: Dense Forest Texture -->
            <img src="https://images.unsplash.com/photo-1448375240586-dfd8d395ea6c?q=80&w=1280&auto=format&fit=crop" 
                 alt="Forest Background" 
                 class="w-full h-full object-cover opacity-40 mix-blend-luminosity">
            <!-- 1280*720 -->
            
            <!-- Gradient Overlay for Depth -->
            <div class="absolute inset-0" style="background: linear-gradient(110deg, #1A2818 30%, rgba(26, 40, 24, 0.8) 100%);"></div>
            
            <!-- Organic Green Decorative Blob (Bottom Left) -->
            <div class="absolute -bottom-32 -left-32 w-[600px] h-[600px] bg-[#5A6F41] opacity-20 organic-shape blur-3xl"></div>
        </div>

        <!-- 2. Main Content Grid -->
        <div class="relative z-10 grid grid-cols-12 h-full">
            
            <!-- Left Column: Typography & Info (Span 4) -->
            <div class="col-span-4 flex flex-col justify-center pl-16 pr-8 h-full">
                <!-- Decorative Top Line -->
                <div class="w-12 h-1 bg-[#5A6F41] mb-8"></div>

                <!-- Main Title -->
                <h1 class="font-serif-display text-white text-7xl leading-tight mb-6 tracking-wide drop-shadow-lg">
                    Biodiversity<br>
                    <span class="italic text-[#A8C686]">Hotspots</span>
                </h1>

                <!-- Brief Description (Implied context for layout balance) -->
                <p class="text-gray-300 text-lg leading-relaxed font-light mb-12 border-l-2 border-[#5A6F41] pl-4">
                    Exploring the rich tapestry of life, from the delicate flora of the undergrowth to the majestic fauna that roams the wild.
                </p>
            </div>

            <!-- Right Column: Visual Gallery (Span 8) -->
            <div class="col-span-8 relative h-full">
                
                <!-- Top Right Navigation / Arrow Decoration -->
                <div class="absolute top-12 right-12 flex space-x-2">
                    <i class="fa-solid fa-chevron-right text-white opacity-40 text-xl"></i>
                    <i class="fa-solid fa-chevron-right text-white opacity-70 text-xl"></i>
                    <i class="fa-solid fa-chevron-right text-white text-xl"></i>
                </div>

                <!-- Gallery Composition Container -->
                <div class="absolute inset-0 flex items-center justify-center translate-x-10 translate-y-4">
                    
                    <!-- Card 1: Flora (Left, Tilted Left) -->
                    <!-- Z-index 20 to sit behind center, but prominent -->
                    <div class="absolute photo-card bg-white p-3 rounded-sm transform -rotate-6 -translate-x-64 translate-y-12 z-20 w-[340px]">
                        <div class="relative overflow-hidden h-[240px]">
                            <img src="https://images.unsplash.com/photo-1591955392505-592b2383848b?q=80&w=600&auto=format&fit=crop" 
                                 class="w-full h-full object-cover hover:scale-110 transition-transform duration-700" 
                                 alt="Red Poppies Field">
                            <!-- 316*240 -->
                        </div>
                        <!-- Label Badge -->
                        <div class="absolute -top-4 right-4 bg-[#5A6F41] text-white px-6 py-2 shadow-lg z-30">
                            <h3 class="text-sm font-bold uppercase tracking-widest">Flora</h3>
                        </div>
                    </div>

                    <!-- Card 2: Avian / Center (Center, Slight Rotate) -->
                    <!-- Z-index 30 (Top Most visually for depth) -->
                    <div class="absolute photo-card bg-white p-3 rounded-sm transform rotate-2 -translate-y-24 z-30 w-[360px]">
                        <div class="relative overflow-hidden h-[260px]">
                            <img src="https://images.unsplash.com/photo-1544603682-1d015c9e4722?q=80&w=600&auto=format&fit=crop" 
                                 class="w-full h-full object-cover hover:scale-110 transition-transform duration-700" 
                                 alt="Kingfishers">
                            <!-- 336*260 -->
                        </div>
                        <!-- No label on center image to maintain hierarchy, or minimal tag -->
                        <div class="absolute bottom-4 left-4 text-white drop-shadow-md">
                            <i class="fa-solid fa-feather text-white opacity-80 text-xl"></i>
                        </div>
                    </div>

                    <!-- Card 3: Fauna (Right, Tilted Right) -->
                    <!-- Z-index 10 -->
                    <div class="absolute photo-card bg-white p-3 rounded-sm transform rotate-6 translate-x-56 translate-y-20 z-10 w-[340px]">
                        <div class="relative overflow-hidden h-[240px]">
                            <img src="https://images.unsplash.com/photo-1484406566174-9da000dea647?q=80&w=600&auto=format&fit=crop" 
                                 class="w-full h-full object-cover hover:scale-110 transition-transform duration-700" 
                                 alt="Deer in field">
                            <!-- 316*240 -->
                        </div>
                         <!-- Label Badge -->
                         <div class="absolute -left-4 -top-3 bg-[#5A6F41] text-white px-6 py-2 shadow-lg z-30">
                            <h3 class="text-sm font-bold uppercase tracking-widest">Fauna</h3>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
