<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable Forestry - Cover with Info</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }
        
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #1A2818; overflow: hidden;
        }

        /* Serif font for titles and names to maintain elegance */
        .font-serif-display {
            font-family: 'Times New Roman', Times, serif;
        }
        
        .text-glow {
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFFFFF', 
                        darkBg: '#1A2818', 
                        accent: '#5A6F41', 
                        natural: '#7FA948'
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1440557653067-173669fa4844?q=80&w=2692&auto=format&fit=crop" 
                 alt="Forest Canopy" 
                 class="w-full h-full object-cover transform scale-105">
            
            <div class="absolute inset-0 bg-gradient-to-b from-[#1A2818]/30 via-[#1A2818]/50 to-[#1A2818]/95 mix-blend-multiply"></div>
            <div class="absolute inset-0 bg-[#1A2818]/20 mix-blend-overlay"></div>
        </div>

        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-12">

            <div class="absolute top-12 flex flex-col items-center gap-2 opacity-80">
                <div class="h-16 w-[1px] bg-gradient-to-b from-transparent to-natural"></div>
                <span class="text-natural tracking-[0.3em] text-xs uppercase font-medium">Eco Vision 2025</span>
            </div>

            <div class="text-center relative mb-12">
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[300px] bg-accent/20 blur-[100px] rounded-full pointer-events-none"></div>

                <h1 class="font-serif-display text-primary text-glow leading-none relative z-10">
                    <span class="block text-[120px] font-light tracking-wide mb-[-10px]">Sustainable</span>
                    <span class="block text-[130px] font-normal italic text-natural">Forestry</span>
                </h1>
                
                <div class="mt-8 flex items-center justify-center gap-4">
                    <div class="h-[1px] w-12 bg-white/30"></div>
                    <p class="text-white/80 text-lg font-light tracking-widest uppercase">Preserving Our Future</p>
                    <div class="h-[1px] w-12 bg-white/30"></div>
                </div>
            </div>

            <div class="absolute bottom-16 flex flex-col items-center w-full">
                
                <div class="flex items-center gap-12 px-10 py-4 bg-white/5 border border-white/5 rounded-full backdrop-blur-sm">
                    
                    <div class="text-right">
                        <p class="text-[10px] text-natural uppercase tracking-widest font-bold mb-1">Presenter</p>
                        <p class="text-xl text-primary font-serif-display tracking-wide">Alex Morgan</p>
                    </div>

                    <div class="w-[1px] h-10 bg-white/20"></div>

                    <div class="text-left">
                        <p class="text-[10px] text-natural uppercase tracking-widest font-bold mb-1">Date</p>
                        <p class="text-xl text-primary font-serif-display tracking-wide">Dec 26, 2025</p>
                    </div>

                </div>

                <div class="flex gap-2 mt-6 opacity-40">
                    <div class="w-1 h-1 bg-natural rounded-full"></div>
                    <div class="w-1 h-1 bg-white rounded-full"></div>
                    <div class="w-1 h-1 bg-white rounded-full"></div>
                </div>

            </div>

            <div class="absolute left-12 top-1/2 -translate-y-1/2 text-white/10 text-xl flex flex-col gap-4">
                <i class="fa-solid fa-leaf transform -rotate-45"></i>
                <i class="fa-solid fa-leaf transform -rotate-45 scale-75"></i>
            </div>

            <div class="absolute right-12 top-1/2 -translate-y-1/2 text-white/10 text-xl flex flex-col gap-4">
                 <i class="fa-solid fa-tree transform scale-75"></i>
                 <i class="fa-solid fa-tree"></i>
            </div>

        </div>
    </div>

</body>
</html>
