<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck Cover - Larana</title>
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Structure */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; background-color: #131122;
            position: relative; margin: 0 auto; overflow: hidden;
            display: flex; flex-direction: column; font-family: 'Noto Sans SC', sans-serif;
        }

        /* Decorative Rings */
        .decorative-ring {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(217, 245, 91, 0.15) 0%, rgba(19, 17, 34, 0) 70%);
            z-index: 0; pointer-events: none;
        }

        /* Outline Text Effect */
        .text-outline {
            -webkit-text-stroke: 3px #D9F55B;
            color: transparent;
        }
    </style>
</head>
<body>
    <div id="page_container">
        
        <!-- BACKGROUND LAYER -->
        <!-- Subtle Texture Image blended into background -->
        <div class="absolute inset-0 z-0 opacity-20 mix-blend-overlay">
            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop" 
                 class="w-full h-full object-cover grayscale">
        </div>
        
        <!-- Decorative Elements -->
        <div class="decorative-ring" style="bottom: -200px; right: -200px; width: 800px; height: 800px;"></div>
        <div class="decorative-ring" style="top: -100px; left: -100px; width: 400px; height: 400px; opacity: 0.5;"></div>

        <!-- UNIFIED HEADER -->
        <header class="w-full h-24 px-12 flex items-center justify-between z-10 shrink-0 relative">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-pie text-[#D9F55B] text-2xl"></i>
                <h2 class="text-[#B0B0B8] text-xl font-medium tracking-wide">Larana</h2>
            </div>
            <!-- Nav (All inactive for Cover) -->
            <nav>
                <ul class="flex gap-4 list-none">
                    <li><div class="px-6 py-2 rounded-full border border-[#D9F55B] text-white text-sm cursor-default hover:bg-[#D9F55B]/10 transition-colors">List Of Content</div></li>
                    <li><div class="px-6 py-2 rounded-full border border-[#D9F55B] text-white text-sm cursor-default hover:bg-[#D9F55B]/10 transition-colors">Who We Are</div></li>
                    <li><div class="px-6 py-2 rounded-full border border-[#D9F55B] text-white text-sm cursor-default hover:bg-[#D9F55B]/10 transition-colors">Market Insight</div></li>
                    <li><div class="px-6 py-2 rounded-full border border-[#D9F55B] text-white text-sm cursor-default hover:bg-[#D9F55B]/10 transition-colors">Our Performance</div></li>
                </ul>
            </nav>
            <!-- Date -->
            <div><p class="text-[#B0B0B8] text-sm font-medium">05 June, 2025</p></div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 px-12 pb-12 relative z-10 flex flex-col justify-center">
            
            <!-- Hero Typography -->
            <div class="flex flex-col select-none transform translate-y-[-20px]">
                <!-- "PITCH" - Outline Style -->
                <h1 class="text-[180px] leading-[0.8] font-black tracking-tighter text-outline uppercase drop-shadow-2xl">
                    Pitch
                </h1>
                
                <!-- "DECK" - Solid Style with Dot -->
                <div class="flex items-baseline">
                    <h1 class="text-[#D9F55B] text-[180px] leading-[0.8] font-black tracking-tighter uppercase drop-shadow-lg">
                        Deck
                    </h1>
                    <!-- Decorative Dot -->
                    <div class="w-10 h-10 bg-[#D9F55B] rounded-full ml-6 shadow-[0_0_30px_#D9F55B] animate-pulse"></div>
                </div>

                <!-- Tagline -->
                <div class="mt-8 ml-2 flex items-center gap-4">
                    <div class="h-[1px] w-24 bg-white/50"></div>
                    <p class="text-white text-xl tracking-[0.2em] font-light uppercase">Business Presentation</p>
                </div>
            </div>

            <!-- Presenter Info Card (Bottom Right) -->
            <!-- Glassmorphism effect -->
            <div class="absolute bottom-12 right-12 w-[360px] bg-[#1A182D]/60 backdrop-blur-md border border-[#D9F55B]/30 rounded-[24px] p-6 shadow-2xl group hover:border-[#D9F55B] transition-colors duration-300">
                
                <!-- Label -->
                <p class="text-[#B0B0B8] text-xs font-bold uppercase tracking-widest mb-4 border-b border-[#D9F55B]/20 pb-2">
                    Presented By
                </p>

                <!-- Profile -->
                <div class="flex items-center gap-5">
                    <!-- Avatar Placeholder -->
                    <div class="w-16 h-16 rounded-full border-2 border-[#D9F55B] p-1">
                        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=400&auto=format&fit=crop" 
                             class="w-full h-full rounded-full object-cover">
                    </div>
                    
                    <!-- Info -->
                    <div>
                        <h3 class="text-white text-2xl font-bold leading-none mb-1">Ketut Susilo</h3>
                        <p class="text-[#D9F55B] text-sm font-medium">Head of Strategy</p>
                    </div>
                </div>

                <!-- Extra Contact Info (Optional) -->
                <div class="mt-4 pt-4 border-t border-[#D9F55B]/10 flex flex-col gap-2">
                    <div class="flex items-center gap-3 text-[#B0B0B8] text-xs">
                        <i class="fa-solid fa-envelope text-[#D9F55B]"></i>
                        <span>contact@larana.com</span>
                    </div>
                    <div class="flex items-center gap-3 text-[#B0B0B8] text-xs">
                        <i class="fa-solid fa-globe text-[#D9F55B]"></i>
                        <span>www.larana.inc</span>
                    </div>
                </div>

            </div>

        </main>

    </div>
</body>
</html>
