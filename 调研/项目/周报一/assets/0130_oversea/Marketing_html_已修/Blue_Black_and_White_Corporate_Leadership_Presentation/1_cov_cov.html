<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Presentation - Cover Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* Basic Reset & Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Fixed Slide Container */
        #page_container {
            width: 1280px; height: 720px; 
            background-color: #FAFAFA; 
            position: relative; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex">
        
        <div class="w-1/2 relative flex items-center justify-center h-full p-12">
            <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] bg-[#4D9EF4] opacity-10 rounded-full blur-[80px] z-0 pointer-events-none"></div>
            <div class="absolute bottom-[-50px] right-[-50px] w-[300px] h-[300px] bg-[#E57D48] opacity-10 rounded-full blur-[60px] z-0 pointer-events-none"></div>

            <div class="relative z-10 w-full h-full bg-white rounded-[40px] shadow-2xl overflow-hidden border-[6px] border-white">
                <img 
                    src="https://images.unsplash.com/photo-1560250097-0b93528c311a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" 
                    alt="Leadership executive presentation" 
                    class="w-full h-full object-cover hover:scale-105 transition-transform duration-700"
                >
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
            </div>
        </div>

        <div class="w-1/2 flex flex-col justify-center h-full p-16 relative z-10">
            
            <div class="mb-12">
                <div class="w-24 h-2 bg-[#E57D48] rounded-full mb-6"></div>
                <h1 class="text-7xl font-black tracking-tight leading-none mb-2 text-[#4D9EF4]">
                    LEADERSHIP
                </h1>
                <h2 class="text-5xl font-bold text-[#1A1A1A] tracking-tight">
                    PRESENTATION
                </h2>
                <p class="text-[#555555] text-xl mt-6 font-light max-w-md leading-relaxed">
                    Navigating the Future with Vision, Strategy, and Integrity.
                </p>
            </div>

            <div class="absolute bottom-16 left-16 bg-white p-6 rounded-2xl shadow-lg border border-gray-100 flex items-start gap-5 max-w-md">
                <div class="w-14 h-14 rounded-xl bg-[#4D9EF4]/10 flex items-center justify-center flex-shrink-0 text-[#4D9EF4]">
                    <i class="fa-solid fa-user-tie text-2xl"></i>
                </div>
                <div>
                    <p class="text-[#555555] text-sm font-medium uppercase tracking-wider mb-1">Presented By</p>
                    <h3 class="text-[#1A1A1A] text-2xl font-bold">Alex Chen</h3>
                    <p class="text-[#E57D48] font-medium mb-2">Chief Strategy Officer</p>
                    <div class="flex items-center text-[#555555] text-sm gap-4 mt-3">
                        <span class="flex items-center gap-2"><i class="fa-regular fa-calendar-days text-[#4D9EF4]"></i> October 26, 2025</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
