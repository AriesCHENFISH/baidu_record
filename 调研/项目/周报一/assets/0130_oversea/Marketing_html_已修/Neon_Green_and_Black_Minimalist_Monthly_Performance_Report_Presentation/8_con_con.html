<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitor Analysis</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Typography Utilities */
        .text-accent {
            color: #C3E86C;
        }
        .text-secondary {
            color: #808080;
        }
        .text-subheading {
            color: #CCCCCC;
        }
        
        /* Serif font for the artistic title to mimic original image's elegance */
        .font-display {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-0 left-0 w-full px-16 pt-12 pb-6 z-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-8 h-8 rounded bg-[#C3E86C] flex items-center justify-center text-black font-bold text-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h4 class="text-sm tracking-widest font-medium uppercase text-white">Rimberio Marketing</h4>
            </div>

            <h1 class="text-7xl font-light tracking-tight text-white leading-tight">
                <span class="font-display pr-4">Competitor</span>
                <span class="font-display font-light text-[#C3E86C]">Analysis</span>
            </h1>
        </div>

        <div class="absolute top-[28%] left-0 w-full h-[62%] px-16 flex">
            
            <div class="w-[45%] h-full flex flex-col justify-start pr-12 border-t border-[#333333] pt-10">
                <h3 class="text-lg text-[#C3E86C] font-medium mb-12 tracking-wide">
                    Comparison with Competitors
                </h3>

                <div class="grid grid-cols-2 gap-x-12 gap-y-12">
                    
                    <div class="flex flex-col gap-6">
                        <h4 class="text-2xl font-bold text-white border-b border-[#333333] pb-4">Reach</h4>
                        
                        <div class="flex flex-col">
                            <p class="text-sm text-[#808080] mb-1">Competitor A</p>
                            <div class="flex items-baseline gap-2">
                                <h5 class="text-5xl font-light text-white tracking-tighter">130,000</h5>
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <p class="text-sm text-[#808080] mb-1">Competitor B</p>
                            <div class="flex items-baseline gap-2">
                                <h5 class="text-5xl font-light text-[#CCCCCC] tracking-tighter">125,000</h5>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-6">
                        <h4 class="text-2xl font-bold text-white border-b border-[#333333] pb-4">Engagement Rate</h4>
                        
                        <div class="flex flex-col">
                            <p class="text-sm text-[#808080] mb-1">Competitor A</p>
                            <div class="flex items-baseline gap-2">
                                <h5 class="text-5xl font-light text-white tracking-tighter">4.0%</h5>
                                <i class="fa-solid fa-arrow-trend-up text-[#C3E86C] text-xl"></i>
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <p class="text-sm text-[#808080] mb-1">Competitor B</p>
                            <div class="flex items-baseline gap-2">
                                <h5 class="text-5xl font-light text-[#CCCCCC] tracking-tighter">3.8%</h5>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="w-[1px] h-full bg-[#333333] mx-4"></div>

            <div class="w-[55%] h-full flex flex-col pl-12 pt-10 border-t border-[#333333]">
                <div class="flex justify-between items-end mb-6">
                    <h3 class="text-xl text-[#C3E86C] font-normal">Market Position Chart</h3>
                    <div class="flex gap-4">
                        <div class="flex items-center gap-2">
                            <div class="w-3 h-3 rounded-full bg-[#C3E86C]"></div>
                            <p class="text-xs text-[#808080]">Market Reach</p>
                        </div>
                    </div>
                </div>

                <div id="mainChart" class="w-full h-full"></div>
            </div>
        </div>
        
        </div>

    <script type="text/javascript">
        // Initialize ECharts
        var chartDom = document.getElementById('mainChart');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            backgroundColor: 'transparent',
            grid: {
                top: '15%',
                left: '0%',
                right: '5%',
                bottom: '10%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['Competitor A', 'Competitor B'],
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: {
                    color: '#808080',
                    fontSize: 14,
                    padding: [10, 0, 0, 0],
                    fontFamily: 'Noto Sans SC'
                }
            },
            yAxis: {
                type: 'value',
                splitLine: {
                    lineStyle: {
                        color: '#333333',
                        type: 'dashed',
                        width: 1
                    }
                },
                axisLabel: {
                    color: '#666666',
                    fontFamily: 'Noto Sans SC'
                }
            },
            series: [
                {
                    name: 'Reach',
                    data: [130000, 125000],
                    type: 'bar',
                    barWidth: '55%',
                    itemStyle: {
                        color: '#C3E86C',
                        borderRadius: [6, 6, 0, 0],
                        shadowColor: 'rgba(195, 232, 108, 0.2)',
                        shadowBlur: 20
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 30,
                            shadowColor: 'rgba(195, 232, 108, 0.5)'
                        }
                    },
                    // Adding labels on top for clarity
                    label: {
                        show: false
                    }
                }
            ],
            animation: false // Disable animation as per requirements
        };

        option && myChart.setOption(option);
    </script>
</body>
</html>
