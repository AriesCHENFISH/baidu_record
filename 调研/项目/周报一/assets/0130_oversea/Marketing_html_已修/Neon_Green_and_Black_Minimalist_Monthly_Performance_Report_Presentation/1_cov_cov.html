<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Performance Report Cover</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Artistic Serif Font for "Performance" */
        .font-display {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }

        /* Fine Grid Background */
        .bg-fine-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(51, 51, 51, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 51, 51, 0.5) 1px, transparent 1px);
            background-size: 80px 80px; /* Wider grid for cleaner look */
            opacity: 0.15;
            z-index: 0;
        }

        /* Abstract Graphic: Glowing Ascent Line */
        .graphic-line {
            position: absolute;
            width: 2px;
            height: 400px;
            background: linear-gradient(to top, transparent, #C3E86C, transparent);
            right: 200px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 20px rgba(195, 232, 108, 0.4);
        }

        .graphic-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
        }

        .graphic-circle-inner {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid rgba(195, 232, 108, 0.3);
            border-radius: 50%;
            right: 110px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="bg-fine-grid"></div>
        
        <div class="graphic-line"></div> <div class="graphic-circle"></div> <div class="graphic-circle-inner"></div> <div class="absolute top-0 left-0 w-full px-16 pt-12 pb-6 z-10">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-[#C3E86C] flex items-center justify-center text-black font-bold text-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h4 class="text-sm tracking-widest font-medium uppercase text-white">Rimberio Marketing</h4>
            </div>
        </div>

        <div class="absolute top-0 left-0 h-full flex flex-col justify-center px-16 z-20">
            
            <div class="flex items-center gap-4 mb-6 text-[#808080] text-xs font-bold tracking-[0.2em] uppercase">
                <span>August 2025</span>
                <span class="w-8 h-[1px] bg-[#333]"></span>
                <span>Monthly Review</span>
            </div>

            <h1 class="text-white leading-tight">
                <span class="block text-8xl font-bold tracking-tighter mb-2">PERFORMANCE</span>
                <div class="flex items-center gap-6">
                     <span class="block w-16 h-1 bg-[#C3E86C]"></span>
                     <span class="block text-8xl font-display font-light italic text-[#C3E86C]">Report</span>
                </div>
            </h1>

            <p class="mt-8 text-[#CCCCCC] text-lg font-light max-w-md leading-relaxed border-l border-[#333] pl-6">
                Comprehensive analysis of key metrics, audience growth, and strategic insights for the upcoming quarter.
            </p>
        </div>

        <div class="absolute bottom-12 left-16 z-20">
             <div class="flex items-center gap-2 text-[#666666] text-xs uppercase tracking-widest">
                <span>Prepared By</span>
            </div>
            <p class="text-white text-base font-medium mt-1">Hannah Morales</p>
        </div>

        <div class="absolute bottom-12 right-16 z-20 flex flex-col items-end gap-1">
            <div class="flex gap-1">
                <div class="w-1 h-1 bg-[#C3E86C]"></div>
                <div class="w-1 h-1 bg-[#C3E86C] opacity-50"></div>
                <div class="w-1 h-1 bg-[#C3E86C] opacity-20"></div>
            </div>
            <span class="text-[#666] text-[10px] tracking-widest uppercase">Confidential</span>
        </div>

    </div>

</body>
</html>
