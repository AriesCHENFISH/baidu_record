<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Rimberio Marketing</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            color: #FFFFFF;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Serif font for the artistic title */
        .title-serif {
            font-family: 'Times New Roman', serif;
            font-weight: 400;
        }

        /* Mimicking the stylized T and Y */
        .swash-letter {
            font-style: italic;
            margin-right: -0.05em;
        }

        /* Gradient Mesh Background Decoration */
        .bg-mesh {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="bg-mesh bg-[#C3E86C]" style="top: -200px; right: -100px;"></div>
        <div class="bg-mesh bg-white" style="bottom: -300px; left: -200px; opacity: 0.03;"></div>

        <div class="relative z-10 w-full h-full flex flex-col justify-between px-20 py-12">
            
            <header class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-[#C3E86C] flex items-center justify-center text-black font-bold text-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h4 class="text-sm tracking-widest font-medium uppercase text-white">Rimberio Marketing</h4>
            </header>

            <main class="flex-grow flex flex-col justify-center mt-4">
                
                <div class="w-full text-center mb-16">
                    <h1 class="text-white text-[160px] leading-none title-serif tracking-tight">
                        <span class="swash-letter">T</span>hank <span class="swash-letter ml-4">Y</span>ou
                    </h1>
                </div>

                <div class="grid grid-cols-2 gap-x-32 w-full px-8">
                    
                    <div class="flex flex-col gap-10">
                        <div class="flex flex-col gap-2">
                            <h4 class="text-[#C3E86C] text-sm font-semibold uppercase tracking-wider mb-1">Address</h4>
                            <p class="text-white text-2xl font-light leading-relaxed">
                                123 Anywhere St.,<br>
                                Any City, ST 12345
                            </p>
                        </div>

                        <div class="flex flex-col gap-2">
                            <h4 class="text-[#C3E86C] text-sm font-semibold uppercase tracking-wider mb-1">Phone</h4>
                            <p class="text-white text-3xl font-light tracking-wide">
                                +123 - 456 - 7890
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col gap-10">
                        <div class="flex flex-col gap-2">
                            <h4 class="text-[#C3E86C] text-sm font-semibold uppercase tracking-wider mb-1">Social Media & Website</h4>
                            <ul class="flex flex-col gap-1">
                                <li class="text-white text-2xl font-light">@reallygreatsite</li>
                                <li class="text-white text-2xl font-light">www.reallygreatsite.com</li>
                            </ul>
                        </div>

                        <div class="flex flex-col gap-2">
                            <h4 class="text-[#C3E86C] text-sm font-semibold uppercase tracking-wider mb-1">Email</h4>
                            <p class="text-white text-2xl font-light">
                                hello@reallygreatsite.com
                            </p>
                        </div>
                    </div>
                </div>

            </main>

            </div>
    </div>

</body>
</html>
