<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Plan Presentation - Redesign</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Page Container */
        #page_container {
            width: 1280px; height: 720px;
            background-color: #050505;
            position: relative; overflow: hidden;
            margin: 0 auto;
        }

        /* Colors & Gradients */
        .text-gradient {
            background: linear-gradient(135deg, #A962E3, #C98BF2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, #A962E3, #C98BF2);
        }

        /* Typography Effects */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.15);
        }
        .text-outline-strong {
            color: transparent;
            -webkit-text-stroke: 1px rgba(169, 98, 227, 0.5);
        }

        /* Background Effects */
        .ambient-glow {
            position: absolute;
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(169, 98, 227, 0.15) 0%, rgba(5, 5, 5, 0) 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .grid-mesh {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            mask-image: linear-gradient(to bottom right, black, transparent);
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="ambient-glow"></div>
        <div class="grid-mesh"></div>
        
        <div class="absolute top-[-100px] right-[-100px] w-[500px] h-[500px] bg-[#A962E3] opacity-10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-100px] left-[-100px] w-[400px] h-[400px] bg-[#C98BF2] opacity-5 blur-[100px] rounded-full"></div>

        <div class="absolute top-10 right-10 z-0 select-none">
            <h1 class="text-[180px] font-black leading-none text-outline opacity-20 transform -rotate-12 tracking-tighter" style="-webkit-text-stroke: 2px rgba(255,255,255,0.05);">
                2025
            </h1>
        </div>


        <div class="relative z-10 w-full h-full flex flex-col justify-between p-16">
            
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-gradient-primary flex items-center justify-center shadow-[0_0_15px_rgba(169,98,227,0.4)]">
                        <i class="fa-solid fa-layer-group text-white text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-white font-bold tracking-wider text-lg">LARANA</h3>
                        <p class="text-[#B0A8C8] text-[10px] uppercase tracking-[0.2em]">Creative Agency</p>
                    </div>
                </div>

                <div class="glass-card px-4 py-1.5 rounded-full flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-[#A962E3] animate-pulse"></div>
                    <span class="text-white text-xs font-mono tracking-widest">DEC 2025</span>
                </div>
            </div>


            <div class="flex flex-col justify-center flex-1 pl-10 relative">
                <div class="absolute left-0 top-[35%] w-1 h-32 bg-gradient-to-b from-[#A962E3] to-transparent rounded-full"></div>

                <h1 class="text-[140px] font-black text-outline leading-[0.85] tracking-tight opacity-40 select-none absolute top-[28%] left-[45px] z-0 blur-[1px]">
                    MARKETING
                </h1>

                <div class="relative z-10">
                    <h2 class="text-[#B0A8C8] text-xl font-medium tracking-[0.5em] uppercase mb-2 pl-2">Annual Strategy</h2>
                    <h1 class="text-9xl font-black text-white leading-[0.9] tracking-tight drop-shadow-2xl">
                        MARKETING <br>
                        <span class="text-gradient">PLAN</span>
                    </h1>
                </div>

                <p class="text-[#B0A8C8] text-lg font-light mt-8 max-w-xl pl-2 leading-relaxed border-l border-[#ffffff20] ml-2 pl-6">
                    Comprehensive analysis and strategic roadmap for maximizing brand growth and market penetration in Q1-Q4.
                </p>
            </div>


            <div class="flex justify-between items-end">
                
                <div class="glass-card pl-2 pr-10 py-2 rounded-2xl flex items-center gap-5 transition-transform hover:-translate-y-1 duration-500">
                    <div class="w-14 h-14 rounded-xl overflow-hidden relative border border-[#ffffff20]">
                        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover opacity-90" alt="User">
                        <div class="absolute inset-0 bg-gradient-to-tr from-[#A962E3] to-transparent opacity-20 mix-blend-overlay"></div>
                    </div>
                    
                    <div class="flex flex-col justify-center">
                        <p class="text-[#B0A8C8] text-[10px] uppercase tracking-widest mb-1">Presented By</p>
                        <p class="text-white text-lg font-bold">Remy Marsh</p>
                    </div>
                </div>

                <div class="flex items-center gap-1 mb-4 opacity-50">
                    <div class="w-16 h-[1px] bg-white"></div>
                    <div class="w-2 h-[1px] bg-white"></div>
                    <div class="w-2 h-[1px] bg-white"></div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
