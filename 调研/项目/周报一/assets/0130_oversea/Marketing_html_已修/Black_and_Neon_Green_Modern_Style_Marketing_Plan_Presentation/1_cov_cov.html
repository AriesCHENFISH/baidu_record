<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Plan Keynote Refactored</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#FFFFFF',      /* 纯白背景提升通透感 */
                        primary: '#111111', /* 近似纯黑 */
                        secondary: '#666666',
                        accent: '#E5E5E5',  /* 浅灰线条 */
                        darkblock: '#1A1A1A' /* 右下角深色块 */
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'Roboto', 'sans-serif'],
                    },
                    letterSpacing: {
                        'tighter': '-0.05em',
                        'widest': '0.25em',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .page_container {
            width: 1280px;
            height: 720px;
            background-color: #F0F0F0;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); /* 仅用于预览时的轻微投影 */
        }

        /* 装饰性网格背景 */
        .bg-grid-pattern {
            background-image: linear-gradient(#F5F5F5 1px, transparent 1px),
                              linear-gradient(90deg, #F5F5F5 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 巨大的标题排版 */
        .text-super {
            font-size: 7.5rem;
            line-height: 0.8;
            font-weight: 800;
            letter-spacing: -0.04em;
        }
    </style>
</head>
<body>

    <div class="page_container flex">
        
        <div class="w-[65%] h-full flex flex-col justify-between p-14 relative z-10 bg-white">
            
            <header class="flex justify-between items-center border-b-2 border-primary pb-6">
                <div class="flex items-center gap-4">
                    <div class="text-3xl text-primary animate-spin-slow">
                        <i class="fa-solid fa-asterisk"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold tracking-widest uppercase text-primary">Warner & Spencer</h3>
                        <p class="text-xs text-secondary tracking-widest uppercase">Global Strategy</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="block text-4xl font-light text-primary font-mono">2040</span>
                </div>
            </header>

            <main class="flex-grow flex flex-col justify-center py-10">
                <div class="relative">
                    <div class="absolute -top-12 left-1">
                        <span class="bg-primary text-white text-xs px-2 py-1 uppercase tracking-widest font-bold">Keynote 01</span>
                    </div>
                    
                    <h1 class="text-super text-primary uppercase">
                        Marketing
                    </h1>
                    <h1 class="text-super text-transparent bg-clip-text bg-gradient-to-br from-gray-400 to-gray-100 uppercase" style="-webkit-text-stroke: 2px #111;">
                        Plan
                    </h1>
                    
                    <div class="mt-10 flex items-center gap-4">
                        <div class="h-[2px] w-24 bg-primary"></div>
                        <i class="fa-solid fa-arrow-right text-2xl text-primary"></i>
                        <p class="text-sm text-secondary max-w-xs leading-relaxed ml-4">
                            A comprehensive guide to our strategic vision and operational framework for the next fiscal year.
                        </p>
                    </div>
                </div>
            </main>

            <footer class="flex justify-between items-end">
                <div class="flex flex-col">
                    <span class="text-xs text-secondary uppercase tracking-widest mb-1">Status</span>
                    <span class="text-sm font-bold border border-primary px-3 py-1 inline-block">CONFIDENTIAL</span>
                </div>
                <span class="text-9xl text-gray-100 font-bold absolute bottom-[-20px] left-[40%] pointer-events-none opacity-50">01</span>
            </footer>
        </div>

        <div class="w-[35%] h-full flex flex-col border-l border-gray-200">
            
            <div class="flex-grow relative overflow-hidden group bg-gray-100">
                <img 
                    src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=987&auto=format&fit=crop" 
                    alt="Cover Visual" 
                    class="w-full h-full object-cover grayscale brightness-110 contrast-125 transition-all duration-1000 group-hover:scale-105 group-hover:grayscale-0"
                >
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent opacity-60"></div>
                <div class="absolute top-6 right-6 text-white text-2xl mix-blend-overlay">
                    <i class="fa-solid fa-location-arrow transform rotate-45"></i>
                </div>
            </div>

            <div class="bg-darkblock h-[240px] p-8 flex flex-col justify-center text-white relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-gray-500 to-gray-800"></div>

                <h4 class="text-xs text-gray-400 uppercase tracking-[0.3em] mb-6 border-b border-gray-700 pb-2">Contact Info</h4>
                
                <div class="space-y-5">
                    <div class="flex items-center justify-between group cursor-pointer">
                        <span class="text-sm font-bold text-gray-300 group-hover:text-white transition-colors">T.</span>
                        <span class="text-sm font-mono text-gray-400 group-hover:text-white transition-colors">+123-456-7890</span>
                    </div>

                    <div class="flex items-center justify-between group cursor-pointer">
                        <span class="text-sm font-bold text-gray-300 group-hover:text-white transition-colors">W.</span>
                        <span class="text-sm font-mono text-gray-400 group-hover:text-white transition-colors">reallygreatsite.com</span>
                    </div>

                    <div class="flex items-start justify-between group cursor-pointer pt-1">
                        <span class="text-sm font-bold text-gray-300 group-hover:text-white transition-colors">A.</span>
                        <span class="text-sm font-mono text-gray-400 text-right w-40 group-hover:text-white transition-colors leading-tight">
                            123 Anywhere St.,<br>Any City, ST 12345
                        </span>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
