<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warner & Spencer - TOC Minimalist</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F0F0F0;
            color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }
        .hover-indent {
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .hover-indent:hover {
            padding-left: 1.5rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex">
        
        <aside class="w-24 border-r border-black flex flex-col justify-between items-center py-12">
            <span class="text-xs font-bold tracking-widest uppercase">Index</span>
            <div class="vertical-text text-[10px] font-bold tracking-[0.5em] uppercase opacity-30">
                Warner & Spencer — Autumn Campaign 2040
            </div>
            <span class="text-xs font-bold">02</span>
        </aside>

        <main class="flex-1 flex flex-col">
            
            <section class="h-1/3 border-b border-black flex items-end p-16">
                <h1 class="text-[120px] font-black leading-none tracking-tighter uppercase">
                    Contents
                </h1>
            </section>

            <section class="flex-1 grid grid-cols-2">
                <div class="border-r border-black p-16 flex flex-col justify-between">
                    <div class="space-y-8">
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">01</span>
                            <h2 class="text-3xl font-bold uppercase">Campaign Goals</h2>
                        </div>
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">02</span>
                            <h2 class="text-3xl font-bold uppercase">Branding identity</h2>
                        </div>
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">03</span>
                            <h2 class="text-3xl font-bold uppercase">Schedule</h2>
                        </div>
                    </div>
                    <div class="text-[10px] font-bold uppercase tracking-widest leading-loose">
                        Strategic Planning / Part A<br>
                        Focus: Market Penetration
                    </div>
                </div>

                <div class="p-16 flex flex-col justify-between">
                    <div class="space-y-8">
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">04</span>
                            <h2 class="text-3xl font-bold uppercase">Budget Allocation</h2>
                        </div>
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">05</span>
                            <h2 class="text-3xl font-bold uppercase">Channel Mix</h2>
                        </div>
                        <div class="group hover-indent cursor-pointer flex items-baseline gap-4">
                            <span class="text-xs font-black italic opacity-40">06</span>
                            <h2 class="text-3xl font-bold uppercase">KPI Metrics</h2>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-end">
                        <div class="text-right">
                            <p class="text-[10px] font-bold uppercase tracking-widest opacity-40 mb-2">Released</p>
                            <p class="text-sm font-black uppercase">August 2040</p>
                        </div>
                        <div class="w-12 h-12 bg-black rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-arrow-right text-white -rotate-45"></i>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
