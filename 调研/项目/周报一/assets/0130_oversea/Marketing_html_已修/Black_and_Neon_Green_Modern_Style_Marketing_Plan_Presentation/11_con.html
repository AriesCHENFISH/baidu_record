<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis Refactored</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#E5E5E5',
                        primary: '#0F0F0F',
                        secondary: '#555555',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container {
            width: 1280px;
            height: 720px;
            background-color: #F0F0F0;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* 左宽右窄 */
            gap: 2px; /* 细微缝隙形成网格线 */
            border: 12px solid #E5E5E5; /* 外部留白框 */
        }
        .img-grayscale { filter: grayscale(100%) contrast(120%); }
    </style>
</head>
<body>

    <div class="page_container">
        
        <div class="bg-white p-12 flex flex-col justify-between h-full relative">
            
            <div class="flex justify-between items-start border-b-4 border-primary pb-6">
                <div>
                    <span class="text-xs font-bold uppercase tracking-[0.3em] text-secondary">Q3 Report</span>
                    <h2 class="text-4xl font-black uppercase tracking-tighter mt-2 text-primary">Market<br>Growth</h2>
                </div>
                <div class="w-12 h-12 bg-primary flex items-center justify-center rounded-full text-white">
                    <i class="fa-solid fa-chart-simple"></i>
                </div>
            </div>

            <div class="flex flex-col justify-center flex-grow">
                <span class="text-[180px] leading-none font-black tracking-tighter text-primary -ml-2">
                    84<span class="text-6xl text-gray-400 align-top ml-2">%</span>
                </span>
                <p class="text-sm font-medium text-secondary mt-4 w-3/4 leading-relaxed">
                    Significant increase in user acquisition following the deployment of the "Alpha" strategy across Asian markets.
                </p>
            </div>

            <div class="grid grid-cols-2 gap-8 border-t border-gray-200 pt-8">
                <div>
                    <span class="block text-2xl font-bold text-primary">2.4M</span>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-secondary">Active Users</span>
                </div>
                <div>
                    <span class="block text-2xl font-bold text-primary">+12%</span>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-secondary">Retention Rate</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-2 h-full">
            
            <div class="flex-grow relative overflow-hidden bg-black group h-1/2">
                <img src="https://images.unsplash.com/photo-1550534791-2677533605ab?q=80&w=800&auto=format&fit=crop" 
                     class="w-full h-full object-cover img-grayscale opacity-80 group-hover:scale-105 transition-transform duration-700">
                <div class="absolute bottom-6 left-6">
                    <span class="bg-white text-primary px-3 py-1 text-[10px] font-bold uppercase tracking-widest">Visual Data</span>
                </div>
            </div>

            <div class="h-1/3 bg-primary p-10 flex flex-col justify-center relative">
                <div class="absolute top-4 right-4 text-white opacity-20 text-4xl">
                    <i class="fa-solid fa-quote-right"></i>
                </div>
                
                <p class="text-gray-300 text-lg font-light italic leading-normal mb-6">
                    "Data is not just numbers; it's the heartbeat of our strategic direction."
                </p>
                
                <div class="flex items-center gap-4">
                    <div class="w-8 h-[1px] bg-white"></div>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-white">Chief Analyst</span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
