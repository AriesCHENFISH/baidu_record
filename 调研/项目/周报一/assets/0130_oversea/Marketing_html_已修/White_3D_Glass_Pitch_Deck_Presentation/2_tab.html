<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgBase: '#F4F8F9',
                        textPrimary: '#333333',
                        textSecondary: '#555555',
                        textMuted: '#777777',
                        tealAccent: '#BDE0E2',
                        divider: '#2F2F2F',
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        #page_container { width: 1280px; height: 720px; background-color: #F4F8F9; margin: 0 auto; overflow: hidden; position: relative; }
        /* subtle background elements */
        .bg-shape-1 { position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, #E0EFF3 0%, transparent 70%); opacity: 0.6; }
        .bg-shape-2 { position: absolute; bottom: -100px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #E0EFF3 0%, transparent 70%); opacity: 0.4; }
        
        /* TOC Item Style */
        .toc-num { font-size: 2.5rem; font-weight: 800; color: #BDE0E2; line-height: 1; margin-right: 1rem; }
        .toc-item { display: flex; align-items: baseline; padding-bottom: 1.5rem; border-bottom: 1px solid #E5E7EB; }
        .toc-title { font-size: 1.25rem; font-weight: 700; color: #333333; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>

        <div class="relative z-10 p-16 h-full flex flex-col">
            <div class="mb-12">
                <h1 class="text-5xl font-bold text-textPrimary tracking-tight mb-4">Table of Contents</h1>
                <div class="w-16 h-1 bg-divider"></div>
            </div>

            <div class="grid grid-cols-2 gap-x-20 gap-y-4 flex-grow align-start">
                
                <div class="flex flex-col justify-start gap-6">
                    <div class="toc-item">
                        <span class="toc-num">01</span>
                        <span class="toc-title">Executive Summary</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">02</span>
                        <span class="toc-title">Market Opportunity</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">03</span>
                        <span class="toc-title">The Problem Statement</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">04</span>
                        <span class="toc-title">Our Solution & Roadmap</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">05</span>
                        <span class="toc-title">Core Competencies</span>
                    </div>
                </div>

                <div class="flex flex-col justify-start gap-6">
                    <div class="toc-item">
                        <span class="toc-num">06</span>
                        <span class="toc-title">Strategic Pillars</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">07</span>
                        <span class="toc-title">Financial Projection</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">08</span>
                        <span class="toc-title">Key Case Studies</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">09</span>
                        <span class="toc-title">Risk Management</span>
                    </div>
                    <div class="toc-item">
                        <span class="toc-num">10</span>
                        <span class="toc-title">Conclusion & Next Steps</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
