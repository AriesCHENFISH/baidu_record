<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck Presentation - Salford & Co.</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #F4F8F9;
        }

        /* Typography Enhancements */
        .main-title {
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        /* Abstract Background Shapes */
        .bg-shape-1 {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(189, 224, 226, 0.4) 0%, rgba(244, 248, 249, 0) 70%);
            top: -300px;
            left: -200px;
            z-index: 0;
        }

        .bg-shape-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 239, 243, 0.6) 0%, rgba(244, 248, 249, 0) 70%);
            bottom: -150px;
            left: 50px;
            z-index: 0;
        }
        
        /* Custom Text Gradient */
        .text-gradient {
            background: linear-gradient(90deg, #333333 60%, #707070 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>

        <div class="absolute inset-0 z-10 grid grid-cols-12 h-full">
            
            <div class="col-span-7 pl-[100px] pr-[40px] flex flex-col justify-center h-full relative">
                
                <div class="mb-8">
                    <span class="inline-block px-4 py-1.5 rounded-full border border-gray-300 bg-white/50 backdrop-blur-sm text-xs font-bold tracking-[0.2em] text-gray-500 uppercase">
                        Strategic Overview
                    </span>
                </div>

                <div class="mb-8 relative">
                    <h1 class="text-[100px] font-bold main-title text-gradient">
                        Pitch Deck
                    </h1>
                    <h1 class="text-[100px] font-bold main-title text-[#333333]">
                        Presentation<span class="text-[#BDE0E2]">.</span>
                    </h1>
                </div>

                <div class="w-[140px] h-[4px] bg-gradient-to-r from-[#333333] to-[#BDE0E2] mb-10 rounded-full"></div>

                <div class="max-w-lg">
                    <h4 class="text-[#333333] text-2xl font-bold mb-2">
                        Salford & Co.
                    </h4>
                    <p class="text-[#777777] text-lg font-light leading-relaxed">
                        Simplifying finance through innovative digital solutions and data-driven strategies for the modern era.
                    </p>
                </div>

            </div>

            <div class="col-span-5 relative h-full flex items-center justify-center">
                <div class="w-[700px] h-[700px] absolute right-[-150px] top-[50%] translate-y-[-50%] overflow-hidden z-20"
                     style="border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; box-shadow: -30px 0px 60px -10px rgba(189, 224, 226, 0.2);">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" 
                         alt="Abstract 3D Liquid Art" 
                         class="w-full h-full object-cover opacity-90 contrast-110">
                    
                    <div class="absolute inset-0 bg-gradient-to-tr from-[#BDE0E2]/20 to-transparent mix-blend-overlay"></div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-[60px] left-[100px] z-30">
            <p class="text-[#777777] text-xs font-bold tracking-widest uppercase mb-1">Presented by</p>
            <p class="text-[#333333] text-xl font-bold">Alex Morgan</p>
        </div>

        <div class="absolute bottom-[60px] right-[80px] z-30 flex flex-col items-end">
            <div class="h-[1px] w-12 bg-[#333333] mb-2"></div>
            <p class="text-[#333333] text-xl font-bold tracking-widest font-mono">
                01/2026
            </p>
        </div>

    </div>

</body>
</html>
