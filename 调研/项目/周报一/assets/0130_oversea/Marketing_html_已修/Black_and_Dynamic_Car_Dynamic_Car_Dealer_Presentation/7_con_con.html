<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Portfolio - Automotive Keynote</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#CA4927', bgDark: '#101216', textMain: '#E6E6E6', textSec: '#A0A0A0', accent: '#E86A45', sidebar: '#1C0A06', line: '#4D5055' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #101216; position: relative; margin: 0 auto; overflow: hidden; display: flex; }
        .skew-container { transform: skewX(-15deg); overflow: hidden; position: relative; border-radius: 4px; border-left: 3px solid #CA4927; border-right: 1px solid #4D5055; box-shadow: 10px 10px 30px rgba(0,0,0,0.5); }
        .skew-image { width: 140%; height: 100%; object-fit: cover; transform: skewX(15deg) translateX(-15%); }
        .text-glow { text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="page_container">
        <aside class="h-full w-[80px] bg-[#1C0A06] flex flex-col items-center py-8 z-20 border-r border-[#4D5055] shrink-0">
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-house text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-lock text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-warehouse text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-car text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-screwdriver-wrench text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 relative bg-gradient-to-r from-[#CA4927] to-transparent">
                <div class="absolute left-0 top-0 bottom-0 w-[4px] bg-[#E86A45]"></div>
                <i class="fa-solid fa-image text-2xl text-[#E6E6E6]"></i>
            </div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-user-group text-2xl"></i></div>
            <div class="mt-auto w-full flex flex-col items-center">
                <div class="py-4 text-[#A0A0A0]"><i class="fa-solid fa-gear text-2xl"></i></div>
            </div>
        </aside>

        <div class="flex-1 h-full relative p-10 pl-16 flex flex-col justify-between">
            <div class="absolute top-0 right-0 w-[400px] h-[400px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
            <header class="flex items-center space-x-3 mb-4">
                <div class="w-8 h-8 bg-primary rounded flex items-center justify-center text-white font-bold text-sm">B</div>
                <h2 class="text-primary font-bold text-xl tracking-widest uppercase italic">BORCELLE</h2>
            </header>

            <div class="flex-1 flex items-center justify-between space-x-6 pr-8 mt-2">
                <div class="flex flex-col w-1/4 h-[420px] justify-end pb-8">
                    <div class="skew-container h-[280px] w-full mb-4 group relative">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1000&auto=format&fit=crop" class="skew-image">
                    </div>
                    <div class="pl-2"><h3 class="text-2xl font-bold italic"><span class="text-primary mr-2">01</span><span class="text-textMain font-light tracking-wide">First Car</span></h3></div>
                </div>
                <div class="flex flex-col w-1/4 h-[420px] justify-start pt-4">
                    <div class="pl-6 mb-4"><h3 class="text-2xl font-bold italic"><span class="text-primary mr-2">02</span><span class="text-textMain font-light tracking-wide">Second Car</span></h3></div>
                    <div class="skew-container h-[280px] w-full border-l-0 border-r-[3px] border-r-primary border-l-[1px] border-l-line">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1560958089-b8a1929cea89?q=80&w=1000&auto=format&fit=crop" class="skew-image">
                    </div>
                </div>
                <div class="flex flex-col w-1/4 h-[420px] justify-end pb-8">
                    <div class="skew-container h-[280px] w-full"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1544636331-e26879cd4d9b?q=80&w=1000&auto=format&fit=crop" class="skew-image">
                    </div>
                    <div class="pl-2"><h3 class="text-2xl font-bold italic"><span class="text-primary mr-2">03</span><span class="text-textMain font-light tracking-wide">Third Car</span></h3></div>
                </div>
                <div class="flex flex-col w-1/4 h-[420px] justify-start pt-4">
                    <div class="pl-6 mb-4"><h3 class="text-2xl font-bold italic"><span class="text-primary mr-2">04</span><span class="text-textMain font-light tracking-wide">Fourth Car</span></h3></div>
                    <div class="skew-container h-[280px] w-full border-l-0 border-r-[3px] border-r-primary border-l-[1px] border-l-line">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1000&auto=format&fit=crop" class="skew-image">
                    </div>
                </div>
            </div>

            <footer class="flex items-end justify-between mt-4 border-t border-line/20 pt-6">
                <div class="w-1/2"><h1 class="text-6xl font-black italic text-primary tracking-tighter uppercase text-glow">PORTFOLIO</h1></div>
                <div class="w-1/2 pl-12"><p class="text-textSec text-sm leading-relaxed text-right font-light">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed consectetur risus eget placerat venenatis. Phasellus faucibus nibh sit amet diam maximus, nec varius velit luctus. Engineered for perfection.</p></div>
            </footer>
        </div>
    </div>
</body>
</html>
