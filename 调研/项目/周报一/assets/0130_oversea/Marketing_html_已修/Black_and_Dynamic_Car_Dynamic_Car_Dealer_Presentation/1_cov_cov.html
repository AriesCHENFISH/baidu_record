<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealer Pitch Deck</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#CA4927', bgDark: '#101216', textMain: '#E6E6E6', textSec: '#A0A0A0', accent: '#E86A45', divider: '#4D5055', sidebarBg: '#1C0A06' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .clip-slant { clip-path: polygon(20% 0, 100% 0, 100% 100%, 0% 100%); }
    </style>
</head>
<body>
    <div id="page_container" class="w-[1280px] h-[720px] mx-auto relative bg-bgDark overflow-hidden flex">
        <aside class="w-[80px] h-full bg-[#1C0A06] border-r border-[#4D5055] z-20 flex flex-col items-center py-8 shrink-0">
            <nav class="w-full">
                <ul class="flex flex-col gap-7 items-center w-full">
                    <li class="w-full flex justify-center py-4 relative bg-gradient-to-r from-[#CA4927]/20 to-transparent">
                        <div class="absolute left-0 top-0 bottom-0 w-[4px] bg-[#E86A45]"></div>
                        <i class="fa-solid fa-house text-primary text-2xl"></i>
                    </li>
                    <li class="w-full flex justify-center"><i class="fa-solid fa-lock text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-solid fa-warehouse text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-solid fa-car text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-solid fa-screwdriver-wrench text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-regular fa-images text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-solid fa-users text-textSec text-xl"></i></li>
                    <li class="w-full flex justify-center"><i class="fa-regular fa-comments text-textSec text-xl"></i></li>
                </ul>
            </nav>
            <div class="mt-auto py-2 text-textSec"><i class="fa-solid fa-table-columns text-xl"></i></div>
        </aside>

        <main class="flex-1 relative">
            <div class="absolute inset-0">
                <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=1200&auto=format&fit=crop" class="w-full h-full object-cover opacity-90">
                <div class="absolute inset-0 bg-gradient-to-b from-bgDark/30 via-transparent to-bgDark"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-bgDark/80 via-transparent to-bgDark/20"></div>
            </div>

            <header class="absolute top-0 left-0 w-full h-[100px] flex justify-between items-center px-16 z-10">
                <div><h6 class="text-textSec text-xs tracking-[0.2em] font-medium uppercase border-l-2 border-primary pl-3">Pitch Deck 2025</h6></div>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-primary rounded flex items-center justify-center text-white font-bold text-sm shadow-lg"><i class="fa-solid fa-b"></i></div>
                    <h3 class="text-primary text-xl font-bold tracking-wider italic">BORCELLE</h3>
                </div>
            </header>

            <div class="absolute bottom-0 left-0 w-full h-[240px] flex items-end justify-between px-16 pb-16 z-10">
                <div class="flex-1 max-w-[600px]">
                    <h1 class="text-primary text-[100px] leading-[0.9] font-black italic uppercase tracking-tighter" style="text-shadow: 0 10px 30px rgba(0,0,0,0.5);">Car <br>Dealer</h1>
                    <div class="w-24 h-1 bg-accent mt-6"></div>
                </div>
                <div class="w-[450px] mb-4">
                    <p class="text-textMain text-base font-light leading-relaxed mb-4 text-justify">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed consectetur risus eget placerat venenatis. Phasellus faucibus nibh sit amet diam.</p>
                    <ul class="flex gap-4 border-t border-divider pt-4">
                        <li class="text-textSec text-xs uppercase tracking-wider"><i class="fa-solid fa-bolt text-accent mr-1"></i> Performance</li>
                        <li class="text-textSec text-xs uppercase tracking-wider"><i class="fa-solid fa-shield-halved text-accent mr-1"></i> Reliability</li>
                    </ul>
                </div>
            </div>

            <div class="absolute bottom-0 right-0 z-20">
                <div class="absolute bottom-0 right-0 w-[120px] h-[180px] bg-primary/80 clip-slant transform translate-x-8"></div>
                <div class="absolute bottom-0 right-[40px] w-[60px] h-[180px] bg-accent/90 clip-slant mix-blend-overlay"></div>
            </div>
        </main>
    </div>
</body>
</html>
