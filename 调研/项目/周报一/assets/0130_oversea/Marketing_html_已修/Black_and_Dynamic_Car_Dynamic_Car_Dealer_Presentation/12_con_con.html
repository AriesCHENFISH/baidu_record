            <div class="relative flex items-center space-x-3">

                <h2 class="text-xl tracking-[0.2em] text-white font-bold uppercase">Borcelle</h2>

            <div class="relative flex flex-col justify-center max-w-4xl">
                <div class="absolute -left-8 top-0 bottom-0 w-1 bg-gradient-to-b from-brand to-transparent opacity-50"></div>
                <h1 class="text-[86px] leading-[0.9] font-black italic uppercase mb-8 tracking-tight">
                    <span class="text-white">Question</span> <span class="text-brand">&</span> <br>
                    <span class="text-white">Answer</span>
