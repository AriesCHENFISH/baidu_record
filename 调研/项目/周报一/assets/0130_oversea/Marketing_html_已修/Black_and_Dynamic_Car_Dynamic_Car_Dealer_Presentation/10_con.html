<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team - Premium Presentation</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#CA4927', secondary: '#E86A45', dark: '#101216', sidebar: '#1C0A06', textMain: '#E6E6E6', textSub: '#A0A0A0', divider: '#4D5055'
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #101216; position: relative; margin: 0 auto; overflow: hidden; display: flex; }
        .skew-box { transform: skewX(-12deg); transform-origin: bottom left; overflow: hidden; border-radius: 4px; }
        .unskew-content { transform: skewX(12deg) scale(1.15); transform-origin: center; }
        .unskew-text { transform: skewX(12deg); display: block; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="w-[80px] bg-[#1C0A06] flex flex-col items-center py-8 z-20 border-r border-[#4D5055] shrink-0">
            <ul class="flex flex-col gap-8 w-full items-center list-none">
                <li><i class="fa-solid fa-house text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li><i class="fa-solid fa-lock text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li><i class="fa-solid fa-warehouse text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li><i class="fa-solid fa-car text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li><i class="fa-solid fa-wrench text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li><i class="fa-solid fa-image text-textSub hover:text-white transition-colors text-xl"></i></li>
                <li class="w-full flex justify-center relative bg-gradient-to-r from-[#CA4927]/20 to-transparent py-4">
                    <div class="absolute left-0 top-0 bottom-0 w-[4px] bg-[#E86A45]"></div>
                    <i class="fa-solid fa-users text-primary text-2xl"></i>
                </li>
                <li><i class="fa-solid fa-comments text-textSub hover:text-white transition-colors text-xl"></i></li>
            </ul>
            <div class="mt-auto mb-4 text-[#A0A0A0]"><i class="fa-solid fa-gear text-2xl"></i></div>
        </div>

        <div class="flex-1 flex flex-col relative">
            <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-gradient-to-b from-primary/5 to-transparent rounded-full blur-[100px] pointer-events-none"></div>
            <div class="mt-12 mb-8 text-center relative z-10 px-20">
                <h1 class="text-5xl font-bold text-primary italic tracking-wider mb-4 uppercase" style="text-shadow: 0 4px 20px rgba(202, 73, 39, 0.4);">Our Team</h1>
                <div class="w-24 h-1 bg-gradient-to-r from-transparent via-secondary to-transparent mx-auto mb-4"></div>
                <p class="text-textSub text-sm max-w-2xl mx-auto leading-relaxed">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed consectetur risus eget placerat venenatis. Phasellus faucibus nibh sit amet diam.</p>
            </div>
            <div class="flex-1 flex justify-center items-center gap-6 px-12 pb-12">
                <div class="relative group w-64 h-[420px]">
                    <div class="w-full h-full skew-box bg-gray-800 relative shadow-2xl">
                        <div class="w-full h-[85%] overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover unskew-content filter grayscale hover:grayscale-0 transition-all duration-500">
                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-dark/90 to-transparent pointer-events-none unskew-content"></div>
                        </div>
                        <div class="absolute bottom-0 w-full h-[15%] bg-gradient-to-r from-primary to-secondary flex items-center pl-6 border-t border-white/20">
                            <div class="unskew-text">
                                <h3 class="text-white font-bold text-lg leading-tight uppercase">Aaron Loeb</h3>
                                <p class="text-black/60 font-medium text-xs uppercase">Leader</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="relative group w-64 h-[420px]">
                    <div class="w-full h-full skew-box bg-gray-800 relative shadow-2xl">
                        <div class="w-full h-[85%] overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover unskew-content filter grayscale hover:grayscale-0 transition-all duration-500">
                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-dark/90 to-transparent pointer-events-none unskew-content"></div>
                        </div>
                        <div class="absolute bottom-0 w-full h-[15%] bg-gradient-to-r from-primary to-secondary flex items-center pl-6 border-t border-white/20">
                            <div class="unskew-text"><h3 class="text-white font-bold text-lg leading-tight uppercase">Drew Feig</h3><p class="text-black/60 font-medium text-xs uppercase">Marketing</p></div>
                        </div>
                    </div>
                </div>
                <div class="relative group w-64 h-[420px]">
                    <div class="w-full h-full skew-box bg-gray-800 relative shadow-2xl">
                        <div class="w-full h-[85%] overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover unskew-content filter grayscale hover:grayscale-0 transition-all duration-500">
                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-dark/90 to-transparent pointer-events-none unskew-content"></div>
                        </div>
                        <div class="absolute bottom-0 w-full h-[15%] bg-gradient-to-r from-primary to-secondary flex items-center pl-6 border-t border-white/20">
                            <div class="unskew-text"><h3 class="text-white font-bold text-lg leading-tight uppercase">Sacha Dubois</h3><p class="text-black/60 font-medium text-xs uppercase">Employee</p></div>
                        </div>
                    </div>
                </div>
                <div class="relative group w-64 h-[420px]">
                    <div class="w-full h-full skew-box bg-gray-800 relative shadow-2xl">
                        <div class="w-full h-[85%] overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover unskew-content filter grayscale hover:grayscale-0 transition-all duration-500">
                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-dark/90 to-transparent pointer-events-none unskew-content"></div>
                        </div>
                        <div class="absolute bottom-0 w-full h-[15%] bg-gradient-to-r from-primary to-secondary flex items-center pl-6 border-t border-white/20">
                            <div class="unskew-text"><h3 class="text-white font-bold text-lg leading-tight uppercase">Juliana Silva</h3><p class="text-black/60 font-medium text-xs uppercase">Employee</p></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="absolute bottom-0 right-0 h-32 w-64 flex items-end justify-end pointer-events-none overflow-hidden">
                <div class="w-16 h-40 bg-gradient-to-t from-primary/80 to-transparent skew-box mr-2 translate-y-10"></div>
                <div class="w-10 h-24 bg-gradient-to-t from-primary/60 to-transparent skew-box mr-2 translate-y-4"></div>
            </div>
        </div>
    </div>
</body>
</html>
