<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Automotive Showcase</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { primary: '#CA4927', accent: '#E86A45', bg: '#101216', sidebar: '#1C0A06', text: '#E6E6E6', muted: '#A0A0A0', line: '#4D5055' }
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #101216; overflow: hidden; display: flex; }
        .clip-angle-tr { clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%); }
        .clip-angle-bl { clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 100%, 0 15%); }
        .clip-label { clip-path: polygon(0 0, 90% 0, 100% 100%, 0% 100%); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="h-full w-[80px] bg-[#1C0A06] flex flex-col items-center py-8 z-20 border-r border-[#4D5055]">
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-house text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-lock text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-warehouse text-2xl"></i></div>
            <div class="w-full flex justify-center py-4 mb-2 relative bg-gradient-to-r from-[#CA4927] to-transparent">
                <div class="absolute left-0 top-0 bottom-0 w-[4px] bg-[#E86A45]"></div>
                <i class="fa-solid fa-car-side text-2xl text-[#E6E6E6]"></i>
            </div>
            <div class="w-full flex justify-center py-4 mb-2 text-[#A0A0A0]"><i class="fa-solid fa-screwdriver-wrench text-2xl"></i></div>
            <div class="mt-auto w-full flex flex-col items-center">
                <div class="py-4 text-[#A0A0A0]"><i class="fa-solid fa-gear text-2xl"></i></div>
            </div>
        </div>

        <div class="flex-1 flex p-12 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-brand-primary/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4"></div>
            
            <div class="w-[38%] flex flex-col justify-center z-10 pr-8">
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-8 h-8 bg-brand-primary flex items-center justify-center rounded text-white font-bold text-lg"><i class="fa-solid fa-b"></i></div>
                    <h2 class="text-brand-primary font-bold text-xl tracking-[0.2em]">BORCELLE</h2>
                </div>
                <h1 class="text-brand-primary text-7xl font-black italic leading-[0.9] tracking-tighter mb-8 uppercase">Various Type <br><span class="text-white">Of Cars</span></h1>
                <div class="relative pl-6 border-l-2 border-brand-line/50">
                    <p class="text-brand-text text-lg font-light mb-4">Discover engineering excellence. From raw power to futuristic efficiency, our collection represents the pinnacle of motion.</p>
                </div>
            </div>

            <div class="w-[62%] h-full flex flex-col gap-6 z-10 pl-4">
                <div class="relative w-full h-[55%] group">
                    <div class="w-full h-full bg-gray-800 relative overflow-hidden clip-angle-tr shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                    </div>
                    <div class="absolute bottom-6 left-0 bg-brand-primary/90 px-8 py-2 clip-label"><span class="text-white font-bold tracking-widest text-sm uppercase">Type A</span></div>
                </div>
                <div class="flex gap-6 h-[40%]">
                    <div class="w-1/2 relative">
                        <div class="w-full h-full bg-gray-800 relative overflow-hidden clip-angle-bl"><img src="https://images.unsplash.com/photo-1606219460012-7063c638e072?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover opacity-90"></div>
                        <div class="absolute bottom-4 left-0 bg-brand-primary/90 px-6 py-1.5 clip-label"><span class="text-white font-bold tracking-widest text-xs uppercase">Type B</span></div>
                    </div>
                    <div class="w-1/2 relative">
                        <div class="w-full h-full bg-gray-800 relative overflow-hidden clip-angle-bl"><img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover opacity-90"></div>
                        <div class="absolute bottom-4 left-0 bg-brand-primary/90 px-6 py-1.5 clip-label"><span class="text-white font-bold tracking-widest text-xs uppercase">Type C</span></div>
                    </div>
                </div>
            </div>
            <div class="absolute bottom-6 right-8 text-brand-muted/30 text-xs font-mono tracking-widest">01 / 05 | COLLECTION 2024</div>
        </div>
    </div>
</body>
</html>
