<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimberio Business Model</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        /* CSS Reset & Global Refactoring */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Specific styles to override browser defaults and ensure design system compliance */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
        }

        /* Custom scrollbar hidden for presentation */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Utility for strictly linear gradients as requested */
        .bg-gradient-cyan {
            background: linear-gradient(135deg, #2A6F8F, #4FA4C1);
        }

        .bg-gradient-dark-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#050505',
                        darkAccent: '#081014',
                        cyanPrimary: '#2A6F8F',
                        cyanHighlight: '#4FA4C1',
                        textMain: '#FFFFFF',
                        textSec: '#D1D5DB',
                        borderStroke: '#555555',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container" class="w-[1280px] h-[720px] mx-auto relative bg-[#050505] overflow-hidden font-sans text-white">

        <div class="absolute -top-20 -right-20 w-[600px] h-[600px] rounded-full opacity-20 pointer-events-none" 
             style="background: linear-gradient(135deg, #2A6F8F, transparent);"></div>
        
        <div class="absolute -bottom-40 -left-20 w-[700px] h-[700px] rounded-full border border-white/5 opacity-30 pointer-events-none"
             style="background: radial-gradient(circle at center, rgba(42, 111, 143, 0.15), transparent 70%);"></div>

        <div class="relative z-10 grid grid-cols-12 gap-8 px-12 h-[580px] mt-12">
            
            <div class="col-span-5 flex flex-col justify-between h-full py-2">
                
                <div class="flex flex-col gap-6">
                    <div class="bg-gradient-dark-card border border-white/10 rounded-3xl p-8 shadow-lg">
                        <h3 class="text-2xl font-bold mb-3 text-white">Consulting Services</h3>
                        <p class="text-textSec text-gl leading-relaxed">
                            Custom business support for planning, strategy, and execution.
                        </p>
                    </div>

                    <div class="bg-gradient-cyan rounded-3xl p-8 shadow-xl shadow-cyanPrimary/20 text-[#050505]">
                        <h3 class="text-2xl font-bold mb-3">Workshops and Training</h3>
                        <p class="text-[#081014] text-gl font-medium leading-relaxed opacity-90">
                            Paid sessions for clients looking to build internal capabilities.
                        </p>
                    </div>
                </div>

                <div class="mt-auto pb-4">
                    <div class="inline-block border border-borderStroke rounded-full px-5 py-1 mb-4">
                        <span class="text-textSec font-medium tracking-wide">Rimberio</span>
                    </div>
                    <h1 class="text-7xl font-bold text-white leading-tight tracking-tight drop-shadow-lg">
                        Business<br>Model
                    </h1>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-between h-full py-2 pl-4">
                
                <div class="relative w-full h-[260px] rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80" 
                         alt="Modern skyscraper architecture representing scale and structure" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                </div>

                <div class="relative w-full h-[280px] rounded-3xl overflow-hidden shadow-2xl border border-white/10 group mt-6">
                    <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80" 
                         alt="Business team meeting in a modern office representing collaboration" 
                         class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
