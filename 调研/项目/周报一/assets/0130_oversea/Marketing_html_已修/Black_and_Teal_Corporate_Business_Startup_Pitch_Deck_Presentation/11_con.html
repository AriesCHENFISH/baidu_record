<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Analytics - Rimberio</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#050505',
                        darkGrad: '#081014',
                        cyanPrimary: '#2A6F8F',
                        cyanHighlight: '#4FA4C1',
                        textMain: '#FFFFFF',
                        textSec: '#D1D5DB',
                        borderStroke: '#333333',
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-main': 'linear-gradient(135deg, #050505, #081014)',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; position: relative;
            background-color: #050505; overflow: hidden; margin: 0 auto;
        }
        .bg-dark-card { 
            background-color: rgba(17, 17, 17, 0.6); 
            border: 1px solid #333333; 
            backdrop-filter: blur(10px);
        }
        .glow-effect {
            position: absolute; width: 1000px; height: 600px;
            background: radial-gradient(ellipse, rgba(42, 111, 143, 0.15), transparent 70%);
            bottom: -200px; left: 140px; z-index: 0; pointer-events: none;
        }
        .chart-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="page_container" class="bg-gradient-main">
        <div class="glow-effect"></div>

        <div class="relative z-10 h-full px-12 py-10 flex flex-col gap-6">
            
            <div class="flex justify-between items-end h-[60px]">
                <div>
                    <h1 class="text-5xl text-textMain font-bold">Annual <span class="text-cyanHighlight">Trajectory</span></h1>
                    <p class="text-textSec text-sm mt-1 font-light tracking-wide">Comprehensive data analysis covering Q1 - Q4 performance metrics.</p>
                </div>
                <div class="flex gap-4">
                    <div class="flex items-center gap-2 text-textSec text-sm mr-4">
                        <span class="w-3 h-3 rounded-full bg-cyanPrimary"></span> Revenue
                        <span class="w-3 h-3 rounded-full bg-cyanHighlight ml-2"></span> Growth %
                    </div>
                    <div class="bg-dark-card px-4 py-1.5 rounded-lg border border-borderStroke text-textSec text-sm">
                        <i class="fa-regular fa-calendar mr-2"></i> 2024 - 2025
                    </div>
                </div>
            </div>

            <div class="flex-1 bg-dark-card rounded-2xl p-6 border-opacity-50 relative shadow-2xl">
                <div class="absolute top-0 left-0 w-20 h-20 border-t border-l border-cyanPrimary/30 rounded-tl-2xl"></div>
                <div class="absolute bottom-0 right-0 w-20 h-20 border-b border-r border-cyanPrimary/30 rounded-br-2xl"></div>

                <div id="bigChart" class="chart-container"></div>
            </div>

        </div>
    </div>

    <script>
        // Color Palette
        const colors = {
            cyan: '#2A6F8F',
            highlight: '#4FA4C1',
            text: '#9CA3AF',
            grid: '#222222',
            bgTooltip: 'rgba(10, 10, 10, 0.9)'
        };

        // Initialize Main Chart
        const chartDom = document.getElementById('bigChart');
        const myChart = echarts.init(chartDom);
        
        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                backgroundColor: colors.bgTooltip,
                borderColor: '#333',
                textStyle: { color: '#fff' },
                axisPointer: {
                    type: 'cross',
                    label: { backgroundColor: colors.cyan }
                }
            },
            legend: { show: false }, // Custom legend in header
            grid: {
                top: '10%', left: '3%', right: '3%', bottom: '5%',
                containLabel: true
            },
            xAxis: [
                {
                    type: 'category',
                    data: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                    axisLine: { lineStyle: { color: '#444' } },
                    axisLabel: { 
                        color: colors.text,
                        fontSize: 12,
                        margin: 15
                    },
                    axisTick: { alignWithLabel: true }
                }
            ],
            yAxis: [
                {
                    type: 'value',
                    name: 'Revenue (M)',
                    nameTextStyle: { color: colors.text, padding: [0, 0, 0, 20] },
                    position: 'left',
                    splitLine: { lineStyle: { color: colors.grid, type: 'dashed' } },
                    axisLabel: { color: colors.text, formatter: '{value} M' }
                },
                {
                    type: 'value',
                    name: 'Growth (%)',
                    nameTextStyle: { color: colors.text, padding: [0, 20, 0, 0] },
                    position: 'right',
                    splitLine: { show: false },
                    axisLabel: { color: colors.text, formatter: '{value} %' }
                }
            ],
            series: [
                // Bar Chart (Revenue)
                {
                    name: 'Revenue',
                    type: 'bar',
                    barWidth: '25%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: colors.cyan },
                            { offset: 1, color: 'rgba(42, 111, 143, 0.1)' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    data: [12.5, 14.2, 16.1, 18.4, 21.5, 24.1, 23.8, 26.5, 29.2, 32.5, 34.8, 38.2]
                },
                // Line Chart (Growth)
                {
                    name: 'Growth',
                    type: 'line',
                    yAxisIndex: 1,
                    smooth: true,
                    showSymbol: false,
                    lineStyle: {
                        width: 4,
                        color: colors.highlight,
                        shadowColor: 'rgba(79, 164, 193, 0.5)',
                        shadowBlur: 10
                    },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(79, 164, 193, 0.2)' },
                            { offset: 1, color: 'rgba(79, 164, 193, 0)' }
                        ])
                    },
                    data: [5, 8, 12, 15, 18, 22, 20, 25, 28, 35, 38, 42]
                }
            ]
        };

        myChart.setOption(option);

        window.addEventListener('resize', () => {
            myChart.resize();
        });
    </script>
</body>
</html>
