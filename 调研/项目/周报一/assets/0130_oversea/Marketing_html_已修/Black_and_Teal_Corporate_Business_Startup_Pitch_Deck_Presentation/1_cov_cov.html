<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover - Rimberio</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#050505',
                        cyanPrimary: '#2A6F8F',
                        cyanHighlight: '#4FA4C1',
                        textMain: '#FFFFFF',
                        textSec: '#D1D5DB',
                        borderStroke: '#333333',
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px; position: relative;
            background-color: #050505; overflow: hidden;
            margin: 0 auto;
        }
        /* Gradient Backgrounds */
        .glow-left {
            position: absolute; top: -100px; left: -200px; width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(42,111,143,0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }
        .glow-bottom {
            position: absolute; bottom: -300px; right: -100px; width: 900px; height: 900px;
            background: radial-gradient(circle, rgba(79, 164, 193, 0.1) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }
        /* Custom Shape for Image */
        .custom-image-shape {
            border-top-right-radius: 160px;
            border-bottom-left-radius: 0;
            border-top-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="glow-left"></div>
        <div class="glow-bottom"></div>
        
        <div class="grid grid-cols-12 h-full relative z-10 px-12 py-12">
            
            <div class="col-span-5 h-full flex items-center relative">
                <div class="w-full h-[600px] custom-image-shape overflow-hidden relative shadow-2xl border-l border-white/10 mt-4">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop" 
                         alt="Architecture" 
                         class="w-full h-full object-cover opacity-80">
                    <div class="absolute inset-0 bg-gradient-to-t from-deepBlack via-transparent to-transparent opacity-90"></div>
                    <div class="absolute inset-0 bg-cyanPrimary/10 mix-blend-overlay"></div>
                    
                    <div class="absolute bottom-8 left-8">
                         <div class="w-12 h-1 bg-cyanHighlight mb-2"></div>
                         <p class="text-white text-xs tracking-widest uppercase opacity-80">Est. 2025</p>
                    </div>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-center pl-20 pr-4 relative">
                
                <div class="mb-6 flex items-center gap-3">
                    <div class="border border-borderStroke rounded-full px-4 py-1 text-textSec text-xs tracking-[0.2em] font-bold uppercase bg-white/5">
                        Rimberio Strategy
                    </div>
                </div>

                <h1 class="text-7xl font-bold text-white leading-[1.05] tracking-tight mb-8">
                    Business Startup<br>
                    <span class="text-cyanHighlight">Pitch Deck</span>
                </h1>

                <p class="text-xl text-textSec font-light tracking-wide max-w-lg leading-relaxed mb-16 border-l-2 border-cyanPrimary/50 pl-6">
                    Building smarter solutions for tomorrow with data-driven strategies and innovative design.
                </p>

                <div class="flex justify-between items-end border-t border-white/10 pt-8 w-full mr-8">
                    
                    <div class="flex flex-col gap-1">
                        <span class="text-xs text-cyanHighlight uppercase tracking-wider">Website</span>
                        <span class="text-sm font-medium text-white">www.rimberio-tech.com</span>
                    </div>

                    <div class="flex flex-col gap-1 text-right">
                        <span class="text-xs text-cyanHighlight uppercase tracking-wider">Presented By</span>
                        <span class="text-2xl text-white font-bold">Avery Davis</span>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
