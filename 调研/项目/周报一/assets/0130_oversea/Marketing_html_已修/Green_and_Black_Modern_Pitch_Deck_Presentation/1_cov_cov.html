<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck Cover - Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;300;400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',       // 更深邃的黑
                        panelBg: '#1A1A1A',      // 次级黑
                        acidLime: '#D2E649',     // 核心高亮色
                        greyText: '#888888',     // 辅助灰
                        whiteText: '#FFFFFF',    // 纯白
                        gridLine: '#2A2A2A'      // 极细的网格线
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #2A2A2A 1px, transparent 1px), linear-gradient(to bottom, #2A2A2A 1px, transparent 1px)"
                    }
                }
            }
        }
    </script>
    <style>
        /* 镂空字体效果 */
        .text-outline {
            -webkit-text-stroke: 2px #FFFFFF;
            color: transparent;
        }
        /* 极细网格背景设置 */
        .bg-grid {
            background-size: 80px 80px;
        }
    </style>
</head>
<body class=" flex items-center justify-center min-h-screen">

    <div class="relative w-[1280px] h-[720px] bg-darkBg overflow-hidden  font-sans">
        
        <div class="absolute inset-0 bg-grid-pattern bg-grid opacity-30 pointer-events-none"></div>
        
        <div class="absolute top-[-50px] right-[-20px] text-[300px] font-black text-[#1A1A1A] leading-none select-none opacity-50 z-0">
            2025
        </div>

        <div class="absolute top-0 left-0 w-full px-16 py-10 flex justify-between items-center z-10">
            
            <div class="flex items-center gap-4">
                <div class="text-acidLime text-4xl"><i class="fa-solid fa-shapes"></i></div>
                <div class="flex flex-col justify-center">
                    <h6 class="text-whiteText font-bold text-xl leading-tight tracking-widest uppercase m-0">FRADEL</h6>
                    <h6 class="text-acidLime font-bold text-xl leading-tight tracking-widest uppercase m-0">AND SPIES</h6>
                </div>
            </div>

            <div class="flex items-center gap-2 px-4 py-1 border border-gridLine rounded-full bg-darkBg/80 backdrop-blur-sm">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                <span class="text-greyText text-xs font-mono uppercase tracking-widest">Confidential</span>
            </div>
        </div>

        <div class="relative z-10 h-full flex flex-col justify-center px-16 mt-6">
            
            <div class="w-full h-[1px] bg-gridLine mb-8 flex items-center">
                <div class="w-[10%] h-[2px] bg-acidLime"></div>
                <div class="ml-auto text-gridLine text-xs font-mono"><i class="fa-solid fa-crosshairs"></i> DATA VISUALIZATION</div>
            </div>

            <div class="flex flex-col gap-2">
                <h1 class="text-whiteText text-[120px] font-black leading-[0.85] tracking-tighter uppercase mix-blend-overlay">
                    Strategic
                </h1>
                <div class="flex items-center gap-6">
                    <h1 class="text-outline text-[120px] font-black leading-[0.85] tracking-tighter uppercase">
                        Growth
                    </h1>
                    <div class="w-24 h-24 rounded-full border border-acidLime flex items-center justify-center animate-[spin_10s_linear_infinite]">
                         <div class="w-20 h-20 rounded-full border border-dashed border-greyText"></div>
                         <i class="fa-solid fa-arrow-right -rotate-45 absolute text-acidLime text-2xl"></i>
                    </div>
                </div>
                <h1 class="text-acidLime text-[120px] font-black leading-[0.85] tracking-tighter uppercase">
                    Plan.
                </h1>
            </div>

            <p class="mt-8 text-greyText text-xl font-light tracking-wide max-w-2xl border-l-2 border-gridLine pl-6">
                Analyzing the user trajectory and market expansion opportunities for the upcoming fiscal year.
            </p>

        </div>

        <div class="absolute bottom-10 right-16 z-20">
            <div class="bg-panelBg border-l-4 border-acidLime p-6 w-[360px] shadow-2xl backdrop-blur-sm bg-opacity-90">
                <div class="flex justify-between items-start mb-4">
                    <span class="text-greyText text-[10px] font-mono uppercase tracking-widest">Presenter</span>
                    <i class="fa-solid fa-fingerprint text-gridLine text-2xl"></i>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gridLine rounded overflow-hidden flex items-center justify-center">
                         <i class="fa-solid fa-user text-greyText"></i>
                    </div>
                    <div>
                        <h3 class="text-whiteText text-xl font-bold leading-none mb-1">Alex Morgan</h3>
                        <p class="text-acidLime text-sm font-medium">Head of Product Strategy</p>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gridLine flex justify-between text-xs text-greyText font-mono">
                    <span>ID: 884-291</span>
                    <span>V.2.0</span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-10 left-16 text-gridLine text-6xl opacity-20">
            <i class="fa-brands fa-react"></i>
        </div>

    </div>

</body>
</html>
