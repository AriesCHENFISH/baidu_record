<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Portfolio - Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }
        /* 巨型标题样式 */
        .text-huge {
            font-size: 240px;
            line-height: 0.8;
            font-family: 'Inter', sans-serif;
        }
        /* 标题层级置顶 */
        .title-overlay {
            z-index: 40;
            position: relative;
        }
        /* 图片容器样式 */
        .hero-img-box {
            width: 440px;
            height: 600px;
            z-index: 20;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E84A27',
                        dark: '#000000',
                        light: '#FFFFFF',
                        grey: '#CCCCCC',
                        border: '#333333'
                    }
                }
            }
        }
    </script>
</head>
<body class=" font-sans">

    <div id="page_container" class="text-light flex flex-col">
        
        <div class="flex items-center justify-between mx-16 pt-12 text-grey text-xs tracking-[0.2em] font-medium uppercase border-b border-border pb-4 relative z-50">
            <p>Creative Studio</p>
            <p>August / 2024</p>
        </div>

        <div class="flex-1 flex items-center justify-center relative">
            
            <div class="absolute left-16 top-1/2 -translate-y-1/2 z-50">
                <div class="flex flex-col gap-6">
                    <div class="w-12 h-1 bg-primary"></div>
                    <p class="text-xs font-black uppercase tracking-[0.4em] text-grey">Personal<br>Archive</p>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest leading-relaxed max-w-[140px]">
                        Visual identity and digital experience presentation.
                    </p>
                </div>
            </div>

            <div class="hero-img-box relative shadow-2xl">
                <div class="w-full h-full overflow-hidden border border-border">
                    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=800&auto=format&fit=crop" 
                         alt="Main Model" 
                         class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000">
                </div>
                <div class="absolute -bottom-4 -right-4 w-24 h-24 border-b-2 border-r-2 border-primary -z-10"></div>
            </div>

            <div class="title-overlay absolute w-full flex justify-center pointer-events-none">
                <h1 class="text-huge font-black text-primary tracking-tighter uppercase text-center opacity-90">
                    PORTFOLIO
                </h1>
            </div>

            <div class="absolute right-16 top-1/2 -translate-y-1/2 z-50 flex flex-col items-center">
                <span class="text-[10px] font-bold text-zinc-500 [writing-mode:vertical-rl] tracking-[0.5em] uppercase">
                    System / 2.0 / Alpha
                </span>
                <div class="w-[1px] h-20 bg-primary mt-6"></div>
            </div>

        </div>

        <div class="mx-16 pb-12 flex justify-between items-end relative z-50">
            <div class="flex items-center gap-4">
                <span class="text-primary font-black text-2xl">01</span>
                <div class="h-[1px] w-8 bg-border"></div>
                <span class="text-grey text-[10px] font-bold uppercase tracking-widest">Introduction Page</span>
            </div>
            
            <div class="text-right">
                <p class="text-grey text-[10px] font-bold uppercase tracking-widest mb-1">Avery Davis</p>
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest">Creative Direction & Design</p>
            </div>
        </div>

        <div class="absolute bottom-[-100px] left-[-50px] opacity-10 pointer-events-none">
            <span class="text-[400px] font-black text-white leading-none">24</span>
        </div>

    </div>

</body>
</html>
