<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Presentation Cover</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E85D36',      // Brand Orange
                        secondary: '#F48B6E',    // Soft Orange
                        dark: '#222222',         // Primary Text
                        body: '#4A4A4A',         // Body Text
                        bg: '#F5F5F5',           // Global Background
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F5F5F5;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* Custom shape for image masking */
        .arch-mask {
            mask-image: radial-gradient(circle at 50% 0, black 50%, transparent 0);
            -webkit-mask-image: radial-gradient(100% 100% at 50% 0%, black 100%, transparent 100%);
            border-radius: 400px 400px 20px 20px;
        }

        /* Subtle background text watermark */
        .watermark-text {
            -webkit-text-stroke: 2px rgba(232, 93, 54, 0.1);
            color: transparent;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex items-center justify-center">
        
        <div class="absolute -bottom-20 -left-10 text-[300px] font-black watermark-text leading-none select-none z-0 opacity-60">
            2025
        </div>
        <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] bg-primary/5 rounded-full blur-3xl z-0"></div>

        <div class="w-full h-full grid grid-cols-12 relative z-10">

            <div class="col-span-7 h-full flex flex-col justify-center px-16 relative">
                
                <div class="w-20 h-2 bg-dark mb-8"></div>

                <p class="text-body uppercase tracking-[0.3em] text-sm mb-4 font-medium">Annual Strategic Report</p>

                <h1 class="text-[90px] leading-[0.95] font-black text-dark mb-6 tracking-tight">
                    NEXT <br>
                    GENERATION <br>
                    <span class="text-primary">LEADERSHIP</span>
                </h1>

                <div class="max-w-md">
                    <p class="text-body text-lg leading-relaxed border-l-4 border-secondary pl-6">
                        Empowering teams to achieve excellence through service, innovation, and continuous growth.
                    </p>
                </div>

                <div class="mt-12 inline-flex items-center gap-3 bg-white px-6 py-3 rounded-full shadow-sm w-fit border border-gray-100">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-dark font-bold text-sm">July 15, 2025</span>
                </div>
            </div>

            <div class="col-span-5 h-full relative flex items-end justify-center pb-12 pr-12">
                
                <div class="relative w-full h-[90%] arch-mask overflow-hidden shadow-2xl z-10">
                    <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=1000&auto=format&fit=crop" 
                         alt="Team Discussion" 
                         class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-700">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-primary/30 to-transparent mix-blend-overlay"></div>
                </div>

                <div class="absolute top-20 -right-4 grid grid-cols-3 gap-3 z-0 opacity-20">
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                    <div class="w-2 h-2 rounded-full bg-dark"></div>
                </div>

                <div class="absolute bottom-24 -left-12 bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-xl z-20 border border-white/50 max-w-[220px]">
                    <div class="flex items-center gap-4 mb-3">
                        <div class="w-10 h-10 bg-dark rounded-full flex items-center justify-center text-white">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <div>
                            <p class="text-xs text-body uppercase font-bold">Growth</p>
                            <p class="text-xl font-black text-dark">+128%</p>
                        </div>
                    </div>
                    <div class="w-full bg-gray-200 h-1.5 rounded-full overflow-hidden">
                        <div class="bg-primary h-full w-[80%]"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
