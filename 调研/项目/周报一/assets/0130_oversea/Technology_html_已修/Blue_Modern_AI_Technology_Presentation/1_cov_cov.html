<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tech Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden;
            background-color: #0F1A2E; font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #FFFFFF;
        }
        .font-tech { font-family: 'Orbitron', sans-serif; }

        /* 统一网格背景 */
        .circuit-bg {
            position: absolute; inset: 0; opacity: 0.1;
            background: linear-gradient(90deg, #5AD0F9 1px, transparent 1px), linear-gradient(#5AD0F9 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: 0;
        }

        /* 原有抽象圆环装饰 (增强) */
        .abstract-orb {
            position: absolute; width: 900px; height: 900px; border: 1px solid rgba(90, 208, 249, 0.05);
            border-radius: 50%; top: 50%; right: -300px; transform: translateY(-50%); z-index: 1;
        }
        .orb-inner {
            position: absolute; inset: 150px; border: 2px dashed rgba(90, 208, 249, 0.15);
            border-radius: 50%; animation: spin 60s linear infinite;
        }
        .orb-core {
            position: absolute; inset: 300px; background: radial-gradient(circle, rgba(90, 208, 249, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 右侧新增加的科技元素 */
        .tech-data-stream {
            position: absolute; top: 10%; right: 5%; width: 400px; height: 600px;
            pointer-events: none; z-index: 2;
            background: 
                linear-gradient(transparent 95%, rgba(90, 208, 249, 0.3) 95%) 0 0 / 20px 20px,
                linear-gradient(90deg, transparent 95%, rgba(90, 208, 249, 0.3) 95%) 0 0 / 20px 20px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            opacity: 0.4; transform: perspective(1000px) rotateY(-30deg);
        }

        .floating-hud-element {
            position: absolute; border: 1px solid #5AD0F9; color: #5AD0F9; font-family: 'Orbitron', sans-serif;
            font-size: 10px; padding: 4px 8px; opacity: 0.6;
        }
        .hud-e1 { top: 20%; right: 35%; }
        .hud-e2 { top: 45%; right: 15%; border-style: dashed; }
        .hud-e3 { bottom: 30%; right: 25%; }

        .connecting-lines path {
            fill: none; stroke: #5AD0F9; stroke-width: 1; stroke-opacity: 0.3;
            stroke-dasharray: 5, 5; animation: dash 20s linear infinite;
        }
        @keyframes dash { to { stroke-dashoffset: 100; } }

        /* 汇报人框 */
        .presenter-box {
            background: rgba(43, 65, 98, 0.2); border: 1px solid rgba(90, 208, 249, 0.2);
            backdrop-filter: blur(10px); padding: 20px 30px; border-left: 4px solid #5AD0F9;
            position: relative; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="circuit-bg"></div>
        
        <div class="abstract-orb">
            <div class="orb-inner"></div>
            <div class="orb-core"></div>
        </div>
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-[#5AD0F9]/10 blur-[150px] z-0"></div>

        <div class="tech-data-stream"></div>
        <svg class="absolute top-0 right-0 w-1/2 h-full z-1 connecting-lines" viewBox="0 0 640 720">
            <path d="M 500 100 L 300 300 L 450 500 L 200 650" />
            <path d="M 100 200 L 250 400 L 50 600" />
            <circle cx="300" cy="300" r="5" fill="#5AD0F9" opacity="0.5" />
            <circle cx="450" cy="500" r="5" fill="#5AD0F9" opacity="0.5" />
            <circle cx="250" cy="400" r="5" fill="#5AD0F9" opacity="0.5" />
        </svg>
        <div class="floating-hud-element hud-e1">DATA_FLOW: OPTIMAL</div>
        <div class="floating-hud-element hud-e2">NEURAL_NET_STATUS: ACTIVE</div>
        <div class="floating-hud-element hud-e3">SYS_ID: CX-9904</div>


        <div class="relative z-10 p-16 h-full flex flex-col justify-between">
            
            <div class="flex items-center gap-5">
                <div class="relative w-14 h-14 flex items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-br from-[#5AD0F9]/30 via-transparent to-[#5AD0F9]/10 rounded-lg border border-[#5AD0F9]/40 shadow-[0_0_20px_rgba(90,208,249,0.3)] rotate-[25deg]"></div>
                    <div class="relative z-10 w-11 h-11 border-2 border-[#5AD0F9] flex items-center justify-center rounded-md bg-[#192A45] shadow-[inset_0_0_15px_rgba(90,208,249,0.4)]">
                        <i class="fa-solid fa-microchip text-[#5AD0F9] text-2xl"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-[#5AD0F9] font-bold tracking-[0.35em] text-lg font-tech leading-tight">STUDIO</span>
                    <span class="text-[#E0E0E0] font-light tracking-[0.4em] text-xs opacity-70 pl-0.5 uppercase">Shodwe</span>
                </div>
            </div>

            <div class="mt-10">
                <h2 class="text-[#5AD0F9] font-tech tracking-[0.5em] text-xl mb-4 opacity-80 uppercase">Annual Innovation Report</h2>
                <h1 class="text-[160px] font-black font-tech leading-[0.8] tracking-tighter">
                    <span class="text-[#5AD0F9] drop-shadow-[0_0_30px_rgba(90,208,249,0.5)]">AI</span><br>
                    <span class="text-white">TECH</span>
                </h1>
                <div class="flex items-center gap-6 mt-12">
                    <div class="h-[2px] w-32 bg-[#5AD0F9]"></div>
                    <p class="text-2xl font-light tracking-widest text-[#E0E0E0]">SHAPING THE FUTURE INTELLIGENCE</p>
                </div>
            </div>

            <div class="flex items-end justify-between relative z-20">
                <div class="presenter-box">
                    <div class="flex gap-10">
                        <div>
                            <p class="text-[10px] font-tech text-[#5AD0F9] tracking-widest mb-1 opacity-60">REPORTED BY</p>
                            <p class="text-lg font-bold tracking-wider">Alex Riverson</p>
                        </div>
                        <div class="border-l border-white/10 pl-10">
                            <p class="text-[10px] font-tech text-[#5AD0F9] tracking-widest mb-1 opacity-60">POSITION</p>
                            <p class="text-lg font-light tracking-wider text-gray-300">Chief AI Strategist</p>
                        </div>
                        <div class="border-l border-white/10 pl-10">
                            <p class="text-[10px] font-tech text-[#5AD0F9] tracking-widest mb-1 opacity-60">DATE</p>
                            <p class="text-lg font-light tracking-wider text-gray-300">January 16, 2026</p>
                        </div>
                    </div>
                </div>
                
                <div class="text-right opacity-40">
                    <p class="font-tech text-xs tracking-[0.5em]">INTERNAL USE ONLY</p>
                    <p class="font-tech text-xs tracking-[0.5em] mt-1">CORE_SYSTEM_V.1.0</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
