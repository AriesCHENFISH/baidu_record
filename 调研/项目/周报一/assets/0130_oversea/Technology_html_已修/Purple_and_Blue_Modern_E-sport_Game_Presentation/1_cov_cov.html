<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Sport Gaming Keynote - Cover</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #050214; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }

        /* 统一 Logo 扫描光效 */
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .logo-scan::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(0, 229, 255, 0.5); animation: scanline 2s linear infinite;
        }
        
        /* 缓慢旋转背景 */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 20s linear infinite; }

        /* 文字霓虹效果 */
        .text-glow { text-shadow: 0 0 20px rgba(176, 38, 255, 0.6), 0 0 40px rgba(0, 229, 255, 0.3); }
        .glass-panel { background-color: rgba(26, 26, 61, 0.4); backdrop-filter: blur(12px); }

        /* 装饰用背景网格 */
        .bg-mesh {
            background-image: linear-gradient(rgba(176, 38, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(176, 38, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col">
        <div class="absolute inset-0 bg-mesh z-0"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[900px] bg-purple-900/10 blur-[150px] rounded-full z-0"></div>
        
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-white/5 rounded-full animate-spin-slow z-0"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] border border-dashed border-white/5 rounded-full z-0"></div>

        <div class="relative z-50 w-full px-16 py-10 flex justify-between items-center">
            <div class="group flex items-center gap-5 cursor-pointer">
                <div class="relative w-14 h-14">
                    <div class="absolute inset-0 border-2 border-dashed border-[#00E5FF] rounded-lg opacity-40 animate-spin-slow"></div>
                    <div class="logo-scan absolute inset-1 bg-gradient-to-br from-[#1A1A3D] to-[#050214] border border-[#B026FF] rounded-md flex items-center justify-center overflow-hidden">
                        <i class="fa-solid fa-microchip text-[#00E5FF] text-2xl"></i>
                    </div>
                    <div class="absolute -top-1 -right-1 w-2 h-2 bg-white rounded-full shadow-[0_0_8px_#fff]"></div>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-2xl font-black italic tracking-tighter text-white leading-none">RIMBERIO<span class="text-[#B026FF]">.</span>X</h2>
                    <p class="text-[#00E5FF] font-bold text-[10px] tracking-[0.3em] uppercase mt-1">Advanced Gaming</p>
                </div>
            </div>

            <div class="glass-panel rounded-xl p-1 flex items-center border border-white/10 shadow-2xl">
                <div class="relative px-8 py-2.5 rounded-lg bg-gradient-to-r from-[#B026FF] to-[#7A1BF2] shadow-[0_0_20px_rgba(176,38,255,0.4)]">
                    <p class="text-white text-xs font-black tracking-widest flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>01 HOME
                    </p>
                    <div class="absolute bottom-0 right-0 w-2 h-2 bg-[#050214] transform rotate-45 translate-x-1 translate-y-1"></div>
                </div>
                <div class="px-8 py-2.5 rounded-lg text-[#C0C0D0] hover:text-[#00E5FF] transition-all cursor-pointer">
                    <p class="text-xs font-bold tracking-widest">02 DISCUSSION</p>
                </div>
                <div class="px-8 py-2.5 rounded-lg text-[#C0C0D0] hover:text-[#00E5FF] transition-all cursor-pointer">
                    <p class="text-xs font-bold tracking-widest">03 ENDING</p>
                </div>
            </div>
        </div>

        <div class="relative z-10 flex-1 flex flex-col items-center justify-center text-center -mt-10">
            <div class="flex items-center gap-4 mb-6">
                <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-[#00E5FF]"></div>
                <span class="text-[#00E5FF] text-xs font-bold tracking-[0.5em] uppercase">Global Industry Report</span>
                <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-[#00E5FF]"></div>
            </div>

            <h1 class="text-[130px] font-black italic leading-none tracking-tighter text-white text-glow mb-4">
                E-SPORT<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-white to-gray-500">GAMING</span>
            </h1>

            <div class="flex gap-2 mb-10">
                <div class="w-16 h-1.5 bg-[#B026FF] rounded-full"></div>
                <div class="w-4 h-1.5 bg-[#00E5FF] rounded-full"></div>
                <div class="w-2 h-1.5 bg-white/20 rounded-full"></div>
            </div>

            <div class="glass-panel border border-white/5 p-6 rounded-2xl flex items-center gap-8 shadow-2xl">
                <div class="flex flex-col items-start border-r border-white/10 pr-8">
                    <span class="text-[10px] text-[#C0C0D0] uppercase tracking-widest mb-1">Presented by</span>
                    <p class="text-white font-bold tracking-wide">ALEXANDER RIMBERIO</p>
                </div>
                <div class="flex flex-col items-start border-r border-white/10 pr-8">
                    <span class="text-[10px] text-[#C0C0D0] uppercase tracking-widest mb-1">Project Code</span>
                    <p class="text-[#00E5FF] font-mono font-bold italic">X-GAMING-2026</p>
                </div>
                <div class="flex flex-col items-start">
                    <span class="text-[10px] text-[#C0C0D0] uppercase tracking-widest mb-1">Date</span>
                    <p class="text-white font-bold tracking-wide">JAN 16, 2026</p>
                </div>
            </div>
        </div>

        <div class="relative z-10 w-full px-16 pb-12 flex justify-between items-end">
            <div class="flex items-center gap-4 opacity-40">
                <i class="fa-solid fa-tower-broadcast text-[#B026FF] animate-pulse"></i>
                <span class="text-[10px] text-white tracking-[0.3em] font-light uppercase">Secure Connection Active</span>
            </div>
            
            <div class="flex gap-4">
                <div class="w-8 h-[2px] bg-[#B026FF] shadow-[0_0_8px_#B026FF]"></div>
                <div class="w-8 h-[2px] bg-white/10"></div>
                <div class="w-8 h-[2px] bg-white/10"></div>
            </div>
        </div>
        
        <div class="absolute right-6 top-1/2 -translate-y-1/2 rotate-90 origin-right text-[10px] text-white/10 font-black tracking-[1em] uppercase">
            Future Competition System v2.0
        </div>
    </div>

</body>
</html>
