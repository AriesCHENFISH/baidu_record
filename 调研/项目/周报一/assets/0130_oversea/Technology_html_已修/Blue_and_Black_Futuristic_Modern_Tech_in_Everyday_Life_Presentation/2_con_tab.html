<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Keynote - Contents</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050813;
            overflow: hidden;
            font-family: 'Rajdhani', 'Noto Sans SC', sans-serif;
            color: #F0F4F8;
        }

        .bg-cyber-grid {
            background-image: radial-gradient(#2C3E50 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.2;
        }

        /* 统一要求的主标题样式 */
        .main-header-container {
            display: inline-flex;
            justify-content: center;
            position: relative;
        }
        .header-bracket-l {
            position: absolute;
            left: -50px; top: 50%;
            transform: translateY(-50%);
            width: 30px; height: 70px;
            border-left: 5px solid #73C5FF;
            border-top: 3px solid #73C5FF;
            border-bottom: 3px solid #73C5FF;
        }
        .header-bracket-r {
            position: absolute;
            right: -50px; top: 50%;
            transform: translateY(-50%);
            width: 30px; height: 70px;
            border-right: 5px solid #73C5FF;
            border-top: 3px solid #73C5FF;
            border-bottom: 3px solid #73C5FF;
        }
        .header-title-box {
            border-top: 1px solid rgba(115, 197, 255, 0.3);
            border-bottom: 1px solid rgba(115, 197, 255, 0.3);
            padding: 10px 60px;
            background: linear-gradient(90deg, transparent, rgba(115, 197, 255, 0.1), transparent);
        }

        /* 目录项设计 */
        .toc-item {
            background: rgba(115, 197, 255, 0.03);
            border-left: 2px solid rgba(115, 197, 255, 0.2);
            clip-path: polygon(0 0, 100% 0, 100% 70%, 97% 100%, 0 100%);
            transition: all 0.3s ease;
        }
        .toc-item:hover {
            background: rgba(115, 197, 255, 0.1);
            border-left: 4px solid #73C5FF;
            transform: translateX(10px);
        }
        .toc-number {
            font-family: 'Rajdhani';
            background: linear-gradient(180deg, #73C5FF, transparent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-cyber-grid absolute inset-0"></div>
        
        <div class="absolute top-[20%] left-[-10%] w-[400px] h-[400px] bg-cyberBlue/10 rounded-full blur-[120px]"></div>

        <div class="relative z-10 flex flex-col h-full px-24 py-16">
            
            <div class="flex justify-center mb-16">
                <div class="main-header-container">
                    <div class="header-bracket-l"></div>
                    <div class="header-title-box">
                        <h1 class="text-5xl font-bold tracking-[0.2em] text-white uppercase">
                            Table of <span class="text-[#73C5FF]" style="text-shadow: 0 0 15px #73C5FF;">Contents</span>
                        </h1>
                    </div>
                    <div class="header-bracket-r"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-x-12 gap-y-4">
                
                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">01</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Project Background</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">06</span>
                    <span class="text-xl font-medium tracking-wider uppercase">System Architecture</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">02</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Market Analysis</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">07</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Data Management</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">03</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Core Technology</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">08</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Risk Assessment</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">04</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Emerging Trends</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">09</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Future Roadmap</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">05</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Daily Integration</span>
                </div>

                <div class="toc-item p-4 flex items-center gap-6">
                    <span class="toc-number text-4xl font-bold">10</span>
                    <span class="text-xl font-medium tracking-wider uppercase">Conclusion & QA</span>
                </div>

            </div>

            <div class="mt-auto flex justify-between items-center opacity-40">
                <div class="flex items-center gap-4 text-[10px] tracking-[0.3em]">
                    <div class="w-2 h-2 bg-cyberBlue"></div>
                    <span>TOTAL_CHAPTERS // 10</span>
                    <div class="w-12 h-[1px] bg-cyberBlue/50"></div>
                </div>
                <span class="text-[10px] font-mono">ID_INDEX: 050813-2026</span>
            </div>
        </div>
    </div>

</body>
</html>
