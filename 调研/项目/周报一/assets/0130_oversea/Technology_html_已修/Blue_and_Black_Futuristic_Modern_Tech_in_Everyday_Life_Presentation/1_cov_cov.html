<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Future Tech Keynote - Cover</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050813;
            overflow: hidden;
            font-family: 'Rajdhani', 'Inter', 'Noto Sans SC', sans-serif;
            color: #F0F4F8;
        }

        /* 背景氛围：叠加深蓝渐变与网格 */
        .bg-gradient-deep {
            background: radial-gradient(circle at 50% 50%, rgba(10, 21, 37, 0.5) 0%, #050813 90%);
        }
        .tech-grid {
            background-image: linear-gradient(rgba(115, 197, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(115, 197, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* 统一的主标题核心样式 */
        .main-header-container {
            display: inline-flex;
            justify-content: center;
            position: relative;
        }

        .header-bracket-l {
            position: absolute;
            left: -80px; top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 120px;
            border-left: 6px solid #73C5FF;
            border-top: 3px solid #73C5FF;
            border-bottom: 3px solid #73C5FF;
        }

        .header-bracket-r {
            position: absolute;
            right: -80px; top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 120px;
            border-right: 6px solid #73C5FF;
            border-top: 3px solid #73C5FF;
            border-bottom: 3px solid #73C5FF;
        }

        .header-title-box {
            border-top: 2px solid rgba(115, 197, 255, 0.3);
            border-bottom: 2px solid rgba(115, 197, 255, 0.3);
            padding: 20px 100px;
            background: linear-gradient(90deg, transparent, rgba(115, 197, 255, 0.1), transparent);
            text-align: center;
        }

        .text-glow-title {
            text-shadow: 0 0 30px rgba(115, 197, 255, 0.6), 0 0 60px rgba(115, 197, 255, 0.3);
        }

        /* 动画元素 */
        @keyframes scan-line { 0% { top: 0; } 100% { top: 100%; } }
        .scanner {
            position: absolute; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #73C5FF, transparent);
            animation: scan-line 6s linear infinite;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col items-center justify-center">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop" 
                 class="w-full h-full object-cover opacity-40">
            <div class="absolute inset-0 bg-gradient-deep"></div>
            <div class="absolute inset-0 tech-grid"></div>
            <div class="scanner"></div>
        </div>

        <div class="absolute top-12 left-12 opacity-50 flex gap-4 items-center">
            <i class="fa-solid fa-microchip text-cyberBlue"></i>
            <span class="text-[10px] tracking-[0.4em] font-mono">ID: KEYNOTE_CORE_720</span>
        </div>
        <div class="absolute bottom-12 right-12 opacity-30">
            <p class="text-[10px] font-mono tracking-widest text-right">SYSTEM INITIALIZED...<br>READY FOR DATA TRANSMISSION</p>
        </div>

        <div class="relative z-10 flex flex-col items-center">
            
            <div class="main-header-container mb-12">
                <div class="header-bracket-l"></div>
                <div class="header-title-box">
                    <p class="text-cyberBlue text-lg font-mono tracking-[0.5em] uppercase mb-4 opacity-80">Annual Technology Summit</p>
                    <h1 class="text-[100px] font-bold text-white leading-none uppercase tracking-tight" style="font-family: 'Rajdhani', sans-serif;">
                        Tech in <span class="text-[#73C5FF] text-glow-title">Everyday</span> Life
                    </h1>
                </div>
                <div class="header-bracket-r"></div>
            </div>

            <div class="mb-16">
                <p class="text-2xl text-white/60 font-light tracking-[0.2em] italic">
                    Transforming How We <span class="text-cyberBlue">Live</span>, <span class="text-cyberBlue">Work</span>, and <span class="text-cyberBlue">Connect</span>
                </p>
            </div>

            <div class="flex flex-col items-center gap-6">
                <div class="h-[1px] w-48 bg-gradient-to-r from-transparent via-cyberBlue to-transparent"></div>
                
                <div class="flex gap-16 items-center">
                    <div class="text-center">
                        <p class="text-cyberBlue/40 text-[10px] uppercase tracking-widest mb-1">Presenter</p>
                        <p class="text-white text-xl font-medium tracking-widest">STUDIO SHODWE</p>
                    </div>
                    <div class="w-[1px] h-10 bg-white/10"></div>
                    <div class="text-center">
                        <p class="text-cyberBlue/40 text-[10px] uppercase tracking-widest mb-1">Report Time</p>
                        <p class="text-white text-xl font-medium tracking-widest uppercase">January 15, 2026</p>
                    </div>
                </div>

                <div class="mt-4 flex gap-2">
                    <div class="w-2 h-2 rounded-full bg-cyberBlue animate-pulse"></div>
                    <div class="w-2 h-2 rounded-full bg-cyberBlue opacity-40"></div>
                    <div class="w-2 h-2 rounded-full bg-cyberBlue opacity-20"></div>
                </div>
            </div>

        </div>

        <div class="absolute bottom-0 w-full h-[1px] bg-gradient-to-r from-transparent via-cyberBlue/50 to-transparent"></div>
    </div>

</body>
</html>
