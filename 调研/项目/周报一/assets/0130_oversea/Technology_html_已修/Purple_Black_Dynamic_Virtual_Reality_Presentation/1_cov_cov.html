<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - Cover 2026</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #050505; overflow: hidden; display: flex; flex-direction: column; }
        .gradient-bg { background: linear-gradient(135deg, #4A3AFF, #C471ED); }
        .text-gradient { background: linear-gradient(to right, #BCA6F6, #FFFFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glitch-border { border: 1px solid rgba(188, 166, 246, 0.2); position: relative; }
        .glitch-border::after { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border: 1px solid #4A3AFF; opacity: 0.3; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="absolute top-[-10%] left-[-5%] w-[600px] h-[600px] bg-[#4A3AFF] rounded-full blur-[180px] opacity-[0.15] pointer-events-none z-0"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-[#C471ED] rounded-full blur-[150px] opacity-[0.1] pointer-events-none z-0"></div>

        <header class="w-full h-24 px-12 flex justify-between items-center z-50 relative border-b border-white/5 bg-white/[0.02] backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="w-1.5 h-10 gradient-bg rounded-full shadow-[0_0_15px_#4A3AFF]"></div>
                <div class="flex flex-col">
                    <h4 class="text-white font-black tracking-[0.25em] text-lg uppercase leading-none">Studio Shodwe</h4>
                    <span class="text-[10px] text-[#BCA6F6] font-medium tracking-[0.4em] uppercase mt-1 opacity-80">Future Realities Lab</span>
                </div>
            </div>
            <div class="flex items-center gap-10">
                <div class="flex gap-6 text-gray-400 text-base">
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-behance"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
                <div class="h-6 w-[1px] bg-white/10"></div>
                <div class="relative group">
                    <div class="absolute -inset-0.5 gradient-bg rounded-sm blur opacity-30 group-hover:opacity-100 transition duration-500"></div>
                    <button class="relative px-8 py-3 bg-[#050505] border border-white/10 rounded-sm text-white text-xs font-bold tracking-widest uppercase">Contact</button>
                </div>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-12 relative">
            <div class="col-span-6 relative h-full overflow-hidden">
                <img src="https://images.unsplash.com/photo-1622979135225-d2ba269fb1bd?q=80&w=1280&auto=format&fit=crop" 
                     class="w-full h-full object-cover grayscale-[20%] contrast-125 transition-transform duration-1000 hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-[#050505]/40 to-[#050505]"></div>
                <div class="absolute inset-0 bg-blue-900/20 mix-blend-overlay"></div>
            </div>

            <div class="col-span-6 flex flex-col justify-center px-16 relative z-10">
                <div class="absolute top-[20%] left-[-20px] text-[#BCA6F6] text-3xl animate-pulse">
                    <i class="fa-solid fa-star-of-life"></i>
                </div>

                <div class="mb-6 flex items-center gap-3">
                    <span class="w-12 h-[2px] bg-[#BCA6F6]"></span>
                    <h6 class="text-[#BCA6F6] font-black tracking-[0.3em] text-xs uppercase">Visionary Keynote</h6>
                </div>

                <h1 class="text-white text-[110px] font-black leading-[0.85] tracking-tighter mb-4 italic">
                    VIRTUAL<br><span class="text-gradient">REALITY</span>
                </h1>

                <div class="mb-12 border-l-2 border-[#4A3AFF] pl-6 py-2">
                    <p class="text-white/40 text-sm font-bold tracking-[0.4em] uppercase mb-1">Project Series 2026</p>
                    <p class="text-[#B0B0B0] text-sm leading-relaxed max-w-sm">
                        Redefining human interaction through spatial computing and immersive neural interfaces.
                    </p>
                </div>

                <div class="flex items-center gap-8">
                    <div class="group relative">
                        <div class="absolute -inset-1 gradient-bg blur-md opacity-40 group-hover:opacity-80 transition duration-500"></div>
                        <button class="relative gradient-bg px-12 py-5 text-white font-black text-lg tracking-widest uppercase italic">
                            Enter Experience <i class="fa-solid fa-arrow-right ml-3 text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-10 left-12 z-50 flex items-center gap-8 text-[#4A3AFF] text-xs font-bold tracking-[0.2em]">
            <span>DESIGNED BY STUDIO SHODWE</span>
            <div class="w-24 h-[1px] bg-white/10"></div>
            <span class="text-white/30 tracking-widest uppercase">© 2026 ALL RIGHTS RESERVED</span>
        </div>
    </div>
</body>
</html>
