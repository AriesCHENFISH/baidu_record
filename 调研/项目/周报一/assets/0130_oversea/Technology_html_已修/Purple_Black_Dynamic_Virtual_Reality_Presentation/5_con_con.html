<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - Portfolio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #000000; overflow: hidden; display: flex; flex-direction: column; }
        .gradient-bg { background: linear-gradient(135deg, #4A3AFF, #C471ED); }
    </style>
</head>
<body>
    <div id="page_container">
        <header class="w-full h-24 px-12 flex justify-between items-center z-50 relative border-b border-white/5 bg-white/[0.02] backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="w-1.5 h-10 gradient-bg rounded-full"></div>
                <div class="flex flex-col">
                    <h4 class="text-white font-black tracking-[0.25em] text-lg uppercase leading-none">Studio Shodwe</h4>
                    <span class="text-[10px] text-[#BCA6F6] font-medium tracking-[0.4em] uppercase mt-1 opacity-80">Creative Agency Portfolio</span>
                </div>
            </div>
            <div class="flex items-center gap-10">
                <div class="flex gap-6 text-gray-400 text-base">
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-behance"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-dribbble"></i></a>
                </div>
                <div class="h-6 w-[1px] bg-white/10"></div>
                <div class="relative group">
                    <div class="absolute -inset-0.5 gradient-bg rounded-sm blur opacity-30 group-hover:opacity-100 transition duration-500"></div>
                    <button class="relative px-8 py-3 bg-[#000000] border border-white/10 rounded-sm text-white text-xs font-bold tracking-widest uppercase flex items-center gap-3">
                        Let's Talk <i class="fa-solid fa-paper-plane text-[10px] text-[#BCA6F6]"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-12 w-full h-full">
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 z-40">
                <div class="mb-4 flex items-center gap-2">
                    <span class="w-8 h-[1px] bg-[#BCA6F6]"></span>
                    <h6 class="text-[#B0B0B0] text-xs font-bold uppercase tracking-[0.3em]">Curated Works</h6>
                </div>
                <h1 class="text-8xl font-black text-white leading-[0.9] mb-8 tracking-tighter">
                    Best <br> <span class="text-[#BCA6F6]">Portfolio</span>
                </h1>
                <div class="flex gap-10 mb-10">
                    <div>
                        <h2 class="text-4xl font-bold text-white leading-none">5.0</h2>
                        <p class="text-[#BCA6F6] text-[10px] font-bold uppercase tracking-widest mt-2">Top Rated</p>
                    </div>
                    <div class="w-[1px] h-10 bg-white/10"></div>
                    <div>
                        <h2 class="text-4xl font-bold text-white leading-none">12K+</h2>
                        <p class="text-[#BCA6F6] text-[10px] font-bold uppercase tracking-widest mt-2">Projects</p>
                    </div>
                </div>
                <div>
                    <div class="group inline-flex items-center gradient-bg px-10 py-4 rounded-sm cursor-pointer hover:shadow-[0_10px_30px_-5px_rgba(74,58,255,0.4)] transition-all">
                        <span class="text-white font-bold tracking-widest uppercase text-sm mr-4">Next Slide</span>
                        <i class="fa-solid fa-arrow-right text-white text-xs transition-transform group-hover:translate-x-1"></i>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative overflow-hidden flex -mr-16">
                <div class="flex w-[120%] h-full transform translate-x-8 gap-3">
                    <div class="flex-1 h-full transform -skew-x-12 origin-bottom overflow-hidden border-l-8 border-black group">
                        <div class="absolute inset-0 w-[180%] -left-[40%] transform skew-x-12">
                            <img src="https://images.unsplash.com/photo-1593508512255-86ab42a8e620?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover brightness-50 group-hover:brightness-100 transition duration-700">
                        </div>
                    </div>
                    <div class="flex-[1.5] h-full transform -skew-x-12 origin-bottom overflow-hidden border-l-8 border-black group">
                        <div class="absolute inset-0 w-[180%] -left-[40%] transform skew-x-12">
                            <img src="https://images.unsplash.com/photo-1622979135225-d2ba269fb1bd?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover contrast-110 group-hover:scale-110 transition duration-700">
                        </div>
                    </div>
                    <div class="flex-1 h-full transform -skew-x-12 origin-bottom overflow-hidden border-l-8 border-black group">
                        <div class="absolute inset-0 w-[180%] -left-[40%] transform skew-x-12">
                            <img src="https://images.unsplash.com/photo-1592478411213-61535fdd861d?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover brightness-50 group-hover:brightness-100 transition duration-700">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-[#4A3AFF] rounded-full blur-[150px] opacity-[0.1] pointer-events-none"></div>
    </div>
</body>
</html>
