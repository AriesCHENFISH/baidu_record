<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - VR Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #050505; overflow: hidden; display: flex; flex-direction: column; }
        .gradient-bg { background: linear-gradient(135deg, #4A3AFF, #C471ED); }
        .text-gradient { background: linear-gradient(to right, #BCA6F6, #FFFFFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="page_container">
        <header class="w-full h-24 px-12 flex justify-between items-center z-50 relative border-b border-white/5 bg-white/[0.02] backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="w-1.5 h-10 gradient-bg rounded-full"></div>
                <div class="flex flex-col">
                    <h4 class="text-white font-black tracking-[0.25em] text-lg uppercase leading-none">Studio Shodwe</h4>
                    <span class="text-[10px] text-[#BCA6F6] font-medium tracking-[0.4em] uppercase mt-1 opacity-80">Virtual Reality Keynote</span>
                </div>
            </div>
            <div class="flex items-center gap-10">
                <div class="flex gap-6 text-gray-400 text-base">
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-behance"></i></a>
                    <a href="#" class="hover:text-[#BCA6F6] transition-all"><i class="fa-brands fa-x-twitter"></i></a>
                </div>
                <div class="h-6 w-[1px] bg-white/10"></div>
                <div class="relative group">
                    <div class="absolute -inset-0.5 gradient-bg rounded-sm blur opacity-30 group-hover:opacity-100 transition duration-500"></div>
                    <button class="relative px-8 py-3 bg-[#050505] border border-white/10 rounded-sm text-white text-xs font-bold tracking-widest uppercase flex items-center gap-3">
                        Contact Us <i class="fa-solid fa-arrow-right text-[10px] text-[#BCA6F6]"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-12 w-full h-full relative">
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 z-20">
                <div class="mb-4 flex items-center gap-2">
                    <span class="w-8 h-[1px] bg-[#BCA6F6]"></span>
                    <h6 class="text-[#BCA6F6] text-xs font-bold uppercase tracking-[0.3em]">Future Vision 2025</h6>
                </div>
                <h1 class="text-7xl font-black text-white leading-tight mb-6 tracking-tighter">
                    Welcome to <br><span class="text-gradient">Virtual Reality</span>
                </h1>
                <p class="text-[#B0B0B0] text-sm leading-relaxed mb-10 pr-12 text-justify">
                    Pushing the boundaries of immersive experiences. We create digital worlds that feel more real than reality itself, combining neural rendering with spatial audio for the ultimate presence.
                </p>
                <div>
                    <div class="inline-block gradient-bg px-12 py-5 shadow-[0_15px_35px_-10px_rgba(74,58,255,0.5)] cursor-pointer">
                        <span class="text-white text-sm font-bold tracking-widest uppercase">Read More</span>
                    </div>
                </div>
            </div>
            <div class="col-span-7 relative">
                <div class="absolute inset-0 bg-[#050505]">
                    <img src="https://images.unsplash.com/photo-1593508512255-86ab42a8e620?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover" style="mask-image: linear-gradient(to left, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to left, black 85%, transparent 100%);">
                    <div class="absolute inset-0 bg-[#4A3AFF] mix-blend-overlay opacity-30"></div>
                </div>
                <div class="absolute bottom-0 right-0 w-[400px] h-[300px] overflow-hidden">
                    <div class="w-[600px] h-[600px] gradient-bg transform rotate-45 translate-y-1/2 translate-x-1/4"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
