<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Keynote - English Cover</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepVoid: '#0A111F',
                        neonBlue: '#4FD1FF',
                        techPale: '#A8C5E6',
                        midnightNavy: '#142238',
                        strokeBlue: '#2B4F81',
                        terminalGreen: '#4CAF50',
                        alertOrange: '#E65100',
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Reset & Basic Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px;
            background-color: #0A111F; position: relative;
            margin: 0 auto; overflow: hidden;
            background-image: 
                linear-gradient(rgba(10, 17, 31, 0.95), rgba(10, 17, 31, 0.95)),
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(79, 209, 255, 0.03) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(79, 209, 255, 0.03) 20px);
        }

        /* Glitch Animation & Effects */
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .animate-progress {
            animation: progress 8s ease-in-out infinite;
        }

        /* Main Blue Glitch Shadow */
        .cyber-glitch-text-blue {
            text-shadow: 3px 3px 0px rgba(79, 209, 255, 0.5);
        }

        /* HUD Presenter Box Clip */
        .presenter-box {
            clip-path: polygon(0 0, 92% 0, 100% 25%, 100% 100%, 8% 100%, 0 75%);
            background: rgba(20, 34, 56, 0.7);
            border: 1px solid rgba(43, 79, 129, 0.5);
        }

        /* Scanning HUD effect */
        .scanline {
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #4FD1FF, transparent);
            position: absolute; top: 0; left: 0;
            animation: scan 5s linear infinite;
            opacity: 0.2; z-index: 5;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="font-sans">

    <div id="page_container">
        <div class="scanline"></div>

        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1558494949-efc5e60c9480?q=80&w=1280&auto=format&fit=crop" 
                 class="w-full h-full object-cover opacity-10 grayscale brightness-50">
        </div>

        <div class="absolute top-10 left-10 w-16 h-16 border-t-4 border-l-4 border-neonBlue rounded-tl-lg opacity-40"></div>
        <div class="absolute top-10 right-10 w-16 h-16 border-t-4 border-r-4 border-neonBlue rounded-tr-lg opacity-40"></div>

        <div class="relative z-10 flex flex-col h-full items-center justify-center pt-12">
            
            <div class="mb-6 flex items-center gap-3">
                <div class="w-1.5 h-1.5 bg-terminalGreen rounded-full animate-ping"></div>
                <span class="text-terminalGreen text-[10px] font-mono tracking-[0.4em] uppercase">Security_Protocol // Link_Established</span>
            </div>

            <div class="text-center mb-10">
                <h1 class="text-[115px] font-black leading-[0.85] tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-white via-neonBlue to-white cyber-glitch-text-blue uppercase">
                    Cyber<br>
                    <span class="text-white">Security</span>
                </h1>
                <div class="h-[3px] w-64 bg-gradient-to-r from-transparent via-terminalGreen to-transparent mt-8 mx-auto shadow-[0_0_12px_#4CAF50]"></div>
            </div>

            <div class="mb-16 bg-midnightNavy/60 border border-strokeBlue px-10 py-3 rounded-full flex items-center gap-4 box-glow">
                <i class="fa-solid fa-triangle-exclamation text-alertOrange"></i>
                <p class="text-techPale text-xs tracking-[0.2em] uppercase">
                    A Cyberattack occurs every <span class="text-white font-black text-lg mx-1">39</span> seconds worldwide
                </p>
            </div>

            <div class="flex items-center gap-8">
                <div class="presenter-box px-12 py-7 relative border-l-4 border-l-terminalGreen shadow-2xl">
                    <div class="flex items-center gap-6">
                        <div class="w-16 h-16 border border-strokeBlue bg-deepVoid flex items-center justify-center rounded-lg relative overflow-hidden group">
                            <i class="fa-solid fa-user-shield text-3xl text-terminalGreen"></i>
                            <div class="absolute inset-0 bg-terminalGreen/5 group-hover:bg-terminalGreen/10 transition-colors"></div>
                        </div>
                        <div class="text-left">
                            <h3 class="text-white text-xl font-black tracking-widest uppercase">Presenter: Name Here</h3>
                            <p class="text-terminalGreen text-[10px] font-mono mt-1 tracking-[0.3em] uppercase">Chief Security Analyst // Dept 04</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-4">
                    <div class="w-12 h-12 border border-terminalGreen/20 rounded-lg flex items-center justify-center text-terminalGreen opacity-70 hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-fingerprint text-xl"></i>
                    </div>
                    <div class="w-12 h-12 border border-terminalGreen/20 rounded-lg flex items-center justify-center text-terminalGreen opacity-70 hover:opacity-100 transition-opacity">
                        <i class="fa-solid fa-key text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-2 bg-strokeBlue/20">
            <div class="h-full bg-terminalGreen animate-progress shadow-[0_0_15px_#4CAF50]"></div>
        </div>

        <div class="absolute bottom-6 left-16 flex items-center gap-4 text-[10px] font-mono text-terminalGreen tracking-widest uppercase">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-check text-[8px]"></i>
                <span>System_State: Ready</span>
            </div>
            <span class="text-strokeBlue">|</span>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-lock text-[8px]"></i>
                <span>AES-256_Encrypted</span>
            </div>
        </div>

        <div class="absolute bottom-6 right-16 text-[10px] font-mono text-strokeBlue tracking-[0.4em] uppercase">
            Slide_Ref: Cover // Alpha_7
        </div>
    </div>

</body>
</html>
