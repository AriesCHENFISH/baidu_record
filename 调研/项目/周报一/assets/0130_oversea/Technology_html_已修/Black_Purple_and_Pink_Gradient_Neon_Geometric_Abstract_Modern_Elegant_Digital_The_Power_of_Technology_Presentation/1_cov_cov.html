<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power of Technology - Cover Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .page-container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050A14;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            color: #E0E0E0;
        }

        /* 优化背景网格 */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(19, 38, 57, 0.4) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(19, 38, 57, 0.4) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 90%);
        }

        /* 氛围光效 */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 1;
            opacity: 0.35;
        }

        /* 巨型背景装饰文字 */
        .bg-text-decor {
            position: absolute;
            font-size: 240px;
            font-weight: 900;
            color: rgba(45, 91, 255, 0.03);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
            letter-spacing: -0.05em;
        }

        /* 顶部导航关键词设计 */
        .nav-keyword {
            font-size: 12px;
            letter-spacing: 0.5em;
            color: #D4C9E8;
            font-weight: 700;
            position: relative;
            padding: 0 10px;
        }
        .nav-keyword::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #2D5BFF;
            border-radius: 50%;
            transform: translateX(-50%);
            opacity: 0.6;
        }

        .main-title {
            background: linear-gradient(to bottom, #FFFFFF 0%, #D4C9E8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .info-pill {
            background: rgba(45, 91, 255, 0.1);
            border: 1px solid rgba(45, 91, 255, 0.3);
            backdrop-filter: blur(10px);
            padding: 8px 24px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="bg-grid"></div>
        <div class="glow-orb" style="width: 600px; height: 600px; background: #4A1E9E; top: -150px; left: -150px;"></div>
        <div class="glow-orb" style="width: 700px; height: 700px; background: #2D5BFF; bottom: -200px; right: -200px;"></div>
        
        <div class="bg-text-decor" style="top: 10%; left: -5%;">TECHNOLOGY</div>
        <div class="bg-text-decor" style="bottom: 5%; right: -5%;">EVOLUTION</div>

        <div class="absolute top-0 left-0 w-full z-10 pt-16 flex justify-center items-center gap-24">
            <span class="nav-keyword">INNOVATION</span>
            <span class="nav-keyword text-white opacity-100">VISION</span>
            <span class="nav-keyword">FUTURE</span>
        </div>

        <div class="relative z-10 w-full h-full flex flex-col justify-center items-center">
            
            <div class="flex items-center gap-4 mb-6 opacity-60">
                <div class="w-12 h-[1px] bg-blue-500"></div>
                <i class="fas fa-microchip text-blue-400 text-xs"></i>
                <div class="w-12 h-[1px] bg-blue-500"></div>
            </div>

            <div class="text-center mb-8">
                <h1 class="main-title font-bold leading-none tracking-tighter" style="font-size: 110px;">
                    THE POWER OF<br/>TECHNOLOGY
                </h1>
            </div>

            <div class="flex items-center gap-6 mb-20">
                <span class="text-blue-400 font-light tracking-[0.4em] text-lg">INTELLIGENT</span>
                <div class="w-2 h-2 bg-white/20 rounded-full"></div>
                <span class="text-blue-400 font-light tracking-[0.4em] text-lg">CONNECTED</span>
                <div class="w-2 h-2 bg-white/20 rounded-full"></div>
                <span class="text-blue-400 font-light tracking-[0.4em] text-lg">SUSTAINABLE</span>
            </div>

            <div class="flex gap-8">
                <div class="info-pill flex items-center gap-3">
                    <span class="text-[10px] text-blue-500 font-bold uppercase tracking-tighter">Presenter</span>
                    <span class="text-sm text-gray-200 tracking-widest">GEMINI DESIGN</span>
                </div>
                <div class="info-pill flex items-center gap-3">
                    <span class="text-[10px] text-blue-500 font-bold uppercase tracking-tighter">Session</span>
                    <span class="text-sm text-gray-200 tracking-widest">JAN 2026</span>
                </div>
            </div>

        </div>

        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500/20 to-transparent"></div>
        
        <div class="absolute bottom-12 left-16 opacity-30 flex flex-col gap-1">
            <div class="text-[8px] font-mono tracking-widest text-blue-400">STATUS: INITIALIZING...</div>
            <div class="w-32 h-[1px] bg-blue-900"></div>
        </div>

        <div class="absolute bottom-12 right-16 opacity-30 text-right flex flex-col gap-1">
            <div class="text-[8px] font-mono tracking-widest text-blue-400">LATENCY: 0.002MS</div>
            <div class="text-[8px] font-mono tracking-widest text-blue-400">CORE_SYNC: ACTIVE</div>
        </div>

    </div>

</body>
</html>
