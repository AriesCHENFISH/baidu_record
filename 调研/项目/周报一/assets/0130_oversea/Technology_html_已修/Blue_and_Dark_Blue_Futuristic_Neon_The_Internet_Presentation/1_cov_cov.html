<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Internet - Cover Slide</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        
        .main-container {
            width: 1280px;
            height: 720px;
            background-color: #040E26;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            font-family: "Noto Sans SC", sans-serif;
            color: #E0E6ED;
        }

        .title-gradient {
            background: linear-gradient(180deg, #FFFFFF 20%, #AEEFFF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(174, 239, 255, 0.4));
        }

        .logo-ring {
            animation: spin 12s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .bg-wave {
            opacity: 0.15;
            mix-blend-mode: screen;
            filter: hue-rotate(10deg) brightness(1.2);
        }
        
        /* 关键词渐变及发光 */
        .keyword-glow {
            color: #5CC2D0;
            letter-spacing: 0.5em;
            text-shadow: 0 0 10px rgba(92, 194, 208, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-container flex flex-col items-center justify-center">
        <img src="https://images.unsplash.com/photo-1544256718-3bcf237f3974?q=80&w=1280" class="absolute inset-0 w-full h-full object-cover bg-wave">
        <div class="absolute inset-0 bg-gradient-to-b from-[#040E26]/80 via-transparent to-[#040E26]/90"></div>

        <header class="absolute top-12 right-16 z-20 flex items-center gap-4 text-right">
            <div class="flex flex-col">
                <span class="text-white font-black tracking-widest text-base uppercase leading-none mb-1">GIGGLING PLATYPUS</span>
                <span class="text-[#5CC2D0] font-bold text-[10px] uppercase tracking-[0.3em] opacity-80 border-t border-[#5CC2D0]/30 pt-1">Tech Industries</span>
            </div>
            <div class="relative w-16 h-16 flex items-center justify-center">
                <div class="logo-ring absolute inset-0 border border-dashed border-[#5CC2D0]/40 rounded-full"></div>
                <div class="w-10 h-10 bg-[#040E26] border border-[#5CC2D0] flex items-center justify-center rounded shadow-[0_0_15px_rgba(92,194,208,0.4)]">
                    <i class="fa-solid fa-cube text-[#5CC2D0] text-xl"></i>
                </div>
            </div>
        </header>

        <div class="relative z-10 flex flex-col items-center">
            <div class="flex items-center gap-8 mb-6">
                <div class="h-[1px] w-24 bg-gradient-to-r from-transparent to-[#5CC2D0]"></div>
                <span class="text-[#5CC2D0]/60 tracking-[0.6em] text-[10px] font-light uppercase">Infrastructure Keynote</span>
                <div class="h-[1px] w-24 bg-gradient-to-l from-transparent to-[#5CC2D0]"></div>
            </div>
            
            <h1 class="text-[110px] font-black italic uppercase leading-none tracking-tighter title-gradient">
                THE INTERNET
            </h1>

            <h2 class="keyword-glow text-2xl font-bold uppercase mt-6 mb-16">
                GLOBAL DATA NETWORK
            </h2>

            <div class="bg-white/5 border border-white/10 backdrop-blur-md rounded-2xl p-8 flex gap-12 items-center shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-[#5CC2D0]/50 to-transparent"></div>
                
                <div class="flex flex-col">
                    <span class="text-[#5CC2D0] text-[9px] uppercase tracking-widest mb-1 opacity-60 font-mono">Presenter //</span>
                    <span class="text-white text-xl font-medium tracking-wide">Giggling Platypus Team</span>
                </div>
                <div class="w-[1px] h-10 bg-white/10"></div>
                <div class="flex flex-col">
                    <span class="text-[#5CC2D0] text-[9px] uppercase tracking-widest mb-1 opacity-60 font-mono">Release Date //</span>
                    <span class="text-white text-xl font-medium tracking-wide">January 15, 2026</span>
                </div>
            </div>
        </div>

        <footer class="absolute bottom-12 left-16 right-16 flex justify-between items-center opacity-20">
            <div class="text-[9px] font-mono tracking-[0.5em]">SYSTEM_INITIALIZED: TRUE</div>
            <div class="flex gap-4">
                <div class="w-16 h-[2px] bg-[#5CC2D0]"></div>
                <div class="w-4 h-[2px] bg-[#5CC2D0]"></div>
            </div>
        </footer>
    </div>

</body>
</html>
