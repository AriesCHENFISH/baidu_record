<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>High-End Presentation Redesign</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%3B900%26display%3Dswap.css">

    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { display: none; }

        /* Main Container Fixed Size */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050508; /* Slightly richer black */
            overflow: hidden;
            color: #FFFFFF;
            /* Subtle noise texture for premium feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* Ambient Lighting */
        .glow-purple {
            position: absolute;
            width: 900px; height: 900px;
            top: -300px; left: -300px;
            background: radial-gradient(circle, rgba(107, 92, 231, 0.4) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 0; pointer-events: none;
        }
        .glow-cyan {
            position: absolute;
            width: 700px; height: 700px;
            bottom: -200px; right: -100px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.3) 0%, transparent 70%);
            filter: blur(100px);
            z-index: 0; pointer-events: none;
        }

        /* Modern Gradient Text */
        .text-gradient-accent {
            background: linear-gradient(135deg, #FFFFFF 30%, #A29BFE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Glassmorphism Card Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Glowing Button */
        .btn-glow {
            background: linear-gradient(90deg, #6B5CE7, #8e84ec);
            box-shadow: 0 0 20px rgba(107, 92, 231, 0.5);
            transition: all 0.3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(107, 92, 231, 0.8);
            transform: translateY(-2px);
        }

        /* Step Progress Line */
        .step-line::before {
            content: '';
            position: absolute;
            top: 2rem;
            bottom: 2rem;
            left: 50%;
            width: 2px;
            background: linear-gradient(to bottom, #6B5CE7 30%, rgba(255,255,255,0.1) 100%);
            transform: translateX(-50%);
            z-index: -1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="glow-purple"></div>
        <div class="glow-cyan"></div>

        <header class="relative z-50 flex items-center justify-between px-16 pt-10">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="w-12 h-12 relative flex items-center justify-center rounded-xl bg-gradient-to-br from-purple-600 to-cyan-500 shadow-lg shadow-purple-500/30 transition-transform group-hover:scale-105">
                    <div class="absolute inset-0.5 bg-black rounded-[10px] opacity-50"></div>
                    <i class="fa-solid fa-bolt-lightning relative z-10 text-white text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-purple-200 to-cyan-200 leading-none">AURORA</h2>
                    <span class="text-[10px] text-gray-400 tracking-[0.2em] font-medium uppercase pl-0.5">Innovations</span>
                </div>
            </div>

            <div class="text-[#CCCCCC] font-light tracking-wider text-sm flex items-center gap-2 opacity-70">
                <i class="fa-regular fa-calendar text-purple-400"></i>
                <span>October 26, 2025</span>
            </div>
        </header>

        <div class="relative z-10 grid grid-cols-12 gap-8 px-16 mt-16 h-[480px] items-center">
            
            <div class="col-span-5 flex flex-col pr-4">
                <h1 class="text-7xl font-black leading-[1.1] mb-8 tracking-tight text-white">
                    <span class="block text-gradient-accent">Future Focus</span>
                    Introduction
                </h1>

                <p class="text-gray-300 text-lg leading-relaxed mb-12 font-light opacity-90 max-w-md">
                    We are redefining the landscape with cutting-edge analytics and visionary strategies. Explore the next horizon of possibility.
                </p>

                <button class="btn-glow w-max px-10 py-4 rounded-full flex items-center gap-3 text-white font-bold tracking-wide text-sm uppercase group">
                    <span>Discover More</span>
                    <i class="fa-solid fa-arrow-right-long group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>

            <div class="col-span-6 relative h-full flex items-center">
                <div class="absolute top-0 right-[-40px] w-[600px] h-[400px] rounded-3xl overflow-hidden z-0">
                    <div class="absolute inset-0 bg-gradient-to-l from-[#050508] via-transparent to-[#050508] z-10 opacity-80"></div>
                     <img src="https://images.unsplash.com/photo-1639322537228-f710d846310a?q=80&w=1000&auto=format&fit=crop" 
                         alt="Abstract Data background" 
                         class="w-full h-full object-cover opacity-60 mix-blend-screen">
                </div>

                <div class="absolute bottom-0 left-[-20px] glass-panel p-2 rounded-2xl z-20 hover:-translate-y-2 transition-transform duration-500">
                    <div class="w-[340px] h-[240px] rounded-xl overflow-hidden relative">
                         <div class="absolute inset-0 bg-gradient-to-tr from-purple-900/40 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=600&auto=format&fit=crop" 
                             alt="Data Visualization Screen" 
                             class="w-full h-full object-cover">
                    </div>
                    <div class="absolute top-4 right-4 w-8 h-8 bg-white/10 rounded-full blur-md z-30"></div>
                </div>
            </div>

            <div class="col-span-1 flex flex-col justify-center items-center gap-12 h-[300px] relative step-line font-sans">
                <div class="group relative z-10 flex flex-col items-center gap-2">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-br from-[#6B5CE7] to-[#4a3ec2] flex items-center justify-center text-white text-lg font-bold shadow-[0_0_20px_rgba(107,92,231,0.6)] scale-110">
                        01
                    </div>
                    <span class="text-xs font-bold text-purple-300 tracking-widest uppercase text-center">Vision</span>
                </div>
                <div class="group relative z-10 flex flex-col items-center gap-2 opacity-40">
                    <div class="w-12 h-12 rounded-full border-2 border-gray-700 bg-[#050508] flex items-center justify-center text-gray-400 font-medium font-sans">
                        02
                    </div>
                </div>
                <div class="group relative z-10 flex flex-col items-center gap-2 opacity-40">
                    <div class="w-12 h-12 rounded-full border-2 border-gray-700 bg-[#050508] flex items-center justify-center text-gray-400 font-medium font-sans">
                        03
                    </div>
                </div>
            </div>
        </div>

        <footer class="absolute bottom-0 w-full px-16 py-6 flex justify-between items-center text-[#666666] text-xs font-medium tracking-widest uppercase">
            <p>© 2025 Aurora Innovations. All Rights Reserved.</p>
            <p class="flex items-center gap-2"><i class="fa-solid fa-globe text-purple-900/50"></i> Confidential Presentation</p>
        </footer>

    </div>
</body>
</html>
