<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Cover Slide - Aurora Innovations</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%3B900%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden;
            background-color: #050508;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        /* 氛围光效 */
        .glow-purple { position: absolute; width: 1000px; height: 1000px; top: -500px; left: -200px; background: radial-gradient(circle, rgba(107, 92, 231, 0.2) 0%, transparent 70%); filter: blur(80px); z-index: 0; }
        .glow-cyan { position: absolute; width: 1000px; height: 1000px; bottom: -500px; right: -200px; background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%); filter: blur(80px); z-index: 0; }
        
        .text-gradient { background: linear-gradient(to bottom, #FFF 40%, #A29BFE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 装饰线条 */
        .deco-line { width: 100px; height: 2px; background: linear-gradient(90deg, #6B5CE7, #06B6D4); border-radius: 99px; }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col items-center justify-between">
        <div class="glow-purple"></div>
        <div class="glow-cyan"></div>

        <header class="relative z-50 w-full px-16 pt-16 flex justify-start">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-purple-600 to-cyan-500 shadow-xl">
                    <i class="fa-solid fa-bolt-lightning text-white text-2xl"></i>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-2xl font-black tracking-[0.2em] text-white leading-none">AURORA</h2>
                    <span class="text-[10px] text-gray-500 tracking-[0.3em] font-medium uppercase mt-1 pl-0.5">Innovations</span>
                </div>
            </div>
        </header>

        <main class="relative z-10 flex flex-col items-center text-center px-16">
            <span class="text-[10px] font-black tracking-[0.5em] text-purple-500 uppercase mb-6">Annual Report 2026</span>
            
            <h1 class="text-[110px] font-black leading-none tracking-tighter text-gradient mb-12">
                DATA ANALYST<br>INSIGHTS
            </h1>

            <div class="deco-line mb-12"></div>

            <div class="flex items-center gap-16">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-gray-600 font-black tracking-widest uppercase mb-2">Presenter</span>
                    <h3 class="text-2xl font-bold text-white tracking-tight italic">Avery Davis</h3>
                </div>
                <div class="w-[1px] h-10 bg-white/10"></div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-gray-600 font-black tracking-widest uppercase mb-2">Role</span>
                    <p class="text-gray-400 text-sm font-light">Senior Strategy Analyst</p>
                </div>
                <div class="w-[1px] h-10 bg-white/10"></div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-gray-600 font-black tracking-widest uppercase mb-2">Date</span>
                    <p class="text-gray-400 text-sm font-light">January 15, 2026</p>
                </div>
            </div>
        </main>

        <footer class="relative z-50 w-full px-16 pb-16 flex justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="w-24 h-[1px] bg-white/10"></div>
                <p class="text-[#444] text-[9px] font-black tracking-[0.5em] uppercase">
                    © 2026 Aurora Innovations. Global Proprietary Document.
                </p>
            </div>
        </footer>
    </div>
</body>
</html>
