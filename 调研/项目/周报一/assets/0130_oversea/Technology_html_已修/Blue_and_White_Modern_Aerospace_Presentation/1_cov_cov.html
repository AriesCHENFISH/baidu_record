<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerospace Keynote - Cover Final</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #060B1A;
            color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 科技网格背景 */
        .tech-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(76, 201, 240, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76, 201, 240, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .radial-glow {
            position: absolute;
            width: 1000px; height: 1000px;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.15) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* 关键词标签样式 */
        .keyword-tag {
            background: rgba(76, 201, 240, 0.1);
            border: 1px solid #4CC9F0;
            padding: 4px 16px;
            font-family: monospace;
            font-weight: bold;
            color: #4CC9F0;
            letter-spacing: 2px;
            position: relative;
        }

        /* 标题渐变 */
        .title-gradient {
            background: linear-gradient(180deg, #FFFFFF 0%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 强制覆盖图标颜色 */
        .force-cyan {
            color: #4CC9F0 !important;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="tech-grid"></div>
        <div class="radial-glow"></div>

        <div class="absolute top-12 left-16 right-16 z-20 flex justify-between items-end border-b border-white/10 pb-4">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 flex items-center justify-center rounded-lg border" 
                     style="background: rgba(76, 201, 240, 0.1); border-color: rgba(76, 201, 240, 0.3);">
                    <i class="fa-solid fa-paper-plane force-cyan" style="font-size: 20px;"></i>
                </div>
                <div>
                    <h3 class="font-bold text-2xl tracking-tighter italic text-white">ALDENAIRE</h3>
                    <p class="text-[10px] tracking-[0.4em] leading-none force-cyan">AEROSPACE INDUSTRIES</p>
                </div>
            </div>
            <div class="text-right font-mono text-white/40">
                <p class="text-[10px] leading-none mb-1 uppercase tracking-widest">Global Strategy Unit</p>
                <p class="text-xs font-bold text-white">REF_NO: 2026_AS_09X</p>
            </div>
        </div>

        <div class="absolute inset-0 flex flex-col justify-center items-center z-10">
            <div class="flex items-center gap-3 mb-4">
                <div class="h-[1px] w-12" style="background-color: #4CC9F0;"></div>
                <span class="text-sm font-bold tracking-[0.5em] uppercase force-cyan">Executive Keynote</span>
                <div class="h-[1px] w-12" style="background-color: #4CC9F0;"></div>
            </div>

            <h1 class="text-[140px] font-black leading-[0.85] tracking-tighter title-gradient text-center">
                BEYOND<br>LIMITS
            </h1>
            
            <p class="mt-8 text-silver text-2xl tracking-[0.5em] font-light uppercase border-y border-white/10 py-2">
                Engineering the Future of Flight
            </p>

            <div class="mt-12 flex gap-4">
                <div class="keyword-tag">SUSTAINABILITY</div>
                <div class="keyword-tag">INNOVATION</div>
                <div class="keyword-tag">CONNECTIVITY</div>
                <div class="keyword-tag">AUTONOMY</div>
            </div>
        </div>

        <div class="absolute bottom-12 left-16 right-16 z-20 flex justify-between items-end">
            <div class="flex gap-12">
                <div class="border-l-2 pl-4" style="border-color: #4CC9F0;">
                    <p class="text-silver text-[10px] uppercase tracking-widest mb-1">Report Date</p>
                    <p class="text-white text-xl font-bold font-mono">2026 . 01 . 15</p>
                </div>
                <div class="border-l-2 border-white/20 pl-4">
                    <p class="text-silver text-[10px] uppercase tracking-widest mb-1">Time Sync</p>
                    <p class="text-white text-xl font-bold font-mono">17:45 <span class="force-cyan text-xs ml-1">UTC+8</span></p>
                </div>
            </div>

            <div class="text-right">
                <div class="flex items-center gap-4 mb-2 justify-end">
                    <span class="text-xs text-white/40 font-mono italic">SYST_SEC_NOMINAL</span>
                    <div class="flex gap-1">
                        <div class="w-1 h-3" style="background-color: #4CC9F0;"></div>
                        <div class="w-1 h-3" style="background-color: #4CC9F0;"></div>
                        <div class="w-1 h-3" style="background-color: #4CC9F0;"></div>
                        <div class="w-1 h-3 bg-white/20"></div>
                    </div>
                </div>
                <p class="text-[10px] text-white/20 uppercase tracking-[0.3em]">Confidential - Internal Use Only</p>
            </div>
        </div>

        <div class="absolute top-1/2 left-8 h-32 w-[2px]" style="background: linear-gradient(to bottom, transparent, rgba(76, 201, 240, 0.4), transparent);"></div>
        <div class="absolute top-1/2 right-8 h-32 w-[2px]" style="background: linear-gradient(to bottom, transparent, rgba(76, 201, 240, 0.4), transparent);"></div>
    </div>

</body>
</html>
