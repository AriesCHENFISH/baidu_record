<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerospace Cover - Blueprint Style</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #050505; overflow: hidden; font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }
        .bg-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.3); color: transparent; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { accent: '#AECFE8', surface: '#121212', text: '#D1D5DB' } } } }
        }
    </script>
</head>
<body>
    <div id="page_container" class="bg-grid flex flex-col items-center justify-center relative">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover opacity-40 grayscale">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
        </div>

        <div class="absolute top-12 left-12 w-16 h-16 border-t-2 border-l-2 border-brand-accent/50"></div>
        <div class="absolute top-12 right-12 w-16 h-16 border-t-2 border-r-2 border-brand-accent/50"></div>
        <div class="absolute bottom-12 left-12 w-16 h-16 border-b-2 border-l-2 border-brand-accent/50"></div>
        <div class="absolute bottom-12 right-12 w-16 h-16 border-b-2 border-r-2 border-brand-accent/50"></div>

        <div class="relative z-10 text-center flex flex-col items-center">
            <div class="flex items-center gap-4 mb-8">
                <span class="w-12 h-px bg-brand-accent/50"></span>
                <p class="text-sm tracking-[0.5em] text-brand-accent font-bold uppercase">Strategic Research & Development</p>
                <span class="w-12 h-px bg-brand-accent/50"></span>
            </div>

            <h1 class="text-[10rem] font-black text-white uppercase leading-[0.8] tracking-tighter mb-4">
                AERO<span class="text-brand-accent">SPACE</span>
            </h1>
            
            <p class="text-2xl text-brand-text/80 tracking-[0.4em] font-light uppercase border-y border-white/10 py-4 px-12">
                Innovations & Future Horizons
            </p>

            <div class="mt-16 flex items-center gap-10">
                <div class="text-right">
                    <p class="text-[10px] font-mono text-brand-accent/60 uppercase">System Status</p>
                    <p class="text-xs text-white font-bold tracking-widest uppercase">Nominal / Active</p>
                </div>
                <div class="h-12 w-px bg-brand-accent/30"></div>
                <div class="text-left">
                    <p class="text-[10px] font-mono text-brand-accent/60 uppercase">Project Ref</p>
                    <p class="text-xs text-white font-bold tracking-widest uppercase">ID: 2026-X-CORE</p>
                </div>
            </div>
        </div>

        <footer class="absolute bottom-0 w-full h-12 bg-white/5 border-t border-white/10 px-16 flex justify-between items-center text-[10px] font-mono text-brand-accent/40">
            <span>[ INITIALIZING_BLUEPRINT ]</span>
            <span>SECURE_DATA_BLUEPRINT // COVER_PAGE</span>
        </footer>
    </div>
</body>
</html>
