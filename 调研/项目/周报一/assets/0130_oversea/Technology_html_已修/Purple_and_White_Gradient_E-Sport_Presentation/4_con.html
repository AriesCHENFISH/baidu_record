<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Team - Salford & Co.</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #1A0B2E; overflow: hidden; }
        .glow-orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; }
        .skew-card { transform: skewX(-12deg); overflow: hidden; border-right: 4px solid #D65DB1; }
        .unskew-img { transform: skewX(12deg) scale(1.3); width: 100%; height: 100%; object-fit: cover; }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgPrimary: '#1A0B2E', accentA: '#9D00FF', accentB: '#D65DB1', accentUI: '#00FFFF', textSecondary: '#E0D4F5' }
                }
            }
        }
    </script>
</head>
<body>
    <div id="page_container">
        <div class="glow-orb" style="width: 500px; height: 500px; top: -150px; right: -100px; background: rgba(157, 0, 255, 0.15);"></div>
        
        <header class="relative z-20 px-16 py-10">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 flex items-center justify-center rounded-tr-xl rounded-bl-xl bg-bgPrimary/90 relative z-10" style="border: 2px solid; border-image: linear-gradient(135deg, #9D00FF, #00FFFF) 1;">
                    <i class="fa-solid fa-bolt-lightning text-2xl text-accentUI"></i>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-white font-black text-2xl tracking-[0.2em] uppercase leading-none">Salford <span class="text-accentUI">&</span> Co.</h2>
                    <div class="flex items-center gap-2 mt-2"><span class="h-[2px] w-6 bg-accentA"></span><span class="text-[10px] text-textSecondary uppercase tracking-[0.3em] font-bold">Esports Production</span></div>
                </div>
            </div>
        </header>

        <main class="relative z-10 flex px-16 h-[500px] mt-4">
            <div class="w-5/12 flex flex-col justify-center">
                <div class="w-16 h-1 bg-gradient-to-r from-accentA to-accentB mb-8"></div>
                <h1 class="text-7xl font-black text-white leading-[0.9] tracking-tighter uppercase mb-8">Meet <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-accentUI to-white">Our</span> <br>Team</h1>
                <p class="text-textSecondary text-sm leading-relaxed opacity-80 max-w-sm">
                    Our elite production squad combines decades of experience in broadcast technology and competitive gaming to deliver world-class esports experiences.
                </p>
                <div class="mt-8 flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-accentUI animate-pulse"></div>
                    <p class="text-xs text-accentUI font-mono tracking-widest uppercase">Squad Active</p>
                </div>
            </div>

            <div class="w-7/12 grid grid-cols-2 gap-x-12 gap-y-12 items-center">
                <div class="flex flex-col items-center">
                    <div class="w-full h-36 skew-card relative group">
                        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400" class="unskew-img grayscale hover:grayscale-0 transition-all duration-500">
                        <div class="absolute inset-0 bg-accentA/20 group-hover:bg-transparent transition-colors"></div>
                    </div>
                    <h3 class="mt-4 text-white font-bold text-lg tracking-wide uppercase">Daniel Gallego</h3>
                </div>
                <div class="flex flex-col items-center mt-12">
                    <div class="w-full h-36 skew-card relative group border-r-4 border-accentUI">
                        <img src="https://images.unsplash.com/photo-1595329937107-16cc7871b6d1?w=400" class="unskew-img grayscale hover:grayscale-0 transition-all duration-500">
                        <div class="absolute inset-0 bg-accentUI/20 group-hover:bg-transparent transition-colors"></div>
                    </div>
                    <h3 class="mt-4 text-white font-bold text-lg tracking-wide uppercase">Rufus Stewart</h3>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-full h-36 skew-card relative group">
                        <img src="https://images.unsplash.com/photo-1589254065878-42c9da9e2f58?w=400" class="unskew-img grayscale hover:grayscale-0 transition-all duration-500">
                    </div>
                    <h3 class="mt-4 text-white font-bold text-lg tracking-wide uppercase">Juliana Silva</h3>
                </div>
                <div class="flex flex-col items-center mt-12">
                    <div class="w-full h-36 skew-card relative group border-r-4 border-accentUI">
                        <img src="https://images.unsplash.com/photo-1481214110143-ed630356e1bb?w=400" class="unskew-img grayscale hover:grayscale-0 transition-all duration-500">
                    </div>
                    <h3 class="mt-4 text-white font-bold text-lg tracking-wide uppercase">Olivia Wilson</h3>
                </div>
            </div>
        </main>

        <div class="absolute bottom-6 right-16 flex items-center gap-4">
            <div class="h-[2px] w-12 bg-white/20"></div>
            <div class="text-textSecondary text-sm tracking-widest opacity-60 font-mono font-bold">PAGE 02 / 10</div>
        </div>
    </div>
</body>
</html>
