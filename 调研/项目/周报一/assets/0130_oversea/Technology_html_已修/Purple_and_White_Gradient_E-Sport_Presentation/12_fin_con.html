<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Keynote - Thank You</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #1A0B2E; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .text-gradient {
            background: linear-gradient(90deg, #9D00FF, #D65DB1, #00FFFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text-outline { -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4); color: transparent; }
        .bg-watermark {
            position: absolute; font-size: 260px; font-weight: 900;
            color: rgba(255, 255, 255, 0.02); z-index: 5;
            right: -50px; top: 50%; transform: translateY(-50%);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#1A0B2E',
                        accentA: '#9D00FF',
                        accentB: '#D65DB1',
                        accentUI: '#00FFFF',
                        textSecondary: '#E0D4F5',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1280" class="w-full h-full object-cover opacity-20">
            <div class="absolute inset-0 bg-gradient-to-r from-bgPrimary via-bgPrimary/80 to-transparent"></div>
        </div>

        <div class="bg-watermark">THANKS</div>

        <header class="absolute top-0 left-0 w-full z-30 px-16 py-12">
            <div class="flex items-center gap-5">
                <div class="relative">
                    <div class="absolute inset-0 bg-accentUI blur-lg opacity-30"></div>
                    <div class="w-14 h-14 flex items-center justify-center rounded-tr-xl rounded-bl-xl bg-bgPrimary/90 relative z-10" style="border: 2px solid; border-image: linear-gradient(135deg, #9D00FF, #00FFFF) 1;">
                        <i class="fa-solid fa-bolt-lightning text-2xl text-accentUI"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-white font-black text-2xl tracking-[0.2em] uppercase leading-none">Salford <span class="text-accentUI">&</span> Co.</h2>
                    <div class="flex items-center gap-2 mt-2">
                        <span class="h-[2px] w-6 bg-accentA"></span>
                        <span class="text-[10px] text-textSecondary uppercase tracking-[0.4em] font-bold">Esports Production</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="absolute bottom-0 left-0 w-full z-30 px-16 pb-24 h-full flex flex-col justify-end">
            <div class="mb-12">
                <div class="flex items-center gap-3 mb-6">
                    <span class="w-12 h-[2px] bg-gradient-to-r from-accentA to-accentUI"></span>
                    <span class="text-accentUI font-bold tracking-[0.4em] text-xs uppercase">Contact us for collaboration</span>
                </div>
                <h1 class="font-black uppercase tracking-tighter leading-none">
                    <span class="text-8xl text-outline block mb-4">THANK YOU</span>
                    <span class="text-9xl text-gradient block">FOR WATCHING</span>
                </h1>
            </div>

            <div class="flex gap-6">
                <div class="bg-white/5 backdrop-blur-md border border-white/10 p-5 rounded-lg flex items-center gap-4 min-w-[240px]">
                    <i class="fa-solid fa-phone text-accentA"></i>
                    <div>
                        <span class="block text-[9px] text-white/40 uppercase tracking-widest">Phone</span>
                        <p class="text-white font-mono font-bold text-sm">+123-4567-890</p>
                    </div>
                </div>
                <div class="bg-white/5 backdrop-blur-md border border-white/10 p-5 rounded-lg flex items-center gap-4 min-w-[240px]">
                    <i class="fa-solid fa-envelope text-accentUI"></i>
                    <div>
                        <span class="block text-[9px] text-white/40 uppercase tracking-widest">Email</span>
                        <p class="text-white font-mono font-bold text-sm">HI@SALFORD.PRO</p>
                    </div>
                </div>
            </div>
        </main>

        <div class="absolute bottom-6 right-16 flex items-center gap-4">
            <div class="h-[2px] w-12 bg-white/20"></div>
            <div class="text-textSecondary text-sm tracking-widest opacity-60 font-mono font-bold">PAGE 10 / 10</div>
        </div>
        
        <div class="absolute bottom-0 left-0 w-full h-1 flex">
            <div class="h-full w-1/3 bg-accentA"></div>
            <div class="h-full w-1/3 bg-accentB"></div>
            <div class="h-full w-1/3 bg-accentUI"></div>
        </div>
    </div>
</body>
</html>
