<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Table of Contents - Shodwe Studio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#050214',
                        neonPurple: '#B14AED',
                        neonOrange: '#FF9E64',
                        textGrey: '#94A3B8'
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .writing-vertical { writing-mode: vertical-rl; transform: rotate(180deg); }
        .toc-card { 
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .toc-card:hover { border-color: #B14AED; transform: translateY(-5px); background: rgba(177,74,237,0.05); }
    </style>
</head>
<body>
    <div id="page_container" class="relative mx-auto overflow-hidden bg-bgPrimary text-white font-sans" style="width: 1280px; height: 720px;">
        
        <div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_0%,rgba(177,74,237,0.15)_0%,transparent_70%)]"></div>

        <header class="relative z-20 px-16 pt-12 flex justify-between items-start">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <i class="fa-solid fa-gamepad text-neonPurple text-3xl drop-shadow-[0_0_8px_rgba(177,74,237,0.8)]"></i>
                    <div class="absolute -top-1 -right-1 w-2 h-2 bg-neonOrange rounded-full blur-[1px]"></div>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-white text-xl font-bold tracking-[0.2em] leading-none">SHODWE</h2>
                    <span class="text-[10px] text-textGrey tracking-[0.3em] uppercase opacity-60">Studio</span>
                </div>
            </div>
        </header>

        <main class="relative z-10 px-16 mt-12 text-center">
            <h1 class="text-6xl font-black text-white uppercase tracking-widest leading-none drop-shadow-lg mb-16">
                Table of <span class="text-transparent bg-clip-text bg-gradient-to-r from-neonPurple to-neonOrange">Contents</span>
            </h1>

            <div class="grid grid-cols-3 gap-x-8 gap-y-6 max-w-6xl mx-auto text-left">
                
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">01</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Introduction</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">02</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">History & Growth</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">03</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Audience Analysis</h3>
                </div>

                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">04</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Economic Impact</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">05</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Key Challenges</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group border-t-2 border-t-neonOrange">
                    <span class="text-2xl font-black text-neonOrange opacity-50 group-hover:opacity-100">06</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Academic Paths</h3>
                </div>

                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">07</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Market Trends</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">08</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Future Vision</h3>
                </div>
                <div class="toc-card p-6 rounded-xl flex items-center gap-4 group">
                    <span class="text-2xl font-black text-neonPurple opacity-50 group-hover:opacity-100">09</span>
                    <h3 class="text-sm font-bold uppercase tracking-wider text-white">Summary & Q&A</h3>
                </div>

            </div>
        </main>

        <div class="absolute right-10 top-1/2 transform -translate-y-1/2 flex flex-col items-center gap-3 opacity-30">
            <div class="w-[1px] h-12 bg-white"></div>
            <p class="writing-vertical text-[10px] font-bold tracking-[0.3em] uppercase">TOC / 11</p>
            <div class="w-[1px] h-12 bg-white"></div>
        </div>
    </div>
</body>
</html>
