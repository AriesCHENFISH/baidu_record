<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Esports Gaming - Cover Page</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#050214',
                        neonPurple: '#B14AED',
                        neonOrange: '#FF9E64',
                        textGrey: '#94A3B8'
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .keyword-chip { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 16px; 
            border-radius: 9999px; /* pill shape */
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(177,74,237,0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .main-title-shadow {
            text-shadow: 0 0 30px rgba(177,74,237,0.8), 0 0 60px rgba(255,158,100,0.5);
        }
    </style>
</head>
<body>
    <div id="page_container" class="relative mx-auto overflow-hidden bg-bgPrimary text-white font-sans" style="width: 1280px; height: 720px;">
        
        <img src="https://images.unsplash.com/photo-1593305841991-05c29736f0dc?q=80&w=1280&auto=format&fit=crop" 
             class="absolute inset-0 w-full h-full object-cover opacity-20 mix-blend-screen brightness-125" alt="Background Gaming PC">
        
        <div class="absolute inset-0 bg-gradient-to-br from-[#050214] via-[#050214] to-neonPurple/30 opacity-80"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(177,74,237,0.2)_0%,transparent_60%)]"></div>

        <header class="relative z-20 px-16 pt-12 flex justify-between items-start">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <i class="fa-solid fa-gamepad text-neonPurple text-3xl drop-shadow-[0_0_8px_rgba(177,74,237,0.8)]"></i>
                    <div class="absolute -top-1 -right-1 w-2 h-2 bg-neonOrange rounded-full blur-[1px]"></div>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-white text-xl font-bold tracking-[0.2em] leading-none">SHODWE</h2>
                    <span class="text-[10px] text-textGrey tracking-[0.3em] uppercase opacity-60">Studio</span>
                </div>
            </div>
        </header>

        <main class="relative z-10 px-16 pt-16 flex flex-col justify-center items-center h-full -mt-24">
            <h1 class="text-9xl font-black uppercase tracking-widest leading-none main-title-shadow">
                Esport <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-neonPurple to-neonOrange">Gaming</span>
            </h1>

            <div class="mt-20 flex flex-col items-center gap-4">
                <p class="text-neonPurple text-sm font-bold tracking-[0.3em] uppercase relative pb-2">
                    <span class="relative z-10">Presented by</span>
                    <span class="absolute bottom-0 left-0 w-full h-0.5 bg-neonOrange opacity-40"></span>
                </p>
                <h3 class="text-white text-3xl font-black uppercase tracking-wide">ALEXANDER CHEN</h3>
                <p class="text-textGrey text-lg font-medium tracking-wider">Lead Analyst, Strategic Gaming Division</p>
                <p class="text-textGrey text-sm opacity-70">November 22, 2024</p>
            </div>

            <div class="absolute bottom-16 w-full flex justify-center gap-4">
                <span class="keyword-chip text-neonPurple">Global Market</span>
                <span class="keyword-chip text-neonOrange">Innovation</span>
                <span class="keyword-chip text-neonPurple">Audience Growth</span>
                <span class="keyword-chip text-neonOrange">Future Trends</span>
            </div>
        </main>
    </div>
</body>
</html>
