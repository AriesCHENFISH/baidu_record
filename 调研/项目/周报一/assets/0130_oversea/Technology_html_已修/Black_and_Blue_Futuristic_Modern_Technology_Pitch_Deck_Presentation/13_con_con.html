<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch - Cyberpunk Edition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts CDN (Specific Requirement) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Tailwind Config for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            black: '#000000',
                            cyan: '#4DEEEA',
                            blue: '#0F172A',
                            text: '#D1D5DB',
                            metal: '#A3A3A3'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Roboto', 'sans-serif'],
                    },
                    spacing: {
                        '1280': '1280px',
                        '720': '720px',
                    }
                }
            }
        }
    </script>

    <style>
        /* Global Reset & Basic Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Fixed Size */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        /* Custom Gradients (Strict Adherence to Guidelines) */
        .bg-glow-radial {
            background: radial-gradient(circle at center, rgba(15, 23, 42, 1) 0%, rgba(0, 0, 0, 0) 70%);
        }
        
        .bg-grid-floor {
            background-image: 
                linear-gradient(rgba(77, 238, 234, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 238, 234, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 1000px;
            transform: perspective(500px) rotateX(60deg) translateY(100px) scale(2);
            opacity: 0.2;
        }

        /* Tech Decoration Striped Pattern */
        .tech-stripes {
            background: repeating-linear-gradient(
                -45deg,
                #4DEEEA,
                #4DEEEA 4px,
                transparent 4px,
                transparent 8px
            );
        }

        /* Text Glow Effect */
        .text-glow {
            text-shadow: 0 0 20px rgba(77, 238, 234, 0.4);
        }
        
        /* Circle HUD Border */
        .hud-circle {
            border: 2px solid rgba(77, 238, 234, 0.3);
            border-top: 4px solid #4DEEEA;
            border-right: 4px solid #4DEEEA;
            box-shadow: 0 0 15px rgba(77, 238, 234, 0.2);
        }

    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">

        <!-- Layer 1: Ambient Background -->
        <!-- Deep blue glow in the bottom right to support the image -->
        <div class="absolute bottom-0 right-0 w-[800px] h-[800px] bg-glow-radial opacity-60 translate-x-1/4 translate-y-1/4 pointer-events-none"></div>
        
        <!-- Layer 2: Grid Floor Effect (Simulating depth) -->
        <div class="absolute bottom-[-200px] left-0 w-full h-[400px] bg-grid-floor pointer-events-none"></div>

        <!-- Layer 3: Main Layout Grid -->
        <div class="relative z-10 grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Content (5 Columns) -->
            <div class="col-span-5 pl-20 pt-16 flex flex-col justify-center h-full">
                
                <!-- Tech Decorator Top Left -->
                <div class="absolute top-16 left-20 flex items-center mb-12" style="width: 200px;">
                    <!-- Striped Box -->
                    <div class="w-12 h-3 tech-stripes rounded-sm transform -skew-x-12 mr-2"></div>
                    <!-- Thin Line -->
                    <div class="h-[1px] bg-cyber-cyan w-full opacity-50 relative">
                        <!-- Dot at end -->
                        <div class="absolute right-0 top-1/2 transform -translate-y-1/2 w-1 h-1 bg-cyber-cyan rounded-full"></div>
                    </div>
                </div>

                <!-- Title Section -->
                <div class="mb-8 mt-12">
                    <h1 class="text-6xl font-bold text-white tracking-tight leading-tight">
                        Get In <span class="text-cyber-cyan text-glow">Touch</span>
                    </h1>
                </div>

                <!-- Body Paragraph -->
                <div class="mb-12 pr-10">
                    <p class="text-cyber-text text-lg leading-relaxed font-light">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.
                    </p>
                </div>

                <!-- Contact Info List -->
                <ul class="space-y-8">
                    <!-- Phone -->
                    <li class="flex items-center group">
                        <!-- Icon Container -->
                        <div class="w-12 h-12 rounded-full bg-cyber-cyan flex items-center justify-center shadow-lg shadow-cyan-500/20">
                            <i class="fa-solid fa-phone text-cyber-black text-xl"></i>
                        </div>
                        <!-- Text -->
                        <div class="ml-6">
                            <h6 class="text-white text-xl font-medium tracking-wide">+123-456-7890</h6>
                        </div>
                    </li>

                    <!-- Website -->
                    <li class="flex items-center group">
                        <div class="w-12 h-12 rounded-full border border-cyber-cyan flex items-center justify-center text-cyber-cyan">
                            <i class="fa-solid fa-globe text-xl"></i>
                        </div>
                        <div class="ml-6">
                            <h6 class="text-white text-xl font-medium tracking-wide">www.reallygreatsite.com</h6>
                        </div>
                    </li>

                    <!-- Email -->
                    <li class="flex items-center group">
                        <div class="w-12 h-12 rounded-full border border-cyber-cyan flex items-center justify-center text-cyber-cyan">
                            <i class="fa-solid fa-envelope text-xl"></i>
                        </div>
                        <div class="ml-6">
                            <h6 class="text-white text-xl font-medium tracking-wide">hello@reallygreatsite.com</h6>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Right Column: Visuals (7 Columns) -->
            <div class="col-span-7 relative flex items-center justify-center h-full overflow-hidden">
                
                <!-- Main Circular HUD Container -->
                <!-- Positioned to the right and slightly cut off for dynamic feel -->
                <div class="absolute right-[-100px] w-[850px] h-[850px] rounded-full hud-circle flex items-center justify-center">
                    
                    <!-- Inner Rotating Ring (Static for CSS only) -->
                    <div class="absolute w-[95%] h-[95%] rounded-full border border-white opacity-10 border-dashed"></div>
                    
                    <!-- Decorative HUD Nodes -->
                    <div class="absolute top-[14%] right-[14%] w-4 h-4 bg-cyber-cyan rounded-full shadow-[0_0_10px_#4DEEEA]"></div>
                    <div class="absolute bottom-[14%] left-[14%] w-3 h-3 bg-cyber-cyan rounded-full shadow-[0_0_10px_#4DEEEA]"></div>

                </div>

                <!-- The "AI" Wireframe Head Image -->
                <!-- Using a high-quality Unsplash image representing AI/Data Mesh -->
                <div class="relative z-10 translate-x-10 translate-y-10 w-[600px] h-[700px] flex items-end justify-center">
                    <!-- Image Mask Gradient (Fade bottom) -->
                    <div class="absolute inset-0 z-20" style="background: linear-gradient(to top, #000000 0%, transparent 40%);"></div>
                    
                    <img 
                        src="https://images.unsplash.com/photo-1531746790731-6c087fecd65a?q=80&w=1000&auto=format&fit=crop" 
                        alt="Artificial Intelligence Wireframe Representation" 
                        class="object-contain w-full h-full opacity-90 drop-shadow-[0_0_30px_rgba(77,238,234,0.3)]"
                        style="mix-blend-mode: screen;"
                    >
                    <!-- 600*700 -->
                </div>

                <!-- Floating Abstract City/Data Elements at bottom right -->
                <div class="absolute bottom-0 right-0 w-full h-48 flex items-end justify-end px-12 pb-0 opacity-40 z-0">
                    <!-- Abstract Bars representing data city -->
                    <div class="w-8 h-24 bg-gradient-to-t from-cyber-blue to-transparent mx-1"></div>
                    <div class="w-6 h-32 bg-gradient-to-t from-cyber-blue to-transparent mx-1"></div>
                    <div class="w-10 h-16 bg-gradient-to-t from-cyber-blue to-transparent mx-1"></div>
                    <div class="w-12 h-40 bg-gradient-to-t from-cyber-cyan/30 to-transparent mx-1"></div>
                    <div class="w-8 h-20 bg-gradient-to-t from-cyber-blue to-transparent mx-1"></div>
                </div>

            </div>
        </div>

        <!-- Decorative Corners -->
        <!-- Bottom Left Corner Marker -->
        <div class="absolute bottom-8 left-8 w-4 h-4 border-b-2 border-l-2 border-cyber-text opacity-30"></div>
        <!-- Top Right Corner Marker -->
        <div class="absolute top-8 right-8 w-4 h-4 border-t-2 border-r-2 border-cyber-text opacity-30"></div>

    </div>
</body>
</html>
