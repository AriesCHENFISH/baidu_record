<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerospace Keynote Cover - Premium</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#050505',
                        accent: '#FCE67E', // Gold
                        accentHigh: '#FFFFE0', // Bright Gold highlight
                        subtle: '#2a2a2a',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
                        mono: ['Courier New', 'monospace'],
                    },
                    backgroundImage: {
                        'metal-gradient': 'linear-gradient(180deg, #FCE67E 10%, #FFFFFF 50%, #D4AF37 90%)',
                        'void-gradient': 'radial-gradient(circle at 50% 40%, #1a1a1a 0%, #000000 80%)',
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px;
            background-color: #050505;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 1. NOISE TEXTURE: Adds film/industrial grain */
        .noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.07'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* 2. BACKGROUND GRID */
        .tech-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* 3. ANIMATIONS */
        @keyframes slow-spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
        @keyframes scanline { 0% { top: -10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 110%; opacity: 0; } }

        .spin-cw { animation: slow-spin 80s linear infinite; }
        .spin-ccw { animation: slow-spin 60s linear reverse infinite; }
        .pulse { animation: pulse-glow 4s ease-in-out infinite; }
        
        .scanline-bar {
            position: absolute;
            left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #FCE67E, transparent);
            opacity: 0.5;
            animation: scanline 8s linear infinite;
            z-index: 5;
        }

        /* 4. TEXT EFFECTS */
        .title-glow { 
            text-shadow: 0 0 30px rgba(252, 230, 126, 0.3), 0 0 10px rgba(252, 230, 126, 0.1); 
        }
        
        /* 5. UI MARKERS */
        .corner-bracket {
            position: absolute; width: 40px; height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .corner-bracket::after {
            content: ''; position: absolute; width: 8px; height: 8px; bg-accent;
        }
        
        /* Top Left */
        .tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .tl::after { top: 0; left: 0; border-top: 2px solid #FCE67E; border-left: 2px solid #FCE67E; }
        /* Top Right */
        .tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .tr::after { top: 0; right: 0; border-top: 2px solid #FCE67E; border-right: 2px solid #FCE67E; }
        /* Bottom Left */
        .bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .bl::after { bottom: 0; left: 0; border-bottom: 2px solid #FCE67E; border-left: 2px solid #FCE67E; }
        /* Bottom Right */
        .br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
        .br::after { bottom: 0; right: 0; border-bottom: 2px solid #FCE67E; border-right: 2px solid #FCE67E; }

    </style>
</head>
<body>
    <div id="page_container" class="bg-bgDark">
        
        <!-- LAYER 1: ATMOSPHERE & TEXTURE -->
        <div class="absolute inset-0 bg-void-gradient z-0"></div>
        <div class="noise-overlay"></div>
        <div class="absolute inset-0 tech-grid opacity-40 z-0"></div>
        <div class="scanline-bar"></div>

        <!-- Spotlight Effect at Top -->
        <div class="absolute top-[-200px] left-1/2 transform -translate-x-1/2 w-[800px] h-[400px] bg-accent opacity-5 blur-[100px] z-0"></div>

        <!-- LAYER 2: ORBITAL RINGS (HUD) -->
        <!-- Ring 1: Large faint outer -->
        <div class="absolute w-[680px] h-[680px] border border-[#222] rounded-full opacity-30 z-0"></div>
        
        <!-- Ring 2: Technical Dashed (Clockwise) -->
        <div class="absolute w-[580px] h-[580px] rounded-full spin-cw z-0 opacity-40 border border-[#333]" style="border-style: dashed;"></div>
        
        <!-- Ring 3: Inner Accent (Counter-Clockwise) -->
        <div class="absolute w-[420px] h-[420px] rounded-full spin-ccw z-0 opacity-60 border border-transparent border-t-accent/40 border-b-accent/10"></div>
        
        <!-- Ring 4: Static Glow Core -->
        <div class="absolute w-[300px] h-[300px] bg-gradient-to-b from-accent/5 to-transparent rounded-full blur-3xl z-0 pulse"></div>


        <!-- LAYER 3: CORNER UI -->
        <div class="corner-bracket tl"></div>
        <div class="corner-bracket tr"></div>
        <div class="corner-bracket bl"></div>
        <div class="corner-bracket br"></div>


        <!-- LAYER 4: BRANDING (Top Left) -->
        <div class="absolute top-12 left-12 z-20 flex items-center gap-4">
            <div class="relative w-10 h-10 flex items-center justify-center">
                <div class="absolute inset-0 border border-gray-600 rounded-full"></div>
                <div class="absolute inset-0 border border-dashed border-accent rounded-full animate-[spin_10s_linear_infinite] opacity-80"></div>
                <div class="w-3 h-3 bg-accent transform rotate-45 shadow-[0_0_15px_rgba(252,230,126,1)]"></div>
            </div>
            <div>
                <h2 class="text-2xl font-black text-white leading-none tracking-widest uppercase">Salford</h2>
                <div class="flex items-center gap-2 mt-1">
                    <div class="h-[1px] w-8 bg-accent"></div>
                    <span class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.2em]">Est. 2024</span>
                </div>
            </div>
        </div>

        <!-- LAYER 5: DATE & STATUS (Top Right) -->
        <div class="absolute top-12 right-12 z-20 text-right">
            <div class="flex items-center justify-end gap-2 mb-1">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
                <span class="text-[10px] text-accent font-mono uppercase tracking-widest">Live Feed</span>
            </div>
            <h3 class="text-white font-mono text-xs uppercase tracking-widest opacity-60">Strategic Report // 2025-26</h3>
        </div>


        <!-- LAYER 6: MAIN TITLE (Center) -->
        <div class="relative z-30 flex flex-col items-center justify-center transform translate-y-[-10px]">
            <!-- Subtle Top Label -->
            <span class="text-accent/60 font-mono text-[10px] uppercase tracking-[0.5em] mb-4 border border-accent/20 px-3 py-1 rounded">
                Classified Level 4
            </span>
            
            <!-- HUGE TITLE -->
            <h1 class="text-[120px] font-black italic uppercase leading-[0.85] tracking-tighter text-transparent bg-clip-text bg-metal-gradient title-glow mix-blend-screen">
                Aerospace
            </h1>
            
            <!-- Subtitle with lines -->
            <div class="flex items-center gap-6 mt-4 opacity-90">
                <div class="w-16 h-[1px] bg-gradient-to-r from-transparent to-accent"></div>
                <h2 class="text-4xl font-light text-white uppercase tracking-[0.3em]">Keynote</h2>
                <div class="w-16 h-[1px] bg-gradient-to-l from-transparent to-accent"></div>
            </div>
        </div>


        <!-- LAYER 7: PRESENTER INFO (Bottom Left) -->
        <div class="absolute bottom-12 left-12 z-20">
            <div class="flex items-end gap-8 backdrop-blur-sm p-4 rounded-lg border border-white/5 bg-white/5">
                <!-- Avatar Placeholder / Initials -->
                <div class="w-12 h-12 bg-gradient-to-br from-accent to-[#886600] flex items-center justify-center text-black font-bold text-xl shadow-lg">
                    AV
                </div>
                
                <!-- Info -->
                <div class="flex gap-8">
                    <div>
                        <span class="block text-[9px] text-gray-400 font-mono uppercase tracking-widest mb-1">Speaker</span>
                        <h3 class="text-xl text-white font-bold tracking-wide">Dr. Alex Vance</h3>
                    </div>
                    <div class="border-l border-white/20 pl-6">
                        <span class="block text-[9px] text-gray-400 font-mono uppercase tracking-widest mb-1">Role</span>
                        <h3 class="text-sm text-accent font-bold uppercase tracking-wider mt-1">Chief Engineer</h3>
                    </div>
                </div>
            </div>
        </div>


        <!-- LAYER 8: TECH SPECS (Bottom Right) -->
        <div class="absolute bottom-12 right-12 z-20 text-right opacity-50 font-mono text-[9px] leading-relaxed text-gray-400">
            <p>SYS.CHECK: <span class="text-accent">PASS</span></p>
            <p>ORBIT: GEO-STATIONARY</p>
            <p>UPLINK: 450 TB/s</p>
            <div class="w-full h-[1px] bg-gray-600 my-1"></div>
            <p>V. 4.0.2</p>
        </div>

    </div>
</body>
</html>
