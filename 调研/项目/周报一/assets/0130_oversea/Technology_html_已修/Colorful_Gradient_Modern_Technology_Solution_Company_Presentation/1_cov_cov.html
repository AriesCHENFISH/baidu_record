<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>01 - Cover Wide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; background-color: #f0f4f8; }
        
        /* 宽幅卡片样式 */
        .glass-panel-wide { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(255, 255, 255, 0.7); 
            box-shadow: 0 25px 60px -10px rgba(74, 58, 255, 0.1);
        }

        .mesh-bg { position: absolute; inset: 0; z-index: 0; background: linear-gradient(135deg, #FFD6D6 0%, #D6EBFF 50%, #E0D6FF 100%); }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0; opacity: 0.8; }
        
        .text-gradient { 
            background: linear-gradient(to right, #4A3AFF, #2E2E99); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .grid-lines {
            background-image: linear-gradient(rgba(74, 58, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(74, 58, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="mesh-bg"></div>
        <div class="grid-lines"></div>
        <div class="blob w-[800px] h-[800px] bg-[#C4F5E6] top-[-400px] left-[-200px] opacity-60"></div>
        <div class="blob w-[600px] h-[600px] bg-[#E0D6FF] bottom-[-200px] right-[-100px] opacity-60"></div>

        <div class="absolute top-0 left-0 w-full px-12 py-8 flex justify-between z-50">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-cube text-[#4A3AFF] text-xl"></i>
                <span class="font-bold text-[#1A1A1A] tracking-widest text-sm uppercase">Nexus Studio</span>
            </div>
            <span class="text-xs font-mono text-gray-500 border border-gray-300 px-2 py-1 rounded">INTERNAL KEYNOTE v1.0</span>
        </div>

        <div class="relative z-10 w-full h-full flex flex-col justify-center items-center px-12">
            
            <div class="glass-panel-wide w-[1080px] h-[480px] rounded-[30px] flex flex-col justify-between items-center text-center relative overflow-hidden py-12 px-20">
                
                <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-1.5 bg-[#4A3AFF] rounded-b-full"></div>

                <div class="mt-4">
                    <h2 class="text-sm font-bold text-gray-500 tracking-[0.5em] uppercase mb-6">Strategic Overview 2026</h2>
                    
                    <h1 class="text-7xl font-black mb-6 leading-none tracking-tight text-[#1A1A1A]">
                        THYNK <span class="text-gradient">UNLIMITED</span>
                    </h1>

                    <p class="text-lg text-gray-600 font-medium leading-relaxed max-w-2xl mx-auto">
                        Architecting the digital future through intelligent infrastructure and scalable innovation ecosystems.
                    </p>
                </div>

                <div class="w-full border-t border-gray-300/60 pt-8 mt-4">
                    <div class="flex items-center justify-between px-10">
                        
                        <div class="flex items-center gap-4 text-left">
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-[#4A3AFF] shadow-sm">
                                <i class="fa-regular fa-user"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Presenter</p>
                                <p class="text-sm font-bold text-[#1A1A1A]">Alex Sterling</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 text-left">
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-[#4A3AFF] shadow-sm">
                                <i class="fa-regular fa-calendar"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Date</p>
                                <p class="text-sm font-bold text-[#1A1A1A]">October 24, 2026</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 text-left">
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-[#4A3AFF] shadow-sm">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Location</p>
                                <p class="text-sm font-bold text-[#1A1A1A]">San Francisco HQ</p>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
</body>
</html>
