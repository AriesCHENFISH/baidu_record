<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Health Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #0A0E29; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .bg-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0A0E29 25%, transparent 25%) -50px 0, linear-gradient(225deg, #0A0E29 25%, transparent 25%) -50px 0, linear-gradient(315deg, #0A0E29 25%, transparent 25%), linear-gradient(45deg, #0A0E29 25%, transparent 25%); background-size: 100px 100px; background-color: #12163A; opacity: 0.2; z-index: 1; }
        .chevron { width: 60px; height: 60px; border-right: 8px solid #9D4EDD; border-bottom: 8px solid #9D4EDD; transform: rotate(45deg); box-shadow: 4px 4px 15px rgba(157, 78, 221, 0.4); }
        .title-shadow { text-shadow: 4px 4px 0px #240046; }
        .clip-image-container { clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%); position: relative; z-index: 10; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-pattern"></div>
        <div class="relative z-10 grid grid-cols-12 h-full w-full">
            <div class="col-span-2 h-full flex flex-col justify-center items-center relative">
                <div class="flex flex-col gap-4 absolute left-[-30px]">
                    <div class="chevron"></div><div class="chevron"></div><div class="chevron"></div><div class="chevron"></div><div class="chevron"></div><div class="chevron"></div>
                </div>
            </div>
            <div class="col-span-10 flex flex-col h-full pt-20 pr-12 pb-12 pl-4">
                <div class="grid grid-cols-12 gap-8 h-full">
                    <div class="col-span-7 flex flex-col justify-center">
                        <h1 class="text-7xl font-black text-white uppercase leading-[0.9] mb-12 title-shadow tracking-tighter">
                            Health And <br> <span class="text-[#9D4EDD]">Well-Being</span> <br> In Esports
                        </h1>
                        <div class="flex flex-col gap-4">
                            <div class="bg-[#240046]/50 border-l-4 border-[#9D4EDD] p-4 backdrop-blur-sm">
                                <p class="text-[#E0E0E0] text-gl leading-relaxed opacity-90 italic">Physical posture and ergonomic support are critical for professional endurance.</p>
                            </div>
                            <div class="bg-[#240046]/50 border-l-4 border-[#FF006E] p-4 backdrop-blur-sm">
                                <p class="text-[#E0E0E0] text-gl leading-relaxed opacity-90 italic">Mental health awareness and stress management define the modern training regime.</p>
                            </div>
                            <div class="bg-[#240046]/50 border-l-4 border-white p-4 backdrop-blur-sm">
                                <p class="text-[#E0E0E0] text-gl leading-relaxed opacity-90 italic">Balanced nutrition and consistent sleep cycles are essential for reaction speed.</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-span-5 relative h-full flex items-center justify-end">
                        <div class="absolute top-[-20px] left-[14%] w-[2px] h-[110%] bg-[#FF006E] transform -skew-x-[15deg] z-20 shadow-[0_0_10px_#FF006E]"></div>
                        <div class="w-full h-[500px] clip-image-container bg-[#240046] shadow-2xl relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0A0E29] to-transparent opacity-40 z-10"></div>
                            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2670" class="w-full h-full object-cover opacity-90">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
