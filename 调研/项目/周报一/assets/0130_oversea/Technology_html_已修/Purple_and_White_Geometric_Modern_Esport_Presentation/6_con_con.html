    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Fixed 1280x720 */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #0A0E29;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(36, 0, 70, 0.4) 0%, transparent 50%),
                linear-gradient(180deg, #0A0E29 0%, #0e1235 100%);
        }

        .font-esports {
            font-family: 'Noto Sans SC', sans-serif;
            text-transform: uppercase;
        }

        /* Slanted Card Logic */
        .card-frame {
            transform: skewX(-12deg);
            border: 3px solid #9D4EDD;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
        }
        
        .card-image {
            transform: skewX(12deg) scale(1.2); 
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .role-badge {
            transform: skewX(-12deg);
            background: linear-gradient(90deg, #9D4EDD, #FF006E);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .role-text {
            transform: skewX(12deg);
            display: block;
        }

        .title-shadow {
            text-shadow: 4px 4px 0px #9D4EDD;
        }
    </style>
</head>
