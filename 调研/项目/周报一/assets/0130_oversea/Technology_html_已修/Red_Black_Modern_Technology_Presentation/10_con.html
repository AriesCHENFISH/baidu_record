<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Studio Shodwe - Data Analysis</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primaryBg: '#050202', accentRed: '#D32F2F', textSec: '#C0C0C0' }, fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] } } } }
    </script>
    <style>
        .page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #050202; overflow: hidden; }
        .grid-bg { background-image: radial-gradient(circle, #333 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body>
    <div class="page_container">
        <header class="relative z-30 flex justify-between items-center pt-12 px-16">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-accentRed flex items-center justify-center rotate-45"><i class="fa-solid fa-chart-line text-white -rotate-45"></i></div>
                <div><h2 class="text-white font-bold text-xl tracking-wider uppercase">Studio Shodwe</h2><div class="h-[1px] bg-accentRed mt-0.5 w-full"></div></div>
            </div>
            <div class="border-l-2 border-accentRed pl-4">
                <span class="text-white text-xs tracking-[0.4em] uppercase opacity-50 block">Quantified</span>
                <span class="text-white text-2xl font-bold tracking-[0.2em] uppercase">INNOVATION</span>
            </div>
        </header>

        <main class="relative z-20 grid grid-cols-12 h-full px-16 -mt-10">
            <section class="col-span-6 flex flex-col justify-center pr-12">
                <div class="w-16 h-1 bg-accentRed mb-8"></div>
                <h1 class="text-7xl font-black text-white leading-none mb-14 tracking-tighter uppercase">DATA <br>ANALYSIS</h1>
                
                <div class="grid grid-cols-2 gap-8">
                    <div class="border-t border-accentRed pt-4">
                        <span class="text-accentRed text-4xl font-black">+142%</span>
                        <p class="text-white text-[10px] tracking-widest uppercase mt-2">Market Growth</p>
                    </div>
                    <div class="border-t border-white/20 pt-4">
                        <span class="text-white text-4xl font-black">9.8/10</span>
                        <p class="text-white/40 text-[10px] tracking-widest uppercase mt-2">Customer Satisfaction</p>
                    </div>
                </div>

                <div class="mt-12 bg-white/5 p-6 border-l-4 border-accentRed">
                    <p class="text-textSec text-sm leading-6 text-justify italic">
                        Our internal metrics indicate a significant shift in user interaction paradigms, with a 3.4x increase in prolonged retention rates following the ST-06 hardware rollout.
                    </p>
                </div>
            </section>

            <section class="col-span-6 relative flex items-center justify-end">
                <div class="relative w-[480px] h-[480px] grid-bg p-4 border border-white/5 shadow-2xl">
                    <div class="w-full h-full relative overflow-hidden border-r-4 border-accentRed">
                        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800" class="w-full h-full object-cover brightness-50 contrast-125">
                        <div class="absolute inset-0 bg-gradient-to-r from-primaryBg via-transparent to-transparent"></div>
                        <div class="absolute top-10 right-0 bg-white px-2 py-1 text-[10px] font-black text-primaryBg tracking-tighter uppercase">Telemetry: Active</div>
                    </div>
                </div>
            </section>
        </main>

        <div class="absolute bottom-12 right-0 flex items-center z-30">
            <div class="h-[1px] w-12 bg-accentRed mr-4"></div>
            <div class="bg-accentRed py-4 px-8 text-white font-bold text-2xl italic">10</div>
        </div>
    </div>
</body>
</html>
