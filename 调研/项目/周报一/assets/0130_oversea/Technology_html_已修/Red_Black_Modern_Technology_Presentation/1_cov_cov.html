<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Studio Shodwe - Keynote Cover Enhanced</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgPrimary: '#050202', accentRed: '#D32F2F', textSec: '#C0C0C0' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #050202; overflow: hidden;
        }

        /* 标题高级质感：金属渐变 + 霓虹发光 */
        .title-gradient {
            background: linear-gradient(180deg, #FFFFFF 30%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(211, 47, 47, 0.4));
        }

        /* 字母间的装饰线条 */
        .title-line {
            position: absolute;
            top: 52%;
            left: -5%;
            width: 110%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(211, 47, 47, 0.8), transparent);
            z-index: 20;
        }

        /* 背景空心字样式优化 */
        .outline-text {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.08);
            color: transparent;
            letter-spacing: 0.1em;
        }

        /* 扫描线动画 */
        .scan-line {
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #D32F2F, transparent);
            position: absolute; opacity: 0.2;
            animation: scanning 6s linear infinite;
        }
        @keyframes scanning {
            0% { top: 0%; } 100% { top: 100%; }
        }

        /* 装饰点阵 */
        .dot-grid {
            background-image: radial-gradient(rgba(211, 47, 47, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

    <div id="page_container" class="dot-grid">
        <!-- 基础背景渐变 -->
        <div class="absolute inset-0 z-0" style="background: radial-gradient(circle at 50% 50%, #1a0507 0%, #050202 80%);"></div>
        <div class="scan-line z-0"></div>

        <!-- 顶部导航 (保持 Logo 不变) -->
        <header class="relative z-50 flex justify-between items-center pt-12 px-16">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-accentRed flex items-center justify-center rotate-45 shadow-[0_0_15px_rgba(211,47,47,0.6)]">
                    <i class="fa-brands fa-phoenix-squadron text-white -rotate-45 text-lg"></i>
                </div>
                <div>
                    <h2 class="text-white font-bold text-xl tracking-wider uppercase">Studio Shodwe</h2>
                    <div class="h-[1px] bg-accentRed mt-0.5 w-full opacity-70"></div>
                </div>
            </div>
            <div class="flex items-center gap-8 border-r border-accentRed/30 pr-8">
                <div class="text-right">
                    <span class="text-white text-[10px] tracking-[0.5em] uppercase opacity-50 block mb-0.5">Presentation</span>
                    <span class="text-white text-2xl font-black tracking-[0.2em] uppercase">ANNUAL REPORT</span>
                </div>
            </div>
        </header>

        <!-- 主标题设计优化区 -->
        <main class="absolute inset-0 flex flex-col justify-center items-center z-10">
            <div class="relative group">
                <!-- 背景装饰层：CORE SYSTEMS -->
                <div class="absolute -top-16 left-1/2 -translate-x-1/2 flex flex-col items-center">
                    <h1 class="outline-text text-[160px] font-black uppercase leading-none opacity-40">
                        CORE SYSTEMS
                    </h1>
                    <!-- 副装饰文字 -->
                    <div class="absolute top-1/2 left-0 w-full flex justify-between px-4 opacity-40">
                        <span class="text-[8px] text-accentRed font-mono uppercase tracking-[1em]">v.2026.release</span>
                        <span class="text-[8px] text-accentRed font-mono uppercase tracking-[1em]">sys_auth_confirmed</span>
                    </div>
                </div>

                <!-- 主标题层：TECHNOLOGY -->
                <div class="relative mt-4">
                    <div class="title-line"></div>
                    <!-- 左上角修饰 -->
                    <span class="absolute -top-4 -left-8 text-accentRed font-mono text-[10px] border-l border-t border-accentRed/40 pt-1 pl-1">ID: 88-0X1</span>
                    <!-- 右下角修饰 -->
                    <span class="absolute -bottom-4 -right-8 text-accentRed font-mono text-[10px] border-r border-b border-accentRed/40 pb-1 pr-1">TECH_STRATA</span>
                    
                    <h1 class="text-[140px] font-black tracking-[-0.02em] uppercase leading-none title-gradient relative z-10">
                        TECHNOLOGY
                    </h1>
                </div>

                <!-- 底部修饰 -->
                <div class="mt-8 flex items-center justify-center gap-6">
                    <div class="h-[1px] w-24 bg-gradient-to-r from-transparent via-accentRed to-transparent"></div>
                    <p class="text-[11px] text-textSec tracking-[1.2em] uppercase font-light pl-[1.2em]">Future Logic Provision 2026</p>
                    <div class="h-[1px] w-24 bg-gradient-to-r from-transparent via-accentRed to-transparent"></div>
                </div>
            </div>
        </main>

        <!-- 汇报人信息卡片 (增强质感) -->
        <section class="absolute bottom-16 left-16 z-30">
            <div class="relative bg-gradient-to-br from-white/[0.08] to-transparent backdrop-blur-xl border-l-2 border-accentRed p-6 w-[340px] shadow-2xl">
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-white/20"></div>
                
                <div class="flex flex-col gap-5">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full border border-accentRed/30 flex items-center justify-center bg-accentRed/5">
                            <i class="fa-solid fa-user-gear text-accentRed"></i>
                        </div>
                        <div>
                            <span class="text-[10px] text-accentRed font-bold tracking-[0.2em] uppercase">Executive Presenter</span>
                            <h3 class="text-white text-xl font-bold tracking-tight">Dr. Alex Sterling</h3>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-4">
                        <div>
                            <span class="text-[9px] text-gray-500 uppercase tracking-widest block mb-1">Sector</span>
                            <span class="text-white text-[11px] font-medium tracking-wide">Neural Systems</span>
                        </div>
                        <div>
                            <span class="text-[9px] text-gray-500 uppercase tracking-widest block mb-1">Timestamp</span>
                            <span class="text-white text-[11px] font-medium tracking-wide">JAN 20, 2026</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右下角装饰 (页码与坐标) -->
        <div class="absolute bottom-12 right-0 flex items-center z-30">
            <div class="flex flex-col items-end mr-6 space-y-1">
                <div class="flex items-center gap-2">
                    <span class="w-8 h-[1px] bg-accentRed opacity-40"></span>
                    <span class="text-[9px] text-white/40 tracking-[0.2em] font-mono">ENCRYPTED_DATA_STREAM</span>
                </div>
                <span class="text-[10px] text-white/60 tracking-widest font-mono uppercase">L: 34.0522 N / 118.2437 W</span>
            </div>
            <div class="relative">
                <div class="absolute -inset-1 bg-accentRed blur-sm opacity-30"></div>
                <div class="relative bg-accentRed py-5 px-10 text-white font-black text-3xl italic skew-x-[-12deg]">
                    01
                </div>
            </div>
        </div>

        <!-- 装饰性边角框 -->
        <div class="absolute top-6 right-6 w-48 h-48 border-t border-r border-white/10 pointer-events-none"></div>
        <div class="absolute bottom-6 left-6 w-24 h-24 border-b border-l border-white/10 pointer-events-none"></div>

    </div>

</body>
</html>
