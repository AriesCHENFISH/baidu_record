<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Studio Shodwe - Team</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { bgPrimary: '#050202', accentRed: '#D32F2F', textSec: '#C0C0C0' }, fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] } } } }
    </script>
    <style>
        .page_container { width: 1280px; height: 720px; position: relative; background-color: #050202; margin: 0 auto; overflow: hidden; }
    </style>
</head>
<body>
    <div class="page_container">
        <div class="absolute bottom-0 left-0 w-[800px] h-[300px] bg-accentRed/10 blur-[120px]"></div>

        <header class="relative z-50 flex justify-between items-center pt-12 px-16">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-accentRed flex items-center justify-center rotate-45">
                    <i class="fa-solid fa-shapes text-white -rotate-45"></i>
                </div>
                <div>
                    <h2 class="text-white font-bold text-xl tracking-wider uppercase">Studio Shodwe</h2>
                    <div class="h-[1px] bg-accentRed mt-0.5 w-full"></div>
                </div>
            </div>
            <div class="border-l-2 border-accentRed pl-4">
                <span class="text-white text-xs tracking-[0.4em] uppercase opacity-50 block">Personnel</span>
                <span class="text-white text-2xl font-bold tracking-[0.2em] uppercase">INNOVATION</span>
            </div>
        </header>

        <main class="relative z-20 h-full flex items-center px-16 -mt-10">
            <div class="grid grid-cols-12 gap-0 w-full">
                <div class="col-span-5 relative">
                    <div class="w-[420px] h-[550px] bg-[#121212] relative overflow-hidden group">
                        <img src="https://images.unsplash.com/photo-1622979135228-5118441e9635?w=800" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-bgPrimary via-transparent to-transparent"></div>
                    </div>
                    <div class="absolute -bottom-6 -right-6 w-32 h-32 border-b-2 border-r-2 border-accentRed opacity-40"></div>
                </div>

                <div class="col-span-7 flex flex-col justify-center pl-20">
                    <span class="text-accentRed font-bold text-sm tracking-[0.5em] uppercase mb-4 block">Meet Our Visionaries</span>
                    <h1 class="text-8xl font-black text-white leading-[0.85] mb-12 tracking-tighter uppercase">THE CORE <br>SOUL.</h1>
                    
                    <div class="flex gap-12 max-w-2xl">
                        <div class="flex-1">
                            <h4 class="text-white font-bold mb-4 uppercase text-xs tracking-widest">Leadership</h4>
                            <p class="text-textSec text-sm leading-relaxed opacity-70">A diverse group of industry veterans committed to pushing the envelope of spatial computing.</p>
                        </div>
                        <div class="flex-1 border-l border-white/10 pl-8">
                            <h4 class="text-white font-bold mb-4 uppercase text-xs tracking-widest">Culture</h4>
                            <p class="text-textSec text-sm leading-relaxed opacity-70">Our horizontal hierarchy fosters rapid prototyping and creative freedom.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
