<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Market Overview</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #050314; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif; color: #FFFFFF;
        }
        .text-glow { text-shadow: 0 0 15px rgba(107, 142, 255, 0.6), 0 0 30px rgba(45, 108, 223, 0.4); }
        .title-grunge {
            font-weight: 900; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(to bottom, #FFFFFF 60%, #E0E0E0 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(45, 108, 223, 0.8));
        }
        .bg-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, #050314 10%, rgba(5, 3, 20, 0.85) 50%, rgba(5, 3, 20, 0.6) 100%);
            z-index: 1;
        }
        .diagonal-stripe { transform: skewX(-45deg); }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover opacity-60">
        </div>
        <div class="bg-overlay"></div>

        <div class="absolute top-0 right-0 z-20" style="width: 150px; height: 150px; overflow: hidden;">
            <div style="background-color: #FFFFFF; width: 200px; height: 40px; transform: rotate(45deg) translate(80px, -40px); position: absolute; right: 0; top: 0;"></div>
            <div style="background-color: #2D6CDF; width: 200px; height: 10px; transform: rotate(45deg) translate(80px, 10px); position: absolute; right: 0; top: 0;"></div>
        </div>

        <div class="absolute top-12 left-12 z-30 flex items-center gap-4">
            <div class="w-12 h-12 flex items-center justify-center bg-white/5 border border-white/20 rounded-lg backdrop-blur-sm">
                <i class="fa-solid fa-gamepad text-[#2D6CDF] text-2xl"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-white font-black text-2xl tracking-[0.2em] leading-none">LICERIA</span>
                <span class="text-[#2D6CDF] text-[9px] font-bold tracking-[0.4em] uppercase mt-1">Esports Division</span>
            </div>
        </div>

        <div class="relative z-20 grid grid-cols-12 h-full items-center px-16 pt-10">
            <div class="col-span-6 h-full flex items-center justify-center">
                <div id="main-chart" style="width: 100%; height: 450px;"></div>
            </div>
            <div class="col-span-6 pl-12 flex flex-col justify-center">
                <div class="flex items-center gap-3 mb-2">
                    <div class="h-[2px] w-8 bg-[#2D6CDF]"></div>
                    <h4 class="text-white font-semibold tracking-wider text-sm uppercase">Gaming Player Report</h4>
                </div>
                <div class="mb-8">
                    <h1 class="title-grunge text-7xl italic leading-tight">MARKET<br>OVERVIEW</h1>
                </div>
                <div class="mb-6 border-l-4 border-[#2D6CDF] pl-6 opacity-90">
                    <p class="text-[#E0E0E0] text-lg leading-relaxed font-light">Global viewership is projected to reach new heights, driven by the expansion of mobile gaming and emerging leagues.</p>
                </div>
            </div>
        </div>

        <div class="absolute bottom-10 right-0 z-20 flex items-end">
            <div class="flex gap-3 mr-6 mb-2">
                <div class="w-4 h-8 bg-[#2D6CDF] diagonal-stripe opacity-100"></div>
                <div class="w-4 h-8 bg-[#2D6CDF] diagonal-stripe opacity-60"></div>
                <div class="w-4 h-8 bg-[#2D6CDF] diagonal-stripe opacity-20"></div>
            </div>
            <div class="h-[2px] w-64 bg-gradient-to-l from-[#2D6CDF] to-transparent"></div>
        </div>
    </div>

    <script>
        var myChart = echarts.init(document.getElementById('main-chart'));
        myChart.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis', backgroundColor: 'rgba(5, 3, 20, 0.9)', borderColor: '#2D6CDF', textStyle: { color: '#fff' } },
            legend: { data: ['Desktop', 'Mobile'], top: '0%', textStyle: { color: '#E0E0E0' }, icon: 'rect' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: [{ type: 'category', data: ['2023', '2024', '2025'], axisLine: { lineStyle: { color: '#4B5563' } }, axisLabel: { color: '#E0E0E0' } }],
            yAxis: [{ type: 'value', splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } }, axisLabel: { color: '#E0E0E0' } }],
            series: [
                { name: 'Desktop', type: 'bar', barWidth: '25%', data: [12, 14, 18], itemStyle: { color: '#FFFFFF', borderRadius: [4, 4, 0, 0] } },
                { name: 'Mobile', type: 'bar', barWidth: '25%', data: [15, 19, 24], itemStyle: { color: '#2D6CDF', borderRadius: [4, 4, 0, 0] } }
            ],
            animation: false
        });
    </script>
</body>
</html>
