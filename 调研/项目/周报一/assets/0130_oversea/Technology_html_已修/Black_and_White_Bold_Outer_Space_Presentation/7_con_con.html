<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Role of Robotics - Rimberio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans SC', sans-serif; }
        #page_container { width: 1280px; height: 720px; background-color: #000; margin: 0 auto; position: relative; overflow: hidden; }
        .text-hero { background: linear-gradient(to bottom, #fff 50%, #444 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .guide-line { position: absolute; background: rgba(255, 255, 255, 0.05); pointer-events: none; }
        .crosshair { position: absolute; width: 24px; height: 24px; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.2); }
        .crosshair::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .crosshair::after { width: 1px; height: 100%; left: 50%; top: 0; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="guide-line w-full h-[1px] top-[12%]"></div>
        <div class="guide-line w-[1px] h-full left-[60%]"></div>
        <div class="crosshair top-[11.5%] left-[59.5%]"></div>

        <div class="grid grid-cols-12 h-full gap-12 p-16 relative z-10">
            <div class="col-span-7 flex flex-col justify-start">
                <div class="border border-white/10 rounded-[32px] p-10 bg-white/[0.02] backdrop-blur-md">
                    <h2 class="text-white text-3xl font-bold mb-6 italic tracking-tight">
                        When Humans Can't Go, Machines Can
                    </h2>
                    <p class="text-gray-400 text-sm leading-relaxed mb-10 pr-12">
                        Robotics plays a critical role in space exploration. From autonomous rovers to robotic arms, machines handle complex tasks in dangerous environments, extending human capability across the cosmos.
                    </p>
                    <div class="w-full h-[280px] rounded-2xl overflow-hidden border border-white/5 shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1581093583449-ed25213444e9?q=80&w=1000" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <div class="col-span-5 flex flex-col justify-between">
                <div class="bg-[#EAECEE] rounded-[48px] p-5 flex flex-col gap-5 shadow-2xl h-[500px]">
                    <div class="h-1/2 rounded-[36px] overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?q=80&w=600" class="w-full h-full object-cover grayscale-[20%]">
                    </div>
                    <div class="h-1/2 rounded-[36px] overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1541873676-a18131494184?q=80&w=600" class="w-full h-full object-cover grayscale">
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-10 left-16">
            <h1 class="text-hero text-[80px] font-black uppercase italic tracking-tighter leading-none">
                THE ROLE OF ROBOTICS
            </h1>
        </div>
    </div>
</body>
</html>
