<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rise of Esports - Cover Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans SC', sans-serif; }

        #page_container {
            width: 1280px; height: 720px;
            background-color: #040508;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1E1E40 0%, #040508 100%);
        }

        /* 顶部设计：线性 Logo */
        .top-nav-line {
            position: absolute; top: 40px; left: 60px; right: 60px; height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(102, 106, 246, 0.3) 20%, rgba(102, 106, 246, 0.3) 80%, transparent 100%);
            z-index: 50;
        }
        .logo-center {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 60;
            display: flex; flex-direction: column; align-items: center;
        }
        .logo-dot { width: 4px; height: 4px; background: #666AF6; border-radius: 50%; box-shadow: 0 0 10px #666AF6; margin-bottom: 8px; }

        /* 右上角配套纹理 (已修正语法错误) */
        .top-right-pattern {
            position: absolute; top: 0; right: 0; width: 400px; height: 400px;
            background-image: repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(102, 106, 246, 0.08) 5px, rgba(102, 106, 246, 0.08) 7px);
            mask-image: linear-gradient(to bottom left, black, transparent);
            -webkit-mask-image: linear-gradient(to bottom left, black, transparent);
            z-index: 5;
        }

        /* 标题描边效果 */
        .text-outline { -webkit-text-stroke: 1.5px rgba(102, 106, 246, 0.5); -webkit-text-fill-color: transparent; }

        /* 装饰性大背景字 */
        .bg-watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 300px; font-weight: 900; color: rgba(102, 106, 246, 0.03);
            letter-spacing: -15px; z-index: 0; white-space: nowrap; pointer-events: none;
        }

        /* 关键词标签 */
        .keyword-tag {
            padding: 4px 16px;
            background: rgba(102, 106, 246, 0.1);
            border: 1px solid rgba(102, 106, 246, 0.3);
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #B5C0FF;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-watermark">ESPORTS</div>
        <div class="top-right-pattern pointer-events-none"></div>
        <div class="absolute inset-0 bg-[radial-gradient(rgba(102,106,246,0.05)_1px,transparent_1px)] bg-[size:40px_40px] z-0"></div>

        <div class="top-nav-line"></div>
        <div class="logo-center">
            <div class="logo-dot"></div>
            <h1 class="text-xl font-black tracking-[6px] text-white">LARANA</h1>
            <p class="text-[9px] tracking-[4px] text-[#666AF6] uppercase font-bold">Industry Presentation</p>
        </div>

        <main class="relative z-10 w-full h-full flex flex-col items-center justify-center pt-20">
            
            <div class="flex gap-4 mb-10">
                <div class="keyword-tag">Strategy</div>
                <div class="keyword-tag">Ecosystem</div>
                <div class="keyword-tag">Digital Future</div>
            </div>

            <div class="text-center mb-12">
                <h1 class="text-[120px] font-black italic uppercase leading-none text-white tracking-tighter">
                    THE RISE
                </h1>
                <h1 class="text-[110px] font-black italic uppercase leading-none text-outline -mt-4 tracking-tighter">
                    OF ESPORTS
                </h1>
            </div>

            <div class="flex items-center gap-6 mb-12">
                <div class="w-24 h-[1px] bg-gradient-to-r from-transparent to-[#666AF6]"></div>
                <div class="w-2 h-2 bg-[#666AF6] rotate-45"></div>
                <div class="w-24 h-[1px] bg-gradient-to-l from-transparent to-[#666AF6]"></div>
            </div>

            <div class="flex flex-col items-center gap-3">
                <div class="flex items-center gap-8">
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 font-bold tracking-[2px] uppercase mb-1">Presenter</p>
                        <p class="text-lg font-black text-[#B5C0FF] tracking-wide">Alex Larana</p>
                    </div>
                    <div class="w-[1px] h-10 bg-white/10"></div>
                    <div class="text-left">
                        <p class="text-[10px] text-gray-500 font-bold tracking-[2px] uppercase mb-1">Department</p>
                        <p class="text-lg font-black text-[#B5C0FF] tracking-wide">Global Strategy</p>
                    </div>
                </div>
                <p class="mt-6 text-[9px] text-gray-600 font-mono tracking-[4px] uppercase italic">System Date // 2026.01.15</p>
            </div>
        </main>

        <div class="absolute bottom-12 right-20 z-30">
            <div class="flex items-center gap-4">
                <span class="text-[10px] text-gray-500 font-bold tracking-[3px] uppercase">Scroll to begin</span>
                <button class="w-14 h-14 bg-[#666AF6] rounded-full shadow-[0_0_30px_rgba(102,106,246,0.4)] flex items-center justify-center">
                    <i class="fa-solid fa-arrow-down text-white text-lg"></i>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
