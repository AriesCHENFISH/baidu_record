<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larana Esport Elite Presentation</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans SC', sans-serif; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #040508;
            overflow: hidden;
            color: #ffffff;
        }

        /* 极简顶部修饰 */
        .top-nav-line {
            position: absolute;
            top: 40px;
            left: 50px;
            right: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(102, 106, 246, 0.4) 20%, rgba(102, 106, 246, 0.4) 80%, transparent 100%);
            z-index: 20;
        }

        .logo-wrapper {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 霓虹点缀 */
        .logo-dot {
            width: 4px;
            height: 4px;
            background: #666AF6;
            border-radius: 50%;
            box-shadow: 0 0 8px #666AF6;
            margin-bottom: 8px;
        }

        .brand-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 6px;
            text-indent: 6px; /* 修正字间距偏移 */
            background: linear-gradient(180deg, #fff 0%, #a5a9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtext {
            font-size: 9px;
            letter-spacing: 4px;
            color: #666AF6;
            text-transform: uppercase;
            margin-top: 2px;
            opacity: 0.8;
        }

        /* 背景装饰 */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(102, 106, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        .glow-soft {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(102, 106, 246, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        /* 内容动画感 */
        .content-card {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #666AF6;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-grid"></div>
        <div class="glow-soft -top-20 -left-20"></div>
        <div class="glow-soft -bottom-20 -right-20"></div>

        <div class="top-nav-line"></div>
        <div class="logo-wrapper">
            <div class="logo-dot"></div>
            <h1 class="brand-text">LARANA</h1>
            <p class="brand-subtext">Esports Management</p>
        </div>

        <main class="relative z-10 flex px-24 pt-32 items-center h-full">
            
            <div class="w-5/12">
                <div class="inline-block px-3 py-1 bg-[#666AF6]/10 border border-[#666AF6]/30 text-[#666AF6] text-xs font-bold tracking-tighter mb-6">
                    02 // AUDIENCE REACH
                </div>
                
                <h2 class="text-6xl font-black mb-8 leading-[1.1]">
                    GLOBAL<br>
                    <span class="opacity-50 text-outline" style="-webkit-text-stroke: 1px #fff; -webkit-text-fill-color: transparent;">MARKET</span><br>
                    EXPANSION
                </h2>

                <div class="content-card p-6 pl-8">
                    <p class="text-gray-400 text-base leading-relaxed font-light">
                        Leveraging advanced analytics to dominate the competitive gaming landscape. Our audience retention has grown by 40% year-over-year.
                    </p>
                </div>
            </div>

            <div class="w-7/12 flex justify-center items-center relative">
                <div class="absolute top-0 right-0 text-[100px] font-black opacity-[0.02] select-none">DATA</div>
                
                <div id="audienceChart" class="w-[600px] h-[450px]"></div>
            </div>
        </main>

        <footer class="absolute bottom-10 left-24 right-24 flex justify-between items-center z-20">
            <div class="text-[10px] tracking-[3px] text-gray-600 font-bold">
                SYSTEM STATUS: <span class="text-green-500">OPTIMIZED</span>
            </div>
            
            <div class="flex gap-4">
                <button class="w-12 h-12 flex items-center justify-center border border-white/10 rounded-full hover:bg-white/5 transition-colors">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button class="px-8 py-3 bg-[#666AF6] text-white text-xs font-black tracking-widest rounded-full shadow-[0_5px_15px_rgba(102,106,246,0.4)]">
                    NEXT CHAPTER
                </button>
            </div>
        </footer>
    </div>

    <script type="text/javascript">
        var chartDom = document.getElementById('audienceChart');
        var myChart = echarts.init(chartDom);
        var option = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item' },
            series: [
                {
                    name: 'Market Share',
                    type: 'pie',
                    radius: ['58%', '72%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 0,
                        borderColor: '#040508',
                        borderWidth: 6
                    },
                    label: {
                        show: true,
                        position: 'outside',
                        formatter: '{b|{b}}\n{c|{d}%}',
                        rich: {
                            b: { color: '#888', fontSize: 12, padding: [5, 0] },
                            c: { color: '#fff', fontSize: 18, fontWeight: 'bold' }
                        }
                    },
                    labelLine: {
                        length: 20,
                        length2: 30,
                        lineStyle: { color: '#333' }
                    },
                    data: [
                        { value: 520, name: 'ASIA', itemStyle: { color: '#666AF6' } },
                        { value: 280, name: 'NORTH AMERICA', itemStyle: { color: '#4448b5' } },
                        { value: 190, name: 'EUROPE', itemStyle: { color: '#2a2d75' } }
                    ]
                },
                /* 增加一个内圈装饰 */
                {
                    type: 'pie',
                    radius: ['48%', '49%'],
                    center: ['50%', '50%'],
                    silent: true,
                    label: { show: false },
                    data: [{ value: 1, itemStyle: { color: '#666AF6', opacity: 0.3 } }]
                }
            ]
        };
        myChart.setOption(option);
    </script>
</body>
</html>
