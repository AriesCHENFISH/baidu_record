<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Keynote - Unified Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #ffffff;
        }

        /* 科技背景网格 */
        .bg-grid {
            background-image: linear-gradient(rgba(182, 255, 92, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(182, 255, 92, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* 霓虹发光 */
        .neon-glow {
            text-shadow: 0 0 20px rgba(182, 255, 92, 0.6), 
                         0 0 40px rgba(182, 255, 92, 0.2);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        /* 底部装饰波纹模拟 */
        .data-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #B6FF5C, transparent, #B6FF5C);
            opacity: 0.3;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            neon: '#B6FF5C',
                            pale: '#E0F2C2',
                            meta: '#666666',
                            dark: '#0A0A0A'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container" class="bg-grid flex flex-col items-center justify-between py-16">
        
        <header class="w-full px-12 flex justify-between items-center z-20">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 relative flex items-center justify-center bg-brand-dark border border-brand-neon/30 rounded-lg overflow-hidden shadow-[0_0_20px_rgba(182,255,92,0.2)]">
                    <div class="absolute inset-0 bg-brand-neon/5"></div>
                    <i class="fa-brands fa-hive text-brand-neon text-2xl drop-shadow-[0_0_5px_rgba(182,255,92,0.8)]"></i>
                </div>
                <div class="flex flex-col justify-center">
                    <h6 class="text-white font-bold tracking-[0.2em] text-lg leading-none mb-1">LICERIA<span class="text-brand-neon">.</span></h6>
                    <span class="text-brand-meta text-[10px] font-mono tracking-[0.2em] uppercase leading-none">Secure Systems</span>
                </div>
            </div>

            <div class="text-right">
                <div class="flex items-center justify-end gap-2 mb-1">
                    <div class="w-1 h-1 bg-brand-neon rounded-full animate-pulse"></div>
                    <span class="text-xs font-mono text-brand-neon uppercase tracking-widest">System Online</span>
                </div>
                <h6 class="text-brand-meta font-mono text-sm tracking-widest uppercase">05.07.2025 // V.1.0</h6>
            </div>
        </header>

        <div class="absolute left-10 top-1/2 -translate-y-1/2 flex flex-col items-center gap-8 opacity-20">
            <span class="vertical-text text-[10px] font-mono tracking-[0.5em] uppercase italic">Authorization Required</span>
            <div class="w-px h-32 bg-gradient-to-b from-transparent via-brand-neon to-transparent"></div>
        </div>
        <div class="absolute right-10 top-1/2 -translate-y-1/2 flex flex-col items-center gap-8 opacity-20">
            <span class="vertical-text text-[10px] font-mono tracking-[0.5em] uppercase italic">Encrypted Connection</span>
            <div class="w-px h-32 bg-gradient-to-b from-transparent via-brand-neon to-transparent"></div>
        </div>

        <main class="relative z-10 flex flex-col items-center text-center">
            <div class="flex items-center gap-6 mb-8">
                <div class="h-[1px] w-16 bg-brand-neon/30"></div>
                <h2 class="text-brand-pale text-xl font-light tracking-[0.6em] uppercase">The Human Firewall</h2>
                <div class="h-[1px] w-16 bg-brand-neon/30"></div>
            </div>
            
            <h1 class="text-white text-[120px] font-extrabold uppercase tracking-tighter leading-[0.9] neon-glow">
                Cybersecurity<br/>
                <span class="text-brand-neon">Starts With You</span>
            </h1>

            <div class="mt-10 flex items-center gap-4">
                <span class="text-[10px] font-mono text-brand-meta tracking-widest uppercase">Security Level: Class A</span>
                <div class="flex gap-1">
                    <div class="w-6 h-1 bg-brand-neon"></div>
                    <div class="w-3 h-1 bg-brand-neon/40"></div>
                    <div class="w-1 h-1 bg-brand-neon/20"></div>
                </div>
            </div>
        </main>

        <footer class="w-full px-20 flex justify-center z-10">
            <div class="relative bg-brand-dark/40 backdrop-blur-sm border-t border-b border-white/5 py-8 px-16 flex items-center gap-16 overflow-hidden">
                <div class="absolute top-0 left-0 w-8 h-[2px] bg-brand-neon"></div>
                <div class="absolute bottom-0 right-0 w-8 h-[2px] bg-brand-neon"></div>

                <div class="flex flex-col">
                    <span class="text-[9px] text-brand-neon font-mono uppercase tracking-[0.3em] mb-2 opacity-70">Project Lead</span>
                    <h5 class="text-2xl font-bold tracking-[0.1em] uppercase">Cassian Andor</h5>
                    <p class="text-[10px] text-brand-meta font-mono mt-1">Chief Security Officer</p>
                </div>

                <div class="w-px h-12 bg-white/10"></div>

                <div class="flex flex-col">
                    <span class="text-[9px] text-brand-neon font-mono uppercase tracking-[0.3em] mb-2 opacity-70">Technical Analyst</span>
                    <h5 class="text-2xl font-bold tracking-[0.1em] uppercase">Jyn Erso</h5>
                    <p class="text-[10px] text-brand-meta font-mono mt-1">Lead Data Specialist</p>
                </div>
            </div>
        </main>

        <div class="data-wave"></div>
    </div>

</body>
</html>
