<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fradel Company - Contact</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #05050F; /* Deep Background */
            overflow: hidden;
        }

        /* Ambient Glow Background Effect */
        .ambient-glow {
            position: absolute;
            top: -20%;
            right: -10%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, #18123A 0%, rgba(24, 18, 58, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Vertical Line Accent */
        .border-gradient-vertical {
            background: linear-gradient(180deg, #C8F9E6, #538AB8);
        }

        /* Remove default list styling for nav */
        .nav-list {
            list-style: none !important;
        }
        .nav-list li::before {
            content: none !important;
            display: none !important;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBg: '#05050F',
                        primaryText: '#DDFCF2',
                        secondaryText: '#B0B0B0',
                        accentLight: '#C8F9E6',
                        accentBlue: '#64B0CF'
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div class="page_container">
        <div class="ambient-glow"></div>

        <div class="absolute top-8 left-1/2 transform -translate-x-1/2 w-[95%] z-50">
            <nav class="flex items-center justify-between w-full h-20 px-10 rounded-full" 
                 style="background: linear-gradient(90deg, #6a44f0 0%, #1E1B33 40%, #1E1B33 100%); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);">
                
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-[#DDFCF2] text-[#05050F]">
                        <i class="fa-solid fa-layer-group text-xl"></i>
                    </div>
                    <h2 class="text-[#DDFCF2] text-xl font-bold tracking-wide">Fradel Company</h2>
                </div>

                <ul class="nav-list flex items-center gap-12 m-0 p-0">
                    <li class="cursor-pointer">
                        <b class="text-[#DDFCF2] text-sm tracking-widest hover:text-white transition-colors">HOME</b>
                    </li>
                    <li class="cursor-pointer">
                        <b class="text-[#B0B0B0] text-sm tracking-widest hover:text-[#DDFCF2] transition-colors">ABOUT</b>
                    </li>
                    <li class="cursor-pointer">
                        <b class="text-[#B0B0B0] text-sm tracking-widest hover:text-[#DDFCF2] transition-colors">MORE</b>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="grid grid-cols-12 h-full w-full">
            
            <div class="col-span-5 relative h-full">
                <div class="absolute inset-0 z-0">
                    <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=900&auto=format&fit=crop" 
                         alt="City Skyline Night" 
                         class="w-full h-full object-cover opacity-80"
                         style="mask-image: linear-gradient(to right, black 70%, transparent 100%); -webkit-mask-image: linear-gradient(to right, black 70%, transparent 100%);">
                </div>
                
                <div class="absolute inset-0 bg-gradient-to-t from-deepBg via-transparent to-transparent z-10"></div>

                <div class="absolute bottom-20 left-12 z-20">
                    <h1 class="text-8xl font-bold leading-none text-white drop-shadow-2xl">
                        Thank<br>
                        <span class="text-accentLight">You.</span>
                    </h1>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-center pl-10 pr-20 relative z-10">
                
                <div class="mb-12">
                    <h2 class="text-4xl font-semibold text-primaryText mb-2">Contact Us</h2>
                    <div class="h-1 w-16 bg-gradient-to-r from-accentLight to-accentBlue rounded-full"></div>
                </div>

                <div class="flex items-start gap-8">
                    <div class="w-1.5 h-48 border-gradient-vertical rounded-full shadow-[0_0_15px_rgba(200,249,230,0.3)]"></div>

                    <ul class="flex flex-col gap-10 mt-2 list-none">
                        <li class="group">
                            <div class="flex items-center gap-4 mb-1">
                                <span class="text-accentBlue text-xl w-6 text-center"><i class="fa-solid fa-phone"></i></span>
                                <span class="text-2xl text-primaryText font-light tracking-wide">+123-456-7890</span>
                            </div>
                            <p class="text-sm text-secondaryText pl-10">Mon-Fri, 9am - 6pm EST</p>
                        </li>

                        <li class="group">
                            <div class="flex items-center gap-4 mb-1">
                                <span class="text-accentBlue text-xl w-6 text-center"><i class="fa-solid fa-envelope"></i></span>
                                <span class="text-2xl text-primaryText font-light tracking-wide">hello@reallygreatsite.com</span>
                            </div>
                            <p class="text-sm text-secondaryText pl-10">Online Support 24/7</p>
                        </li>

                        <li class="group">
                            <div class="flex items-center gap-4 mb-1">
                                <span class="text-accentBlue text-xl w-6 text-center"><i class="fa-solid fa-location-dot"></i></span>
                                <span class="text-2xl text-primaryText font-light tracking-wide">123 Anywhere St., Any City</span>
                            </div>
                            <p class="text-sm text-secondaryText pl-10">Headquarters</p>
                        </li>
                    </ul>
                </div>

                <div class="absolute bottom-12 right-12 opacity-20">
                    <div class="w-24 h-24 border border-secondaryText rounded-full flex items-center justify-center">
                        <div class="w-16 h-16 border border-secondaryText rounded-full"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
