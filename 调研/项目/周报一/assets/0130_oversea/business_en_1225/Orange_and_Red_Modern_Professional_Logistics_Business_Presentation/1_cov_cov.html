<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salford & Co - Logistics Presentation</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Fonts (Domestic CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Configuration & Custom Styles -->
    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Specs */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #F9F9FB; /* Global Background */
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* Custom decorative classes */
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }

        .decorative-stripe {
            background: repeating-linear-gradient(
                -45deg,
                #D97036,
                #D97036 6px,
                transparent 6px,
                transparent 14px
            );
        }

        /* Typography Enhancements */
        h1 {
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        
        /* Image Masks & Shapes */
        .image-card {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
        }

        /* Text Utilities */
        .text-brand { color: #D97036; }
        .text-dark { color: #000000; }
        .text-body { color: #333333; }
        .bg-brand { background-color: #D97036; }
        .bg-neutral { background-color: #EBEBEB; }

    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#D97036',
                        bglight: '#F9F9FB',
                        neutralcard: '#EBEBEB',
                        decorative: '#E8C9BC'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Container -->
    <div id="page_container">
        
        <!-- Background Decorative Elements -->
        <!-- Top Right Abstract Wave/Gradient -->
        <div class="absolute -top-20 left-1/3 w-[800px] h-[800px] rounded-full opacity-30" 
             style="background: radial-gradient(circle, #E8C9BC 0%, transparent 70%); filter: blur(60px); z-index: 0;">
        </div>
        
        <!-- Bottom Right Striped Circle Decoration -->
        <div class="absolute -bottom-16 -right-16 w-64 h-64 rounded-full decorative-stripe z-0 opacity-20"></div>

        <!-- Layout Grid -->
        <div class="relative z-10 w-full h-full flex flex-col px-16 py-12">
            
            <!-- Header: Logo & Page Number -->
            <div class="flex justify-between items-center h-16 mb-8">
                <!-- Brand -->
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-brand rounded-lg flex items-center justify-center text-white shadow-lg shadow-orange-200">
                        <i class="fa-solid fa-lightbulb text-lg"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-dark">Salford & Co</span>
                </div>
                <!-- Page Number -->
                <div class="text-body font-mono font-medium text-lg opacity-60">01/12</div>
            </div>

            <!-- Main Content Area: Split View -->
            <div class="flex flex-1 items-center">
                
                <!-- Left Column: Typography -->
                <div class="w-7/12 pr-12 flex flex-col justify-center gap-8">
                    
                    <!-- Headlines -->
                    <div>
                        <h1 class="text-7xl font-bold text-dark mb-4 leading-tight">
                            Driving Efficiency <br>
                            and Growth in <br>
                            <span class="text-brand inline-block relative">
                                Logistics
                                <!-- Subtle underline decoration -->
                                <div class="absolute bottom-2 left-0 w-full h-3 bg-brand opacity-20 -z-10 rounded-full"></div>
                            </span>
                        </h1>
                        
                        <!-- Subtitle / Repeated Text (Restyled as Lead) -->
                        <p class="text-xl text-body font-normal border-l-4 border-neutralcard pl-6 mt-6 max-w-lg">
                            Driving Efficiency and Growth in Logistics
                        </p>
                    </div>

                    <!-- Presenter Card (Redesigned) -->
                    <div class="mt-8 flex items-center gap-0">
                        <!-- Black container pill -->
                        <div class="bg-black text-white px-8 py-5 rounded-2xl flex items-center gap-5 shadow-2xl">
                            <div class="w-12 h-12 rounded-full bg-gray-800 flex items-center justify-center border border-gray-600">
                                <i class="fa-solid fa-user text-white text-lg"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-1">Presented By</span>
                                <span class="text-xl font-bold leading-none">Daniel Gallego</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Right Column: Imagery Composition -->
                <div class="w-5/12 h-full relative flex items-center justify-center">
                    
                    <!-- Abstract geometric backing -->
                    <div class="absolute top-10 right-10 w-[90%] h-[90%] border-2 border-decorative rounded-[40px] opacity-50 transform rotate-3"></div>

                    <!-- Image 1: Main Vertical (Truck/Containers) -->
                    <div class="absolute top-0 right-16 w-[320px] h-[480px] z-20 image-card rounded-[32px] overflow-hidden border-4 border-white transform -rotate-2 hover:rotate-0 transition-transform duration-700 ease-out">
                        <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=1000&auto=format&fit=crop" 
                             alt="Logistics Port" 
                             class="w-full h-full object-cover">
                        <!-- 320*480 -->
                        
                        <!-- Overlay Gradient for depth -->
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/30"></div>
                    </div>

                    <!-- Image 2: Secondary Offset (Details) -->
                    <div class="absolute bottom-12 -right-4 w-[240px] h-[360px] z-30 image-card rounded-[32px] overflow-hidden border-4 border-white shadow-xl transform translate-y-4">
                        <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=800&auto=format&fit=crop" 
                             alt="Container Detail" 
                             class="w-full h-full object-cover">
                        <!-- 240*360 -->
                        
                        <!-- Floating Badge on Image -->
                        <div class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur-sm px-4 py-3 rounded-xl">
                            <div class="flex items-center gap-3">
                                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                <span class="text-xs font-bold text-dark">Global Operations</span>
                            </div>
                        </div>
                    </div>

                    <!-- Decorative elements behind images -->
                    <div class="absolute top-1/2 left-0 w-24 h-24 bg-brand rounded-full blur-2xl opacity-20 -z-10"></div>
                </div>
            </div>
            
        </div>
    </div>

</body>
</html>
