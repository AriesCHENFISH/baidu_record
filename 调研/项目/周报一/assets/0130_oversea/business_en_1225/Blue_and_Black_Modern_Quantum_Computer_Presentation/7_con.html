<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Trends (Real ECharts) - Salford & Co.</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0A0A0E',
                        bgCard: '#121216',
                        primaryBlue: '#1D4ED8',
                        electricBlue: '#2563EB',
                        borderGray: '#2E2E33',
                        textSecondary: '#B0B0B5',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #0A0A0E; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif; color: white;
            background: radial-gradient(circle at 10% 10%, #111827, #0A0A0E 40%);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="absolute top-[-100px] right-[-100px] w-[500px] h-[500px] bg-blue-900/20 rounded-full blur-[100px] z-0 pointer-events-none"></div>
        <div class="absolute top-[150px] left-[50px] w-3 h-3 bg-electricBlue rounded-full shadow-[0_0_10px_#2563EB] z-20"></div>

        <div class="relative z-30 w-full flex items-center justify-between px-12 py-8 border-b border-[#2E2E33]">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 flex items-center justify-center border border-[#1D4ED8] rounded text-[#1D4ED8]"><i class="fa-solid fa-cube text-sm"></i></div>
                <h6 class="text-[#FFFFFF] text-sm font-bold tracking-wide">Salford & Co.</h6>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-[#1D4ED8] rounded-full px-6 py-2 cursor-pointer"><h6 class="text-xs font-semibold text-white">Help</h6></div>
                <div class="border border-[#2E2E33] rounded-full px-6 py-2 cursor-pointer"><h6 class="text-xs font-semibold text-[#B0B0B5]">Contact Us</h6></div>
            </div>
        </div>

        <div class="relative z-10 grid grid-cols-12 gap-12 px-12 mt-10 h-[580px]">
            <div class="col-span-5 flex flex-col justify-center pl-4 pr-8">
                <div class="mb-10">
                    <h1 class="text-6xl font-light text-white leading-[1.1] mb-2 tracking-tight">
                        Future Trends <br>
                        <span class="font-bold text-primaryBlue">Analysis</span>
                    </h1>
                    <div class="flex items-center gap-3 mt-4">
                        <div class="h-[2px] w-12 bg-primaryBlue"></div>
                        <h2 class="text-lg font-bold text-gray-200 tracking-wide">Market Milestones</h2>
                    </div>
                </div>

                <div class="space-y-6 ml-4 border-l-2 border-borderGray pl-6 relative">
                    <div class="relative">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-electricBlue rounded-full shadow-[0_0_10px_#2563EB]"></div>
                        <h3 class="text-lg font-bold text-white mb-1">2025: Advantage</h3>
                        <p class="text-textSecondary text-sm font-light">Commercial viability in niche sectors.</p>
                    </div>
                    <div class="relative">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-bgDark border-2 border-electricBlue rounded-full"></div>
                        <h3 class="text-lg font-bold text-white mb-1">2028: Scaling</h3>
                        <p class="text-textSecondary text-sm font-light">Fault-tolerant prototypes deployed.</p>
                    </div>
                    <div class="relative">
                        <div class="absolute -left-[31px] top-1 w-4 h-4 bg-bgDark border-2 border-electricBlue rounded-full"></div>
                        <h3 class="text-lg font-bold text-white mb-1">2030: Universal</h3>
                        <p class="text-textSecondary text-sm font-light">Mass adoption across enterprise.</p>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative h-full flex items-center">
                <div class="relative w-full h-[500px] rounded-[40px] overflow-hidden border border-borderGray shadow-2xl bg-bgCard p-6 group">
                    <div class="absolute top-0 right-0 w-[200px] h-[200px] bg-blue-900/10 rounded-full blur-[60px] pointer-events-none"></div>
                    <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-primaryBlue"></i>
                        Market Growth Projection
                    </h3>
                    
                    <div id="trendChart" class="w-full h-[400px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var dom2 = document.getElementById('trendChart');
        var myChart2 = echarts.init(dom2);
        var option2;

        option2 = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'axis',
                backgroundColor: 'rgba(18, 18, 22, 0.9)',
                borderColor: '#2E2E33',
                textStyle: { color: '#fff' }
            },
            grid: {
                left: '2%',
                right: '4%',
                bottom: '3%',
                top: '5%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['Q1', 'Q2', 'Q3', 'Q4', 'Q1', 'Q2', 'Q3'],
                axisLine: { lineStyle: { color: '#2E2E33' } },
                axisLabel: { color: '#B0B0B5' }
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: '#2E2E33', type: 'dashed' } },
                axisLabel: { show: false }
            },
            series: [
                {
                    name: 'Market Volume',
                    type: 'line',
                    smooth: true,
                    lineStyle: { width: 0 },
                    showSymbol: false,
                    areaStyle: {
                        opacity: 0.8,
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgb(37, 99, 235)' }, // Electric Blue
                            { offset: 1, color: 'rgba(29, 78, 216, 0.1)' }
                        ])
                    },
                    emphasis: {
                        focus: 'series'
                    },
                    data: [140, 232, 101, 264, 90, 340, 250]
                }
            ]
        };

        if (option2 && typeof option2 === 'object') {
            myChart2.setOption(option2);
        }

        window.addEventListener('resize', myChart2.resize);
    </script>
</body>
</html>
