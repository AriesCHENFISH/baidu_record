<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision & Mission - Layout Design</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBg: '#1A1A1A',
                        accentWhite: '#F2F2F2',
                        paraGrey: '#E0E0E0',
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #1A1A1A;
            overflow: hidden;
            display: flex;
            color: white;
            align-items: center;
        }
        /* 图片展示位的特殊边框装饰 */
        .image-frame::after {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            border-top: 2px solid #F2F2F2;
            border-right: 2px solid #F2F2F2;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="page_container">
        
        <div class="relative z-10 w-full px-20 grid grid-cols-12 gap-16 items-center">
            
            <div class="col-span-7 flex flex-col justify-center">
                <div class="h-1.5 w-24 bg-accentWhite mb-10"></div>
                <h1 class="text-[90px] font-black leading-[0.85] tracking-tighter uppercase italic mb-10 text-white">
                    Future<br>
                    <span class="opacity-30">Vision</span>
                </h1>

                <div class="grid grid-cols-1 gap-12 border-l-2 border-white/10 pl-10">
                    <div>
                        <h2 class="text-3xl font-black uppercase tracking-tight mb-3">Our Mission</h2>
                        <p class="text-paraGrey text-lg leading-relaxed opacity-60 font-light max-w-xl">
                            To empower every organization on the planet with intelligent systems that bridge the gap between imagination and execution.
                        </p>
                    </div>
                    <div>
                        <h2 class="text-3xl font-black uppercase tracking-tight mb-3 opacity-40">Our Purpose</h2>
                        <p class="text-paraGrey text-lg leading-relaxed opacity-30 font-light max-w-xl">
                            Creating a sustainable ecosystem where technology and humanity evolve in perfect harmony for generations to come.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-span-5 flex justify-end">
                <div class="image-frame relative">
                    <div class="w-[420px] h-[560px] rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl transform rotate-2">
                        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1200&auto=format&fit=crop" 
                             class="w-full h-full object-cover grayscale brightness-110 contrast-125" 
                             alt="Office Space">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex flex-col justify-end p-10">
                            <span class="text-white text-xs tracking-[0.4em] uppercase opacity-60 mb-2 font-bold">Concept Space</span>
                            <div class="w-10 h-[1px] bg-white opacity-40"></div>
                        </div>
                    </div>

                    <div class="absolute -bottom-10 -left-16 w-48 h-48 rounded-[2rem] border-8 border-primaryBg overflow-hidden shadow-2xl transform -rotate-6">
                        <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=500&auto=format&fit=crop" 
                             class="w-full h-full object-cover grayscale"
                             alt="Tech Close-up">
                    </div>
                </div>
            </div>

        </div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-white opacity-[0.02] rounded-full blur-[120px] pointer-events-none"></div>
    </div>
</body>
</html>
