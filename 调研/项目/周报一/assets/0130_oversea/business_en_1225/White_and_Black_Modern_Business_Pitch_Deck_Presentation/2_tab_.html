<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Contents - Presentation Slide</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBg: '#1A1A1A',
                        primaryText: '#FFFFFF',
                        accentWhite: '#F2F2F2',
                        strokeColor: '#D0D0D0',
                        secondaryGrey: '#555555',
                        paragraphGrey: '#E0E0E0',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #1A1A1A;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .bg-gradient-decoration {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.05;
            pointer-events: none;
        }

        /* 强调项的微光动画 */
        .active-card-glow {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col justify-center items-center">
        <div class="bg-gradient-decoration" style="top: -100px; left: 50%; transform: translateX(-50%); background: radial-gradient(circle, #FFFFFF, transparent);"></div>

        <main class="w-full flex flex-col justify-center items-center z-10 relative">
            
            <div class="mb-16 text-center">
                <div class="flex items-center justify-center gap-4 mb-4">
                    <div class="w-12 h-[1px] bg-accentWhite opacity-30"></div>
                    <span class="text-accentWhite text-xs tracking-[0.4em] uppercase font-light">Table of Contents</span>
                    <div class="w-12 h-[1px] bg-accentWhite opacity-30"></div>
                </div>
                <h1 class="text-7xl font-bold text-primaryText tracking-tighter italic">List of Contents</h1>
            </div>

            <div class="grid grid-cols-4 gap-6 w-full px-20 max-w-[1150px]">
                
                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all duration-300">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">01</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Who We Are</p>
                </div>

                <div class="bg-accentWhite rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 relative active-card-glow transform scale-105 z-20">
                    <div class="absolute -top-3 -right-3 w-8 h-8 bg-primaryBg text-white rounded-full flex items-center justify-center border-4 border-accentWhite">
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </div>
                    <h2 class="text-6xl font-black text-primaryBg">02</h2>
                    <p class="text-primaryBg text-base font-bold tracking-wider uppercase">Market Insights</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">03</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Our Services</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">04</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Case Studies</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">05</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Expert Team</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">06</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Project Portfolio</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 bg-white/5 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/10 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">07</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Performance</p>
                </div>

                <div class="border border-strokeColor border-opacity-20 rounded-[32px] h-[190px] flex flex-col justify-center items-center gap-3 hover:bg-white/5 transition-all">
                    <h2 class="text-5xl font-bold text-primaryText opacity-40">08</h2>
                    <p class="text-paragraphGrey text-sm tracking-widest uppercase">Future Roadmap</p>
                </div>

            </div>
        </main>

        <div class="absolute bottom-10 left-10 opacity-20 text-[10px] tracking-[0.5em] uppercase text-white [writing-mode:vertical-lr]">
            Innovation & Growth
        </div>
        <div class="absolute top-10 right-10 opacity-20 text-[10px] tracking-[0.5em] uppercase text-white">
            © 2025 Larana Corp
        </div>
    </div>

</body>
</html>
