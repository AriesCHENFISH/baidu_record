<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thynk Unlimited - Meet The Innovators</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">

    <style>
        /* Strict Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Fixed Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background-color: #000000;
            margin: 0 auto;
        }

        /* Custom Decorative Pattern (CSS Only) */
        .bg-grid-pattern {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        accent: '#D8F550',    /* Neon Lime */
                        secondary: '#7F8C8D', /* Grey Text */
                        surface: '#EBEFF2',   /* Light Background */
                        'accent-dark': '#b8d620'
                    },
                    fontSize: {
                        '10xl': '10rem',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container" class="flex">
        
        <div class="w-[65%] h-full bg-primary relative flex flex-col justify-between p-16 z-10 bg-grid-pattern">
            
            <div class="absolute top-0 left-0 w-96 h-96 bg-accent opacity-5 blur-[120px] rounded-full pointer-events-none"></div>

            <div class="flex justify-between items-center w-full z-10 border-b border-gray-800 pb-6">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-white text-black flex items-center justify-center text-xl font-bold">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <h6 class="text-white font-bold text-xl leading-none tracking-wide">Thynk</h6>
                        <p class="text-xs font-medium text-accent tracking-[0.2em] uppercase mt-1">Unlimited</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-accent animate-pulse"></div>
                    <p class="text-secondary text-xs font-bold tracking-widest uppercase">About Our Team</p>
                </div>
            </div>

            <div class="flex flex-col gap-10 mt-4 relative z-10">
                <h1 class="text-white text-8xl font-bold uppercase tracking-tighter leading-[0.85]">
                    Meet The <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-white">Innovators</span>
                    <span class="text-accent text-6xl align-top">.</span>
                </h1>
                
                <div class="flex gap-6 items-start">
                    <div class="w-12 h-[2px] bg-gray-700 mt-4"></div>
                    <p class="text-xl text-gray-400 font-light leading-relaxed max-w-lg">
                        Driving innovation, one line of code at a time. <br>
                        We are building the <span class="text-white font-medium border-b border-accent">future</span> of digital experiences.
                    </p>
                </div>
            </div>

            <div class="flex justify-between items-end z-10">
                <div class="flex gap-8">
                    <div class="group cursor-pointer flex items-center gap-2 text-secondary hover:text-white transition-colors">
                        <i class="fa-brands fa-linkedin"></i>
                        <span class="text-sm font-medium">LinkedIn</span>
                    </div>
                    <div class="group cursor-pointer flex items-center gap-2 text-secondary hover:text-white transition-colors">
                        <i class="fa-brands fa-twitter"></i>
                        <span class="text-sm font-medium">Twitter</span>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-accent text-sm font-bold">www.reallygreatsite.com</p>
                    <p class="text-gray-600 text-xs mt-1">© 2025 All Rights Reserved</p>
                </div>
            </div>
        </div>

        <div class="w-[35%] h-full bg-accent relative flex flex-col justify-between p-12 overflow-hidden">
            
            <div class="absolute -top-20 -right-20 w-64 h-64 border border-black opacity-10 rounded-full"></div>
            <div class="absolute top-40 -right-10 w-32 h-32 bg-black opacity-5 rounded-full"></div>

            <div class="self-end">
                <i class="fa-solid fa-asterisk text-4xl text-black opacity-20"></i>
            </div>

            <div class="relative z-10 flex flex-col gap-6 mt-10">
                <h3 class="text-black text-5xl font-bold leading-[0.95] tracking-tight">
                    Let's dive <br>into what <br>makes us <br>unique.
                </h3>
                
                <div class="w-16 h-2 bg-black"></div>
            </div>

            <div class="mt-auto pt-12">
                <button class="w-full group bg-black text-white h-20 flex items-center justify-between px-8 hover:bg-gray-900 transition-all duration-300">
                    <span class="text-lg font-bold tracking-wide">Explore Now</span>
                    <div class="w-10 h-10 bg-[#FF69B4] text-black rounded-full flex items-center justify-center transform group-hover:rotate-45 transition-transform duration-300">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>
                </button>
            </div>
        </div>

    </div>

</body>
</html>
