<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview Keynote Slide</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts via Baidu CDN as requested -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <style>
        /* CSS Reset & Global Config */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Main Page Container - Strict Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #EBEFF2; /* Global Background from Design System */
            overflow: hidden;
        }

        /* Typography Utilities */
        .font-primary {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Custom Gradients (if needed, adhering to strict rules) */
        .bg-gradient-header {
            background: linear-gradient(to right, #000000, #1a1a1a);
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">
        
        <!-- Decoration: Subtle geometric background element -->
        <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-white opacity-40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4"></div>

        <!-- Header Section -->
        <div class="absolute top-[60px] left-[80px] w-[1120px] flex justify-between items-start z-10">
            <!-- Title -->
            <div class="flex flex-col">
                <h1 class="text-[80px] leading-[0.9] font-black tracking-tighter text-black uppercase">
                    Overview
                </h1>
                <div class="w-[120px] h-[8px] bg-[#000000] mt-6"></div> <!-- Underline decoration -->
            </div>

            <!-- Top Right Icon Box -->
            <div class="w-[80px] h-[80px] bg-[#D8F550] flex justify-center items-center shadow-lg">
                <i class="fa-solid fa-arrow-up-right-from-square text-3xl text-black"></i>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="absolute top-[220px] left-[80px] right-[80px] bottom-[100px] grid grid-cols-2 gap-x-[60px] gap-y-[24px]">
            
            <!-- Column 1 -->
            <div class="flex flex-col gap-[24px]">
                
                <!-- Item 1 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Pink -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#FF69B4]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#FF69B4] transition-colors duration-300">
                            Introduction
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">03</span>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Lime -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#D8F550]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#D8F550] transition-colors duration-300">
                            Meet The Team
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">04</span>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Red -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#E74C3C]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#E74C3C] transition-colors duration-300">
                            Team Achievements
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">05</span>
                    </div>
                </div>

            </div>

            <!-- Column 2 -->
            <div class="flex flex-col gap-[24px]">
                
                <!-- Item 4 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Lime -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#D8F550]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#D8F550] transition-colors duration-300">
                            Diversity Is Our Strength
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">06</span>
                    </div>
                </div>

                <!-- Item 5 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Pink -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#FF69B4]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#FF69B4] transition-colors duration-300">
                            Fun Side Of Tech Life
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">07</span>
                    </div>
                </div>

                <!-- Item 6 -->
                <div class="w-full h-[100px] bg-black flex items-center relative shadow-lg group">
                    <!-- Color Bar: Blue -->
                    <div class="absolute left-0 top-0 bottom-0 w-[12px] bg-[#2980B9]"></div>
                    <div class="flex-1 flex justify-between items-center px-[40px] pl-[40px]">
                        <h2 class="text-white text-[28px] font-bold uppercase tracking-wide group-hover:text-[#2980B9] transition-colors duration-300">
                            Join Us On Our Journey
                        </h2>
                        <span class="text-[#7F8C8D] text-[20px] font-mono font-medium">08</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="absolute bottom-[40px] left-[80px] right-[80px] flex justify-between items-end border-t border-[#CBD5E1] pt-4">
            <!-- Left: Company Name -->
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-[#7F8C8D] text-sm"></i>
                <p class="text-[#7F8C8D] text-sm font-bold uppercase tracking-widest">Thynk Unlimited</p>
            </div>
            
            <!-- Center: Page Name -->
            <p class="text-[#7F8C8D] text-sm font-medium uppercase tracking-widest">Overview</p>
            
        </div>

    </div>

</body>
</html>
