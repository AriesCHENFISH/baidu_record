<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Deck - Redesigned</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%3B900%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Main Page Container */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #121212;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #9D8C9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Refined Glass Effect */
        .bg-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .bg-glass-strong {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Image Filters */
        .img-grayscale {
            filter: grayscale(100%) contrast(120%) brightness(0.9);
            transition: all 0.5s ease;
        }
        
        .img-container:hover .img-grayscale {
            filter: grayscale(0%) contrast(100%);
            transform: scale(1.03);
        }

        /* Custom Arch Mask */
        .arch-mask {
            border-radius: 200px 200px 0 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>

    <div id="page_container" class="bg-grid-pattern">
        
        <div class="absolute top-[-100px] left-[-100px] w-[600px] h-[600px] bg-[#9D8C9D] rounded-full mix-blend-screen filter blur-[150px] opacity-10 pointer-events-none"></div>

        <div class="w-full h-full p-12 grid grid-cols-12 grid-rows-12 gap-6 relative z-10">

            <div class="col-span-12 flex justify-between items-start h-full">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-white/10 flex items-center justify-center rounded-lg border border-white/20">
                        <i class="fa-solid fa-cube text-[#9D8C9D]"></i>
                    </div>
                    <div>
                        <p class="text-white font-bold tracking-widest text-sm uppercase">Fauget</p>
                        <p class="text-[#666] text-[10px] tracking-widest uppercase">Inc.</p>
                    </div>
                </div>

                <div class="text-right">
                    <p class="text-[#B0B0B0] text-xs font-mono">2025.07.25</p>
                    <p class="text-[#666] text-xs font-mono">PITCH_V2.0</p>
                </div>
            </div>

            <div class="col-span-7 row-start-3 row-span-7 flex flex-col justify-center z-20">
                <h1 class="text-[180px] leading-[0.8] font-black text-white tracking-tighter uppercase select-none">
                    Pitch<br>
                    <span class="text-gradient">Deck</span>
                </h1>
                
                <div class="mt-8 flex items-center gap-4 pl-2">
                    <div class="h-[2px] w-16 bg-[#9D8C9D]"></div>
                    <p class="text-white text-xl font-light tracking-wide uppercase">Business Strategy & Vision</p>
                </div>
            </div>

            <div class="col-span-5 row-start-10 row-span-3 flex gap-4 items-end pb-2 pl-2">
                <div class="flex flex-col gap-2">
                    <div class="w-10 h-10 rounded-full bg-glass flex items-center justify-center">
                        <i class="fa-solid fa-chart-line text-[#9D8C9D]"></i>
                    </div>
                    <p class="text-white font-bold text-sm">Growth</p>
                </div>
                <div class="h-10 w-[1px] bg-white/10 self-center"></div>
                <div class="flex flex-col gap-2">
                    <div class="w-10 h-10 rounded-full bg-glass flex items-center justify-center">
                        <i class="fa-solid fa-bullseye text-[#9D8C9D]"></i>
                    </div>
                    <p class="text-white font-bold text-sm">Target</p>
                </div>
                <div class="h-10 w-[1px] bg-white/10 self-center"></div>
                <div class="flex flex-col gap-2">
                    <div class="w-10 h-10 rounded-full bg-glass flex items-center justify-center">
                        <i class="fa-solid fa-coins text-[#9D8C9D]"></i>
                    </div>
                    <p class="text-white font-bold text-sm">Profit</p>
                </div>
            </div>

            <div class="col-span-5 col-start-8 row-start-2 row-span-11 relative flex flex-col items-end h-full">
                
                <div class="w-full h-[85%] arch-mask img-container relative z-10 bg-[#1a1a1a]">
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&auto=format&fit=crop" alt="Architecture" class="w-full h-full object-cover img-grayscale">
                    
                    <div class="absolute top-6 right-6 w-16 h-16 rounded-full bg-white text-black flex items-center justify-center font-bold text-xl shadow-lg z-20">
                        <i class="fa-solid fa-arrow-right -rotate-45"></i>
                    </div>
                </div>

                <div class="w-full h-[15%] mt-4 bg-glass rounded-xl flex items-center justify-between px-6">
                    <div class="flex -space-x-3">
                        <img class="w-8 h-8 rounded-full border border-[#121212] img-grayscale" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=100&auto=format&fit=crop" alt="User">
                        <img class="w-8 h-8 rounded-full border border-[#121212] img-grayscale" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=100&auto=format&fit=crop" alt="User">
                        <div class="w-8 h-8 rounded-full border border-[#121212] bg-[#2a2a2a] flex items-center justify-center text-[10px] text-white">
                            +5
                        </div>
                    </div>
                    
                    <div class="text-right">
                        <p class="text-[#666] text-[10px] uppercase tracking-wider">Presenter</p>
                        <p class="text-white text-sm font-bold">Drew Feig</p>
                    </div>
                </div>

            </div>

        </div>

        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-[#9D8C9D] to-transparent opacity-20"></div>
    </div>

</body>
</html>
