<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Report Keynote - Cover</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#050505', /* Slightly off-black for better screen rendering */
                        accentStart: '#50C878', 
                        accentEnd: '#D0F0C0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    backgroundImage: {
                        'brand-gradient': 'linear-gradient(135deg, #50C878, #D0F0C0)',
                        'brand-gradient-dark': 'linear-gradient(135deg, rgba(80,200,120,0.8), rgba(208,240,192,0.4))',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #050505; overflow: hidden; font-family: 'Inter', sans-serif; color: #FFFFFF;
        }

        /* Typography */
        .text-gradient {
            background: linear-gradient(135deg, #50C878, #D0F0C0);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(80, 200, 120, 0.3));
        }

        /* Advanced Background Image Handling */
        .bg-image-container {
            position: absolute; top: 0; right: 0; width: 70%; height: 100%; z-index: 0;
        }
        .bg-image-container img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%) contrast(110%) brightness(0.6);
            /* Mask: Fades from transparent (left) to opaque (right) */
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 80%);
            mask-image: linear-gradient(to right, transparent 0%, black 80%);
        }

        /* Decorative Elements */
        .gradient-orb {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(80,200,120,0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(40px); z-index: 1;
        }

        .glass-capsule {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(80, 200, 120, 0.3);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="bg-image-container">
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2069&auto=format&fit=crop" alt="Modern Office Architecture">
        </div>
        
        <div class="gradient-orb w-[800px] h-[800px] -bottom-64 -left-64"></div>

        <div class="absolute -right-20 -top-20 w-[500px] h-[500px] rounded-full border border-[#50C878]/20 z-10 flex items-center justify-center">
             <div class="w-[380px] h-[380px] rounded-full border border-[#50C878]/10"></div>
        </div>

        <div class="relative z-20 w-full h-full flex flex-col justify-between p-16">
            
            <header class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-brand-gradient flex items-center justify-center text-black text-xl shadow-[0_0_15px_rgba(80,200,120,0.4)]">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h6 class="text-sm font-bold tracking-[0.25em] uppercase text-white/80">
                    Thynk Unlimited
                </h6>
            </header>

            <main class="flex-grow flex flex-col justify-center">
                <div class="w-2/3 relative">
                    <div class="absolute -top-10 left-2 text-[#50C878] text-opacity-50 text-sm tracking-widest font-mono">
                        // ANNUAL REVIEW 2025
                    </div>

                    <h1 class="text-[130px] leading-[0.85] font-black tracking-tighter text-white mb-2">
                        Business<br>
                        <span class="text-gradient">Report</span>
                    </h1>
                    
                    <p class="mt-8 text-xl text-gray-400 font-light max-w-md border-l-2 border-[#50C878] pl-6 ml-2">
                        Comprehensive analysis of market trends, operational efficiency, and future growth strategies.
                    </p>
                </div>
            </main>

            <footer class="w-full flex justify-center mb-4">
                <div class="glass-capsule rounded-full px-16 py-5 flex items-center gap-16 relative overflow-hidden group">
                    
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out pointer-events-none"></div>

                    <div class="flex items-center gap-3 text-white/90 font-medium tracking-wide text-sm">
                        <i class="fa-solid fa-globe text-[#50C878]"></i>
                        <span>WWW.REALLYGREATSITE.COM</span>
                    </div>

                    <div class="w-px h-4 bg-white/20"></div>

                    <div class="flex items-center gap-3 text-white/90 font-medium tracking-wide text-sm">
                        <i class="fa-solid fa-envelope text-[#50C878]"></i>
                        <span>HELLO@REALLYGREATSITE.COM</span>
                    </div>
                </div>
            </footer>

        </div>
    </div>
</body>
</html>
