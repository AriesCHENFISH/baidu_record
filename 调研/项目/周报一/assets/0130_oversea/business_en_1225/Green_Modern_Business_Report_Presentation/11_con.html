<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Share - Thynk Unlimited</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        /* CSS Reset & Global Standards */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }

        /* Page Container - Strict 1280x720 Constraints */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Gradient Definitions */
        .gradient-bg { background: linear-gradient(135deg, #50C878, #D0F0C0); }
        .text-gradient {
            background: linear-gradient(90deg, #FFFFFF, #D0F0C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
        }

        /* Decorative Elements */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="orb gradient-bg" style="width: 600px; height: 600px; top: -250px; right: -100px; opacity: 0.3;"></div>
        <div class="orb gradient-bg" style="width: 500px; height: 500px; bottom: -250px; left: -150px; opacity: 0.2;"></div>
        <div style="position: absolute; top: 50px; right: -150px; width: 400px; height: 400px; border: 1px solid rgba(80, 200, 120, 0.15); border-radius: 50%; z-index: 0;"></div>

        <div class="relative z-10 w-full h-full flex flex-col p-16">
            
            <header class="flex items-center gap-3 mb-10">
                <i class="fa-solid fa-layer-group text-2xl text-[#50C878]"></i>
                <h6 class="text-sm font-bold tracking-[0.2em] uppercase text-white/90">
                    THYNK UNLIMITED
                </h6>
            </header>

            <main class="flex-1 flex gap-12 items-center">
                
                <div class="w-2/5 flex flex-col justify-center">
                    <div class="mb-8">
                        <div class="inline-block px-3 py-1 mb-4 border border-[#50C878] rounded-full">
                            <span class="text-[#50C878] text-xs font-bold tracking-wider uppercase">Competitive Landscape</span>
                        </div>
                        <h1 class="text-6xl font-bold tracking-tight text-white leading-tight mb-6">
                            Market <br> <span class="text-gradient">Dominance.</span>
                        </h1>
                        <p class="text-gray-300 text-lg leading-relaxed font-light">
                            Thynk Unlimited has secured a leading position in the target sector. Our current 45% market share reflects the successful adoption of our core technologies.
                        </p>
                    </div>
                    
                    <div class="flex gap-8">
                        <div>
                            <h4 class="text-4xl font-bold text-white">45%</h4>
                            <p class="text-sm text-[#50C878] uppercase tracking-wider">Current Share</p>
                        </div>
                        <div>
                            <h4 class="text-4xl font-bold text-white">+12%</h4>
                            <p class="text-sm text-[#D0F0C0] uppercase tracking-wider">YoY Growth</p>
                        </div>
                    </div>
                </div>

                <div class="w-3/5 h-full flex items-center justify-center">
                    <div class="glass-card w-full h-[450px] p-4 relative">
                         <div id="marketPieChart" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>

            </main>

            <div class="mt-auto pt-6 flex items-center justify-between border-t border-white/10">
                <div class="flex items-center gap-2">
                    <span class="h-1 w-1 rounded-full bg-[#50C878]"></span>
                    <span class="text-gray-500 text-xs tracking-wider">CONFIDENTIAL PRESENTATION</span>
                </div>
                <div class="w-32 h-1 bg-gray-800 rounded-full overflow-hidden">
                    <div class="h-full w-3/4 gradient-bg"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Ensure DOM is ready
        document.addEventListener("DOMContentLoaded", function() {
            var chartDom = document.getElementById('marketPieChart');
            var myChart = echarts.init(chartDom);
            var option;

            const colorPalette = [
                new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#50C878' },
                    { offset: 1, color: '#3DA865' }
                ]), 
                '#D0F0C0', 
                'rgba(255, 255, 255, 0.25)', 
                'rgba(255, 255, 255, 0.1)'
            ];

            option = {
                backgroundColor: 'transparent',
                color: colorPalette,
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(0,0,0,0.7)',
                    borderColor: '#50C878',
                    textStyle: { color: '#fff' }
                },
                legend: {
                    orient: 'vertical',
                    right: '5%',
                    top: 'center',
                    itemGap: 20,
                    textStyle: {
                        color: '#fff',
                        fontSize: 14,
                        fontWeight: 300
                    },
                    data: ['Thynk Unlimited', 'Competitor A', 'Competitor B', 'Others']
                },
                series: [
                    {
                        name: 'Market Share',
                        type: 'pie',
                        radius: ['45%', '75%'],
                        center: ['40%', '50%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 10,
                            borderColor: '#000000',
                            borderWidth: 3
                        },
                        label: { show: false, position: 'center' },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: 28,
                                fontWeight: 'bold',
                                color: '#fff',
                                formatter: '{d}%\n{b}'
                            },
                            itemStyle: {
                                shadowBlur: 20,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(80, 200, 120, 0.5)'
                            }
                        },
                        labelLine: { show: false },
                        data: [
                            { value: 45, name: 'Thynk Unlimited', selected: true },
                            { value: 25, name: 'Competitor A' },
                            { value: 15, name: 'Competitor B' },
                            { value: 15, name: 'Others' }
                        ]
                    }
                ]
            };

            option && myChart.setOption(option);
        });
    </script>
</body>
</html>
