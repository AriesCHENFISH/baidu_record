<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Growth - Thynk Unlimited</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <style>
        /* CSS Reset & Global Standards */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }

        /* Page Container - Strict 1280x720 Constraints */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Gradient Definitions */
        .gradient-bg { background: linear-gradient(135deg, #50C878, #D0F0C0); }
        .text-gradient {
            background: linear-gradient(90deg, #FFFFFF, #D0F0C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
        }

        /* Decorative Elements */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="orb gradient-bg" style="width: 800px; height: 300px; bottom: -100px; left: 200px; opacity: 0.25; filter: blur(120px);"></div>
        <div style="position: absolute; top: -150px; left: -150px; width: 500px; height: 500px; border: 1px solid rgba(208, 240, 192, 0.1); border-radius: 50%; z-index: 0;"></div>

        <div class="relative z-10 w-full h-full flex flex-col p-16">
            
            <header class="flex items-center gap-3 mb-8">
                <i class="fa-solid fa-layer-group text-2xl text-[#50C878]"></i>
                <h6 class="text-sm font-bold tracking-[0.2em] uppercase text-white/90">
                    THYNK UNLIMITED
                </h6>
            </header>

            <main class="flex-1 flex flex-col">
                
                <div class="mb-6">
                    <div class="inline-block px-3 py-1 mb-4 border border-[#50C878] rounded-full">
                        <span class="text-[#50C878] text-xs font-bold tracking-wider uppercase">Financial Performance</span>
                    </div>
                    <div class="flex justify-between items-end">
                        <h1 class="text-5xl font-bold tracking-tight text-white leading-tight">
                            Revenue Growth <span class="text-gradient">Trajectory.</span>
                        </h1>
                        <p class="text-gray-400 text-sm max-w-md text-right font-light">
                            Visualizing our quarter-over-quarter revenue acceleration, driven by scalable solution deployment.
                        </p>
                    </div>
                </div>

                <div class="glass-card flex-1 w-full p-6 relative">
                    <div id="revenueLineChart" style="width: 100%; height: 100%;"></div>
                </div>

            </main>

            <div class="mt-auto pt-6 flex items-center justify-between border-t border-white/10">
                <div class="flex items-center gap-2">
                    <span class="h-1 w-1 rounded-full bg-[#50C878]"></span>
                    <span class="text-gray-500 text-xs tracking-wider">CONFIDENTIAL PRESENTATION</span>
                </div>
                <div class="w-32 h-1 bg-gray-800 rounded-full overflow-hidden">
                    <div class="h-full w-[90%] gradient-bg"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Ensure DOM is ready before initializing chart
        document.addEventListener("DOMContentLoaded", function() {
            var chartDom = document.getElementById('revenueLineChart');
            var myChart = echarts.init(chartDom);
            var option;

            option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0,0,0,0.8)',
                    borderColor: '#50C878',
                    textStyle: { color: '#fff' },
                    axisPointer: {
                        type: 'line',
                        lineStyle: {
                            color: '#50C878',
                            width: 1,
                            type: 'dashed'
                        }
                    }
                },
                grid: {
                    top: '15%',
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: ['Q1 2023', 'Q2 2023', 'Q3 2023', 'Q4 2023', 'Q1 2024 (Proj)'],
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
                    axisLabel: { color: 'rgba(255,255,255,0.7)', fontSize: 12 },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    name: 'Revenue ($M)',
                    nameTextStyle: { color: 'rgba(255,255,255,0.5)', padding: [0, 0, 10, 0] },
                    axisLine: { show: false },
                    axisLabel: { color: 'rgba(255,255,255,0.6)', margin: 15 },
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: 'rgba(255,255,255,0.05)',
                            type: 'dashed'
                        }
                    }
                },
                series: [
                    {
                        name: 'Revenue',
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 10,
                        showSymbol: false,
                        itemStyle: {
                            color: '#50C878',
                            borderColor: '#fff',
                            borderWidth: 2
                        },
                        lineStyle: {
                            width: 4,
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                                { offset: 0, color: '#50C878' },
                                { offset: 1, color: '#D0F0C0' }
                            ])
                        },
                        areaStyle: {
                            opacity: 0.6,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(80, 200, 120, 0.6)' }, 
                                { offset: 1, color: 'rgba(80, 200, 120, 0.05)' } 
                            ])
                        },
                        emphasis: {
                            focus: 'series',
                            showSymbol: true
                        },
                        data: [120, 155, 210, 290, 380]
                    }
                ]
            };

            option && myChart.setOption(option);
        });
    </script>
</body>
</html>
