<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Behavior</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background: linear-gradient(135deg, #A2D2F5, #B8DFF9, #C8E6FB); overflow: hidden;
        }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#232323', secondary: '#555555', accent: '#BCE4FA', border: '#333333' },
                    boxShadow: { 'soft': '0 10px 30px -5px rgba(0, 0, 0, 0.1)', 'card': '0 20px 40px -5px rgba(0, 0, 0, 0.2)' }
                }
            }
        }
    </script>
</head>
<body>
    <div id="page_container">
        <header class="w-full px-16 py-10 flex justify-between items-center z-10 relative">
            <div class="border border-border rounded-full px-6 py-2 flex items-center gap-3 bg-white/30 backdrop-blur-sm">
                <i class="fa-solid fa-feather-pointed text-primary text-lg"></i>
                <h6 class="text-primary font-bold text-sm tracking-wide uppercase">Borcelle</h6>
            </div>
            <div class="border border-border rounded-full px-8 py-2 bg-white/30 backdrop-blur-sm">
                <p class="text-primary font-medium text-sm">July 23, 2025</p>
            </div>
        </header>

        <main class="w-full h-[calc(100%-120px)] grid grid-cols-12 gap-8 px-16 pb-12 box-border items-center">
            
            <div class="col-span-4 flex flex-col gap-8">
                <div>
                    <h1 class="text-[64px] leading-[1] font-black text-primary tracking-tighter mb-4">
                        CONSUMER<br>BEHAVIOR
                    </h1>
                    <p class="text-secondary text-base leading-7 font-normal">
                        Analyzing how audiences interact with brands in a mobile-first world. The shift is undeniable.
                    </p>
                </div>

                <div class="bg-primary rounded-[2rem] border border-border p-8 shadow-card text-white relative overflow-hidden group">
                    <i class="fa-solid fa-mobile-screen-button absolute -right-6 -bottom-6 text-[120px] text-white/5 group-hover:text-white/10 transition-colors duration-500"></i>
                    
                    <div class="relative z-10">
                         <h2 class="text-7xl font-bold tracking-tighter mb-2">82<span class="text-4xl">%</span></h2>
                         <p class="text-xl font-bold mb-4">Mobile Engagement</p>
                         <div class="h-px w-full bg-white/20 mb-4"></div>
                         <p class="text-gray-300 text-sm leading-relaxed">
                            Percentage of users who begin their customer journey on a mobile device.
                         </p>
                    </div>
                </div>
            </div>

            <div class="col-span-8 h-full relative overflow-hidden rounded-[2rem] border border-border shadow-soft group">
                <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=800&auto=format&fit=crop" alt="Person using mobile phone" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors duration-500"></div>
            </div>

        </main>
    </div>
</body>
</html>
