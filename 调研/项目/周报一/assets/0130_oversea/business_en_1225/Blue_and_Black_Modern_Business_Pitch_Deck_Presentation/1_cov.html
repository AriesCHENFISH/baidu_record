<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Pitch With Time Info</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
        
        /* 原始配色渐变 */
        .bg-gradient-original {
            background: linear-gradient(135deg, #A2D2F5 0%, #B8DFF9 50%, #C8E6FB 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <div id="page_container" class="relative w-[1280px] h-[720px] overflow-hidden bg-gradient-original flex flex-col items-center justify-center">
        
        <div class="absolute top-[-200px] right-[-200px] w-[600px] h-[600px] bg-white opacity-20 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-[-100px] left-[-100px] w-[500px] h-[500px] bg-white opacity-20 rounded-full blur-[80px] pointer-events-none"></div>

        <header class="absolute top-[50px] left-[60px] right-[60px] flex justify-between items-center z-30">
            <div class="h-[40px] px-6 border border-[#333333] rounded-full flex items-center justify-center bg-[#BCE4FA]/30 backdrop-blur-sm">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-shapes text-[#232323]"></i>
                    <span class="text-[#232323] font-bold text-sm tracking-wide uppercase">Borcelle</span>
                </div>
            </div>
            <div></div>
        </header>

        <main class="z-20 flex flex-col items-center text-center relative top-[-10px]">
            
            <div class="relative mb-8">
                <h1 class="text-[150px] leading-[0.8] font-[900] text-[#232323] tracking-tighter uppercase select-none drop-shadow-sm">
                    PITCH
                </h1>
                <h1 class="text-[150px] leading-[0.8] font-[900] text-white tracking-tighter uppercase select-none opacity-25 absolute top-4 left-4 -z-10">
                    PITCH
                </h1>
                
                <h2 class="text-3xl font-normal text-[#232323] mt-4 tracking-[0.3em] uppercase opacity-90">
                    Business Deck
                </h2>
            </div>

            <div class="mb-10 relative h-[84px] w-[380px] rounded-full bg-white/90 border border-[#333333] shadow-xl flex items-center p-1.5 cursor-pointer transition-transform hover:scale-105 duration-300">
                <div class="h-full flex-1 rounded-l-full overflow-hidden relative mr-3">
                    <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                         alt="Team" 
                         class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-[#232323]/20 flex items-center pl-6">
                        <span class="text-white font-bold tracking-wide text-sm drop-shadow-md">View Strategy</span>
                    </div>
                </div>
                <div class="w-[72px] h-[72px] bg-[#232323] rounded-full flex items-center justify-center shadow-md shrink-0 group">
                    <i class="fa-solid fa-arrow-right text-white text-xl transform -rotate-45 group-hover:rotate-0 transition-transform duration-300"></i>
                </div>
            </div>

            <div class="flex flex-col items-center gap-4">
                
                <div class="w-[1px] h-[20px] bg-[#333333] opacity-40"></div>
                
                <div class="text-center">
                    <p class="text-[#555555] text-[10px] font-bold tracking-widest uppercase mb-2 opacity-80">Presented by</p>
                    <div class="px-8 py-2.5 border border-[#333333] rounded-full bg-[#BCE4FA]/20 backdrop-blur-sm shadow-sm">
                        <span class="text-[#232323] text-lg font-bold">Drew Feig</span>
                    </div>
                </div>

                <div class="flex items-center gap-3 mt-1 px-4 py-1 rounded-lg">
                    <div class="flex items-center gap-2 text-[#444444]">
                        <i class="fa-regular fa-calendar text-xs"></i>
                        <span class="text-xs font-semibold tracking-wide">July 23, 2025</span>
                    </div>
                    <span class="text-[#333333] opacity-40">|</span>
                    <div class="flex items-center gap-2 text-[#444444]">
                        <i class="fa-regular fa-clock text-xs"></i>
                        <span class="text-xs font-semibold tracking-wide">14:00 PM</span>
                    </div>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
