<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Content - Corporate Keynote</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (via Baidu CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Refactoring */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Font Setting */
        body, html {
            font-family: 'Noto Sans SC', sans-serif; /* Fallback to sans-serif if Noto not available */
            -webkit-font-smoothing: antialiased;
        }

        /* Page Container Specs */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #A2D2F5, #B8DFF9, #C8E6FB);
        }

        /* Custom Utility for Vertical Text */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        /* Custom Scrollbar hide just in case content slightly overflows (though it shouldn't) */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div class="page_container flex flex-col justify-between p-12">

        <!-- Top Navigation / Header Area -->
        <header class="flex justify-between items-center w-full mb-8 z-20">
            <!-- Logo Pill -->
            <div class="flex items-center gap-3 px-6 py-2 border border-[#333333] rounded-full bg-[#BCE4FA]/30 backdrop-blur-sm">
                <i class="fa-solid fa-feather-pointed text-[#232323] text-xl"></i>
                <span class="text-[#232323] font-bold text-lg tracking-wide">Borcelle</span>
            </div>

            <!-- Date Pill -->
            <div class="px-8 py-2 border border-[#333333] rounded-full bg-[#BCE4FA]/30 backdrop-blur-sm">
                <span class="text-[#555555] font-medium text-sm">July 23, 2025</span>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="flex flex-1 gap-10 items-stretch h-full">
            
            <!-- Left: Image Pillar -->
            <!-- Using a pill-shaped container for the image to match the visual language -->
            <div class="w-[240px] h-[580px] rounded-[120px] border border-[#333333] overflow-hidden relative shadow-lg bg-white group">
                <!-- Image Overlay for mood -->
                <div class="absolute inset-0 bg-gradient-to-t from-[#232323]/40 to-transparent z-10"></div>
                <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                     alt="Business Team Meeting" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                <!-- 240*550 -->
            </div>

            <!-- Center: Content Grid (The List) -->
            <div class="flex-1 flex items-center">
                <ul class="grid grid-cols-2 gap-x-8 gap-y-5 w-full">
                    <!-- Item 01 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">01</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Who We Are?</span>
                        </div>
                    </li>

                    <!-- Item 05 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">05</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Our Team</span>
                        </div>
                    </li>

                    <!-- Item 02 (Active/Highlighted) -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#232323] border border-[#232323] rounded-full p-2 pr-6 shadow-xl transform scale-105 origin-left">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">02</span>
                            </div>
                            <span class="text-white font-bold text-lg">Market Insights</span>
                        </div>
                    </li>

                    <!-- Item 06 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">06</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Our Portfolio</span>
                        </div>
                    </li>

                    <!-- Item 03 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">03</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Services We Offer</span>
                        </div>
                    </li>

                    <!-- Item 07 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">07</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Our Performance</span>
                        </div>
                    </li>

                    <!-- Item 04 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">04</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">Why Choose Us?</span>
                        </div>
                    </li>

                    <!-- Item 08 -->
                    <li>
                        <div class="flex items-center gap-4 bg-[#FFFFFF]/60 border border-[#333333]/20 rounded-full p-2 pr-6 hover:bg-white transition-colors duration-300">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm">
                                <span class="text-[#232323] font-bold text-xl">08</span>
                            </div>
                            <span class="text-[#555555] font-medium text-lg">What's Next for Us?</span>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Right: Vertical Title -->
            <div class="flex justify-end items-end h-full ml-4">
                <h1 class="vertical-text text-[60px] leading-none font-black text-[#232323] opacity-90 tracking-tighter uppercase whitespace-nowrap drop-shadow-sm">
                    List of <span class="text-transparent bg-clip-text bg-gradient-to-t from-[#232323] to-[#555555]">Content</span>
                </h1>
            </div>

        </div>

        <!-- Decorative Background Element (Subtle Geometry) -->
        <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-[#BCE4FA] rounded-full blur-3xl opacity-40 pointer-events-none z-0"></div>
    </div>

</body>
</html>
