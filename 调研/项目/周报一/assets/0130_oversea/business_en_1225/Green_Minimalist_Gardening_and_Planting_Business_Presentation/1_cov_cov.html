<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover - Green House</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBg: '#151B22',
                        globalBg: '#6E777D',
                        textWhite: '#FFFFFF',
                        textGray: '#C9D1D9',
                        tabBg: '#4C555C',
                        organicShadow: '#0F151A',
                        accentGreen: '#4A6F52',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; position: relative;
            background-color: #6E777D; margin: 0 auto; overflow: hidden;
        }
        /* The organic curve mask for the right image area */
        .organic-shape-mask-cover {
            border-top-left-radius: 250px;
            border-bottom-left-radius: 100px;
        }
        /* Subtle text shadow for better pop */
        .title-shadow {
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-[40px] right-[80px] z-0 flex items-end space-x-2">
            <div class="h-[70px] w-[240px] bg-primaryBg rounded-t-2xl flex items-center justify-center relative -mb-1 shadow-[0_-5px_15px_rgba(0,0,0,0.2)]">
                <span class="text-textWhite font-bold text-lg tracking-wide">Welcome</span>
            </div>
        </div>

        <div class="absolute bottom-[40px] left-[40px] right-[40px] top-[100px] bg-primaryBg rounded-[40px] shadow-2xl flex overflow-hidden z-10">
            
            <div class="w-[50%] h-full p-[80px] flex flex-col justify-center relative z-20">
                
                <div class="absolute top-[60px] left-[80px] flex items-center">
                    <i class="fa-solid fa-leaf text-accentGreen mr-3"></i>
                    <h3 class="text-accentGreen font-medium text-xl tracking-widest uppercase">Giggling Platypus Co.</h3>
                </div>

                <div class="mt-10">
                    <h1 class="text-textWhite text-[100px] font-black leading-[0.9] mb-6 tracking-tighter title-shadow">
                        GREEN <br>
                        <span class="text-accentGreen">HOUSE</span>
                    </h1>
                    
                    <div class="flex items-center">
                        <div class="w-12 h-[2px] bg-accentGreen mr-4"></div>
                        <h2 class="text-textGray text-2xl font-light tracking-wider">
                            Gardening and Planting Presentation Design
                        </h2>
                    </div>
                </div>

                <div class="absolute bottom-[60px] left-[80px] opacity-50">
                    <span class="text-textGray text-sm tracking-widest">2024 EDITION // VOL. 1</span>
                 </div>

            </div>

            <div class="w-[50%] h-full relative">
                <div class="absolute inset-0 w-full h-full organic-shape-mask-cover overflow-hidden border-l-[6px] border-primaryBg bg-organicShadow z-10">
                    <div class="absolute inset-0 bg-gradient-to-r from-primaryBg via-organicShadow/60 to-transparent z-20"></div>
                    
                    <img src="https://images.unsplash.com/photo-1466781783310-a2acda485f22?q=80&w=2000&auto=format&fit=crop" 
                         alt="Lush green botanical garden greenhouse" 
                         class="w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-1000 ease-in-out">
                </div>

                <div class="absolute top-[100px] -left-[80px] w-[200px] h-[200px] rounded-full border-[6px] border-primaryBg shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-30 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1615563821068-b434ae486b07?q=80&w=1000&auto=format&fit=crop" 
                         alt="Close up texture of a large green leaf" 
                         class="w-full h-full object-cover">
                </div>

                <div class="absolute top-6 right-6 z-40 opacity-80">
                     <i class="fa-brands fa-pagelines text-textWhite text-5xl drop-shadow-lg"></i>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
