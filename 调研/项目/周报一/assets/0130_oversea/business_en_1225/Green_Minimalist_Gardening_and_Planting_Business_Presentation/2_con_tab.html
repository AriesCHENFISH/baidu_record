<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBg: '#151B22',
                        globalBg: '#6E777D',
                        textWhite: '#FFFFFF',
                        textGray: '#C9D1D9',
                        tabBg: '#4C555C',
                        organicShadow: '#0F151A',
                        accentGreen: '#4A6F52',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; position: relative;
            background-color: #6E777D; margin: 0 auto; overflow: hidden;
        }
        .organic-shape-mask {
            border-top-left-radius: 200px;
            border-bottom-left-radius: 60px;
        }
        /* Style for large background numbers */
        .toc-number-bg {
            font-size: 120px;
            font-weight: 900;
            color: rgba(74, 111, 82, 0.1); /* accentGreen with very low opacity */
            position: absolute;
            left: -20px;
            top: -40px;
            z-index: 0;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-[40px] right-[80px] z-0 flex items-end space-x-2">
             <div class="h-[60px] w-[240px] bg-tabBg rounded-t-2xl flex items-center justify-center relative">
                <span class="text-textGray font-medium text-lg tracking-wide">Giggling Platypus Co.</span>
            </div>
            <div class="h-[70px] w-[200px] bg-primaryBg rounded-t-2xl flex items-center justify-center relative -mb-1 shadow-[0_-5px_15px_rgba(0,0,0,0.2)]">
                <span class="text-textWhite font-bold text-lg tracking-wide">Contents</span>
            </div>
        </div>

        <div class="absolute bottom-[40px] left-[40px] right-[40px] top-[100px] bg-primaryBg rounded-[40px] shadow-2xl flex overflow-hidden z-10">
            
            <div class="w-[55%] h-full p-[70px] flex flex-col relative z-20">
                
                <h1 class="text-textWhite text-5xl font-bold mb-12 tracking-tight relative z-10">
                    Table of <span class="text-accentGreen">Contents</span>
                </h1>

                <div class="flex flex-col space-y-8 relative z-10 pl-4">
                    
                    <div class="relative flex items-center group cursor-pointer">
                        <span class="toc-number-bg group-hover:text-accentGreen/20 transition-colors">01</span>
                        <div class="w-1 h-8 bg-accentGreen absolute -left-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="ml-12">
                            <h3 class="text-textWhite text-2xl font-bold group-hover:text-accentGreen transition-colors">Introduction</h3>
                            <p class="text-textGray text-sm opacity-70">The mission of Giggling Platypus Co.</p>
                        </div>
                    </div>

                     <div class="relative flex items-center group cursor-pointer">
                        <span class="toc-number-bg group-hover:text-accentGreen/20 transition-colors">02</span>
                        <div class="w-1 h-8 bg-accentGreen absolute -left-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="ml-12">
                            <h3 class="text-textWhite text-2xl font-bold group-hover:text-accentGreen transition-colors">Plant Varieties</h3>
                            <p class="text-textGray text-sm opacity-70">Exploring our diverse collection.</p>
                        </div>
                    </div>

                    <div class="relative flex items-center group cursor-pointer">
                        <span class="toc-number-bg group-hover:text-accentGreen/20 transition-colors">03</span>
                        <div class="w-1 h-8 bg-accentGreen absolute -left-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="ml-12">
                            <h3 class="text-textWhite text-2xl font-bold group-hover:text-accentGreen transition-colors">Optimal Care Guide</h3>
                            <p class="text-textGray text-sm opacity-70">Water, sunlight, and soil needs.</p>
                        </div>
                    </div>

                     <div class="relative flex items-center group cursor-pointer">
                        <span class="toc-number-bg group-hover:text-accentGreen/20 transition-colors">04</span>
                        <div class="w-1 h-8 bg-accentGreen absolute -left-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <div class="ml-12">
                            <h3 class="text-textWhite text-2xl font-bold group-hover:text-accentGreen transition-colors">Future Growth</h3>
                            <p class="text-textGray text-sm opacity-70">Sustainability and next steps.</p>
                        </div>
                    </div>

                </div>

            </div>

            <div class="w-[45%] h-full relative">
                <div class="absolute inset-0 w-full h-full organic-shape-mask overflow-hidden border-l-8 border-primaryBg bg-organicShadow">
                    <div class="absolute inset-0 bg-gradient-to-r from-organicShadow/60 to-transparent z-10"></div>
                    <img src="https://images.unsplash.com/photo-1530836369250-ef7208b5c300?q=80&w=2000&auto=format&fit=crop" 
                         alt="Rows of potted plants in a nursery" 
                         class="w-full h-full object-cover opacity-80 hover:scale-105 transition-transform duration-700">
                </div>

                <div class="absolute bottom-[100px] -left-[120px] w-[280px] h-[280px] rounded-full border-[8px] border-primaryBg shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-20 overflow-hidden bg-gray-800">
                    <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?q=80&w=1000&auto=format&fit=crop" 
                         alt="Monstera leaf close up" 
                         class="w-full h-full object-cover opacity-90">
                </div>

                <div class="absolute top-6 right-6 z-30 opacity-60">
                     <i class="fa-solid fa-list-ol text-white text-3xl drop-shadow-md"></i>
                </div>
            </div>

            <div class="absolute bottom-10 right-12 z-30 flex items-center space-x-3 cursor-pointer group">
                <span class="text-textWhite text-lg font-medium group-hover:tracking-wider transition-all duration-300">Start</span>
                <i class="fa-solid fa-arrow-right-long text-textWhite text-lg group-hover:translate-x-2 transition-transform duration-300"></i>
            </div>

        </div>
    </div>

</body>
</html>
