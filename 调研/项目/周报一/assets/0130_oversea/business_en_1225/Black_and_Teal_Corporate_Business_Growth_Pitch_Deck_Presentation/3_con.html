<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Market Barriers - Keynote</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts: Noto Sans SC (Domestic Mirror) & Inter -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0E1011',
                        primary: '#B0E6DC',
                        primaryDark: '#2C3E3A',
                        textMain: '#FFFFFF',
                        textSub: '#D1D5DB',
                        accentLine: '#5A6B68',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Reconstruction / Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Fixed Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #0E1011;
            overflow: hidden; /* Ensure no scrollbars within the slide */
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* Utility for B&W Image Filter to match style */
        .img-bw {
            filter: grayscale(100%) contrast(110%);
            transition: all 0.5s ease;
        }
        
        /* Subtle Gradient Overlay for images */
        .img-overlay {
            background: linear-gradient(0deg, rgba(14,16,17,0.4) 0%, rgba(14,16,17,0) 100%);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <!-- Decorative Background Element: Top Center Spotlight (Primary Variant) -->
        <div class="absolute top-[-150px] left-1/2 transform -translate-x-1/2 w-[600px] h-[600px] bg-[#2C3E3A] rounded-full blur-3xl opacity-40 z-0"></div>

        <!-- Decorative Accent Lines (Subtle diagonals) -->
        <div class="absolute top-0 left-20 w-[1px] h-[300px] bg-gradient-to-b from-[#5A6B68] to-transparent opacity-30 z-0 rotate-12"></div>
        <div class="absolute top-0 right-20 w-[1px] h-[300px] bg-gradient-to-b from-[#5A6B68] to-transparent opacity-30 z-0 -rotate-12"></div>

        <!-- Main Content Wrapper -->
        <div class="relative z-10 w-full h-full flex flex-col items-center pt-10 px-12">

            <!-- 1. Header / Logo Section -->
            <div class="mb-4">
                <h6 class="text-white text-sm font-bold tracking-[0.2em] uppercase flex items-center gap-2">
                    <i class="fa-solid fa-shapes text-[#B0E6DC]"></i>
                    Warner & Spencer
                </h6>
            </div>

            <!-- 2. Title Section -->
            <div class="text-center mb-8 max-w-4xl">
                <h1 class="text-[#B0E6DC] text-6xl font-bold leading-tight tracking-tight mb-6 drop-shadow-lg">
                    Understanding the<br>
                    <span class="text-white">Market Barriers</span>
                </h1>
                
                <!-- Description Text -->
                <p class="text-[#D1D5DB] text-lg font-light leading-relaxed max-w-2xl mx-auto">
                    Modern businesses face rising operational costs, inefficiencies in resource management, and growing customer expectations in an evolving digital landscape.
                </p>
            </div>

            <!-- 3. Visual Grid Section -->
            <!-- Using CSS Grid to perfectly align the 3-image layout -->
            <div class="w-full flex-1 grid grid-cols-12 gap-8 items-end pb-12">
                
                <!-- Left Column: Vertical Image -->
                <div class="col-span-3 h-full flex flex-col justify-end">
                    <div class="relative w-full h-[320px] rounded-2xl overflow-hidden border border-[#2C3E3A]">
                        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?q=80&w=600&auto=format&fit=crop" 
                             alt="Team analysis" 
                             class="w-full h-full object-cover img-bw">
                        <!-- 280*320 -->
                        <div class="absolute inset-0 img-overlay"></div>
                    </div>
                </div>

                <!-- Center Column: Horizontal Image + Decorative Element -->
                <div class="col-span-6 h-full flex flex-col justify-end items-center relative">
                    
                    <!-- Decorative Connector Line/Dot -->
                    <div class="flex flex-col items-center mb-4">
                        <div class="w-[1px] h-8 bg-gradient-to-b from-transparent to-[#B0E6DC]"></div>
                        <div class="w-3 h-3 rounded-full bg-[#B0E6DC] shadow-[0_0_10px_#B0E6DC]"></div>
                    </div>

                    <!-- Center Wide Image -->
                    <div class="relative w-full h-[240px] rounded-2xl overflow-hidden border border-[#2C3E3A]">
                        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1000&auto=format&fit=crop" 
                             alt="Corporate skyline and meeting" 
                             class="w-full h-full object-cover img-bw">
                        <!-- 600*240 -->
                        <div class="absolute inset-0 img-overlay"></div>
                        
                        <!-- Floating Caption inside image -->
                        <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-sm px-3 py-1 rounded border-l-2 border-[#B0E6DC]">
                            <span class="text-white text-xs font-medium">Operational Efficiency</span>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Vertical Image -->
                <div class="col-span-3 h-full flex flex-col justify-end">
                    <div class="relative w-full h-[320px] rounded-2xl overflow-hidden border border-[#2C3E3A]">
                        <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?q=80&w=600&auto=format&fit=crop" 
                             alt="Strategic planning" 
                             class="w-full h-full object-cover img-bw">
                        <!-- 280*320 -->
                        <div class="absolute inset-0 img-overlay"></div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
