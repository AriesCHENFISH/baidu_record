<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Growth Keynote - Thank You (Redesigned)</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0E1011',
                        primary: '#B0E6DC', /* Mint Green */
                        primaryDark: '#2C3E3A',
                        textMain: '#FFFFFF',
                        textSub: '#9CA3AF',
                        accent: '#5A6B68',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    spacing: {
                        '1280': '1280px',
                        '720': '720px',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #0E1011;
            overflow: hidden;
        }

        /* Background Grid */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Glassmorphism Card */
        .glass-panel {
            background: rgba(14, 16, 17, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(176, 230, 220, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Image Styling */
        .img-styled {
            filter: grayscale(100%) contrast(110%);
            transition: all 0.7s ease;
        }
        
        .group:hover .img-styled {
            filter: grayscale(20%);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div id="page_container" class="bg-grid">

        <div class="absolute top-[-100px] left-[-100px] w-[600px] h-[600px] rounded-full bg-primaryDark opacity-20 blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-[-50px] right-[20%] w-[300px] h-[300px] rounded-full bg-primary opacity-5 blur-[80px] pointer-events-none"></div>

        <div class="w-full h-full flex">

            <div class="w-[55%] h-full flex flex-col justify-center pl-20 pr-10 relative z-20">
                
                <div class="absolute top-12 left-20 flex items-center gap-3">
                    <div class="w-8 h-1 bg-primary rounded-full"></div>
                    <h6 class="text-white text-xs font-bold tracking-[0.2em] uppercase">Warner & Spencer</h6>
                </div>

                <div class="mb-12">
                    <h1 class="text-[100px] leading-[0.9] font-bold text-white tracking-tighter mb-4">
                        Thank<br>
                        <span class="text-primary">You.</span>
                    </h1>
                    <div class="w-24 h-2 bg-accent rounded-full mt-6"></div>
                </div>

                <div class="max-w-md">
                    <p class="text-textSub text-xl font-light leading-relaxed">
                        We are ready to scale together. <br>
                        Let's turn this strategy into action.
                    </p>
                </div>

                <div class="absolute bottom-12 left-20 text-textSub text-xs opacity-50">
                    <p>&copy; 2025 Warner & Spencer Group. All Rights Reserved.</p>
                </div>
            </div>

            <div class="w-[45%] h-full relative z-10">
                
                <div class="absolute inset-0 w-full h-full overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-r from-bgDark via-transparent to-transparent z-10"></div>
                    <img src="https://images.unsplash.com/photo-1556761175-b413da4baf72?q=80&w=800&auto=format&fit=crop" 
                         alt="Business Partnership" 
                         class="w-full h-full object-cover object-left img-styled">
                </div>

                <div class="absolute bottom-16 -left-16 w-[420px] glass-panel rounded-2xl p-8 z-20">
                    
                    <h3 class="text-white text-lg font-bold mb-6 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                        Get in Touch
                    </h3>

                    <ul class="flex flex-col gap-5">
                        <li class="flex items-start gap-4 group/item cursor-pointer">
                            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover/item:bg-primary group-hover/item:text-bgDark transition-colors">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div>
                                <p class="text-textSub text-xs uppercase tracking-wide mb-1">Call Us</p>
                                <p class="text-white text-lg font-medium">123-456-7890</p>
                            </div>
                        </li>

                        <li class="flex items-start gap-4 group/item cursor-pointer">
                            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover/item:bg-primary group-hover/item:text-bgDark transition-colors">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div>
                                <p class="text-textSub text-xs uppercase tracking-wide mb-1">Email Us</p>
                                <p class="text-white text-lg font-medium">hello@reallygreatsite.com</p>
                            </div>
                        </li>

                        <li class="flex items-start gap-4 group/item cursor-pointer">
                            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover/item:bg-primary group-hover/item:text-bgDark transition-colors">
                                <i class="fa-solid fa-globe"></i>
                            </div>
                            <div>
                                <p class="text-textSub text-xs uppercase tracking-wide mb-1">Visit Website</p>
                                <p class="text-white text-lg font-medium">www.reallygreatsite.com</p>
                            </div>
                        </li>
                    </ul>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
