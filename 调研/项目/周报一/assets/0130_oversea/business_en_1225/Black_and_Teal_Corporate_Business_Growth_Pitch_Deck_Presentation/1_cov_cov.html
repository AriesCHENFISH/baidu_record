<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Growth Pitch Deck</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts via Baidu CDN (Required by Prompt) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Config */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #0E1011;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            /* No external shadows allowed per prompt */
        }

        /* Utility: Grid Pattern Background */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(rgba(176, 230, 220, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 230, 220, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Utility: Custom Clip Path for the Slanted Image */
        .clip-slant {
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0% 100%);
        }

        /* Utility: Text Gradient for suble effects (optional, keeping clean mostly) */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container" class="bg-grid-pattern">
        
        <!-- 1. Decorative Background Elements -->
        <!-- Large Abstract Circle (Primary Variant) -->
        <div class="absolute top-[-150px] left-[30%] w-[500px] h-[500px] rounded-full bg-[#2C3E3A] opacity-30 blur-3xl pointer-events-none"></div>
        <!-- Small Accent Circle -->
        <div class="absolute top-[250px] left-[45%] w-[100px] h-[100px] rounded-full bg-[#B0E6DC] opacity-10 blur-xl pointer-events-none"></div>
        

        <!-- 2. Main Layout Grid (Left Content / Right Visual) -->
        <div class="w-full h-full flex">
            
            <!-- Left Column: Content (55% Width) -->
            <div class="w-[55%] h-full flex flex-col justify-between pl-16 py-16 z-10">
                
                <!-- Brand Header -->
                <div class="flex items-center gap-3">
                    <!-- Brand Name -->
                    <h3 class="text-white font-bold tracking-widest text-sm uppercase">Warner & Spencer</h3>
                </div>

                <!-- Main Hero Content -->
                <div class="flex flex-col gap-6 mb-12">
                    <!-- Logo / Icon Box -->
                    <div class="w-16 h-16 bg-[#2C3E3A] rounded-xl flex items-center justify-center mb-4 border border-[#5A6B68]">
                        <i class="fa-solid fa-layer-group text-[#B0E6DC] text-2xl"></i>
                    </div>

                    <!-- Main Title -->
                    <h1 class="text-[#B0E6DC] text-[72px] leading-[1.1] font-bold tracking-tight">
                        Business Growth<br>
                        Pitch Deck
                    </h1>

                    <!-- Decorative Separator -->
                    <div class="w-24 h-1 bg-[#5A6B68] rounded-full"></div>

                    <!-- Subtitle -->
                    <p class="text-[#D1D5DB] text-xl font-light max-w-md">
                        Driving Innovation, Scaling Opportunities. 
                        A comprehensive strategy for the future market.
                    </p>
                </div>

                <!-- Footer / Website -->
                <div>
                     <!-- Dots Decoration -->
                     <div class="flex gap-2 mb-2 opacity-50">
                        <div class="w-1 h-1 bg-[#B0E6DC] rounded-full"></div>
                        <div class="w-1 h-1 bg-[#B0E6DC] rounded-full"></div>
                        <div class="w-1 h-1 bg-[#B0E6DC] rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Image & Card (45% Width) -->
            <div class="w-[45%] h-full relative">
                
                <!-- Slanted Image Container -->
                <div class="absolute inset-0 w-full h-full clip-slant overflow-hidden">
                    <!-- Image Overlay for mood (darken) -->
                    <div class="absolute inset-0 bg-[#0E1011] opacity-20 z-10 pointer-events-none mix-blend-multiply"></div>
                    
                    <!-- Main Skyscraper Image -->
                    <!-- Sourcing a modern architectural building to match "Growth" and "Pitch Deck" context -->
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1280&auto=format&fit=crop" 
                         alt="Modern Skyscraper Architecture" 
                         class="w-full h-full object-cover object-center grayscale contrast-125">
                    <!-- 576*720 -->
                </div>

                <!-- Floating Presenter Card -->
                <!-- Positioned at bottom right, overlapping the image -->
                <div class="absolute bottom-16 right-0 w-[420px] bg-[#B0E6DC] p-8 rounded-l-2xl shadow-2xl z-20">
                    <div class="flex flex-col gap-2">
                        <p class="text-[#000000] text-sm font-semibold uppercase tracking-wide opacity-60">Presented By</p>
                        <h2 class="text-[#000000] text-3xl font-bold">Avery Davis</h2>
                        <div class="w-full h-[1px] bg-[#000000] opacity-20 my-2"></div>
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-globe text-[#000000] text-sm"></i>
                            <p class="text-[#000000] font-medium">www.reallygreatsite.com</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

</body>
</html>
