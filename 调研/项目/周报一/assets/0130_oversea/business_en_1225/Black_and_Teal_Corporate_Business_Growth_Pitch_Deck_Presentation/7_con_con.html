<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Performance</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Baidu Mirror as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict Dimensions */
        #page_container {
            position: relative;
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            background-color: #0E1011;
            overflow: hidden;
        }

        /* Custom Utilities */
        .glass-effect {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            background-image: linear-gradient(to right, #B0E6DC, #ffffff);
        }

        /* Scoped styles for specific geometric decorations */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
        }

        .decor-line {
            position: absolute;
            height: 720px;
            width: 2px;
            background: linear-gradient(180deg, transparent, #5A6B68, transparent);
            transform: skewX(-15deg);
        }

        /* Smooth Image Rendering */
        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <!-- Decorative Background Elements -->
        <!-- Top Left Primary Accent Circle -->
        <div class="decor-circle" style="width: 120px; height: 120px; background-color: #B0E6DC; top: -40px; left: 60px; opacity: 0.8; z-index: 1;"></div>
        
        <!-- Large Background Ambient Circle -->
        <div class="decor-circle" style="width: 600px; height: 600px; background-color: #2C3E3A; bottom: -200px; right: -100px; opacity: 0.4; z-index: 0;"></div>

        <!-- Decorative Angled Line -->
        <div class="decor-line" style="right: 250px; top: 0; opacity: 0.3;"></div>

        <!-- Top Right Corner Accent -->
        <div style="position: absolute; top: 60px; right: 60px; width: 40px; height: 40px; border-top: 4px solid #ffffff; border-right: 4px solid #ffffff; z-index: 10;"></div>


        <!-- Main Content Grid -->
        <div class="grid grid-cols-12 gap-10 h-full p-16 relative z-10 items-center">
            
            <!-- Left Column: Imagery (5 Columns) -->
            <div class="col-span-5 flex flex-col gap-6 h-full justify-center">
                <!-- Top Image -->
                <div class="w-full h-64 rounded-3xl overflow-hidden shadow-2xl border border-[#2C3E3A] relative group">
                    <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998?q=80&w=1000&auto=format&fit=crop" alt="Team Meeting Strategy">
                    <!-- 500*256 -->
                    <!-- Subtle overlay -->
                    <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-all duration-500"></div>
                </div>

                <!-- Bottom Image -->
                <div class="w-full h-64 rounded-3xl overflow-hidden shadow-2xl border border-[#2C3E3A] relative group">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1000&auto=format&fit=crop" alt="Team Growth Portrait">
                    <!-- 500*256 -->
                    <!-- Subtle overlay -->
                    <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-all duration-500"></div>
                </div>
            </div>

            <!-- Right Column: Text & Content (7 Columns) -->
            <div class="col-span-7 flex flex-col justify-center pl-8">
                
                <!-- Header Section -->
                <div class="mb-12">
                    <h1 class="text-6xl font-bold text-[#B0E6DC] leading-tight mb-4 tracking-tight">
                        Proof of <br>
                        <span class="text-white">Performance</span>
                    </h1>
                    <div class="flex items-center gap-4">
                        <div class="h-[1px] w-12 bg-[#B0E6DC]"></div>
                        <p class="text-[#D1D5DB] text-lg uppercase tracking-widest font-medium">
                            Results That Matter
                        </p>
                    </div>
                </div>

                <!-- Feature Card -->
                <!-- Using Primary Color #B0E6DC as background, so text inside needs to be dark for contrast -->
                <div class="bg-[#B0E6DC] rounded-3xl p-10 shadow-lg relative overflow-hidden">
                    
                    <!-- Decorative soft glow inside the card -->
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-20 rounded-full filter blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>

                    <div class="flex flex-col gap-10 relative z-10">
                        
                        <!-- Item 1: Adoption -->
                        <div class="flex items-start gap-6">
                            <!-- Icon Container -->
                            <div class="flex-shrink-0 w-16 h-16 bg-[#0E1011] rounded-full flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-chart-pie text-white text-2xl"></i>
                            </div>
                            <!-- Text Content -->
                            <div class="flex flex-col gap-2">
                                <h3 class="text-[#0E1011] text-xl font-bold">Adoption</h3>
                                <p class="text-[#2C3E3A] text-gl leading-relaxed font-medium">
                                    Growing number of early customers showing strong interest.
                                </p>
                            </div>
                        </div>

                        <!-- Divider Line -->
                        <div class="w-full h-[1px] bg-[#0E1011] opacity-10"></div>

                        <!-- Item 2: Growth -->
                        <div class="flex items-start gap-6">
                            <!-- Icon Container -->
                            <div class="flex-shrink-0 w-16 h-16 bg-[#0E1011] rounded-full flex items-center justify-center shadow-md">
                                <i class="fa-solid fa-arrow-trend-up text-white text-2xl"></i>
                            </div>
                            <!-- Text Content -->
                            <div class="flex flex-col gap-2">
                                <h3 class="text-[#0E1011] text-xl font-bold">Growth</h3>
                                <p class="text-[#2C3E3A] text-gl leading-relaxed font-medium">
                                    Clear indicators of scalability and long-term value.
                                </p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>


    </div>
</body>
</html>
