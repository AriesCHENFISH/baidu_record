<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Solution Keynote</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Standards */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Definition */
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #0E1011;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Custom Utilities for Gradients not supported by Tailwind default utilities perfectly */
        .line-gradient {
            background: linear-gradient(to bottom, transparent, #5A6B68, transparent);
        }
        
        .image-overlay {
            background: linear-gradient(to top, rgba(14, 16, 17, 0.8), transparent);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <!-- =========================================
             Background Decorative Elements 
             ========================================= -->
        
        <!-- Large Dark Circle - Top Left -->
        <div class="absolute -top-[150px] -left-[100px] w-[600px] h-[600px] rounded-full bg-[#2C3E3A] opacity-40 z-0"></div>

        <!-- Small Accent Circle - Bottom Right -->
        <div class="absolute bottom-[280px] right-[40px] w-[80px] h-[80px] rounded-full bg-[#B0E6DC] opacity-80 z-20 mix-blend-overlay"></div>

        <!-- Diagonal Divider Line -->
        <div class="absolute left-[42%] -top-[50px] w-[2px] h-[800px] line-gradient rotate-[12deg] z-0 opacity-60"></div>

        <!-- =========================================
             Main Content Grid
             ========================================= -->
        <div class="relative z-10 w-full h-full flex flex-col justify-between pt-20 pb-12 px-20">

            <!-- Top Section: Text & Features -->
            <div class="flex flex-row items-start w-full mb-12">
                
                <!-- Left: Title Area -->
                <div class="w-[45%] flex flex-col gap-6">
                    <div class="flex flex-col gap-2">
                        <h1 class="text-[#B0E6DC] text-7xl font-bold tracking-tight leading-[1.1]">
                            A Complete <br>
                            Business <br>
                            Solution
                        </h1>
                        <p class="text-[#D1D5DB] text-xl font-light tracking-wide mt-4 pl-1 border-l-4 border-[#5A6B68]">
                            Designed for Impact
                        </p>
                    </div>
                </div>

                <!-- Right: Features List -->
                <div class="w-[55%] pl-16 pt-8 flex flex-col gap-10">
                    
                    <!-- Feature 1: Scalability -->
                    <div class="flex items-start gap-6 group">
                        <!-- Icon Container -->
                        <div class="w-16 h-16 bg-[#B0E6DC] rounded-xl flex items-center justify-center shrink-0 shadow-[0_10px_20px_rgba(176,230,220,0.15)]">
                            <i class="fa-solid fa-layer-group text-[#000000] text-2xl"></i>
                        </div>
                        <!-- Text Content -->
                        <div class="flex flex-col gap-2">
                            <h3 class="text-white text-2xl font-bold">Scalability</h3>
                            <p class="text-[#D1D5DB] text-lg leading-relaxed max-w-md">
                                Solutions tailored to grow seamlessly with your evolving business demands and market shifts.
                            </p>
                        </div>
                    </div>

                    <!-- Feature 2: Sustainability -->
                    <div class="flex items-start gap-6 group">
                        <!-- Icon Container -->
                        <div class="w-16 h-16 bg-[#B0E6DC] rounded-xl flex items-center justify-center shrink-0 shadow-[0_10px_20px_rgba(176,230,220,0.15)]">
                            <i class="fa-solid fa-scale-balanced text-[#000000] text-2xl"></i>
                        </div>
                        <!-- Text Content -->
                        <div class="flex flex-col gap-2">
                            <h3 class="text-white text-2xl font-bold">Sustainability</h3>
                            <p class="text-[#D1D5DB] text-lg leading-relaxed max-w-md">
                                Practices that effectively balance rapid growth with long-term environmental responsibility.
                            </p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Bottom Section: Imagery -->
            <div class="w-full h-[280px] grid grid-cols-2 gap-8">
                
                <!-- Image 1: Business Analysis -->
                <div class="relative w-full h-full overflow-hidden rounded-2xl border border-[#2C3E3A]">
                    <div class="absolute inset-0 z-10 bg-[#0E1011] opacity-20 hover:opacity-0 transition-opacity duration-500"></div>
                    <!-- Using Unsplash Black and White business image -->
                    <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=1200&auto=format&fit=crop" 
                         alt="Business Strategy Analysis" 
                         class="w-full h-full object-cover filter grayscale contrast-110 brightness-90">
                    <!-- 560*280 -->
                </div>

                <!-- Image 2: Team Collaboration -->
                <div class="relative w-full h-full overflow-hidden rounded-2xl border border-[#2C3E3A]">
                    <div class="absolute inset-0 z-10 bg-[#0E1011] opacity-20 hover:opacity-0 transition-opacity duration-500"></div>
                    <!-- Using Unsplash Black and White team image -->
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1200&auto=format&fit=crop" 
                         alt="Team Collaboration and Success" 
                         class="w-full h-full object-cover filter grayscale contrast-110 brightness-90">
                    <!-- 560*280 -->
                </div>

            </div>

        </div>

    </div>

</body>
</html>
