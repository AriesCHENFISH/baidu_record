<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Slide - Linear Minimal Style</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Main Page Container - 1280x720 Fixed */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #050505; /* Pure Black */
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
        }

        /* Typography Enhancements */
        .font-heavy { font-weight: 900; }
        .font-mono-tech { font-family: monospace; letter-spacing: -0.05em; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#050505',
                        'brand-lime': '#DFFF5E',     /* The Line Color */
                        'brand-gray': '#333333',     /* Inactive Text */
                        'brand-silver': '#888888'    /* Secondary Text */
                    },
                    borderWidth: {
                        '1': '1px',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container" class="flex flex-col px-24 py-16">
        
        <header class="flex justify-between items-end mb-10">
            <div class="flex flex-col">
                <span class="text-brand-lime font-mono-tech text-sm mb-1">/// INDEX SYSTEM</span>
                <span class="text-white text-lg font-bold tracking-widest uppercase">Project Report</span>
            </div>

            <div>
                <span class="text-brand-lime text-4xl font-heavy tracking-tighter">2024</span>
            </div>
        </header>

        <main class="w-full flex flex-col">

            <div class="w-full h-px bg-brand-lime"></div>

            <div class="w-full py-5 flex items-baseline">
                <div class="w-32 shrink-0">
                    <span class="font-mono-tech text-brand-lime text-xl font-bold">02 //</span>
                </div>
                <div class="flex-grow">
                    <h1 class="text-white font-heavy text-6xl uppercase tracking-tighter m-0 leading-none">
                        Agenda
                    </h1>
                </div>
                <div>
                    <i class="fa-solid fa-arrow-left text-brand-lime text-xl"></i>
                </div>
            </div>

            <div class="w-full h-px bg-brand-lime opacity-50"></div>

            <div class="w-full py-5 flex items-baseline opacity-40">
                <div class="w-32 shrink-0">
                    <span class="font-mono-tech text-white text-lg">03 //</span>
                </div>
                <div class="flex-grow">
                    <h2 class="text-white font-bold text-5xl uppercase tracking-tight m-0 leading-none">
                        Target Audience
                    </h2>
                </div>
            </div>

            <div class="w-full h-px bg-brand-lime opacity-30"></div>

            <div class="w-full py-5 flex items-baseline opacity-40">
                <div class="w-32 shrink-0">
                    <span class="font-mono-tech text-white text-lg">04 //</span>
                </div>
                <div class="flex-grow">
                    <h2 class="text-white font-bold text-5xl uppercase tracking-tight m-0 leading-none">
                        References
                    </h2>
                </div>
            </div>

            <div class="w-full h-px bg-brand-lime opacity-30"></div>

            <div class="w-full py-5 flex items-baseline opacity-40">
                <div class="w-32 shrink-0">
                    <span class="font-mono-tech text-white text-lg">05 //</span>
                </div>
                <div class="flex-grow">
                    <h2 class="text-white font-bold text-5xl uppercase tracking-tight m-0 leading-none">
                        Deliverables
                    </h2>
                </div>
            </div>

            <div class="w-full h-px bg-brand-lime opacity-30"></div>

            <div class="w-full py-5 flex items-baseline opacity-40">
                <div class="w-32 shrink-0">
                    <span class="font-mono-tech text-white text-lg">06 //</span>
                </div>
                <div class="flex-grow">
                    <h2 class="text-white font-bold text-5xl uppercase tracking-tight m-0 leading-none">
                        Contact Us
                    </h2>
                </div>
            </div>
            
            <div class="w-full h-px bg-brand-lime opacity-30"></div>

        </main>

        <footer class="absolute bottom-10 left-24 right-24 flex justify-between items-center opacity-50">
            <span class="text-brand-silver text-xs font-mono-tech tracking-widest">CONFIDENTIAL MATERIAL</span>
            <div class="flex gap-1">
                <div class="w-1 h-1 bg-brand-lime rounded-full"></div>
                <div class="w-1 h-1 bg-brand-lime rounded-full opacity-50"></div>
                <div class="w-1 h-1 bg-brand-lime rounded-full opacity-25"></div>
            </div>
        </footer>

    </div>

</body>
</html>
