<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Design Studio Presentation - Clean Layout</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#111111',
                        textWhite: '#FFFFFF',
                        accentLime: '#DFFF5E',
                        textGray: '#E0E0E0',
                        darkGray: '#1A1A1A',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    spacing: {
                        '1280': '1280px',
                        '720': '720px',
                    }
                }
            }
        }
    </script>

    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Page Container Specs */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111111;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <header class="flex justify-between items-center px-16 pt-12 w-full absolute top-0 left-0 z-50">
            <div class="flex gap-6">
                <div class="border border-accentLime rounded-full px-6 py-2 flex items-center gap-3 bg-bgDark/50 backdrop-blur-md">
                    <i class="fa-solid fa-arrow-right-long text-accentLime text-sm"></i>
                    <span class="text-textGray text-sm font-medium tracking-wide">Introduction</span>
                </div>
                <div class="border border-accentLime rounded-full px-6 py-2 bg-bgDark/50 backdrop-blur-md">
                    <span class="text-textGray text-sm font-medium tracking-wide">Paucek and Lage</span>
                </div>
            </div>
            <div class="text-accentLime text-3xl font-bold tracking-widest">
                2024
            </div>
        </header>

        <main class="w-full h-full pt-36 px-16 grid grid-cols-12 gap-12 relative z-20">
            
            <div class="col-span-7 flex flex-col justify-start">
                <h1 class="text-textWhite text-[5.5rem] leading-[0.9] font-black uppercase tracking-tight drop-shadow-2xl mb-12">
                    We Are A <br>
                    <span class="text-accentLime">Design Studio</span>
                </h1>

                <div class="flex flex-col gap-8 pl-2">
                    <div class="border-l-2 border-accentLime pl-6">
                        <h3 class="text-accentLime uppercase font-bold tracking-wider mb-2 text-base">/ Versatile Tools</h3>
                        <p class="text-textGray text-base leading-relaxed opacity-90 font-light max-w-md">
                            Utilized for demonstrations, speeches, and reports delivered before an audience.
                        </p>
                    </div>

                     <div class="border-l-2 border-accentLime pl-6">
                        <h3 class="text-accentLime uppercase font-bold tracking-wider mb-2 text-base">/ Impactful Purpose</h3>
                        <p class="text-textGray text-base leading-relaxed opacity-90 font-light max-w-md">
                            Fulfilling various purposes to act as powerful tools for persuasion and education.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-span-5 h-full pb-16 flex items-end">
                <div class="w-full h-[85%] relative rounded-lg overflow-hidden border border-accentLime/30 group">
                    <div class="absolute top-0 right-0 w-20 h-20 bg-accentLime/10 z-10 rounded-bl-[100px]"></div>
                    
                    <img 
                        src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=1600&auto=format&fit=crop" 
                        alt="Professional design team" 
                        class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 ease-in-out scale-105 hover:scale-100"
                    >
                </div>
            </div>

        </main>

        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-accentLime opacity-[0.04] blur-[150px] rounded-full pointer-events-none z-0"></div>

    </div>

</body>
</html>
