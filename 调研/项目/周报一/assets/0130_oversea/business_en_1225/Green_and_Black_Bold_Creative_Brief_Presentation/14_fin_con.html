<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Keynote Slide - Acid Graphic Style</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (via Baidu CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Font Family Application */
        body {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
            /* No styling on body allowed per rules, leaving empty/default */
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #111111; /* Global Background */
        }

        /* Utility for Vertical Rhythm */
        .tracking-tight-custom {
            letter-spacing: -0.04em;
        }
        
        /* Custom Utility for the "Acid" look shadows */
        .acid-shadow {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#111111',
                        brandLime: '#DFFF5E',
                        brandGray: '#E0E0E0',
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">

        <!-- Upper Section: The "Visual Hook" Card -->
        <!-- Logic: This represents the Lime Green area in the original, treated as a foreground card on the dark s -->
        <div class="w-full h-[68%] bg-brandLime rounded-b-[80px] px-16 pt-12 flex flex-col relative z-10 acid-shadow">
            
            <!-- Top Navigation / Header Area -->
            <div class="w-full flex items-center justify-between h-16">
                <!-- Left: Capsules -->
                <div class="flex gap-4">
                    <!-- Capsule 1 -->
                    <div class="border border-brandDark rounded-full px-6 py-2 flex items-center justify-center">
                        <p class="text-brandDark text-sm font-medium uppercase tracking-wide">Paucek and Lage</p>
                    </div>
                    <!-- Capsule 2 -->
                    <div class="border border-brandDark rounded-full px-6 py-2 flex items-center gap-2 justify-center">
                        <i class="fa-solid fa-globe text-brandDark text-sm"></i>
                        <p class="text-brandDark text-sm font-medium uppercase tracking-wide">Presentation</p>
                    </div>
                </div>

                <!-- Right: Decorative Line & Stars -->
                <div class="flex items-center gap-4 flex-1 justify-end">
                    <!-- Line -->
                    <div class="h-[1px] bg-brandDark w-32 opacity-50"></div>
                    <!-- Stars -->
                    <div class="flex gap-2 text-brandDark text-lg">
                        <i class="fa-solid fa-star-of-life"></i>
                        <i class="fa-solid fa-star text-xs mt-1"></i>
                        <i class="fa-solid fa-plus text-sm"></i>
                    </div>
                </div>
            </div>

            <!-- Center Content: Hero Typography -->
            <div class="flex-1 flex flex-col items-center justify-center -mt-4">
                <!-- Main Title -->
                <h1 class="text-[170px] leading-[0.8] font-black text-brandDark uppercase tracking-tighter text-center select-none">
                    Thank You
                </h1>
                
                <!-- Sub-Content Row -->
                <div class="flex items-center gap-6 mt-12">
                    <!-- Handle Capsule (Outlined) -->
                    <div class="border-[2px] border-brandDark rounded-full px-8 py-3 transition-transform">
                        <p class="text-brandDark text-xl font-bold tracking-wide uppercase">@ReallyGreatSite</p>
                    </div>
                    
                    <!-- Year Capsule (Solid Dark) -->
                    <div class="bg-brandDark rounded-full px-8 py-3 shadow-lg">
                        <p class="text-brandLime text-xl font-bold tracking-widest">2024</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lower Section: Information Footer -->
        <!-- Logic: Using the dark background (#111111) as requested in global styles -->
        <div class="w-full h-[32%] flex items-center justify-between px-24 pt-6 pb-2">
            
            <!-- Column 1: Email -->
            <div class="flex flex-col items-center gap-2">
                <!-- Label -->
                <p class="text-brandLime text-sm font-medium uppercase tracking-widest opacity-80">
                    Email
                </p>
                <!-- Value -->
                <h3 class="text-white text-2xl font-bold tracking-tight border-b-2 border-transparent hover:border-brandLime transition-all pb-1 cursor-pointer">
                    HELLO@REALLYGREATSITE.COM
                </h3>
            </div>

            <!-- Column 2: Phone -->
            <div class="flex flex-col items-center gap-2">
                <!-- Label -->
                <p class="text-brandLime text-sm font-medium uppercase tracking-widest opacity-80">
                    Phone Number
                </p>
                <!-- Value -->
                <h3 class="text-white text-2xl font-bold tracking-widest tabular-nums">
                    123-456-7890
                </h3>
            </div>

            <!-- Column 3: Website -->
            <div class="flex flex-col items-center gap-2">
                <!-- Label -->
                <p class="text-brandLime text-sm font-medium uppercase tracking-widest opacity-80">
                    Website
                </p>
                <!-- Value -->
                <h3 class="text-white text-2xl font-bold tracking-tight border-b-2 border-transparent hover:border-brandLime transition-all pb-1 cursor-pointer">
                    REALLYGREATSITE.COM
                </h3>
            </div>

        </div>

        <!-- Decorative Background Element (Subtle Glow) -->
        <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-black to-transparent pointer-events-none opacity-50"></div>

    </div>

</body>
</html>
