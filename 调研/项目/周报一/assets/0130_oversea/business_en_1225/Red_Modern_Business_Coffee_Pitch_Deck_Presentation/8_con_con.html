<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Brand Roadmap</title>
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts (Domestic Mirror as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Page Container - Strict Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #A3332A; /* Primary Color */
            overflow: hidden;
            box-shadow: none; /* Explicitly no outer shadow as requested */
            margin: 0 auto;
        }

        /* Custom Gradients for Background */
        .bg-gradient-mesh {
            background: linear-gradient(135deg, #A3332A 0%, #5D4037 100%);
        }

        /* Decorative Glow */
        .glow-decoration {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(224, 122, 95, 0.3) 0%, rgba(163, 51, 42, 0) 70%);
            border-radius: 50%;
            top: -200px;
            right: -100px;
            z-index: 1;
        }

        /* Text Utilities override */
        h1, h2, h3, h4, h5, h6, p, li, b, i, u, span {
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container" class="bg-gradient-mesh">
        
        <!-- Decorative Background Glow -->
        <div class="glow-decoration"></div>
        
        <!-- Decorative Star (Top Right Visual Anchor) -->
        <div class="absolute top-12 right-16 text-[#FDF5E6] opacity-80 z-10 text-6xl">
            <i class="fa-solid fa-star-of-life fa-spin-pulse" style="--fa-animation-duration: 8s;"></i>
        </div>

        <!-- Header Section -->
        <div class="absolute top-12 left-12 z-20">
            <!-- Modernized Title Tag -->
            <div class="bg-[#050505] border-l-8 border-[#E07A5F] inline-block">
                <h1 class="text-[#FDF5E6] text-6xl font-bold px-8 py-4 tracking-tight uppercase">
                    Roadmap
                </h1>
            </div>

        </div>

        <!-- Main Content Area: Grid Layout -->
        <div class="absolute top-[160px] left-0 w-full h-[560px] flex flex-row items-end justify-between px-12 pb-12 z-10">
            
            <!-- Left Side: Hero Image (Barista) -->
            <!-- Using a container for shape and shadow, image inside -->
            <div class="w-[500px] h-[480px] relative rounded-t-3xl overflow-hidden shadow-2xl mr-8 bg-[#5D4037]">
                <!-- Image Overlay Gradient for depth -->
                <div class="absolute inset-0 bg-gradient-to-t from-[#050505] to-transparent opacity-40 z-10"></div>
                
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1000&auto=format&fit=crop" 
                     alt="Professional Barista Brewing Coffee" 
                     class="w-full h-full object-cover">
                <!-- 500*480 -->
            </div>

            <!-- Right Side: The Quadrant Grid (Timeline) -->
            <div class="flex-1 h-[480px] grid grid-cols-2 grid-rows-2 gap-6">
                
                <!-- Q1 Card -->
                <div class="bg-[#050505] border border-[#4A4A4A] p-8 flex flex-col justify-between hover:border-[#E07A5F] transition-colors duration-300">
                    <div class="flex justify-between items-start">
                        <h3 class="text-[#E07A5F] text-2xl font-bold">Q1</h3>
                        <i class="fa-solid fa-mug-hot text-[#FDF5E6] text-3xl opacity-80"></i>
                    </div>
                    <div>
                        <div class="w-12 h-1 bg-[#4A4A4A] mb-4"></div> <!-- Divider -->
                        <h4 class="text-[#FDF5E6] text-xl font-medium leading-tight">
                            Finalize design & start production
                        </h4>
                    </div>
                </div>

                <!-- Q2 Card -->
                <div class="bg-[#1a0e0c] border border-[#4A4A4A] p-8 flex flex-col justify-between hover:border-[#E07A5F] transition-colors duration-300 relative overflow-hidden">
                    <!-- Subtle bg accent for variance -->
                    <div class="absolute top-0 right-0 w-24 h-24 bg-[#A3332A] opacity-10 rounded-bl-full"></div>
                    
                    <div class="flex justify-between items-start relative z-10">
                        <h3 class="text-[#E07A5F] text-2xl font-bold">Q2</h3>
                        <i class="fa-solid fa-store text-[#FDF5E6] text-3xl opacity-80"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="w-12 h-1 bg-[#4A4A4A] mb-4"></div>
                        <h4 class="text-[#FDF5E6] text-xl font-medium leading-tight">
                            Launch on major marketplaces
                        </h4>
                    </div>
                </div>

                <!-- Q3 Card -->
                <div class="bg-[#1a0e0c] border border-[#4A4A4A] p-8 flex flex-col justify-between hover:border-[#E07A5F] transition-colors duration-300 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-[#A3332A] opacity-10 rounded-bl-full"></div>

                    <div class="flex justify-between items-start relative z-10">
                        <h3 class="text-[#E07A5F] text-2xl font-bold">Q3</h3>
                        <i class="fa-solid fa-coffee text-[#FDF5E6] text-3xl opacity-80"></i>
                    </div>
                    <div class="relative z-10">
                        <div class="w-12 h-1 bg-[#4A4A4A] mb-4"></div>
                        <h4 class="text-[#FDF5E6] text-xl font-medium leading-tight">
                            Café demo tour & collaborations
                        </h4>
                    </div>
                </div>

                <!-- Q4 Card -->
                <div class="bg-[#050505] border border-[#4A4A4A] p-8 flex flex-col justify-between hover:border-[#E07A5F] transition-colors duration-300">
                    <div class="flex justify-between items-start">
                        <h3 class="text-[#E07A5F] text-2xl font-bold">Q4</h3>
                        <i class="fa-solid fa-hand-holding-heart text-[#FDF5E6] text-3xl opacity-80"></i>
                    </div>
                    <div>
                        <div class="w-12 h-1 bg-[#4A4A4A] mb-4"></div>
                        <h4 class="text-[#FDF5E6] text-xl font-medium leading-tight">
                            Expand to regional retail partners
                        </h4>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer / Branding Mark -->
        <div class="absolute bottom-6 right-12 flex items-center gap-3 opacity-60">
            <div class="h-px w-20 bg-[#FDF5E6]"></div>
            <p class="text-[#FDF5E6] text-xs font-light tracking-widest uppercase">2024 Strategy</p>
        </div>

    </div>

</body>
</html>
