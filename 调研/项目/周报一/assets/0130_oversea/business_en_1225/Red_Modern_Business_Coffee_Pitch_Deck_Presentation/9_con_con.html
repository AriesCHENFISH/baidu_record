<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Keynote Slide</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #050505; /* Deep Black Base */
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Custom Scrollbar hidden */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Utility: Gradients adhering to specific syntax */
        .bg-gradient-coffee {
            background: linear-gradient(135deg, #050505, #1a1a1a);
        }

        .bg-gradient-accent {
            background: linear-gradient(45deg, #A3332A, #8a2b23);
        }

        .bg-glow-decoration {
            background: linear-gradient(to right, transparent, #A3332A, transparent);
        }

        /* Custom Text Utilities */
        .text-cream { color: #FDF5E6; }
        .text-primary { color: #A3332A; }
        .text-glow { color: #E07A5F; }
        .text-divider { color: #4A4A4A; }

        /* Typography Helper for tracking */
        .tracking-widest-custom {
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div id="page_container" class="bg-gradient-coffee">
        
        <!-- Decorative Background Elements -->
        <!-- Top Right Glow -->
        <div style="position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, #5D4037 0%, transparent 70%); opacity: 0.4;"></div>
        <!-- Bottom Left Glow -->
        <div style="position: absolute; bottom: -100px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, #A3332A 0%, transparent 70%); opacity: 0.15;"></div>

        <!-- Grid Layout: 12 Columns -->
        <div class="grid grid-cols-12 h-full w-full relative z-10">
            
            <!-- LEFT COLUMN: Typography & Content (Cols 1-5) -->
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 h-full">
                
                <!-- Decorative Top Tags -->
                <div class="mb-8">
                    <ul class="flex flex-col gap-2 border-l-2 border-[#A3332A] pl-4">
                        <li class="text-glow text-sm font-bold uppercase tracking-widest-custom">Cafe Latte</li>
                        <li class="text-glow text-sm font-bold uppercase tracking-widest-custom">Cakes</li>
                        <li class="text-glow text-sm font-bold uppercase tracking-widest-custom">Quality</li>
                    </ul>
                </div>

                <!-- Main Headline -->
                <div class="mb-10">
                    <h1 class="text-cream text-8xl font-bold leading-none tracking-tight">
                        What<br>
                        <span class="text-primary">We</span> Need
                    </h1>
                </div>

                <!-- Divider Line -->
                <div class="w-24 h-1 bg-glow-decoration mb-10"></div>

                <!-- Body Text Paragraph -->
                <div class="relative">
                    <i class="fas fa-quote-left text-[#4A4A4A] text-4xl absolute -top-6 -left-4 opacity-30"></i>
                    <p class="text-cream text-lg leading-relaxed font-light opacity-90">
                        We seek capital for manufacturing and marketing, distribution partners to enable rapid scaling, and a network of cafés and influencers to conduct promotional demos.
                    </p>
                </div>

                <!-- Footer/Meta Info -->
                <div class="mt-12 flex items-center gap-4">
                    <div class="w-8 h-8 rounded-full bg-[#E07A5F] flex items-center justify-center text-[#050505]">
                        <i class="fas fa-arrow-right text-sm"></i>
                    </div>
                    <p class="text-divider text-xs uppercase tracking-widest">Growth Strategy</p>
                </div>
            </div>

            <!-- RIGHT COLUMN: Visual & Artistic Composition (Cols 6-12) -->
            <div class="col-span-7 relative h-full flex items-center justify-center">
                
                <!-- Geometric Backing Shape (The Red Block Reimagined) -->
                <!-- Instead of an overlay, it serves as a structural anchor behind the image -->
                <div class="absolute right-0 top-0 w-3/4 h-full bg-gradient-accent clip-path-polygon opacity-90" style="clip-path: polygon(20% 0%, 100% 0, 100% 100%, 0% 100%);"></div>

                <!-- Image Container with Shadow and Positioning -->
                <div class="relative z-20 mr-12 mt-8 transform hover:scale-[1.01] transition-transform duration-700">
                    <!-- Artistic Border/Frame -->
                    <div class="absolute -top-4 -left-4 w-full h-full border border-[#E07A5F] opacity-30 rounded-sm"></div>
                    
                    <!-- Main Image: Iced Latte -->
                    <div class="overflow-hidden rounded-sm shadow-2xl" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);">
                        <img src="https://images.unsplash.com/photo-1517701604599-bb29b5c5090c?q=80&w=1000&auto=format&fit=crop" alt="Iced Latte on dark table" class="block object-cover h-[520px] w-[380px] opacity-95">
                        <!-- 380*520 -->
                    </div>

                    <!-- Glowing Star Decorations (Recreating the 'sparkles' from original but cleaner) -->
                    <div class="absolute -top-12 -right-12 text-[#FDF5E6] animate-pulse">
                        <i class="fas fa-star text-4xl" style="filter: drop-shadow(0 0 10px #E07A5F);"></i>
                    </div>
                    <div class="absolute bottom-12 -left-16 text-[#E07A5F] opacity-60">
                        <i class="fas fa-star text-2xl"></i>
                    </div>
                </div>

                <!-- Text Overlay on Red Background (Optional contextual detail) -->
                <div class="absolute bottom-10 right-10 z-30 text-right">
                    <p class="text-[#050505] font-bold text-6xl opacity-10 leading-none">
                        COFFEE<br>CULTURE
                    </p>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
