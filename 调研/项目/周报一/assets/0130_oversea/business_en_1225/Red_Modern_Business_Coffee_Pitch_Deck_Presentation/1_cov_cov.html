<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Pitch Deck - Smart Coffee</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #050505;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .text-cream { color: #FDF5E6; }
        
        /* 背景渐变效果 */
        .bg-gradient-coffee {
            background: linear-gradient(135deg, #A3332A, #5D4037);
        }

        /* 柔光背景装饰 */
        .glow-decoration {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, #E07A5F 0%, rgba(5,5,5,0) 70%);
            opacity: 0.12;
            filter: blur(60px);
            z-index: 0;
        }

        /* 主图遮罩，使其与下方卡片融合更自然 */
        .hero-mask {
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="glow-decoration" style="top: -300px; left: -200px;"></div>
        <div class="glow-decoration" style="bottom: -300px; right: -200px; background: radial-gradient(circle, #A3332A 0%, rgba(5,5,5,0) 70%);"></div>

        <div class="absolute top-0 left-0 w-full h-[75%] p-8 z-10 hero-mask">
            <div class="w-full h-full rounded-[40px] overflow-hidden shadow-2xl relative">
                <div class="absolute inset-0 bg-black opacity-10 z-10"></div>
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?ixlib=rb-4.0.3&auto=format&fit=crop&w=1280&q=80" 
                     alt="Premium Smart Coffee Experience" 
                     class="w-full h-full object-cover">
            </div>
        </div>

        <div class="absolute bottom-10 left-10 right-10 h-[260px] rounded-[40px] z-30 bg-gradient-coffee shadow-2xl flex flex-row items-center overflow-hidden border border-[#5D4037]">
            
            <div class="absolute top-[-50%] left-[-10%] w-[500px] h-[500px] bg-[#E07A5F] opacity-20 blur-[80px] rounded-full"></div>

            <div class="w-2/3 h-full flex flex-col justify-center pl-16 pr-8 relative z-20">
                <div class="w-16 h-1.5 bg-[#E07A5F] rounded-full mb-6"></div>

                <h1 class="text-6xl font-bold text-cream leading-tight mb-4 tracking-tight">
                    Business Pitch Deck
                </h1>
                
                <p class="text-xl text-cream opacity-90 font-light leading-relaxed max-w-2xl">
                    Smart Coffee Machine with Personalized Taste. Brewing your perfect cup, every time.
                </p>
            </div>

            <div class="w-1/3 h-full flex flex-col justify-center items-end pr-16 relative z-20">
                <div class="text-right border-l border-white/10 pl-8">
                    <p class="text-[#E07A5F] text-sm uppercase tracking-widest font-bold mb-2">Presented By</p>
                    <h2 class="text-3xl text-cream font-bold">Salford & Co.</h2>
                    
                    <div class="mt-6 flex gap-5 justify-end text-cream opacity-70">
                        <i class="fa-solid fa-mug-hot text-xl"></i>
                        <i class="fa-solid fa-wifi text-xl"></i>
                        <i class="fa-solid fa-microchip text-xl"></i>
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute top-[10%] left-[5%] text-[#E07A5F] text-3xl opacity-40 z-20">
            <i class="fa-solid fa-star-of-life"></i>
        </div>
        
        <div class="absolute top-[-50px] left-[-50px] w-60 h-60 border border-white/5 rounded-full z-0"></div>
    </div>

</body>
</html>
