<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Specific Icon Shape Class - The "Pacman/Eye" shape */
        .custom-bullet {
            width: 40px;
            height: 40px;
            background-color: #FFFFFF;
            border-top-left-radius: 50%;
            border-bottom-left-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* The dot inside the bullet */
        .custom-bullet::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background-color: #333333;
            border-radius: 50%;
            margin-left: 5px; /* Visual adjustment */
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        retroGreen: '#559C62',
                        retroOrange: '#EA8648',
                        offWhite: '#F7F4F0',
                        darkText: '#333333'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    lineHeight: {
                        'ultra-tight': '0.85',
                    }
                }
            }
        }
    </script>
</head>

                        <div class="w-28 h-28 bg-retroOrange rounded-full shadow-lg"></div>

            <div class="col-span-7 h-full flex flex-col justify-center pl-8">
                
                <nav class="flex flex-col space-y-8 mt-16">
                    
                    <div class="flex items-center gap-4 group cursor-default">
                        <div class="custom-bullet shadow-md group-hover:bg-offWhite transition-colors"></div>

                    </div>

                    <div class="flex items-center gap-4 ml-12 group cursor-default">
