<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cinematic Keynote</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <!-- Google Fonts CDN (Provided Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Tailwind Config to enforce specific colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#000000',
                        pureWhite: '#FFFFFF',
                        accentRed: '#8B1C1C',
                        softGray: '#DCDCDC',
                        highlightBrown: '#8B4513',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Structure */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* No styles on body as requested, kept neutral */
            background-color: #f0f0f0; /* Just for preview contrast outside the container */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Noto Sans SC', sans-serif;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            /* No outer shadow as requested */
        }

        /* Outline Text Effect for the "GET IN TOUCH" style */
        .text-outline {
            -webkit-text-stroke: 2px #8B1C1C;
            color: transparent;
        }
        
        /* Custom scrollbar hiding just in case */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">
        
        <!-- Grid Layout: Split 45% Text / 55% Image -->
        <div class="grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Content -->
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 z-20">
                
                <!-- Typography Section -->
                <div class="mb-16">
                    <!-- Stylized H2 mimicking the outlined style in the reference -->
                    <h2 class="text-6xl font-black tracking-tighter uppercase mb-0 leading-none text-outline" style="-webkit-text-stroke: 2px #8B1C1C; color: transparent;">
                        Get In Touch
                    </h2>
                    
                    <!-- Main H1 Title -->
                    <h1 class="text-pureWhite text-8xl font-black tracking-tight uppercase leading-none mt-2 drop-shadow-lg">
                        With Us
                    </h1>
                </div>

                <!-- Contact Information List -->
                <!-- Using Sematic UL/LI with FontAwesome Icons for aesthetics -->
                <ul class="space-y-6">
                    <!-- Email -->
                    <li class="flex items-center group">
                        <div class="w-10 flex justify-center">
                            <i class="fa-solid fa-envelope text-accentRed text-xl"></i>
                        </div>
                        <span class="text-pureWhite text-lg tracking-wide ml-4 font-light opacity-90">
                            hello@reallygreatsite.com
                        </span>
                    </li>

                    <!-- Website -->
                    <li class="flex items-center group">
                        <div class="w-10 flex justify-center">
                            <i class="fa-solid fa-globe text-accentRed text-xl"></i>
                        </div>
                        <span class="text-pureWhite text-lg tracking-wide ml-4 font-light opacity-90">
                            www.reallygreatsite.com
                        </span>
                    </li>

                    <!-- Phone -->
                    <li class="flex items-center group">
                        <div class="w-10 flex justify-center">
                            <i class="fa-solid fa-phone text-accentRed text-xl"></i>
                        </div>
                        <span class="text-pureWhite text-lg tracking-wide ml-4 font-light opacity-90">
                            +123-456-7890
                        </span>
                    </li>

                    <!-- Address -->
                    <li class="flex items-center group">
                        <div class="w-10 flex justify-center">
                            <i class="fa-solid fa-location-dot text-accentRed text-xl"></i>
                        </div>
                        <span class="text-pureWhite text-lg tracking-wide ml-4 font-light opacity-90">
                            123 Anywhere St., Any City, ST 12345
                        </span>
                    </li>
                </ul>

                <!-- Decorative Element: Small line to anchor the design -->
                <div class="w-24 h-1 bg-accentRed mt-12 ml-2"></div>
            </div>

            <!-- Right Column: Image with Overlay -->
            <div class="col-span-7 relative h-full">
                <!-- Gradient Overlay for seamless blending into black background -->
                <!-- This creates the cinematic fade effect from left to right -->
                <div class="absolute inset-0 bg-gradient-to-r from-deepBlack via-deepBlack/40 to-transparent z-10 w-full h-full pointer-events-none"></div>
                
                <!-- Main Image: Woman in Theater/Cinema -->
                <!-- Image chosen for dramatic lighting, red seats, and cinematic vibe -->
                <img 
                    src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059&auto=format&fit=crop" 
                    alt="Woman sitting in a red cinema seat looking dramatic" 
                    class="w-full h-full object-cover object-center"
                >
                <!-- 746*720 -->
            </div>
        </div>

        <!-- Subtle Background Decorative Shape (Bottom Left) to add depth -->
        <div class="absolute bottom-0 left-0 w-64 h-64 bg-accentRed opacity-5 rounded-tr-full blur-3xl pointer-events-none"></div>
    </div>

</body>
</html>
