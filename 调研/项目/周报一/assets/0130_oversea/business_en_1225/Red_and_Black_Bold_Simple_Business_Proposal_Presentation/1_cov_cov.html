<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - Business Proposal</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#000000',
                            white: '#FFFFFF',
                            red: '#8B1C1C', 
                            gray: '#DCDCDC', 
                            brown: '#8B4513', 
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    letterSpacing: {
                        ultra: '0.25em',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .cinematic-vignette {
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 80%, #000000 100%);
        }
        
        .bottom-gradient {
            background: linear-gradient(to top, #000000 15%, transparent 100%);
        }

        /* New Red Decorative Glow */
        .red-ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 28, 28, 0.15) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Stroke Effect for Title Polish */
        .text-stroke-red {
            -webkit-text-stroke: 1px #8B1C1C;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="red-ambient-glow top-[-200px] left-[-100px]"></div>
        <div class="red-ambient-glow bottom-[-200px] right-[-100px]"></div>

        <div class="absolute inset-0 flex items-center justify-center z-0 pt-10">
            <div class="relative w-[1000px] h-[720px]">
                <img src="https://images.unsplash.com/photo-1516307365426-bea591f05011?q=80&w=2000&auto=format&fit=crop" 
                     class="w-full h-full object-cover opacity-80"
                     style="object-position: center 20%;">
                
                <div class="absolute inset-0 cinematic-vignette"></div>
                <div class="absolute bottom-0 left-0 w-full h-1/2 bottom-gradient"></div>
            </div>
        </div>

        <div class="absolute top-16 left-16 z-20 flex items-center gap-6">
            <div class="w-1 h-12 bg-brand-red"></div> <div class="border border-brand-gray/30 rounded-full px-8 py-3 bg-brand-black/40 backdrop-blur-md">
                <p class="text-brand-white text-lg font-light tracking-[0.2em] uppercase">
                    Business <span class="text-brand-red font-bold">Proposal</span>
                </p>
            </div>
        </div>

        <div class="absolute bottom-12 left-0 w-full z-30 px-12">
            <div class="relative inline-block w-full text-center">
                <h1 class="text-brand-white font-black text-[135px] leading-[0.85] tracking-tighter uppercase drop-shadow-[0_10px_30px_rgba(139,28,28,0.5)]">
                    Studio <span class="text-stroke-red">Shodwe</span>
                </h1>
            </div>
        </div>

        <div class="absolute right-12 top-1/2 transform -translate-y-1/2 z-20 flex flex-col items-center gap-8">
            <div class="w-[1px] h-24 bg-gradient-to-b from-transparent via-brand-red to-transparent"></div>
            <div class="vertical-text transform rotate-180">
                <p class="text-brand-gray text-xs font-bold tracking-ultra uppercase opacity-50">
                    www.reallygreatsite.com
                </p>
            </div>
        </div>

        <div class="absolute top-0 right-0 w-32 h-32 border-t-2 border-r-2 border-brand-red/30 m-8"></div>
        <div class="absolute bottom-0 left-0 w-32 h-32 border-b-2 border-l-2 border-brand-red/30 m-8"></div>

        <div class="absolute top-1/2 left-8 transform -translate-y-1/2 flex flex-col items-center gap-2 z-20">
             <span class="text-brand-red font-black text-xl">/</span>
             <span class="text-brand-red font-black text-xl">/</span>
             <span class="text-brand-red font-black text-xl">/</span>
        </div>

    </div>

</body>
</html>
