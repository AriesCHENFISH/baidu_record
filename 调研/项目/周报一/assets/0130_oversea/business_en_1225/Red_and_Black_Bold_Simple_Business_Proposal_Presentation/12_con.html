<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Excellence - Studio Shodwe</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Brand Typography Styles */
        .text-outline-red {
            -webkit-text-stroke: 1.5px #8B1C1C;
            color: transparent;
        }

        /* Image Masking for depth */
        .hero-mask {
            mask-image: linear-gradient(to top, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 85%, transparent 100%);
        }

        /* Ambient subtle glow */
        .glow-effect {
            position: absolute;
            top: 50%;
            left: 0;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 28, 28, 0.1) 0%, transparent 70%);
            transform: translateY(-50%);
            filter: blur(50px);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="glow-effect"></div>

        <div class="relative z-10 w-full h-full flex items-center px-20 gap-20">
            
            <div class="w-7/12 h-[540px] relative group">
                <div class="absolute -inset-4 border border-white/5 rounded-[40px] pointer-events-none"></div>
                
                <div class="w-full h-full rounded-[32px] overflow-hidden border border-white/10 shadow-2xl">
                    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=1280" 
                         alt="Cinematic Mastery" 
                         class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-1000 ease-in-out">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                    
                    <div class="absolute bottom-8 left-8 flex items-center gap-4">
                        <div class="w-12 h-px bg-[#8B1C1C]"></div>
                        <span class="text-white text-[10px] tracking-[0.5em] font-bold uppercase opacity-70">Visual Integrity</span>
                    </div>
                </div>
            </div>

            <div class="w-5/12 flex flex-col justify-center">
                <div class="flex items-center gap-3 mb-10 opacity-40">
                    <i class="fa-solid fa-circle-nodes text-[#8B1C1C] text-xs"></i>
                    <span class="text-white text-[10px] tracking-[0.6em] uppercase font-bold">Standard 02 // Global</span>
                </div>

                <div class="mb-10">
                    <h1 class="text-[90px] font-black leading-[0.85] uppercase tracking-tighter italic">
                        <span class="text-white block">ELITE</span>
                        <span class="text-outline-red block">MOTION</span>
                    </h1>
                </div>

                <div class="max-w-md space-y-8">
                    <p class="text-gray-400 text-gl font-light leading-relaxed">
                        Redefining the boundaries of visual storytelling through high-fidelity resolution and anatomical precision. We don't just capture moments; we architect emotions.
                    </p>

                    <div class="flex flex-col gap-6 pt-8 border-t border-white/10">
                        <div class="flex justify-between items-end">
                            <span class="text-[#8B1C1C] text-xs font-black uppercase tracking-widest">Precision</span>
                            <span class="text-white text-2xl font-black italic tracking-tighter">0.001ms</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <span class="text-[#8B1C1C] text-xs font-black uppercase tracking-widest">Quality</span>
                            <span class="text-white text-2xl font-black italic tracking-tighter">8K RAW</span>
                        </div>
                    </div>
                </div>

                <div class="mt-16 flex items-center gap-4 opacity-20">
                    <span class="text-white text-[9px] tracking-[0.5em] uppercase font-bold italic">Studio Shodwe International</span>
                </div>
            </div>

        </div>

        <div class="absolute bottom-0 right-0 w-32 h-1 bg-[#8B1C1C]"></div>
        <div class="absolute top-0 left-0 w-1 h-32 bg-[#8B1C1C]"></div>

    </div>

</body>
</html>
