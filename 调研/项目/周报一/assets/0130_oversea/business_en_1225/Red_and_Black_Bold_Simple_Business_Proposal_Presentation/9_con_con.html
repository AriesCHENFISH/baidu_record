<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Product Business Proposal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Strictly using the provided link) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Page Container */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Custom Text Outline Utility for "OUR" */
        .text-outline-red {
            -webkit-text-stroke: 2px #8B1C1C;
            color: transparent;
        }

        /* Decorative Gradient Background */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, rgba(139, 28, 28, 0.15), rgba(0, 0, 0, 0));
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 0;
            filter: blur(80px);
        }
        
        /* Grid Layout for Images */
        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            grid-template-rows: 1.5fr 1fr;
            gap: 16px;
            height: 100%;
        }

        /* Custom scrollbar hide just in case */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- Background Ambient Effect -->
        <div class="ambient-glow"></div>

        <!-- Header Tag: Business Proposal -->
        <div class="absolute top-10 right-10 z-20">
            <div class="flex items-center gap-3 px-6 py-2 border border-[#DCDCDC] rounded-full bg-black/50 backdrop-blur-sm">
                <i class="fa-solid fa-briefcase text-[#DCDCDC] text-xs"></i>
                <span class="text-[#FFFFFF] text-xs font-bold tracking-widest uppercase">Business Proposal</span>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="relative z-10 w-full h-full grid grid-cols-12 gap-8 px-16 py-12">
            
            <!-- Left Column: Typography & Context -->
            <div class="col-span-5 flex flex-col justify-center h-full">
                <!-- Decorative accent line -->
                <div class="w-12 h-1 bg-[#8B1C1C] mb-8"></div>

                <!-- Main Title Group -->
                <div class="mb-6">
                    <h1 class="text-[100px] leading-[0.85] font-black uppercase tracking-tighter">
                        <span class="text-outline-red block">OUR</span>
                        <span class="text-[#FFFFFF] block">Product</span>
                    </h1>
                </div>

                <!-- Subtitle / Context -->
                <div class="mb-8 pr-10">
                    <p class="text-[#DCDCDC] text-lg leading-relaxed font-light">
                        Experience the next generation of cinematic immersion. Our premium theater solutions combine ergonomic luxury with cutting-edge visual technology to redefine the audience journey.
                    </p>
                </div>

                <!-- Metrics / Details -->
                <div class="flex gap-8 mt-auto">
                    <div class="flex flex-col">
                        <b class="text-[#FFFFFF] text-3xl font-bold">4K</b>
                        <span class="text-[#8B4513] text-sm font-medium uppercase mt-1">Resolution</span>
                    </div>
                    <div class="w-px h-full bg-[#333333]"></div>
                    <div class="flex flex-col">
                        <b class="text-[#FFFFFF] text-3xl font-bold">3D</b>
                        <span class="text-[#8B4513] text-sm font-medium uppercase mt-1">Technology</span>
                    </div>
                    <div class="w-px h-full bg-[#333333]"></div>
                    <div class="flex flex-col">
                        <b class="text-[#FFFFFF] text-3xl font-bold">100%</b>
                        <span class="text-[#8B4513] text-sm font-medium uppercase mt-1">Comfort</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Image Composition -->
            <div class="col-span-7 h-full pl-4">
                <div class="gallery-grid">
                    
                    <!-- Image 1: Top (Spans 2 cols) - Woman in red seats -->
                    <!-- Logic: This is the establishing shot from the original -->
                    <div class="col-span-2 row-span-1 relative overflow-hidden rounded-2xl border border-[#333333] group">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10"></div>
                        <img src="https://images.unsplash.com/photo-1517604931442-7105376f2bd1?q=80&w=800&auto=format&fit=crop" 
                             alt="Cinema Audience" 
                             class="w-full h-full object-cover opacity-90 grayscale-[20%] group-hover:grayscale-0 transition-all duration-700">
                        <!-- 700*320 -->
                        
                        <!-- Image Label -->
                        <div class="absolute bottom-4 left-4 z-20">
                             <div class="bg-[#8B1C1C] px-3 py-1 rounded">
                                <span class="text-white text-xs font-bold"><i class="fa-solid fa-couch mr-2"></i>Premium Seating</span>
                             </div>
                        </div>
                    </div>

                    <!-- Image 2: Bottom Left - Couple with 3D glasses -->
                    <div class="col-span-1 row-span-1 relative overflow-hidden rounded-2xl border border-[#333333]">
                         <img src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=400&auto=format&fit=crop" 
                              alt="Couple watching movie" 
                              class="w-full h-full object-cover opacity-80">
                         <!-- 300*240 -->
                         <div class="absolute top-3 right-3 z-10">
                            <i class="fa-solid fa-glasses text-white/80 text-xl drop-shadow-md"></i>
                         </div>
                    </div>

                    <!-- Image 3: Bottom Right - Popcorn/Mood -->
                    <div class="col-span-1 row-span-1 relative overflow-hidden rounded-2xl border border-[#333333]">
                        <img src="https://images.unsplash.com/photo-1585647347384-2593bc35786b?q=80&w=400&auto=format&fit=crop" 
                             alt="Cinema Snacks" 
                             class="w-full h-full object-cover opacity-80">
                        <!-- 380*240 -->
                        <div class="absolute bottom-0 right-0 p-4 w-full bg-gradient-to-t from-black/90 to-transparent">
                             <span class="text-[#DCDCDC] text-sm font-medium float-right">Total Immersion</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Bottom Left Branding / Footer -->
        <div class="absolute bottom-8 left-16 z-20">
            <div class="flex items-center gap-2 opacity-50">
                <div class="w-2 h-2 bg-[#FFFFFF] rounded-full"></div>
                <span class="text-[#FFFFFF] text-xs font-light tracking-widest uppercase">Studio Shodwe</span>
            </div>
        </div>

    </div>

</body>
</html>
