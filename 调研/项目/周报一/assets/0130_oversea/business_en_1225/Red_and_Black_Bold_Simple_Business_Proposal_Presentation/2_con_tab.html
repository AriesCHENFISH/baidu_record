<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Business Proposal - Table of Contents</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- Google Fonts (Baidu CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Specific Utilities for Vertical Text */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        /* Custom Text Stroke for 'LIST OF' if needed, though color is preferred in this design system */
        .text-stroke {
            -webkit-text-stroke: 1px #8B1C1C;
            color: transparent;
        }
    </style>
</head>
<body>

    <!-- Main Page Container: 1280x720 Fixed -->
    <div id="page_container" class="relative mx-auto bg-black overflow-hidden" style="width: 1280px; height: 720px;">
        
        <!-- 1. Background Image Section (Right Side) -->
        <!-- Using a container for the image to apply positioning and masking -->
        <div class="absolute top-0 right-0 h-full w-[65%] z-0">
            <!-- Cinematic Image: Woman in theater with popcorn -->
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1000&auto=format&fit=crop" 
                 alt="Cinema Experience" 
                 class="w-full h-full object-cover object-center opacity-90">
            <!-- 832*720 -->

            <!-- Gradient Overlay: Fades from solid black (left) to transparent (right) to blend image -->
            <div class="absolute top-0 left-0 w-full h-full" style="background: linear-gradient(90deg, #000000 10%, rgba(0,0,0,0.6) 40%, rgba(0,0,0,0) 100%);"></div>
            
            <!-- Additional dark tint at bottom for text readability if needed -->
            <div class="absolute bottom-0 left-0 w-full h-[40%]" style="background: linear-gradient(0deg, #000000 0%, transparent 100%);"></div>
        </div>

        <!-- 2. Decorative Ambient Elements (Glows) -->
        <!-- Red glow accent behind the content area -->
        <div class="absolute top-[20%] left-[-10%] w-[500px] h-[500px] rounded-full blur-3xl opacity-20 bg-[#8B1C1C] z-0"></div>

        <!-- 3. Sidebar: Vertical Business Proposal Label -->
        <div class="absolute top-12 left-12 h-[620px] flex flex-col justify-between items-center z-20">
            <!-- Top Line Decoration -->
            <div class="w-[1px] h-20 bg-[#DCDCDC] opacity-30"></div>
            
            <!-- Vertical Pill Container -->
            <div class="border border-[#DCDCDC] border-opacity-30 rounded-full py-8 px-3 flex items-center justify-center">
                <p class="vertical-text text-[#DCDCDC] text-xs tracking-[0.3em] font-medium uppercase whitespace-nowrap">
                    Business Proposal
                </p>
            </div>

            <!-- Bottom Line Decoration -->
            <div class="w-[1px] h-full bg-[#DCDCDC] opacity-30 mt-4"></div>
        </div>

        <!-- 4. Main Content Area: Grid Layout -->
        <div class="absolute inset-0 z-10 flex flex-col justify-between pl-40 pr-12 py-16">
            
            <!-- Top Section: Navigation/List Items -->
            <div class="mt-8">
                <!-- Decorative small label -->
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-8 h-[2px] bg-[#8B1C1C]"></div>
                    <p class="text-[#8B1C1C] text-sm font-bold tracking-widest uppercase">Index</p>
                </div>

                <!-- Navigation List -->
                <ul class="flex flex-col gap-6">
                    <!-- Item 1: About Us -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#8B1C1C] text-sm">
                            <i class="fa-solid fa-circle-info"></i>
                        </div>
                        <p class="text-white text-xl font-light tracking-wide pl-4 border-l border-[#333] transition-all">About Us</p>
                    </li>

                    <!-- Item 2: Our Team -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#DCDCDC] text-sm opacity-50">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <p class="text-[#DCDCDC] text-xl font-light tracking-wide pl-4 border-l border-transparent">Our Team</p>
                    </li>

                    <!-- Item 3: Service -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#DCDCDC] text-sm opacity-50">
                            <i class="fa-solid fa-bell-concierge"></i>
                        </div>
                        <p class="text-[#DCDCDC] text-xl font-light tracking-wide pl-4 border-l border-transparent">Service</p>
                    </li>

                    <!-- Item 4: Experience -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#DCDCDC] text-sm opacity-50">
                            <i class="fa-solid fa-briefcase"></i>
                        </div>
                        <p class="text-[#DCDCDC] text-xl font-light tracking-wide pl-4 border-l border-transparent">Experience</p>
                    </li>

                    <!-- Item 5: Infographic -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#DCDCDC] text-sm opacity-50">
                            <i class="fa-solid fa-chart-pie"></i>
                        </div>
                        <p class="text-[#DCDCDC] text-xl font-light tracking-wide pl-4 border-l border-transparent">Infographic</p>
                    </li>

                    <!-- Item 6: Our Advantage -->
                    <li class="flex items-center group">
                        <div class="w-8 flex justify-center text-[#DCDCDC] text-sm opacity-50">
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <p class="text-[#DCDCDC] text-xl font-light tracking-wide pl-4 border-l border-transparent">Our Advantage</p>
                    </li>
                </ul>
            </div>

            <!-- Bottom Section: Main Typographic Title -->
            <div class="mb-4">
                <!-- "LIST OF" with Accent Color -->
                <h2 class="text-[#8B1C1C] text-5xl font-black italic uppercase tracking-tighter leading-none mb-2" style="text-shadow: 0px 0px 20px rgba(139, 28, 28, 0.4);">
                    List Of
                </h2>
                <!-- "CONTENT" in White -->
                <h1 class="text-white text-8xl font-black uppercase tracking-tight leading-none">
                    Content
                </h1>
                <!-- Decorative dot -->
                <div class="w-24 h-2 bg-[#8B1C1C] mt-6 rounded-full"></div>
            </div>

        </div>

        <!-- 5. Floating Decorative Badge (Bottom Right - Optional Context) -->
        <div class="absolute bottom-10 right-10 z-20 flex items-center gap-4">
            <div class="text-right">
                <p class="text-white font-bold text-lg">Cinematic Mode</p>
                <p class="text-[#DCDCDC] text-sm opacity-60">Visual Experience</p>
            </div>
            <div class="w-12 h-12 border border-[#8B1C1C] rounded-full flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
                <i class="fa-solid fa-play text-[#8B1C1C] ml-1"></i>
            </div>
        </div>

    </div>

</body>
</html>
