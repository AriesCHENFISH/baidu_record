<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - Strategic Vision</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D95325', // Primary Orange
                        dark: '#1A1A1A',    // Text Black
                        grey: '#808080',    // Secondary Grey
                        light: '#F5F5F5',   // Off-white for subtle contrast
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Roboto', 'sans-serif'],
                    },
                    spacing: {
                        '128': '32rem',
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF; /* White Background per style guide */
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Typography Utilities */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
        }

        /* Image Filter for Grayscale Aesthetic */
        .grayscale-img {
            filter: grayscale(100%) contrast(110%);
            transition: filter 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="grid grid-cols-12 h-full w-full">

            <div class="col-span-5 relative h-full flex flex-col justify-between pl-12 py-12">
                
                <div class="relative w-full h-[480px] mt-8 bg-gray-100 shadow-xl overflow-hidden rounded-sm">
                    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=1000&auto=format&fit=crop" 
                         alt="Visionary Portrait" 
                         class="w-full h-full object-cover grayscale-img transform scale-110 object-top">
                </div>

                <div class="mt-auto">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-primary text-white flex items-center justify-center rounded-full shadow-md">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs text-grey uppercase tracking-wider font-medium">Presenter</span>
                            <h2 class="text-xl font-bold text-dark leading-none">Alex Wang</h2>
                            <span class="text-xs text-gray-400 mt-1">Creative Director</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative h-full flex flex-col pt-12 pr-12">
                
                <div class="flex justify-end mb-16">
                    <p class="text-right text-dark text-lg font-normal leading-relaxed max-w-xs border-r-4 border-primary pr-6">
                        Crafting innovative solutions <br>
                        for a dynamic future
                    </p>
                </div>

                <div class="relative bg-primary w-full h-auto p-12 shadow-2xl z-10 ml-[-4rem] mt-4">
                    <div class="absolute top-6 right-6 text-white opacity-20 text-4xl">
                        <i class="fa-solid fa-quote-right"></i>
                    </div>

                    <h1 class="text-white font-black text-[5.5rem] leading-[0.85] tracking-tighter uppercase mb-2">
                        Your Next<br>
                        Big Idea<br>
                        Starts Here
                    </h1>
                    
                    <div class="mt-8 flex items-center gap-4">
                        <div class="h-[2px] w-16 bg-white opacity-60"></div>
                        <p class="text-white text-sm tracking-widest font-medium uppercase opacity-80">
                            Driven by Purpose
                        </p>
                    </div>
                </div>

                <div class="absolute bottom-12 right-12 z-0">
                    <i class="fa-solid fa-layer-group text-9xl text-gray-100"></i>
                </div>
                
                <div class="absolute bottom-0 right-12 mb-12 flex flex-col items-end z-20">
                    <div class="border-b-2 border-primary pb-2 mb-1">
                         <span class="text-xs text-grey uppercase tracking-wider font-medium block text-right">Date</span>
                         <span class="text-xl font-bold text-dark font-mono">2025.12.22</span>
                    </div>
                    <span class="text-xs text-gray-400">Design Department</span>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
