<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Plan Cover - Modern Bauhaus Clean</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { yellow: '#FDF14F', navy: '#234985', accent: '#1A3663' } },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #FDF14F; overflow: hidden; }
        h1, h2, h3 { font-weight: 800; line-height: 1; }
        .solid-shadow { box-shadow: 12px 12px 0px #234985; }
        .solid-shadow-sm { box-shadow: 6px 6px 0px #234985; }
        
        /* 底部装饰条斜切效果 */
        .bottom-accent {
            position: absolute;
            bottom: -20px;
            left: -10%;
            width: 120%;
            height: 100px;
            background-color: #234985;
            opacity: 0.05;
            transform: rotate(-2deg);
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bottom-accent"></div>
        <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full border-[40px] border-brand-navy opacity-5"></div>
        <div class="absolute top-20 left-[45%] w-24 h-24 border-4 border-brand-navy opacity-10 rounded-full"></div>

        <div class="w-full h-full grid grid-cols-12 p-20 relative z-10 items-stretch">
            
            <div class="col-span-7 flex flex-col justify-between">
                <div>
                    <div class="inline-block bg-brand-navy text-brand-yellow px-4 py-1 mb-6 font-bold tracking-widest uppercase text-sm">
                        Strategic Framework 2025
                    </div>
                    <h1 class="text-[110px] text-brand-navy uppercase tracking-tighter mb-4">
                        Business<br>Plan
                    </h1>
                    <div class="w-48 h-4 bg-brand-navy mb-8"></div>
                    <p class="text-2xl font-bold text-brand-navy opacity-90 max-w-lg leading-snug italic">
                        "Empowering growth through data-driven strategies and creative planning."
                    </p>
                </div>

                <div class="flex gap-4">
                    <div class="bg-white border-4 border-brand-navy p-5 solid-shadow-sm flex-1">
                        <div class="flex items-center gap-3 mb-3">
                            <i class="fa-solid fa-user-tie text-brand-navy text-xl"></i>
                            <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">Presenter</span>
                        </div>
                        <p class="text-xl font-black text-brand-navy">Alexander Pierce</p>
                        <p class="text-xs text-brand-navy opacity-60 font-bold uppercase">Senior Strategy Consultant</p>
                    </div>
                    <div class="bg-white border-4 border-brand-navy p-5 solid-shadow-sm flex-1">
                        <div class="flex items-center gap-3 mb-3">
                            <i class="fa-solid fa-calendar-check text-brand-navy text-xl"></i>
                            <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">Release Date</span>
                        </div>
                        <p class="text-xl font-black text-brand-navy">Dec 25, 2025</p>
                        <p class="text-xs text-brand-navy opacity-60 font-bold uppercase">Internal Use Only</p>
                    </div>
                </div>
            </div>

            <div class="col-span-5 relative flex items-center justify-end">
                <div class="w-full h-[550px] border-4 border-brand-navy bg-white solid-shadow relative overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                         alt="Team Collaboration" 
                         class="w-full h-full object-cover grayscale contrast-125 mix-blend-multiply opacity-90">
                    
                    <div class="absolute inset-0 flex flex-col justify-end p-8 bg-gradient-to-t from-brand-navy/40 to-transparent">
                        <div class="bg-brand-yellow border-2 border-brand-navy p-4 inline-block transform -rotate-2">
                            <h3 class="text-2xl font-black text-brand-navy uppercase leading-none">Templates &<br>Frameworks</h3>
                        </div>
                    </div>
                </div>

                <div class="absolute -bottom-6 -right-6 w-24 h-24 bg-brand-navy rounded-full flex items-center justify-center solid-shadow-sm z-20">
                    <i class="fa-solid fa-arrow-right text-brand-yellow text-3xl transform -rotate-45"></i>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
