<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingoude Company - Luxury Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', sans-serif;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        /* 呼吸感渐变背景 */
        .gradient-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(245, 173, 65, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(45, 58, 124, 0.05) 0px, transparent 50%);
            z-index: 1;
        }

        /* 装饰圆环 */
        .decor-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(45, 58, 124, 0.1);
            z-index: 0;
        }

        /* 强调斜线 */
        .slash-line {
            position: absolute;
            width: 200%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 173, 65, 0.5), transparent);
            transform: rotate(-35deg);
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex items-center">
        <div class="gradient-mesh"></div>
        <div class="decor-ring w-[800px] h-[800px] -top-96 -left-48"></div>
        <div class="decor-ring w-[600px] h-[600px] -bottom-64 -right-32"></div>
        <div class="slash-line top-1/2 left-0"></div>

        <div class="relative z-10 w-full px-24">
            
            <div class="flex items-center gap-4 mb-6">
                <span class="text-[#2D3A7C] font-bold tracking-[0.3em] text-sm uppercase">Innovation Leaders</span>
                <div class="w-12 h-[2px] bg-[#F5AD41]"></div>
                <span class="text-[#F5AD41] font-bold text-sm">EST. 2025</span>
            </div>

            <div class="relative inline-block mb-10">
                <h1 class="text-[120px] font-black text-[#2D3A7C] leading-none tracking-tighter">
                    Ingoude<br>Company
                </h1>
                <div class="absolute -right-8 bottom-4 w-6 h-6 bg-[#F5AD41] rounded-full"></div>
            </div>

            <div class="flex items-end justify-between w-full mt-4">
                
                <div class="max-w-xl border-l-8 border-[#2D3A7C] pl-8">
                    <p class="text-3xl font-light text-gray-500 tracking-wide leading-relaxed">
                        Elevate <span class="text-[#2D3A7C] font-bold">Visions</span>, <br>
                        Illuminated <span class="text-[#2D3A7C] font-bold">Success</span>
                    </p>
                </div>

                <div class="flex flex-col items-end gap-4">
                    <div class="group flex items-center bg-[#2D3A7C] p-1 pr-10 rounded-full shadow-[0_20px_50px_rgba(45,58,124,0.3)]">
                        <div class="w-14 h-14 bg-[#F5AD41] rounded-full flex items-center justify-center text-white text-xl">
                            <i class="fa-solid fa-arrow-right-long"></i>
                        </div>
                        <div class="ml-6 text-left">
                            <p class="text-white text-[10px] opacity-60 font-bold tracking-widest uppercase">Start Journey</p>
                            <h3 class="text-white text-lg font-black tracking-widest">BUSINESS</h3>
                        </div>
                    </div>
                    <p class="text-[10px] text-gray-400 font-bold tracking-[0.5em] uppercase pr-2">Section 01 / Cover</p>
                </div>

            </div>
        </div>

        <div class="absolute bottom-12 left-24 w-1/2 h-[1px] bg-gray-100"></div>
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-[#2D3A7C] rounded-tr-full opacity-5"></div>
        
        <div class="absolute top-16 right-24 text-[#2D3A7C] opacity-20">
            <i class="fa-solid fa-shield-halved text-6xl"></i>
        </div>
    </div>

</body>
</html>
