<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characteristics of Successful Teamwork</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts via Baidu CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Main Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #FFFFFF;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: none; /* Explicitly requested no shadow on container */
        }

        /* Custom Utility Classes for specific drawing needs */
        .line-connector {
            position: absolute;
            background-color: #2D3A7C;
            transform-origin: 50% 0;
            z-index: 0;
        }

        /* Decorative faint circles */
        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid #E8E8E8;
            z-index: 0;
            pointer-events: none;
        }
    </style>
    
    <!-- Tailwind Config for Theme Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2D3A7C',
                        accent: '#F5AD41',
                        secondary: '#F0F0F0',
                        decoration: '#E8E8E8',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">

        <!-- Background Decorations (Subtle Geometry) -->
        <div class="decoration-circle w-[600px] h-[600px] top-[-100px] right-[-100px] opacity-60"></div>
        <div class="decoration-circle w-[400px] h-[400px] top-[50px] right-[50px] opacity-60"></div>
        <div class="decoration-circle w-[800px] h-[800px] bottom-[-200px] left-[-200px] opacity-30 border-dashed"></div>

        <!-- Top Right Logo Area (Abstract Building Icon) -->
        <div class="absolute top-10 right-12 z-20 text-accent text-5xl">
            <i class="fa-solid fa-city"></i>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-12 h-full w-full relative z-10 pb-24"> <!-- pb-24 leaves room for footer -->
            
            <!-- Left Column: Typography -->
            <div class="col-span-5 pl-16 pt-32 flex flex-col justify-center">
                <!-- Accent Pill -->
                <div class="w-24 h-4 bg-accent rounded-full mb-10 shadow-sm"></div>
                
                <!-- Main Title -->
                <h1 class="text-primary text-7xl font-bold leading-[1.1] tracking-tight">
                    What are the<br>
                    characteristics<br>
                    of successful
                </h1>
            </div>

            <!-- Right Column: Diagram/Tree Structure -->
            <div class="col-span-7 relative flex flex-col items-center justify-center pt-10">
                
                <!-- Diagram Container -->
                <div class="relative w-[90%] h-[400px] flex flex-col items-center">
                    
                    <!-- Level 1: Central Node -->
                    <div class="relative z-20 mb-16">
                        <div class="w-24 h-24 bg-primary rounded-2xl flex items-center justify-center shadow-2xl border-4 border-white">
                            <i class="fa-solid fa-network-wired text-white text-4xl"></i>
                        </div>
                    </div>

                    <!-- Connecting Lines (CSS Drawn) -->
                    <!-- Center point logic: The top node is center. We need lines to radiate to the 4 bottom nodes. -->
                    <!-- Using absolute divs rotated to connect centers. Visual approximation for clean code. -->
                    
                    <!-- Line to Child 1 -->
                    <div class="line-connector h-[1px] w-[150px] top-[70px] left-[50%] -translate-x-full origin-right rotate-[25deg] border-t border-primary"></div>
                    <!-- Line to Child 2 -->
                    <div class="line-connector h-[1px] w-[60px] top-[90px] left-[50%] -translate-x-full origin-right rotate-[65deg] border-t border-primary"></div>
                    <!-- Line to Child 3 -->
                    <div class="line-connector h-[1px] w-[60px] top-[90px] left-[50%] origin-left -rotate-[65deg] border-t border-primary"></div>
                    <!-- Line to Child 4 -->
                    <div class="line-connector h-[1px] w-[150px] top-[70px] left-[50%] origin-left -rotate-[25deg] border-t border-primary"></div>


                    <!-- Level 2: Children Nodes -->
                    <div class="flex justify-between w-full gap-4 z-20 mt-4">
                        
                        <!-- Child 1: Leadership -->
                        <div class="flex flex-col items-center w-1/4">
                            <div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center shadow-xl border-4 border-white mb-4 transition-transform hover:-translate-y-1">
                                <i class="fa-solid fa-people-roof text-white text-3xl"></i>
                            </div>
                            <p class="text-gray-500 text-sm text-center leading-relaxed px-1">
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                            </p>
                        </div>

                        <!-- Child 2: Individual -->
                        <div class="flex flex-col items-center w-1/4">
                            <div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center shadow-xl border-4 border-white mb-4 transition-transform hover:-translate-y-1">
                                <i class="fa-solid fa-user-astronaut text-white text-3xl"></i>
                            </div>
                            <p class="text-gray-500 text-sm text-center leading-relaxed px-1">
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                            </p>
                        </div>

                        <!-- Child 3: Communication -->
                        <div class="flex flex-col items-center w-1/4">
                            <div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center shadow-xl border-4 border-white mb-4 transition-transform hover:-translate-y-1">
                                <i class="fa-solid fa-comments text-white text-3xl"></i>
                            </div>
                            <p class="text-gray-500 text-sm text-center leading-relaxed px-1">
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                            </p>
                        </div>

                        <!-- Child 4: Agreement -->
                        <div class="flex flex-col items-center w-1/4">
                            <div class="w-20 h-20 bg-primary rounded-2xl flex items-center justify-center shadow-xl border-4 border-white mb-4 transition-transform hover:-translate-y-1">
                                <i class="fa-solid fa-handshake text-white text-3xl"></i>
                            </div>
                            <p class="text-gray-500 text-sm text-center leading-relaxed px-1">
                                Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <!-- Footer Section -->
        <div class="absolute bottom-8 left-0 w-full px-12 z-30">
            <!-- Blue Bar Container -->
            <div class="w-full h-16 bg-primary rounded-full flex items-center justify-between px-2 shadow-2xl">
                
                <!-- Left: Success Button -->
                <div class="bg-accent h-12 px-8 rounded-full flex items-center justify-center shadow-md ml-1">
                    <span class="text-primary font-bold text-lg">Success</span>
                </div>

                <!-- Right: Business Pill -->
                <div class="bg-white h-12 pl-2 pr-6 rounded-full flex items-center gap-3 shadow-md mr-1">
                    <div class="w-8 h-8 bg-accent rounded-full flex items-center justify-center text-white text-sm">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                    <span class="text-primary font-bold text-lg">Business</span>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
