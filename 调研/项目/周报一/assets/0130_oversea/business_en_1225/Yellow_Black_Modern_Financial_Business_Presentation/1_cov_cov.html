<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Business Keynote - Refined</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#0F0F0F',
                        accent: '#C4D658',
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            background-color: #0F0F0F;
            position: relative; margin: 0 auto; overflow: hidden;
        }
        /* 标题空心字效果 */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255,255,255,0.4);
        }
        /* 装饰背景圆圈 */
        .bg-circle {
            position: absolute;
            border: 1px solid rgba(196, 214, 88, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-circle w-[800px] h-[800px] -top-96 -left-96"></div>
        <div class="bg-circle w-[400px] h-[400px] top-20 -right-20"></div>
        <div class="absolute bottom-0 right-0 w-1/2 h-1/2 bg-gradient-to-tl from-[#C4D65810] to-transparent"></div>

        <header class="absolute top-0 left-0 w-full px-16 py-12 z-50 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-accent rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-chart-line text-bgDark text-xl"></i>
                </div>
                <span class="text-white font-bold tracking-[0.2em] text-xl">FINANCE<span class="text-accent">CORE</span></span>
            </div>
            <div class="flex items-center gap-12">
                <nav class="hidden md:block">
                    <ul class="flex space-x-10 text-gray-400 font-medium">
                        <li class="text-white border-b-2 border-accent pb-1">Annual Report</li>
                        <li class="hover:text-white transition-colors cursor-pointer">Strategy</li>
                        <li class="hover:text-white transition-colors cursor-pointer">Market</li>
                    </ul>
                </nav>
                <i class="fa-solid fa-bars-staggered text-white text-2xl cursor-pointer"></i>
            </div>
        </header>

        <main class="grid grid-cols-12 h-full w-full px-16 relative z-10">
            
            <div class="col-span-7 flex flex-col justify-center pt-16">
                <div class="flex items-center gap-4 mb-6">
                    <div class="h-[2px] w-12 bg-accent"></div>
                    <span class="text-accent font-bold tracking-[0.4em] text-sm">PROPOSAL 2025</span>
                </div>

                <div class="mb-12 relative">
                    <h2 class="text-outline text-8xl font-black absolute -top-12 left-0 tracking-tighter opacity-50">FINANCIAL</h2>
                    <h1 class="text-white text-9xl font-black leading-none tracking-tighter relative z-10">
                        Financial<br>
                        <span class="text-accent">Business</span>
                    </h1>
                </div>

                <div class="flex items-start gap-12 mt-4 bg-white/5 p-8 rounded-2xl border border-white/10 backdrop-blur-sm max-w-xl">
                    <div class="border-r border-white/20 pr-10">
                        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Presented by</p>
                        <p class="text-white text-xl font-bold">Alex Rivera</p>
                        <p class="text-accent text-sm font-medium">Chief Financial Analyst</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mb-2">Department</p>
                        <p class="text-white text-xl font-bold">Strategic Growth</p>
                        <p class="text-gray-400 text-sm font-medium">Global Markets Div.</p>
                    </div>
                </div>
            </div>

            <div class="col-span-5 relative">
                <div class="absolute top-[15%] right-0 w-full h-[320px] rounded-3xl overflow-hidden border border-white/10 rotate-2 shadow-2xl">
                    <img src="https://images.unsplash.com/photo-1611974717482-98287e00dfb2?q=80&w=800&auto=format&fit=crop" 
                         class="w-full h-full object-cover opacity-60">
                    <div class="absolute inset-0 bg-gradient-to-t from-bgDark via-transparent to-transparent"></div>
                </div>

                <div class="absolute bottom-0 right-10 w-[420px] h-[580px] z-20">
                    <div class="w-full h-full rounded-t-[120px] rounded-b-3xl overflow-hidden border-8 border-bgDark shadow-[-20px_0_40px_rgba(0,0,0,0.5)]">
                        <img src="https://images.unsplash.com/photo-1573496799652-408c2ac9fe98?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover">
                    </div>
                    <div class="absolute top-1/2 -left-12 bg-accent p-6 rounded-2xl shadow-xl flex items-center gap-4 animate-bounce-slow" style="animation: bounce 4s infinite">
                        <div class="w-10 h-10 bg-bgDark rounded-full flex items-center justify-center text-accent">
                            <i class="fa-solid fa-arrow-trend-up"></i>
                        </div>
                        <div>
                            <p class="text-bgDark font-black text-xl">+24.8%</p>
                            <p class="text-bgDark/70 text-[10px] font-bold tracking-tighter">ANNUAL GROWTH</p>
                        </div>
                    </div>
                </div>

                <div class="absolute bottom-12 left-0 z-30 flex items-center gap-4 group cursor-pointer">
                    <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center group-hover:bg-accent transition-colors duration-300">
                        <i class="fa-solid fa-play text-bgDark ml-1"></i>
                    </div>
                    <span class="text-white font-bold tracking-widest text-sm">WATCH PROMO</span>
                </div>
            </div>
        </main>

        <footer class="absolute bottom-12 left-16 z-50">
            <div class="flex items-center gap-4 text-gray-500 font-mono text-sm">
                <span>OCTOBER 24, 2025</span>
                <span class="w-8 h-px bg-gray-700"></span>
                <span>TOKYO HUB</span>
            </div>
        </footer>
    </div>

    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>

</body>
</html>
