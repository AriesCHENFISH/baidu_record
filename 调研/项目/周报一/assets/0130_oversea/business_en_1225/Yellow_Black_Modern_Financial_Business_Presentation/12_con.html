<!DOCTYPE html>

<body>
    <div id="page_container">

                        <span class="text-white font-medium text-lg tracking-wide">Home</span>
                    </li>
                    <li><span class="text-[#4A4A4A] font-normal text-lg hover:text-white transition-colors cursor-default">About</span></li>

                <div class="text-white text-2xl"><i class="fa-solid fa-bars"></i></div>

            <div class="col-span-6 flex flex-col justify-center">

                    </div>
                </div>
            </div>

            <div class="col-span-6 relative flex items-center justify-end">

                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1280&auto=format&fit=crop" 
                         class="w-full h-full object-cover scale-110 hover:scale-100 transition-transform duration-1000">

                        </div>
                        <div>
                            <p class="text-[#0F0F0F] text-xs font-bold opacity-40 uppercase tracking-tighter">Current Value</p>
                            <p class="text-[#0F0F0F] text-2xl font-black">$45,290.00</p>
