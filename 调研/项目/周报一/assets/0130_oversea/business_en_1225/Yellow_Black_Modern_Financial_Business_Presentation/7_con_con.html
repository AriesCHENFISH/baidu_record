<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Role Of Technology</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Custom Font Family Application */
        body {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
            /* Body must remain clean as per instructions */
        }

        /* Abstract Graphic styling (Simulating the lines with CSS borders) */
        .abstract-line {
            position: absolute;
            border-radius: 50%;
            border: 1px solid #C4D658;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 
        Page Container 
        Dimensions: 1280x720 Fixed
        Background: #0F0F0F (Deep Black)
        Layout: Grid/Flex
    -->
    <div id="page_container" class="relative overflow-hidden mx-auto" style="width: 1280px; height: 720px; background-color: #0F0F0F;">

        <!-- DECORATIVE BACKGROUND ELEMENTS -->
        <!-- Simulating the lime green swirl lines on the right side using CSS circles -->
        <div class="absolute top-0 right-0 w-1/2 h-full overflow-hidden z-0">
            <div class="abstract-line" style="width: 800px; height: 800px; top: -200px; right: -400px; border-width: 2px;"></div>
            <div class="abstract-line" style="width: 820px; height: 820px; top: -210px; right: -410px; border-width: 1px; opacity: 0.4;"></div>
            <div class="abstract-line" style="width: 780px; height: 780px; top: -190px; right: -390px; border-width: 1px; opacity: 0.3;"></div>
            <div class="abstract-line" style="width: 850px; height: 850px; top: -225px; right: -425px; border-width: 1px; opacity: 0.2;"></div>
        </div>

        <!-- HEADER / NAVIGATION -->
        <header class="relative z-20 flex justify-between items-center px-16 pt-10">
            <!-- Left Nav -->
            <nav>
                <ul class="flex items-center gap-10 list-none">
                    <li class="flex items-center gap-2">
                        <i class="fa-solid fa-play text-[10px]" style="color: #C4D658;"></i>
                        <span class="text-white font-medium text-lg tracking-wide">Home</span>
                    </li>
                    <li>
                        <span class="text-[#4A4A4A] font-medium text-lg tracking-wide hover:text-white transition-colors cursor-pointer">About</span>
                    </li>
                    <li>
                        <span class="text-[#4A4A4A] font-medium text-lg tracking-wide hover:text-white transition-colors cursor-pointer">Contact</span>
                    </li>
                </ul>
            </nav>

            <!-- Right Menu Icon -->
            <div class="cursor-pointer">
                <i class="fa-solid fa-bars text-white text-2xl"></i>
            </div>
        </header>

        <!-- MAIN CONTENT GRID -->
        <div class="grid grid-cols-12 gap-8 px-16 h-full content-center relative z-10" style="margin-top: -40px;">
            
            <!-- LEFT COLUMN: Text Content (5 Columns) -->
            <div class="col-span-5 flex flex-col justify-center pr-8">
                <!-- Main Title -->
                <!-- Corrected typo 'Af' to 'Of' for professional standard -->
                <h1 class="text-white text-7xl font-bold leading-[1.1] tracking-tight mb-8">
                    The Role Of<br>
                    Technology
                </h1>

                <!-- Subtitle -->
                <h2 class="text-white text-xl font-bold mb-4 tracking-wide">
                    AI For Fraud Detection And<br>Credit Scoring
                </h2>

                <!-- Body Text -->
                <p class="text-[#D1D1D1] text-sm leading-relaxed mb-10 text-justify">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. In a vulputate dui. Ut dui elit, viverra nec ante maximus, ornare dapibus nisi. Maecenas ut purus.
                </p>

                <!-- Action Area -->
                <div class="flex items-center gap-6">
                    <!-- Text Label -->
                    <span class="text-white font-bold text-lg tracking-wide">Mobile Banking</span>
                    
                    <!-- CTA Button -->
                    <div class="bg-[#C4D658] px-8 py-3 rounded-full shadow-lg cursor-pointer transform hover:scale-105 transition-transform duration-300">
                        <span class="text-[#0F0F0F] font-bold text-md">Greater Accessibility</span>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Images (7 Columns) -->
            <div class="col-span-7 relative h-full flex flex-col justify-center">
                
                <!-- Image 1: Top Right (Hands/Paperwork) -->
                <!-- Positioning: Shifted slightly up and left -->
                <div class="relative w-full flex justify-end mb-6 pr-4">
                    <div class="relative w-[580px] h-[220px] rounded-[40px] overflow-hidden shadow-2xl border border-[#333]">
                         <!-- Image Source: Unsplash (Business/Data analysis context) -->
                        <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=600&auto=format&fit=crop" 
                             alt="Business analysis" 
                             class="w-full h-full object-cover">
                        <!-- 580*220 -->
                    </div>
                </div>

                <!-- Image 2: Bottom Right (Team Meeting) -->
                <!-- Positioning: Shifted slightly down and right -->
                <div class="relative w-full flex justify-end pl-12">
                     <div class="relative w-[500px] h-[220px] rounded-[40px] overflow-hidden shadow-2xl border border-[#333]">
                        <!-- Image Source: Unsplash (Diverse team meeting context) -->
                        <img src="https://images.unsplash.com/photo-1531545514256-b1400bc00f31?q=80&w=600&auto=format&fit=crop" 
                             alt="Team meeting" 
                             class="w-full h-full object-cover">
                        <!-- 500*220 -->
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
