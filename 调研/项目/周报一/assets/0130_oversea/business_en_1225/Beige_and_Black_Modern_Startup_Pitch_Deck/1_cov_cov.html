<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Pitch Deck - Design Restoration</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0A0E17',
                        primary: '#FDFDFD',
                        secondary: '#B0B3B8',
                        accent: '#EBEBEB',
                        glass: 'rgba(255, 255, 255, 0.05)',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Global Standards */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #0A0E17;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            font-family: "Noto Sans SC", sans-serif;
        }

        /* Helper for Header Glass Effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Footer Info Bar Glass Effect */
        .glass-bar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Typography Utilities */
        .elegant-serif {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-[-100px] left-[-100px] w-[600px] h-[600px] bg-blue-900 rounded-full blur-[150px] opacity-10 pointer-events-none"></div>

        <header class="absolute top-0 left-0 w-full px-12 py-8 flex justify-between items-center z-50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-white flex items-center justify-center rounded-sm">
                   <i class="fa-solid fa-cube text-[#0A0E17] text-sm"></i>
                </div>
                <h2 class="text-primary font-bold text-lg tracking-wide uppercase">Larana & Co.</h2>
            </div>

            <div class="glass-panel rounded-full px-1 py-1 flex items-center gap-1">
                <div class="bg-primary text-[#0A0E17] px-5 py-2 rounded-full">
                    <span class="text-xs font-bold uppercase tracking-wider">Startup Pitch Deck</span>
                </div>
                <div class="px-5 py-2">
                    <span class="text-secondary text-xs font-medium uppercase tracking-wider">Business Presentation</span>
                </div>
            </div>

            <div class="text-secondary text-sm font-medium tracking-wide">
                <span>September 18, 2025</span>
            </div>
        </header>

        <main class="w-full h-full pt-24 px-12 pb-12 grid grid-cols-12 gap-12 items-center relative z-10">
            
            <div class="col-span-5 flex flex-col justify-center h-full relative">
                
                <div class="mb-12">
                    <h1 class="text-8xl font-black tracking-tight text-primary leading-[0.85] mb-2">
                        STARTUP
                    </h1>
                    <div class="flex items-center gap-4">
                        <span class="text-6xl text-accent font-light opacity-50">//</span>
                        <h1 class="text-7xl elegant-serif font-medium text-primary tracking-tight">
                            Pitch Deck
                        </h1>
                    </div>
                </div>

                <p class="text-secondary text-sm leading-relaxed mb-12 max-w-sm border-l border-white/20 pl-6">
                    Comprehensive strategic overview and business planning presentation for the fiscal year 2025.
                </p>

                <div class="w-full glass-bar rounded-2xl p-6 flex flex-col gap-4">
                    <div class="flex justify-between items-start">
                         <div class="px-3 py-1 bg-[#3A506B] rounded-md inline-block">
                            <p class="text-[10px] font-bold text-white tracking-widest uppercase">Business Presentation</p>
                        </div>
                        <i class="fa-solid fa-arrow-right text-secondary -rotate-45"></i>
                    </div>

                    <div class="flex justify-between items-end mt-2">
                        <div>
                            <p class="text-xs text-secondary mb-1">Presented by</p>
                            <p class="text-lg text-primary font-medium">Ketut Susilo</p>
                        </div>
                        <div class="text-right">
                             <p class="text-sm text-secondary tracking-wide">reallygreatsite.com</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 h-full pt-4 pb-4">
                <div class="w-full h-full rounded-[40px] rounded-tl-none overflow-hidden relative border border-white/20 shadow-2xl group">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0A0E17]/60 via-transparent to-transparent z-10 pointer-events-none"></div>
                    
                    <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2670&auto=format&fit=crop" 
                         class="w-full h-full object-cover opacity-90 grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-1000 ease-in-out" 
                         alt="Modern Building Facade">
                    
                    <div class="absolute inset-0 border-[1px] border-white/10 m-6 rounded-[30px] rounded-tl-none pointer-events-none z-20"></div>
                </div>
            </div>

        </main>

        <div class="absolute bottom-12 left-12 w-24 h-[1px] bg-accent"></div>

    </div>

</body>
</html>
