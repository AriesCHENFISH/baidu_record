<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background: #050505;
            background: radial-gradient(circle at 70% 30%, #1e1b4b 0%, #050505 60%);
            overflow: hidden;
            font-family: 'Liberation Sans', 'Noto Sans SC', sans-serif;
            color: white;
        }

        /* Glowing Orbs */
        .orb-container {
            position: relative; width: 280px; height: 280px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .orb-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.3);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.1);
        }
        .orb-fill {
            position: absolute; inset: 10px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(124, 58, 237, 0.4), rgba(0,0,0,0));
            backdrop-filter: blur(5px);
        }
        .orb-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; background: #8b5cf6; filter: blur(60px); opacity: 0.6;
        }

        /* Typography */
        .big-number {
            font-size: 5rem; font-weight: 700; line-height: 1; z-index: 10;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .stat-label {
            font-size: 1.2rem; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; z-index: 10; color: #e2e8f0;
        }

        .title-huge-outline {
            font-size: 7rem; font-weight: 900; line-height: 0.8;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.2); color: transparent;
        }
        .title-huge-solid {
            font-size: 7rem; font-weight: 900; line-height: 0.8; color: white;
        }
    </style>
</head>
<body>
    <div id="page_container">
        
        <div class="absolute inset-0 z-0" style="background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 100px 100px; mask-image: linear-gradient(to right, black, transparent);"></div>

        <div class="relative z-10 w-full h-full grid grid-cols-12">
            
            <div class="col-span-4 flex flex-col justify-center pl-20 relative">
                <div class="absolute left-10 top-1/2 -translate-y-1/2 w-[1px] h-64 bg-gradient-to-b from-transparent via-[#a78bfa] to-transparent"></div>
                
                <h3 class="text-[#a78bfa] text-sm tracking-[0.3em] uppercase mb-6 font-bold">Monthly Data</h3>
                <p class="text-xl text-gray-300 font-light leading-relaxed mb-8">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. 
                </p>
                <div class="w-12 h-1 bg-white/20"></div>
            </div>

            <div class="col-span-8 relative">
                
                <div class="absolute top-16 right-20 flex gap-12">
                    
                    <div class="orb-container">
                        <div class="orb-ring"></div>
                        <div class="orb-fill"></div>
                        <div class="orb-glow"></div>
                        <h2 class="big-number">14K</h2>
                        <p class="stat-label">Units Sold</p>
                    </div>

                    <div class="orb-container mt-20"> <div class="orb-ring border-[#a78bfa]"></div>
                        <div class="orb-fill"></div>
                        <div class="orb-glow bg-[#4c1d95]"></div>
                        <h2 class="big-number">1.2M</h2>
                        <p class="stat-label text-center">Total<br>Revenue</p>
                    </div>
                </div>

                <div class="absolute bottom-12 right-12 text-right">
                    <h1 class="title-huge-solid">SALES</h1>
                    <h1 class="title-huge-outline">PERFORMANCE</h1>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
