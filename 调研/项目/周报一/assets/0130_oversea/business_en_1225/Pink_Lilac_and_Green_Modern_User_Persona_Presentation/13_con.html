<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analysis - ECharts Page</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#666666',
                        cardGreen: '#326B54',
                        cardGray: '#F2F2F2',
                        cardLavender: '#E8D5EB',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page-container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="page-container flex p-20 font-sans items-center">
        
        <div class="w-[45%] flex flex-col justify-center pr-10">
            <header class="mb-8">
                <div class="text-cardGreen font-bold tracking-widest uppercase mb-4 text-sm underline decoration-2 underline-offset-8">Insight Analysis</div>
                <h1 class="text-6xl font-bold text-primary leading-tight tracking-tight">
                    Workload<br>Distribution
                </h1>
            </header>
            
            <p class="text-secondary text-xl leading-relaxed mb-10">
                The data visualizes how curriculum developers split their time between core creation and administrative overhead.
            </p>

            <div class="flex flex-col gap-4 border-t border-gray-100 pt-8">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-cardGreen"></span>
                    <span class="text-primary font-medium">Core Development (Highest Priority)</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-cardLavender"></span>
                    <span class="text-secondary">System Customization</span>
                </div>
            </div>
        </div>

        <div class="w-[55%] h-full flex items-center justify-center">
            <div id="pieChart" style="width: 100%; height: 500px;"></div>
        </div>

    </div>

    <script>
        // 初始化 ECharts
        var chartDom = document.getElementById('pieChart');
        var myChart = echarts.init(chartDom);
        var option;

        option = {
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(255, 255, 255, 0.9)',
                textStyle: { color: '#000' },
                padding: [10, 15]
            },
            // 颜色方案：深绿, 浅紫, 浅灰, 黑色
            color: ['#326B54', '#E8D5EB', '#F2F2F2', '#000000'],
            series: [
                {
                    name: 'Task Distribution',
                    type: 'pie',
                    radius: ['45%', '75%'], // 环形饼图
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 15,
                        borderColor: '#fff',
                        borderWidth: 5
                    },
                    label: {
                        show: true,
                        position: 'outside',
                        formatter: '{b}\n{d}%',
                        fontSize: 16,
                        fontWeight: 'bold',
                        color: '#333'
                    },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 20,
                            fontWeight: 'bold'
                        },
                        itemStyle: {
                            shadowBlur: 20,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.1)'
                        }
                    },
                    labelLine: {
                        show: true,
                        length: 20,
                        length2: 30,
                        lineStyle: {
                            width: 2,
                            color: '#ccc'
                        }
                    },
                    data: [
                        { value: 45, name: 'Content Creation' },
                        { value: 25, name: 'Platform Logic' },
                        { value: 20, name: 'Admin Overhead' },
                        { value: 10, name: 'Client Feedback' }
                    ]
                }
            ]
        };

        myChart.setOption(option);

        // 响应式调整
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>

</body>
</html>
