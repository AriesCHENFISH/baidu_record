<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plan - Unified Style</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primaryBg: '#051532',
                        textMain: '#FFFFFF',
                        textBody: '#E6E8EB',
                        accentBlue: '#3B82F6',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #051532; overflow: hidden; display: flex;
        }
        .tracking-tight-custom { letter-spacing: -0.04em; }
        /* Glassy effect for cards */
        .price-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .price-card:hover {
            border-color: #3B82F6;
            transform: translateY(-5px);
        }
        .price-card.featured {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3B82F6;
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="w-[40%] h-full relative border-r border-white/5">
            <div class="absolute inset-0 bg-black/20 z-10"></div>
            <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?q=80&w=800&auto=format&fit=crop" 
                 alt="Pricing Strategy" 
                 class="w-full h-full object-cover grayscale opacity-80 mix-blend-overlay">
            
            <div class="absolute bottom-12 right-0 z-20">
                <div class="bg-white pl-8 pr-12 py-6 shadow-xl rounded-l-md">
                    <p class="text-[#051532] text-4xl font-bold leading-none">07</p>
                    <p class="text-gray-400 text-xs font-bold uppercase mt-2 tracking-wider">Chapter</p>
                </div>
            </div>
        </div>

        <div class="w-[60%] h-full flex flex-col justify-between p-16 pl-20 relative z-10">
            
            <header class="flex items-center space-x-4 border-b border-white/10 pb-6 w-fit">
                <span class="text-textBody font-bold tracking-widest text-sm uppercase">Business Deck</span>
                <span class="text-white/20 text-sm">|</span>
                <span class="text-textBody font-light tracking-widest text-sm">2025</span>
            </header>

            <main class="flex-1 flex flex-col justify-start pt-12 pr-12">
                
                <div class="w-12 h-1 bg-accentBlue rounded-full mb-8"></div>

                <h1 class="text-textMain text-6xl font-bold leading-none tracking-tight-custom mb-10">
                    Pricing Plan<span class="text-accentBlue">.</span>
                </h1>

                <div class="grid grid-cols-3 gap-6 h-[320px]">
                    
                    <div class="price-card rounded-lg p-6 flex flex-col justify-between">
                        <div>
                            <h3 class="text-textBody text-sm font-bold uppercase tracking-wider mb-2">Starter</h3>
                            <div class="text-3xl text-textMain font-bold mb-4">$99<span class="text-sm font-normal text-white/50">/mo</span></div>
                            <ul class="space-y-2 text-xs text-textBody opacity-70">
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>5 Projects</li>
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>Basic Analytics</li>
                            </ul>
                        </div>
                        <button class="w-full py-2 border border-white/20 text-white text-xs rounded hover:bg-white hover:text-primaryBg transition">Select</button>
                    </div>

                    <div class="price-card featured rounded-lg p-6 flex flex-col justify-between relative transform scale-105 shadow-2xl">
                        <div class="absolute top-0 right-0 bg-accentBlue text-white text-[10px] font-bold px-2 py-1 rounded-bl rounded-tr-lg">POPULAR</div>
                        <div>
                            <h3 class="text-accentBlue text-sm font-bold uppercase tracking-wider mb-2">Business</h3>
                            <div class="text-3xl text-textMain font-bold mb-4">$199<span class="text-sm font-normal text-white/50">/mo</span></div>
                            <ul class="space-y-2 text-xs text-textBody">
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>Unlimited Projects</li>
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>Team Collaboration</li>
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>Priority Support</li>
                            </ul>
                        </div>
                        <button class="w-full py-2 bg-accentBlue text-white text-xs rounded hover:bg-blue-600 transition shadow-lg shadow-blue-500/30 font-bold">Get Started</button>
                    </div>

                    <div class="price-card rounded-lg p-6 flex flex-col justify-between">
                        <div>
                            <h3 class="text-textBody text-sm font-bold uppercase tracking-wider mb-2">Enterprise</h3>
                            <div class="text-3xl text-textMain font-bold mb-4">Custom</div>
                            <ul class="space-y-2 text-xs text-textBody opacity-70">
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>API Access</li>
                                <li><i class="fa-solid fa-check text-accentBlue mr-2"></i>Dedicated Server</li>
                            </ul>
                        </div>
                        <button class="w-full py-2 border border-white/20 text-white text-xs rounded hover:bg-white hover:text-primaryBg transition">Contact</button>
                    </div>

                </div>

            </main>

            <footer class="flex items-center gap-2 text-white/30 text-xs tracking-wider pt-4">
                <i class="fa-solid fa-layer-group"></i>
                <span>Studio Shodwe &middot; Strategic Overview</span>
            </footer>

            <div class="absolute top-[-100px] right-[-100px] w-[400px] h-[400px] rounded-full border border-white/5 opacity-50 pointer-events-none"></div>

        </div>

    </div>

</body>
</html>
