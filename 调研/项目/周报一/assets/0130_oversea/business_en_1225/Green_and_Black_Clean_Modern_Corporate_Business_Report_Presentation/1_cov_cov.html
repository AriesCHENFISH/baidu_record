<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Report Presentation</title>
    
    <!-- Import FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Import Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <!-- Import Noto Sans SC (Mandatory Source) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Custom Tailwind Configuration to match specific colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#111113',      // Background Color
                            white: '#FFFFFF',   // Primary Text
                            accent: '#8DAF53',  // Accent Green
                            gray: '#E0E0E0',    // Secondary Text
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Structure */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Definition */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111113;
            overflow: hidden; /* Ensure decorative shapes don't spill out */
            color: #FFFFFF;
        }

        /* Custom Utility for the Leaf/Curve Shapes */
        /* Recreating the organic curves using pure CSS border-radius manipulation */
        .leaf-shape {
            position: absolute;
            border-radius: 0% 100% 0% 100% / 0% 100% 0% 100%;
            transform: rotate(45deg);
        }
        
        .leaf-shape-secondary {
            position: absolute;
            border-radius: 0% 100% 0% 100% / 0% 100% 0% 100%;
            transform: rotate(30deg);
        }

        /* Typography spacing adjustments */
        h1 {
            line-height: 0.9;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container" class="flex flex-col justify-between">
        
        <!-- 
            ========================================
            DECORATIVE BACKGROUND LAYER (Abstract)
            ========================================
            Using CSS div shapes to recreate the green leafy curves from the reference.
            No SVGs used, just clever border-radius and rotation.
        -->
        <div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0">
            <!-- Darker Shadow Curve -->
            <div class="leaf-shape-secondary" style="
                width: 900px; 
                height: 900px; 
                top: -150px; 
                left: -450px; 
                background: linear-gradient(135deg, #0a0a0a, #1f2e10);
                opacity: 0.6;
            "></div>

            <!-- Primary Green Curve (The big leaf) -->
            <div class="leaf-shape" style="
                width: 800px; 
                height: 800px; 
                top: -100px; 
                left: -400px; 
                background: linear-gradient(135deg, #3d551f, #8DAF53);
                box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
            "></div>
            
            <!-- Highlight/Accent Curve (Top left corner detail) -->
            <div class="leaf-shape" style="
                width: 300px; 
                height: 300px; 
                top: -120px; 
                left: -50px; 
                background: linear-gradient(135deg, #8DAF53, #aed46f);
                opacity: 0.8;
            "></div>
        </div>

        <!-- 
            ========================================
            HEADER / NAVIGATION
            ======================================== 
        -->
        <header class="relative z-10 w-full p-12 flex justify-between items-center">
            <!-- Brand Logo -->
            <div class="tracking-widest">
                <h3 class="text-2xl font-bold text-white uppercase tracking-[0.2em]">Borcelle</h3>
            </div>

            <!-- Navigation Links -->
            <nav>
                <ul class="flex items-center gap-10 list-none">
                    <li><a href="#" class="text-brand-gray hover:text-brand-accent text-sm font-medium no-underline transition-colors">Home</a></li>
                    <li><a href="#" class="text-brand-gray hover:text-brand-accent text-sm font-medium no-underline transition-colors">About</a></li>
                    <li><a href="#" class="text-brand-gray hover:text-brand-accent text-sm font-medium no-underline transition-colors">Contact</a></li>
                    <!-- Hamburger Menu Icon -->
                    <li class="ml-4 cursor-pointer text-2xl">
                        <i class="fa-solid fa-bars text-white"></i>
                    </li>
                </ul>
            </nav>
        </header>

        <!-- 
            ========================================
            MAIN CONTENT AREA (Hero)
            ======================================== 
        -->
        <main class="relative z-10 flex-1 flex flex-col justify-center items-end pr-32 pb-10">
            <!-- Title Wrapper -->
            <div class="text-right mb-8">
                <h1 class="text-[110px] font-bold text-white tracking-tighter uppercase drop-shadow-2xl">
                    Business<br>
                    Report
                </h1>
            </div>

            <!-- Subtitle/Category Tag -->
            <!-- Styled with the requested Accent Color border and rounded pill shape -->
            <div class="border border-brand-accent rounded-full px-12 py-3 backdrop-blur-sm bg-opacity-10 bg-white inline-block">
                <p class="text-xl text-white tracking-[0.15em] font-light uppercase">
                    Finance Division
                </p>
            </div>
        </main>

        <!-- 
            ========================================
            FOOTER / BOTTOM BAR
            ======================================== 
        -->
        <footer class="relative z-10 w-full h-20 flex justify-end items-end">
            <!-- Website URL -->
            <div class="mb-8 mr-8">
                <p class="text-brand-gray text-sm tracking-wide opacity-80">
                    www.reallygreatsite.com
                </p>
            </div>

            <!-- Decorative Square (Bottom Right Corner Accent) -->
            <div class="w-32 h-20" style="background: linear-gradient(to top, #8DAF53, #7a9947);"></div>
        </footer>

    </div>

</body>
</html>
