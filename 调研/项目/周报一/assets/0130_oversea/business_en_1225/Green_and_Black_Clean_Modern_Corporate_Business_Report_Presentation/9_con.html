<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrics and Performance - Creative Keynote</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#111113',
                        primary: '#FFFFFF',
                        accent: '#8DAF53',
                        secondary: '#E0E0E0',
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Global Standards */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict Requirements */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111113;
            overflow: hidden;
        }

        /* Gradient Utility for Accent Blocks */
        .accent-gradient {
            background: linear-gradient(135deg, #8DAF53, #6B8C3E);
        }
        
        /* Subtle glass effect for text areas inside cards */
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container" class="page_container text-primary font-sans">

        <header class="flex justify-between items-center px-16 pt-10 w-full absolute top-0 left-0 z-20">
            <div class="text-white font-bold text-xl tracking-widest uppercase">
                Borcelle
            </div>

            <nav>
                <ul class="flex items-center gap-10 list-none">
                    <li><a href="#" class="text-white text-sm no-underline opacity-90 hover:opacity-100">Home</a></li>
                    <li><a href="#" class="text-white text-sm no-underline opacity-90 hover:opacity-100">About</a></li>
                    <li><a href="#" class="text-white text-sm no-underline opacity-90 hover:opacity-100">Contact</a></li>
                    <li><i class="fa-solid fa-bars text-white text-2xl cursor-pointer"></i></li>
                </ul>
            </nav>
        </header>

        <div class="grid grid-cols-12 h-full">

            <div class="col-span-8 px-12 pb-12 pt-28 flex flex-col justify-between relative z-10">
                
                <div class="flex flex-col gap-2 mt-4">
                    <h1 class="text-7xl font-bold uppercase leading-[0.9] tracking-tighter">
                        Metrics And<br>
                        <span class="text-transparent bg-clip-text accent-gradient" style="-webkit-background-clip: text; color: transparent; background-image: linear-gradient(135deg, #ffffff, #E0E0E0);">Performance</span>
                    </h1>
                </div>

                <div class="grid grid-cols-3 gap-6 mt-auto mb-12">
                    
                    <div class="flex flex-col rounded-2xl overflow-hidden border border-[#8DAF53] border-opacity-30 h-64">
                        <div class="h-[65%] accent-gradient flex items-center justify-center">
                            <h2 class="text-6xl font-bold text-white drop-shadow-md">20%</h2>
                        </div>
                        <div class="h-[35%] glass-panel flex items-center justify-center p-4">
                            <p class="text-center font-medium leading-tight text-secondary text-lg">
                                Increase in<br>Sales
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col rounded-2xl overflow-hidden border border-[#8DAF53] border-opacity-30 h-64">
                        <div class="h-[65%] accent-gradient flex items-center justify-center">
                            <h2 class="text-6xl font-bold text-white drop-shadow-md">30%</h2>
                        </div>
                        <div class="h-[35%] glass-panel flex items-center justify-center p-4">
                            <p class="text-center font-medium leading-tight text-secondary text-lg">
                                Increase in<br>Website Traffic
                            </p>
                        </div>
                    </div>

                    <div class="flex flex-col rounded-2xl overflow-hidden border border-[#8DAF53] border-opacity-30 h-64">
                        <div class="h-[65%] accent-gradient flex items-center justify-center">
                            <h2 class="text-6xl font-bold text-white drop-shadow-md">90%</h2>
                        </div>
                        <div class="h-[35%] glass-panel flex items-center justify-center p-4">
                            <p class="text-center font-medium leading-tight text-secondary text-lg">
                                Positive Community<br>Feedback
                            </p>
                        </div>
                    </div>

                </div>

                <div class="absolute bottom-12 right-12 opacity-0"></div>
            </div>

            <div class="col-span-4 h-full relative">
                <div class="absolute top-24 right-0 w-full h-[550px] rounded-l-[40px] overflow-hidden">
                    <img 
                        src="https://images.unsplash.com/photo-1518531933037-9a60aa69d43d?q=80&w=600&auto=format&fit=crop" 
                        alt="Macro Green Leaf Texture" 
                        class="w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-700"
                        style="display: block;"
                    >
                </div>
                
                <div class="absolute -bottom-10 -right-10 w-40 h-40 rounded-full border border-[#8DAF53] opacity-20"></div>
            </div>

        </div>
        <div class="absolute bottom-0 right-0 w-[100px] h-[60px] accent-gradient">
            </div>

    </div>

</body>
</html>
