<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle - Table of Content</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts CDN (Required) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Tailwind Config to match Design System -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#111113',
                        primaryWhite: '#FFFFFF',
                        accentGreen: '#8DAF53',
                        secondaryGray: '#E0E0E0',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
                    },
                    spacing: {
                        '1280': '1280px',
                        '720': '720px',
                    }
                }
            }
        }
    </script>

    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Styles */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111113;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Typography Utilities */
        h1, h2, h3, h4, h5, h6, p, a, li, span {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar hide */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">

        <!-- Header / Navigation Area -->
        <!-- Purpose: Branding and Navigation Links -->
        <header class="absolute top-0 left-0 w-full flex justify-between items-center px-16 py-10 z-20">
            <!-- Brand Logo -->
            <div class="text-primaryWhite text-xl font-bold tracking-widest uppercase">
                BORCELLE
            </div>

            <!-- Navigation Links -->
            <div class="flex items-center gap-10">
                <nav>
                    <ul class="flex gap-8 list-none">
                        <li><a href="#" class="text-primaryWhite text-sm font-medium hover:text-accentGreen no-underline transition-colors">Home</a></li>
                        <li><a href="#" class="text-primaryWhite text-sm font-medium hover:text-accentGreen no-underline transition-colors">About</a></li>
                        <li><a href="#" class="text-primaryWhite text-sm font-medium hover:text-accentGreen no-underline transition-colors">Contact</a></li>
                    </ul>
                </nav>
                <!-- Hamburger Menu Icon -->
                <div class="text-primaryWhite text-2xl cursor-pointer">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <!-- Purpose: Split layout into left (Title/Image) and right (List Items) -->
        <div class="grid grid-cols-12 h-full w-full pt-28 pb-10 px-16 gap-8">
            
            <!-- Left Column: Title and Imagery -->
            <div class="col-span-5 flex flex-col justify-start relative">
                
                <!-- Main Headline -->
                <div class="mb-8 z-10">
                    <h1 class="text-primaryWhite text-7xl font-bold leading-[0.9] tracking-tighter uppercase">
                        Table of <br>
                        <span class="text-primaryWhite">Content</span>
                    </h1>
                </div>

                <!-- Decorative Image Container -->
                <!-- Purpose: Visual anchor using accent colors and natural imagery -->
                <div class="relative w-full aspect-square rounded-3xl overflow-hidden border border-gray-800 shadow-2xl mt-4">
                    <!-- Image Source: Dark green leaves to match the accent color #8DAF53 -->
                    <img 
                        src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1000&auto=format&fit=crop" 
                        alt="Dark green aesthetic leaves" 
                        class="w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-700"
                    >
                    <!-- 460*460 -->
                    
                    <!-- Gradient Overlay for better text integration if needed later -->
                    <div class="absolute inset-0 bg-gradient-to-t from-bgDark/40 to-transparent"></div>
                </div>

            </div>

            <!-- Right Column: Interactive List -->
            <!-- Purpose: The Table of Contents list items -->
            <div class="col-span-7 flex flex-col justify-center pl-12 pr-12 relative z-10">
                
                <!-- List Container -->
                <ul class="w-full flex flex-col gap-5 list-none">
                    
                    <!-- List Item 1 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Division Overview</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 2 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Key Achievements</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 3 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Current Initiatives</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 4 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Challenges and Solutions</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 5 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Future Plans</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 6 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Metrics and Performance</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                    <!-- List Item 7 -->
                    <li class="group">
                        <div class="w-full border border-accentGreen rounded-full py-3 px-8 flex items-center justify-between bg-bgDark hover:bg-accentGreen/10 transition-colors duration-300">
                            <span class="text-primaryWhite text-lg font-light tracking-wide group-hover:pl-2 transition-all duration-300">Conclusion</span>
                            <i class="fa-solid fa-arrow-right text-accentGreen opacity-0 group-hover:opacity-100 transition-opacity duration-300 text-sm"></i>
                        </div>
                    </li>

                </ul>
            </div>
        </div>

        <!-- Decorative Elements & Footer Info -->
        
        <!-- Bottom Right Accent Block -->
        <div class="absolute bottom-0 right-0 w-32 h-20 bg-accentGreen z-0"></div>
        
        <!-- Rotated Website URL -->
        <div class="absolute bottom-28 right-8 origin-bottom-right rotate-[270deg] translate-x-1/2">
            <p class="text-secondaryGray text-xs tracking-widest font-light opacity-60">
                www.reallygreatsite.com
            </p>
        </div>

        <!-- Subtle Background Glow (Optional for depth) -->
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-accentGreen/5 rounded-full blur-[100px] pointer-events-none z-0"></div>

    </div>
</body>
</html>
