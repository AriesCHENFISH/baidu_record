<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature - Cover Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#E2E0D5',
                        textPrimary: '#2F4332',
                        textSecondary: '#5A6559',
                        accent: '#A0AC94',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #E2E0D5; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .serif-display { font-family: 'Times New Roman', Times, serif; }
        .letter-spacing-huge { letter-spacing: -0.05em; }
        .vertical-line { width: 1px; height: 60px; background-color: #2F4332; opacity: 0.3; }
    </style>
</head>
<body>

    <div id="page_container" class="p-16 flex flex-col justify-between">
        
        <div class="flex justify-between items-start z-20">
            <div class="flex items-center gap-5">
                <div class="w-14 h-14 bg-textPrimary flex items-center justify-center rounded-full shadow-2xl">
                    <i class="fa-solid fa-compass text-white text-2xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-[0.2em] text-textPrimary leading-none uppercase">Wardiere</span>
                    <span class="text-xs tracking-[0.4em] text-accent uppercase font-bold mt-2">Environmental Report</span>
                </div>
            </div>
            
            <div class="flex flex-col items-end">
                <span class="text-sm font-bold text-textPrimary tracking-[0.2em]">ISSUE NO. 01</span>
                <span class="text-[10px] text-textSecondary uppercase mt-1 tracking-widest">Global Archive 2026</span>
            </div>
        </div>

        <div class="absolute top-1/2 right-0 -translate-y-1/2 w-[60%] h-[320px] bg-accent/20 z-0"></div>

        <div class="relative z-10 grid grid-cols-12 flex-grow items-center pt-8">
            
            <div class="col-span-6 space-y-10">
                <div class="relative">
                    <h1 class="serif-display text-textPrimary text-[180px] leading-[0.8] letter-spacing-huge italic">
                        Nature.
                    </h1>
                    <div class="absolute -bottom-4 left-2 w-32 h-2 bg-textPrimary"></div>
                </div>

                <div class="pl-2 max-w-sm space-y-6">
                    <p class="text-sm leading-relaxed text-textPrimary font-medium text-justify">
                        An in-depth exploration into the biological rhythms and ecological adaptations that define our planet's diverse biomes.
                    </p>
                    <div class="flex items-center gap-6">
                        <div class="vertical-line"></div>
                        <p class="text-[10px] leading-relaxed text-textSecondary uppercase tracking-widest">
                            Volume I<br>Research & Analysis
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-span-6 flex justify-end">
                <div class="relative">
                    <div class="w-[440px] h-[580px] bg-white p-3 shadow-[30px_30px_80px_rgba(47,67,50,0.1)]">
                        <div class="w-full h-full overflow-hidden relative">
                            <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=800&auto=format&fit=crop" 
                                 class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="absolute -left-12 bottom-20 bg-textPrimary text-white px-6 py-4 shadow-2xl">
                        <p class="text-[9px] font-bold tracking-[0.3em] uppercase opacity-60">System Status</p>
                        <p class="text-xl font-serif italic mt-1">Regenerative</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end z-20">
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-bold text-textPrimary tracking-[0.4em] uppercase">Opening Statement</span>
                <div class="w-12 h-[1px] bg-textPrimary/30"></div>
            </div>
            
            <div class="flex items-center gap-8">
                <span class="text-xs font-bold text-textPrimary tracking-widest">EST. 2026</span>
                <span class="serif-display text-4xl text-textPrimary font-bold italic leading-none">01</span>
            </div>
        </div>

    </div>

</body>
</html>
