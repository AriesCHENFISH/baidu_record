<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents - Editorial Design</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; position: relative;
            background-color: #F9F7F2; overflow: hidden; margin: 0 auto;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .font-serif-display { font-family: 'Times New Roman', Times, serif; font-weight: 400; }
        .text-giant { line-height: 0.75; letter-spacing: -0.04em; }
        
        /* 目录项悬停效果模拟 */
        .list-item { transition: all 0.3s ease; }
        .list-item:hover { transform: translateX(10px); }
        .list-item:hover .item-line { width: 40px; background-color: #8B2E2E; }
    </style>
</head>
<body>

    <div id="page_container" class="flex">

        <div class="w-[380px] h-full bg-[#8B2E2E] flex flex-col justify-between p-12 relative">
            <div class="absolute top-0 right-0 w-32 h-32 border-t border-r border-[#F9F7F2]/10 m-8"></div>
            
            <div class="mt-8">
                <p class="text-[#F9F7F2] text-[10px] tracking-[0.5em] font-bold uppercase opacity-60 mb-12">Table of</p>
                <h1 class="font-serif-display text-[80px] text-[#F9F7F2] text-giant transform rotate-90 origin-top-left translate-x-[110px] mt-24">
                    CONTENTS
                </h1>
            </div>

            <div class="flex flex-col gap-4">
                <div class="h-[1px] w-12 bg-[#F9F7F2]"></div>
                <p class="text-[#F9F7F2] text-[11px] tracking-widest font-bold uppercase">Corporate Profile / 2026</p>
            </div>
        </div>

        <div class="flex-1 h-full flex flex-col justify-center px-24 py-16 relative">
            
            <div class="absolute top-16 right-24 text-right">
                <p class="font-serif-display italic text-[#8B2E2E] text-2xl">Visionary Excellence</p>
                <div class="h-[1px] w-48 bg-[#8B2E2E]/20 mt-2 ml-auto"></div>
            </div>

            <div class="grid grid-cols-2 gap-x-24 gap-y-12">
                
                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">01</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Introduction</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">02</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">About Borcelle</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">03</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Our Values</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">04</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Creative Team</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">05</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Our Services</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">06</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Process Flow</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">07</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Pricing Strategy</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

                <div class="list-item group flex items-baseline gap-6 cursor-pointer">
                    <span class="font-serif-display text-[#8B2E2E] text-3xl italic opacity-40">08</span>
                    <div class="flex flex-col flex-1">
                        <h2 class="text-[#8B2E2E] text-xl font-bold uppercase tracking-widest">Contact Us</h2>
                        <div class="item-line h-[1px] w-0 bg-transparent mt-2 transition-all"></div>
                    </div>
                </div>

            </div>

            <div class="absolute bottom-12 right-24 flex items-baseline gap-4">
                <div class="h-[1px] w-12 bg-[#8B2E2E]/40"></div>
                <span class="text-[#8B2E2E] font-serif-display text-4xl">02</span>
            </div>

            <div class="absolute bottom-[-5%] left-[-5%] text-[300px] font-serif-display text-[#8B2E2E]/[0.02] select-none pointer-events-none italic">
                Index
            </div>
        </div>

    </div>

</body>
</html>
