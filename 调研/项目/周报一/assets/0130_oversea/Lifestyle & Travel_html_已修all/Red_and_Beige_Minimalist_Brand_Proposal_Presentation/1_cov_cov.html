<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Proposal - Pure Typography Edition</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F9F7F2;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 核心视觉标题：极致的纵向拉伸和字间距控制 */
        .display-title {
            font-weight: 700;
            line-height: 0.7;
            letter-spacing: -0.02em;
            transform: scaleY(1.5);
            display: inline-block;
        }

        .serif-display {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }

        /* 极细修饰线 */
        .hairline {
            height: 1px;
            background-color: #8B2E2E;
            opacity: 0.3;
        }

        /* 竖排文本 */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col">

        <div class="absolute inset-0 flex justify-center items-center pointer-events-none select-none opacity-[0.03]">
            <h1 class="font-bold text-[#8B2E2E] text-[800px] leading-none">B</h1>
        </div>

        <header class="w-full px-16 pt-12 flex justify-between items-start z-10">
            <div class="flex flex-col gap-2">
                <span class="text-[#8B2E2E] text-xs font-bold tracking-[0.5em] uppercase">Borcelle Studio</span>
                <div class="w-32 hairline opacity-100"></div>
            </div>
            <div class="text-right">
                <p class="text-[#8F7A7A] text-[10px] tracking-[0.3em] uppercase leading-relaxed">
                    Strategy & Visual Direction<br>
                    Project No. 882026
                </p>
            </div>
        </header>

        <main class="flex-1 flex flex-col justify-center items-center px-16 relative z-10">
            
            <div class="w-full">
                <h1 class="display-title text-[#8B2E2E] text-[240px] w-full flex justify-between">
                    <span>B</span><span>R</span><span>A</span><span>N</span><span>D</span>
                </h1>
            </div>

            <div class="w-full flex items-center justify-between my-12">
                <div class="hairline flex-1"></div>
                <div class="px-10 flex items-center gap-8">
                    <i class="fa-solid fa-asterisk text-[#8B2E2E] text-sm opacity-40"></i>
                    <span class="text-[#8B2E2E] text-sm font-bold tracking-[0.8em] uppercase italic-display">TWENTY TWENTY SIX</span>
                    <i class="fa-solid fa-asterisk text-[#8B2E2E] text-sm opacity-40"></i>
                </div>
                <div class="hairline flex-1"></div>
            </div>

            <div class="w-full">
                <h1 class="display-title text-[#8B2E2E] text-[170px] w-full flex justify-between italic opacity-95">
                    <span>P</span><span>R</span><span>O</span><span>P</span><span>O</span><span>S</span><span>A</span><span>L</span>
                </h1>
            </div>

        </main>

        <footer class="w-full px-16 pb-16 flex justify-between items-end z-10">
            
            <div class="w-1/3">
                <div class="border border-[#8B2E2E] rounded-[100%] px-8 py-4 w-fit flex flex-col items-center">
                    <span class="text-[#8B2E2E] text-[10px] font-bold tracking-[0.3em] uppercase">Creative Agency</span>
                    <span class="text-[#8B2E2E] serif-display text-lg">Official Proposal</span>
                </div>
            </div>

            <div class="w-1/3 text-center mb-1">
                <p class="text-[#8F7A7A] text-[11px] leading-loose tracking-[0.2em] uppercase">
                    Redefining Visual Identities <br> 
                    Through <span class="text-[#8B2E2E] font-bold">Minimalism</span> & Strategy
                </p>
            </div>

            <div class="w-1/3 flex flex-col items-end gap-2">
                <div class="flex items-baseline gap-4">
                    <span class="text-[#8F7A7A] text-[10px] tracking-widest uppercase opacity-60">Volume</span>
                    <span class="text-[#8B2E2E] font-serif-display text-4xl font-bold">08</span>
                </div>
                <div class="w-16 hairline opacity-100"></div>
            </div>
        </footer>

        <div class="absolute left-8 top-1/2 -translate-y-1/2 vertical-text z-0">
            <p class="text-[#8B2E2E]/10 text-[10px] tracking-[1.5em] font-bold uppercase">UNCOMPROMISED EXCELLENCE</p>
        </div>
        <div class="absolute right-8 top-1/2 -translate-y-1/2 vertical-text z-0 rotate-180">
            <p class="text-[#8B2E2E]/10 text-[10px] tracking-[1.5em] font-bold uppercase">ESTABLISHED MMXXIV</p>
        </div>

    </div>

</body>
</html>
