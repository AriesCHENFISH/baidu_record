<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Keynote - Static Table of Contents</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#0D110C',
                        textPrimary: '#F2F2F2',
                        accent: '#EAD97D',
                        secondary: '#A6AFA3',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Playfair Display"', '"Times New Roman"', 'serif'],
                    },
                    backgroundImage: {
                        'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #0D110C; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .text-glow { text-shadow: 0 0 20px rgba(234, 217, 125, 0.3); }
        .text-glow-white { text-shadow: 0 0 15px rgba(242, 242, 242, 0.2); }
        .title-serif { font-family: 'Times New Roman', serif; }
        
        /* 静态金色装饰线 */
        .accent-line {
            height: 1px;
            width: 40px;
            background: linear-gradient(90deg, #EAD97D, transparent);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 bg-bgPrimary z-0"></div>
        
        <div class="absolute top-0 left-0 w-[600px] h-[600px] bg-radial-gradient from-accent/10 to-transparent blur-[120px] z-10 pointer-events-none"></div>
        
        <div class="absolute inset-0 bg-noise mix-blend-overlay opacity-25 z-20 pointer-events-none"></div>

        <div class="relative z-30 w-full h-full flex flex-col p-16">

            <header class="flex justify-between items-start mb-20">
                <div class="flex items-center gap-3">
                    <div class="text-accent text-lg"><i class="fa-solid fa-leaf"></i></div>
                    <h6 class="text-textPrimary text-xs font-medium tracking-[0.3em] uppercase opacity-80">Giggling Platypus Co.</h6>
                </div>
                <div class="text-right">
                    <h1 class="title-serif text-5xl text-textPrimary italic font-light tracking-tight">Contents.</h1>
                    <div class="h-[1px] w-24 bg-accent mt-4 ml-auto opacity-60"></div>
                </div>
            </header>

            <main class="grid grid-cols-2 gap-x-24 gap-y-12 px-8">

                <div class="space-y-12">
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">01.</span>
                            <span class="text-white text-glow-white">Network of</span>
                            <span class="text-accent ml-2">Roots</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">02.</span>
                            <span class="text-white text-glow-white">Canopy</span>
                            <span class="text-accent ml-2">Layers</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">03.</span>
                            <span class="text-white text-glow-white">Decay</span>
                            <span class="text-accent ml-2">Systems</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">04.</span>
                            <span class="text-white text-glow-white">Forest</span>
                            <span class="text-accent ml-2">Signals</span>
                        </h3>
                    </div>
                </div>

                <div class="space-y-12">
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">05.</span>
                            <span class="text-white text-glow-white">Symbiotic</span>
                            <span class="text-accent ml-2">Web</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">06.</span>
                            <span class="text-white text-glow-white">Seasonal</span>
                            <span class="text-accent ml-2">Cycles</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">07.</span>
                            <span class="text-white text-glow-white">Biome</span>
                            <span class="text-accent ml-2">Threats</span>
                        </h3>
                    </div>
                    <div class="flex flex-col">
                        <div class="accent-line mb-3"></div>
                        <h3 class="text-2xl title-serif italic font-bold leading-none">
                            <span class="text-accent/60 mr-3 text-2xl not-italic">08.</span>
                            <span class="text-white text-glow-white">Future</span>
                            <span class="text-accent ml-2">Vision</span>
                        </h3>
                    </div>
                </div>

            </main>

            <footer class="mt-auto flex justify-between items-center">
                <div class="h-[1px] flex-1 bg-white/5"></div>
                <p class="px-6 text-[10px] tracking-[0.4em] uppercase text-secondary/60">Forest Ecology Research — 2026</p>
                <div class="h-[1px] flex-1 bg-white/5"></div>
            </footer>

        </div>
    </div>

</body>
</html>
