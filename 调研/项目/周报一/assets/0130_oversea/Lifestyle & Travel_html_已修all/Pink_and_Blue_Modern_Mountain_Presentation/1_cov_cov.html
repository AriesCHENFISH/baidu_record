<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Presentation - Wardiere Inc.</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #FFFFFF; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .logo-text { letter-spacing: 0.15em; }
        
        /* CSS 绘制的山峰 Logo */
        .mountain-logo {
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid white;
        }

        /* 极简背景纹理 */
        .bg-pattern {
            background-image: radial-gradient(#E5E7EB 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col bg-pattern">
        
        <header class="w-full h-28 px-16 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-black flex items-center justify-center rounded-lg shadow-lg">
                    <div class="mountain-logo"></div>
                </div>
                <div class="flex flex-col justify-center">
                    <h2 class="text-xl font-black text-black leading-none logo-text">WARDIERE</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] font-bold text-[#36529F] tracking-[0.2em] uppercase whitespace-nowrap">Consulting Inc.</span>
                        <div class="h-[1px] w-8 bg-[#36529F]"></div>
                    </div>
                </div>
            </div>

            <div class="flex gap-2">
                <span class="px-4 py-1.5 border border-black text-[10px] font-black uppercase tracking-widest bg-white">Volume 01</span>
                <span class="px-4 py-1.5 border border-[#D1D5DB] text-[10px] font-bold text-gray-400 uppercase tracking-widest bg-white">Cover</span>
            </div>
        </header>

        <main class="flex-1 w-full flex flex-col items-center justify-center relative px-16">
            
            <div class="absolute w-[800px] h-[450px] overflow-hidden rounded-[40px] border border-gray-100 shadow-sm opacity-20">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1200&auto=format&fit=crop" 
                     alt="Subtle Mountain" class="w-full h-full object-cover grayscale">
            </div>

            <div class="relative z-10 flex flex-col items-center text-center">
                
                <div class="relative inline-block mb-8">
                    <div class="absolute -left-12 top-0 w-2.5 h-full bg-[#36529F]"></div>
                    <h1 class="text-[130px] font-black leading-none text-black uppercase italic tracking-tighter">
                        Mountain
                    </h1>
                </div>

                <div class="max-w-2xl mb-12">
                    <h2 class="text-2xl font-bold text-black mb-4 tracking-tight">The Majesty of Tectonic Resilience</h2>
                    <div class="w-24 h-1 bg-black mx-auto mb-6"></div>
                    <p class="text-gray-500 text-sm uppercase tracking-[0.4em] font-bold">Nature's Eternal Architecture</p>
                </div>

                <div class="grid grid-cols-3 gap-16 border-t border-black/10 pt-10 w-full max-w-4xl">
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-[#36529F] uppercase tracking-widest mb-1">Observation</span>
                        <span class="text-sm font-bold text-black">Geological Patterns</span>
                    </div>
                    <div class="flex flex-col border-x border-black/10">
                        <span class="text-[9px] font-black text-[#36529F] uppercase tracking-widest mb-1">Region</span>
                        <span class="text-sm font-bold text-black">Global Survey 2026</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[9px] font-black text-[#36529F] uppercase tracking-widest mb-1">Analysis</span>
                        <span class="text-sm font-bold text-black">Structural Integrity</span>
                    </div>
                </div>

            </div>
            
        </main>

    </div>

</body>
</html>
