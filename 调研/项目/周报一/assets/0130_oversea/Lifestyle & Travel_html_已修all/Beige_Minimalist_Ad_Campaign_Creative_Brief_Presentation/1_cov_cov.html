<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Slide - Poster Minimalist</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #F9F9F5; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #333333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .main-axis {
            position: absolute;
            left: 50%; top: 10%; bottom: 10%;
            width: 1px; background-color: #333333;
            transform: translateX(-50%);
        }
    </style>
</head>
<body class="antialiased">
    <div id="page_container">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-[0.03]">
            <span class="text-[500px] font-bold tracking-tighter uppercase">BORCELLE</span>
        </div>

        <div class="main-axis"></div>

        <div class="absolute left-24 bottom-24 text-left">
            <p class="text-[10px] tracking-[0.5em] font-bold uppercase text-[#A0A0A0] mb-2">Issue No. 01</p>
            <h3 class="text-4xl font-light tracking-[0.2em] leading-none uppercase">Project<br>Fragrance</h3>
        </div>

        <div class="z-10 text-center bg-[#F9F9F5] px-12 py-16">
            <h4 class="text-[12px] tracking-[0.8em] uppercase font-bold text-[#B0A898] mb-10">Confidential Document</h4>
            <h1 class="text-[100px] font-light leading-[0.9] tracking-tighter uppercase mb-6">
                Creative<br><span class="font-bold">Brief</span>
            </h1>
            <div class="flex items-center justify-center gap-4 mt-12">
                <div class="w-12 h-px bg-[#333333]"></div>
                <p class="text-xs tracking-[0.4em] uppercase font-medium">January 2030 Launch</p>
                <div class="w-12 h-px bg-[#333333]"></div>
            </div>
        </div>

        <div class="absolute right-24 top-24 text-right">
            <h2 class="text-xs font-bold tracking-[0.3em] uppercase mb-4">Borcelle Fragrances</h2>
            <div class="w-10 h-[1px] bg-[#A0A0A0] ml-auto mb-4"></div>
            <p class="text-[9px] tracking-widest text-[#A0A0A0] uppercase leading-relaxed">
                Lead Strategist / <br> 
                <span class="text-[#333333] font-bold">Harper Russo</span>
            </p>
        </div>

        <div class="absolute top-10 left-10 w-4 h-4 border-t border-l border-[#A0A0A0]"></div>
        <div class="absolute bottom-10 right-10 w-4 h-4 border-b border-r border-[#A0A0A0]"></div>
    </div>
</body>
</html>
