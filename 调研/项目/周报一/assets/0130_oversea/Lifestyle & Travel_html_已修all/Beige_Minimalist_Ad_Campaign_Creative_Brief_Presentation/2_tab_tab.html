<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Slide - Typographic Style</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #F9F9F5; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #333333;
        }
        .hairline { height: 1px; background-color: rgba(160, 160, 160, 0.4); width: 100%; }
        .vertical-line { width: 1px; background-color: rgba(160, 160, 160, 0.4); height: 100%; }
    </style>
</head>
<body class="antialiased">
    <div id="page_container" class="flex flex-col">
        <header class="w-full h-16 flex items-center justify-between px-16 border-b border-[#A0A0A0]/30 shrink-0">
            <span class="text-[9px] tracking-[0.5em] font-bold text-[#A0A0A0] uppercase">STRATEGIC PLANNING</span>
            <span class="text-xs font-bold tracking-widest uppercase opacity-70">Creative Brief</span>
        </header>

        <main class="flex-1 flex w-full overflow-hidden">
            <div class="w-[35%] h-full bg-[#333333] flex items-center justify-center relative">
                <div class="absolute -rotate-90 origin-center whitespace-nowrap">
                    <h1 class="text-[#F9F9F5] text-[100px] font-light tracking-[0.1em] opacity-10 uppercase">Contents</h1>
                </div>
                <div class="z-10 text-center">
                    <p class="text-[#B0A898] text-gl tracking-[0.6em] uppercase font-bold mb-4">Phase 01</p>
                    <h2 class="text-[#F9F9F5] text-5xl font-light tracking-widest uppercase leading-tight">Agenda<br><span class="opacity-40">2030</span></h2>
                </div>
            </div>

            <div class="w-[65%] h-full flex flex-col justify-center px-24">
                <div class="space-y-0">
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20 hover:bg-[#B0A898]/5 transition-colors cursor-default">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">01</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">The Objective</span>
                        <i class="fa-solid fa-chevron-right text-xs opacity-0 group-hover:opacity-40 transition-opacity"></i>
                    </div>
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">02</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">Target Audience</span>
                    </div>
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">03</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">Visual Inspiration</span>
                    </div>
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">04</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">Brand Messaging</span>
                    </div>
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">05</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">Campaign Timeline</span>
                    </div>
                    <div class="group flex items-center py-5 border-b border-[#A0A0A0]/20">
                        <span class="text-gl font-bold text-[#B0A898] w-12 tracking-widest">06</span>
                        <span class="text-xl font-light tracking-widest uppercase flex-1">Metrics of Success</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="w-full h-16 border-t border-[#A0A0A0]/30 px-16 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-8 h-8 rounded-full border border-[#333333] flex items-center justify-center">
                    <span class="text-[#333333] font-bold text-xs">02</span>
                </div>
                <span class="text-xs font-bold uppercase tracking-widest text-[#A0A0A0]">Index / Agenda</span>
            </div>
            <p class="text-xs tracking-widest uppercase font-bold">Presented By: Harper Russo</p>
        </footer>
    </div>
</body>
</html>
