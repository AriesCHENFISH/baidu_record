<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Contents - Ingoude Company</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* 全局设置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }
        
        /* 固定容器 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* 字体与颜色工具类 */
        .font-serif-display { font-family: 'Georgia', 'Times New Roman', serif; }
        .text-primary { color: #E6E1D3; } /* 米白/象牙色 */
        .text-accent { color: #967D54; }  /* 深金色/古铜色 */
        .border-accent { border-color: #D6C8B5; } /* 浅米色边框 */

        /* Logo 装饰小点 */
        .logo-dot { width: 4px; height: 4px; background-color: #D6C8B5; border-radius: 50%; display: inline-block; margin-bottom: 2px; }

        /* 目录项样式 */
        .toc-item {
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(214, 200, 181, 0.2); /* 细微的底部分割线 */
            transition: all 0.3s ease;
            cursor: pointer;
        }
        /* 悬停效果：线条变亮，文字轻微偏移 */
        .toc-item:hover {
            border-bottom-color: rgba(214, 200, 181, 0.6);
            transform: translateX(4px);
        }
        .toc-item:hover .toc-title {
            color: #FFFFFF;
        }

        /* 序号样式 */
        .toc-number {
            font-family: 'Georgia', serif;
            font-size: 2rem;
            font-weight: bold;
            color: #967D54;
            line-height: 1;
            margin-right: 1.5rem;
            opacity: 0.8;
        }
        
        /* 标题样式 */
        .toc-title {
            font-size: 1.125rem; /* text-lg */
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #E6E1D3;
            transition: color 0.3s ease;
        }
        
        /* 页码指示器样式 (可选) */
        .page-indicator {
            font-size: 0.875rem;
            color: #BCA98E;
            opacity: 0.5;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-12 left-16 z-50 flex flex-col">
            <div class="flex items-center gap-2">
                <span class="logo-dot"></span>
                <span class="text-[#D6C8B5] text-[10px] tracking-[0.5em] uppercase font-bold">Premium Studio</span>
            </div>
            <h1 class="text-primary text-3xl font-bold tracking-tighter uppercase leading-none mt-1">
                INGOUDE<span class="text-[#D6C8B5]">.</span>
            </h1>
            <div class="w-12 h-[1px] bg-[#D6C8B5] mt-2 opacity-50"></div>
        </div>

        <div class="h-full w-full px-24 pt-36 pb-12 flex flex-col">
            
            <h2 class="font-serif-display text-primary text-6xl mb-16 tracking-tight">Table of Contents</h2>

            <div class="grid grid-cols-2 gap-x-24 gap-y-10 flex-1 align-start">
                
                <div class="space-y-10">
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">01</span>
                            <h3 class="toc-title">Brand Philosophy</h3>
                        </div>
                        <span class="page-indicator">Pg. 04</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">02</span>
                            <h3 class="toc-title">Our Vision & Mission</h3>
                        </div>
                        <span class="page-indicator">Pg. 08</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">03</span>
                            <h3 class="toc-title">Executive Team</h3>
                        </div>
                        <span class="page-indicator">Pg. 12</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">04</span>
                            <h3 class="toc-title">Global Services</h3>
                        </div>
                        <span class="page-indicator">Pg. 18</span>
                    </div>
                </div>

                <div class="space-y-10">
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">05</span>
                            <h3 class="toc-title">Featured Projects</h3>
                        </div>
                        <span class="page-indicator">Pg. 24</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">06</span>
                            <h3 class="toc-title">Digital Archive</h3>
                        </div>
                        <span class="page-indicator">Pg. 32</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">07</span>
                            <h3 class="toc-title">Future Roadmap</h3>
                        </div>
                        <span class="page-indicator">Pg. 40</span>
                    </div>
                    <div class="toc-item flex items-end justify-between">
                        <div class="flex items-end">
                            <span class="toc-number">08</span>
                            <h3 class="toc-title">Contact & Locations</h3>
                        </div>
                        <span class="page-indicator">Pg. 44</span>
                    </div>
                </div>

            </div>
        </div>

        <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-[#D6C8B5] rounded-full blur-[180px] opacity-10 pointer-events-none"></div>

    </div>

</body>
</html>
