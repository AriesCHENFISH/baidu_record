<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingoude Company - Vision</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .font-serif-display { font-family: 'Georgia', 'Times New Roman', serif; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; background-color: #000000; }
        .logo-dot { width: 4px; height: 4px; background-color: #D6C8B5; border-radius: 50%; display: inline-block; margin-bottom: 2px; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#E6E1D3', secondary: '#FFFFFF', cardBg: '#D6C8B5', cardTitle: '#967D54', cardBody: '#BCA98E',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="page_container">
        
        <!-- LOGO AREA (UNCHANGED) -->
        <div class="absolute top-12 right-16 z-50 flex flex-col items-end">
            <div class="flex items-center gap-2">
                <span class="text-[#D6C8B5] text-[10px] tracking-[0.5em] uppercase font-bold">Premium Studio</span>
                <span class="logo-dot"></span>
            </div>
            <h1 class="text-[#E6E1D3] text-3xl font-bold tracking-tighter uppercase leading-none mt-1">
                INGOUDE<span class="text-[#D6C8B5]">.</span>
            </h1>
            <div class="w-12 h-[1px] bg-[#D6C8B5] mt-2 opacity-50"></div>
        </div>

        <!-- Upper Half: Content & Typography -->
        <div class="w-full h-[55%] pl-16 pt-20 flex relative z-10">
            <div class="w-1/2">
                <p class="text-cardTitle text-xs font-bold tracking-[0.4em] uppercase mb-4">Our Vision</p>
                <h1 class="font-serif-display text-6xl text-primary leading-tight">
                    Timeless Space,<br>
                    <span class="text-cardBody italic">Modern Living.</span>
                </h1>
            </div>
            
            <!-- Floating Contact Card (Overlapping the image below) -->
            <div class="absolute right-[150px] top-[140px] w-[400px] bg-[#1a1a1a] border border-white/10 p-10 shadow-2xl z-20">
                <h3 class="text-primary text-xl font-serif-display mb-6">Start a Project</h3>
                <div class="flex flex-col gap-4">
                    <div class="flex items-center gap-4 text-gray-400 text-sm">
                        <i class="fa-solid fa-location-dot text-cardTitle w-5"></i>
                        <span>123 Design Avenue, New York, NY</span>
                    </div>
                    <div class="flex items-center gap-4 text-gray-400 text-sm">
                        <i class="fa-solid fa-envelope text-cardTitle w-5"></i>
                        <span>hello@ingoude.com</span>
                    </div>
                    <div class="flex items-center gap-4 text-gray-400 text-sm">
                        <i class="fa-solid fa-phone text-cardTitle w-5"></i>
                        <span>+1 (555) 019-2834</span>
                    </div>
                </div>
                <div class="mt-8 pt-6 border-t border-white/10 flex justify-between items-center">
                    <span class="text-xs text-gray-500 uppercase tracking-widest">Connect</span>
                    <div class="flex gap-4 text-primary">
                        <i class="fa-brands fa-instagram hover:text-cardBg cursor-pointer"></i>
                        <i class="fa-brands fa-twitter hover:text-cardBg cursor-pointer"></i>
                        <i class="fa-brands fa-linkedin-in hover:text-cardBg cursor-pointer"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lower Half: Cinematic Image Strip -->
        <div class="absolute bottom-0 left-0 w-full h-[45%] z-0">
            <!-- Gradient Overlay for smooth transition -->
            <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-b from-black to-transparent z-10"></div>
            
            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=1200&auto=format&fit=crop" 
                 alt="Modern Office Wide" 
                 class="w-full h-full object-cover grayscale-[50%] brightness-75">
            
            <!-- Footer Info overlay on image -->
            <div class="absolute bottom-10 left-16 z-20">
                <p class="text-white/60 text-[10px] tracking-widest uppercase">
                    &copy; 2026 Ingoude Company. All Rights Reserved.
                </p>
            </div>
        </div>

    </div>
</body>
</html>
