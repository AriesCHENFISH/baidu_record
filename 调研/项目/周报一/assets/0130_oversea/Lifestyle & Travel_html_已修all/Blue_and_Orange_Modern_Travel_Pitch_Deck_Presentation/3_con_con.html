<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Insights - Thynk Unlimited</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1e293b',       // Matching Reference
                        brandOrange: '#FF8C42',  // Matching Reference
                        brandYellow: '#FFB75E',
                        textLight: '#F0F0F0',
                        glass: 'rgba(255, 255, 255, 0.05)',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #1e293b;
            overflow: hidden;
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Timeline Line Gradient */
        .timeline-line {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3), transparent);
            z-index: 0;
        }

        /* Image Hover Effect */
        .hover-scale {
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .hover-scale:hover {
            transform: scale(1.03);
            z-index: 20;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .static-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="static-glow bg-brandOrange/20 w-[500px] h-[500px] -bottom-32 -left-32"></div>
        <div class="static-glow bg-blue-900/30 w-[600px] h-[600px] -top-32 -right-32"></div>

        <div class="absolute top-10 left-16 z-50">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 relative flex items-center justify-center bg-white/5 rounded-full border border-white/10 backdrop-blur-sm">
                    <svg viewBox="0 0 100 100" class="w-10 h-10">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFB75E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGradient)" stroke-width="5" stroke-opacity="0.4"/>
                        <circle cx="50" cy="50" r="22" fill="url(#logoGradient)" />
                        <path d="M25 58 Q 50 30 75 58" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <h4 class="text-2xl font-bold tracking-tight text-white font-serif">Thynk <span class="text-brandOrange">Unlimited</span></h4>
                    <p class="text-xs text-gray-400 tracking-wider uppercase">Global Travel Agency</p>
                </div>
            </div>
        </div>

        <div class="relative z-10 grid grid-cols-12 h-full w-full">

            <div class="col-span-1 h-full relative flex flex-col justify-center items-center pt-20">
                <div class="timeline-line"></div>
                <div class="absolute top-[30%] flex flex-col items-center gap-24 w-full">
                    <div class="w-2 h-2 rounded-full bg-white/30 z-10"></div>
                    <div class="w-10 h-10 rounded-full bg-bgDark border border-brandOrange/50 flex items-center justify-center z-10 shadow-[0_0_15px_rgba(255,140,66,0.3)]">
                        <span class="text-brandOrange font-serif font-bold text-sm">02</span>
                    </div>
                    <div class="w-2 h-2 rounded-full bg-white/30 z-10"></div>
                </div>
            </div>

            <div class="col-span-11 flex flex-col h-full px-8 py-8 pt-28">
                
                <div class="absolute top-12 right-16 text-white/40 italic font-serif tracking-wider text-sm">
                    @thynkunlimited
                </div>

                <div class="flex flex-row items-center justify-between h-[320px] mb-6">
                    
                    <div class="w-1/3 flex flex-col justify-center pl-4">
                        <div class="bg-brandOrange/10 text-brandOrange px-3 py-1 rounded inline-block w-fit text-xs font-bold border border-brandOrange/20 mb-4">
                            ANALYSIS
                        </div>
                        <h2 class="text-7xl font-serif font-medium leading-[0.9] text-white drop-shadow-lg">
                            Market<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-400 to-white italic">Insights</span>
                        </h2>
                        <div class="w-16 h-1 bg-brandOrange mt-8 rounded-full"></div>
                    </div>

                    <div class="w-2/3 flex justify-end gap-6 pr-8 items-center">
                        <div class="relative w-[300px] h-[250px] rounded-[24px] overflow-hidden border border-white/10 shadow-2xl hover-scale bg-gray-800">
                            <img src="https://images.unsplash.com/photo-1558862107-d49ef2a04d72?q=80&w=600&auto=format&fit=crop" 
                                 class="w-full h-full object-cover opacity-90">
                            <div class="absolute inset-0 bg-gradient-to-t from-bgDark/80 to-transparent"></div>
                            <div class="absolute bottom-4 left-4 text-white font-serif text-lg">Urban Growth</div>
                        </div>

                        <div class="relative w-[300px] h-[250px] rounded-[24px] overflow-hidden border border-white/10 shadow-2xl mt-12 hover-scale bg-gray-800">
                            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=600&auto=format&fit=crop" 
                                 class="w-full h-full object-cover opacity-90">
                            <div class="absolute inset-0 bg-gradient-to-t from-bgDark/80 to-transparent"></div>
                            <div class="absolute bottom-4 left-4 text-white font-serif text-lg">Global Reach</div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-6 mt-auto mb-6 pr-8">
                    
                    <div class="glass-panel rounded-xl p-5 flex flex-col items-center text-center group hover:bg-white/5 transition-colors">
                        <div class="text-brandOrange text-3xl mb-3 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <p class="text-gray-300 text-gl leading-5">
                            Market value expected to hit <b class="text-white font-bold">$1.2T</b> by 2032.
                        </p>
                    </div>

                    <div class="glass-panel rounded-xl p-5 flex flex-col items-center text-center group hover:bg-white/5 transition-colors">
                        <div class="text-brandOrange text-3xl mb-3 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </div>
                        <p class="text-gray-300 text-gl leading-5">
                            <b class="text-white font-bold">75%</b> prefer mobile-first booking platforms.
                        </p>
                    </div>

                    <div class="glass-panel rounded-xl p-5 flex flex-col items-center text-center group hover:bg-white/5 transition-colors">
                        <div class="text-brandOrange text-3xl mb-3 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-chart-pie"></i>
                        </div>
                        <p class="text-gray-300 text-gl leading-5">
                            Data-driven <b class="text-white font-bold">personalization</b> rising.
                        </p>
                    </div>

                    <div class="glass-panel rounded-xl p-5 flex flex-col items-center text-center group hover:bg-white/5 transition-colors">
                        <div class="text-brandOrange text-3xl mb-3 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-network-wired"></i>
                        </div>
                        <p class="text-gray-300 text-gl leading-5">
                            Demand for multi-service <b class="text-white font-bold">ecosystems</b>.
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
