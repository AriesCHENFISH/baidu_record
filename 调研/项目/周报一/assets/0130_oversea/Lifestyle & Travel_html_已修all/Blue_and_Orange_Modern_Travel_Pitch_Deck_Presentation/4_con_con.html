<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thynk Unlimited - Our Mission</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1e293b',
                        brandOrange: '#FF8C42',
                        brandYellow: '#FFB75E',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #1e293b;
            overflow: hidden;
        }

        .static-glow {
            position: absolute; border-radius: 50%; filter: blur(90px); z-index: 0;
        }

        .mission-image {
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.5s ease;
        }
        .mission-image:hover {
            transform: scale(1.02);
        }

        /* 镂空文字效果 */
        .text-outline {
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.05);
            color: transparent;
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="static-glow bg-white/5 w-[600px] h-[300px] -top-20 left-[40%]"></div>
        <div class="static-glow bg-brandOrange/10 w-[500px] h-[300px] -bottom-20 -right-20"></div>

        <div class="absolute top-10 left-16 z-50">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 relative flex items-center justify-center bg-white/5 rounded-full border border-white/10 backdrop-blur-sm">
                    <svg viewBox="0 0 100 100" class="w-10 h-10">
                        <defs>
                            <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFB75E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGradient2)" stroke-width="5" stroke-opacity="0.4"/>
                        <circle cx="50" cy="50" r="22" fill="url(#logoGradient2)" />
                        <path d="M25 58 Q 50 30 75 58" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <h4 class="text-2xl font-bold tracking-tight text-white font-serif">Thynk <span class="text-brandOrange">Unlimited</span></h4>
                    <p class="text-xs text-gray-400 tracking-wider uppercase">Global Travel Agency</p>
                </div>
            </div>
        </div>

        <div class="absolute top-12 right-16 text-white/40 italic font-serif tracking-wider text-sm z-50">
            @thynkunlimited
        </div>

        <div class="absolute inset-0 pt-32 pb-10 px-16 grid grid-cols-[100px_1fr_1fr] z-10">

            <div class="flex flex-col items-center justify-center relative">
                <div class="absolute top-[15%] bottom-[15%] w-[1px] bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>
                
                <div class="h-[60%] flex flex-col justify-between items-center z-10">
                    <div class="w-3 h-3 rounded-full bg-white/20"></div>
                    <div class="w-3 h-3 rounded-full bg-white/20"></div>
                    
                    <div class="w-12 h-12 rounded-full bg-bgDark border border-brandOrange flex items-center justify-center shadow-[0_0_25px_rgba(255,140,66,0.2)]">
                        <span class="text-xl font-bold text-white font-serif">3</span>
                    </div>
                    
                    <div class="w-3 h-3 rounded-full bg-white/20"></div>
                </div>
            </div>

            <div class="flex items-center justify-center p-6">
                <div class="mission-image relative w-full h-full rounded-[32px] overflow-hidden bg-gray-800">
                    <img src="https://images.unsplash.com/photo-1499856871940-a09627c6dcf6?q=80&w=1000&auto=format&fit=crop" 
                         alt="Louvre Museum" 
                         class="w-full h-full object-cover opacity-90">
                     <div class="absolute inset-0 bg-gradient-to-t from-bgDark/60 to-transparent"></div>
                </div>
            </div>

            <div class="pl-16 flex flex-col justify-center relative z-20">
                
                <div class="mb-10">
                    <div class="w-16 h-16 bg-gradient-to-br from-brandOrange to-orange-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-orange-500/20 transform -rotate-3 border border-white/10">
                        <i class="fa-solid fa-bullseye text-white text-2xl"></i>
                    </div>
                </div>

                <div class="relative mb-12">
                    <h1 class="text-[8rem] leading-none font-serif font-black text-outline absolute -top-16 -left-10 select-none z-0 opacity-50">
                        MISSION
                    </h1>
                    
                    <div class="flex items-center gap-3 mb-4 relative z-10">
                        <div class="w-8 h-[2px] bg-brandOrange"></div>
                        <span class="text-brandOrange font-bold tracking-[0.3em] text-xs uppercase">Vision & Values</span>
                    </div>

                    <h1 class="text-[4.5rem] leading-[1] font-serif font-medium text-white tracking-tight relative z-10">
                        Our <br>
                        <span class="font-bold italic text-transparent bg-clip-text bg-gradient-to-r from-brandOrange to-brandYellow">Mission</span>
                    </h1>
                </div>

                <div class="relative pl-8">
                    <div class="absolute left-0 top-2 bottom-2 w-[2px] bg-gradient-to-b from-brandOrange via-white/20 to-transparent"></div>
                    
                    <p class="text-[1.1rem] leading-loose text-slate-300 font-light">
                        At Thynk Unlimited, we aim to <span class="text-white font-medium">redefine exploration</span>. By uniting disjointed booking systems into a single, intuitive platform, we give travelers the ultimate luxury: <span class="text-white font-medium">freedom without complexity</span>.
                    </p>
                </div>

            </div>

        </div>

        <div class="absolute bottom-10 left-0 w-full flex justify-center gap-6 z-20">
            <button class="w-12 h-12 rounded-full border border-white/20 flex items-center justify-center text-gray-400 hover:bg-white/10 hover:text-white transition-all">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="w-12 h-12 rounded-full bg-brandOrange text-white flex items-center justify-center shadow-lg hover:bg-orange-600 transition-all hover:scale-105">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

    </div>

</body>
</html>
