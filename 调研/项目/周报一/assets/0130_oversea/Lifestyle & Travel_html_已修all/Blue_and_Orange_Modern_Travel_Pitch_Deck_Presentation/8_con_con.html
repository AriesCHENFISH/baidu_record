<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Model - Thynk Unlimited</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1e293b',
                        brandOrange: '#FF8C42',
                        brandYellow: '#FFB75E',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #1e293b;
            overflow: hidden;
        }

        .static-glow {
            position: absolute; border-radius: 50%; filter: blur(90px); z-index: 0;
        }

        /* Connecting Line Animation */
        .connector-line {
            position: absolute;
            top: 24px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #FF8C42, transparent);
            opacity: 0.5;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1280&auto=format&fit=crop" 
                 class="w-full h-full object-cover opacity-30 mix-blend-overlay">
            <div class="absolute inset-0 bg-gradient-to-b from-bgDark via-bgDark/95 to-bgDark"></div>
        </div>

        <div class="static-glow bg-brandOrange/10 w-[700px] h-[400px] top-[-100px] left-[50%] -translate-x-1/2"></div>

        <div class="absolute top-10 left-16 z-50">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 relative flex items-center justify-center bg-white/5 rounded-full border border-white/10 backdrop-blur-sm">
                    <svg viewBox="0 0 100 100" class="w-10 h-10">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#FFB75E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGradient)" stroke-width="5" stroke-opacity="0.4"/>
                        <circle cx="50" cy="50" r="22" fill="url(#logoGradient)" />
                        <path d="M25 58 Q 50 30 75 58" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" />
                    </svg>
                </div>
                <div>
                    <h4 class="text-2xl font-bold tracking-tight text-white font-serif">Thynk <span class="text-brandOrange">Unlimited</span></h4>
                    <p class="text-xs text-gray-400 tracking-wider uppercase">Global Travel Agency</p>
                </div>
            </div>
        </div>

        <div class="absolute top-12 right-16 text-white/30 italic font-serif tracking-wider text-sm z-50">
            @thynkunlimited
        </div>

        <div class="relative z-20 flex flex-col justify-center items-center h-full pt-20">
            
            <div class="text-center mb-20">
                <span class="text-brandOrange text-xs font-bold tracking-[0.3em] uppercase mb-4 block">Strategy</span>
                <h1 class="text-6xl font-serif font-bold text-white mb-4 drop-shadow-lg">
                    Business Model
                </h1>
                <div class="w-24 h-1 bg-gradient-to-r from-transparent via-brandOrange to-transparent mx-auto rounded-full"></div>
            </div>

            <div class="w-full max-w-5xl relative">
                
                <div class="connector-line top-[50px]"></div>

                <div class="grid grid-cols-3 gap-16">
                    
                    <div class="flex flex-col items-center text-center group relative z-10">
                        <div class="w-24 h-24 rounded-full bg-[#1e293b] border-2 border-brandOrange flex items-center justify-center shadow-[0_0_30px_rgba(255,140,66,0.15)] mb-8 group-hover:scale-110 transition-transform duration-300">
                            <i class="fa-solid fa-hand-holding-dollar text-brandOrange text-3xl"></i>
                        </div>
                        <h3 class="text-white font-serif text-2xl mb-3">Commissions</h3>
                        <p class="text-gray-400 text-gl leading-relaxed max-w-[240px]">
                            Service fees from travel partners and global providers.
                        </p>
                    </div>

                    <div class="flex flex-col items-center text-center group relative z-10">
                        <div class="w-24 h-24 rounded-full bg-[#1e293b] border-2 border-brandOrange flex items-center justify-center shadow-[0_0_30px_rgba(255,140,66,0.15)] mb-8 group-hover:scale-110 transition-transform duration-300">
                            <i class="fa-solid fa-crown text-brandOrange text-3xl"></i>
                        </div>
                        <h3 class="text-white font-serif text-2xl mb-3">Subscriptions</h3>
                        <p class="text-gray-400 text-gl leading-relaxed max-w-[240px]">
                            Premium memberships offering exclusive travel perks.
                        </p>
                    </div>

                    <div class="flex flex-col items-center text-center group relative z-10">
                        <div class="w-24 h-24 rounded-full bg-[#1e293b] border-2 border-brandOrange flex items-center justify-center shadow-[0_0_30px_rgba(255,140,66,0.15)] mb-8 group-hover:scale-110 transition-transform duration-300">
                            <i class="fa-solid fa-handshake text-brandOrange text-3xl"></i>
                        </div>
                        <h3 class="text-white font-serif text-2xl mb-3">Partnerships</h3>
                        <p class="text-gray-400 text-gl leading-relaxed max-w-[240px]">
                            Strategic alliances driving mutual growth in tourism.
                        </p>
                    </div>

                </div>
            </div>

        </div>

        <div class="absolute bottom-8 w-full text-center text-white/20 font-serif text-sm tracking-widest">
            07 / 08
        </div>

    </div>
</body>
</html>
