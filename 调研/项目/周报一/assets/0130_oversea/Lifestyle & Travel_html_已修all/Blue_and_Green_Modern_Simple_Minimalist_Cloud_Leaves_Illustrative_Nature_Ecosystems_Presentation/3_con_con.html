<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components of an Ecosystem</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#2A323F',
                            nav: '#1B2230',
                            accent: '#7E9F44',
                            secondary: '#346B8A',
                            textMain: '#FFFFFF',
                            textMuted: '#D1D5DB',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #2A323F; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }
        ::-webkit-scrollbar { display: none; }

        /* 统一：顶部导航标签样式 */
        .keyword-tag {
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 0.15em;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .keyword-tag:hover {
            border-color: #7E9F44;
            color: #7E9F44;
            background: rgba(126, 159, 68, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover opacity-60 filter blur-sm">
            <div class="absolute inset-0 bg-[#2A323F] opacity-70"></div>
        </div>

        <header class="absolute top-8 left-0 right-0 z-50 flex justify-center">
            <nav class="w-[90%] bg-[#1B2230] rounded-full px-8 py-4 flex justify-between items-center shadow-lg border border-white/5">
                <div class="flex items-center gap-3">
                    <div class="text-brand-accent text-2xl">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <span class="text-white font-bold tracking-widest text-lg uppercase">YOUR COMPANY</span>
                </div>

                <div class="flex items-center gap-3">
                    <div class="keyword-tag uppercase">BIOTIC</div>
                    <div class="keyword-tag uppercase">ABIOTIC</div>
                    <div class="keyword-tag uppercase">INTERACTION</div>
                    <div class="w-[1px] h-4 bg-white/10 mx-2"></div>
                    <i class="fa-solid fa-bars-staggered text-white/60 cursor-pointer hover:text-brand-accent transition-colors"></i>
                </div>
            </nav>
        </header>

        <div class="relative z-10 grid grid-cols-12 h-full pt-28 pb-12 px-16 gap-12 items-center">
            <div class="col-span-7 flex flex-col justify-center h-full">
                <div class="mb-12">
                    <h1 class="text-7xl font-bold text-white leading-[1.1] tracking-tight mb-4 drop-shadow-md">
                        Components of <br>
                        <span class="text-brand-accent">an Ecosystem</span>
                    </h1>
                    <div class="w-24 h-1 bg-brand-accent rounded-full mt-6"></div>
                </div>
                <div class="flex gap-6 mb-10 group">
                    <div class="w-20 h-20 shrink-0 rounded-2xl bg-gradient-to-br from-[#7E9F44] to-[#5c7530] flex items-center justify-center shadow-lg transform group-hover:-translate-y-1 transition-transform duration-300">
                        <i class="fa-solid fa-seedling text-white text-3xl"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h2 class="text-2xl font-bold text-white mb-2">Biotic Components</h2>
                        <p class="text-brand-textMuted text-base leading-relaxed max-w-md">Producers (plants), consumers (animals), decomposers (fungi, bacteria).</p>
                    </div>
                </div>
                <div class="flex gap-6 group">
                    <div class="w-20 h-20 shrink-0 rounded-2xl bg-gradient-to-br from-[#346B8A] to-[#1B3A4B] flex items-center justify-center shadow-lg transform group-hover:-translate-y-1 transition-transform duration-300">
                        <i class="fa-solid fa-droplet text-white text-3xl"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h2 class="text-2xl font-bold text-white mb-2">Abiotic Components</h2>
                        <p class="text-brand-textMuted text-base leading-relaxed max-w-md">Sunlight, water, air, temperature, soil.</p>
                    </div>
                </div>
            </div>
            <div class="col-span-5 flex flex-col gap-6 h-full justify-center pl-4">
                <div class="relative w-full h-64 rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                    <img src="https://images.unsplash.com/photo-1444464666117-439d5c43784b?q=80&w=600" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-4 left-4 bg-black/50 backdrop-blur-md px-3 py-1 rounded-lg border border-white/20">
                        <span class="text-white text-xs font-semibold uppercase tracking-wider"><i class="fa-solid fa-dove mr-2 text-brand-accent"></i>Fauna</span>
                    </div>
                </div>
                <div class="relative w-full h-64 rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                    <img src="https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?q=80&w=600" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                    <div class="absolute bottom-4 left-4 bg-black/50 backdrop-blur-md px-3 py-1 rounded-lg border border-white/20">
                        <span class="text-white text-xs font-semibold uppercase tracking-wider"><i class="fa-solid fa-water mr-2 text-brand-secondary"></i>Marine</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute -bottom-10 -right-10 w-64 h-64 z-20 pointer-events-none opacity-90">
             <img src="https://images.unsplash.com/photo-1596329706859-71553c20054a?q=80&w=300" style="mask-image: radial-gradient(circle, black 50%, transparent 100%); -webkit-mask-image: radial-gradient(circle, black 50%, transparent 100%);" class="w-full h-full object-contain rotate-45">
        </div>
    </div>

</body>
</html>
