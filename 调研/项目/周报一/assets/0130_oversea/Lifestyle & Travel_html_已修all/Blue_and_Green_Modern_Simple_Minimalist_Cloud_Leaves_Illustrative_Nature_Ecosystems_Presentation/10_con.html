<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation Efforts Keynote</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgPrimary: '#2A323F', navBg: '#1B2230', accent: '#7E9F44', coldAccent: '#346B8A', textSecondary: '#D1D5DB'
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #2A323F; overflow: hidden; font-family: "Noto Sans SC", sans-serif;
        }
        ::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(27, 34, 48, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

        /* 统一：顶部导航标签样式 */
        .keyword-tag {
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 0.15em;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .keyword-tag:hover {
            border-color: #7E9F44;
            color: #7E9F44;
            background: rgba(126, 159, 68, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2000&auto=format&fit=crop" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-[#2A323F] opacity-70"></div>
        </div>

        <header class="absolute top-8 left-0 right-0 z-50 flex justify-center">
            <nav class="w-[92%] bg-[#1B2230] rounded-full px-8 py-4 flex justify-between items-center shadow-lg border border-white/5 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-leaf text-[#7E9F44] text-xl"></i>
                    <h1 class="text-white font-bold text-lg tracking-wide uppercase">YOUR COMPANY</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="keyword-tag uppercase">PROTECTION</div>
                    <div class="keyword-tag uppercase">REFORESTATION</div>
                    <div class="keyword-tag uppercase">SUSTAINABILITY</div>
                    <div class="w-[1px] h-4 bg-white/10 mx-2"></div>
                    <i class="fa-solid fa-bars-staggered text-white/60 cursor-pointer hover:text-[#7E9F44] transition-colors"></i>
                </div>
            </nav>
        </header>

        <div class="absolute top-32 left-0 w-full h-[calc(100%-128px)] z-10 px-12 pb-12">
            <div class="grid grid-cols-12 gap-8 h-full">
                <div class="col-span-4 h-full relative group rounded-3xl overflow-hidden shadow-2xl border border-white/10">
                    <img src="https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?q=80&w=800" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                </div>
                <div class="col-span-5 h-full flex flex-col justify-center relative">
                    <div class="w-full p-8 rounded-2xl border border-[#7E9F44] glass-panel shadow-xl">
                        <h2 class="text-5xl font-light text-white leading-tight mb-6">Conservation <br><span class="font-bold text-[#7E9F44]">Efforts</span></h2>
                        <div class="w-16 h-1 bg-[#7E9F44] mb-6 rounded-full"></div>
                        <p class="text-[#D1D5DB] text-sm leading-7 font-light text-justify">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                    </div>
                </div>
                <div class="col-span-3 h-full flex flex-col gap-6">
                    <div class="h-1/2 rounded-3xl overflow-hidden shadow-lg border border-white/10 relative">
                        <img src="https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?q=80&w=600" class="w-full h-full object-cover">
                    </div>
                    <div class="h-1/2 rounded-3xl p-6 flex flex-col justify-center shadow-lg relative overflow-hidden" style="background: linear-gradient(135deg, #7E9F44, #5d7a30);">
                        <div class="mb-4">
                            <div class="w-12 h-12 rounded-lg bg-white/20 flex items-center justify-center backdrop-blur-sm"><i class="fa-solid fa-chart-line text-white text-2xl"></i></div>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">Strategies</h3>
                        <p class="text-white/90 text-xs leading-5">Protected areas, reforestation, sustainable practices.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-32 pointer-events-none z-20 bg-gradient-to-t from-[#2A323F] to-transparent"></div>
    </div>
</body>
</html>
