<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Ecosystems Keynote</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2A323F', navbar: '#1B2230', textMain: '#FFFFFF', textSub: '#D1D5DB', accent: '#7E9F44', cold: '#346B8A' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #2A323F; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .glass-panel { background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        /* 统一：顶部导航标签样式 */
        .keyword-tag {
            padding: 6px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 0.15em;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .keyword-tag:hover {
            border-color: #7E9F44;
            color: #7E9F44;
            background: rgba(126, 159, 68, 0.1);
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1280" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0" style="background: linear-gradient(to bottom, rgba(42, 50, 63, 0.8), rgba(42, 50, 63, 0.4));"></div>
        </div>

        <header class="absolute top-8 left-0 right-0 z-50 flex justify-center">
            <nav class="w-[92%] bg-navbar rounded-full px-8 py-4 flex justify-between items-center shadow-lg border border-white/10 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-leaf text-[#7E9F44] text-xl"></i>
                    <h1 class="text-white font-bold text-lg tracking-wide uppercase">YOUR COMPANY</h1>
                </div>
                <div class="flex items-center gap-3">
                    <div class="keyword-tag uppercase">MARINE</div>
                    <div class="keyword-tag uppercase">FRESHWATER</div>
                    <div class="keyword-tag uppercase">CONSERVATION</div>
                    <div class="w-[1px] h-4 bg-white/10 mx-2"></div>
                    <i class="fa-solid fa-bars-staggered text-white/60 cursor-pointer hover:text-accent transition-colors"></i>
                </div>
            </nav>
        </header>

        <div class="absolute top-[120px] left-0 w-full h-[560px] px-16 z-10 grid grid-cols-12 gap-12 items-center">
            <div class="col-span-6 flex flex-col gap-6 h-full justify-center">
                <div class="relative w-full h-[240px] rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                    <img src="https://images.unsplash.com/photo-1546026423-cc4642628d2b?w=800" class="w-full h-full object-cover transform group-hover:scale-105 transition-all duration-700">
                </div>
                <div class="relative w-full h-[240px] rounded-3xl overflow-hidden shadow-2xl border border-white/10 group">
                    <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=800" class="w-full h-full object-cover transform group-hover:scale-105 transition-all duration-700">
                </div>
            </div>
            <div class="col-span-6 flex flex-col justify-center pl-8">
                <h1 class="text-6xl font-light text-textMain tracking-tight mb-10">Aquatic <br/><span class="font-bold">Ecosystems</span></h1>
                <div class="glass-panel border border-accent rounded-2xl p-6 mb-6 flex items-center gap-6 shadow-lg relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-accent"></div>
                    <div class="w-16 h-16 bg-cold/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-anchor text-3xl text-white"></i></div>
                    <div class="flex flex-col">
                        <h4 class="text-textMain font-bold text-xl mb-1">70% of Earth’s surface</h4>
                        <p class="text-textSub text-sm font-light">Marine ecosystems cover the majority of our planet.</p>
                    </div>
                </div>
                <div class="glass-panel border border-accent rounded-2xl p-6 flex items-center gap-6 shadow-lg relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-accent"></div>
                    <div class="w-16 h-16 bg-cold/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-dharmachakra text-3xl text-white"></i></div>
                    <div class="flex flex-col">
                        <h4 class="text-textMain font-bold text-xl mb-1">Freshwater ecosystems</h4>
                        <p class="text-textSub text-sm font-light">Support diverse species and vital biodiversity.</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute bottom-[-50px] left-[-50px] w-[400px] h-[300px] pointer-events-none z-20 opacity-20" style="background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%); filter: blur(40px);"></div>
    </div>
</body>
</html>
