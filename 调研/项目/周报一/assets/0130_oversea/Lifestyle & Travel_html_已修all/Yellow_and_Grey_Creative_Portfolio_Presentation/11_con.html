<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Selected Works</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans SC', sans-serif; }
        #page_container {
            width: 1280px; height: 720px; background-color: #F4F4F4;
            position: relative; overflow: hidden; margin: 0 auto; color: #1A1A1A;
        }
        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .img-filter { filter: grayscale(100%) contrast(115%); transition: filter 0.3s; }
        .img-filter:hover { filter: grayscale(0%) contrast(100%); }
        .text-stroke { -webkit-text-stroke: 1px black; color: transparent; }
        .tight-tracking { letter-spacing: -0.05em; }
    </style>
</head>
<body>

    <div id="page_container" class="bg-grid">
        
        <!-- Grid Lines -->
        <div class="absolute top-0 bottom-0 left-1/3 w-[1px] bg-black opacity-10"></div>
        <div class="absolute left-0 right-0 bottom-32 h-[1px] bg-black opacity-10"></div>

        <!-- Label -->
        <div class="absolute top-12 left-12 z-20">
            <h5 class="text-[10px] font-bold tracking-[0.4em] uppercase">Selection 2024-2025</h5>
        </div>

        <div class="flex w-full h-full">
            
            <!-- Left Column: Title & List -->
            <div class="w-1/3 h-full border-r border-black border-opacity-10 flex flex-col relative bg-white">
                <div class="p-12 pt-24 pb-0">
                    <h1 class="text-[80px] font-black leading-[0.85] uppercase tight-tracking">Selected</h1>
                    <h1 class="text-[80px] font-black leading-[0.85] uppercase text-stroke">Works</h1>
                </div>

                <div class="mt-auto flex flex-col">
                    <!-- Project Item 1 -->
                    <div class="group border-t border-black border-opacity-10 p-8 hover:bg-black hover:text-white transition-all cursor-pointer">
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="text-xs font-bold tracking-widest opacity-60 group-hover:opacity-100">01</span>
                            <i class="fa-solid fa-arrow-right -rotate-45 group-hover:rotate-0 transition-transform"></i>
                        </div>
                        <h3 class="text-2xl font-bold uppercase">Fintech App</h3>
                        <p class="text-[10px] uppercase mt-1 opacity-60 group-hover:opacity-80">UI/UX / Strategy</p>
                    </div>
                    <!-- Project Item 2 -->
                    <div class="group border-t border-black border-opacity-10 p-8 hover:bg-black hover:text-white transition-all cursor-pointer">
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="text-xs font-bold tracking-widest opacity-60 group-hover:opacity-100">02</span>
                            <i class="fa-solid fa-arrow-right -rotate-45 group-hover:rotate-0 transition-transform"></i>
                        </div>
                        <h3 class="text-2xl font-bold uppercase">Mono Brand</h3>
                        <p class="text-[10px] uppercase mt-1 opacity-60 group-hover:opacity-80">Identity / Print</p>
                    </div>
                    <!-- Project Item 3 -->
                    <div class="group border-t border-black border-opacity-10 p-8 hover:bg-black hover:text-white transition-all cursor-pointer">
                        <div class="flex justify-between items-baseline mb-2">
                            <span class="text-xs font-bold tracking-widest opacity-60 group-hover:opacity-100">03</span>
                            <i class="fa-solid fa-arrow-right -rotate-45 group-hover:rotate-0 transition-transform"></i>
                        </div>
                        <h3 class="text-2xl font-bold uppercase">Future Tech</h3>
                        <p class="text-[10px] uppercase mt-1 opacity-60 group-hover:opacity-80">Web Design</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Visual Preview -->
            <div class="w-2/3 h-full relative p-16 flex flex-col justify-center items-center">
                <!-- Status Indicator -->
                <div class="absolute top-12 right-12 text-right">
                    <p class="text-[10px] font-bold uppercase tracking-widest mb-1">Status</p>
                    <div class="flex items-center gap-2 justify-end">
                        <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                        <span class="text-xs font-bold">Shipped</span>
                    </div>
                </div>

                <!-- Main Image -->
                <div class="relative w-[600px] h-[400px]">
                    <div class="absolute -right-4 -bottom-4 w-full h-full bg-black"></div>
                    <div class="absolute inset-0 bg-white border border-black p-2 z-10">
                        <img src="https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=800" class="w-full h-full object-cover img-filter">
                        <div class="absolute bottom-4 left-4 bg-black text-white px-3 py-1 text-[10px] font-bold uppercase tracking-wider">
                            Featured Case Study
                        </div>
                    </div>
                </div>

                <div class="absolute bottom-12 right-12 max-w-xs text-right">
                    <p class="text-xs font-bold leading-relaxed uppercase">
                        Exploring the intersection of brutalist aesthetics and modern usability standards.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
