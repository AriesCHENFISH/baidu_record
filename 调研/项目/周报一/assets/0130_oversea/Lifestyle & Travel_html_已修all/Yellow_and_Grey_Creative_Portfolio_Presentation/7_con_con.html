<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Selected Works</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans SC', sans-serif; }
        #page_container {
            width: 1280px; height: 720px; background-color: #F4F4F4;
            position: relative; overflow: hidden; margin: 0 auto; color: #1A1A1A;
        }
        .bg-grid {
            background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .img-filter { filter: grayscale(100%) contrast(120%) brightness(90%); }
        .text-stroke { -webkit-text-stroke: 1.5px black; color: transparent; }
        .img-offset-box { position: relative; border: 1px solid black; background: white; padding: 6px; }
        .img-offset-box::before { content: ''; position: absolute; right: -8px; bottom: -8px; width: 100%; height: 100%; background: black; z-index: -1; }
    </style>
</head>
<body>

    <div id="page_container" class="bg-grid">
        
        <header class="absolute top-12 left-16 right-16 flex justify-between items-end border-b border-black pb-4 z-20">
            <h1 class="text-7xl font-black uppercase tracking-tighter">
                Selected <span class="text-stroke">Works</span>
            </h1>
            <div class="text-right">
                <p class="text-[10px] font-black uppercase tracking-widest opacity-40 mb-1">Curation Phase</p>
                <p class="text-sm font-bold uppercase">Work Archive / Vol.02</p>
            </div>
        </header>

        <div class="absolute inset-x-16 top-[180px] bottom-12 flex gap-12">
            
            <div class="flex-1 flex flex-col pt-12">
                <div class="img-offset-box h-[340px] mb-6">
                    <img src="https://images.unsplash.com/photo-1616952766862-2374e2a39308?q=80&w=400" class="w-full h-full object-cover img-filter">
                </div>
                <div class="pl-2">
                    <p class="text-[9px] font-bold uppercase tracking-widest opacity-40 mb-2">01 / Industrial</p>
                    <h3 class="text-lg font-black uppercase mb-1 leading-tight">Metal & Texture</h3>
                    <p class="text-[10px] font-bold uppercase tracking-tighter opacity-60">Concept Design & Fabrication</p>
                </div>
            </div>

            <div class="flex-1 flex flex-col pt-24">
                <div class="img-offset-box h-[340px] mb-6">
                    <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=400" class="w-full h-full object-cover img-filter">
                </div>
                <div class="pl-2">
                    <p class="text-[9px] font-bold uppercase tracking-widest opacity-40 mb-2">02 / Minimalist</p>
                    <h3 class="text-lg font-black uppercase mb-1 leading-tight">Fabric & Form</h3>
                    <p class="text-[10px] font-bold uppercase tracking-tighter opacity-60">Creative Styling & Visuals</p>
                </div>
            </div>

            <div class="flex-1 flex flex-col pt-0">
                <div class="img-offset-box h-[340px] mb-6">
                    <img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=400" class="w-full h-full object-cover img-filter">
                </div>
                <div class="pl-2">
                    <p class="text-[9px] font-bold uppercase tracking-widest opacity-40 mb-2">03 / Identity</p>
                    <h3 class="text-lg font-black uppercase mb-1 leading-tight">Human Identity</h3>
                    <p class="text-[10px] font-bold uppercase tracking-tighter opacity-60">High-End Portrait Photography</p>
                </div>
                <div class="mt-8 pt-4 border-t border-black border-dashed flex justify-between items-center">
                    <span class="text-[9px] font-black uppercase tracking-[0.3em]">Full Case Study</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </div>
            </div>

        </div>

        <div class="absolute bottom-12 left-16 flex items-center gap-6 opacity-30">
            <div class="text-[8px] font-mono leading-tight">
                SCAN_INDEX: 4022-X<br>
                REF_SYS: SWISS_GRID
            </div>
            <div class="w-12 h-[1px] bg-black"></div>
        </div>
    </div>

</body>
</html>
