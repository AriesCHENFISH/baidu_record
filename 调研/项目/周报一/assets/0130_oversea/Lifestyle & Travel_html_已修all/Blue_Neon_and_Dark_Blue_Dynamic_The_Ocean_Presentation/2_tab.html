<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean - Contents Page</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;400;600;800&family=Libre+Baskerville:ital,wght@1,400&display=swap">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto;
            position: relative;
            background: #010510; 
            overflow: hidden;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
        }

        /* 目录标题样式：延续封面斜体渐变感 */
        .page-title {
            font-family: 'Libre Baskerville', serif;
            font-size: 80px;
            background: linear-gradient(180deg, #FFFFFF 40%, rgba(79, 189, 242, 0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -3px;
        }

        /* 目录项悬停效果 */
        .content-item {
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        
        .content-item:hover {
            padding-left: 20px;
            background: linear-gradient(90deg, rgba(79, 189, 242, 0.05) 0%, transparent 100%);
            border-bottom-color: rgba(79, 189, 242, 0.4);
        }

        /* 数字索引样式 */
        .index-num {
            font-family: 'Libre Baskerville', serif;
            color: #4FBDF2;
            opacity: 0.6;
            font-style: italic;
        }

        /* 透明泡泡装饰 */
        .bubble-deco {
            position: absolute;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 5;
            animation: float 12s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-30px, -20px) rotate(10deg); }
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex">
        
        <div class="absolute w-[600px] h-[600px] bg-[#0A1E4D] blur-[100px] opacity-40 -top-20 -right-20"></div>

        <div class="bubble-deco w-[500px] h-[500px] -right-20 top-20 opacity-60" 
             style="border-radius: 40% 60% 70% 30% / 50% 40% 60% 50%;">
            <div class="w-full h-full flex items-center justify-center p-20 opacity-20">
                <i class="fa-solid fa-compass text-[200px] text-[#4FBDF2]"></i>
            </div>
        </div>

        <div class="relative z-20 w-[65%] h-full flex flex-col justify-center pl-24 pr-12">
            
            <div class="mb-12">
                <div class="flex items-center gap-4 mb-4">
                    <span class="h-[1px] w-8 bg-[#4FBDF2]"></span>
                    <span class="text-[#4FBDF2] text-[10px] font-bold tracking-[0.6em] uppercase">Navigation</span>
                </div>
                <h1 class="page-title italic">Contents</h1>
            </div>

            <div class="grid grid-cols-2 gap-x-16 gap-y-2">
                
                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">01</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Ocean Geography</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">05</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Climate Regulation</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">02</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Marine Biodiversity</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">06</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">The Abyssal Zone</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">03</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Tidal Systems</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">07</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Urgent Threats</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">04</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Resource Scarcity</span>
                </div>

                <div class="content-item py-4 flex items-baseline gap-4 group">
                    <span class="index-num text-xl">08</span>
                    <span class="text-white/80 text-lg font-light tracking-widest uppercase group-hover:text-white">Conservation Action</span>
                </div>

            </div>
        </div>

        <div class="absolute bottom-12 left-24 flex items-center gap-12 opacity-30">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold tracking-widest uppercase">Page Index</span>
                <span class="text-[10px] font-light">/ 02</span>
            </div>
            <div class="h-[1px] w-24 bg-white/50"></div>
            <span class="text-[10px] font-bold tracking-[0.4em] uppercase">Salford & Co. Research</span>
        </div>

        <div class="absolute right-12 top-1/2 -translate-y-1/2 flex flex-col gap-4 opacity-20">
            <div class="w-1 h-1 bg-white rounded-full"></div>
            <div class="w-1 h-12 bg-gradient-to-b from-[#4FBDF2] to-transparent"></div>
            <div class="w-1 h-1 bg-white rounded-full"></div>
        </div>
    </div>

</body>
</html>
