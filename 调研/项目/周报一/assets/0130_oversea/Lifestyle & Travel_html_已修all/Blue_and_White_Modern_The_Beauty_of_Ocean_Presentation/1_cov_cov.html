<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Archive - Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { oceanDeep: '#081033', electricCyan: '#00E5FF' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        #page_container { width: 1280px; height: 720px; position: relative; background: #081033; color: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; margin: 0 auto; }
        .text-outline { -webkit-text-stroke: 1px rgba(0, 229, 255, 0.4); color: transparent; }
        .grid-pattern { background-image: radial-gradient(rgba(0, 229, 255, 0.15) 1px, transparent 1px); background-size: 30px 30px; }
        .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); }
    </style>
</head>
<body class="grid-pattern">
    <div id="page_container" class="bg-transparent">
        <!-- Background Decor: Huge Outline Text -->
        <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none z-0">
            <span class="text-[320px] font-black text-outline uppercase tracking-tighter">ABYSSAL</span>
        </div>

        <!-- Header: Logo -->
        <header class="relative z-20 px-20 pt-12 flex items-center justify-between">
            <div class="flex items-center gap-5">
                <div class="w-12 h-12 border-2 border-electricCyan flex flex-col items-center justify-center gap-1">
                    <div class="w-6 h-0.5 bg-white"></div>
                    <div class="w-4 h-0.5 bg-electricCyan"></div>
                    <div class="w-6 h-0.5 bg-white"></div>
                </div>
                <div>
                    <h2 class="text-2xl font-black tracking-widest uppercase leading-none">Abyssal</h2>
                    <span class="text-[9px] tracking-[0.5em] text-electricCyan uppercase font-bold">Research Archive</span>
                </div>
            </div>
            <div class="text-[10px] font-mono text-white/40 tracking-[0.3em] uppercase">Status: Final Transmission</div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col items-center justify-center relative z-10">
            <div class="text-center">
                <div class="flex items-center justify-center gap-4 mb-4">
                    <div class="w-12 h-[1px] bg-electricCyan"></div>
                    <span class="text-electricCyan font-bold tracking-[0.6em] text-xs uppercase">Observation Report // 2026</span>
                    <div class="w-12 h-[1px] bg-electricCyan"></div>
                </div>
                <h1 class="text-9xl font-serif italic mb-2 leading-none">The Beauty of</h1>
                <h2 class="text-[150px] font-black text-white leading-none tracking-tight uppercase">OCEAN</h2>
                <p class="mt-8 text-gray-400 font-light tracking-[0.4em] text-sm uppercase">Exploring the Hadal Zone Frontiers</p>
            </div>
        </main>

        <!-- Reporter Information Section (Data Matrix Style) -->
        <footer class="relative z-20 px-20 pb-16">
            <div class="grid grid-cols-4 gap-0 border border-white/10 bg-white/5 backdrop-blur-sm">
                <div class="p-6 border-r border-white/10">
                    <span class="block text-[9px] text-electricCyan font-bold uppercase tracking-widest mb-2">Reporter</span>
                    <span class="text-lg font-light tracking-wide italic font-serif">Dr. Shodwe Studio</span>
                </div>
                <div class="p-6 border-r border-white/10">
                    <span class="block text-[9px] text-electricCyan font-bold uppercase tracking-widest mb-2">Department</span>
                    <span class="text-lg font-light tracking-wide uppercase">Marine Bio-Acoustics</span>
                </div>
                <div class="p-6 border-r border-white/10">
                    <span class="block text-[9px] text-electricCyan font-bold uppercase tracking-widest mb-2">Timestamp</span>
                    <span class="text-lg font-light tracking-wide">Jan 12, 2026</span>
                </div>
                <div class="p-6">
                    <span class="block text-[9px] text-electricCyan font-bold uppercase tracking-widest mb-2">Classification</span>
                    <span class="text-lg font-light tracking-wide text-electricCyan uppercase">Confidential</span>
                </div>
            </div>
        </footer>

        <!-- Side Decor -->
        <div class="absolute left-10 top-1/2 -translate-y-1/2 vertical-text flex items-center gap-6 opacity-30">
            <span class="text-[9px] font-black uppercase tracking-[0.8em]">System Check: Nominal</span>
            <div class="w-[1px] h-24 bg-white"></div>
        </div>
    </div>
</body>
</html>
