<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salford & Co. - Marine Life</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #FFFFFF; overflow: hidden;
        }
        .title-stroke { -webkit-text-stroke: 2px #0A2342; color: transparent; }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col p-16">
        <!-- 统一 Logo -->
        <div class="flex items-center space-x-3 mb-12 z-20">
            <div class="w-8 h-8 bg-[#0A2342] flex items-center justify-center">
                <i class="fa-solid fa-water text-white text-[12px]"></i>
            </div>
            <span class="text-[#0A2342] text-sm font-bold tracking-[0.4em] uppercase">Salford & Co.</span>
        </div>

        <div class="grid grid-cols-12 gap-12 flex-grow">
            <!-- 左侧：文字信息 -->
            <div class="col-span-5 flex flex-col justify-center">
                <h1 class="text-[#0A2342] text-[110px] font-black leading-[0.85] tracking-tighter uppercase mb-10">
                    MARINE<br><span class="title-stroke">LIFE</span>
                </h1>
                
                <div class="space-y-8">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-[2px] bg-[#0A2342]"></div>
                        <span class="text-[#0A2342] font-bold tracking-widest text-xs uppercase">Creatures of Diversity</span>
                    </div>
                    <p class="text-gray-500 text-base leading-relaxed text-justify font-light pr-10">
                        Beneath the waves, countless species create ecosystems of harmony. Fish, mollusks, mammals, and plants coexist in balanced cycles, depending on each other for survival.
                    </p>
                    <div class="pt-4 italic text-[#6A8FAF] border-l-2 border-[#B0C4DE] pl-6 font-serif text-lg">
                        "Nature’s greatest artistry lies beneath the surface."
                    </div>
                </div>
            </div>

            <!-- 右侧：图像展示 -->
            <div class="col-span-7 relative">
                <!-- 主图叠层效果 -->
                <div class="absolute top-0 right-0 w-[90%] h-[85%] rounded-2xl overflow-hidden shadow-[40px_40px_80px_-20px_rgba(10,35,66,0.3)] z-10">
                    <img src="https://images.unsplash.com/photo-1568430462989-44163eb1752f?q=80&w=1200&auto=format&fit=crop" 
                         class="w-full h-full object-cover">
                </div>
                <!-- 装饰背景 -->
                <div class="absolute -bottom-4 left-0 w-64 h-64 bg-[#F8FAFC] -z-0 rounded-full"></div>
                <div class="absolute top-20 -right-10 w-40 h-80 border-r border-t border-gray-100 -z-0"></div>
            </div>
        </div>
        
        <!-- 底部装饰 -->
        <div class="mt-auto flex justify-between items-end">
            <div class="w-1/3 h-px bg-gray-100"></div>
            <div class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-[#0A2342] hover:bg-[#0A2342] hover:text-white transition-all cursor-pointer">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>
    </div>
</body>
</html>
