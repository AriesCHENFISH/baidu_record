<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Presentation Slide</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <!-- Google Fonts Mirror (Specified in requirements) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <!-- Tailwind Config for Custom Colors and Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A2342',      // Deep Blue
                        secondary: '#2C3E50',    // Dark Gray/Blue for body
                        divider: '#B0C4DE',      // Light Blue Gray
                        accent: '#6A8FAF',       // Muted Blue
                        bgWhite: '#FFFFFF',      // White
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    spacing: {
                        '128': '32rem',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            /* Box shadow removed per instructions */
        }

        /* Utility for vertically centered text if needed */
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom decorative shape */
        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #E8F1F8, #FFFFFF);
            z-index: 0;
        }
    </style>
</head>
<body>

    <!-- Main Page Container -->
    <div id="page_container">
        
        <!-- Background Decoration (Geometric element for depth) -->
        <div class="decoration-circle" style="width: 600px; height: 600px; top: -100px; left: -150px; opacity: 0.6;"></div>
        
        <!-- Main Layout Grid: 12 Columns -->
        <div class="grid grid-cols-12 h-full w-full relative z-10">

            <!-- Left Content Area (Typographic Focus) - Spans 5 Columns -->
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 relative">
                
                <!-- Decorative Top Line -->
                <div class="w-12 h-1 bg-primary mb-8 rounded-full"></div>

                <!-- Main Title -->
                <!-- Using negative margin/leading to create a tight, poster-like feel -->
                <h1 class="text-primary font-black text-8xl leading-none tracking-tighter mb-6 drop-shadow-sm">
                    UNDER<br>WATER
                </h1>

                <!-- Divider Line -->
                <div class="w-full h-px bg-divider mb-6"></div>

                <!-- Subtitle / Context -->
                <!-- Extracted from image: "EXPLORING THE HIDDEN WORLD BENEATH THE SURFACE" -->
                <h2 class="text-secondary font-medium text-lg tracking-widest leading-relaxed uppercase">
                    Exploring The<br>
                    <span class="text-primary font-bold">Hidden World</span><br>
                    Beneath The Surface
                </h2>

                <!-- Aesthetic Decorative Icon/Arrow -->
                <div class="mt-12 flex items-center gap-4 group">
                    <div class="w-12 h-12 rounded-full border border-divider flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors duration-300">
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                    <span class="text-sm text-accent font-medium tracking-wide">Deep Dive Analysis</span>
                </div>

            </div>

            <!-- Right Visual Area (Image Focus) - Spans 7 Columns -->
            <div class="col-span-7 h-full relative pl-4 py-6 pr-6">
                
                <!-- Image Container with Modern Rounded Styling -->
                <div class="w-full h-full relative overflow-hidden rounded-3xl shadow-2xl">
                    
                    <!-- Gradient Overlay for Text Readability/Atmosphere -->
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0A2342]/60 to-transparent z-10 mix-blend-multiply"></div>
                    
                    <!-- Main Underwater Image -->
                    <!-- Sourced to match the deep blue underwater theme of the original input -->
                    <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=2070&auto=format&fit=crop" 
                         alt="Deep blue ocean underwater scene with sun rays penetrating the surface" 
                         class="w-full h-full object-cover transform scale-105 hover:scale-100 transition-transform duration-700 ease-out">
                    <!-- 720*672 -->

                    <!-- Data Point / Aesthetic Badge overlay on image -->
                    <div class="absolute bottom-10 left-10 z-20">
                        <div class="backdrop-blur-md bg-white/10 border border-white/20 p-6 rounded-xl">
                            <p class="text-white text-xs font-bold tracking-widest mb-1 opacity-80 uppercase">Depth Range</p>
                            <h3 class="text-white text-3xl font-light">0 — 200<span class="text-sm font-normal ml-1">m</span></h3>
                            <div class="w-full bg-white/20 h-0.5 mt-3 rounded-full overflow-hidden">
                                <div class="bg-white w-2/3 h-full"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Decorative Icon overlay top right -->
                    <div class="absolute top-8 right-8 z-20 text-white/80 text-2xl">
                         <i class="fa-solid fa-water"></i>
                    </div>

                </div>
            </div>

        </div>

        <!-- Footer / Page Number -->
        <div class="absolute bottom-6 left-16 z-20">
            <p class="text-divider text-xs font-bold tracking-[0.2em]">01 / INTRO</p>
        </div>

    </div>

</body>
</html>
