<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Zones Keynote</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Standards */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .bg-ocean-gradient {
            background: linear-gradient(135deg, #1F4E79, #2D6496, #3A7CA5);
        }

        /* Smooth text antialiasing */
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>

    <div id="page_container" class="relative w-[1280px] h-[720px] mx-auto overflow-hidden bg-ocean-gradient text-white shadow-none">

        <div class="absolute top-[-200px] left-[-100px] w-[800px] h-[800px] rounded-full bg-[#8DE4E0] opacity-10 blur-[100px] pointer-events-none"></div>
        <div class="absolute bottom-[-100px] right-[-100px] w-[600px] h-[600px] rounded-full bg-[#1A3B5C] opacity-40 blur-[80px] pointer-events-none"></div>

        <header class="relative z-20 flex items-center w-full px-16 pt-12">
            <div class="flex items-center gap-5 group cursor-default">
                <div class="relative w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-[#8DE4E0] to-[#4FB3AF] text-[#1F4E79] shadow-[0_0_25px_rgba(141,228,224,0.4)] border border-white/20 transition-transform duration-500 group-hover:scale-105">
                    <i class="fa-solid fa-water text-2xl drop-shadow-sm"></i>
                </div>
                
                <div class="flex flex-col justify-center">
                    <h6 class="text-2xl font-bold tracking-wide text-white leading-none">
                        Hanover <span class="font-light text-[#8DE4E0] opacity-80">&</span> Tyke
                    </h6>
                    <div class="w-8 h-[3px] bg-[#8DE4E0] mt-2 rounded-full opacity-60 group-hover:w-full transition-all duration-500 ease-out"></div>
                </div>
            </div>
        </header>

        <main class="relative z-10 grid grid-cols-12 gap-12 px-16 mt-10 items-center h-[500px]">
            
            <div class="col-span-5 relative group">
                <div class="absolute inset-0 bg-[#8DE4E0] rounded-3xl transform translate-x-4 translate-y-4 opacity-20"></div>
                <div class="relative w-full h-[420px] rounded-3xl overflow-hidden shadow-[0_25px_50px_-12px_rgba(0,0,0,0.6)] border border-[#5E7C98]/30 bg-[#1A3B5C]">
                    <img src="https://images.unsplash.com/photo-1546026423-cc4642628d2b?q=80&w=1000&auto=format&fit=crop" 
                         alt="Underwater scene" 
                         class="w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-700 ease-out">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1F4E79]/80 to-transparent"></div>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-center pl-8">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-2 h-2 rounded-full bg-[#8DE4E0]"></div>
                    <p class="text-[#8DE4E0] text-sm font-bold tracking-[0.2em] uppercase">Introduction</p>
                </div>

                <h1 class="text-6xl font-bold leading-tight mb-8 text-white drop-shadow-lg">
                    What is the <br>
                    <span class="text-transparent bg-clip-text" style="background-image: linear-gradient(to right, #8DE4E0, #ffffff);">Ocean?</span>
                </h1>

                <div class="relative group bg-gradient-to-br from-[#1A3B5C]/90 via-[#204566]/80 to-[#1A3B5C]/90 backdrop-blur-md p-10 rounded-2xl border-l-[6px] border-l-[#8DE4E0] border-t border-r border-b border-white/10 shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] overflow-hidden transition-all duration-300 hover:-translate-y-1">
                    
                    <div class="absolute top-0 right-6 text-8xl text-white/5 font-serif select-none pointer-events-none transform translate-y-[-10px]">”</div>
                    
                    <ul class="relative z-10 space-y-4">
                        <li class="flex items-start gap-4 group/item">
                            <i class="fa-regular fa-circle-check text-[#8DE4E0] mt-1.5 text-lg group-hover/item:text-white transition-colors"></i>
                            <span class="text-[#D0E1F0] text-lg font-light group-hover/item:text-white transition-colors">Covers more than 70% of the Earth's surface.</span>
                        </li>
                        <li class="flex items-start gap-4 group/item">
                            <i class="fa-regular fa-circle-check text-[#8DE4E0] mt-1.5 text-lg group-hover/item:text-white transition-colors"></i>
                            <span class="text-[#D0E1F0] text-lg font-light group-hover/item:text-white transition-colors">Regulates the global climate and temperature.</span>
                        </li>
                        <li class="flex items-start gap-4 group/item">
                            <i class="fa-regular fa-circle-check text-[#8DE4E0] mt-1.5 text-lg group-hover/item:text-white transition-colors"></i>
                            <span class="text-[#D0E1F0] text-lg font-light group-hover/item:text-white transition-colors">Supports a vast diversity of marine life forms.</span>
                        </li>
                        <li class="flex items-start gap-4 group/item">
                            <i class="fa-regular fa-circle-check text-[#8DE4E0] mt-1.5 text-lg group-hover/item:text-white transition-colors"></i>
                            <span class="text-[#D0E1F0] text-lg font-light group-hover/item:text-white transition-colors">Generates over 50% of the world's oxygen.</span>
                        </li>
                    </ul>

                    <div class="absolute inset-0 bg-gradient-to-r from-[#8DE4E0]/0 via-[#8DE4E0]/5 to-[#8DE4E0]/0 opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
                </div>

                <div class="flex gap-10 mt-8 ml-2">
                    <div class="flex flex-col">
                        <div class="flex items-baseline gap-1">
                            <h4 class="text-3xl font-bold text-white">71</h4>
                            <span class="text-[#8DE4E0] text-xl font-bold">%</span>
                        </div>
                        <p class="text-xs text-[#5E7C98] uppercase tracking-wider mt-1">Surface Area</p>
                    </div>
                    <div class="w-[1px] h-10 bg-white/10"></div>
                    <div class="flex flex-col">
                        <div class="flex items-baseline gap-1">
                            <h4 class="text-3xl font-bold text-white">3.5</h4>
                            <span class="text-[#8DE4E0] text-xl font-bold">km</span>
                        </div>
                        <p class="text-xs text-[#5E7C98] uppercase tracking-wider mt-1">Avg Depth</p>
                    </div>
                </div>
            </div>
        </main>

        <footer class="absolute bottom-0 w-full h-[120px] overflow-hidden z-0 pointer-events-none">
            <div class="absolute -bottom-16 -left-20 w-[600px] h-[200px] bg-[#1A3B5C] rounded-[50%] opacity-90"></div>
            <div class="absolute -bottom-20 left-[400px] w-[800px] h-[250px] bg-[#4A7699] rounded-[50%] opacity-60"></div>
            <div class="absolute -bottom-12 -right-20 w-[700px] h-[200px] bg-[#5E7C98] rounded-[50%] opacity-80"></div>
            <div class="absolute -bottom-24 left-[200px] w-[900px] h-[200px] bg-[#1F4E79] rounded-[50%] mix-blend-overlay"></div>
            
            <div class="absolute bottom-4 left-16 w-3 h-3 rounded-full bg-[#8DE4E0] opacity-60"></div>
            <div class="absolute bottom-8 left-24 w-2 h-2 rounded-full bg-[#FFFFFF] opacity-40"></div>
            <div class="absolute bottom-3 right-32 w-4 h-4 rounded-full bg-[#5E7C98] opacity-80"></div>
        </footer>

    </div>

</body>
</html>
