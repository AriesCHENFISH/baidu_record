<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marine Biodiversity - Keynote Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .glass-panel {
            background: rgba(26, 59, 92, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .wave-shape { position: absolute; bottom: -50px; width: 400px; height: 400px; border-radius: 40%; z-index: 1; }
    </style>
</head>
<body>

    <div id="page_container" class="relative overflow-hidden mx-auto shadow-2xl" style="width: 1280px; height: 720px; background: linear-gradient(160deg, #1F4E79, #2D6496, #0f2638);">
        
        <div class="wave-shape" style="left: -100px; background: #5E7C98; opacity: 0.4; transform: rotate(45deg);"></div>
        <div class="wave-shape" style="left: -50px; bottom: -120px; background: #4A7699; opacity: 0.6; transform: rotate(30deg);"></div>
        <div class="wave-shape" style="right: -100px; background: #5E7C98; opacity: 0.4; transform: rotate(-45deg);"></div>
        <div class="wave-shape" style="right: -50px; bottom: -120px; background: #4A7699; opacity: 0.6; transform: rotate(-30deg);"></div>

        <div class="relative z-10 flex flex-col h-full px-16 pt-12 pb-10">

            <header class="flex items-center w-full mb-6">
                <div class="flex items-center gap-5 group cursor-default">
                    <div class="relative w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-[#8DE4E0] to-[#4FB3AF] text-[#1F4E79] shadow-[0_0_25px_rgba(141,228,224,0.4)] border border-white/20 transition-transform duration-500 group-hover:scale-105">
                        <i class="fa-solid fa-water text-2xl drop-shadow-sm"></i>
                    </div>
                    
                    <div class="flex flex-col justify-center">
                        <h6 class="text-2xl font-bold tracking-wide text-white leading-none">
                            Hanover <span class="font-light text-[#8DE4E0] opacity-80">&</span> Tyke
                        </h6>
                        <div class="w-8 h-[3px] bg-[#8DE4E0] mt-2 rounded-full opacity-60 group-hover:w-full transition-all duration-500 ease-out"></div>
                    </div>
                </div>
                
                </header>

            <div class="w-full text-center mb-10">
                <h1 class="text-white text-6xl font-bold tracking-tight drop-shadow-md">
                    Marine Biodiversity
                </h1>
            </div>

            <div class="grid grid-cols-4 gap-6 w-full flex-grow pb-8">
                
                <div class="glass-panel rounded-3xl p-3 flex flex-col h-full transition-transform">
                    <div class="w-full relative overflow-hidden rounded-2xl flex-grow" style="height: 60%;">
                        <img src="https://images.unsplash.com/photo-1546026423-cc4642628d2b?q=80&w=600&auto=format&fit=crop" alt="Coral Reefs" class="w-full h-full object-cover">
                    </div>
                    <div class="mt-4 px-2 flex items-end gap-3 pb-2">
                        <span class="text-5xl font-bold text-[#8DE4E0] opacity-80 leading-none">01.</span>
                        <div class="flex flex-col pb-1">
                            <h3 class="text-white text-lg font-bold leading-tight">Coral reefs</h3>
                            <p class="text-[#D0E1F0] text-xs font-light mt-1">Diverse underwater ecosystems</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-3xl p-3 flex flex-col h-full transition-transform">
                    <div class="w-full relative overflow-hidden rounded-2xl flex-grow" style="height: 60%;">
                        <img src="https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=600&auto=format&fit=crop" alt="Jellyfish" class="w-full h-full object-cover">
                    </div>
                    <div class="mt-4 px-2 flex items-end gap-3 pb-2">
                        <span class="text-5xl font-bold text-[#7BC0D6] opacity-80 leading-none">02.</span>
                        <div class="flex flex-col pb-1">
                            <h3 class="text-white text-lg font-bold leading-tight">Invertebrates</h3>
                            <p class="text-[#D0E1F0] text-xs font-light mt-1">Spineless marine life forms</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-3xl p-3 flex flex-col h-full transition-transform">
                    <div class="w-full relative overflow-hidden rounded-2xl flex-grow" style="height: 60%;">
                        <img src="https://images.unsplash.com/photo-1524704654690-b56c05c78a00?q=80&w=600&auto=format&fit=crop" alt="Fish" class="w-full h-full object-cover">
                    </div>
                    <div class="mt-4 px-2 flex items-end gap-3 pb-2">
                        <span class="text-5xl font-bold text-[#4A7699] opacity-80 leading-none">03.</span>
                        <div class="flex flex-col pb-1">
                            <h3 class="text-white text-lg font-bold leading-tight">Fish</h3>
                            <p class="text-[#D0E1F0] text-xs font-light mt-1">Aquatic gill-bearing animals</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-3xl p-3 flex flex-col h-full transition-transform">
                    <div class="w-full relative overflow-hidden rounded-2xl flex-grow" style="height: 60%;">
                        <img src="https://images.unsplash.com/photo-1570481662006-a3a1374699e8?q=80&w=600&auto=format&fit=crop" alt="Mammals" class="w-full h-full object-cover">
                    </div>
                    <div class="mt-4 px-2 flex items-end gap-3 pb-2">
                        <span class="text-5xl font-bold text-[#5E7C98] opacity-80 leading-none">04.</span>
                        <div class="flex flex-col pb-1">
                            <h3 class="text-white text-lg font-bold leading-tight">Mammals</h3>
                            <p class="text-[#D0E1F0] text-xs font-light mt-1">Warm-blooded vertebrates</p>
                        </div>
                    </div>
                </div>

            </div>
            
            <div class="w-full flex justify-center pb-2 opacity-50">
                 <div class="w-1 h-1 rounded-full bg-white mx-1"></div>
                 <div class="w-1 h-1 rounded-full bg-white mx-1 opacity-50"></div>
                 <div class="w-1 h-1 rounded-full bg-white mx-1 opacity-50"></div>
            </div>

        </div>
    </div>

</body>
</html>
