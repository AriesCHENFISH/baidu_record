<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Conservation Efforts</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #1F4E79, #2D6496, #3A7CA5);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .glass-card {
            background: rgba(26, 59, 92, 0.65);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Organic Shape for decoration */
        .organic-blob {
            position: absolute; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            background: linear-gradient(to right, #8DE4E0, #3A7CA5);
            opacity: 0.1; filter: blur(60px); animation: morph 10s ease-in-out infinite;
        }
        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="organic-blob w-[600px] h-[600px] top-[-200px] right-[-100px]"></div>
        <div class="organic-blob w-[500px] h-[500px] bottom-[-100px] left-[-100px] opacity-20"></div>

        <header class="relative z-20 flex items-center px-16 pt-12">
            <div class="flex items-center gap-5 group cursor-default">
                <div class="relative w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-[#8DE4E0] to-[#4FB3AF] text-[#1F4E79] shadow-[0_0_25px_rgba(141,228,224,0.4)] border border-white/20 transition-transform duration-500 group-hover:scale-105">
                    <i class="fa-solid fa-water text-2xl drop-shadow-sm"></i>
                </div>
                <div class="flex flex-col justify-center">
                    <h6 class="text-2xl font-bold tracking-wide text-white leading-none">
                        Hanover <span class="font-light text-[#8DE4E0] opacity-80">&</span> Tyke
                    </h6>
                    <div class="w-8 h-[3px] bg-[#8DE4E0] mt-2 rounded-full opacity-60 group-hover:w-full transition-all duration-500 ease-out"></div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-12 h-full px-16 items-center relative z-10 -mt-10">
            
            <div class="col-span-5 flex justify-center items-center pl-4">
                <div class="relative w-full aspect-[4/5] group">
                    <div class="absolute inset-0 border-2 border-[#8DE4E0] rounded-2xl transform translate-x-4 translate-y-4 opacity-30 transition-transform duration-500 group-hover:translate-x-2 group-hover:translate-y-2"></div>
                    <div class="relative w-full h-full rounded-2xl overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1559136555-9303baea8ebd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                             alt="Conservation" 
                             class="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#1F4E79] via-transparent to-transparent opacity-60"></div>
                        
                        <div class="absolute bottom-6 left-6 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-lg">
                            <span class="text-[#8DE4E0] text-xs font-bold uppercase tracking-widest">Action Required</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-center pl-8">
                <h1 class="text-7xl font-bold text-white leading-none mb-6 drop-shadow-lg">
                    Ocean <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#8DE4E0] to-white">Conservation</span> <br>
                    Efforts
                </h1>

                <div class="glass-card p-8 rounded-2xl border-l-[6px] border-l-[#8DE4E0]">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="p-2 bg-[#8DE4E0]/20 rounded-lg text-[#8DE4E0]">
                            <i class="fa-solid fa-earth-americas text-xl"></i>
                        </div>
                        <h2 class="text-white text-xl font-bold">Sustainable Future</h2>
                    </div>
                    <p class="text-[#D0E1F0] text-lg leading-relaxed font-light text-justify">
                        Marine conservation is the protection and preservation of ecosystems in oceans and seas through planned management in order to prevent the over-exploitation of these marine resources.
                    </p>
                </div>

                <div class="mt-8 flex gap-10 opacity-80">
                    <div>
                        <span class="block text-3xl font-bold text-white">30%</span>
                        <span class="text-xs text-[#8DE4E0] uppercase tracking-wider">Protected by 2030</span>
                    </div>
                    <div class="w-[1px] h-10 bg-white/20"></div>
                    <div>
                        <span class="block text-3xl font-bold text-white">14</span>
                        <span class="text-xs text-[#8DE4E0] uppercase tracking-wider">SDG Goal</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
