        .wave-back { position: absolute; bottom: 0; left: -10%; width: 120%; height: 100px; background: #4A7699; border-radius: 50% 50% 0 0; opacity: 0.6; }
        .wave-front { position: absolute; bottom: -20px; right: -10%; width: 120%; height: 90px; background: #5E7C98; border-radius: 50% 50% 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
