<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ocean - Keynote Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden;
            /* Radial Gradient for depth focus */
            background: radial-gradient(circle at 50% 30%, #2D6496 0%, #1F4E79 50%, #0f2638 100%);
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* God Rays / Light Shafts */
        .light-shaft {
            position: absolute; top: -20%; left: 50%;
            width: 150px; height: 80%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 0%, transparent 100%);
            filter: blur(20px);
            transform-origin: top center;
            pointer-events: none; z-index: 1;
        }

        /* Typography Styles */
        .title-gradient {
            background: linear-gradient(to bottom, #FFFFFF 30%, #8DE4E0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .reflection-text {
            transform: scaleY(-1);
            opacity: 0.3;
            -webkit-mask-image: linear-gradient(to top, transparent 40%, rgba(0,0,0,0.8) 100%);
            mask-image: linear-gradient(to top, transparent 40%, rgba(0,0,0,0.8) 100%);
            filter: blur(4px);
        }

        /* Floating Particles (Bubbles) */
        .bubble {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(141, 228, 224, 0.2);
        }
        
        /* Presenter Card Glow */
        .presenter-glow:hover {
            box-shadow: 0 0 20px rgba(141, 228, 224, 0.3);
            border-color: rgba(141, 228, 224, 0.4);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="light-shaft -translate-x-[200px] rotate-[15deg] opacity-60"></div>
        <div class="light-shaft translate-x-0 rotate-[0deg] opacity-40 width-[200px]"></div>
        <div class="light-shaft translate-x-[200px] -rotate-[15deg] opacity-60"></div>

        <div class="bubble w-4 h-4 top-1/4 left-1/4 opacity-40"></div>
        <div class="bubble w-2 h-2 top-1/3 left-1/5 opacity-60"></div>
        <div class="bubble w-6 h-6 bottom-1/3 right-1/4 opacity-20"></div>
        <div class="bubble w-3 h-3 bottom-1/4 right-1/3 opacity-30"></div>
        <div class="bubble w-1 h-1 top-1/2 left-1/2 opacity-80"></div>

        <header class="relative z-50 flex items-center px-16 pt-12">
            <div class="flex items-center gap-5 group cursor-default">
                <div class="relative w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-[#8DE4E0] to-[#4FB3AF] text-[#1F4E79] shadow-[0_0_25px_rgba(141,228,224,0.4)] border border-white/20 transition-transform duration-500 group-hover:scale-105">
                    <i class="fa-solid fa-water text-2xl drop-shadow-sm"></i>
                </div>
                <div class="flex flex-col justify-center">
                    <h6 class="text-2xl font-bold tracking-wide text-white leading-none">
                        Hanover <span class="font-light text-[#8DE4E0] opacity-80">&</span> Tyke
                    </h6>
                    <div class="w-8 h-[3px] bg-[#8DE4E0] mt-2 rounded-full opacity-60 group-hover:w-full transition-all duration-500 ease-out"></div>
                </div>
            </div>
        </header>

        <div class="absolute inset-0 z-10 flex flex-col justify-center items-center">
            
            <div class="relative text-center mt-10">
                
                <h1 class="text-[180px] leading-[0.8] font-bold tracking-tighter uppercase title-gradient relative z-20">
                    The Ocean
                </h1>
                
                <div class="absolute top-[85%] left-0 w-full reflection-text pointer-events-none select-none z-10">
                    <h1 class="text-[180px] leading-[0.8] font-bold tracking-tighter uppercase text-white/50">
                        The Ocean
                    </h1>
                </div>

                <div class="relative z-30 mt-16 inline-flex items-center gap-3 px-6 py-2 rounded-full border border-[#8DE4E0]/30 bg-[#1A3B5C]/40 backdrop-blur-md shadow-lg">
                    <div class="w-2 h-2 rounded-full bg-[#8DE4E0] animate-pulse"></div>
                    <span class="text-[#D0E1F0] text-lg font-light tracking-[0.2em] uppercase">Life Beneath the Surface</span>
                    <div class="w-2 h-2 rounded-full bg-[#8DE4E0] animate-pulse"></div>
                </div>
            </div>

        </div>

        <div class="absolute bottom-12 right-16 z-40 group cursor-default">
            <div class="presenter-glow flex items-center gap-4 bg-[#1A3B5C]/30 backdrop-blur-md border border-white/10 rounded-full pl-2 pr-6 py-2 transition-all duration-300">
                
                <div class="w-12 h-12 rounded-full border-2 border-[#8DE4E0] overflow-hidden shadow-lg relative">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" 
                         alt="Presenter Avatar" 
                         class="w-full h-full object-cover">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-[#1A3B5C] rounded-full"></div>
                </div>

                <div class="flex flex-col text-left">
                    <span class="text-[#8DE4E0] text-[10px] font-bold uppercase tracking-widest leading-tight">Presented By</span>
                    <span class="text-white text-base font-bold leading-tight">Sarah Jenkins</span>
                    <span class="text-[#D0E1F0]/70 text-xs font-light">Lead Oceanographer</span>
                </div>
                
            </div>
        </div>

        <div class="absolute bottom-[-100px] left-[-100px] w-[600px] h-[400px] bg-[#8DE4E0] rounded-full blur-[100px] opacity-10 z-0"></div>
        <div class="absolute bottom-[-100px] right-[-100px] w-[500px] h-[500px] bg-[#5E7C98] rounded-full blur-[80px] opacity-20 z-0 mix-blend-color-dodge"></div>
        
        <div class="absolute bottom-0 w-full h-[150px] z-0 opacity-40 pointer-events-none">
             <div class="absolute bottom-[-50px] left-0 w-[120%] h-[200px] bg-[#1F4E79] rounded-[50%] blur-[40px] opacity-60"></div>
        </div>

    </div>

</body>
</html>
