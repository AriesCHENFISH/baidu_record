<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Audience - Keynote Slide</title>
    
    <!-- Fonts: Noto Sans SC (Google Fonts via Mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- Tailwind Config for Custom Colors/Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D94530',   // 烈焰红
                        bgBone: '#F2F2F0',    // 柔和骨白
                        deepBase: '#3E1515',  // 幽暗红褐
                        vibrant: '#FF6B52',   // 珊瑚橘
                        highlight: '#B8B8D1', // 迷幻淡紫
                        charcoal: '#1A1A1A',  // 炭黑
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Hide scrollbars */
        body::-webkit-scrollbar {
            display: none;
        }

        /* Utility for line clamping if needed */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Main Page Container -->
    <!-- Dimensions: 1280x720 Fixed -->
    <div class="page-container relative mx-auto overflow-hidden bg-bgBone font-sans text-charcoal shadow-none" 
         style="width: 1280px; height: 720px;">
        
        <!-- Decorative Background Elements -->
        <!-- Subtle geometric accent to add depth without clutter -->
        <div class="absolute top-[-100px] left-[-100px] w-[500px] h-[500px] rounded-full opacity-20"
             style="background: radial-gradient(circle, #B8B8D1 0%, transparent 70%);"></div>

        <!-- Main Grid Layout -->
        <div class="relative z-10 grid h-full grid-cols-12 gap-0">
            
            <!-- Left Column: Content (7 cols) -->
            <div class="col-span-7 flex flex-col justify-between pl-20 pr-12 py-16">
                
                <!-- Header Section -->
                <div class="mb-8">
                    <h1 class="text-[100px] leading-[0.85] font-black tracking-tighter text-primary uppercase drop-shadow-sm">
                        Target<br>Audience
                    </h1>
                    <!-- Decorative separator -->
                    <div class="w-24 h-2 bg-vibrant mt-8 rounded-full"></div>
                </div>

                <!-- Data List / Table Section -->
                <div class="flex flex-col w-full">
                    
                    <!-- Row 1: AGE -->
                    <div class="group flex items-baseline border-b border-charcoal/20 py-6 transition-colors duration-300">
                        <div class="w-32 shrink-0">
                            <h2 class="text-sm font-bold text-charcoal/50 uppercase tracking-widest">Age:</h2>
                        </div>
                        <div class="flex-1">
                            <p class="text-xl font-bold uppercase leading-tight text-charcoal">
                                From young entrepreneurs to more seasoned professionals
                            </p>
                        </div>
                    </div>

                    <!-- Row 2: CLIENTS -->
                    <div class="group flex items-baseline border-b border-charcoal/20 py-6 transition-colors duration-300">
                        <div class="w-32 shrink-0">
                            <h2 class="text-sm font-bold text-charcoal/50 uppercase tracking-widest">Clients:</h2>
                        </div>
                        <div class="flex-1">
                            <p class="text-xl font-bold uppercase leading-tight text-charcoal">
                                Small to medium-sized businesses, marketing agencies, entrepreneurs
                            </p>
                        </div>
                    </div>

                    <!-- Row 3: LOCATION -->
                    <div class="group flex items-baseline border-b border-charcoal/20 py-6 transition-colors duration-300">
                        <div class="w-32 shrink-0">
                            <h2 class="text-sm font-bold text-charcoal/50 uppercase tracking-widest">Location:</h2>
                        </div>
                        <div class="flex-1">
                            <p class="text-xl font-bold uppercase leading-tight text-charcoal">
                                Urban areas, global, remote or virtual
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Footer / Numbering Section -->
                <div class="flex items-end justify-between mt-8">
                    <div class="flex items-baseline gap-4">
                        <!-- Big Number -->
                        <span class="text-[80px] font-black text-primary leading-none tracking-tighter opacity-90">(2)</span>
                        
                        <!-- Sub-caption -->
                        <div class="mb-4 pl-4 border-l-2 border-vibrant">
                            <p class="text-sm font-bold text-charcoal uppercase tracking-widest max-w-[150px] leading-relaxed">
                                Who is this<br>intended for?
                            </p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Visual (5 cols) -->
            <div class="col-span-5 h-full relative">
                <!-- Image Container with Masking -->
                <!-- We use a slightly narrower image container to create whitespace on the right if needed, or fill it. 
                     Here we fill the column but use object-position to perfect the framing. -->
                <div class="absolute inset-0 h-full w-full bg-charcoal overflow-hidden">
                    <!-- Unsplash Image: Minimalist Dark Vase with Branch -->
                    <img src="https://images.unsplash.com/photo-1616627561950-9f84a1e626e5?q=80&w=1287&auto=format&fit=crop" 
                         alt="Minimalist black vase with dry branch aesthetics" 
                         class="h-full w-full object-cover opacity-90 mix-blend-normal hover:scale-105 transition-transform duration-1000 ease-out">
                    <!-- 533*720 -->
                    
                    <!-- Gradient Overlay for Text Readability/Atmosphere at bottom -->
                    <div class="absolute bottom-0 left-0 w-full h-1/3" 
                         style="background: linear-gradient(to top, #3E1515 0%, transparent 100%); opacity: 0.4;">
                    </div>
                </div>

                <!-- Decorative Side Element (Floating Badge) -->
                <!-- Adds a touch of modern UI design -->
                <div class="absolute top-12 right-12 w-12 h-12 rounded-full border border-bgBone/30 flex items-center justify-center backdrop-blur-sm">
                    <i class="fa-solid fa-arrow-right text-bgBone/80 transform -rotate-45"></i>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
