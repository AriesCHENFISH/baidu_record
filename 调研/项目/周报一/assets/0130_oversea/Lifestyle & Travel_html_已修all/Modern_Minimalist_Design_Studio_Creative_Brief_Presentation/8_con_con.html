<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deliverables Presentation Slide</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts via Baidu CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D94530',      // 烈焰红
                        bgCream: '#F2F2F0',      // 柔和骨白
                        bgDeep: '#3E1515',       // 幽暗红褐
                        accentOrange: '#FF6B52', // 珊瑚橘
                        highlight: '#B8B8D1',    // 迷幻淡紫
                        textDark: '#1A1A1A',     // 炭黑
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Specific Page Container Rules */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F2F2F0; /* bgCream */
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Typography Enhancements */
        h1, h2, h3, h4, h5, h6 {
            line-height: 1.1;
        }
        
        p {
            line-height: 1.6;
        }

        /* Custom Scrollbar hide just in case */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="page_container flex">
        
        <!-- Left Content Section (60%) -->
        <div class="w-[60%] h-full flex flex-col justify-between p-16 relative z-10">
            
            <!-- Header Section -->
            <div class="mt-4">
                <!-- Decorative small element -->
                <div class="w-12 h-1 bg-primary mb-6 rounded-full"></div>
                <!-- Main Title -->
                <h1 class="text-[6rem] font-black text-primary tracking-tighter uppercase leading-none drop-shadow-sm">
                    Deliverables
                </h1>
            </div>

            <!-- Content List Section (Grid Layout) -->
            <div class="flex flex-col gap-10 mt-8">
                
                <!-- Item 1: Content -->
                <div class="group border-l-4 border-highlight hover:border-accentOrange pl-6 transition-all duration-300">
                    <h3 class="text-sm font-bold tracking-[0.2em] text-accentOrange uppercase mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-xs"></i> Content
                    </h3>
                    <p class="text-xl font-medium text-textDark leading-snug">
                        Social media posts, video ads, influencer collaborations, email campaigns, print collateral.
                    </p>
                </div>

                <!-- Item 2: Formats -->
                <div class="group border-l-4 border-highlight hover:border-accentOrange pl-6 transition-all duration-300">
                    <h3 class="text-sm font-bold tracking-[0.2em] text-accentOrange uppercase mb-2 flex items-center gap-2">
                        <i class="fa-solid fa-photo-film text-xs"></i> Formats
                    </h3>
                    <p class="text-xl font-medium text-textDark leading-snug">
                        Short-form videos, high-resolution photos, user-generated content, carousel posts.
                    </p>
                </div>

            </div>

            <!-- Footer Section -->
            <div class="flex items-end justify-between mt-auto pt-10 border-t border-gray-300 w-full">
                <!-- Large Number -->
                <div class="flex items-baseline gap-4">
                    <h2 class="text-8xl font-black text-primary opacity-90">(4)</h2>
                    <div class="flex flex-col justify-end pb-4">
                        <p class="text-xs font-bold text-textDark tracking-[0.15em] uppercase">Project Phase</p>
                        <p class="text-sm text-gray-500 italic">Execution & Output</p>
                    </div>
                </div>

                <!-- Tagline -->
                <div class="pb-4 text-right">
                    <p class="text-base font-bold text-textDark uppercase tracking-wide">
                        Creators have tasks to tackle <i class="fa-solid fa-arrow-right text-primary ml-2"></i>
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Visual Section (40%) -->
        <div class="w-[40%] h-full relative overflow-hidden bg-bgDeep">
            
            <!-- Abstract background shape for transition -->
            <div class="absolute left-[-50px] top-0 bottom-0 w-[100px] bg-bgCream z-20" 
                 style="clip-path: polygon(0 0, 100% 0, 50% 100%, 0 100%); opacity: 0.1;"></div>
            
            <!-- Main Image: Cactus/Red Abstract to match style -->
            <!-- Using a high-quality Unsplash image that features the red/green contrast mentioned in the prompt -->
            <img src="https://images.unsplash.com/photo-1545239351-ef35f43d514b?q=80&w=1287&auto=format&fit=crop" 
                 alt="Abstract Cactus Texture with Red Accents" 
                 class="w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-1000 ease-in-out">
            <!-- 512*720 -->

            <!-- Gradient Overlay for aesthetics -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-[#3E1515] opacity-60 mix-blend-multiply"></div>
            
            <!-- Decorative Accent Lines -->
            <div class="absolute top-10 right-10 w-20 h-20 border-r-2 border-t-2 border-highlight opacity-50 rounded-tr-3xl"></div>
            <div class="absolute bottom-10 right-10 flex flex-col gap-2">
                <div class="w-2 h-2 rounded-full bg-accentOrange"></div>
                <div class="w-2 h-2 rounded-full bg-primary"></div>
                <div class="w-2 h-2 rounded-full bg-bgCream"></div>
            </div>
        </div>

        <!-- Background Watermark/Decoration on the left -->
        <div class="absolute top-[-5%] left-[40%] text-[20rem] font-bold text-gray-200 opacity-20 pointer-events-none select-none z-0 rotate-12" style="font-family: 'Inter', sans-serif;">
            06
        </div>

    </div>

</body>
</html>
