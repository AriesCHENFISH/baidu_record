<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Creative Keynote</title>
    
    <!-- Google Fonts: Noto Sans SC (Domestic CDN) & Inter for numbers/English -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <!-- Tailwind Configuration for Custom Palette -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D94530',      /* 烈焰红 */
                        bgBone: '#F2F2F0',       /* 柔和骨白 */
                        deepBase: '#3E1515',     /* 幽暗红褐 */
                        coral: '#FF6B52',        /* 珊瑚橘 */
                        lavender: '#B8B8D1',     /* 迷幻淡紫 */
                        charcoal: '#1A1A1A',     /* 炭黑 */
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 20px 40px -10px rgba(62, 21, 21, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Definition */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #F2F2F0; /* Background White/Cream */
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        /* Utility for geometric decoration */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- Background Decoration: Soft Gradient Blurs -->
        <!-- Lavender Highlight -->
        <div class="deco-circle w-96 h-96 bg-lavender opacity-40 -top-20 -left-20"></div>
        <!-- Coral Highlight -->
        <div class="deco-circle w-80 h-80 bg-coral opacity-20 bottom-0 right-1/3"></div>

        <!-- Main Grid Layout: 12 Columns -->
        <div class="grid grid-cols-12 h-full relative z-10">
            
            <!-- Left Column: Typography & Content (Span 8) -->
            <div class="col-span-8 flex flex-col justify-between p-16 pr-10">
                
                <!-- Header Section -->
                <div class="flex flex-col gap-4">
                    <!-- Title -->
                    <h1 class="text-9xl font-black text-primary tracking-tighter leading-none" style="font-size: 8rem;">
                        CONTACT<br>US
                    </h1>
                    <!-- Decorative Line -->
                    <div class="w-24 h-2 bg-deepBase mt-4 mb-2"></div>
                </div>

                <!-- Contact Grid Section (Replacing list lines with cards) -->
                <div class="grid grid-cols-2 gap-x-12 gap-y-10 mt-8">
                    
                    <!-- Item 1: Phone -->
                    <div class="group">
                        <div class="flex items-center gap-3 mb-2 text-coral">
                            <i class="fa-solid fa-phone text-sm"></i>
                            <h3 class="text-xs font-bold tracking-widest uppercase">Phone</h3>
                        </div>
                        <div class="border-b-2 border-primary pb-2 group-hover:pl-2 transition-all duration-300">
                            <p class="text-2xl font-bold text-deepBase">+123-456-7890</p>
                        </div>
                    </div>

                    <!-- Item 2: Email -->
                    <div class="group">
                        <div class="flex items-center gap-3 mb-2 text-coral">
                            <i class="fa-solid fa-envelope text-sm"></i>
                            <h3 class="text-xs font-bold tracking-widest uppercase">E-mail</h3>
                        </div>
                        <div class="border-b-2 border-primary pb-2 group-hover:pl-2 transition-all duration-300">
                            <p class="text-xl font-bold text-deepBase break-words">HELLO@REALLYGREATSITE.COM</p>
                        </div>
                    </div>

                    <!-- Item 3: Website -->
                    <div class="group">
                        <div class="flex items-center gap-3 mb-2 text-coral">
                            <i class="fa-solid fa-globe text-sm"></i>
                            <h3 class="text-xs font-bold tracking-widest uppercase">Website</h3>
                        </div>
                        <div class="border-b-2 border-primary pb-2 group-hover:pl-2 transition-all duration-300">
                            <p class="text-xl font-bold text-deepBase">WWW.REALLYGREATSITE.COM</p>
                        </div>
                    </div>

                    <!-- Item 4: Social Media -->
                    <div class="group">
                        <div class="flex items-center gap-3 mb-2 text-coral">
                            <i class="fa-solid fa-share-nodes text-sm"></i>
                            <h3 class="text-xs font-bold tracking-widest uppercase">Social Media</h3>
                        </div>
                        <div class="border-b-2 border-primary pb-2 group-hover:pl-2 transition-all duration-300">
                            <p class="text-2xl font-bold text-deepBase">@REALLYGREAISTE</p>
                        </div>
                    </div>

                </div>

                <!-- Footer Section -->
                <div class="flex items-end justify-between mt-auto pt-8">
                    <!-- Huge Number -->
                    <h2 class="text-8xl font-black text-primary opacity-20 leading-none -ml-2">(9)</h2>
                    <!-- Subtext -->
                    <p class="text-deepBase font-medium tracking-widest text-sm uppercase mb-4">
                        The way to reach us
                    </p>
                </div>
            </div>

            <!-- Right Column: Visual Anchor (Span 4) -->
            <div class="col-span-4 relative h-full">
                <!-- Image Container with Overlay -->
                <div class="absolute inset-0 bg-deepBase overflow-hidden">
                    <!-- Architectural/Abstract Image for "Structure" -->
                    <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=800&auto=format&fit=crop" 
                         alt="Office Abstract" 
                         class="w-full h-full object-cover opacity-60 mix-blend-luminosity">
                    <!-- 426*720 -->
                    
                    <!-- Color Gradient Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#3E1515] to-[#3E1515] opacity-80"></div>
                </div>

                <!-- Right Side Content Overlay -->
                <div class="relative z-10 h-full flex flex-col justify-center items-center p-8 text-bgBone">
                    <!-- Decorative Icon -->
                    <div class="w-16 h-16 border border-coral rounded-full flex items-center justify-center mb-8 text-coral">
                        <i class="fa-regular fa-paper-plane text-2xl"></i>
                    </div>
                    
                    <!-- Quote/filler visual to balance text -->
                    <div class="w-px h-32 bg-coral mb-4"></div>
                    <p class="text-coral text-xs tracking-[0.3em] uppercase rotate-90 whitespace-nowrap origin-center">
                        Let's Connect
                    </p>
                    <div class="w-px h-32 bg-coral mt-4"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
