<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Design Keynote</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts: Inter (using the specified domestic mirror) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Page Container - Strict Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F2F2F0; /* Soft Bone White Background */
            overflow: hidden;
        }

        /* Typography & Utilities */
        .text-primary {
            color: #D94530; /* Flame Red */
        }
        
        .text-dark {
            color: #1A1A1A; /* Charcoal Grey */
        }
        
        .text-accent {
            color: #FF6B52; /* Vibrant Orange */
        }

        /* Custom utility for letter spacing to match luxury aesthetic */
        .tracking-luxury {
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container" class="grid grid-cols-12 h-full">
        
        <!-- Left Section: Content & Typography (5 Columns) -->
        <div class="col-span-5 h-full flex flex-col justify-between p-16 relative z-10">
            
            <!-- Top Decorative Element -->
            <div class="w-full">
                <div class="w-12 h-2 bg-[#D94530] mb-8"></div>
            </div>

            <!-- Main Content Area -->
            <div class="flex flex-col gap-10">
                <!-- Block 1: Design Philosophy -->
                <div>
                    <h1 class="text-[#1A1A1A] text-2xl font-bold leading-tight uppercase tracking-wide mb-2">
                        A clean, modern, minimalist design
                    </h1>
                    <p class="text-[#1A1A1A] text-opacity-70 text-gl font-normal leading-relaxed">
                        Featuring soft color palettes that highlight the natural ingredients.
                    </p>
                </div>

                <!-- Block 2: Imagery Strategy -->
                <div>
                    <h2 class="text-[#1A1A1A] text-xl font-bold leading-tight uppercase tracking-wide mb-2">
                        Utilization of vibrant, empowering imagery
                    </h2>
                    <p class="text-[#1A1A1A] text-opacity-70 text-gl font-normal leading-relaxed">
                        That celebrates diverse beauty across various skin tones, ages, and genders.
                    </p>
                </div>

                <!-- Block 3: Core Values (Highlighted) -->
                <div>
                    <h3 class="text-[#D94530] text-xl font-black leading-tight uppercase tracking-widest border-l-4 border-[#D94530] pl-4">
                        Emphasize luxury, quality, and inclusivity.
                    </h3>
                </div>
            </div>

            <!-- Bottom Section: Numbering -->
            <div class="flex items-end mt-auto">
                <p class="text-[#D94530] text-9xl font-black leading-none opacity-20 transform translate-y-4 -ml-2 select-none">
                    08
                </p>
            </div>
        </div>

        <!-- Right Section: Visuals (7 Columns) -->
        <div class="col-span-7 h-full relative overflow-hidden bg-[#3E1515]">
            
            <!-- Background Image: High Fashion Abstract (Red & Blue tones) -->
            <!-- Using an image that mimics the legs/tights texture but with higher artistic quality -->
            <img src="https://images.unsplash.com/photo-1512140689945-3129994c4893?q=80&w=1280&auto=format&fit=crop" 
                 alt="Abstract Fashion Texture Red and Blue" 
                 class="absolute inset-0 w-full h-full object-cover opacity-90 mix-blend-normal">
            <!-- 746*720 -->

            <!-- Overlay Geometric Decor -->
            <div class="absolute top-0 right-0 w-full h-full bg-gradient-to-bl from-[#3E1515] via-transparent to-transparent opacity-40"></div>

            <!-- Center Overlay Image: The Vase (Floating Object) -->
            <!-- Simulating the collage effect from the original but cleaner -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-80 h-96 bg-white shadow-2xl p-4 rotate-3">
                <div class="w-full h-full relative overflow-hidden bg-[#F2F2F0]">
                     <img src="https://images.unsplash.com/photo-1581594970428-1153f3630f40?q=80&w=600&auto=format&fit=crop" 
                          alt="Minimalist Glass Vase" 
                          class="w-full h-full object-cover mix-blend-multiply">
                     <!-- 300*360 -->
                </div>
                
                <!-- Decorative caption for the image -->
                <div class="absolute -bottom-8 left-0">
                    <p class="text-white text-xs tracking-widest uppercase font-light opacity-80">
                        <i class="fa-solid fa-shapes mr-1"></i> Figure 05.1
                    </p>
                </div>
            </div>

            <!-- Floating Accent Icon -->
            <div class="absolute top-10 right-10 text-white opacity-50 text-2xl">
                 <i class="fa-solid fa-quote-right"></i>
            </div>

        </div>
    </div>

</body>
</html>
