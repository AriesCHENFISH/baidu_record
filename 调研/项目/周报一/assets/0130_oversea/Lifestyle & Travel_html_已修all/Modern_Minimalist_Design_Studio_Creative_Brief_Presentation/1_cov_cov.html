<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Creative Brief Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F2F2F0;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .text-primary-red { color: #D94530; }
        .bg-primary-red { background-color: #D94530; }
        .outline-text {
            -webkit-text-stroke: 1.5px #D94530;
            color: transparent;
        }
        
        /* 增加更细腻的过渡效果 */
        .img-mask {
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- 背景辅助装饰线 -->
        <div class="absolute top-0 left-20 w-[1px] h-full bg-black/5"></div>
        <div class="absolute top-40 left-0 w-full h-[1px] bg-black/5"></div>

        <!-- 顶部状态栏风格 -->
        <div class="absolute top-10 left-16 right-16 flex justify-between items-center z-50">
            <div class="flex items-center gap-4">
                <span class="bg-primary-red text-white text-[10px] px-2 py-0.5 font-bold">PROJECT FILE</span>
                <span class="text-black/40 text-[10px] tracking-[0.2em]">NO. 882-SHODWE-2030</span>
            </div>
            <div class="text-black text-xs font-bold tracking-widest uppercase">
                Creative Studio &copy; 2030
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="flex h-full">
            
            <!-- 左侧：标题文字区 -->
            <div class="w-[65%] pl-16 flex flex-col justify-center z-20">
                <!-- 装饰性小红方块 -->
                <div class="flex items-baseline gap-2 mb-2">
                    <div class="w-3 h-3 bg-primary-red"></div>
                    <span class="text-primary-red font-bold text-sm tracking-[0.3em]">NEW PERSPECTIVE</span>
                </div>

                <!-- 主标题：Creative -->
                <div class="relative">
                    <h1 class="text-[180px] font-black text-primary-red leading-[0.8] ultra-tracking uppercase -ml-2 italic">
                        Creative
                    </h1>
                    <!-- 辅标题：Brief 使用轮廓字增加呼吸感 -->
                    <h1 class="text-[180px] font-black outline-text leading-[0.8] ultra-tracking uppercase mt-4 ml-32 italic">
                        Brief
                    </h1>
                </div>

                <!-- 底部信息 -->
                <div class="mt-20 flex gap-20">
                    <div>
                        <p class="text-[10px] text-black/40 font-bold uppercase tracking-[0.2em] mb-3">Agency</p>
                        <p class="text-xl font-black text-black">STUDIO SHODWE</p>
                        <p class="text-sm text-black/60 font-medium">Concept & Creative Direction</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-black/40 font-bold uppercase tracking-[0.2em] mb-3">Timeline</p>
                        <p class="text-xl font-black text-black tracking-tighter italic">JAN 24' - MAR 30'</p>
                    </div>
                </div>
            </div>

            <!-- 右侧：视觉区 -->
            <div class="w-[35%] relative">
                <!-- 图片容器 -->
                <div class="absolute inset-0 img-mask bg-charcoal">
                    <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1000&auto=format&fit=crop" 
                         alt="Texture" 
                         class="w-full h-full object-cover grayscale mix-blend-overlay opacity-80 scale-110">
                </div>
                
                <!-- 悬浮的汇报人名块 -->
                <div class="absolute bottom-16 -left-20 bg-primary-red p-10 text-white shadow-[20px_20px_60px_rgba(217,69,48,0.3)] z-30">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-10 h-[1px] bg-white/50"></div>
                        <span class="text-[10px] tracking-[0.3em] font-medium opacity-80">PRESENTED BY</span>
                    </div>
                    <h2 class="text-3xl font-black leading-none tracking-tighter">
                        FRANCISCO<br>ANDRADE
                    </h2>
                    <div class="mt-6 flex justify-between items-center">
                        <span class="text-[10px] font-bold border border-white/30 px-2 py-1">SENIOR DESIGNER</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </div>
                </div>

                <!-- 右下角页码/装饰 -->
                <div class="absolute bottom-10 right-10 flex flex-col items-end gap-1 opacity-20">
                    <span class="text-4xl font-black text-black leading-none italic">01</span>
                    <div class="w-12 h-1 bg-black"></div>
                </div>
            </div>
        </div>

        <!-- 装饰性漂浮文字（增强层级感） -->
        <div class="absolute top-[60%] right-[38%] rotate-90 origin-right text-[10px] font-bold text-black/20 tracking-[1em] uppercase">
            Ideation & Execution
        </div>

    </div>

</body>
</html>
