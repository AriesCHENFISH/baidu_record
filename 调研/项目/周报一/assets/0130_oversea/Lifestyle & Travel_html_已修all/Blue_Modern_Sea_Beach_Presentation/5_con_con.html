<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Beach Portfolio 2025</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: '#1F2468',
                        teal: '#60BCD1',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #F9FAFB; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .img-fit { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="page_container">
        
        <header class="w-full h-24 px-12 flex items-center justify-between z-20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-midnight rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
                    <span class="text-teal text-xl font-black -rotate-3">B</span>
                </div>
                <div class="flex flex-col">
                    <h2 class="text-2xl font-black tracking-tighter text-midnight leading-none">BORCELLE<span class="text-teal">.</span></h2>
                    <span class="text-[8px] tracking-[0.3em] text-gray-400 font-bold uppercase mt-1">Creative Agency</span>
                </div>
            </div>

            <div class="flex items-center gap-4 bg-white/60 backdrop-blur-sm px-6 py-2.5 rounded-full border border-gray-100 shadow-sm">
                <div class="flex gap-1">
                    <div class="w-1 h-1 rounded-full bg-midnight opacity-20"></div>
                    <div class="w-1 h-1 rounded-full bg-midnight opacity-40"></div>
                    <div class="w-1 h-1 rounded-full bg-teal"></div>
                </div>
                <span class="text-xs font-black tracking-[0.25em] text-midnight uppercase">Portfolio</span>
            </div>

            <div class="flex justify-end">
                <button class="bg-midnight text-white text-[10px] font-bold py-3 px-8 rounded-full shadow-xl hover:scale-105 transition-all uppercase tracking-widest border-b-2 border-teal">
                    Contact Us
                </button>
            </div>
        </header>

        <main class="w-full h-[624px] px-12 pb-10 pt-4">
            <div class="grid grid-cols-12 gap-5 h-full w-full">
                <div class="col-span-6 bg-[#1F2468] rounded-2xl p-12 flex flex-col justify-between shadow-xl relative overflow-hidden">
                    <div class="absolute top-[-50px] right-[-50px] w-60 h-60 bg-white opacity-5 rounded-full"></div>
                    <div class="relative z-10">
                        <h2 class="text-white text-6xl font-bold leading-[1.1] mb-6">Sea Beach <br> Portfolio 2025</h2>
                        <p class="text-white/80 text-lg leading-relaxed font-light pr-8">
                            Experience the serenity of the ocean with our exclusive 2025 portfolio. 
                            Discover the hidden gems of the coastline today.
                        </p>
                    </div>
                    <div class="flex items-start gap-6 mt-4 relative z-10">
                        <div class="w-20 h-14 bg-[#60BCD1]/20 rounded-lg flex items-center justify-center border border-[#60BCD1]/30">
                            <i class="fa-solid fa-water text-[#60BCD1] text-2xl"></i>
                        </div>
                        <div class="flex-1">
                            <span class="text-white font-semibold text-lg tracking-wide block mb-1">100% Safe</span>
                            <p class="text-white/70 text-sm leading-relaxed">
                                Our destinations are verified for safety and environmental sustainability. 
                            </p>
                        </div>
                    </div>
                    <div class="mt-4 relative z-10">
                        <a href="#" class="inline-block bg-[#60BCD1] text-white text-sm font-bold px-10 py-4 rounded-full shadow-lg uppercase tracking-wider">See More</a>
                    </div>
                </div>

                <div class="col-span-3 flex flex-col gap-5 h-full">
                    <div class="flex-1 rounded-xl overflow-hidden shadow-md"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600" class="img-fit"></div>
                    <div class="flex-1 rounded-xl overflow-hidden shadow-md"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=600" class="img-fit"></div>
                    <div class="flex-1 rounded-xl overflow-hidden shadow-md"><img src="https://images.unsplash.com/photo-1500643750170-54e3cb038295?auto=format&fit=crop&w=600" class="img-fit"></div>
                </div>

                <div class="col-span-3 h-full rounded-2xl overflow-hidden shadow-xl relative">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1F2468]/40 to-transparent z-10"></div>
                    <img src="https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=600" class="img-fit">
                    <div class="absolute bottom-6 left-6 z-20">
                        <p class="text-white text-xs font-medium tracking-widest uppercase opacity-90">Surf & Sand</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
