<!DOCTYPE html>

<head>

<body>

        <header class="w-full h-24 px-12 flex items-center justify-between z-50 relative bg-white/10 backdrop-blur-sm">
            <div class="flex items-center gap-3">

                    <span class="text-teal text-xl font-black -rotate-3">B</span>
                </div>
                <div class="flex flex-col">

                Contact Us

        </header>

        <main class="flex-1 relative">
            <div class="absolute inset-0 w-full h-full">

            <div class="absolute inset-0 hero-gradient z-10"></div>

                </p>
                <div class="flex items-center gap-6">

                    </div>
                </div>
            </div>
            
            <div class="absolute bottom-12 right-24 z-20 flex items-center gap-4">
                <span class="text-white text-sm font-black tracking-[0.5em] opacity-40 uppercase">Chapter 01</span>
