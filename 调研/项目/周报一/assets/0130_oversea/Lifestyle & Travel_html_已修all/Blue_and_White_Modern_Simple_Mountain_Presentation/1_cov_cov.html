<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Mountains - Presentation</title>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B700%3B900%26display%3Dswap.css">
    
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2B4C7E',     // 深蓝 (更稳重)
                        secondary: '#7695CE',   // 品牌蓝
                        accent: '#E6EBF5',      // 极浅蓝背景
                        textMain: '#111111',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 装饰性背景块 */
        .bg-shape {
            position: absolute;
            background: linear-gradient(135deg, #F0F4FA 0%, #FFFFFF 100%);
            border-radius: 40px;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex items-center relative pl-24">

        <!-- 背景装饰：左上角灰色块 -->
        <div class="absolute top-0 left-0 w-[60%] h-full bg-[#FAFBFF] -z-10"></div>
        <!-- 背景装饰：右下角深色点缀 -->
        <div class="absolute bottom-[-100px] right-[-100px] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-3xl -z-10"></div>

        <!-- 顶部信息栏：汇报人与时间 -->
        <div class="absolute top-12 left-24 flex items-center gap-6">
            <div class="flex flex-col">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Presenter</span>
                <span class="text-sm font-bold text-primary flex items-center gap-2">
                    <i class="fa-solid fa-user-circle"></i> Murad Nasser
                </span>
            </div>
            <div class="h-8 w-px bg-gray-300"></div>
            <div class="flex flex-col">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Date</span>
                <span class="text-sm font-bold text-textMain">January, 2026</span>
            </div>
        </div>

        <!-- 左侧：主内容 (60%) -->
        <div class="w-[60%] pt-10 relative z-10">
            
            <!-- 小标签 -->
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-secondary/10 rounded-md mb-6">
                <i class="fa-solid fa-globe text-secondary text-xs"></i>
                <span class="text-xs font-bold text-secondary tracking-wider uppercase">Nature Report</span>
            </div>

            <!-- 超大主标题 -->
            <h1 class="text-8xl font-black text-textMain leading-[0.95] tracking-tight mb-8">
                MAJESTIC<br>
                <span class="text-secondary">MOUNTAINS</span>
            </h1>

            <!-- 装饰线条 -->
            <div class="w-24 h-2 bg-primary mb-10"></div>

            <!-- 短句列表 (替代长句) -->
            <div class="space-y-5">
                <div class="flex items-center gap-4 group">
                    <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                        <i class="fa-solid fa-mountain"></i>
                    </div>
                    <span class="text-xl font-medium text-gray-700">Earth's Geological Giants</span>
                </div>
                
                <div class="flex items-center gap-4 group">
                    <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </div>
                    <span class="text-xl font-medium text-gray-700">Key Climate Regulators</span>
                </div>

                <div class="flex items-center gap-4 group">
                    <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                        <i class="fa-solid fa-tree"></i>
                    </div>
                    <span class="text-xl font-medium text-gray-700">Rich Biodiversity Hubs</span>
                </div>
            </div>

        </div>

        <!-- 右侧：较小的配图 (40%) -->
        <div class="w-[40%] h-full relative flex items-center justify-center pr-12">
            
            <!-- 极简背景块 (非点阵) -->
            <div class="absolute w-[320px] h-[400px] bg-secondary rounded-[2rem] translate-x-4 translate-y-4 opacity-20"></div>

            <!-- 图片容器 -->
            <div class="relative w-[320px] h-[420px] rounded-[2rem] overflow-hidden shadow-2xl z-10 border-4 border-white">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1470&auto=format&fit=crop" 
                     alt="Mountain Peak" 
                     class="w-full h-full object-cover">
                
                <!-- 图片上的浮动数据标签 -->
                <div class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur-md p-5 border-t border-gray-100">
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase font-bold">Elevation</p>
                            <p class="text-2xl font-black text-primary">8,848<span class="text-sm text-gray-400 font-normal ml-1">m</span></p>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-dots text-secondary text-xl"></i>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
