<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Technology Innovation - Arowwai Industries</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #050505; color: #ffffff; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }

        /* 霓虹文字效果 */
        .neon-text {
            text-shadow: 0 0 20px rgba(207, 255, 94, 0.4), 0 0 40px rgba(207, 255, 94, 0.1);
        }

        /* 顶部导航玻璃拟态 */
        .glass-nav { background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        
        /* 动画效果 */
        @keyframes slow-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .logo-gear { animation: slow-rotate 12s linear infinite; }
        
        .status-dot { box-shadow: 0 0 8px #CFFF5E; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* 背景纹理：科技网格 */
        .tech-grid {
            background-image: linear-gradient(rgba(207, 255, 94, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(207, 255, 94, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 装饰数字背景 */
        .bg-number {
            position: absolute; font-size: 260px; font-weight: 900; 
            color: rgba(207, 255, 94, 0.02); line-height: 1; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="page_container" class="tech-grid">
        
        <!-- 背景装饰 -->
        <div class="bg-number top-[-20px] left-[-40px]">2026</div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-[#CFFF5E] opacity-[0.03] rounded-full blur-[150px] pointer-events-none"></div>

        <!-- 1. Header Section -->
        <header class="relative z-50 px-16 pt-10">
            <nav class="flex justify-between items-center glass-nav rounded-2xl px-10 py-5">
                <!-- Brand -->
                <div class="flex items-center gap-4 group cursor-pointer">
                    <div class="relative w-10 h-10 flex items-center justify-center">
                        <div class="absolute inset-0 border border-[#CFFF5E]/40 rounded-full scale-110"></div>
                        <div class="text-[#CFFF5E] text-xl relative z-10 logo-gear">
                            <i class="fa-solid fa-compass-drafting"></i>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white text-xl font-black tracking-tighter leading-none italic uppercase">Arowwai<span class="text-[#CFFF5E]">.</span></span>
                        <span class="text-white text-[9px] tracking-[0.4em] uppercase opacity-40 font-bold">Innovation Node</span>
                    </div>
                </div>

                <!-- Explore Interaction -->
                <div class="flex items-center gap-3 group cursor-pointer px-6 py-2 rounded-full hover:bg-white/5 transition-all">
                    <div class="flex gap-1">
                        <div class="w-1.5 h-1.5 bg-[#CFFF5E] rounded-full group-hover:scale-150 transition-all"></div>
                        <div class="w-1.5 h-1.5 bg-[#CFFF5E]/40 rounded-full"></div>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-[0.4em] text-gray-200">Catalog</span>
                    <i class="fa-solid fa-plus text-[9px] text-[#CFFF5E] group-hover:rotate-90 transition-transform"></i>
                </div>

                <!-- Status -->
                <div class="flex items-center gap-10">
                    <div class="flex items-center gap-3">
                        <div class="status-dot w-1.5 h-1.5 bg-[#CFFF5E] rounded-full"></div>
                        <span class="text-[10px] uppercase tracking-widest text-gray-500 font-bold">Status: Online</span>
                    </div>
                    <div class="text-[9px] text-gray-600 font-mono tracking-tighter">VER: 4.0.2_BUILD</div>
                </div>
            </nav>
        </header>

        <!-- 2. Main Title Section -->
        <main class="relative z-10 flex flex-col items-center justify-center h-[420px] text-center">
            <div class="flex items-center gap-4 mb-4">
                <div class="h-[1px] w-12 bg-[#CFFF5E]/40"></div>
                <span class="text-[12px] uppercase tracking-[0.6em] text-[#CFFF5E] font-bold">Arowwai Annual Keynote</span>
                <div class="h-[1px] w-12 bg-[#CFFF5E]/40"></div>
            </div>
            
            <h1 class="text-[110px] leading-[0.85] font-black tracking-tighter text-white neon-text uppercase mb-2">
                GREEN TECH<br/>
                <span class="text-[#CFFF5E] italic">INNOVATION</span>
            </h1>
            
            <div class="mt-8 px-6 py-2 border-y border-white/10">
                <p class="text-[10px] tracking-[0.8em] text-gray-400 uppercase font-medium">Sustainable Industrial Solutions</p>
            </div>
        </main>

        <!-- 3. Bottom Info Section (Nameplate Style) -->
        <footer class="absolute bottom-16 left-16 right-16 flex justify-between items-end border-t border-white/10 pt-8 z-10">
            <!-- Presenter Info -->
            <div class="flex gap-8">
                <div class="flex flex-col gap-1">
                    <span class="text-[9px] text-[#CFFF5E] font-black uppercase tracking-widest opacity-60">Presenter</span>
                    <span class="text-xl font-bold tracking-tight italic uppercase">Albert Schulz</span>
                    <span class="text-[10px] text-gray-500 font-medium tracking-widest uppercase">Dept. of Sustainable Energy</span>
                </div>
                <!-- 装饰线 -->
                <div class="w-[1px] h-12 bg-white/10"></div>
            </div>

            <!-- Global Coordinates / Date -->
            <div class="flex flex-col items-end gap-1">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-[10px] text-gray-500 font-mono">ID: 8849-001</span>
                    <i class="fa-solid fa-location-crosshairs text-[#CFFF5E]/40 text-xs"></i>
                </div>
                <span class="text-[9px] text-[#CFFF5E] font-black uppercase tracking-widest opacity-60">Release Date</span>
                <span class="text-xl font-bold tracking-tight italic uppercase">Jan 09, 2026</span>
            </div>
        </footer>

        <!-- 底部装饰条 -->
        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#CFFF5E]/20 to-transparent"></div>
    </div>

</body>
</html>
