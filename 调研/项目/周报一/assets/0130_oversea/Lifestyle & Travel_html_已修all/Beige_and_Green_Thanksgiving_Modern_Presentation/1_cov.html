<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Thanksgiving - Minimalist Edition</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            background-color: #6B722C;
            position: relative;
            overflow: hidden;
            color: #F2F2F2;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 装饰性大号背景字 */
        .bg-text-stencil {
            position: absolute;
            font-size: 400px;
            font-weight: 900;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(242, 242, 242, 0.05);
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: -0.05em;
            pointer-events: none;
        }

        /* 极细网格线 */
        .hairline {
            background-color: rgba(234, 211, 182, 0.2);
            position: absolute;
        }

        /* 文字间距优化 */
        .tracking-ultra { letter-spacing: 0.5em; }
        
        /* 几何装饰块 */
        .geometric-shield {
            width: 380px;
            height: 380px;
            border: 1px solid rgba(234, 211, 182, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: rgba(234, 211, 182, 0.03);
        }
        .geometric-shield::after {
            content: '';
            width: 70%;
            height: 70%;
            border: 1px solid rgba(234, 211, 182, 0.3);
            border-radius: 50%;
            background-color: rgba(234, 211, 182, 0.05);
            position: absolute;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="bg-text-stencil">GIVE</div>

        <div class="hairline w-[1px] h-full left-16 top-0"></div>
        <div class="hairline w-[1px] h-full right-16 top-0"></div>
        <div class="hairline w-full h-[1px] left-0 top-32"></div>
        <div class="hairline w-full h-[1px] left-0 bottom-32"></div>

        <header class="absolute top-0 left-0 w-full h-32 px-24 flex items-center justify-between z-10">
            <div class="flex items-center gap-4">
                <span class="w-10 h-[2px] bg-[#EAD3B6]"></span>
                <h2 class="text-xl tracking-ultra font-bold uppercase text-[#EAD3B6]">Borcelle</h2>
            </div>
        </header>

        <main class="w-full h-full flex flex-col items-center justify-center z-10 relative pt-16">
            
            <div class="flex flex-col items-center text-center z-20">
                <div class="mb-6 flex flex-col items-center">
                    <span class="inline-block px-4 py-1 border border-[#EAD3B6] text-[#EAD3B6] text-xs tracking-widest mb-6">
                        ANNUAL HERITAGE
                    </span>
                    <h1 class="text-[120px] font-black leading-[0.9] tracking-tighter">
                        Thanksgiving<br>
                        <span class="text-[#EAD3B6] italic font-light">Traditions</span>
                    </h1>
                </div>
                
                <div class="mt-8 flex flex-col items-center">
                    <div class="w-12 h-1 bg-[#5D3A1A] mb-8"></div>
                    <div class="flex gap-12 text-lg font-light opacity-80 uppercase tracking-[0.2em] text-[#EAD3B6]">
                        <p>Gathering</p>
                        <span class="opacity-30">•</span>
                        <p>Gratitude</p>
                        <span class="opacity-30">•</span>
                        <p>Harvest</p>
                    </div>
                </div>
            </div>

            <div class="absolute -top-16 -right-16 z-0">
                <div class="geometric-shield">
                    <div class="absolute text-center bg-[#EAD3B6] px-8 py-10 z-20 rounded-lg shadow-lg">
                        <i class="fa-solid fa-wheat-awn text-4xl text-[#6B722C] mb-4"></i>
                        <p class="text-[#6B722C] text-[10px] tracking-[0.3em] uppercase font-bold">Heritage</p>
                        <div class="my-3 h-[2px] w-full bg-[#6B722C] opacity-30"></div>
                        <p class="text-[36px] font-bold leading-none tracking-tighter text-[#6B722C]">2026</p>
                    </div>
                    
                    <div class="absolute w-full h-[1px] bg-[#EAD3B6] opacity-20 rotate-45"></div>
                    <div class="absolute w-full h-[1px] bg-[#EAD3B6] opacity-20 -rotate-45"></div>
                </div>
            </div>

        </main>

        <footer class="absolute bottom-0 left-0 w-full h-32 px-24 flex items-center justify-between z-10">
            <div class="flex gap-16">
                <div class="flex items-center gap-3 opacity-60">
                    <i class="fa-solid fa-user text-xs"></i>
                    <p class="text-sm tracking-widest font-light uppercase">Presenter: Name Here</p>
                </div>
                <div class="flex items-center gap-3 opacity-60">
                    <i class="fa-regular fa-calendar text-xs"></i>
                    <p class="text-sm tracking-widest font-light uppercase">November 26, 2026</p>
                </div>
            </div>

            <div class="flex items-center gap-8 text-xs tracking-widest opacity-40 uppercase">
                <p>Curated by Creative Dept.</p>
                <span class="w-1 h-1 bg-white rounded-full"></span>
                <p>Page 01</p>
            </div>
        </footer>

    </div>

</body>
</html>
