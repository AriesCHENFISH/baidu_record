<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Conclusions Modern Layout</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6B722C',    // 橄榄绿
                        lightText: '#F2F2F2',  // 米白
                        divider: '#899052',    // 装饰线
                        accent: '#EAD3B6',     // 杏色/卡其
                        deco: '#5D3A1A',       // 深褐
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #6B722C;
            overflow: hidden;
            color: #F2F2F2;
        }
        /* 这种布局精髓在于大面积切圆 */
        .circle-bleed {
            position: absolute;
            left: -150px;
            top: 50%;
            transform: translateY(-50%);
            width: 700px;
            height: 700px;
            border-radius: 50%;
            border: 1px solid rgba(234, 211, 182, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .inner-img {
            width: 600px;
            height: 600px;
            border-radius: 50%;
            overflow: hidden;
            border: 12px solid #EAD3B6;
        }
        /* 悬浮磨砂质感卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div id="page_container" class="font-sans">

        <div class="absolute top-[-50px] right-20 text-[350px] font-bold text-white opacity-5 select-none leading-none z-0">
            05
        </div>

        <div class="circle-bleed z-10">
            <div class="inner-img shadow-2xl">
                <img src="https://images.unsplash.com/photo-1509456592530-5d38e33f3fdd?q=80&w=1000" 
                     alt="Conclusion Visual" 
                     class="w-full h-full object-cover grayscale-[20%] hover:scale-110 transition-transform duration-1000">
            </div>
        </div>

        <div class="absolute left-[450px] top-[180px] w-[700px] z-20 glass-card p-16 rounded-sm">
            
            <div class="flex items-center gap-4 mb-8">
                <div class="h-[2px] w-12 bg-accent"></div>
                <h1 class="text-5xl font-light tracking-widest uppercase">Conclusions</h1>
            </div>

            <div class="space-y-10">
                <div class="flex gap-6">
                    <span class="text-accent text-2xl font-bold">A.</span>
                    <p class="text-xl font-light leading-relaxed opacity-90 italic">
                        The harvest spirit is not just about the past, but about a sustainable future and community resilience.
                    </p>
                </div>
                
                <div class="flex gap-6">
                    <span class="text-accent text-2xl font-bold">B.</span>
                    <p class="text-xl font-light leading-relaxed opacity-90">
                        Traditional food serves as the emotional anchor that connects diverse cultural narratives across generations.
                    </p>
                </div>
            </div>

            <div class="absolute -top-10 -right-10 text-[120px] text-accent opacity-10">
                <i class="fa-solid fa-quote-right"></i>
            </div>
        </div>

        <div class="absolute bottom-16 right-16 flex items-center gap-6 z-30">
            <div class="text-right">
                <p class="text-accent text-xs tracking-[0.3em] uppercase mb-1 font-bold">Presenter</p>
                <p class="text-2xl font-medium tracking-tight">Jane Doe</p>
                <p class="text-xs opacity-50 uppercase mt-1">Senior Cultural Researcher</p>
            </div>
            <div class="w-20 h-20 rounded-full border-2 border-accent p-1">
                <div class="w-full h-full rounded-full overflow-hidden bg-deco">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=200" alt="Avatar" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-divider to-transparent opacity-30"></div>

    </div>

</body>
</html>
