<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover - Medical Excellence</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        .font-script { font-family: 'Great Vibes', cursive; }
        .star-shape { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
        .bg-pattern { background-image: radial-gradient(#F2E3D5 0.5px, transparent 0.5px); background-size: 24px 24px; }
    </style>
</head>
<body>
    <div id="page_container" class="relative w-[1280px] h-[720px] mx-auto bg-[#1E1B1C] overflow-hidden flex flex-col items-center justify-center bg-pattern">
        
        <!-- 背景装饰 -->
        <div class="absolute top-20 left-20 w-32 h-32 bg-[#F2E3D5] star-shape opacity-10"></div>
        <div class="absolute bottom-20 right-20 w-64 h-64 bg-[#E76F51] star-shape opacity-5"></div>
        
        <!-- 主标题区域 -->
        <div class="relative z-10 text-center">
            <div class="mb-4">
                <span class="font-sans text-[#F2E3D5] text-xs font-bold tracking-[0.8em] uppercase opacity-60">Healthcare Keynote 2026</span>
            </div>
            
            <div class="relative inline-block">
                <!-- 艺术衬字 -->
                <span class="absolute -top-16 -left-20 font-script text-[140px] text-[#F2E3D5]/20 -rotate-12 select-none">
                    Excellence
                </span>
                
                <h1 class="font-serif text-[#FFFFFF] text-[120px] leading-none font-bold tracking-tighter relative z-10">
                    MEDICAL <br>
                    <span class="italic font-light text-[#F2E3D5]">OUTCOMES</span>
                </h1>
            </div>

            <!-- 副标题 -->
            <div class="mt-12 flex flex-col items-center">
                <div class="w-24 h-px bg-[#E76F51] mb-8"></div>
                <p class="text-white/60 font-sans text-xl tracking-widest uppercase max-w-2xl leading-relaxed">
                    Improving Patient Results Through <br> Coordinated Care & Digital Innovation
                </p>
            </div>
        </div>

        <!-- 底部点缀 -->
        <div class="absolute bottom-16 w-full px-20 flex justify-between items-end border-t border-white/5 pt-8">
            <div class="flex gap-12 text-[#F2E3D5]/40 text-[10px] font-sans tracking-widest uppercase font-bold">
                <span>Clinical Strategy</span>
                <span>Technology</span>
                <span>Patient Care</span>
            </div>
            <div class="flex items-center gap-4 text-[#F2E3D5]">
                <i class="fa-solid fa-star-of-life animate-spin-slow"></i>
                <span class="font-serif italic text-lg opacity-80 underline underline-offset-8">Global Healthcare Symposium</span>
            </div>
        </div>

    </div>
</body>
</html>
