<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #F2F3EE; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; color: #1A1A1A; }
        .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 背景装饰：扫描线 -->
        <div class="absolute top-0 left-1/4 w-[1px] h-full bg-gray-200"></div>
        <div class="absolute top-0 left-2/4 w-[1px] h-full bg-gray-200"></div>

        <div class="grid grid-cols-12 h-full">
            <!-- 左栏：垂直装饰文字 -->
            <div class="col-span-1 flex items-center justify-center border-r border-gray-200">
                <span class="vertical-text text-[10px] tracking-[0.8em] font-bold text-gray-300 uppercase">Advanced Diagnostics Unit</span>
            </div>

            <!-- 中栏：主图 -->
            <div class="col-span-5 relative p-12">
                <div class="w-full h-full rounded-3xl overflow-hidden relative">
                    <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1A1A1A]/40 to-transparent"></div>
                </div>
                <!-- 装饰标签 -->
                <div class="absolute bottom-20 -right-6 bg-[#F5FA80] py-4 px-8 shadow-xl rotate-3">
                    <span class="text-sm font-bold tracking-tighter">PRECISION TECHNOLOGY 2.0</span>
                </div>
            </div>

            <!-- 右栏：内容 -->
            <div class="col-span-6 flex flex-col justify-center px-16">
                <h1 class="text-7xl font-bold leading-[0.9] tracking-tightest mb-10 uppercase">
                    Advanced <br/> 
                    <span class="text-transparent" style="-webkit-text-stroke: 1.5px #1A1A1A;">Diagnostic</span> <br/>
                    Tools
                </h1>
                
                <p class="text-xl leading-relaxed text-gray-600 mb-8 border-l-4 border-[#F5FA80] pl-6">
                    We use modern diagnostic equipment to provide quick and accurate assessments. Early detection supports better treatment planning.
                </p>

                <div class="grid grid-cols-2 gap-6 mt-4">
                    <div class="p-4 bg-white/50 rounded-xl">
                        <span class="block text-2xl font-bold mb-1">99%</span>
                        <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Accuracy Rate</span>
                    </div>
                    <div class="p-4 bg-white/50 rounded-xl">
                        <span class="block text-2xl font-bold mb-1">24h</span>
                        <span class="text-xs text-gray-400 uppercase tracking-widest font-bold">Fast Analysis</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统一右下角 -->
        <div class="absolute bottom-10 right-20 z-20 flex items-center">
            <div class="flex flex-col items-end mr-6">
                <span class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-1">Slide</span>
                <span class="text-2xl font-light font-serif">06</span>
            </div>
            <div class="w-[1px] h-12 bg-gray-300 mx-4"></div>
            <div class="flex flex-col">
                <span class="text-[#1A1A1A] text-xs font-bold tracking-widest uppercase">Health Report</span>
                <div class="flex items-center gap-2 mt-1">
                    <div class="w-2 h-2 bg-[#F5FA80] rounded-full"></div>
                    <span class="text-[10px] text-gray-500 font-medium uppercase">Issue 2025 / Q1 Edition</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
