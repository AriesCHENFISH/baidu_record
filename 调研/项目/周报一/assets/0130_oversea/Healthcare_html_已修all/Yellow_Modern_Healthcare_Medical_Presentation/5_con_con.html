<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #F2F3EE; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; color: #1A1A1A; }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 上半部分：标题 -->
        <div class="h-[45%] flex flex-col justify-end px-20 pb-12">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-2 h-2 bg-[#F5FA80] rotate-45"></div>
                <span class="text-xs font-bold tracking-[0.3em] text-gray-500 uppercase">Premium Facilities</span>
            </div>
            <h1 class="text-7xl font-bold leading-tight tracking-tighter uppercase">
                Clean and <span class="italic font-serif font-light">Healing</span> Environment
            </h1>
        </div>

        <!-- 下半部分：图片与文本卡片 -->
        <div class="h-[55%] relative px-20">
            <div class="w-full h-full rounded-t-[3rem] overflow-hidden shadow-2xl grayscale hover:grayscale-0 transition-all duration-1000">
                <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover">
            </div>
            
            <!-- 悬浮装饰文本块 -->
            <div class="absolute top-10 right-32 bg-white/80 backdrop-blur-md p-10 rounded-2xl shadow-xl max-w-md border border-white">
                <p class="text-lg leading-relaxed text-gray-700">
                    We maintain a sterile and soothing atmosphere to promote physical recovery and mental well-being. Modern design meets medical precision.
                </p>
                <div class="mt-4 flex items-center text-xs font-bold gap-2 text-[#1A1A1A]">
                    <i class="fa-solid fa-leaf text-[#F5FA80]"></i> 100% STERILE STANDARDS
                </div>
            </div>
        </div>

        <!-- 统一右下角 -->
        <div class="absolute bottom-10 right-20 z-20 flex items-center">
            <div class="flex flex-col items-end mr-6">
                <span class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-1">Slide</span>
                <span class="text-2xl font-light font-serif">05</span>
            </div>
            <div class="w-[1px] h-12 bg-gray-300 mx-4"></div>
            <div class="flex flex-col">
                <span class="text-[#1A1A1A] text-xs font-bold tracking-widest uppercase text-white drop-shadow-md">Health Report</span>
                <div class="flex items-center gap-2 mt-1">
                    <div class="w-2 h-2 bg-[#F5FA80] rounded-full shadow-sm"></div>
                    <span class="text-[10px] text-white font-medium uppercase drop-shadow-md">Issue 2025 / Q1 Edition</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
