<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { 
            width: 1280px; height: 720px; margin: 0 auto; position: relative; 
            background-color: #F2F3EE; overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; color: #1A1A1A; 
        }
        .text-outline { -webkit-text-stroke: 1.5px #1A1A1A; color: transparent; }
        .list-item { border-left: 3px solid #F5FA80; padding-left: 1.5rem; }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 背景大水印 -->
        <div class="absolute -top-10 -right-10 text-[260px] font-black text-black/[0.02] select-none tracking-tighter uppercase">Index</div>
        
        <!-- 装饰线条 -->
        <div class="absolute left-20 top-0 w-[1px] h-40 bg-gray-300"></div>

        <div class="grid grid-cols-12 h-full relative z-10 px-24">
            
            <!-- 左侧巨型标题 (4列) -->
            <div class="col-span-4 flex flex-col justify-center">
                <div class="flex items-center gap-4 mb-6">
                    <span class="text-xs font-black tracking-[0.5em] text-gray-400 uppercase">Directory</span>
                </div>
                <h1 class="text-7xl font-bold leading-[1.05] tracking-tighter uppercase mb-2">
                    Table <br/>
                    <span class="text-outline">of</span> <br/>
                    Contents
                </h1>
                <div class="w-16 h-1 bg-[#F5FA80] mt-8"></div>
            </div>

            <!-- 右侧目录列表 (8列) -->
            <div class="col-span-8 grid grid-cols-3 gap-x-12 gap-y-20 py-32 items-center">
                
                <!-- 01 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">01</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Skilled <br/> Professionals</h3>
                </div>

                <!-- 02 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">02</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Patient <br/> Priority</h3>
                </div>

                <!-- 03 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">03</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Healing <br/> Environment</h3>
                </div>

                <!-- 04 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">04</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Advanced <br/> Diagnostics</h3>
                </div>

                <!-- 05 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">05</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Preventive <br/> Care</h3>
                </div>

                <!-- 06 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">06</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Holistic <br/> Approach</h3>
                </div>

                <!-- 07 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">07</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Aftercare <br/> Support</h3>
                </div>

                <!-- 08 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">08</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Digital <br/> Innovation</h3>
                </div>

                <!-- 09 -->
                <div class="list-item">
                    <span class="text-3xl font-black italic text-black block leading-none mb-3">09</span>
                    <h3 class="text-xl font-bold uppercase tracking-widest leading-tight">Strategic <br/> Network</h3>
                </div>

            </div>
        </div>

        <!-- 统一右下角设计 -->
        <div class="absolute bottom-10 right-20 z-20 flex items-center">
            <div class="flex flex-col items-end mr-6">
                <span class="text-[10px] font-bold text-gray-400 tracking-widest uppercase mb-1">Slide</span>
                <span class="text-2xl font-light font-serif">02</span>
            </div>
            <div class="w-[1px] h-12 bg-gray-300 mx-4"></div>
            <div class="flex flex-col">
                <span class="text-[#1A1A1A] text-xs font-bold tracking-widest uppercase">Health Report</span>
                <div class="flex items-center gap-2 mt-1">
                    <div class="w-2 h-2 bg-[#F5FA80] rounded-full"></div>
                    <span class="text-[10px] text-gray-500 font-medium uppercase tracking-tighter">Issue 2025 / Q1 Edition</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
