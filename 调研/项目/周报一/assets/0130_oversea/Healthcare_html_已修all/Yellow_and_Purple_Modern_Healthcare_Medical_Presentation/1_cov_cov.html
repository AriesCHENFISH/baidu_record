<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Healthcare Strategy - Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#000000',
                        lavenderMist: '#E6ECFC',
                        mutedViolet: '#C6B7D9',
                        acidLemon: '#E3E86C',
                        naturalBeige: '#EFE9DD'
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { 
            width: 1280px; 
            height: 720px; 
            margin: 0 auto; 
            position: relative; 
            overflow: hidden; 
            background: #E6ECFC; /* 使用参考页面的 Lavender Mist 背景 */
            font-family: 'Inter', 'Noto Sans SC', sans-serif; 
        }
        .text-outline {
            -webkit-text-stroke: 2px #000000;
            color: transparent;
        }
    </style>
</head>
<body>
    <div id="page_container" class="p-16 flex flex-col">
        
        <!-- 背景修饰：仅使用参考页面的色系 -->
        <div class="absolute top-[-50px] right-[-50px] w-96 h-96 bg-mutedViolet/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-100px] left-[-50px] w-[500px] h-[500px] bg-acidLemon/20 rounded-full blur-3xl"></div>
        <div class="absolute top-0 right-0 w-32 h-full bg-naturalBeige/30 -skew-x-12 translate-x-10"></div>

        <!-- TOP: Logo (左上角) -->
        <header class="relative z-10 flex items-center justify-between">
            <div class="flex items-center gap-5">
                <!-- 严格复刻参考页面的 LOGO 结构 -->
                <div class="flex flex-col gap-1 w-12 shrink-0">
                    <div class="h-2 w-full bg-deepBlack rounded-full"></div>
                    <div class="flex items-center gap-1.5">
                        <div class="h-2 w-3/4 bg-deepBlack rounded-full"></div>
                        <div class="h-2 w-2 bg-acidLemon rounded-full"></div>
                    </div>
                    <div class="h-2 w-full bg-deepBlack rounded-full"></div>
                </div>
                <div class="flex flex-col">
                    <span class="text-3xl font-black uppercase tracking-tighter text-deepBlack leading-none">Borcelle</span>
                    <span class="text-[10px] font-black uppercase tracking-[0.4em] text-deepBlack/40">Medical Group</span>
                </div>
            </div>
            <p class="text-[12px] font-black text-deepBlack/50 uppercase tracking-[0.3em]">Strategy Division 2026</p>
        </header>

        <!-- MAIN: Centered Content (主标题居中) -->
        <main class="flex-1 flex flex-col items-center justify-center text-center relative z-10">
            
            <div class="inline-flex items-center gap-3 mb-10 px-6 py-2 bg-deepBlack rounded-full">
                <div class="w-2 h-2 bg-acidLemon rounded-full animate-pulse"></div>
                <span class="text-white text-xs font-black uppercase tracking-[0.5em]">Future Healthcare Framework</span>
            </div>

            <h1 class="flex flex-col gap-2">
                <span class="text-[90px] font-black text-deepBlack leading-none uppercase tracking-tighter">Medical</span>
                <span class="text-[130px] font-black text-deepBlack leading-[0.8] uppercase tracking-tighter italic flex items-center gap-4">
                    <div class="h-4 w-24 bg-acidLemon"></div>
                    Healthcare
                    <div class="h-4 w-24 bg-mutedViolet"></div>
                </span>
                <span class="text-[90px] font-black text-deepBlack leading-none uppercase tracking-tighter">Strategy</span>
            </h1>

            <div class="mt-12 w-24 h-1 bg-deepBlack mb-10"></div>

            <p class="max-w-2xl text-xl font-medium text-deepBlack/70 leading-relaxed italic">
                “Driving the next generation of <span class="text-deepBlack font-black not-italic border-b-4 border-acidLemon">clinical excellence</span> through strategic innovation and patient-centric care models.”
            </p>
        </main>

        <!-- FOOTER: (底部装饰信息) -->
        <footer class="relative z-10 flex justify-between items-end">
            <div class="flex items-center gap-8">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-deepBlack/40 uppercase tracking-widest">Document No.</span>
                    <span class="text-lg font-black text-deepBlack">BMG-STR-2026</span>
                </div>
                <div class="w-px h-10 bg-deepBlack/10"></div>
                <div class="flex flex-col text-mutedViolet">
                    <i class="fa-solid fa-shield-halved text-2xl"></i>
                </div>
            </div>

            <div class="flex flex-col items-end">
                <div class="flex gap-1 mb-2">
                    <div class="w-12 h-2 bg-mutedViolet"></div>
                    <div class="w-8 h-2 bg-acidLemon"></div>
                    <div class="w-4 h-2 bg-naturalBeige"></div>
                </div>
                <p class="text-2xl font-black text-deepBlack tracking-tighter">WWW.BORCELLE.COM</p>
            </div>
        </footer>

    </div>
</body>
</html>
