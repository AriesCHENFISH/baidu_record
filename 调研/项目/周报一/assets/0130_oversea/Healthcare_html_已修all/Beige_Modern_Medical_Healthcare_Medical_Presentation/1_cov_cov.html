<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-End Medical Presentation Cover</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .font-serif-italic {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }

        /* 玻璃拟态卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 207, 160, 0.2);
        }

        .text-gold { color: #E5CFA0; }
        .bg-highlight { background-color: #3A4A35; }
    </style>
</head>
<body>

    <div class="page_container">
        
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full opacity-20 pointer-events-none" 
             style="background: radial-gradient(circle, #3A4A35 0%, transparent 70%);">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full opacity-15 pointer-events-none" 
             style="background: radial-gradient(circle, #E5CFA0 0%, transparent 70%);">
        </div>

        <div class="grid grid-cols-12 h-full w-full p-20 relative z-10">
            
            <div class="col-span-7 flex flex-col justify-between">
                
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 border border-[#E5CFA0] rounded-full flex items-center justify-center text-gold">
                        <i class="fa-solid fa-hospital-user"></i>
                    </div>
                    <h6 class="text-[#EAEAEA] text-sm tracking-[0.3em] uppercase font-bold">
                        Borcelle Medical Group
                    </h6>
                </div>

                <div class="mt-4">
                    <div class="relative inline-block mb-2">
                        <div class="absolute -left-6 top-1/2 -translate-y-1/2 w-1 h-24 bg-gold"></div>
                        <h1 class="text-white text-8xl font-light tracking-tighter leading-none">
                            Medical<br>
                            <span class="font-serif-italic text-gold italic">Healthcare</span>
                        </h1>
                    </div>
                    <div class="flex items-center gap-6">
                        <h2 class="text-white text-7xl font-bold tracking-tighter uppercase">Presentation</h2>
                        <div class="w-16 h-16 border border-white rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-arrow-right -rotate-45 text-2xl text-white"></i>
                        </div>
                    </div>
                    <p class="text-gray-400 text-xl font-light italic mt-6 tracking-wide">
                        Innovative Solutions for Global Patient Care & Excellence
                    </p>
                </div>

                <div class="glass-card w-80 p-5 rounded-2xl flex items-center gap-4 mt-auto">
                    <div class="w-14 h-14 rounded-full bg-highlight border border-gold/30 flex items-center justify-center overflow-hidden">
                        <i class="fa-solid fa-user-doctor text-gold text-2xl"></i>
                    </div>
                    <div>
                        <h4 class="text-white font-bold text-lg leading-none mb-1 tracking-wide">Dr. Alex Thompson</h4>
                        <p class="text-gold text-xs uppercase tracking-widest font-medium opacity-80">Head of Clinical Innovation</p>
                    </div>
                </div>
            </div>

            <div class="col-span-5 relative flex items-center justify-center">
                
                <div class="absolute w-[110%] h-[90%] border border-white/5 rounded-t-full -top-4 pointer-events-none"></div>

                <div class="relative w-full h-[85%] rounded-t-full rounded-b-3xl overflow-hidden border border-[#3A4A35] shadow-[0_0_50px_rgba(58,74,53,0.3)]">
                    <img src="https://images.unsplash.com/photo-1559839734-2b71ea86b48e?q=80&w=1000&auto=format&fit=crop" 
                         alt="Doctor" 
                         class="w-full h-full object-cover object-top opacity-90 transition-transform duration-1000 hover:scale-105">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                </div>

                <div class="absolute bottom-10 left-[-30px] w-36 h-44 bg-highlight rounded-2xl flex flex-col items-center justify-center border border-gold shadow-2xl z-20">
                    <span class="text-white text-5xl font-thin leading-none tracking-tighter">20</span>
                    <span class="text-gold text-5xl font-bold leading-none tracking-tighter">25</span>
                    <div class="w-8 h-1 bg-white opacity-30 mt-3 rounded-full"></div>
                    <span class="text-[10px] text-white/50 uppercase tracking-[0.3em] mt-2 font-bold">Annual</span>
                </div>

                <div class="absolute top-20 right-[-10px] w-12 h-12 border border-gold rounded-full flex items-center justify-center opacity-40 animate-pulse">
                    <i class="fa-solid fa-plus text-gold text-sm"></i>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
