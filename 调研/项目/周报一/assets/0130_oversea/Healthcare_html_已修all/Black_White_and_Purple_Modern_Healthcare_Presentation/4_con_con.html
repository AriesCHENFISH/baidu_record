<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access to Essential Services</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        #page_container { width: 1280px; height: 720px; background-color: #F8F9FB; position: relative; overflow: hidden; margin: 0 auto; display: flex; align-items: center; padding: 0 80px; }
        .blob { position: absolute; filter: blur(100px); z-index: 0; border-radius: 50%; }
        .text-gradient { background: linear-gradient(135deg, #6236FF 0%, #B621FE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .image-frame {
            position: relative;
            width: 420px;
            height: 560px;
            background: white;
            border-radius: 210px 210px 40px 40px;
            overflow: hidden;
            border: 8px solid white;
            box-shadow: 0 30px 60px rgba(98,54,255,0.12);
        }
        .image-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .floating-badge {
            position: absolute;
            bottom: 40px;
            right: -40px;
            background: #111111;
            color: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 240px;
        }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 背景层 -->
        <div class="blob bg-purple-100 w-[500px] h-[500px] -top-20 -left-20 opacity-60"></div>
        <div class="blob bg-blue-50 w-[400px] h-[400px] bottom-0 right-0 opacity-40"></div>

        <div class="grid grid-cols-12 w-full relative z-10 items-center gap-12">
            <!-- 左侧：设计框配图 -->
            <div class="col-span-5 relative">
                <div class="image-frame">
                    <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Hospital Services">
                    <div class="absolute inset-0 bg-gradient-to-t from-purple-900/20 to-transparent"></div>
                </div>
                <!-- 浮动信息卡 -->
                <div class="floating-badge">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Network Status</span>
                    </div>
                    <p class="text-xl font-bold">24/7 Universal Access</p>
                </div>
            </div>

            <!-- 右侧：文案内容 -->
            <div class="col-span-7 pl-10">
                <div class="flex items-center gap-3 mb-6">
                    <div class="h-[3px] w-12 bg-purple-600"></div>
                    <span class="text-purple-600 font-bold uppercase tracking-[0.2em] text-xs">Healthcare Equity</span>
                </div>
                <h1 class="text-[72px] font-black text-gray-900 leading-[1.05] mb-8">
                    Access to <br><span class="text-gradient">Essential Services</span>
                </h1>
                <p class="text-xl text-gray-600 leading-relaxed mb-10">
                    We bridge the gap between high-end medical technology and community needs, ensuring primary care and emergency services are available to everyone, everywhere.
                </p>
                
                <div class="grid grid-cols-2 gap-8">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-purple-600 shadow-sm"><i class="fa-solid fa-truck-medical"></i></div>
                        <span class="font-bold text-gray-800">Rapid Response</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-purple-600 shadow-sm"><i class="fa-solid fa-house-medical"></i></div>
                        <span class="font-bold text-gray-800">Clinic Outreach</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
