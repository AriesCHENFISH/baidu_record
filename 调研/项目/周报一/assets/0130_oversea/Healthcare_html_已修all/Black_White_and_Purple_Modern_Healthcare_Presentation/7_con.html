<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Premium Slide</title>
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F8F9FB;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        /* 左侧主图设计框 */
        .image-frame {
            position: relative;
            width: 440px;
            height: 580px;
            background: #FFFFFF;
            border-radius: 200px 200px 40px 40px; /* 上圆下方 */
            overflow: hidden;
            box-shadow: 0 30px 60px -12px rgba(98, 54, 255, 0.15);
            border: 8px solid white;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        /* 背景装饰球 */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            border-radius: 50%;
        }

        /* 玻璃质感 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .text-gradient {
            background: linear-gradient(135deg, #6236FF 0%, #B621FE 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex items-center">
        
        <!-- 背景层 -->
        <div class="blob bg-purple-200 w-[500px] h-[500px] -top-20 -left-20 opacity-40"></div>
        <div class="blob bg-blue-100 w-[400px] h-[400px] bottom-0 right-0 opacity-50"></div>

        <div class="grid grid-cols-12 w-full h-full relative z-10 px-20">
            
            <!-- 左侧：设计框配图区域 -->
            <div class="col-span-5 flex flex-col justify-center items-center relative">
                
                <!-- 背后装饰环 -->
                <div class="absolute w-[480px] h-[480px] border-[1px] border-purple-200 rounded-full -z-10 animate-pulse"></div>
                
                <!-- 主图片容器 (The Frame) -->
                <div class="image-frame">
                    <img src="https://images.unsplash.com/photo-1559839734-2b71ea860630?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Doctor">
                    
                    <!-- 图片内阴影遮罩，增加深度感 -->
                    <div class="absolute inset-0 bg-gradient-to-t from-purple-900/20 to-transparent"></div>
                </div>

                <!-- 浮动 CEO 卡片 -->
                <div class="absolute bottom-12 -right-8 glass-panel p-4 rounded-3xl shadow-2xl flex items-center gap-4 min-w-[260px]">
                    <div class="w-14 h-14 rounded-2xl overflow-hidden shadow-inner bg-gray-100">
                        <img src="https://images.unsplash.com/photo-1594824476967-48c8b964273f?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <p class="font-bold text-gray-900 text-lg">Claudia Alves</p>
                        <p class="text-xs font-semibold text-purple-600 uppercase tracking-tighter">CEO Borcelle Hospital</p>
                    </div>
                    <div class="ml-auto bg-purple-600 w-8 h-8 rounded-full flex items-center justify-center text-white">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                </div>

                <!-- 小装饰元素 -->
                <div class="absolute top-20 left-4 bg-white p-3 rounded-2xl shadow-lg text-purple-600">
                    <i class="fa-solid fa-heart-pulse text-2xl"></i>
                </div>
            </div>

            <!-- 右侧：内容文案区域 -->
            <div class="col-span-7 flex flex-col justify-center pl-12">
                
                <!-- 标签 -->
                <div class="inline-flex items-center gap-3 mb-8">
                    <span class="px-4 py-1.5 bg-purple-100 text-purple-700 rounded-full text-xs font-bold uppercase tracking-widest">
                        Our Mission
                    </span>
                    <div class="h-[1px] w-12 bg-gray-300"></div>
                </div>

                <!-- 标题 -->
                <h1 class="text-[64px] font-extrabold leading-[1.05] text-gray-900 mb-8">
                    HealthCare for a<br>
                    <span class="text-gradient">Healthier Future</span>
                </h1>

                <!-- 正文内容 -->
                <div class="max-w-[540px] mb-10">
                    <p class="text-xl text-gray-600 leading-relaxed">
                        A strong health care system is essential for building healthy, resilient communities. When services are accessible and reliable, people live longer and stay productive.
                    </p>
                </div>

                <!-- 底部交互层 -->
                <div class="flex items-center gap-16">
                    <!-- 数据统计 -->
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="text-4xl font-black text-gray-900">400K</span>
                            <div class="bg-green-100 text-green-600 p-1 rounded-md">
                                <i class="fa-solid fa-arrow-trend-up text-xs"></i>
                            </div>
                        </div>
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mt-2">Clinics Worldwide</p>
                    </div>

                    <!-- 竖线分割 -->
                    <div class="h-12 w-[2px] bg-gray-200"></div>

                    <!-- 按钮 -->
                    <button class="flex items-center gap-4 group">
                        <div class="w-14 h-14 bg-gray-900 rounded-full flex items-center justify-center text-white group-hover:bg-purple-600 transition-all duration-300 group-hover:rotate-45">
                            <i class="fa-solid fa-arrow-right text-xl"></i>
                        </div>
                        <span class="text-lg font-bold text-gray-900 group-hover:text-purple-600 transition-colors">Discover More</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 装饰性点状背景 (右下角) -->
        <div class="absolute bottom-10 right-10 opacity-10 grid grid-cols-4 gap-2">
            <div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div>
            <div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div>
            <div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div><div class="w-2 h-2 bg-black rounded-full"></div>
        </div>
    </div>

</body>
</html>
