<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Centered Approach - All English Edition</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#D6F847', // Acid Green
                        dark: '#121212',    // Deep Background
                        txtDark: '#1A1A1A', // Ink Black
                        accent: '#2E5AAC',  // Cobalt Blue
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .sticker-shadow { box-shadow: 8px 8px 0px rgba(0,0,0,0.1); }
        .image-mask { clip-path: inset(0 0 0 0 rounded 24px); }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="relative bg-primary w-[1160px] h-[620px] rounded-[48px] p-[64px] flex flex-col justify-between overflow-hidden shadow-2xl">
            
            <div class="absolute top-[-20px] right-[-20px] text-[180px] font-black text-white opacity-10 select-none pointer-events-none">
                01
            </div>

            <div class="z-10">
                <div class="flex items-center gap-3 mb-4">
                    <div class="h-[2px] w-12 bg-dark"></div>
                    <span class="text-dark text-xl font-bold tracking-[0.3em] uppercase">Healthcare Excellence</span>
                </div>
                <h1 class="text-txtDark text-[92px] font-black uppercase leading-[0.85] tracking-tight">
                    Your Health,<br><span class="text-accent italic">Our Priority.</span>
                </h1>
            </div>

            <div class="flex items-end justify-between gap-16 z-10">
                
                <div class="relative w-[520px] h-[220px] shrink-0 border-[3px] border-dark rounded-[30px] overflow-hidden sticker-shadow -rotate-1">
                    <img src="https://images.unsplash.com/photo-1576091160550-217358c75ce7?q=80&w=800&auto=format&fit=crop" 
                         alt="Medical Care"
                         class="w-full h-full object-cover grayscale brightness-110" />
                    
                    <div class="absolute bottom-4 left-4 bg-accent text-white px-5 py-2 rounded-full flex items-baseline gap-2 shadow-lg">
                        <span class="text-2xl font-black italic">92%</span>
                        <span class="text-[10px] font-bold uppercase tracking-widest opacity-80">Patient Trust</span>
                    </div>
                </div>

                <div class="max-w-[440px] mb-2">
                    <p class="text-txtDark text-[22px] font-semibold leading-snug mb-8">
                        Delivering compassionate, evidence-based care tailored to your unique medical journey. We ensure safety and comfort at every touchpoint.
                    </p>
                    
                    <div class="flex flex-wrap gap-3">
                        <div class="flex items-center gap-2 bg-dark text-white px-4 py-2 rounded-xl text-sm font-bold uppercase tracking-wider">
                            <i class="fa-solid fa-check text-primary"></i>
                            Empathy
                        </div>
                        <div class="flex items-center gap-2 bg-white/50 border border-dark/10 px-4 py-2 rounded-xl text-sm font-bold uppercase tracking-wider">
                            <i class="fa-solid fa-shield-halved text-accent"></i>
                            Safety
                        </div>
                        <div class="flex items-center gap-2 bg-white/50 border border-dark/10 px-4 py-2 rounded-xl text-sm font-bold uppercase tracking-wider">
                            <i class="fa-solid fa-user-doctor text-accent"></i>
                            Expertise
                        </div>
                    </div>
                </div>
            </div>

            <div class="absolute top-8 right-16 w-[110px] h-[110px] bg-[#E8FF8E] rounded-full border-[3px] border-dark flex items-center justify-center rotate-12 sticker-shadow z-20 hover:scale-110 transition-transform">
                <i class="fa-solid fa-face-smile text-accent text-[70px]"></i>
            </div>

            <div class="absolute -bottom-10 -right-6 z-20 rotate-45 scale-75 opacity-90">
                <div class="relative w-[200px] h-[200px]">
                    <i class="fa-solid fa-heart absolute top-0 left-1/2 -translate-x-1/2 text-accent text-[100px]"></i>
                    <i class="fa-solid fa-heart absolute bottom-0 left-1/2 -translate-x-1/2 text-accent text-[100px] rotate-180"></i>
                    <i class="fa-solid fa-heart absolute left-0 top-1/2 -translate-y-1/2 text-accent text-[100px] -rotate-90"></i>
                    <i class="fa-solid fa-heart absolute right-0 top-1/2 -translate-y-1/2 text-accent text-[100px] rotate-90"></i>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
