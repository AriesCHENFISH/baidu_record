<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Diagnosis - Borcelle Medical</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; background-color: #FFFFFF; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- Header -->
        <header class="w-full h-24 flex items-center justify-between px-16 z-20">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center">
                    <div class="w-10 h-10 bg-[#E8F85D] rounded-full border-2 border-black flex items-center justify-center z-10"><i class="fa-solid fa-plus text-black text-lg"></i></div>
                    <div class="w-14 h-10 bg-black rounded-r-full -ml-5 border-2 border-black flex items-center justify-end pr-3"><div class="w-2 h-2 bg-white rounded-full"></div></div>
                </div>
                <div class="flex flex-col ml-1 text-black font-extrabold text-2xl leading-none">BORCELLE<p class="text-[10px] font-bold tracking-[0.2em] uppercase opacity-70">Medical Group</p></div>
            </div>
            <div class="flex gap-4">
                <div class="w-10 h-10 bg-[#E8F85D] border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]"><i class="fa-solid fa-wifi text-sm"></i></div>
                <div class="w-10 h-10 bg-white border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]"><i class="fa-solid fa-house-medical text-sm"></i></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 relative">
            <!-- Background Image Area -->
            <div class="absolute left-16 top-10 w-[60%] h-[80%] border-4 border-black shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] overflow-hidden">
                <img src="https://images.unsplash.com/photo-1581056771107-24ca5f033842?auto=format&fit=crop&q=80&w=1200" class="w-full h-full object-cover">
                <div class="absolute top-8 left-8">
                    <h1 class="text-8xl font-black italic uppercase leading-[0.8] text-white [-webkit-text-stroke:2px_black]">Precision<br>Lab</h1>
                </div>
            </div>

            <!-- Floating Info Card -->
            <div class="absolute right-16 top-20 w-[400px] bg-black text-white p-10 border-4 border-black shadow-[16px_16px_0px_0px_rgba(232,248,93,1)]">
                <h3 class="text-3xl font-black italic uppercase mb-6 leading-none">Diagnosis with<br><span class="text-[#E8F85D]">Zero Error</span></h3>
                <ul class="space-y-6">
                    <li class="flex items-center gap-4 border-b border-white/20 pb-4">
                        <span class="text-2xl font-black text-[#E8F85D]">01</span>
                        <p class="text-sm font-bold">DNA Sequencing Technology</p>
                    </li>
                    <li class="flex items-center gap-4 border-b border-white/20 pb-4">
                        <span class="text-2xl font-black text-[#E8F85D]">02</span>
                        <p class="text-sm font-bold">Real-time Pathology Scan</p>
                    </li>
                    <li class="flex items-center gap-4">
                        <span class="text-2xl font-black text-[#E8F85D]">03</span>
                        <p class="text-sm font-bold">AI Predictive Analysis</p>
                    </li>
                </ul>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="h-20 px-16 flex items-center gap-6">
            <div class="flex items-center gap-4">
                <span class="font-black text-sm tracking-widest uppercase">Page 08 // Digital Diagnosis</span>
                <div class="w-48 h-1.5 bg-black"></div>
            </div>
        </footer>
    </div>
</body>
</html>
