<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Our Services - Borcelle Medical</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; background-color: #FFFFFF; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; }
        .font-tight { letter-spacing: -0.04em; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="page_container">

        <!-- Unified Header (已同步右上角图标) -->
        <header class="w-full h-24 flex items-center justify-between px-16 z-20">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center">
                    <div class="w-10 h-10 bg-[#E8F85D] rounded-full border-2 border-black flex items-center justify-center z-10">
                        <i class="fa-solid fa-plus text-black text-lg"></i>
                    </div>
                    <div class="w-14 h-10 bg-black rounded-r-full -ml-5 border-2 border-black flex items-center justify-end pr-3">
                        <div class="w-2 h-2 bg-white rounded-full"></div>
                    </div>
                </div>
                <div class="flex flex-col ml-1">
                    <h2 class="text-black font-extrabold text-2xl leading-none tracking-tighter">BORCELLE</h2>
                    <p class="text-black text-[10px] font-bold tracking-[0.2em] uppercase opacity-70">Medical Group</p>
                </div>
            </div>

            <!-- 右上角图标：严格按照参考页面修改 -->
            <div class="flex gap-4">
                <div class="w-10 h-10 bg-[#E8F85D] border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    <i class="fa-solid fa-wifi text-sm"></i>
                </div>
                <div class="w-10 h-10 bg-white border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">
                    <i class="fa-solid fa-house-medical text-sm"></i>
                </div>
            </div>
        </header>

        <!-- Main Content Section -->
        <main class="flex-1 grid grid-cols-12 px-16 py-8 gap-12">
            
            <!-- Left Column: Content List -->
            <div class="col-span-6 flex flex-col justify-center">
                <div class="mb-10">
                    <h3 class="text-black text-sm font-black uppercase tracking-[0.3em] mb-2 flex items-center gap-2">
                        <span class="w-8 h-1 bg-[#E8F85D]"></span>
                        Department Focus
                    </h3>
                    <h1 class="text-7xl font-black text-black font-tight uppercase italic leading-none">
                        Our Core<br><span class="text-white [-webkit-text-stroke:2px_black]">Services</span>
                    </h1>
                </div>

                <!-- Service Items List -->
                <div class="space-y-6">
                    <!-- Item 1 -->
                    <div class="flex items-start gap-6 group cursor-pointer">
                        <div class="w-12 h-12 bg-[#E8F85D] border-2 border-black flex items-center justify-center shrink-0 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                            <i class="fa-solid fa-stethoscope text-xl"></i>
                        </div>
                        <div class="border-b-2 border-black/10 pb-4 flex-1">
                            <h4 class="text-xl font-bold text-black mb-1 italic uppercase">Advanced Diagnostics</h4>
                            <p class="text-sm text-black/60 font-bold">Using AI-driven technology for precise results.</p>
                        </div>
                    </div>
                    <!-- Item 2 -->
                    <div class="flex items-start gap-6 group cursor-pointer">
                        <div class="w-12 h-12 bg-white border-2 border-black flex items-center justify-center shrink-0 shadow-[4px_4px_0px_0px_rgba(232,248,93,1)]">
                            <i class="fa-solid fa-microscope text-xl"></i>
                        </div>
                        <div class="border-b-2 border-black/10 pb-4 flex-1">
                            <h4 class="text-xl font-bold text-black mb-1 italic uppercase">Laboratory Analysis</h4>
                            <p class="text-sm text-black/60 font-bold">Fast and accurate testing with 24h turnaround.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: 配图链接展示区 -->
            <div class="col-span-6 flex items-center justify-center">
                <div class="relative w-full h-[400px]">
                    <!-- 主图 -->
                    <div class="absolute inset-0 border-4 border-black shadow-[16px_16px_0px_0px_rgba(232,248,93,1)] overflow-hidden bg-gray-200">
                        <img src="https://images.unsplash.com/photo-1576091160550-2173dad99901?auto=format&fit=crop&q=80&w=1000" 
                             alt="Medical Service" 
                             class="w-full h-full object-cover">
                        <!-- 图片上的装饰标签 -->
                        <div class="absolute bottom-0 left-0 bg-black text-[#E8F85D] px-6 py-3 font-black italic uppercase tracking-wider">
                            Premium Healthcare
                        </div>
                    </div>
                    <!-- 装饰元素：网格背景 -->
                    <div class="absolute -z-10 -top-6 -right-6 w-32 h-32 opacity-20" style="background-image: radial-gradient(circle, black 2px, transparent 2px); background-size: 15px 15px;"></div>
                </div>
            </div>

        </main>
        
        <!-- Unified Footer (已同步左下角页码) -->
        <footer class="h-20 px-16 flex items-center gap-6">
            <div class="flex items-center gap-4">
                <span class="font-black text-sm tracking-widest uppercase">Page 03 // Core Services</span>
                <div class="w-48 h-1.5 bg-black"></div>
            </div>
        </footer>

    </div>

</body>
</html>
