<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Specialists - Borcelle Medical</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; background-color: #FFFFFF; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- Header -->
        <header class="w-full h-24 flex items-center justify-between px-16 z-20">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center">
                    <div class="w-10 h-10 bg-[#E8F85D] rounded-full border-2 border-black flex items-center justify-center z-10"><i class="fa-solid fa-plus text-black text-lg"></i></div>
                    <div class="w-14 h-10 bg-black rounded-r-full -ml-5 border-2 border-black flex items-center justify-end pr-3"><div class="w-2 h-2 bg-white rounded-full"></div></div>
                </div>
                <div class="flex flex-col ml-1 text-black font-extrabold text-2xl leading-none">BORCELLE<p class="text-[10px] font-bold tracking-[0.2em] uppercase opacity-70">Medical Group</p></div>
            </div>
            <div class="flex gap-4">
                <div class="w-10 h-10 bg-[#E8F85D] border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]"><i class="fa-solid fa-wifi text-sm"></i></div>
                <div class="w-10 h-10 bg-white border-2 border-black flex items-center justify-center shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]"><i class="fa-solid fa-house-medical text-sm"></i></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 px-16 py-8 flex gap-12 items-center">
            <div class="w-1/2">
                <h1 class="text-7xl font-black text-black italic uppercase leading-none mb-6">
                    Expert<br><span class="text-white [-webkit-text-stroke:2px_black]">Specialists</span>
                </h1>
                <p class="text-xl font-bold italic mb-8 border-l-8 border-[#E8F85D] pl-4">Leading the future of personalized medicine with over 200+ world-class physicians.</p>
                <div class="space-y-4">
                    <div class="bg-black text-white p-4 flex justify-between items-center border-2 border-black shadow-[8px_8px_0px_0px_rgba(232,248,93,1)]">
                        <span class="font-black italic uppercase">Cardiology Division</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                    <div class="bg-white text-black p-4 flex justify-between items-center border-2 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                        <span class="font-black italic uppercase">Neurological Research</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            </div>
            <div class="w-1/2 relative">
                <div class="w-full h-[450px] border-4 border-black shadow-[16px_16px_0px_0px_rgba(0,0,0,1)] overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1559839734-2b71f1536783?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500">
                </div>
                <div class="absolute -bottom-6 -left-6 bg-[#E8F85D] border-4 border-black p-6 w-64 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                    <p class="text-xs font-black uppercase tracking-tighter opacity-50 mb-1">Chief Surgeon</p>
                    <h4 class="text-2xl font-black italic uppercase">Dr. Alex Borcelle</h4>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="h-20 px-16 flex items-center gap-6">
            <div class="flex items-center gap-4">
                <span class="font-black text-sm tracking-widest uppercase">Page 07 // Specialists</span>
                <div class="w-48 h-1.5 bg-black"></div>
            </div>
        </footer>
    </div>
</body>
</html>
