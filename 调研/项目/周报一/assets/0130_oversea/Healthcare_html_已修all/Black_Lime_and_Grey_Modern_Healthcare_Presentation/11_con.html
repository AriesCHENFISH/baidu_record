<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Technology Layout</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #FFFFFF; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .bg-lime-accent { background-color: #D2F050; }
    </style>
</head>
<body>
    <div id="page_container" class="p-16 flex flex-col">
        <!-- Consistent Title Header -->
        <div class="mb-12">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-1 bg-lime-accent"></div>
                <h4 class="text-sm font-bold tracking-widest uppercase text-gray-500">Next-Gen Systems</h4>
            </div>
            <h1 class="text-7xl font-black text-black uppercase">Modern Technology</h1>
        </div>

        <!-- 1x3 Grid Layout -->
        <div class="grid grid-cols-3 gap-8 flex-1">
            <!-- Card 1: Lime Highlight -->
            <div class="bg-lime-accent rounded-[40px] p-10 flex flex-col justify-between">
                <div>
                    <i class="fa-solid fa-microscope text-3xl mb-6"></i>
                    <h3 class="text-2xl font-bold mb-4 uppercase">AI Diagnostics</h3>
                    <p class="text-lg leading-snug">Advanced algorithms analyzing medical data for faster and more precise conclusions.</p>
                </div>
                <div class="w-12 h-12 bg-black rounded-full flex items-center justify-center text-white">
                    <i class="fa-solid fa-arrow-right -rotate-45"></i>
                </div>
            </div>

            <!-- Card 2: Image Box -->
            <div class="relative rounded-[40px] overflow-hidden group">
                <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover grayscale opacity-90 transition-transform duration-500 group-hover:scale-110">
                <div class="absolute inset-0 bg-black/20 flex items-end p-10">
                    <h3 class="text-white text-2xl font-bold uppercase tracking-tight">Digital<br>Imaging</h3>
                </div>
            </div>

            <!-- Card 3: White Bordered Box -->
            <div class="border-2 border-gray-100 rounded-[40px] p-10 flex flex-col justify-between">
                <div>
                    <i class="fa-solid fa-network-wired text-3xl mb-6 text-gray-400"></i>
                    <h3 class="text-2xl font-bold mb-4 uppercase">Unified Care</h3>
                    <p class="text-lg text-gray-500 leading-snug">Cloud-integrated patient records accessible by specialists across all departments.</p>
                </div>
                <p class="text-sm font-bold uppercase tracking-widest text-lime-600">Secure Protocol</p>
            </div>
        </div>
    </div>
</body>
</html>
