<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holistic Support Layout - Static</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { 
            width: 1280px; 
            height: 720px; 
            margin: 0 auto; 
            position: relative; 
            background-color: #FFFFFF; 
            overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; 
        }
        /* 品牌色定义 */
        .bg-brand-lime { background-color: #D2F050; }
        .text-brand-lime { color: #D2F050; }
        .border-brand-lime { border-color: #D2F050; }
    </style>
</head>
<body>
    <div id="page_container" class="grid grid-cols-12">
        
        <!-- 左侧：标题与形象大图 (7列) -->
        <div class="col-span-7 p-16 flex flex-col">
            <!-- 统一的主标题设计样式 -->
            <div class="mb-12">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-12 h-1 bg-brand-lime"></div>
                    <h4 class="text-sm font-bold tracking-widest uppercase text-gray-500">Comprehensive Care</h4>
                </div>
                <h1 class="text-7xl font-black text-black uppercase">Personalized<br>Journey</h1>
            </div>
            
            <!-- 大圆角图片 -->
            <div class="flex-1 relative rounded-[40px] overflow-hidden shadow-2xl">
                <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?q=80&w=800&auto=format&fit=crop" class="w-full h-[370px] object-cover">
                <!-- 悬浮图标勋章 -->
                <div class="absolute top-8 right-8 w-20 h-20 bg-brand-lime rounded-full flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-hands-holding-circle text-3xl"></i>
                </div>
            </div>
        </div>

        <!-- 右侧：内容列表 (5列) -->
        <div class="col-span-5 bg-gray-50 p-16 flex flex-col justify-center">
            <div class="space-y-12">
                
                <!-- 特性 01 -->
                <div class="flex flex-col">
                    <div class="flex items-center gap-4 mb-4">
                        <!-- 编号改为黄色且直接显示 -->
                        <span class="text-5xl font-black text-brand-lime">01</span>
                        <h3 class="text-2xl font-bold uppercase tracking-tight">Tailored Plans</h3>
                    </div>
                    <!-- 竖线改为黄色 -->
                    <p class="text-gray-500 text-lg border-l-4 border-brand-lime pl-6 ml-4 leading-relaxed">
                        Every patient receives a unique roadmap designed specifically for their lifestyle and recovery goals.
                    </p>
                </div>

                <!-- 特性 02 -->
                <div class="flex flex-col">
                    <div class="flex items-center gap-4 mb-4">
                        <!-- 编号改为黄色且直接显示 -->
                        <span class="text-5xl font-black text-brand-lime">02</span>
                        <h3 class="text-2xl font-bold uppercase tracking-tight">24/7 Support</h3>
                    </div>
                    <!-- 竖线改为黄色 -->
                    <p class="text-gray-500 text-lg border-l-4 border-brand-lime pl-6 ml-4 leading-relaxed">
                        Access to specialized medical guidance at any time, ensuring you are never alone on your path.
                    </p>
                </div>

                <!-- 底部行动按钮 -->
                <div class="pt-8 ml-4">
                    <div class="bg-black text-white px-10 py-5 rounded-full inline-flex items-center gap-4 font-bold cursor-pointer hover:bg-zinc-800 transition-all shadow-lg">
                        <span>START CONSULTATION</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
                
            </div>
        </div>

    </div>
</body>
</html>
