<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventive Health Measures - Wellness Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FEF8EC;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 句子装饰线条 */
        .slash-accent {
            width: 8px;
            height: 40px;
            transform: skewX(-20deg);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* 卡片图片遮罩，确保文字清晰 */
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 50%);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute top-[-100px] left-[-100px] w-[600px] h-[600px] rounded-full opacity-20 pointer-events-none" 
             style="background: radial-gradient(circle, #EBC05B 0%, rgba(254, 248, 236, 0) 70%);">
        </div>

        <div class="grid grid-cols-12 gap-12 px-20 h-full items-center">

            <div class="col-span-5 flex flex-col justify-center z-10">
                <h1 class="text-[#000000] text-7xl font-bold leading-[1.1] mb-12 tracking-tight">
                    Preventive <br>
                    <span class="text-[#E0653B]">Health</span> <br>
                    Measures.
                </h1>

                <div class="space-y-8">
                    <div class="flex items-start gap-5">
                        <div class="slash-accent bg-[#E0653B] mt-1"></div>
                        <p class="text-[#1A1A1A] text-lg leading-snug font-medium text-justify">
                            Preventive care helps avoid illness through regular check-ups and healthy lifestyle habits.
                        </p>
                    </div>

                    <div class="flex items-start gap-5">
                        <div class="slash-accent bg-[#EBC05B] mt-1"></div>
                        <p class="text-[#1A1A1A] text-lg leading-snug font-light opacity-80 text-justify">
                            Early detection reduces medical strain and significantly lowers long-term treatment costs.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-span-7 h-full flex items-center justify-center">
                <div class="grid grid-cols-2 gap-6 w-full max-w-2xl">

                    <div class="relative h-64 rounded-[2rem] overflow-hidden shadow-lg group">
                        <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?q=80&w=400&auto=format&fit=crop" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="Check-ups">
                        <div class="absolute inset-0 card-overlay flex items-end p-6">
                            <h3 class="text-white font-bold text-xl tracking-wide">Routine Check-ups</h3>
                        </div>
                    </div>

                    <div class="relative h-64 rounded-[2rem] overflow-hidden shadow-lg group">
                        <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=400&auto=format&fit=crop" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="Hygiene">
                        <div class="absolute inset-0 card-overlay flex items-end p-6">
                            <h3 class="text-white font-bold text-xl tracking-wide">Personal Hygiene</h3>
                        </div>
                    </div>

                    <div class="relative h-64 rounded-[2rem] overflow-hidden shadow-lg group">
                        <img src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=400&auto=format&fit=crop" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="Nutrition">
                        <div class="absolute inset-0 card-overlay flex items-end p-6">
                            <h3 class="text-white font-bold text-xl tracking-wide">Balanced Nutrition</h3>
                        </div>
                    </div>

                    <div class="relative h-64 rounded-[2rem] overflow-hidden shadow-lg group">
                        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=400&auto=format&fit=crop" 
                             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="Activity">
                        <div class="absolute inset-0 card-overlay flex items-end p-6">
                            <h3 class="text-white font-bold text-xl tracking-wide">Physical Activity</h3>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
