<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container {

            position: relative; 
            margin: 0 auto;

        /* 序号球基础样式 */

            display: flex;

            justify-center: center;
            font-weight: 800;
            font-size: 1.125rem;

        }

        .bg-orange { background-color: #E0653B; color: white; }
        .bg-black { background-color: #000000; color: white; }
        .bg-gold { background-color: #EBC05B; color: #1A1A1A; }

        .list-item {
            transition: all 0.2s ease;
        }
        .list-item:hover {
            transform: translateX(10px);
        }
    </style>
</head>
