<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Presentation - Minimalist Edition</title>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgCream: '#F9F5F0',
                        primaryBlack: '#121212',
                        accentOrange: '#E0653B',
                        accentGold: '#EBC05B',
                        textDark: '#1A1A1A'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #F9F5F0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: "Noto Sans SC", sans-serif;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #F9F5F0;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px;
        }

        /* Decorative Grid */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#d1d1d1 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.2;
            z-index: 0;
        }

        .display-title {
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        /* Inner Glow Decoration */
        .glass-glow {
            position: absolute;
            top: 0;
            right: 0;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(224,101,59,0.15) 0%, transparent 70%);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-grid"></div>

        <div class="w-full h-[68%] bg-primaryBlack rounded-[60px] flex flex-col justify-center px-24 relative shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] overflow-hidden">
            <div class="absolute -top-20 -right-20 w-80 h-80 border-[40px] border-white/5 rounded-full"></div>
            
            <div class="relative z-10">
                <div class="absolute -top-16 left-[580px] text-accentOrange transform -rotate-12 text-9xl drop-shadow-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <h1 class="text-white text-[130px] font-black display-title">
                    Medical<br><span class="text-white/90">Report.</span>
                </h1>

                <div class="mt-8 flex items-center gap-6">
                    <div class="h-[2px] w-20 bg-accentOrange"></div>
                    <p class="text-gray-400 text-2xl font-light tracking-[0.1em] uppercase">
                        Public Health Foundations: Prevention, Innovation & Practice
                    </p>
                </div>
            </div>
        </div>

        <div class="flex items-end justify-between h-[28%] relative z-10">

            <div class="flex items-center gap-5 mb-6">
                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center shadow-sm text-accentOrange text-4xl">
                    <i class="fa-solid fa-hospital-user"></i>
                </div>
                <div>
                    <h2 class="text-primaryBlack text-3xl font-bold tracking-tight">Borcelle Medical Center</h2>
                    <p class="text-gray-500 text-sm tracking-widest uppercase mt-1">Borcelle Health Institute</p>
                </div>
            </div>

            <div class="relative w-[65%]">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-2 h-20 bg-accentGold rounded-full z-20"></div>
                
                <div class="bg-accentOrange text-white rounded-[40px] pl-16 pr-12 py-10 shadow-2xl flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-white/60 text-xs uppercase tracking-wider mb-1">Presenter</span>
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-user-doctor text-xl text-white/80"></i>
                            <p class="text-xl font-bold tracking-wide">Dr. Linsen Zhang</p>
                        </div>
                    </div>

                    <div class="h-12 w-[1px] bg-white/20"></div>

                    <div class="flex flex-col">
                        <span class="text-white/60 text-xs uppercase tracking-wider mb-1">Department</span>
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-stethoscope text-xl text-white/80"></i>
                            <p class="text-xl font-bold tracking-wide">Cardiovascular</p>
                        </div>
                    </div>

                    <div class="h-12 w-[1px] bg-white/20"></div>

                    <div class="flex flex-col">
                        <span class="text-white/60 text-xs uppercase tracking-wider mb-1">Date</span>
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-calendar-day text-xl text-white/80"></i>
                            <p class="text-xl font-bold tracking-wide">Jan 23, 2026</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
