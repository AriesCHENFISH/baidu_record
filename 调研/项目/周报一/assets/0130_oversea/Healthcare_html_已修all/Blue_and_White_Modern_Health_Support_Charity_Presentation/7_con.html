<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Health - Simple Ways to Support</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #1A235D;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            color: #FFFFFF;
        }
        .glow-text { text-shadow: 0 0 30px rgba(107, 220, 207, 0.4); }
        .grid-card { transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); border: 1px solid rgba(255,255,255,0.1); }
        .grid-card:hover { transform: translateY(-8px); border-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div id="page_container" class="p-16 flex flex-col">

        <header class="flex justify-between items-start w-full z-20 h-16">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#6BDCCF] to-[#4D9FFF] flex items-center justify-center text-[#1A235D] text-xl shadow-lg rotate-3 transform transition-transform hover:rotate-0">
                        <i class="fa-solid fa-notes-medical"></i>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-white rounded-full flex items-center justify-center border-2 border-[#1A235D]">
                        <div class="w-1.5 h-1.5 bg-[#2563EB] rounded-full animate-pulse"></div>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-bold tracking-[0.15em] text-xl leading-none">BORCELLE</span>
                    <span class="text-[#6BDCCF] text-[10px] font-bold tracking-[0.3em] uppercase mt-1">Health Initiative</span>
                </div>
            </div>
            <h6 class="text-white opacity-60 text-lg font-medium tracking-widest pt-2">2030</h6>
        </header>

        <div class="mt-8 mb-12">
            <h1 class="text-7xl font-bold tracking-tighter leading-tight">
                Three Simple <span class="glow-text text-[#6BDCCF]">Ways to Support</span>
            </h1>
        </div>

        <div class="grid grid-cols-3 gap-8 h-44 mb-8">
            <div class="grid-card rounded-2xl overflow-hidden shadow-2xl">
                <img src="https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 opacity-80">
            </div>
            <div class="grid-card rounded-2xl overflow-hidden shadow-2xl">
                <img src="https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 opacity-80">
            </div>
            <div class="grid-card rounded-2xl overflow-hidden shadow-2xl">
                <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700 opacity-80">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-8 flex-1 pb-4">
            <div class="grid-card rounded-[2.5rem] p-8 flex flex-col justify-between shadow-xl" style="background: linear-gradient(135deg, #2563EB, #1D4ED8);">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-black tracking-[0.2em] uppercase opacity-60">Method 01</span>
                    <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-hand-holding-dollar text-xl"></i>
                    </div>
                </div>
                <p class="text-[1.4rem] font-bold leading-tight uppercase tracking-wide italic">Donate to fund health kits for families.</p>
            </div>

            <div class="grid-card rounded-[2.5rem] p-8 flex flex-col justify-between shadow-xl" style="background: linear-gradient(135deg, #669DF6, #4D9FFF); color: #1A235D;">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-black tracking-[0.2em] uppercase opacity-50">Method 02</span>
                    <div class="w-10 h-10 bg-black/10 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-truck-fast text-xl"></i>
                    </div>
                </div>
                <p class="text-[1.4rem] font-bold leading-tight uppercase tracking-wide italic">Volunteer your time for local delivery.</p>
            </div>

            <div class="grid-card rounded-[2.5rem] p-8 flex flex-col justify-between shadow-xl" style="background: linear-gradient(135deg, #6BDCCF, #59C9BC); color: #1A235D;">
                <div class="flex justify-between items-center">
                    <span class="text-sm font-black tracking-[0.2em] uppercase opacity-50">Method 03</span>
                    <div class="w-10 h-10 bg-black/10 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-bullhorn text-xl"></i>
                    </div>
                </div>
                <p class="text-[1.4rem] font-bold leading-tight uppercase tracking-wide italic">Share our campaign with your friends.</p>
            </div>
        </div>

    </div>

</body>
</html>
