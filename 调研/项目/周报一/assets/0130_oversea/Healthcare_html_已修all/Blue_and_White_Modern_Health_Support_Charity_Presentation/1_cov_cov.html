<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together for Health - Minimalist Elite Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { 
            width: 1280px; height: 720px; margin: 0 auto; position: relative; 
            background-color: #1A235D; overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; color: #FFFFFF; 
        }
        .glow-text { text-shadow: 0 0 50px rgba(107, 220, 207, 0.5); }
        
        .pill-card { 
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .pill-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .abstract-line {
            position: absolute; width: 150%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(107, 220, 207, 0.2), transparent);
            transform: rotate(-15deg);
        }

        /* 特殊美化的 for 样式 */
        .for-style {
            font-family: serif;
            background: linear-gradient(to right, rgba(255,255,255,0.2), rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            position: relative;
            display: inline-block;
            margin: 0 1rem;
        }
        .for-style::after {
            content: '';
            position: absolute;
            top: -10px;
            right: -5px;
            width: 8px;
            height: 8px;
            background: #6BDCCF;
            border-radius: 50%;
            filter: blur(4px);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
    </style>
</head>
<body>
    <div id="page_container" class="p-16 flex flex-col justify-between">
        <div class="abstract-line top-[20%] left-[-25%]"></div>
        <div class="abstract-line top-[80%] left-[-25%]"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-[#2563EB] blur-[180px] opacity-10"></div>

        <header class="flex justify-between items-start w-full z-20">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#6BDCCF] to-[#4D9FFF] flex items-center justify-center text-[#1A235D] text-lg shadow-lg rotate-3">
                        <i class="fa-solid fa-notes-medical"></i>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-white rounded-full flex items-center justify-center border-2 border-[#1A235D]">
                        <div class="w-1.5 h-1.5 bg-[#2563EB] rounded-full animate-pulse"></div>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-bold tracking-[0.2em] text-lg leading-none uppercase">Borcelle</span>
                    <span class="text-[#6BDCCF] text-[8px] font-bold tracking-[0.4em] uppercase mt-1">Health Initiative</span>
                </div>
            </div>
            <div class="px-4 py-1 border border-white/20 rounded-full text-[10px] tracking-[0.3em] opacity-40">STRATEGIC VISION 2030</div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center z-10">
            <div class="relative text-center">
                <span class="block text-[#669DF6] font-black tracking-[0.8em] text-[10px] opacity-60 mb-6 ml-4">COMMUNITY EFFORT REPORT</span>
                
                <h1 class="font-bold tracking-tighter leading-none">
                    <span class="text-[6.5rem] block mb-2 transition-all">Together</span>
                    <div class="flex items-center justify-center -mt-6 -mb-4">
                        <div class="h-[1px] w-16 bg-gradient-to-r from-transparent to-white/20"></div>
                        <span class="for-style text-5xl transform rotate-[-6deg]">for</span>
                        <div class="h-[1px] w-16 bg-gradient-to-l from-transparent to-white/20"></div>
                    </div>
                    <span class="text-[8rem] glow-text text-[#6BDCCF] block mt-2">Health</span>
                </h1>

                <p class="mt-10 text-[10px] tracking-[0.6em] text-white/30 uppercase">Helping Our Community Stay Healthy</p>
            </div>
        </main>

        <div class="flex justify-center gap-6 z-20 pb-4">
            <div class="pill-card rounded-full px-8 py-3 flex items-center gap-4 shadow-lg" style="background: linear-gradient(90deg, #2563EB, #1D4ED8);">
                <i class="fa-solid fa-user-circle text-white/30 text-sm"></i>
                <div class="flex flex-col">
                    <span class="text-[8px] font-black uppercase tracking-widest opacity-60">Presenter</span>
                    <span class="text-sm font-bold italic uppercase">Alex Rivera</span>
                </div>
            </div>

            <div class="pill-card rounded-full px-8 py-3 flex items-center gap-4 shadow-lg" style="background: linear-gradient(90deg, #669DF6, #4D9FFF); color: #1A235D;">
                <i class="fa-solid fa-award opacity-30 text-sm"></i>
                <div class="flex flex-col">
                    <span class="text-[8px] font-black uppercase tracking-widest opacity-50">Role</span>
                    <span class="text-sm font-bold italic uppercase">Program Lead</span>
                </div>
            </div>

            <div class="pill-card rounded-full px-8 py-3 flex items-center gap-4 shadow-lg" style="background: linear-gradient(90deg, #6BDCCF, #59C9BC); color: #1A235D;">
                <i class="fa-solid fa-calendar-alt opacity-30 text-sm"></i>
                <div class="flex flex-col">
                    <span class="text-[8px] font-black uppercase tracking-widest opacity-50">Date</span>
                    <span class="text-sm font-bold italic uppercase">Jan 26, 2026</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
