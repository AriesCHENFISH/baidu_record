<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact in Numbers - Redesign</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #1A235D; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; color: #FFFFFF; }
        .glow-text { text-shadow: 0 0 30px rgba(107, 220, 207, 0.4); }
        .circle-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div id="page_container" class="p-16 flex flex-col items-center">
        <div class="circle-ring w-[600px] h-[600px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="circle-ring w-[900px] h-[900px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-[#2563EB] blur-[120px] opacity-10"></div>

        <header class="flex justify-between items-start w-full z-20">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#6BDCCF] to-[#4D9FFF] flex items-center justify-center text-[#1A235D] text-xl shadow-lg rotate-3">
                        <i class="fa-solid fa-notes-medical"></i>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-white rounded-full flex items-center justify-center border-2 border-[#1A235D]">
                        <div class="w-1.5 h-1.5 bg-[#2563EB] rounded-full animate-pulse"></div>
                    </div>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-white font-bold tracking-[0.15em] text-xl leading-none uppercase">Borcelle</span>
                    <span class="text-[#6BDCCF] text-[10px] font-bold tracking-[0.3em] uppercase mt-1">Health Initiative</span>
                </div>
            </div>
            <h6 class="text-white opacity-60 text-lg font-medium tracking-widest pt-2">2030</h6>
        </header>

        <div class="relative z-10 mt-12 mb-20 text-center">
            <h1 class="text-7xl font-bold tracking-tighter leading-tight">
                Our Massive <span class="glow-text text-[#6BDCCF]">Impact in Numbers</span>
            </h1>
        </div>

        <div class="relative z-10 flex justify-between items-center w-full max-w-5xl px-10">
            <div class="flex flex-col items-center text-center group">
                <div class="w-48 h-48 rounded-full border-2 border-[#2563EB] flex flex-col items-center justify-center mb-6 bg-[#2563EB]/5 shadow-[0_0_40px_rgba(37,99,235,0.2)]">
                    <span class="text-5xl font-black italic">85%</span>
                    <i class="fa-solid fa-chart-line text-[#2563EB] mt-2 opacity-60"></i>
                </div>
                <h3 class="text-gl font-black tracking-[0.4em] uppercase text-[#669DF6]">Reach Rate</h3>
                <p class="text-gray-400 text-gl mt-3 max-w-[220px]">Total coverage of targeted rural communities.</p>
            </div>

            <div class="flex flex-col items-center text-center -mt-10">
                <div class="w-64 h-64 rounded-full bg-gradient-to-br from-[#669DF6] to-[#4D9FFF] flex flex-col items-center justify-center mb-6 shadow-[0_0_60px_rgba(102,157,246,0.3)]">
                    <span class="text-[#1A235D] text-7xl font-black italic">15k+</span>
                    <div class="h-1 w-16 bg-[#1A235D] mt-2 opacity-20"></div>
                </div>
                <h3 class="text-gl font-black tracking-[0.4em] uppercase text-white">Lives Touched</h3>
                <p class="text-gray-200 text-base mt-4 max-w-[250px] font-light">Individuals directly supported via medical intervention.</p>
            </div>

            <div class="flex flex-col items-center text-center group">
                <div class="w-48 h-48 rounded-full border-2 border-[#6BDCCF] flex flex-col items-center justify-center mb-6 bg-[#6BDCCF]/5 shadow-[0_0_40px_rgba(107,220,207,0.2)]">
                    <span class="text-5xl font-black italic text-[#6BDCCF]">120+</span>
                    <i class="fa-solid fa-handshake-angle text-[#6BDCCF] mt-2 opacity-60"></i>
                </div>
                <h3 class="text-gl font-black tracking-[0.4em] uppercase text-[#6BDCCF]">Partners</h3>
                <p class="text-gray-400 text-gl mt-3 max-w-[220px]">Active medical and logistics collaborators.</p>
            </div>
        </div>
    </div>
</body>
</html>
