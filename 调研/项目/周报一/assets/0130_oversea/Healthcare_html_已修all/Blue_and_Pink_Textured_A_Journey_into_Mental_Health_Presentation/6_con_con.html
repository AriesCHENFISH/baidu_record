<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myths vs. Facts - Presentation</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0F172A', 800: '#1E3A8A' },
                        slate: { 700: '#334155', 100: '#F1F5F9', 50: '#F8FAFC' }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Times New Roman"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Symmetric Teardrop Masks */
        .shape-teardrop-left {
            border-radius: 50% 50% 50% 5px;
            transform: rotate(-45deg);
            overflow: hidden;
            box-shadow: 20px 20px 60px rgba(15, 23, 42, 0.1);
        }
        .shape-teardrop-right {
            border-radius: 50% 50% 5px 50%;
            transform: rotate(45deg);
            overflow: hidden;
            box-shadow: -20px 20px 60px rgba(15, 23, 42, 0.1);
        }

        .shape-teardrop-left img { transform: rotate(45deg) scale(1.4); width: 100%; height: 100%; object-fit: cover; }
        .shape-teardrop-right img { transform: rotate(-45deg) scale(1.4); width: 100%; height: 100%; object-fit: cover; }

        .keyword-tag {
            @apply px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border transition-all;
        }

        h1 { letter-spacing: -0.02em; line-height: 1.1; }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-slate-50 rounded-b-full z-0 opacity-40"></div>

        <header class="absolute top-0 left-0 w-full px-16 py-12 flex justify-between items-start z-30">
            <div class="flex items-center gap-4">
                <div class="w-12 h-[2px] bg-navy-900 mt-6"></div>
                <div class="text-navy-900">
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-700 font-bold opacity-50">Page</p>
                    <p class="text-6xl font-serif font-bold leading-none">06</p>
                </div>
            </div>

            <div class="flex flex-wrap justify-end gap-3 max-w-md">
                <span class="keyword-tag border-navy-900 text-navy-900 bg-white shadow-sm">Fact-Check</span>
                <span class="keyword-tag border-slate-100 text-slate-700 bg-slate-50">Truth</span>
                <span class="keyword-tag border-navy-800 text-white bg-navy-800 shadow-md">Stigma</span>
            </div>
        </header>

        <main class="relative z-10 grid grid-cols-12 h-full items-center px-16 pt-12">
            
            <div class="col-span-3 flex justify-center items-center">
                <div class="shape-teardrop-left w-[260px] h-[260px] bg-slate-100 relative">
                    <img src="https://images.unsplash.com/photo-1634152962476-4b8a00e1915c?q=80&w=600&auto=format&fit=crop" alt="Abstract Art Left">
                    <div class="absolute inset-0 bg-navy-800 mix-blend-overlay opacity-20 pointer-events-none"></div>
                </div>
            </div>

            <div class="col-span-6 flex flex-col items-center text-center px-4">
                <div class="mb-12">
                    <h1 class="text-7xl font-serif font-bold text-navy-900 mb-4">
                        Myths <span class="font-light italic text-slate-400">vs.</span> Facts
                    </h1>
                    <p class="text-xl text-navy-800 font-medium tracking-[0.4em] uppercase opacity-60">Breaking the Stigma</p>
                </div>

                <div class="flex flex-col gap-10 items-center">
                    <div class="flex flex-col items-center">
                        <span class="w-1 h-8 bg-slate-200 mb-4"></span>
                        <p class="text-xl font-serif text-navy-900 leading-tight max-w-lg">
                            "Mental health issues are not a sign of personal weakness or character flaws."
                        </p>
                    </div>
                    
                    <div class="flex flex-col items-center">
                        <span class="w-1 h-8 bg-navy-800 mb-4"></span>
                        <p class="text-xl font-light text-slate-700 leading-relaxed max-w-md italic">
                            Recovery is possible for everyone when proper care and community support are provided.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-span-3 flex justify-center items-center">
                <div class="shape-teardrop-right w-[260px] h-[260px] bg-slate-100 relative">
                    <img src="https://images.unsplash.com/photo-1548235216-2591603598ac?q=80&w=600&auto=format&fit=crop" alt="Abstract Art Right">
                    <div class="absolute inset-0 bg-navy-800 mix-blend-overlay opacity-20 pointer-events-none"></div>
                </div>
            </div>
        </main>

        <div class="absolute bottom-12 left-1/2 -translate-x-1/2">
            <div class="w-32 h-[1px] bg-slate-200"></div>
        </div>
    </div>

</body>
</html>
