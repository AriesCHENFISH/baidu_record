<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Awareness Keynote</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0F172A',
                            800: '#1E3A8A',
                        },
                        slate: {
                            700: '#334155',
                            100: '#F1F5F9',
                            50: '#F8FAFC',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Times New Roman"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Teardrop Shape Mask */
        .shape-teardrop {
            border-radius: 50% 50% 50% 5px;
            transform: rotate(-45deg);
            overflow: hidden;
            box-shadow: 25px 25px 50px rgba(15, 23, 42, 0.1);
        }

        .shape-teardrop img {
            transform: rotate(45deg) scale(1.4);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Decorative Background */
        .bg-decoration {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(241, 245, 249, 1) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 0;
        }

        /* Floating Keywords Style */
        .keyword-tag {
            @apply px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border transition-all;
        }

        h1 {
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-decoration"></div>

        <header class="absolute top-0 left-0 w-full px-16 py-12 flex justify-between items-start z-20">
            <div class="flex items-center gap-4">
                <div class="w-12 h-[2px] bg-navy-900 mt-6"></div>
                <div class="text-navy-900">
                    <p class="text-xs uppercase tracking-[0.3em] text-slate-700 font-bold opacity-50">Section</p>
                    <p class="text-6xl font-serif font-bold leading-none">05</p>
                </div>
            </div>

            <div class="flex flex-wrap justify-end gap-3 max-w-md">
                <span class="keyword-tag border-navy-900 text-navy-900 bg-white shadow-sm">Awareness</span>
                <span class="keyword-tag border-slate-100 text-slate-700 bg-slate-50">Well-being</span>
                <span class="keyword-tag border-slate-100 text-slate-700 bg-slate-50">Support</span>
                <span class="keyword-tag border-navy-800 text-white bg-navy-800 shadow-md">Therapy</span>
                <span class="keyword-tag border-slate-100 text-slate-700 bg-slate-50">Empathy</span>
            </div>
        </header>

        <main class="relative z-10 grid grid-cols-12 h-full items-center pt-24">
            
            <div class="col-span-5 flex justify-center items-center pl-16">
                <div class="shape-teardrop w-[460px] h-[460px] bg-slate-100 relative">
                    <img src="https://images.unsplash.com/photo-1617791160505-6f00504e3519?q=80&w=1000&auto=format&fit=crop" alt="Mind" class="opacity-90">
                    <div class="absolute inset-0 bg-navy-800 mix-blend-overlay opacity-20 pointer-events-none" style="transform: rotate(45deg);"></div>
                </div>
            </div>

            <div class="col-span-7 pl-12 pr-16 flex flex-col justify-center">
                
                <div class="mb-12">
                    <h1 class="text-7xl font-serif font-bold text-navy-900 mb-6">
                        Common Mental <br>
                        Health Disorders
                    </h1>
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-1 bg-navy-800"></span>
                        <p class="text-2xl text-slate-700 font-light tracking-wide italic">
                            Understanding the Spectrum
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-x-8 gap-y-6 w-full max-w-2xl">
                    
                    <div class="flex flex-col gap-6">
                        <div class="group border-2 border-navy-900 rounded-full py-5 px-8 text-center hover:bg-navy-900 hover:text-white transition-all cursor-default">
                            <h3 class="font-bold text-lg mb-0.5">Example 01</h3>
                            <p class="text-sm opacity-80 uppercase tracking-wider font-medium">Anxiety Disorders</p>
                        </div>

                        <div class="bg-slate-100 rounded-full py-6 px-8 text-center shadow-sm border border-transparent hover:border-navy-800 transition-all cursor-default">
                            <h3 class="text-navy-900 font-bold text-lg mb-0.5">Example 02</h3>
                            <p class="text-slate-700 text-sm uppercase tracking-wider font-medium">Depression</p>
                        </div>
                    </div>

                    <div class="flex flex-col gap-6 mt-8"> 
                        <div class="bg-slate-100 rounded-full py-6 px-8 text-center shadow-sm border border-transparent hover:border-navy-800 transition-all cursor-default">
                            <h3 class="text-navy-900 font-bold text-lg mb-0.5">Example 03</h3>
                            <p class="text-slate-700 text-sm uppercase tracking-wider font-medium">Bipolar Disorder</p>
                        </div>

                         <div class="border-2 border-navy-900 rounded-full py-5 px-8 text-center hover:bg-navy-900 hover:text-white transition-all cursor-default">
                            <h3 class="font-bold text-lg mb-0.5">Example 04</h3>
                            <p class="text-sm opacity-80 uppercase tracking-wider font-medium">Eating Disorders</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <div class="absolute bottom-12 left-16">
            <div class="w-24 h-1 bg-slate-100"></div>
        </div>

    </div>

</body>
</html>
