<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Cover - Mental Health</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0F172A', 800: '#1E3A8A' },
                        slate: { 700: '#334155', 200: '#E2E8F0', 100: '#F1F5F9', 50: '#F8FAFC' }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Times New Roman"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #FFFFFF; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 背景巨型文字 */
        .bg-text-giant {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 260px;
            font-family: 'Times New Roman', serif;
            font-weight: 900;
            color: #FBFDFF;
            letter-spacing: -0.05em;
            z-index: 0;
            user-select: none;
        }

        /* 胶囊卡片通用样式 */
        .capsule-card {
            @apply px-10 py-5 rounded-full flex flex-col items-center justify-center transition-all duration-300 shadow-sm hover:shadow-md;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-text-giant">MIND</div>

        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1px] h-32 bg-navy-900 z-20 opacity-20"></div>

        <header class="absolute top-0 left-0 w-full px-20 py-16 flex justify-between items-start z-30">
            <div class="flex items-center gap-4">
                <div class="text-navy-900">
                    <p class="text-[10px] uppercase tracking-[0.5em] text-slate-400 font-bold mb-1">Vol. 2026</p>
                    <p class="text-6xl font-serif font-bold leading-none">01</p>
                </div>
            </div>

            <div class="flex gap-3">
                <span class="px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-[0.3em] border border-navy-900 text-navy-900 bg-white shadow-sm">Resilience</span>
                <span class="px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-[0.3em] bg-navy-800 text-white shadow-lg">Keynote</span>
            </div>
        </header>

        <main class="relative z-20 h-full flex flex-col justify-center items-center text-center px-20">
            <div class="flex flex-col items-center">
                <p class="text-[11px] font-bold text-navy-800 uppercase tracking-[0.7em] mb-12 opacity-50">
                    Empowering The Human Spirit
                </p>

                <h1 class="text-[110px] font-serif font-bold text-navy-900 leading-[0.85] mb-12 tracking-tight">
                    Understanding <br>
                    <span class="italic font-light text-slate-200 block mt-3">Mental Health</span>
                </h1>

                <div class="w-1.5 h-1.5 rounded-full bg-navy-800 mb-12 opacity-30"></div>

                <p class="text-2xl text-slate-700 font-light tracking-[0.2em] max-w-2xl leading-relaxed uppercase">
                    Breaking the Silence <br>
                    <span class="text-xs font-bold text-navy-900 tracking-[0.8em] mt-5 block">Building Resilience</span>
                </p>
            </div>
        </main>

        <footer class="absolute bottom-16 left-0 w-full px-20 flex justify-between items-end z-30">
            
            <div class="capsule-card bg-slate-100 border border-slate-200">
                <p class="text-[9px] text-slate-400 uppercase tracking-[0.4em] mb-1">Organization</p>
                <h4 class="text-sm font-bold text-navy-900 tracking-widest">THYNK UNLIMITED</h4>
            </div>

            <div class="capsule-card bg-navy-900 border border-white/20">
                <p class="text-[9px] text-white/40 uppercase tracking-[0.4em] mb-1">Lead Speaker</p>
                <h4 class="text-sm font-bold text-white tracking-widest uppercase">B. Henderson</h4>
            </div>

        </footer>
    </div>

</body>
</html>
