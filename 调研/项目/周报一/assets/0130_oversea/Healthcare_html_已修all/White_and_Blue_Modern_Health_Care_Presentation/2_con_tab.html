<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { medBlue: '#005BB7', medGreen: '#22C55E', medDark: '#1A1A1A', medGray: '#F8FAFC' }}}
        }
    </script>
    <style>
        .page_container { width: 1280px; height: 720px; background: #FFF; position: relative; margin: 0 auto; overflow: hidden; }
        .category-num { font-size: 80px; font-weight: 900; line-height: 1; opacity: 0.05; position: absolute; top: -10px; left: -10px; z-index: 0; }
    </style>
</head>
<body>
    <div class="page_container p-20">
        <div class="absolute top-0 right-0 w-1/3 h-full bg-medGray -z-10"></div>
        
        <div class="mb-16">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-1.5 bg-medGreen"></div>
                <span class="text-sm font-black text-medBlue uppercase tracking-[0.4em]">Content Directory</span>
            </div>
            <h1 class="text-6xl font-black text-medDark tracking-tighter uppercase">Outline.</h1>
        </div>

        <div class="grid grid-cols-3 gap-x-16 gap-y-12">
            <script>
                const contents = [
                    "Hospital Overview", "Clinical Strategy", "Patient Care System",
                    "Technology & Innovation", "Performance Metrics", "Financial Summary",
                    "Research Initiatives", "Community Impact", "Future Roadmap"
                ];
                document.write(contents.map((text, i) => `
                    <div class="relative group">
                        <span class="category-num text-medBlue">${(i+1).toString().padStart(2, '0')}</span>
                        <div class="relative z-10 pt-4">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-xs font-black text-medBlue italic">PART</span>
                                <div class="h-[1px] flex-1 bg-gray-100"></div>
                                <span class="text-xs font-bold text-medGreen">0${i+1}</span>
                            </div>
                            <h3 class="text-xl font-black text-medDark uppercase leading-tight tracking-tight">${text}</h3>
                            <div class="mt-3 w-8 h-1 bg-medBlue"></div>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>

        <div class="absolute bottom-12 left-20 flex items-center gap-6">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold text-gray-300 tracking-[0.2em] uppercase">Document Classification</span>
                <span class="text-sm font-bold text-medDark italic">Strictly Confidential / Medical Group 2026</span>
            </div>
        </div>

        <div class="absolute bottom-12 right-20 flex items-baseline gap-2">
            <span class="text-sm font-black text-medBlue uppercase">INDEX</span>
            <span class="text-6xl font-black text-medDark leading-none">02</span>
        </div>
    </div>
</body>
</html>
