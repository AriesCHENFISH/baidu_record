<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borcelle Hospital - Cover Page</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-primary': '#005BB7', // 医疗蓝
                        'medical-dark': '#1A1A1A',    // 深灰色
                        medGreen: '#22C55E',          // 健康绿
                        medGray: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container {
            width: 1280px;
            height: 720px;
            background-color: #FFFFFF;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }

        /* 背景网格点缀 */
        .bg-grid {
            background-image: radial-gradient(#005BB7 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            opacity: 0.05;
        }

        /* 引用图标样式 */
        .quote-icon {
            font-size: 48px;
            color: #22C55E; /* 健康绿 */
            opacity: 0.2;
            margin-bottom: -20px;
            margin-left: -40px;
        }
    </style>
</head>
<body>

    <div class="page_container">
        <div class="absolute inset-0 bg-grid"></div>
        
        <div class="absolute right-[-120px] top-1/2 -translate-y-1/2 opacity-[0.04]">
            <i class="fa-solid fa-notes-medical text-[850px] text-medical-primary"></i>
        </div>

        <header class="relative z-50 pt-10 px-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-medical-primary flex items-center justify-center rounded-xl shadow-md">
                    <i class="fa-solid fa-hospital text-white"></i>
                </div>
                <div>
                    <h2 class="text-xl font-black text-medical-dark leading-none">BORCELLE</h2>
                    <p class="text-[14px] text-medical-primary font-bold tracking-tight">Medical Excellence</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-bold text-gray-300 tracking-[0.4em] uppercase">Annual Report 2026</p>
            </div>
        </header>

        <main class="relative z-10 h-[630px] flex flex-col items-center justify-center px-24">
            
            <div class="w-full max-w-4xl">
                <div class="quote-icon">
                    <i class="fa-solid fa-quote-right"></i>
                </div>
            </div>

            <div class="text-center mb-16">
                <h1 class="text-[100px] font-black text-medical-dark leading-[0.9] tracking-tighter">
                    Patient-Centered<br>
                    <span class="text-medical-primary">Excellence.</span>
                </h1>
                
                <div class="flex items-center justify-center gap-4 mt-10">
                    <div class="w-16 h-1 bg-medical-primary"></div>
                    <div class="w-4 h-1 bg-medGreen"></div>
                    <div class="w-4 h-1 bg-medGreen"></div>
                </div>
            </div>

            <div class="flex gap-16 border-t border-gray-100 pt-12">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.3em] mb-2">Lead Presenter</span>
                    <span class="text-xl font-black text-medical-dark uppercase">Dr. Jonathan Borcelle</span>
                </div>
                <div class="w-[1px] h-12 bg-gray-200"></div>
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.3em] mb-2">Division</span>
                    <span class="text-xl font-black text-medical-dark uppercase">Chief Medical Strategy</span>
                </div>
            </div>

        </main>

        <footer class="absolute bottom-12 left-20 right-20 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-medGreen animate-pulse"></div>
                <span class="text-[10px] font-bold text-gray-300 uppercase tracking-[0.5em]">Advancing Healthcare Tomorrow</span>
            </div>
            <div class="text-[10px] font-bold text-gray-300 uppercase">Document ID: BH-2026-X1</div>
        </footer>

    </div>

</body>
</html>
