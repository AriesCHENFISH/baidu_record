<!DOCTYPE html>
<html lang="en">
<head>

        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#EBFA5D', pureBlack: '#000000' },

    <style>

<body>
    <div id="page_container" class="p-12 flex flex-col">
        <header class="flex justify-between items-center relative z-20 mb-10">
            <div class="flex items-center gap-3 bg-white border-[3px] border-pureBlack rounded-full py-2 px-6 shadow-hard-sm">

            <div class="bg-white/40 border-[3px] border-black p-8 rounded-2xl flex flex-col justify-center backdrop-blur-sm">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-1 bg-black"></div>

                </div>
                <h3 class="text-4xl font-black uppercase mb-4 leading-tight">Beyond The Standard</h3>
                <ul class="space-y-3 font-bold text-lg">
                    <li class="flex items-center gap-3"><i class="fa-solid fa-bolt text-xl text-pureBlack"></i> Precision Diagnostics</li>
                    <li class="flex items-center gap-3"><i class="fa-solid fa-bolt text-xl text-pureBlack"></i> Global Awareness</li>
