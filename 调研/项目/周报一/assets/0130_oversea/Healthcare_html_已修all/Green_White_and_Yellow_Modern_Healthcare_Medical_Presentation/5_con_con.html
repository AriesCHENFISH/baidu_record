<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Activity Benefits - Borcelle Hospital</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%3B900%26display%3Dswap.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#EBFA5D', dark: '#1a1a1a', pureBlack: '#000000' },
                    fontFamily: { sans: ['Noto Sans SC', 'Inter', 'sans-serif'] },
                    boxShadow: { 'hard': '8px 8px 0px 0px #000000', 'hard-sm': '4px 4px 0px 0px #000000' }
                }
            }
        }
    </script>

    <style>
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #EBFA5D; overflow: hidden; }
        .text-outline { color: transparent; -webkit-text-stroke: 2px #000; }
        .bg-grid { background-image: radial-gradient(#000 1px, transparent 1px); background-size: 30px 30px; opacity: 0.05; }
    </style>
</head>
<body>
    <div id="page_container" class="flex p-16 items-center justify-between">
        <div class="absolute inset-0 bg-grid pointer-events-none"></div>

        <header class="absolute top-12 left-16 right-16 flex justify-between items-center z-50">
            <div class="flex items-center gap-3 bg-white border-[3px] border-pureBlack rounded-full py-2 px-6 shadow-hard-sm">
                <div class="w-8 h-8 bg-pureBlack flex items-center justify-center rounded-full shrink-0">
                    <i class="fa-solid fa-heart-pulse text-primary text-sm"></i>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-xs font-bold uppercase text-gray-500">Hospital</span>
                    <span class="text-lg font-black text-pureBlack uppercase">Borcelle</span>
                </div>
            </div>
            <div class="font-mono text-sm font-bold border-[3px] border-pureBlack px-3 py-1 bg-pureBlack text-primary shadow-hard-sm">KEYNOTE 2026</div>
        </header>

        <div class="w-[55%] flex flex-col justify-center h-full z-10 pt-12">
            <h1 class="text-7xl font-black text-pureBlack leading-[0.85] tracking-tighter mb-8 uppercase transform -rotate-1">
                <span class="text-outline block">Physical</span>
                <span class="block">Activity</span>
                <span class="text-outline block">Benefits</span>
            </h1>

            <div class="bg-white border-[3px] border-pureBlack p-8 rounded-2xl shadow-hard relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-2 opacity-10 group-hover:rotate-12 transition-transform">
                    <i class="fa-solid fa-person-running text-8xl"></i>
                </div>
                <p class="text-xl font-medium leading-relaxed text-justify relative z-10">
                    Daily activity <span class="bg-primary px-1 font-bold border border-black">improves circulation</span> and heart function. Simple movements like walking or stretching regulate weight and support faster recovery from illness.
                </p>
            </div>

            <div class="mt-8 inline-flex">
                <div class="flex items-center gap-4 border-[3px] border-black bg-black text-primary px-8 py-3 shadow-hard-sm transform hover:translate-x-1 transition-transform">
                    <span class="text-xl font-black italic uppercase">Move. Strengthen. Thrive.</span>
                    <i class="fa-solid fa-bolt"></i>
                </div>
            </div>
        </div>

        <div class="w-[40%] flex items-center justify-center relative">
            <div class="relative w-[380px] h-[500px] border-[3px] border-black rounded-[40px] overflow-hidden shadow-hard bg-white transform rotate-2">
                <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700">
            </div>

            <div class="absolute bottom-4 -left-12 bg-pureBlack p-6 rounded-2xl border-[3px] border-black w-[220px] shadow-hard transform -rotate-3 group hover:rotate-0 transition-all">
                <div class="flex justify-between items-start mb-4">
                    <i class="fa-solid fa-chart-line text-primary text-xl"></i>
                    <span class="text-[10px] font-bold text-white uppercase tracking-widest opacity-50 font-mono">Statistical Impact</span>
                </div>
                <h2 class="text-6xl font-black text-primary leading-none mb-2">70%</h2>
                <div class="h-1 w-full bg-gray-800 mb-3"></div>
                <p class="text-xs font-bold text-white uppercase leading-tight tracking-tighter">Lower Risk of<br>Chronic Illness</p>
            </div>
        </div>
    </div>
</body>
</html>
