<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Cover - Photography Portfolio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #000; position: relative; margin: 0 auto; overflow: hidden; }
        .glow-spot-left { background: radial-gradient(circle, rgba(244, 248, 152, 0.1) 0%, rgba(0,0,0,0) 70%); filter: blur(60px); border-radius: 50%; }
        .text-outline { -webkit-text-stroke: 1px rgba(255,255,255,0.2); color: transparent; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="glow-spot-left absolute -top-[150px] -left-[150px] w-[600px] h-[600px] z-0"></div>
        <div class="absolute -top-[50px] -left-[50px] z-1 opacity-50 rotate-[-15deg]">
            <i class="fa-solid fa-certificate text-[240px] text-[#F4F898]"></i>
        </div>

        <div class="relative z-10 w-full h-full flex flex-col items-center justify-center px-16">
            
            <div class="absolute top-12 flex gap-4">
                <span class="text-xs tracking-[0.4em] text-[#F4F898] uppercase font-bold">Minimalism</span>
                <span class="text-xs tracking-[0.4em] text-white/40 uppercase">Aesthetic</span>
                <span class="text-xs tracking-[0.4em] text-white/40 uppercase">Precision</span>
            </div>

            <div class="relative text-center mb-12">
                <h1 class="text-outline text-[180px] font-black leading-none uppercase tracking-tighter opacity-30">PORTFOLIO</h1>
                <h1 class="absolute inset-0 flex items-center justify-center text-9xl font-black text-white tracking-widest">
                    AARON <span class="text-[#F4F898] ml-6">LOEB</span>
                </h1>
            </div>

            <div class="flex flex-col items-center">
                <div class="w-20 h-[2px] bg-[#F4F898] mb-6"></div>
                <h2 class="text-xl tracking-[0.5em] text-white font-light uppercase mb-12">Visual Collections 2026</h2>
                
                <div class="grid grid-cols-2 gap-20 text-sm tracking-widest text-white/60">
                    <div class="text-right border-r border-white/20 pr-20 py-2">
                        <p class="font-bold text-white mb-1">PRESENTER</p>
                        <p>Aaron Loeb Creative</p>
                    </div>
                    <div class="text-left py-2">
                        <p class="font-bold text-white mb-1">DATE</p>
                        <p>January 22, 2026</p>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-12 right-16">
                <i class="fa-solid fa-arrow-right-long text-4xl text-[#F4F898] opacity-80 cursor-pointer"></i>
            </div>
        </div>
    </div>
</body>
</html>
