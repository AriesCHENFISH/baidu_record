<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title Slide - Premium Y2K</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --y2k-pink: #E685B5; --y2k-blue: #5E7CB3; --y2k-yellow: #F2E96B; --y2k-dark: #1B2A59; }
        body { font-family: 'Space+Grotesk', sans-serif; }
        .font-sync { font-family: 'Syncopate', sans-serif; }
        .bg-grid-pattern { background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px); }
        .paper-overlay { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.05; pointer-events: none; }
        .shadow-y2k { box-shadow: 10px 10px 0px var(--y2k-dark); }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.5); }
        @keyframes cd-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-cd { animation: cd-rotate 8s linear infinite; }
    </style>
</head>
<body>
    <div id="page_container" class="relative overflow-hidden mx-auto bg-white shadow-2xl" style="width: 1280px; height: 720px;">
        <div class="absolute top-0 left-0 w-full h-1/2 bg-[#5E7CB3] z-0"></div>
        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-[#E685B5] bg-grid-pattern z-0"></div>
        <div class="absolute inset-0 paper-overlay z-10"></div>

        <div class="absolute top-[15%] right-[10%] w-64 h-64 rounded-full bg-gradient-to-tr from-blue-300 via-pink-200 to-yellow-100 opacity-60 border-8 border-white/40 animate-cd z-10 flex items-center justify-center">
            <div class="w-16 h-16 bg-white rounded-full border-4 border-[#1B2A59]"></div>
        </div>

        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-[52%] w-[92%] h-[80%] glass-card rounded-2xl shadow-y2k z-20 flex flex-col items-center justify-center p-10 border-4 border-white">
            <div class="text-center space-y-6">
                <div class="bg-[#1B2A59] px-12 py-6 transform -rotate-2 shadow-[8px_8px_0px_#F2E96B]">
                    <h1 class="text-white text-7xl font-sync font-bold tracking-tighter leading-none">
                        Y2K_GROUP<br>
                        <span class="text-[#F2E96B] text-5xl italic">PROJECT_PRESENTATION</span>
                    </h1>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <p class="text-[#1B2A59] font-bold text-xl tracking-[0.3em] uppercase">Visualizing the Future Through the Past</p>
                    <div class="w-32 h-1 bg-[#1B2A59]"></div>
                    <p class="text-[#1B2A59] opacity-70 text-sm font-mono uppercase italic mt-4">Final Review // Sector_2026</p>
                </div>
            </div>
        </div>

        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] z-30">
            <div class="bg-[#1B2A59] h-16 rounded-xl flex items-center justify-between px-8 shadow-y2k border-2 border-white/30">
                <div class="flex items-center space-x-4">
                    <div class="flex space-x-1">
                        <div class="w-3 h-3 bg-[#E685B5] rounded-full"></div>
                        <div class="w-3 h-3 bg-[#F2E96B] rounded-full"></div>
                        <div class="w-3 h-3 bg-[#5E7CB3] rounded-full"></div>
                    </div>
                    <span class="text-white/60 font-mono text-xs uppercase tracking-[0.3em]">Directory: root/presentation</span>
                </div>
                <h4 class="text-white font-bold text-lg tracking-widest uppercase italic">NEXT: TABLE_OF_CONTENTS <i class="fa-solid fa-chevron-right ml-2 animate-pulse"></i></h4>
            </div>
        </div>
    </div>
</body>
</html>
