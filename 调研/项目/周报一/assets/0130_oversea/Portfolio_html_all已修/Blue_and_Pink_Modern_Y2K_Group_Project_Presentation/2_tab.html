<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents - Premium Y2K</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --y2k-pink: #E685B5; --y2k-blue: #5E7CB3; --y2k-yellow: #F2E96B; --y2k-dark: #1B2A59; }
        body { font-family: 'Space+Grotesk', sans-serif; }
        .font-sync { font-family: 'Syncopate', sans-serif; }
        .bg-grid-pattern { background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.15) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.15) 1px, transparent 1px); }
        .paper-overlay { background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); opacity: 0.05; pointer-events: none; }
        .shadow-y2k { box-shadow: 8px 8px 0px var(--y2k-dark); }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.5); }
        .index-number { -webkit-text-stroke: 1px var(--y2k-dark); color: transparent; font-family: 'Syncopate'; }
    </style>
</head>
<body>
    <div id="page_container" class="relative overflow-hidden mx-auto bg-white" style="width: 1280px; height: 720px;">
        <div class="absolute top-0 left-0 w-full h-1/2 bg-[#5E7CB3] z-0"></div>
        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-[#E685B5] bg-grid-pattern z-0"></div>
        <div class="absolute inset-0 paper-overlay z-10"></div>

        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-[52%] w-[92%] h-[80%] glass-card rounded-2xl shadow-y2k z-20 flex flex-col p-10 border-4 border-white">
            <!-- 标题栏 -->
            <div class="bg-[#1B2A59] px-10 py-4 transform -rotate-1 self-start mb-8 shadow-[6px_6px_0px_#E685B5]">
                <h1 class="text-white text-3xl font-sync font-bold tracking-tighter">INDEX_CONTENTS</h1>
            </div>

            <!-- 9标题网格布局 -->
            <div class="grid grid-cols-3 gap-5 flex-1 overflow-hidden pb-4">
                <!-- 条目模板，重复9次 -->
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">01</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Project Background</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">02</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Target Audience</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">03</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Visual Style</h3>
                </div>
                <div class="group bg-[#F2E96B] border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-100">04</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Technical Stack</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">05</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Development Log</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">06</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">User Interface</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">07</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Team Core Unit</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">08</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Major Challenges</h3>
                </div>
                <div class="group bg-white border-2 border-[#1B2A59] p-4 shadow-y2k flex flex-col justify-between hover:bg-[#F2E96B] transition-all cursor-pointer">
                    <span class="index-number text-3xl opacity-40 group-hover:opacity-100">09</span>
                    <h3 class="text-[#1B2A59] font-bold text-base uppercase">Final Summary</h3>
                </div>
            </div>
        </div>

        <!-- 底部一致的导航条 -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 w-[90%] z-30">
            <div class="bg-[#1B2A59] h-16 rounded-xl flex items-center justify-between px-8 shadow-y2k border-2 border-white/30">
                <div class="flex items-center space-x-4">
                    <div class="flex space-x-1"><div class="w-3 h-3 bg-[#E685B5] rounded-full"></div><div class="w-3 h-3 bg-[#F2E96B] rounded-full"></div><div class="w-3 h-3 bg-[#5E7CB3] rounded-full"></div></div>
                    <span class="text-white/60 font-mono text-xs uppercase tracking-[0.3em]">Directory: root/project_v1</span>
                </div>
                <h4 class="text-white font-bold text-lg tracking-widest uppercase italic">NEXT: 01_INTRODUCTION <i class="fa-solid fa-chevron-right ml-2 animate-pulse"></i></h4>
            </div>
        </div>
    </div>
</body>
</html>
