<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Let's Work Together - Harper Russo</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { blue: '#3B71F3', black: '#000000', accent: '#6F9FFF', dark: '#1A1A1A' } },
                    boxShadow: { 'pop': '10px 10px 0px 0px rgba(0,0,0,1)', 'pop-sm': '4px 4px 0px 0px rgba(0,0,0,1)' }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; background-color: #3B71F3;
            position: relative; margin: 0 auto; overflow: hidden;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .text-outline { -webkit-text-stroke: 3px black; color: white; }
        .deco-grid {
            background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px);
            background-size: 15px 15px; border: 2px solid black;
        }
        .text-mega { font-size: 140px; line-height: 0.8; letter-spacing: -0.05em; }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col">
        
        <header class="w-full flex justify-between items-center px-12 py-8 z-30">
            <div class="flex items-center gap-4">
                <div class="bg-black text-white p-2 px-4 rotate-[-2deg] font-black text-2xl shadow-pop-sm border-2 border-black">C.T</div>
                <div class="h-[2px] w-24 bg-black"></div>
            </div>
            
            <div class="flex gap-4">
                <span class="bg-white border-2 border-black px-6 py-1 rounded-full font-bold uppercase tracking-widest text-sm shadow-pop-sm">Contact</span>
                <span class="bg-black text-brand-accent border-2 border-black px-6 py-1 rounded-full font-bold uppercase tracking-widest text-sm shadow-pop-sm">Collaboration</span>
            </div>

            <div class="flex gap-6 text-black text-2xl">
                <i class="fa-solid fa-paper-plane animate-bounce"></i>
            </div>
        </header>

        <main class="flex-1 px-12 flex flex-col justify-center z-10">
            <div class="mb-10 relative">
                <div class="absolute -top-12 right-1/4 w-32 h-32 deco-grid rounded-full opacity-20"></div>
                
                <h1 class="font-black text-black text-mega uppercase">
                    LET'S WORK<br>
                    <span class="text-outline italic">TOGETHER</span>
                </h1>
            </div>

            <div class="grid grid-cols-12 gap-8 items-start mb-16">
                <div class="col-span-7">
                    <div class="bg-white border-4 border-black p-8 shadow-pop rotate-[-1deg]">
                        <p class="text-brand-dark text-lg leading-relaxed font-bold text-justify">
                            Ready to transform your vision into a bold visual statement? We specialize in high-impact creative direction and digital storytelling. Let's create something that stays in people's minds forever.
                        </p>
                    </div>
                </div>
                <div class="col-span-5 flex flex-col justify-center items-end">
                    <div class="w-48 h-48 deco-grid shadow-pop rotate-[5deg] bg-brand-accent/30 flex items-center justify-center">
                        <i class="fa-solid fa-star text-black text-6xl"></i>
                    </div>
                </div>
            </div>
        </main>

        <footer class="px-12 pb-12 grid grid-cols-3 gap-6 z-20">
            <div class="bg-black text-brand-accent border-2 border-white p-6 rounded-xl flex items-center justify-center gap-4 shadow-pop-sm hover:translate-y-[-4px] transition-all cursor-pointer group">
                <i class="fa-solid fa-phone text-xl group-hover:rotate-12 transition-transform"></i>
                <span class="font-black tracking-tighter text-lg">+123-456-7890</span>
            </div>

            <div class="bg-white text-black border-4 border-black p-6 rounded-xl flex items-center justify-center gap-4 shadow-pop-sm hover:translate-y-[-4px] transition-all cursor-pointer group">
                <i class="fa-solid fa-envelope text-xl group-hover:scale-110 transition-transform"></i>
                <span class="font-black tracking-tighter text-lg uppercase italic">hello@reallygreat.com</span>
            </div>

            <div class="bg-brand-accent text-black border-4 border-black p-6 rounded-xl flex items-center justify-center gap-4 shadow-pop-sm hover:translate-y-[-4px] transition-all cursor-pointer group">
                <i class="fa-solid fa-location-dot text-xl group-hover:bounce transition-all"></i>
                <span class="font-black tracking-tighter text-lg uppercase">Global Remote</span>
            </div>
        </footer>

        <div class="absolute inset-0 pointer-events-none opacity-10 z-0" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
    </div>

</body>
</html>
