<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        #page_container { width: 1280px; height: 720px; margin: 0 auto; background: #FFF; overflow: hidden; position: relative; font-family: "Noto Sans SC", sans-serif; }
        .outline-text { -webkit-text-stroke: 1.5px black; color: transparent; }
        /* 垂直装饰文字 */
        .vertical-tag { writing-mode: vertical-rl; text-orientation: mixed; }
    </style>
</head>
<body>
    <div id="page_container" class="p-20 flex flex-col justify-between relative">
        
        <div class="absolute -left-10 top-20 text-[240px] font-black opacity-[0.02] uppercase italic select-none">Intro</div>

        <div class="flex items-center gap-4 relative z-20">
            <div class="w-12 h-[2px] bg-black"></div>
            <span class="uppercase tracking-[0.3em] text-xs font-bold text-black">Editorial Issue 2026</span>
        </div>

        <div class="flex-1 flex flex-col justify-center items-center relative z-10">
            <div class="text-center">
                <h1 class="text-[120px] leading-[0.8] font-black tracking-tighter uppercase mb-2">
                    CREATIVE
                </h1>
                <h1 class="text-[120px] leading-[0.8] font-black tracking-tighter uppercase outline-text italic pl-24">
                    PORTFOLIO
                </h1>
            </div>

            <div class="mt-16 flex items-center gap-6">
                <div class="w-16 h-[1px] bg-black opacity-10"></div>
                <p class="text-[10px] font-bold uppercase tracking-[0.8em] text-gray-400">Selected Works / Creative Direction</p>
                <div class="w-16 h-[1px] bg-black opacity-10"></div>
            </div>
        </div>

        <div class="flex justify-between items-end relative z-20 border-t border-gray-100 pt-10">
            <div class="flex flex-col">
                <span class="text-[10px] font-black uppercase tracking-widest text-black mb-1">Presented By</span>
                <span class="text-3xl font-black italic tracking-tighter uppercase">Mariana Napolitani</span>
            </div>

            <div class="flex items-baseline gap-6">
                <div class="flex flex-col items-end">
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest">Release Date</span>
                    <span class="text-base font-bold text-black tracking-tight italic">MAY 09, 2026</span>
                </div>
                <span class="text-8xl font-black italic opacity-[0.03] leading-none -mb-4">01</span>
            </div>
        </div>

        <div class="absolute right-10 top-1/2 -translate-y-1/2 vertical-tag">
            <span class="text-[9px] font-bold text-gray-300 uppercase tracking-[1.2em]">Visual Communication Excellence</span>
        </div>

    </div>
</body>
</html>
