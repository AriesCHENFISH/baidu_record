<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio - Cover Slide</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #B23A2E;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 统一网格背景 */
        .grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        /* 撕纸效果 */
        .torn-paper {
            background-color: #F2EFED;
            background-image: url('https://images.unsplash.com/photo-1586075010923-2dd4570fb338?q=80&w=1280&auto=format&fit=crop');
            background-size: cover;
            background-blend-mode: multiply;
            clip-path: polygon(
                2% 2%, 10% 0%, 20% 2%, 30% 0%, 40% 1%, 50% 0%, 60% 2%, 70% 0%, 80% 1%, 90% 0%, 100% 2%, 
                98% 10%, 100% 20%, 98% 30%, 100% 40%, 99% 50%, 100% 60%, 98% 70%, 100% 80%, 99% 90%, 97% 100%, 
                90% 98%, 80% 100%, 70% 98%, 60% 100%, 50% 99%, 40% 100%, 30% 98%, 20% 100%, 10% 99%, 0% 98%, 
                2% 90%, 0% 80%, 1% 70%, 0% 60%, 2% 50%, 0% 40%, 1% 30%, 0% 20%, 2% 10%
            );
        }

        .shadow-filter {
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.4));
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        .spin-slow {
            animation: spin 15s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 grid-pattern opacity-60"></div>
        <div class="absolute -top-20 -left-20 text-white/5 text-[40rem] font-black pointer-events-none">2027</div>

        <div class="absolute top-0 left-0 w-full p-10 flex justify-between items-start z-40">
            <div class="flex items-center gap-4">
                <div class="bg-[#0D0D0D] text-[#F2EFED] px-6 py-2.5 rounded-full flex items-center shadow-[5px_5px_0px_#F2EFED]">
                    <span class="text-xs font-black tracking-[0.25em] uppercase">Visual Project</span>
                    <span class="mx-3 w-2 h-2 bg-[#B23A2E] rounded-full animate-pulse-soft"></span>
                    <span class="text-xs font-bold opacity-80 italic">VOL. 2027</span>
                </div>
            </div>

            <div class="flex flex-col items-end gap-3 mr-4">
                <div class="flex gap-2">
                    <div class="bg-white px-4 py-8 rounded-full shadow-xl flex items-center justify-center transform hover:scale-105 transition-transform" style="writing-mode: vertical-rl;">
                        <span class="text-[#B23A2E] font-black text-sm tracking-[0.3em] uppercase">Jonathan Patterson</span>
                    </div>
                    <div class="bg-[#0D0D0D] px-3 py-6 rounded-full shadow-xl flex items-center justify-center" style="writing-mode: vertical-rl;">
                        <span class="text-white font-bold text-[10px] tracking-[0.4em] uppercase">Creative Director</span>
                    </div>
                </div>
                <div class="text-white/40 text-[10px] font-bold tracking-[0.5em] mt-2 uppercase">Dec • 2027 Showcase</div>
            </div>
        </div>

        <div class="absolute top-[20%] left-[10%] text-white/20 text-7xl spin-slow">
            <i class="fa-solid fa-asterisk"></i>
        </div>
        <div class="absolute bottom-[10%] right-[10%] text-white/10 text-9xl">
            <i class="fa-solid fa-cloud-bolt"></i>
        </div>

        <div class="absolute inset-0 flex items-center justify-center z-10">
            <div class="relative w-[850px] h-[550px] shadow-filter transform -rotate-1">
                
                <div class="w-full h-full torn-paper flex flex-col items-center justify-center text-center px-16 relative">
                    
                    <div class="absolute top-12 left-16 opacity-10 text-primary text-6xl">
                        <i class="fa-solid fa-quote-left"></i>
                    </div>

                    <h1 class="text-[#B23A2E] text-[130px] leading-[0.85] font-black tracking-tighter mb-6 italic" style="text-shadow: 4px 4px 0px rgba(0,0,0,0.05);">
                        Creative<br>Portfolio
                    </h1>
                    
                    <div class="flex items-center gap-6 mt-6 border-t-2 border-[#B23A2E]/20 pt-8">
                        <div class="w-12 h-12 rounded-full bg-[#B23A2E] flex items-center justify-center text-white shadow-lg animate-bounce">
                            <i class="fa-solid fa-arrow-down text-2xl"></i>
                        </div>
                        <h2 class="text-[#B23A2E] text-3xl font-black tracking-tight uppercase">Masterwork</h2>
                    </div>

                    <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 flex gap-4">
                        <div class="w-16 h-12 bg-white rounded-full border-4 border-[#0D0D0D] flex items-center justify-center shadow-lg">
                            <div class="w-6 h-6 bg-[#0D0D0D] rounded-full"></div>
                        </div>
                        <div class="w-16 h-12 bg-white rounded-full border-4 border-[#0D0D0D] flex items-center justify-center shadow-lg">
                            <div class="w-6 h-6 bg-[#0D0D0D] rounded-full"></div>
                        </div>
                    </div>
                </div>

                <div class="absolute -top-2 -left-8 bg-white border-4 border-[#0D0D0D] p-3 px-6 rounded-sm shadow-[6px_6px_0px_#0D0D0D] transform -rotate-12 z-20">
                    <span class="text-[#0D0D0D] font-black text-3xl italic tracking-tighter">HELLO!</span>
                </div>

                <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-[#F2EFED] border-4 border-white shadow-2xl rounded-full transform rotate-12 flex items-center justify-center z-20">
                    <div class="relative flex items-center justify-center">
                        <i class="fa-solid fa-heart text-[#B23A2E] text-8xl"></i>
                        <span class="absolute text-white font-black text-2xl italic">WOW</span>
                    </div>
                </div>

            </div>
        </div>

        <div class="absolute bottom-[-50px] left-1/2 -translate-x-1/2 w-[800px] h-[100px] border-t-4 border-dashed border-white/20 rounded-[50%]"></div>

    </div>

</body>
</html>
