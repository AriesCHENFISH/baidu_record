<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio - Table of Content</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#B23A2E',
                        secondary: '#F2EFED',
                        dark: '#0D0D0D',
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F2EFED;
            overflow: hidden;
        }

        /* 撕纸边缘效果 */
        .torn-paper-item {
            clip-path: polygon(
                2% 2%, 98% 0%, 100% 95%, 5% 100%, 0% 10%
            );
        }

        /* 进度条动画 */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        /* 标题高亮色块 */
        .title-highlight {
            background-image: linear-gradient(120deg, #B23A2E 0%, #B23A2E 100%);
            background-repeat: no-repeat;
            background-size: 100% 0.3em;
            background-position: 0 88%;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
            <img src="https://images.unsplash.com/photo-1586075010923-2dd4570fb338?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover">
        </div>

        <div class="absolute top-0 left-0 w-full p-10 flex justify-between items-center z-40">
            <div class="flex items-center gap-4">
                <div class="bg-dark text-secondary px-6 py-2.5 rounded-full flex items-center shadow-[5px_5px_0px_#B23A2E]">
                    <span class="text-xs font-black tracking-[0.25em] uppercase">Navigation Map</span>
                    <span class="mx-3 w-2 h-2 bg-primary rounded-full animate-pulse-soft"></span>
                    <span class="text-xs font-bold opacity-80 italic">INDEX. 2026</span>
                </div>
            </div>

            <div class="flex flex-col items-end text-dark">
                <span class="text-[11px] font-black tracking-[0.4em] uppercase opacity-70 mb-2">Portfolio / Phase 02</span>
                <div class="flex gap-1.5">
                    <div class="w-3 h-1.5 bg-dark/20"></div>
                    <div class="w-12 h-1.5 bg-dark"></div>
                    <div class="w-3 h-1.5 bg-dark/20"></div>
                    <div class="w-3 h-1.5 bg-dark/20"></div>
                </div>
            </div>
        </div>

        <main class="h-full flex items-center px-16 pt-20">
            <div class="w-1/3 flex flex-col justify-center">
                <div class="relative">
                    <h1 class="text-primary text-7xl font-black leading-[0.85] uppercase tracking-tighter italic">
                        Table <br> 
                        <span class="text-dark">Of</span> <br> 
                        <span class="title-highlight">Content</span>
                    </h1>
                    <div class="mt-8 flex gap-4 opacity-30 text-dark">
                        <i class="fa-solid fa-asterisk text-4xl animate-spin" style="animation-duration: 10s;"></i>
                        <i class="fa-solid fa-arrow-down text-4xl"></i>
                    </div>
                </div>
            </div>

            <div class="w-2/3 grid grid-cols-3 gap-6 pr-10">
                <script>
                    const items = [
                        "Introduction", "About Me", "Education", 
                        "Skills", "Experience", "Portfolio", 
                        "Phase 01", "Phase 02", "Best Work", 
                        "Quotes", "Contact", "Thank You"
                    ];
                    
                    document.write(items.map((item, index) => `
                        <div class="bg-white p-4 torn-paper-item shadow-lg border border-dark/5 transform ${index % 2 === 0 ? 'rotate-1' : '-rotate-1'} hover:rotate-0 hover:scale-105 transition-all duration-300 group cursor-pointer">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-[10px] font-black text-primary italic tracking-widest">${String(index + 1).padStart(2, '0')}</span>
                                <i class="fa-solid fa-plus text-[8px] opacity-20 group-hover:opacity-100 group-hover:rotate-90 transition-all"></i>
                            </div>
                            <h3 class="text-dark font-black text-lg uppercase tracking-tighter leading-none group-hover:text-primary transition-colors">${item}</h3>
                        </div>
                    `).join(''));
                </script>
            </div>
        </main>

        <div class="absolute bottom-[-20px] left-10 text-dark/5 text-[15rem] font-black select-none pointer-events-none">
            INDEX
        </div>

        <div class="absolute bottom-10 right-16 transform rotate-12 z-50">
            <div class="bg-primary text-white px-8 py-3 rounded-sm border-4 border-dark shadow-[8px_8px_0px_#0D0D0D]">
                <span class="font-black text-3xl italic tracking-widest uppercase">Select!</span>
            </div>
        </div>

    </div>

</body>
</html>
