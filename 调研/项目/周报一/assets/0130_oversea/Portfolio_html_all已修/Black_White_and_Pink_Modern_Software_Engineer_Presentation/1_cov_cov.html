<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover - THYNK Style</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container { width: 1280px; height: 720px; background-color: #050505; position: relative; margin: 0 auto; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; color: white; }
        .logo-container { border-left: 3px solid #E87EA1; padding-left: 1.5rem; }
        .logo-text { font-family: serif; letter-spacing: 0.2em; line-height: 1; }
        .text-outline { -webkit-text-stroke: 1px rgba(232, 126, 161, 0.15); color: transparent; font-size: 160px; line-height: 1; pointer-events: none; }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { brandPink: '#E87EA1' } } } }
    </script>
</head>
<body>
    <div class="page_container">
        <!-- 背景装饰大字 -->
        <div class="absolute -top-10 -right-20 text-outline font-black uppercase">Engineer</div>

        <div class="grid grid-cols-12 h-full">
            <!-- 左侧：视觉区 (5列) -->
            <div class="col-span-5 relative overflow-hidden border-r border-white/5">
                <img src="https://images.unsplash.com/photo-1573164713988-8665fc963095?q=80&w=1280&auto=format&fit=crop" 
                     class="w-full h-full object-cover grayscale brightness-50">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent to-[#050505]/80"></div>
                <!-- 底部装饰 -->
                <div class="absolute bottom-12 left-12 flex items-center gap-4">
                    <div class="w-12 h-[1px] bg-brandPink"></div>
                    <span class="text-[10px] tracking-[0.5em] uppercase text-white/40">Established 2024</span>
                </div>
            </div>

            <!-- 右侧：标题与信息 (7列) -->
            <div class="col-span-7 p-20 flex flex-col justify-between">
                <!-- 统一 Logo -->
                <div class="logo-container flex flex-col">
                    <div class="text-3xl font-light logo-text">THYNK<span class="font-bold text-brandPink ml-1">.</span></div>
                    <div class="text-[10px] uppercase tracking-[0.8em] text-brandPink/60 mt-3 font-medium">Systems Unlimited</div>
                </div>

                <!-- 主标题 -->
                <div class="relative">
                    <div class="text-brandPink text-sm tracking-[0.4em] uppercase mb-4 font-bold italic">Annual Technology Keynote</div>
                    <h1 class="text-[100px] font-bold leading-[0.85] tracking-tighter">
                        SOFTWARE<br>
                        <span class="text-brandPink">ENGINEER</span>
                    </h1>
                    <div class="mt-8 text-3xl font-extralight tracking-[0.3em] text-white/50 uppercase">Infrastructure & Design</div>
                    
                    <!-- 装饰线条 -->
                    <div class="mt-12 flex gap-4">
                        <div class="w-24 h-[1px] bg-brandPink"></div>
                        <div class="w-4 h-[1px] bg-white/20"></div>
                        <div class="w-4 h-[1px] bg-white/20"></div>
                    </div>
                </div>

                <!-- 汇报人信息 -->
                <div class="flex items-end justify-between">
                    <div class="space-y-1">
                        <div class="text-brandPink font-mono text-xs uppercase tracking-widest">Presented By</div>
                        <div class="text-white text-xl font-bold tracking-widest">ALEX CHEN <span class="text-white/30 font-light mx-2">/</span> <span class="text-sm font-light text-white/60">SENIOR ARCHITECT</span></div>
                    </div>
                    <!-- 装饰播放图标 -->
                    <div class="text-white/20 text-4xl mb-1"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
        </div>
        <!-- 装饰点 -->
        <div class="absolute top-10 right-10 w-2 h-2 bg-brandPink"></div>
    </div>
</body>
</html>
