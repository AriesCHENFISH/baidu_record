<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Creative Portfolio</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <style>
        :root {
            --primary-glow: #6A44F2;
            --secondary-glow: #3D68FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #080808; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }

        /* 颗粒感噪点蒙层 */
        .noise-overlay {
            position: absolute; inset: 0; z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04; pointer-events: none;
        }

        /* 背景网格线 */
        .grid-bg {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        /* 动态霓虹光晕 */
        .neon-blob {
            position: absolute; border-radius: 50%; filter: blur(140px); z-index: 1;
            animation: move 20s infinite alternate ease-in-out;
        }
        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        /* 玻璃拟态增强 */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* 文字样式优化 */
        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            color: transparent;
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vertical-line {
            width: 1px; height: 60px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5), transparent);
        }

        .scan-line {
            position: absolute; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(106, 68, 242, 0.2), transparent);
            top: 0; animation: scan 8s linear infinite;
        }
        @keyframes scan {
            0% { top: -10%; } 100% { top: 110%; }
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- 背景层 -->
        <div class="noise-overlay"></div>
        <div class="grid-bg"></div>
        <div class="scan-line"></div>
        
        <div class="neon-blob" style="top: -100px; left: -100px; width: 600px; height: 600px; background: rgba(106, 68, 242, 0.4);"></div>
        <div class="neon-blob" style="bottom: -150px; right: -50px; width: 700px; height: 700px; background: rgba(61, 104, 255, 0.3); animation-delay: -5s;"></div>

        <!-- 顶部装饰与作者卡片 -->
        <div class="relative z-10 p-12 flex justify-between items-start">
            <div class="glass-card inline-flex items-center gap-5 px-6 py-4 rounded-3xl">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#6A44F2] to-[#3D68FF] flex items-center justify-center shadow-[0_0_20px_rgba(106,68,242,0.4)]">
                    <i class="fa-solid fa-bolt-lightning text-white text-2xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-[#808080] text-[10px] uppercase tracking-[0.3em] font-bold mb-1">Lead Creative Director</span>
                    <h4 class="text-white text-xl font-bold tracking-tight">Anna Katrina Marchesi</h4>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-white text-xs font-light tracking-[0.2em] opacity-40">EDITION</p>
                    <p class="text-white text-lg font-bold">2026 / VOL. 1</p>
                </div>
                <div class="vertical-line"></div>
                <div class="text-[40px] font-black text-white opacity-10">01</div>
            </div>
        </div>

        <!-- 主标题区 -->
        <div class="absolute inset-0 z-0 flex flex-col justify-center items-center pt-16">
            <div class="relative">
                <!-- 装饰小字 -->
                <div class="absolute -top-10 left-0 text-[#6A44F2] text-xs font-bold tracking-[0.5em] uppercase">
                    Personal Work Selection
                </div>
                
                <div class="flex flex-col items-center leading-[0.8]">
                    <h1 class="text-[170px] font-black tracking-tighter text-gradient-gold drop-shadow-2xl">
                        CREATIVE
                    </h1>
                    <h1 class="text-[170px] font-black tracking-tighter text-outline mt-2">
                        PORTFOLIO
                    </h1>
                </div>

                <!-- 底部装饰信息 -->
                <div class="mt-12 flex items-center justify-between w-full px-4">
                    <div class="flex gap-4 items-center">
                        <span class="w-12 h-[1px] bg-[#6A44F2]"></span>
                        <p class="text-[#B0B0B0] text-sm tracking-[0.2em] font-light">STRATEGY & DESIGN</p>
                    </div>
                    <div class="flex gap-8 items-center text-[#B0B0B0] text-sm tracking-widest font-medium">
                        <p>Project <span class="text-white ml-2">Showcase</span></p>
                        <span class="w-1.5 h-1.5 bg-[#6A44F2] rounded-full shadow-[0_0_10px_#6A44F2]"></span>
                        <p>Date <span class="text-white ml-2">09 May, 2026</span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右下角交互引导 -->
        <div class="absolute bottom-12 right-12 z-30 flex items-center gap-6 group cursor-pointer">
            <div class="text-right transition-transform group-hover:-translate-x-2 duration-500">
                <span class="block text-white text-[10px] font-bold uppercase tracking-[0.3em] opacity-40 mb-1">Click to reveal</span>
                <span class="block text-white text-sm font-medium uppercase tracking-[0.2em]">Start Journey</span>
            </div>
            <div class="relative flex items-center justify-center">
                <div class="absolute inset-0 bg-[#6A44F2] rounded-full blur-md opacity-0 group-hover:opacity-60 transition-opacity"></div>
                <div class="w-16 h-16 rounded-full border border-white/20 flex items-center justify-center text-white text-2xl group-hover:border-[#6A44F2] transition-colors duration-500">
                    <i class="fa-solid fa-chevron-right text-gradient-gold group-hover:translate-x-1 transition-transform"></i>
                </div>
            </div>
        </div>

        <!-- 侧边垂直小字装饰 -->
        <div class="absolute left-12 bottom-12 z-20 overflow-hidden">
            <p class="text-white/20 text-[10px] tracking-[0.5em] rotate-180 [writing-mode:vertical-lr] uppercase">
                Interactive Experience / Digital Art Direction
            </p>
        </div>

    </div>

</body>
</html>
