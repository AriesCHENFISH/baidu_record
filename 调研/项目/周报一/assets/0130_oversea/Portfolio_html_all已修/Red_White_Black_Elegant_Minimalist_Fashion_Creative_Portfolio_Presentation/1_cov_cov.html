<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Page - Creative Portfolio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#C9302C', dark: '#000000', light: '#FFFFFF', grey: '#F2F2F2' },
                    fontFamily: { 
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        header: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container { width: 1280px; height: 720px; background-color: #FFFFFF; position: relative; margin: 0 auto; overflow: hidden; }
        .outline-text { -webkit-text-stroke: 1.5px #000000; color: transparent; opacity: 0.1; }
    </style>
</head>
<body>

    <div class="page_container">
        <div class="absolute -right-20 -top-20 font-header outline-text text-[400px] leading-none select-none">
            2026
        </div>

        <div class="absolute top-12 left-32 flex gap-16 z-30">
            <div class="flex items-center gap-3">
                <span class="w-10 h-[2px] bg-primary"></span>
                <span class="font-header text-sm font-bold tracking-[0.5em] uppercase text-dark">Vision</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="w-10 h-[2px] bg-dark"></span>
                <span class="font-header text-sm font-bold tracking-[0.5em] uppercase text-dark">Strategy</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="w-10 h-[2px] bg-primary"></span>
                <span class="font-header text-sm font-bold tracking-[0.5em] uppercase text-dark">Execution</span>
            </div>
        </div>

        <div class="h-full flex flex-col justify-center px-32 relative z-20">
            <div class="mb-2">
                <span class="bg-dark text-white px-3 py-1 text-sm font-bold tracking-widest uppercase">Personal Showcase</span>
            </div>
            
            <h1 class="font-header text-[140px] leading-[0.85] font-black italic tracking-tighter">
                <span class="text-dark">CREATIVE</span><br>
                <span class="text-primary flex items-center">
                    PORTFOLIO
                    <span class="ml-4 h-6 flex-1 bg-dark translate-y-6"></span>
                </span>
            </h1>
            
            <div class="w-32 h-6 bg-primary mt-8"></div>
        </div>

        <div class="absolute bottom-0 right-0 w-[450px] bg-dark p-12 text-white shadow-2xl">
            <div class="relative">
                <div class="absolute -top-4 -left-4 w-8 h-8 border-t-4 border-l-4 border-primary"></div>
                
                <div class="space-y-6">
                    <div class="flex border-b border-gray-800 pb-4">
                        <div class="w-1/3 text-xs text-gray-500 uppercase tracking-widest">Presenter</div>
                        <div class="w-2/3 font-bold tracking-wide">ALEXANDER RIVERA</div>
                    </div>
                    <div class="flex border-b border-gray-800 pb-4">
                        <div class="w-1/3 text-xs text-gray-500 uppercase tracking-widest">Category</div>
                        <div class="w-2/3 font-bold tracking-wide">Creative Direction</div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-xs text-gray-500 uppercase tracking-widest">Design Date</div>
                        <div class="font-header text-primary font-black">2026 / 01 / 22</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-12 left-12">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 bg-primary rotate-45"></div>
                <div class="w-4 h-4 bg-dark rotate-45"></div>
                <div class="w-4 h-4 bg-grey rotate-45 border border-dark/10"></div>
            </div>
        </div>
    </div>

</body>
</html>
