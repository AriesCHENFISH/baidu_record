<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table of Content - 1-10</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; -webkit-font-smoothing: antialiased; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
        }

        .font-header { font-family: 'Montserrat', sans-serif; }
        .font-script { font-family: 'Dancing Script', cursive; }

        .bg-pattern {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#F2F2F2 2px, transparent 2px);
            background-size: 40px 40px;
            opacity: 0.6;
            z-index: 0;
        }

        /* 调整为 5 列布局以容纳 10 个项目 */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            column-gap: 20px;
            row-gap: 50px;
            width: 90%;
            margin: 0 auto;
            z-index: 10;
        }

        .card-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
        }

        .circle-backdrop {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -60%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: rgba(201, 48, 44, 0.06);
            z-index: -1;
        }

        .card-number {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            line-height: 1;
            color: #C9302C;
            margin-bottom: 8px;
        }

        .card-label {
            font-size: 1rem;
            font-weight: 700;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .deco-bar-top {
            position: absolute;
            top: 0; left: 50px; width: 150px; height: 12px;
            background-color: #C9302C;
            z-index: 20;
        }

        .deco-bar-bottom {
            position: absolute;
            bottom: 0; right: 0; width: 200px; height: 20px;
            background-color: #000000;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-pattern"></div>
        <div class="deco-bar-top"></div>

        <div class="relative w-full h-full flex flex-col justify-center items-center z-10 pt-8">
            
            <div class="w-full text-center mb-12 relative">
                <h1 class="flex justify-center items-baseline gap-4">
                    <span class="font-header text-7xl font-black text-black tracking-tighter uppercase">Table Of</span>
                    <span class="font-script text-8xl text-[#C9302C] transform -rotate-6 translate-y-2 relative" style="text-shadow: 2px 4px 6px rgba(0,0,0,0.1);">
                        Content
                        <div class="absolute w-full h-1 bg-[#C9302C] opacity-30 bottom-2 left-0 rounded-full"></div>
                    </span>
                </h1>
            </div>

            <div class="content-grid">
                
                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">01</h2>
                    <p class="card-label">Introduction</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">02</h2>
                    <p class="card-label">About Me</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">03</h2>
                    <p class="card-label">Education</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">04</h2>
                    <p class="card-label">Core Skills</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">05</h2>
                    <p class="card-label">Expertise</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">06</h2>
                    <p class="card-label">Experience</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">07</h2>
                    <p class="card-label">Project View</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">08</h2>
                    <p class="card-label">Philosophy</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">09</h2>
                    <p class="card-label">Contact</p>
                </div>

                <div class="card-item">
                    <div class="circle-backdrop"></div>
                    <h2 class="card-number">10</h2>
                    <p class="card-label">Thank You</p>
                </div>

            </div>
        </div>

        <div class="deco-bar-bottom"></div>
    </div>

</body>
</html>
