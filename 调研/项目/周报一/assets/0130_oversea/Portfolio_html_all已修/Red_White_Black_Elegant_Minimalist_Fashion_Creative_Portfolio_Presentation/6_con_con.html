<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Style Alignment</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#C9302C', dark: '#000000', light: '#FFFFFF', grey: '#F2F2F2' } } }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background: #FFF; position: relative; overflow: hidden; margin: 0 auto; }
        .text-outline { -webkit-text-stroke: 1.5px #C9302C; color: transparent; }
    </style>
</head>
<body>
    <div id="page_container" class="flex">
        <div class="absolute top-0 right-0 w-1/3 h-full bg-dark z-0 transform skew-x-6 origin-top"></div>
        
        <div class="relative z-10 grid grid-cols-12 w-full h-full p-16 items-center">
            <div class="col-span-7 flex flex-col gap-8">
                <h1 class="text-8xl font-black leading-none uppercase tracking-tighter italic">
                    <span class="text-dark block">Get In</span>
                    <span class="text-outline block ml-20">Touch</span>
                </h1>
                <div class="relative w-[500px] h-[320px]">
                    <div class="absolute -bottom-4 -right-4 w-full h-full bg-primary -z-10"></div>
                    <img src="https://images.unsplash.com/photo-1556157382-97eda2d62296?q=80&w=1200&auto=format&fit=crop" 
                         class="w-full h-full object-cover grayscale border-4 border-white shadow-xl">
                    <div class="absolute -top-6 -left-6 bg-dark text-primary p-4 rounded-full">
                        <i class="fa-solid fa-asterisk text-2xl animate-spin-slow"></i>
                    </div>
                </div>
            </div>

            <div class="col-span-5 flex flex-col gap-10">
                <div class="bg-dark text-white p-8 shadow-[15px_15px_0px_#C9302C]">
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-globe text-primary"></i>
                            <span class="font-black italic uppercase tracking-widest">Website</span>
                        </div>
                        <p class="text-2xl font-bold">WWW.REALLYGREATSITE.COM</p>
                        <p class="text-gray-400 text-sm">Follow our digital journal for weekly updates on design trends and project showcases.</p>
                    </div>
                </div>

                <div class="bg-white text-dark p-8 border-4 border-dark shadow-[15px_15px_0px_#000000]">
                    <div class="space-y-4">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-envelope text-primary"></i>
                            <span class="font-black italic uppercase tracking-widest">Email</span>
                        </div>
                        <p class="text-2xl font-bold">HELLO@REALLYGREATSITE.COM</p>
                        <p class="text-gray-600 text-sm">Reach out for collaborations, inquiries, or just to say hi. We respond within 24 hours.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
