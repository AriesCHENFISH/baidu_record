<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Skills - Page 1</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#C9302C', dark: '#000000', grey: '#F2F2F2' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container { width: 1280px; height: 720px; background-color: #F2F2F2; position: relative; margin: 0 auto; overflow: hidden; }
    </style>
</head>
<body>
    <div class="page_container flex items-center justify-center">
        <div class="absolute top-10 left-16 z-0">
            <h1 class="text-[12rem] font-black text-white leading-none uppercase tracking-tighter opacity-60">Expertise</h1>
        </div>

        <div class="grid grid-cols-12 w-full h-full px-16 items-center relative z-10">
            <div class="col-span-5 relative flex flex-col justify-center">
                <div class="absolute top-[-40px] left-[-24px] w-32 h-32 border-t-8 border-l-8 border-primary z-0"></div>
                <div class="bg-dark p-4 shadow-2xl z-10 h-[480px] w-full">
                    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=800&auto=format&fit=crop" 
                         class="w-full h-full object-cover grayscale border-4 border-white">
                </div>
                <div class="absolute bottom-[-20px] right-[-20px] bg-primary text-white px-8 py-3 font-bold tracking-widest uppercase z-20 shadow-lg">
                    Creative Director
                </div>
            </div>

            <div class="col-span-7 pl-16 flex flex-col gap-6">
                <h2 class="text-6xl font-black text-dark uppercase mb-4 leading-tight">Personal<br><span class="text-primary">Skills</span></h2>
                
                <div class="bg-dark text-white p-8 shadow-xl transform hover:-translate-y-2 transition-transform border-r-8 border-primary">
                    <div class="flex items-center gap-4 mb-3">
                        <span class="text-primary font-bold text-xl">01/</span>
                        <h3 class="text-2xl font-bold uppercase tracking-widest">Photography</h3>
                    </div>
                    <p class="text-gray-400 text-sm leading-relaxed">Focusing on high-end commercial photography, capturing moments with precision and artistic flair.</p>
                </div>

                <div class="bg-primary text-white p-8 shadow-xl ml-12 transform hover:-translate-y-2 transition-transform border-r-8 border-dark">
                    <div class="flex items-center gap-4 mb-3">
                        <span class="text-dark font-bold text-xl">02/</span>
                        <h3 class="text-2xl font-bold uppercase tracking-widest">Filmmaking</h3>
                    </div>
                    <p class="text-red-100 text-sm leading-relaxed">Creating cinematic experiences through storytelling, advanced editing, and professional color grading.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
