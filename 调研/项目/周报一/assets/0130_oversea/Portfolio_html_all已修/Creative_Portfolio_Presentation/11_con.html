<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Approach - Cinematic Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; position: relative; background-color: #1B3A3E; overflow: hidden; margin: 0 auto; font-family: 'Noto Sans SC', sans-serif; }
        .glass-box { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(232,226,210,0.1); }
        .step-line { position: absolute; left: 80px; top: 0; bottom: 0; width: 1px; background: linear-gradient(to bottom, transparent, #B23A26, transparent); }
    </style>
</head>
<body>
    <div id="page_container" class="px-20 py-16 flex flex-col justify-between">
        <div class="step-line opacity-30"></div>
        
        <!-- 头部 -->
        <div class="relative pl-16">
            <h1 class="text-6xl text-white font-bold tracking-tighter">
                <span class="font-serif italic text-[#E8E2D2] font-light">Strategic</span> Approach
            </h1>
            <div class="mt-4 flex items-center gap-4 text-[#B23A26] font-bold tracking-widest text-xs uppercase">
                <i class="fa-solid fa-compass"></i> Methodical Precision
            </div>
        </div>

        <!-- 步骤区 -->
        <div class="flex-1 mt-12 space-y-6 relative pl-16">
            <!-- Step 01 -->
            <div class="glass-box p-6 rounded-2xl flex items-center gap-10 hover:bg-white/5 transition-all w-[90%]">
                <div class="w-32 h-32 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1503387762-592eea58f4e8?q=80&w=400&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <span class="text-[#B23A26] font-bold italic text-sm">01 / DISCOVERY</span>
                    <h4 class="text-white text-2xl font-bold mt-1">Insight Discovery</h4>
                    <p class="text-white/50 text-sm mt-2">Diving into the market archeology to uncover true human needs and future opportunities.</p>
                </div>
            </div>
            <!-- Step 02 -->
            <div class="glass-box p-6 rounded-2xl flex items-center gap-10 hover:bg-white/5 transition-all w-[90%] ml-12 border-l-4 border-l-[#B23A26]">
                <div class="w-32 h-32 rounded-xl overflow-hidden flex-shrink-0">
                    <img src="https://images.unsplash.com/photo-1454165833767-131435bb4296?q=80&w=400&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="flex-1">
                    <span class="text-[#B23A26] font-bold italic text-sm">02 / EXECUTION</span>
                    <h4 class="text-white text-2xl font-bold mt-1">Rigor & Execution</h4>
                    <p class="text-white/50 text-sm mt-2">Transforming raw insights into engineered excellence with unyielding attention to detail.</p>
                </div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="flex justify-between items-center pl-16 border-t border-white/10 pt-8">
            <span class="text-white font-bold tracking-[0.5em] uppercase text-xs">Strategy</span>
            <div class="flex gap-2">
                <div class="w-2 h-2 rounded-full bg-[#B23A26]"></div>
                <div class="w-2 h-2 rounded-full bg-[#E8E2D2] opacity-20"></div>
                <div class="w-2 h-2 rounded-full bg-[#E8E2D2] opacity-20"></div>
            </div>
        </div>
    </div>
</body>
</html>
