<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure CSS Premium Portfolio</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1B3A3E',       // Deep Teal (Base Background)
                        secondary: '#2F4F52',     // Lighter Teal
                        accent: '#B23A26',        // Warm Red
                        cream: '#E8E2D2',         // Decorative Beige
                        white: '#FFFFFF',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['Didot', 'Playfair Display', 'Times New Roman', 'serif'],
                    },
                    letterSpacing: {
                        'mega': '0.5em',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Strict Slide Dimensions */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            /* STRICT COLOR RETENTION */
            background-color: #1B3A3E; 
        }

        /* Typography Utilities */
        .text-outline {
            -webkit-text-stroke: 1px rgba(232, 226, 210, 0.4);
            color: transparent;
        }

        /* Abstract Geometric Background Lines */
        .grid-line {
            position: absolute;
            background-color: rgba(232, 226, 210, 0.05); /* Ultra subtle cream lines */
        }
        
        /* Subtle Vignette to add depth without changing color */
        .vignette {
            background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.3) 100%);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0 z-0">
            <div class="grid-line w-px h-full left-[10%]"></div>
            <div class="grid-line w-px h-full left-[30%]"></div>
            <div class="grid-line w-px h-full left-[70%]"></div>
            <div class="grid-line w-px h-full left-[90%]"></div>
            <div class="grid-line w-full h-px top-[15%]"></div>
            <div class="grid-line w-full h-px bottom-[15%]"></div>
        </div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full border border-white/5 z-0"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] rounded-full border border-white/10 z-0"></div>

        <div class="absolute inset-0 z-10 vignette pointer-events-none"></div>

        <div class="relative z-20 w-full h-full flex flex-col justify-between p-16">
            
            <div class="flex justify-between items-start">
                <div class="text-cream/20 text-6xl font-serif font-bold -mt-4 -ml-4">
                    01
                </div>

                <div class="flex flex-col items-end gap-1">
                    <span class="text-accent text-xs font-bold tracking-mega uppercase">Fradel & Spies</span>
                    <div class="w-16 h-0.5 bg-cream/30"></div>
                </div>
            </div>

            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full text-center">
                
                <div class="flex flex-col items-center">
                    <div class="h-16 w-px bg-gradient-to-b from-transparent via-accent to-accent mb-6"></div>
                </div>

                <div class="relative inline-block">
                    <h1 class="text-8xl text-cream font-serif italic tracking-wide relative z-10 opacity-90">
                        Creative
                    </h1>
                    
                    <h2 class="text-9xl text-white font-sans font-bold tracking-tighter uppercase leading-[0.8] mt-2 relative z-20">
                        Portfolio
                    </h2>

                    <h2 class="text-9xl font-sans font-bold tracking-tighter uppercase leading-[0.8] absolute top-2 left-2 text-outline -z-10 opacity-30 select-none">
                        Portfolio
                    </h2>
                </div>

                <div class="mt-8 flex justify-center items-center gap-4">
                    <div class="w-12 h-px bg-white/20"></div>
                    <p class="text-cream/70 text-sm tracking-[0.3em] uppercase font-light">
                        Strategic Visual Report 2026
                    </p>
                    <div class="w-12 h-px bg-white/20"></div>
                </div>
            </div>

            <div class="flex justify-between items-end border-t border-white/10 pt-6">
                
                <div class="flex items-center gap-6">
                    <div class="w-12 h-12 bg-accent flex items-center justify-center shadow-lg shadow-black/20">
                        <span class="text-white font-serif italic text-xl">A.</span>
                    </div>
                    
                    <div class="flex flex-col">
                        <span class="text-cream/40 text-[10px] tracking-widest uppercase mb-1">Presented By</span>
                        <h3 class="text-white text-lg font-medium leading-none">Alex Chen</h3>
                        <span class="text-cream/60 text-xs mt-1">Senior Design Director</span>
                    </div>
                </div>

                <div class="text-right">
                    <div class="flex items-center gap-6 text-cream/60 text-xs tracking-widest uppercase font-medium">
                        <div class="flex items-center gap-2 hover:text-white transition-colors">
                            <i class="fa-solid fa-globe text-accent"></i>
                            <span>www.reallygreatsite.com</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span>January 22</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="absolute bottom-32 right-[20%] w-2 h-2 bg-accent rounded-full shadow-[0_0_15px_rgba(178,58,38,0.8)] z-20"></div>

    </div>
</body>
</html>
