<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        .page-container { width: 1280px; height: 720px; background: #D66D92; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .inner-paper { width: 1150px; height: 640px; background: #FBF9F6; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 40px 80px rgba(0,0,0,0.2); overflow: hidden; }
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); z-index: 30; }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); z-index: 30; }
        .center-photo { width: 320px; height: 500px; object-fit: cover; border: 10px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.1); z-index: 20; }
        .step-circle { width: 44px; height: 44px; background: #589157; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; margin-bottom: 15px; box-shadow: 4px 4px 0px #F6C845; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="inner-paper p-16">
            <!-- 背景大型文字装饰 -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <span class="text-[300px] font-black text-[#589157] opacity-[0.03]">FUTURE</span>
            </div>

            <!-- 左侧内容 -->
            <div class="w-1/3 flex flex-col items-end text-right pr-10">
                <div class="step-circle">01</div>
                <h3 class="text-[#3D5A45] font-black text-2xl mb-4 uppercase">Cultural Respect</h3>
                <p class="text-[#4A6354] text-lg leading-relaxed font-light">Giving fair credit and compensation to original cultures instead of appropriation.</p>
            </div>

            <!-- 中间：长方形主图 + 贴纸标题 -->
            <div class="relative flex flex-col items-center">
                <h1 class="absolute -top-12 -left-32 font-sans font-black text-[90px] leading-none tracking-tighter w-max sticker-green transform -rotate-3">Ethical</h1>
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800" class="center-photo">
                <h1 class="absolute -bottom-8 -right-32 font-sans font-black text-[90px] leading-none tracking-tighter w-max sticker-pink transform rotate-2">Choices</h1>
            </div>

            <!-- 右侧内容 -->
            <div class="w-1/3 flex flex-col items-start text-left pl-10">
                <div class="step-circle" style="background:#C95C85">02</div>
                <h3 class="text-[#3D5A45] font-black text-2xl mb-4 uppercase">Mindful Action</h3>
                <p class="text-[#4A6354] text-lg leading-relaxed font-light">Focusing on quality over quantity to support the planet and garment workers.</p>
            </div>
        </div>
    </div>
</body>
</html>
