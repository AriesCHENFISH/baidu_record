<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        .page_container { width: 1280px; height: 720px; background: #D66D92; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .mag-layout { width: 1180px; height: 640px; background: #FBF9F6; display: flex; border-radius: 4px; box-shadow: 0 50px 100px rgba(0,0,0,0.3); position: relative; }
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .leaf-dot { width: 40px; height: 40px; background: #F6C845; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; position: absolute; right: -20px; top: 50%; transform: translateY(-50%); border: 3px solid white; z-index: 20; }
    </style>
</head>
<body class="bg-gray-200">
    <div class="page_container">
        <div class="mag-layout">
            <!-- 左侧：图片区 -->
            <div class="w-[45%] h-full relative overflow-hidden">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800" class="w-full h-full object-cover grayscale">
                <div class="absolute inset-0 bg-[#3D5A45]/20"></div>
                
                <!-- 修改后的悬浮贴纸标题 -->
                <div class="absolute bottom-16 left-8 z-30">
                    <h1 class="font-sans font-black text-[90px] leading-[0.8] tracking-tighter">
                        <span class="sticker-green block transform -rotate-2">Ethical</span>
                        <span class="sticker-pink block ml-10 transform rotate-1 mt-2">Choice</span>
                    </h1>
                </div>
            </div>

            <!-- 右侧：文字内容 -->
            <div class="w-[55%] p-20 flex flex-col justify-center relative">
                <div class="relative border-b-2 border-dashed border-[#DCE4D0] pb-12 mb-12">
                    <div class="leaf-dot"><i class="fa-solid fa-earth-asia"></i></div>
                    <h3 class="font-bold text-[#3D5A45] text-2xl mb-4 uppercase italic tracking-widest">Cultural Respect</h3>
                    <p class="text-[#4A6354] text-xl font-light leading-relaxed">Moving beyond appropriation to give fair credit and compensation to original cultures.</p>
                </div>
                <div class="relative">
                    <div class="leaf-dot" style="background:#C95C85"><i class="fa-solid fa-leaf"></i></div>
                    <h3 class="font-bold text-[#3D5A45] text-2xl mb-4 uppercase italic tracking-widest">Mindful Action</h3>
                    <p class="text-[#4A6354] text-xl font-light leading-relaxed">Focusing on quality over quantity to support the well-being of workers worldwide.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
