<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        #page_container { width: 1280px; height: 720px; background: #D66D92; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .paper-sheet { background: #F8F6F1; box-shadow: 0 20px 50px rgba(0,0,0,0.2); background-image: radial-gradient(#d1cfc8 0.5px, transparent 0.5px); background-size: 20px 20px; position: relative; }
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .step-circle { width: 44px; height: 44px; background: #589157; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; box-shadow: 4px 4px 0px #F6C845; }
        .organic-shape { clip-path: ellipse(45% 50% at 50% 50%); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="paper-sheet w-[1150px] h-[640px] rounded-sm p-16 flex flex-row-reverse">
            <!-- 右侧内容区 (55%) -->
            <div class="w-[55%] flex flex-col justify-between pl-12">
                <div>
                    <div class="flex items-center gap-3 mb-6">
                        <span class="w-12 h-1 bg-accentYellow"></span>
                        <span class="text-brandGreen font-bold tracking-[0.3em] text-sm uppercase">Zero Waste Vision</span>
                    </div>
                    <h1 class="font-sans font-black text-[110px] leading-[0.85] tracking-tighter mb-12">
                        <span class="sticker-green block transform rotate-2">Circular</span>
                        <span class="sticker-pink block ml-24 transform -rotate-2">Fashion</span>
                    </h1>
                </div>

                <div class="space-y-10 mb-6">
                    <div class="flex gap-6">
                        <div class="step-circle shrink-0">3</div>
                        <div>
                            <h3 class="text-brandGreen font-black text-2xl uppercase">Repair & Renew</h3>
                            <p class="text-bodyText text-lg leading-relaxed">Extending the lifecycle of garments through professional repair services and upcycling programs.</p>
                        </div>
                    </div>
                    <div class="flex gap-6">
                        <div class="step-circle shrink-0">4</div>
                        <div>
                            <h3 class="text-brandGreen font-black text-2xl uppercase">Closed-Loop System</h3>
                            <p class="text-bodyText text-lg leading-relaxed">Designing products that can be fully disassembled and remanufactured at the end of their use.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 左侧配图区 (45%) -->
            <div class="w-[45%] relative">
                <!-- 装饰符号 -->
                <div class="absolute bottom-10 left-0 text-brandGreen opacity-10 text-[300px] pointer-events-none"><i class="fa-solid fa-leaf"></i></div>
                <!-- 椭圆形配图 -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[420px] h-[420px] bg-white p-4 shadow-2xl rounded-full">
                    <img src="https://images.unsplash.com/photo-1542272454374-d52b8612d7b5?q=80&w=800" class="w-full h-full object-cover organic-shape">
                    <!-- 悬浮小贴纸 -->
                    <div class="absolute top-10 right-0 w-24 h-24 bg-brandPink rounded-full flex items-center justify-center text-white text-3xl shadow-xl rotate-12 border-4 border-white">
                        <i class="fa-solid fa-recycle"></i>
                    </div>
                </div>
                <!-- 闪烁星星 -->
                <div class="absolute bottom-0 right-10 text-accentYellow text-6xl animate-pulse"><i class="fa-solid fa-sparkles"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
