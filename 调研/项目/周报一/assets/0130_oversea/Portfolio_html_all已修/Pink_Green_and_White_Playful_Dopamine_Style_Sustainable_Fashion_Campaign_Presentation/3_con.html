<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        .page-container { width: 1280px; height: 720px; background: #D66D92; display: flex; align-items: center; justify-content: center; margin: 0 auto; overflow: hidden; }
        .inner-paper { width: 1150px; height: 640px; background: #FBF9F6; position: relative; display: flex; box-shadow: 0 40px 80px rgba(0,0,0,0.2); }
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .img-rect { width: 400px; height: 100%; object-fit: cover; border-right: 2px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="inner-paper">
            <!-- 左侧：长方形大图锚点 -->
            <div class="relative h-full overflow-hidden">
                <img src="https://images.unsplash.com/photo-1512413914633-b5043f4041ea?w=800" class="img-rect">
                <div class="absolute inset-0 bg-[#3D5A45]/10"></div>
                <div class="absolute bottom-10 left-6 [writing-mode:vertical-rl] text-white font-bold tracking-[0.5em] text-xs uppercase">Human Rights Report // 2024</div>
            </div>

            <!-- 右侧：内容区 -->
            <div class="flex-1 p-16 flex flex-col justify-center relative">
                <!-- 标题：贴纸样式 -->
                <h1 class="font-sans font-black text-[100px] leading-[0.8] tracking-tighter mb-12">
                    <span class="sticker-green block transform -rotate-2">Social</span>
                    <span class="sticker-pink block ml-20 transform rotate-1 mt-2">Inequality</span>
                </h1>

                <!-- 文本排版 -->
                <div class="space-y-12 ml-10">
                    <div class="relative pl-8 border-l-2 border-[#589157]">
                        <h3 class="text-[#589157] font-black text-xl uppercase mb-2">Labor Exploitation</h3>
                        <p class="text-[#4A6354] text-lg leading-relaxed italic max-w-[500px]">Brands utilize factories in developing nations where wages are low and conditions are hazardous.</p>
                    </div>
                    <div class="relative pl-8 border-l-2 border-[#C95C85]">
                        <h3 class="text-[#C95C85] font-black text-xl uppercase mb-2">Gender Inequality</h3>
                        <p class="text-[#4A6354] text-lg leading-relaxed italic max-w-[500px]">Over 80% of workers are women facing systemic discrimination and limited professional growth.</p>
                    </div>
                </div>

                <!-- 背景装饰符号 -->
                <div class="absolute right-10 top-10 text-[#589157] opacity-5 text-[200px]"><i class="fa-solid fa-users"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
