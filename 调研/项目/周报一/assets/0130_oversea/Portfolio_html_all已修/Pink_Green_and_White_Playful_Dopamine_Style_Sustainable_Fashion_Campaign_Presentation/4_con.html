<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        .page-container { width: 1280px; height: 720px; background: #D66D92; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        .inner-card { width: 1180px; height: 640px; background: #FBF9F6; border-radius: 4px; position: relative; display: flex; overflow: hidden; }
        /* 核心标题样式 */
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .image-stack img { border: 6px solid white; box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="inner-card">
            <!-- 左侧：文字信息 -->
            <div class="w-2/5 p-16 flex flex-col justify-center z-10">
                <div class="flex items-center gap-2 mb-6">
                    <span class="w-10 h-1 bg-[#E9C46A]"></span>
                    <span class="text-[#3D5A45] font-bold text-xs uppercase tracking-widest">Environmental Report</span>
                </div>
                
                <!-- 修改后的主标题风格 -->
                <h1 class="font-sans font-black text-[100px] leading-[0.8] tracking-tighter mb-12">
                    <span class="sticker-green block transform -rotate-2">Fashion</span>
                    <span class="sticker-pink block ml-12 transform rotate-2">Impact</span>
                </h1>

                <p class="text-[#3D5A45]/80 text-lg leading-relaxed font-medium italic border-l-4 border-[#C95C85] pl-6">
                    "The fashion industry damages the environment through water use, waste, and carbon emissions."
                </p>
                <div class="mt-12 flex items-center gap-4 text-[#3D5A45]">
                    <i class="fa-solid fa-circle-exclamation text-2xl text-[#C95C85]"></i>
                    <span class="text-sm font-bold tracking-widest uppercase">High Alert: Textile Waste</span>
                </div>
            </div>

            <!-- 右侧：艺术化图片堆叠 -->
            <div class="w-3/5 relative bg-[#EFEDE7] overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#3D5A45 1px, transparent 1px); background-size: 20px 20px;"></div>
                <div class="image-stack absolute top-12 right-12 w-80 rotate-3 z-20">
                    <img src="https://images.unsplash.com/photo-1605600659908-0ef719419d41?q=80&w=600" class="rounded-sm">
                </div>
                <div class="image-stack absolute bottom-16 left-12 w-64 -rotate-6 z-10">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=600" class="rounded-sm grayscale">
                </div>
                <div class="absolute right-4 bottom-10 [writing-mode:vertical-rl] text-[#3D5A45]/30 font-bold tracking-widest text-sm uppercase">
                    Awareness // 2024
                </div>
            </div>
        </div>
    </div>
</body>
</html>
