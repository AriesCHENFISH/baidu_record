<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        #page_container { width: 1280px; height: 720px; background: #D66D92; margin: 0 auto; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .inner-paper { width: 1150px; height: 640px; background: #F8F6F1; position: relative; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.3);
            background-image: linear-gradient(#E0E7D3 2px, transparent 2px), linear-gradient(90deg, #E0E7D3 2px, transparent 2px); background-size: 50px 50px; }
        .sticker-green { color: #589157; -webkit-text-stroke: 10px white; paint-order: stroke fill; text-shadow: 8px 8px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 10px white; paint-order: stroke fill; text-shadow: 8px 8px 0px rgba(0,0,0,0.1); }
        .torn-box { clip-path: polygon(0% 0%, 100% 0%, 100% 90%, 95% 95%, 90% 90%, 85% 95%, 80% 90%, 75% 95%, 70% 90%, 65% 95%, 60% 90%, 55% 95%, 50% 90%, 45% 95%, 40% 90%, 35% 95%, 30% 90%, 25% 95%, 20% 90%, 15% 95%, 10% 90%, 5% 95%, 0% 90%); }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 左侧侧边条 -->
        <div class="absolute left-0 top-0 h-full w-[80px] bg-[#D66D92] z-40 flex flex-col justify-center items-center gap-20">
            <p class="rotate-[-90deg] text-white font-black tracking-[0.5em] whitespace-nowrap opacity-80 uppercase">Tynk Unlimited</p>
            <p class="rotate-[-90deg] text-white font-medium text-xs whitespace-nowrap opacity-60">Est. 2024</p>
        </div>

        <div class="inner-paper">
            <!-- 背景装饰符号 -->
            <div class="absolute top-10 right-20 text-[#F6C845] text-[200px] opacity-20 rotate-12"><i class="fa-solid fa-certificate"></i></div>
            <div class="absolute -bottom-20 -left-10 text-[#589157] text-[300px] opacity-10"><i class="fa-solid fa-leaf"></i></div>

            <!-- 主标题区 -->
            <div class="absolute top-1/2 left-[45%] -translate-x-1/2 -translate-y-1/2 z-20">
                <h1 class="font-sans font-black text-[130px] leading-[0.8] tracking-tighter">
                    <span class="sticker-green block transform -rotate-3">ECO-CHIC</span>
                    <span class="sticker-pink block ml-32 transform rotate-2 mt-4">VIBES</span>
                </h1>
                
                <!-- 副标题标签 -->
                <div class="mt-20 ml-40 bg-[#D66D92] p-8 w-[550px] torn-box shadow-2xl rotate-[-2deg]">
                    <p class="text-white font-black text-2xl text-center leading-tight">
                        Redefining Fashion with a <br/>Splash of Sustainability
                    </p>
                </div>
            </div>

            <!-- 图形化装饰（代替照片） -->
            <!-- 墨镜图标 -->
            <div class="absolute top-20 left-40 text-[#F6C845] text-[150px] rotate-[-15deg] drop-shadow-2xl">
                <i class="fa-solid fa-glasses"></i>
            </div>
            <!-- 运动鞋图标 -->
            <div class="absolute bottom-20 right-40 text-[#C95C85] text-[180px] rotate-12 drop-shadow-2xl">
                <i class="fa-solid fa-shoe-prints"></i>
            </div>
            <!-- 闪烁星星 -->
            <div class="absolute top-1/2 right-20 text-[#589157] text-6xl animate-pulse">
                <i class="fa-solid fa-star"></i>
            </div>
            <div class="absolute bottom-40 left-20 text-[#C95C85] text-5xl">
                <i class="fa-solid fa-asterisk"></i>
            </div>
        </div>
    </div>
</body>
</html>
