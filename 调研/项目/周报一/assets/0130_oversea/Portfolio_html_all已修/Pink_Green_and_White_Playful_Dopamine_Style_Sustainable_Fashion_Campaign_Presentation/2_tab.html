<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        #page_container { width: 1280px; height: 720px; background: #D66D92; margin: 0 auto; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .inner-paper { width: 1150px; height: 640px; background: #F8F6F1; position: relative; padding: 60px; box-shadow: 0 40px 100px rgba(0,0,0,0.3);
            background-image: linear-gradient(#E0E7D3 1px, transparent 1px), linear-gradient(90deg, #E0E7D3 1px, transparent 1px); background-size: 40px 40px; }
        .sticker-green { color: #589157; -webkit-text-stroke: 6px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 6px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .step-circle { width: 40px; height: 40px; background: #589157; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 4px 4px 0px #F6C845; }
        .toc-item { transition: transform 0.3s; cursor: pointer; }
        .toc-item:hover { transform: scale(1.05) rotate(1deg); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="inner-paper flex flex-col">
            <!-- 目录页标题 -->
            <div class="mb-12 flex justify-between items-end">
                <h1 class="font-sans font-black text-[90px] leading-none tracking-tighter">
                    <span class="sticker-green">THE</span>
                    <span class="sticker-pink ml-4">CONTENT</span>
                </h1>
                <div class="text-[#3D5A45] font-black text-sm tracking-[0.4em] uppercase opacity-40 pb-4">Roadmap to Sustainability</div>
            </div>

            <!-- 9个目录项网格 (3x3) -->
            <div class="grid grid-cols-3 gap-x-12 gap-y-10 flex-grow">
                <!-- 项 1 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">01</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Sustainable Fashion Intro</div>
                </div>
                <!-- 项 2 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">02</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Environmental Impact</div>
                </div>
                <!-- 项 3 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">03</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Innovative Materials</div>
                </div>
                <!-- 项 4 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">04</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Circular Economy</div>
                </div>
                <!-- 项 5 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">05</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Social Inequality Issues</div>
                </div>
                <!-- 项 6 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">06</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Fast Fashion Challenges</div>
                </div>
                <!-- 项 7 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">07</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Ethical Production</div>
                </div>
                <!-- 项 8 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">08</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Campaign Strategy</div>
                </div>
                <!-- 项 9 -->
                <div class="toc-item flex items-center gap-4">
                    <div class="step-circle shrink-0">09</div>
                    <div class="font-black text-xl text-[#3D5A45] leading-tight uppercase">Future Outlook</div>
                </div>
            </div>

            <!-- 底部装饰符号 -->
            <div class="absolute bottom-10 right-10 text-[#C95C85] text-5xl opacity-40">
                <i class="fa-solid fa-star-of-life"></i>
            </div>
            <div class="absolute -left-10 bottom-20 text-[#F6C845] text-[150px] opacity-10 rotate-12">
                <i class="fa-solid fa-sun"></i>
            </div>
        </div>
    </div>
</body>
</html>
