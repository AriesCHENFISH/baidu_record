<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primaryPink: '#D66D92', paperWhite: '#F8F6F1', brandGreen: '#589157', brandPink: '#C95C85', bodyText: '#4A6354', accentYellow: '#F6C845' },
                    fontFamily: { sans: ['Roboto', 'Noto Sans SC', 'sans-serif'], serif: ['Abril Fatface', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        #page_container { width: 1280px; height: 720px; background: #D66D92; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;margin: 0 auto; }
        .paper-sheet { background: #F8F6F1; box-shadow: 0 20px 50px rgba(0,0,0,0.2); background-image: radial-gradient(#d1cfc8 0.5px, transparent 0.5px); background-size: 20px 20px; position: relative; }
        .sticker-green { color: #589157; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .sticker-pink { color: #C95C85; -webkit-text-stroke: 8px white; paint-order: stroke fill; text-shadow: 5px 5px 0px rgba(0,0,0,0.1); }
        .step-circle { width: 44px; height: 44px; background: #589157; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; box-shadow: 4px 4px 0px #F6C845; }
        .torn-image { clip-path: polygon(0% 2%, 100% 0%, 98% 98%, 2% 100%); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="paper-sheet w-[1150px] h-[640px] rounded-sm p-16 flex">
            <!-- 左侧内容区 (60%) -->
            <div class="w-3/5 flex flex-col justify-between">
                <div>
                    <div class="flex items-center gap-3 mb-6">
                        <span class="w-12 h-1 bg-accentYellow"></span>
                        <span class="text-brandGreen font-bold tracking-[0.3em] text-sm uppercase">Fabric Innovation</span>
                    </div>
                    <h1 class="font-sans font-black text-[110px] leading-[0.85] tracking-tighter mb-12">
                        <span class="sticker-green block transform -rotate-2">Innovative</span>
                        <span class="sticker-pink block ml-16 transform rotate-1">Materials</span>
                    </h1>
                </div>

                <div class="space-y-10 mb-6">
                    <div class="flex gap-6">
                        <div class="step-circle shrink-0">1</div>
                        <div>
                            <h3 class="text-brandGreen font-black text-2xl uppercase italic">Organic Fibers</h3>
                            <p class="text-bodyText text-lg leading-relaxed">Utilizing 100% organic cotton and hemp to reduce pesticide use and water consumption.</p>
                        </div>
                    </div>
                    <div class="flex gap-6">
                        <div class="step-circle shrink-0">2</div>
                        <div>
                            <h3 class="text-brandGreen font-black text-2xl uppercase italic">Recycled Polymers</h3>
                            <p class="text-bodyText text-lg leading-relaxed">Transforming ocean plastics and post-consumer waste into high-performance fabrics.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧配图区 (40%) -->
            <div class="w-2/5 relative">
                <!-- 主图 -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] h-[520px] bg-white p-4 shadow-2xl rotate-2">
                    <img src="https://images.unsplash.com/photo-1579566346927-c68383817a25?q=80&w=800" class="w-full h-full object-cover torn-image">
                    <div class="absolute -bottom-4 -left-6 bg-accentYellow text-brandGreen font-black px-4 py-2 rotate-[-5deg] shadow-lg">ECO-TEX 100</div>
                </div>
                <!-- 装饰符号 -->
                <div class="absolute top-0 right-0 text-brandPink opacity-20 text-[180px] rotate-12"><i class="fa-solid fa-asterisk"></i></div>
            </div>
        </div>
    </div>
</body>
</html>
