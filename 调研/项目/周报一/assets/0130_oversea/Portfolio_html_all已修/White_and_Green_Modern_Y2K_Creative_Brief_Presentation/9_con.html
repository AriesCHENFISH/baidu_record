<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stakeholders Analysis - Studio Shodwe</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        acid: '#E0F285', 
                        nature: '#5B7F3A',
                        dream: '#D6A4E8',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        serif: ['"Times New Roman"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background-color: #5B7F3A;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo-accent {
            background: linear-gradient(135deg, #E0F285 0%, #B4D333 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .acid-shadow {
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1510672981848-a1c4f1cb5ccf?q=80&w=1280&auto=format&fit=crop" 
                 class="w-full h-full object-cover opacity-90" alt="Nature Background">
            <div class="absolute inset-0" style="background: linear-gradient(to bottom, rgba(91, 127, 58, 0.2), rgba(91, 127, 58, 0.4));"></div>

            <div class="flex items-center space-x-4">

                    <i class="fa-solid fa-leaf text-nature text-lg"></i>
                </div>
                <div>

                </div>
            </div>
        </header>

        <div class="absolute top-24 left-12 right-12 bottom-24 z-20 flex flex-col">
            
            <div class="flex justify-end mb-10 pr-12">
                <div class="glass-panel px-12 py-5 rounded-full border border-white/40 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1/2 bg-white/10 skew-y-12"></div>
                    <h1 class="text-6xl text-white font-serif italic tracking-wide relative z-10">
                        Stakeholders
                    </h1>
                </div>
            </div>

            <div class="w-full h-auto grid gap-4" style="grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr;">
                
                <div></div> 
                <div class="bg-acid h-20 rounded-2xl flex items-center justify-center text-center p-2 acid-shadow transition-transform hover:-translate-y-1">

                </div>
                <div class="bg-acid h-20 rounded-2xl flex items-center justify-center text-center p-2 acid-shadow transition-transform hover:-translate-y-1">
                    <h3 class="text-nature font-bold text-lg leading-tight">External<br>Stakeholder</h3>
                </div>
                <div class="bg-acid h-20 rounded-2xl flex items-center justify-center text-center p-2 acid-shadow transition-transform hover:-translate-y-1">
                    <h3 class="text-nature font-bold text-lg leading-tight">Priority<br>Stakeholder</h3>
                </div>
                <div class="bg-acid h-20 rounded-2xl flex items-center justify-center text-center p-2 acid-shadow transition-transform hover:-translate-y-1">
                    <h3 class="text-nature font-bold text-lg leading-tight">Priority<br>Stakeholder</h3>
                </div>

                <div class="bg-acid/90 h-20 rounded-2xl flex items-center justify-start pl-8 acid-shadow">
                    <h4 class="text-nature font-bold text-lg">Project Manager</h4>
                </div>
                <div class="glass-panel h-20 rounded-2xl"></div>
                <div class="glass-panel h-20 rounded-2xl"></div>
                <div class="glass-panel h-20 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-certificate text-[#D65A5A] text-3xl drop-shadow-md"></i>
                </div>
                <div class="glass-panel h-20 rounded-2xl"></div>

                <div class="bg-acid/90 h-20 rounded-2xl flex items-center justify-start pl-8 acid-shadow">

                <div class="glass-panel h-20 rounded-2xl flex items-center justify-center">

                </div>
                <div class="glass-panel h-20 rounded-2xl"></div>
                <div class="glass-panel h-20 rounded-2xl flex items-center justify-center">

                </div>

                <div class="bg-acid/90 h-20 rounded-2xl flex items-center justify-start pl-8 acid-shadow">
                    <h4 class="text-nature font-bold text-lg">Lead Designer</h4>
                </div>
                <div class="glass-panel h-20 rounded-2xl flex items-center justify-center">
                     <i class="fa-solid fa-certificate text-[#D65A5A] text-3xl drop-shadow-md"></i>
                </div>
                <div class="glass-panel h-20 rounded-2xl"></div>
                <div class="glass-panel h-20 rounded-2xl"></div>
                <div class="glass-panel h-20 rounded-2xl"></div>
            </div>
        </div>

        <div class="absolute bottom-8 left-12 z-30">
            <div class="glass-pill px-8 py-3 rounded-full flex items-center gap-4">
                <span class="text-acid font-bold text-lg tracking-tight">Page 07</span>
                <div class="w-[1px] h-4 bg-white/40"></div>
                <span class="text-white/80 font-light text-sm uppercase tracking-widest">Stakeholder Analysis — Studio Shodwe</span>
            </div>
        </div>

    </div>

</html>
