<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Page - Digital Marketing</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F2F2F2;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            padding: 80px; /* 封面增加间距 */
        }

        /* 封面特有的大字，比普通页更大 */
        .mega-title-cover {
            font-size: 160px;
            font-weight: 900;
            line-height: 0.75;
            letter-spacing: -0.06em;
            color: #1A1A1A;
        }

        .outline-text {
            -webkit-text-stroke: 1.5px #1A1A1A;
            color: transparent;
        }

        /* 纵向装饰线 */
        .vertical-accent {
            position: absolute;
            left: 50%;
            top: 0;
            width: 1px;
            height: 100%;
            background-color: rgba(0,0,0,0.1);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- 装饰背景线 -->
        <div class="vertical-accent"></div>
        
        <!-- 顶部品牌 -->
        <div class="relative z-10 flex justify-between items-start mb-12">
            <div class="border-l-4 border-black pl-4">
                <p class="text-xs font-black uppercase tracking-[0.6em]">Liceria & Co.</p>
                <p class="text-[10px] text-gray-500 uppercase tracking-[0.4em] mt-1">Creative Agency Portfolio</p>
            </div>
            <div class="text-right">
                <p class="text-lg font-black italic">2025</p>
            </div>
        </div>

        <!-- 主内容区：极简文字设计 -->
        <div class="flex-grow flex flex-col justify-center relative z-10">
            <div class="relative">
                <!-- DIGITAL：实心靠左 -->
                <h1 class="mega-title-cover uppercase">
                    DIGITAL
                </h1>
                <!-- MARKETING：镂空靠右并上移重叠 -->
                <h1 class="mega-title-cover outline-text uppercase ml-48 -mt-8">
                    MARKETING
                </h1>
            </div>

            <!-- 装饰性短语 -->
            <div class="mt-16 flex items-center gap-8">
                <span class="h-[2px] w-32 bg-black"></span>
                <p class="text-xl font-light tracking-[0.3em] uppercase text-gray-600">
                    Strategy <span class="mx-2 text-black">•</span> Evolution <span class="mx-2 text-black">•</span> Impact
                </p>
            </div>
        </div>

        <!-- 底部栏：与全套页面高度统一，但信息略作调整 -->
        <div class="mt-auto pt-10 border-t border-gray-400 flex justify-between items-end relative z-10">
            <div class="flex items-center gap-6">
                <!-- 黑色色块标记 -->
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Section</span>
                    <span class="text-xs font-bold text-white bg-black px-4 py-1.5 text-center">COVER PAGE</span>
                </div>
                
                <span class="h-12 w-[1px] bg-gray-300"></span>
                
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Presented By:</span>
                    <p class="font-bold text-sm tracking-widest uppercase">Francisco Andrade</p>
                </div>

                <div class="flex flex-col ml-10">
                    <span class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Target Client:</span>
                    <p class="font-bold text-sm tracking-widest uppercase">Anna Katrina Marchesi</p>
                </div>
            </div>
            
            <!-- 右下角项目说明 -->
            <div class="text-right">
                <p class="text-[10px] font-black text-black tracking-[0.5em] uppercase border-b-2 border-black pb-1 mb-2">Personal Presentation</p>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">© 2025 All Rights Reserved</p>
            </div>
        </div>

    </div>

</body>
</html>
