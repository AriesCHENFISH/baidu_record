<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Creative Portfolio - Centered Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #E6E6E6; color: #1A1A1A;
            overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }
        .gradient-accent { background: linear-gradient(135deg, #2E9CA5, #5B3CC4); }
        .text-gradient {
            background: linear-gradient(135deg, #2E9CA5, #5B3CC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text-outline {
            -webkit-text-stroke: 1.5px #1A1A1A;
            color: transparent;
        }
        .bg-blob {
            position: absolute; border-radius: 50%;
            filter: blur(120px); opacity: 0.18; z-index: 1;
        }
        .deco-circle {
            position: absolute; border: 1px solid rgba(0,0,0,0.05);
            border-radius: 50%; z-index: 2;
        }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 背景设计 -->
        <div class="bg-blob gradient-accent w-[800px] h-[800px] -top-60 -left-40"></div>
        <div class="bg-blob gradient-accent w-[600px] h-[600px] -bottom-40 -right-40"></div>
        <div class="deco-circle w-[900px] h-[900px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

        <!-- 统一页眉：保持左右对齐规范 -->
        <header class="absolute top-0 left-0 w-full px-16 py-10 flex justify-between items-center z-30">
            <div class="flex items-center gap-4">
                <div class="w-12 h-1 gradient-accent"></div>
                <p class="text-sm font-bold tracking-[0.4em] uppercase opacity-80">Strategic Showcase</p>
            </div>
            <div class="px-5 py-1.5 border border-black/20 rounded text-sm font-black tracking-widest uppercase">
                Confidential 2026
            </div>
        </header>

        <!-- 主体内容：中轴对称排版 -->
        <div class="h-full w-full flex flex-col justify-center items-center relative z-10 px-16 pt-10">
            
            <!-- 顶部分类标签 -->
            <p class="text-[#5B3CC4] text-sm font-black tracking-[0.6em] uppercase mb-6">
                Annual Work Report
            </p>

            <!-- 极致大字号居中主标题 -->
            <div class="relative text-center mb-12">
                <h1 class="text-[140px] font-black tracking-tighter uppercase leading-[0.8] text-[#1A1A1A]">
                    CREATIVE
                </h1>
                <div class="relative inline-block">
                    <!-- 描边错位层 -->
                    <h1 class="text-[140px] font-black tracking-tighter uppercase leading-[0.8] text-outline opacity-20 absolute -top-1 -left-1 w-full text-center">
                        PORTFOLIO
                    </h1>
                    <!-- 渐变主体层 -->
                    <h1 class="text-[140px] font-black tracking-tighter uppercase leading-[0.8] text-gradient relative">
                        PORTFOLIO<span class="text-[#F2C94C]">.</span>
                    </h1>
                </div>
            </div>

            <!-- 居中装饰线 -->
            <div class="w-24 h-1.5 gradient-accent rounded-full mb-16"></div>

            <!-- 居中汇报人信息模块 -->
            <div class="flex flex-col items-center gap-6">
                <div class="flex items-center gap-8">
                    <div class="text-right">
                        <p class="text-xs font-bold tracking-[0.2em] text-[#5B3CC4] uppercase mb-1">Presented By</p>
                        <h3 class="text-2xl font-black text-[#1A1A1A]">Marceline Anderson</h3>
                    </div>
                    <div class="h-10 w-[2px] gradient-accent"></div>
                    <div class="text-left">
                        <p class="text-xs font-bold tracking-[0.2em] text-[#5B3CC4] uppercase mb-1">Department</p>
                        <h3 class="text-2xl font-black text-[#1A1A1A]">Creative Strategy</h3>
                    </div>
                </div>
                
                <!-- 底部辅助信息 -->
                <div class="flex items-center gap-4 opacity-40">
                    <p class="text-sm font-bold uppercase tracking-[0.4em]">Released: May 09, 2026</p>
                    <span class="w-1.5 h-1.5 rounded-full bg-black"></span>
                    <p class="text-sm font-bold uppercase tracking-[0.4em]">Global Edition</p>
                </div>
            </div>
        </div>

        <!-- 右下角背景装饰符号 -->
        <div class="absolute right-0 bottom-0 p-8 opacity-10">
            <i class="fa-solid fa-shapes text-[160px]"></i>
        </div>

        <!-- 底部中央装饰条 -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-20">
            <p class="text-[10px] font-black uppercase tracking-[1em]">Visionary 2026</p>
            <div class="w-1 h-12 gradient-accent"></div>
        </div>
    </div>
</body>
</html>
