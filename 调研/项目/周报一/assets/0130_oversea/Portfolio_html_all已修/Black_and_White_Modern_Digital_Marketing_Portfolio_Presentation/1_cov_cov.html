<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Marketing Portfolio Presentation</title>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#F4F4F4',
                        textPrimary: '#1A1A1A',
                        textSecondary: '#4D4D4D',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    letterSpacing: {
                        tightest: '-0.06em',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #F4F4F4; overflow: hidden;
            font-family: "Noto Sans SC", sans-serif;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* 统一背景噪点与网格 */
        #page_container::before {
            content: ""; position: absolute; inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
            opacity: 0.2; pointer-events: none; z-index: 1;
        }
        .grid-bg {
            position: absolute; inset: 0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, transparent, black, transparent);
            opacity: 0.3; z-index: 0;
        }

        .text-outline { -webkit-text-stroke: 2px #1A1A1A; color: transparent; }

        /* 错位边框装饰 */
        .offset-frame {
            border: 1px solid #d1d1d1;
            position: absolute;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container" class="p-12">
        <div class="grid-bg"></div>
        <div class="absolute -top-24 -left-24 w-[500px] h-[500px] bg-blue-50 rounded-full blur-[120px] opacity-60 z-0"></div>
        <div class="absolute -bottom-24 -right-24 w-[400px] h-[400px] bg-orange-50 rounded-full blur-[100px] opacity-40 z-0"></div>
        
        <div class="absolute top-0 left-1/2 w-px h-20 bg-gray-300 z-10"></div>
        <div class="absolute bottom-0 left-1/2 w-px h-20 bg-gray-300 z-10"></div>

        <div class="w-full h-12 flex justify-between items-end z-20 relative">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-textPrimary flex items-center justify-center rounded-sm">
                    <i class="fa-solid fa-shapes text-white text-xs"></i>
                </div>
                <h5 class="text-textPrimary font-bold text-base tracking-tighter uppercase">GIGGLING PLATYPUS CO.</h5>
            </div>

            <div class="flex flex-col items-center">
                <div class="text-[10px] text-textSecondary tracking-[0.3em] uppercase font-bold mb-1 text-center">Personal Presentation</div>
                <div class="h-[2px] w-12 bg-textPrimary"></div>
            </div>

            <div class="text-textPrimary font-black text-lg italic italic">
                <span>'2026</span>
            </div>
        </div>

        <div class="flex-grow grid grid-cols-12 gap-12 items-center mt-6 mb-6 relative z-10">
            
            <div class="col-span-8 flex flex-col justify-center">
                <span class="text-xs font-bold tracking-[0.5em] text-gray-400 uppercase mb-8 block">Strategic Marketing Case Study</span>
                
                <h1 class="text-textPrimary text-[120px] font-black tracking-tightest leading-[0.8] uppercase">
                    DIGITAL<br>
                    <span class="text-outline">MARKETING</span><br>
                    PORTFOLIO.
                </h1>
            </div>

            <div class="col-span-4 flex items-center justify-center relative pr-8">
                <div class="offset-frame -inset-4 translate-x-6 translate-y-6"></div>
                
                <div class="relative w-full h-[320px] bg-gray-200 border border-gray-200 overflow-hidden transform rotate-[-1deg] z-10 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=1280" alt="Cover Visual" class="w-full h-full object-cover grayscale-[10%]">
                    <div class="absolute top-4 right-4 bg-white/90 backdrop-blur px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-textPrimary">Mastery</div>
                </div>

                <div class="absolute -bottom-16 right-0 text-right">
                    <p class="text-[10px] text-textSecondary uppercase tracking-widest font-bold mb-2">Defining Excellence</p>
                    <div class="h-[1px] w-12 bg-textPrimary ml-auto"></div>
                </div>
            </div>
        </div>

        <div class="w-full grid grid-cols-12 gap-8 border-t-2 border-textPrimary pt-8 relative z-20">
            
            <div class="col-span-4 flex flex-col">
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-2 h-2 bg-textPrimary rounded-full"></span>
                    <h6 class="text-textSecondary text-[10px] uppercase tracking-widest font-bold">Project Identification</h6>
                </div>
                <p class="text-textPrimary font-black text-lg uppercase tracking-tight">Marketing Portfolio 2026</p>
            </div>

            <div class="col-span-4 flex flex-col items-center border-x border-gray-300">
                <h6 class="text-textSecondary text-[10px] uppercase tracking-widest font-bold mb-2">Presented By</h6>
                <p class="text-textPrimary font-bold text-base underline decoration-2 underline-offset-4">Hannah Morales</p>
            </div>

            <div class="col-span-4 flex flex-col items-end text-right">
                <h6 class="text-textSecondary text-[10px] uppercase tracking-widest font-bold mb-2">Exclusive For</h6>
                <div class="flex items-center gap-2">
                    <p class="text-textPrimary font-bold text-base">Margarita Perez</p>
                    <i class="fa-solid fa-arrow-right-long text-textPrimary"></i>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
