<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Portfolio Cover - Premium Static Edition</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgBlack: '#050505',
                        brandBlue: '#3B82F6',
                        brandPink: '#EC4899',
                        brandPurple: '#A855F7',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #050505;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* 背景装饰：极细网格线 */
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 统一的标题背景渐变球 */
        .glow-sphere {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            top: -300px;
            left: -200px;
            pointer-events: none;
        }

        /* 统一的描边文字效果 */
        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.3);
            color: transparent;
        }

        .glass-footer {
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- 背景光效装饰 -->
        <div class="glow-sphere"></div>
        
        <!-- Main Content Area -->
        <div class="flex-grow flex flex-col justify-center items-center relative z-10 px-20">
            
            <!-- Top Tag -->
            <div class="flex items-center space-x-4 mb-12">
                <div class="w-12 h-[1px] bg-brandBlue"></div>
                <span class="text-brandBlue text-xs font-bold tracking-[0.5em] uppercase">Visual Excellence Portfolio</span>
                <div class="w-12 h-[1px] bg-brandBlue"></div>
            </div>

            <!-- Massive Title Section -->
            <div class="text-center mb-16">
                <h1 class="text-[8rem] font-black leading-[0.8] tracking-tighter uppercase italic">
                    <span class="text-outline block mb-4">Creative</span>
                    <span class="text-white">Portfolio</span>
                </h1>
            </div>

            <!-- Stylized Presenter Info (代替长句子文本) -->
            <div class="flex items-center space-x-16">
                <!-- Name Block -->
                <div class="flex flex-col items-center">
                    <span class="text-brandPink text-[10px] font-bold uppercase tracking-[0.4em] mb-4 italic">Lead Artist</span>
                    <div class="flex items-center space-x-6">
                        <div class="w-[1px] h-12 bg-zinc-800"></div>
                        <span class="text-white text-5xl font-black uppercase italic tracking-tighter">Olivia Wilson</span>
                        <div class="w-[1px] h-12 bg-zinc-800"></div>
                    </div>
                </div>

                <!-- Date Block -->
                <div class="flex flex-col items-center">
                    <span class="text-brandPurple text-[10px] font-bold uppercase tracking-[0.4em] mb-4 italic">Issue Date</span>
                    <div class="px-6 py-2 border border-zinc-800 rounded-sm">
                        <span class="text-white text-4xl font-black uppercase italic tracking-widest">2026</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Decoration Dots -->
            <div class="mt-20 flex space-x-3">
                <div class="w-2 h-2 rounded-full bg-brandBlue"></div>
                <div class="w-2 h-2 rounded-full bg-brandPink"></div>
                <div class="w-2 h-2 rounded-full bg-brandPurple"></div>
            </div>
        </div>

        <!-- Unified Footer ED 00 (h-20) -->
        <div class="h-20 glass-footer px-20 flex items-center mt-auto relative overflow-hidden">
            <!-- 品牌色装饰线 -->
            <div class="absolute bottom-0 left-0 w-full h-[3px] flex">
                <div class="flex-grow bg-brandBlue"></div>
                <div class="flex-grow bg-brandPink"></div>
                <div class="flex-grow bg-brandPurple"></div>
            </div>

            <div class="flex justify-between items-center w-full">
                
                <!-- Identity -->
                <div class="flex flex-col">
                    <span class="text-[9px] text-brandBlue font-bold uppercase tracking-[0.3em]">Portfolio Direction</span>
                    <span class="text-white text-xl font-black uppercase tracking-tight">Olivia Wilson</span>
                </div>

                <!-- Contact Info Group (Compact Icons) -->
                <div class="flex items-center space-x-12">
                    <div class="flex items-center">
                        <div class="w-7 h-7 rounded-full border border-zinc-800 flex items-center justify-center mr-3">
                            <i class="fa-solid fa-phone text-[9px] text-brandBlue"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[8px] text-zinc-500 font-bold uppercase tracking-widest leading-none mb-1">Phone</span>
                            <span class="text-zinc-200 text-xs font-medium tracking-wide">+123-456-7890</span>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="w-7 h-7 rounded-full border border-zinc-800 flex items-center justify-center mr-3">
                            <i class="fa-solid fa-location-dot text-[9px] text-brandPink"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[8px] text-zinc-500 font-bold uppercase tracking-widest leading-none mb-1">Location</span>
                            <span class="text-zinc-200 text-xs font-medium italic">Any City, ST 12345</span>
                        </div>
                    </div>
                </div>

                <!-- Date Badge -->
                <div class="flex items-center">
                    <div class="flex flex-col items-end mr-4">
                        <span class="text-[8px] text-zinc-500 font-bold uppercase tracking-widest leading-none mb-1">Status</span>
                        <span class="text-white text-sm font-black italic tracking-widest leading-none">MAY 2026</span>
                    </div>
                    <div class="px-2 py-1 bg-brandBlue/10 border border-brandBlue/20 rounded text-brandBlue font-bold text-[9px]">
                        ED 00
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
