<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact - Core Studio</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Inter:wght@300;400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #050505; color: #fff; padding: 60px 80px; display: flex; flex-direction: column; }
        .logo-main { font-weight: 900; font-size: 24px; letter-spacing: -1px; line-height: 1; }
        .logo-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.3); }
        .logo-sub { font-size: 9px; letter-spacing: 3px; color: #888; text-transform: uppercase; }
        .title-main { font-size: 110px; font-weight: 900; letter-spacing: -8px; text-transform: uppercase; line-height: 0.8; text-align: center; }
        .title-accent { font-family: 'Playfair Display', serif; font-style: italic; font-size: 120px; color: transparent; -webkit-text-stroke: 1px #fff; text-align: center; }
    </style>
</head>
<body>
    <div id="page_container">
        <header class="flex justify-between items-start">
            <div class="text-[10px] tracking-[0.4em] text-gray-400 uppercase font-bold">Project / Performance</div>
            <div class="flex items-center gap-[15px]">
                <div class="logo-main">CORE<br>STUDIO</div>
                <div class="logo-divider"></div>
                <div class="logo-sub">Creative<br>Portfolio</div>
            </div>
        </header>

        <div class="flex-1 flex flex-col justify-center items-center relative">
            <div class="absolute text-[240px] font-black opacity-5 select-none tracking-tighter">SUCCESS</div>
            
            <div class="z-10">
                <div class="title-main">Market</div>
                <div class="title-accent">Influence</div>
            </div>
            
            <div class="mt-16 flex items-center gap-12 max-w-2xl">
                <div class="w-16 h-[2px] bg-white"></div>
                <p class="text-center text-sm font-bold uppercase tracking-[0.4em] text-white">
                    Our digital systems outperform the standard market engagement rates by over 200%.
                </p>
                <div class="w-16 h-[2px] bg-white"></div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-1 mt-auto">
            <div class="border border-white/20 p-8 text-center bg-white/5">
                <p class="text-[10px] tracking-widest text-gray-400 mb-2 uppercase">Precision</p>
                <p class="text-2xl font-black italic">100% PURE</p>
            </div>
            <div class="border border-white/20 p-8 text-center bg-white/10">
                <p class="text-[10px] tracking-widest text-gray-400 mb-2 uppercase">Retention</p>
                <p class="text-2xl font-black italic">98.2% AVG</p>
            </div>
            <div class="border border-white/20 p-8 text-center bg-white/5">
                <p class="text-[10px] tracking-widest text-gray-400 mb-2 uppercase">Growth</p>
                <p class="text-2xl font-black italic">3.5X SCALE</p>
            </div>
        </div>
    </div>
</body>
</html>
