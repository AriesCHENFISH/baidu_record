<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Best Project - Spaced Layout</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #0F1113; overflow: hidden; background-image: radial-gradient(at 10% 10%, #2A1A2E 0px, transparent 400px), linear-gradient(rgba(15, 17, 19, 0.95), rgba(15, 17, 19, 0.98)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1280&auto=format&fit=crop'); background-size: cover; background-blend-mode: overlay; }
        .font-retro { font-family: 'Shrikhand', cursive; }
        .glass-nav { background: rgba(15, 17, 19, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); }
    </style>
</head>
<body>
    <div class="page_container p-10 flex flex-col items-center">
        
        <nav class="relative z-50 w-full h-20 rounded-full glass-nav flex items-center justify-between px-10 shadow-2xl mb-10">
            <div class="flex items-center gap-3">
                <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
                <h2 class="text-white text-xl font-bold tracking-widest uppercase">Creative Portfolio</h2>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                    <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Innovation</span>
                </div>
                <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                    <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                    <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Excellence</span>
                </div>
                <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Future</span>
                </div>
            </div>
        </nav>

        <div class="text-center mb-8">
            <h1 class="text-white font-retro text-6xl tracking-wide drop-shadow-2xl">Best Project</h1>
        </div>

        <div class="grid grid-cols-3 gap-8 w-full h-[380px] px-10">
            
            <div class="flex flex-col rounded-3xl overflow-hidden bg-white">
                <div class="h-[50%] relative">
                    <img src="https://images.unsplash.com/photo-1608248597279-f99d160bfbc8?q=80&w=400&h=200&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="h-[50%] p-6 flex flex-col justify-center">
                    <h4 class="text-black text-lg font-bold mb-2 italic">Nature Fluid</h4>
                    <p class="text-gray-600 text-gl leading-relaxed">Exploring organic liquid textures and their interaction with lighting.</p>
                </div>
            </div>

            <div class="flex flex-col rounded-3xl overflow-hidden bg-white">
                <div class="h-[50%] relative">
                    <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=400&h=200&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="h-[50%] p-6 flex flex-col justify-center">
                    <h4 class="text-black text-lg font-bold mb-2 italic">Rope Texture</h4>
                    <p class="text-gray-600 text-gl leading-relaxed">Detailed visual study on macro textures and industrial materials.</p>
                </div>
            </div>

            <div class="flex flex-col rounded-3xl overflow-hidden bg-white">
                <div class="h-[50%] relative">
                    <img src="https://images.unsplash.com/photo-1556228722-dca852462b5d?q=80&w=400&h=200&auto=format&fit=crop" class="w-full h-full object-cover">
                </div>
                <div class="h-[50%] p-6 flex flex-col justify-center">
                    <p class="text-gray-800 text-lg leading-tight italic">"Innovation is about the unique stories we choose to tell."</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
