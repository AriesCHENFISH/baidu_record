<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Profile - Unified Glass Style</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #0F1113; overflow: hidden; font-family: 'Inter', sans-serif; }
        .bg-atmosphere { background: radial-gradient(circle at 80% 20%, rgba(42, 26, 46, 0.5) 0%, rgba(15, 17, 19, 0) 60%); }
        .font-display { font-family: 'Shrikhand', cursive; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-blur: 12px; }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col p-12">
        <div class="absolute inset-0 bg-atmosphere pointer-events-none"></div>

        <nav class="relative z-50 w-full mb-10">
            <div class="flex items-center justify-between px-8 py-5 border border-white/20 rounded-full bg-[#0F1113]/60 backdrop-blur-md">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
                    <h2 class="text-white text-xl font-bold tracking-widest uppercase">Creative Portfolio</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Visionary</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Strategic</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Digital</span>
                    </div>
                </div>
            </div>
        </nav>

        <div class="relative z-20 flex-1 border-2 border-white rounded-[48px] overflow-hidden flex bg-[#0F1113]/40 backdrop-blur-sm">
            <div class="w-[40%] h-full p-6">
                <div class="w-full h-full relative rounded-[32px] overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1515202913167-d9a698095ebf?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover grayscale">
                </div>
            </div>

            <div class="flex-1 flex flex-col justify-center px-16">
                <div class="space-y-2 mb-8">
                    <span class="text-blue-400 text-sm font-bold uppercase tracking-[0.4em]">Section 02 / About Me</span>
                    <h1 class="text-white text-6xl leading-tight font-display">Jonathan Patterson</h1>
                </div>

                <div class="glass-card rounded-[40px] p-10 max-w-xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
                    <div class="space-y-6">
                        <h3 class="text-white text-lg font-bold italic">"I am a multidisciplinary designer dedicated to crafting visuals that resonate."</h3>
                        <p class="text-white/60 text-gl leading-relaxed font-light">
                            Through a decade of exploration, I strive to redefine industry standards by merging pure art with cutting-edge technology.
                        </p>
                    </div>
                    <div class="mt-8 flex items-center justify-between">
                        <div class="flex gap-2">
                            <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                            <div class="w-2 h-2 rounded-full bg-white/20"></div>
                            <div class="w-2 h-2 rounded-full bg-white/20"></div>
                        </div>
                        <i class="fa-solid fa-arrow-right-long text-white/30"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
