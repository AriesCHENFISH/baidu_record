<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Work Experience - Unified Header</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #0F1113; overflow: hidden; font-family: 'Inter', sans-serif; }
        .bg-texture { position: absolute; inset: 0; background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop'); background-size: cover; opacity: 0.15; mix-blend-mode: overlay; }
        .glass-nav { background: rgba(15, 17, 19, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); }
        .retro-title { font-family: 'Shrikhand', cursive; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="bg-texture"></div>

        <div class="relative z-10 w-full h-full flex flex-col p-8 gap-5">

            <nav class="w-full h-20 glass-nav rounded-full flex justify-between items-center px-10 shrink-0 shadow-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
                    <h2 class="text-white text-xl font-bold tracking-widest uppercase">Creative Portfolio</h2>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Innovation</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Excellence</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/20 bg-white/5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        <span class="text-white/80 text-xs font-bold uppercase tracking-tighter">Future</span>
                    </div>
                </div>
            </nav>

            <div class="border-2 border-white/90 rounded-full py-6 flex justify-center items-center bg-white/5 shrink-0 backdrop-blur-sm">
                <h1 class="retro-title text-7xl text-white drop-shadow-md">Work Experience</h1>
            </div>

            <div class="grid grid-cols-3 gap-6 flex-grow">
                
                <div class="border-2 border-white/90 rounded-[2rem] p-4 flex flex-col gap-4 bg-[#0F1113]/40 backdrop-blur-sm group">
                    <div class="relative w-full h-[280px] rounded-[1.5rem] overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1481487484168-9b930d55236e?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover opacity-90 transition-transform duration-700 hover:scale-105">
                        <div class="absolute top-4 right-4 bg-black/80 w-10 h-10 rounded-full flex items-center justify-center border border-white/20">
                            <i class="fa-solid fa-camera text-white text-sm"></i>
                        </div>
                    </div>
                    <div class="flex-grow flex items-center justify-center">
                        <h3 class="text-xl font-bold text-white tracking-wide">Product Branding</h3>
                    </div>
                </div>

                <div class="border-2 border-white/90 rounded-[2rem] p-4 flex flex-col gap-4 bg-[#0F1113]/40 backdrop-blur-sm group">
                    <div class="relative w-full h-[280px] rounded-[1.5rem] overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover opacity-90 transition-transform duration-700 hover:scale-105">
                        <div class="absolute top-4 right-4 bg-black/80 w-10 h-10 rounded-full flex items-center justify-center border border-white/20">
                            <i class="fa-solid fa-camera text-white text-sm"></i>
                        </div>
                    </div>
                    <div class="flex-grow flex items-center justify-center">
                        <h3 class="text-xl font-bold text-white tracking-wide">Fashion Photography</h3>
                    </div>
                </div>

                <div class="border-2 border-white/90 rounded-[2rem] p-4 flex flex-col gap-4 bg-[#0F1113]/40 backdrop-blur-sm group">
                    <div class="relative w-full h-[280px] rounded-[1.5rem] overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=800&auto=format&fit=crop" 
                             class="w-full h-full object-cover opacity-90 transition-transform duration-700 hover:scale-105">
                        <div class="absolute top-4 right-4 bg-black/80 w-10 h-10 rounded-full flex items-center justify-center border border-white/20">
                            <i class="fa-solid fa-camera text-white text-sm"></i>
                        </div>
                    </div>
                    <div class="flex-grow flex items-center justify-center">
                        <h3 class="text-xl font-bold text-white tracking-wide">Commercial Video</h3>
                    </div>
                </div>

            </div>
            
        </div>
    </div>

</body>
</html>
