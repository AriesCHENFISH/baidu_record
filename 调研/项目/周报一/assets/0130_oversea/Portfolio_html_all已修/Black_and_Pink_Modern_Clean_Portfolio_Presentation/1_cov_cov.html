<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover - Portfolio in Black & Pink</title>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FDB8D9',       // Pink
                        bgDark: '#000000',        // Black
                        accentGold: '#A68B60',    // Gold
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        script: ['"Great Vibes"', 'cursive'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #000000;
        }

        /* 核心渐变遮罩：四周暗，中间略亮以突出标题 */
        .vignette-overlay {
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,0.95) 100%);
        }

        .text-glow {
            text-shadow: 0 0 30px rgba(253, 184, 217, 0.4);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1545989253-02cc26577f88?q=80&w=1280&auto=format&fit=crop" 
                 class="w-full h-full object-cover grayscale brightness-50 contrast-125" 
                 alt="Gallery Background">
        </div>

        <div class="absolute inset-0 z-10 vignette-overlay"></div>

        <div class="absolute inset-8 border border-accentGold/40 z-20 pointer-events-none rounded-sm">
            <div class="absolute -top-1 -left-1 w-2 h-2 bg-accentGold"></div>
            <div class="absolute -top-1 -right-1 w-2 h-2 bg-accentGold"></div>
            <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-accentGold"></div>
            <div class="absolute -bottom-1 -right-1 w-2 h-2 bg-accentGold"></div>
        </div>

        <div class="relative z-30 w-full h-full flex flex-col items-center justify-center">

            <div class="mb-8 text-primary/80 animate-pulse">
                <i class="fa-solid fa-star-of-life text-4xl"></i>
            </div>

            <div class="text-center mb-12">
                <h1 class="text-white text-9xl font-black uppercase tracking-[0.2em] leading-none mb-4 drop-shadow-2xl">
                    Portfolio
                </h1>
                <div class="flex items-center justify-center gap-8">
                    <div class="h-[1px] w-24 bg-accentGold/50"></div>
                    <h2 class="font-script text-primary text-7xl text-glow tracking-wide">
                        in black & pink
                    </h2>
                    <div class="h-[1px] w-24 bg-accentGold/50"></div>
                </div>
            </div>

            <div class="flex flex-col items-center mt-12 space-y-3">
                <span class="text-accentGold text-sm tracking-[0.6em] uppercase font-bold">Chidi Eze</span>
                <span class="text-white/40 text-[10px] tracking-[0.4em] uppercase font-light border-t border-white/10 pt-3">
                    Creative Director & Visual Storyteller
                </span>
            </div>

            <div class="absolute bottom-16 w-full px-20 flex justify-between items-end">
                <div class="flex items-center gap-4">
                    <span class="text-white/30 text-xs tracking-widest uppercase">Volume . 01</span>
                    <div class="w-12 h-[1px] bg-accentGold/30"></div>
                </div>
                <div class="text-white/30 text-xs tracking-[0.5em] uppercase">
                    2026 // PORTFOLIO
                </div>
            </div>

        </div>

        <div class="absolute top-1/2 left-0 w-20 h-px bg-primary/20"></div>
        <div class="absolute top-1/2 right-0 w-20 h-px bg-primary/20"></div>

    </div>

</body>
</html>
