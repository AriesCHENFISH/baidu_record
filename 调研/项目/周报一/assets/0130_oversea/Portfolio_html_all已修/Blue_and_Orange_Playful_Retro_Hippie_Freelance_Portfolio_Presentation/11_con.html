<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Portfolio - Page 09</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; background-color: #111111;
            position: relative; margin: 0 auto; overflow: hidden;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }
        .font-retro { font-family: 'Shrikhand', cursive; }
        
        /* 中间粉色拱形 */
        .arch-shape { border-top-left-radius: 50% 120px; border-top-right-radius: 50% 120px; }
        
        /* 左右照片的偏硬投影 */
        .photo-shadow { box-shadow: 12px 12px 0px #3556BC; }
        .photo-shadow-orange { box-shadow: -12px 12px 0px #F28C33; }

        /* 复古相框边距 */
        .polaroid-frame {
            border: 2px solid #F0F0F0;
            padding: 12px;
            background: white;
        }
    </style>
    <script>
        tailwind.config = { theme: { extend: { colors: { 
            retroWhite: '#F0F0F0', retroPink: '#F3A8C3', retroOrange: '#F28C33', retroBlue: '#3556BC', retroGreen: '#4E9445', 
        }}}}
    </script>
</head>
<body>

    <div id="page_container" class="flex flex-col p-12">
        
        <header class="flex justify-between items-end w-full mb-8 z-40">
            <div class="flex items-center gap-0">
                <div class="bg-[#3556BC] border-2 border-retroWhite px-4 py-1 transform rotate-1 shadow-[4px_4px_0px_#F28C33]">
                    <h6 class="text-retroWhite text-sm font-black uppercase tracking-tighter">Freelance Portfolio</h6>
                </div>
                <div class="ml-4 border-2 border-retroWhite rounded-full px-3 py-0.5">
                    <h6 class="text-retroWhite text-xs font-bold tracking-[0.2em]">2023</h6>
                </div>
            </div>

            <div class="relative">
                <div class="absolute -top-2 -right-2 text-retroOrange text-xl"><i class="fa-solid fa-star"></i></div>
                <div class="flex flex-col items-end">
                    <span class="text-retroWhite text-5xl font-retro leading-none relative z-10">09</span>
                    <div class="w-full h-2 bg-retroPink mt-1 shadow-[2px_2px_0px_#3556BC]"></div>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-3 gap-12 h-full items-center pb-12 z-10 relative px-4">
            
            <div class="relative flex justify-center transform -rotate-3 hover:rotate-0 transition-transform duration-500">
                <div class="polaroid-frame photo-shadow-orange w-[300px]">
                    <div class="w-full h-[380px] bg-gray-200 overflow-hidden border border-gray-100">
                        <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=600&auto=format&fit=crop" 
                             class="w-full h-full object-cover" alt="Mockup A">
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-black font-retro text-lg italic">Mockup A</span>
                        <div class="w-8 h-8 rounded-full bg-retroGreen border-2 border-black"></div>
                    </div>
                </div>
            </div>

            <div class="h-full w-full relative pt-10">
                <div class="absolute inset-0 bg-retroPink arch-shape shadow-[15px_15px_0px_rgba(53,86,188,0.3)] flex flex-col items-center justify-end pb-12 pt-16 px-6">
                    <div class="w-full h-[95%] border-2 border-retroWhite flex flex-col justify-center p-8 relative">
                        <div class="absolute top-2 left-2 w-2 h-2 bg-retroWhite"></div>
                        <div class="absolute top-2 right-2 w-2 h-2 bg-retroWhite"></div>
                        
                        <h2 class="font-retro text-5xl text-black mb-8 text-center tracking-tight">Visuals</h2>
                        
                        <p class="text-black text-lg leading-relaxed font-bold text-center mb-10">
                            A curated selection of our design assets and mockups for the project, showcasing the brand's versatility.
                        </p>

                        <div class="flex justify-center gap-6 text-black text-2xl mb-8">
                            <i class="fa-solid fa-camera-retro"></i>
                            <i class="fa-solid fa-pen-nib"></i>
                            <i class="fa-solid fa-layer-group"></i>
                        </div>

                        <div class="mx-auto bg-retroBlue border-2 border-black px-6 py-2 text-retroWhite font-black uppercase text-sm shadow-[4px_4px_0px_#111111] cursor-pointer hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
                            View Gallery
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative flex justify-center transform rotate-3 hover:rotate-0 transition-transform duration-500">
                <div class="polaroid-frame photo-shadow w-[300px]">
                    <div class="w-full h-[380px] bg-gray-200 overflow-hidden border border-gray-100">
                        <img src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d?q=80&w=600&auto=format&fit=crop" 
                             class="w-full h-full object-cover" alt="Mockup B">
                    </div>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-black font-retro text-lg italic">Mockup B</span>
                        <div class="w-8 h-8 rounded-full bg-retroOrange border-2 border-black"></div>
                    </div>
                </div>
            </div>
        </main>

        <div class="absolute top-[160px] left-[80px] z-0 text-retroGreen text-6xl opacity-40">
            <i class="fa-solid fa-star-of-life fa-spin" style="animation-duration: 10s;"></i>
        </div>
        <div class="absolute bottom-[-20px] right-[40px] z-0 text-[180px] font-retro text-retroWhite opacity-5 select-none uppercase italic">
            Shapes
        </div>
        <div class="absolute bottom-[40px] left-[60px] w-32 h-32 border-8 border-retroOrange rounded-full opacity-30"></div>

    </div>
</body>
</html>
