<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Contents - Static Pink</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <style>
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111111;
            overflow: hidden;
            padding: 80px 100px;
        }
        .retro-font { font-family: 'Georgia', serif; font-style: italic; }
        .pink-tag { background-color: #F3A8C3; color: #111111; border: 2px solid #111111; }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div id="page_container">
        <header class="absolute top-0 left-0 w-full px-12 py-8 flex justify-between items-end z-50">
            <div class="flex items-center gap-0">
                <div class="bg-[#4E9445] border-2 border-[#F0F0F0] px-4 py-1 transform rotate-1 shadow-[4px_4px_0px_#F28C33]">
                    <h6 class="text-[#F0F0F0] text-sm font-black uppercase tracking-tighter">Table of Contents</h6>
                </div>
                <div class="ml-4 border-2 border-[#F0F0F0] rounded-full px-3 py-0.5">
                    <h6 class="text-[#F0F0F0] text-xs font-bold tracking-[0.2em]">02 / 12</h6>
                </div>
            </div>
            <div class="text-[#F0F0F0] text-5xl font-black italic retro-font leading-none tracking-tighter">Index</div>
        </header>

        <div class="mb-14 relative inline-block">
            <h2 class="text-7xl font-black text-[#F3A8C3] uppercase italic transform -rotate-1">Structure</h2>
            <div class="w-full h-3 bg-[#F28C33] mt-2 shadow-[4px_4px_0px_#3556BC]"></div>
        </div>

        <div class="grid grid-cols-2 gap-x-20 gap-y-4">
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">01</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Introduction</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">06</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Social Campaigns</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">02</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Design Vision</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">07</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Photography</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">03</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Brand Identity</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">08</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Typography UI</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">04</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Project Archive</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">09</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">User Research</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">05</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Services Matrix</h3>
            </div>
            <div class="flex items-center gap-0 border-b border-white/10 pb-2">
                <div class="pink-tag px-3 py-1 font-black text-2xl mr-6">10</div>
                <h3 class="text-2xl font-bold uppercase text-[#F0F0F0]">Final Roadmap</h3>
            </div>
        </div>

        <div class="absolute bottom-12 right-12 text-[#F28C33] text-8xl transform rotate-12"><i class="fa-solid fa-star-of-life"></i></div>
        <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-[#3556BC] rounded-full opacity-20"></div>
    </div>
</body>
</html>
