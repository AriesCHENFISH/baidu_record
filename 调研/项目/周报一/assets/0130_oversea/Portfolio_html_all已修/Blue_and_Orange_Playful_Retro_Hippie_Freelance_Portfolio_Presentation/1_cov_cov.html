<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pop Cover - Static</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <style>
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #111111;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        .retro-font { font-family: 'Georgia', serif; font-style: italic; }
        .pop-shadow { box-shadow: 12px 12px 0px #3556BC; }
        .sticker-shadow { box-shadow: 6px 6px 0px #111111; }
    </style>
</head>
<body>

    <div id="page_container">
        <header class="absolute top-0 left-0 w-full px-12 py-8 flex justify-between items-end z-50">
            <div class="flex items-center gap-0">
                <div class="bg-[#F28C33] border-2 border-[#F0F0F0] px-4 py-1 transform -rotate-2 sticker-shadow">
                    <h6 class="text-[#111111] text-sm font-black uppercase">Design Portfolio</h6>
                </div>
                <div class="ml-4 border-2 border-[#F0F0F0] rounded-full px-3 py-0.5">
                    <h6 class="text-[#F0F0F0] text-xs font-bold tracking-[0.2em]">2026.01</h6>
                </div>
            </div>
            <div class="text-[#F0F0F0] text-2xl font-black italic retro-font">Creative Archive</div>
        </header>

        <div class="absolute top-1/4 left-10 text-[#3556BC] text-[180px] opacity-10 pointer-events-none font-black transform -rotate-12">POP</div>
        <div class="absolute bottom-20 right-20 text-[#4E9445] text-[120px] opacity-20"><i class="fa-solid fa-certificate"></i></div>

        <div class="w-[920px] h-[480px] bg-[#F0F0F0] border-2 border-[#111111] rounded-2xl pop-shadow z-20 flex flex-col overflow-hidden relative">
            <div class="w-full h-10 border-b-2 border-[#111111] flex items-center px-4 gap-2 bg-[#F0F0F0]">
                <div class="w-3 h-3 rounded-full bg-[#F3A8C3] border border-[#111]"></div>
                <div class="w-3 h-3 rounded-full bg-[#F28C33] border border-[#111]"></div>
                <div class="w-3 h-3 rounded-full bg-[#4E9445] border border-[#111]"></div>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center bg-white">
                <div class="text-center relative">
                    <h1 class="text-[120px] font-black text-[#3556BC] leading-none tracking-tighter transform -rotate-2">FREELANCE</h1>
                    <div class="relative inline-block">
                        <div class="absolute -top-6 -left-12 transform -rotate-12 z-30">
                            <i class="fa-solid fa-face-smile text-[#F28C33] bg-[#111] rounded-full text-7xl border-2 border-[#F0F0F0]"></i>
                        </div>
                        <h1 class="text-[120px] font-black text-[#F28C33] leading-none tracking-tighter transform rotate-1">PORTFOLIO</h1>
                    </div>
                </div>
                <div class="mt-8 w-64 h-2 bg-[#111111]"></div>
            </div>
        </div>

        <div class="absolute bottom-12 left-12 w-80 bg-[#F3A8C3] border-2 border-[#111111] p-6 transform -rotate-3 sticker-shadow z-30">
            <div class="flex flex-col gap-2 text-[#111111]">
                <div class="flex justify-between border-b border-[#111111] pb-2">
                    <span class="text-xs font-black uppercase">Presenter</span>
                    <span class="text-xs font-bold">Design Dept.</span>
                </div>
                <h4 class="text-2xl font-black py-1">Olivia Wilson</h4>
                <p class="text-[10px] font-bold leading-tight opacity-80 uppercase tracking-widest">Visual Communication Studio</p>
            </div>
        </div>

        <div class="absolute top-1/3 right-16 text-[#F28C33] text-6xl transform rotate-12"><i class="fa-solid fa-star-of-life"></i></div>
    </div>
</body>
</html>
