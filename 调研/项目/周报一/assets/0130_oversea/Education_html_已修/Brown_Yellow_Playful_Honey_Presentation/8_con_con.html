<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceria & Co. - Meet Our Team</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: #2E1A16;
        }

        .font-serif-display { font-family: 'Playfair Display', serif; }

        /* --- 统一导航设计 --- */
        .single-nav-tag {
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            color: #F8C854;
            position: relative;
            padding-bottom: 4px;
        }
        .single-nav-tag::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 1px;
            background: rgba(248, 200, 84, 0.5);
        }
        .glass-action {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(248, 200, 84, 0.2);
            transition: all 0.3s ease;
        }

        /* 标题镂空 */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 1.5px #F8C854;
        }

        /* 蜂蜜滴落 */
        .honey-drip {
            position: absolute;
            background-color: #F8C854;
            border-radius: 0 0 50px 50px;
            top: -10px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }

        /* 金句动效 */
        .quote-line {
            background: linear-gradient(90deg, #F8C854 0%, rgba(248, 200, 84, 0) 100%);
            height: 1px;
            width: 100%;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0 z-0 opacity-10">
            <img src="https://images.unsplash.com/photo-1581594833252-f32df3f4c6a6?q=80&w=1280&auto=format&fit=crop" class="w-full h-full object-cover mix-blend-overlay">
        </div>

        <header class="absolute top-0 left-0 w-full px-16 py-10 flex justify-between items-center z-50">
            <div class="flex items-center space-x-3 text-white">
                <i class="fa-solid fa-crown text-[#F8C854] text-sm"></i>
                <span class="font-serif-display text-lg tracking-[0.2em]">LICERIA</span>
            </div>

            <div class="flex flex-col items-center">
                <span class="single-nav-tag">Explore Collection</span>
                <span class="text-[10px] opacity-40 mt-1 font-light tracking-[0.1em] text-white">EST. 1992</span>
            </div>

            <div class="glass-action px-5 py-2 rounded-lg flex items-center space-x-4 cursor-pointer text-white">
                <span class="text-[0.65rem] font-bold tracking-widest opacity-80 uppercase">Member Access</span>
                <div class="w-6 h-6 bg-[#F8C854] rounded flex items-center justify-center">
                    <i class="fa-solid fa-arrow-right text-[#2E1A16] text-[10px]"></i>
                </div>
            </div>
        </header>

        <div class="absolute top-0 right-10 z-10 w-48 pointer-events-none">
            <div class="honey-drip w-12 h-32 right-12 absolute"></div>
            <div class="honey-drip w-16 h-48 right-0 absolute"></div>
        </div>

        <main class="relative z-20 grid grid-cols-12 gap-8 px-16 h-full pt-24">
            
            <div class="col-span-8 flex flex-col justify-center">
                
                <div class="flex items-center gap-6 mb-12">
                    <div class="flex flex-col items-center w-1/3">
                        <div class="relative w-full aspect-[3/4] rounded-[30px] overflow-hidden border-2 border-white/10 shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=400&auto=format&fit=crop" class="w-full h-full object-cover">
                        </div>
                        <div class="bg-[#F8C854] px-4 py-2 rounded-full -mt-5 z-10 shadow-lg text-center">
                            <h3 class="text-[#2E1A16] font-bold text-[10px] uppercase tracking-tighter">Adora Montminy</h3>
                        </div>
                    </div>

                    <div class="flex flex-col items-center w-1/3 translate-y-6">
                        <div class="relative w-full aspect-[3/4] rounded-[30px] overflow-hidden border-2 border-white/10 shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" class="w-full h-full object-cover">
                        </div>
                        <div class="bg-[#F8C854] px-4 py-2 rounded-full -mt-5 z-10 shadow-lg text-center">
                            <h3 class="text-[#2E1A16] font-bold text-[10px] uppercase tracking-tighter">Bailey Dupont</h3>
                        </div>
                    </div>

                    <div class="flex flex-col items-center w-1/3">
                        <div class="relative w-full aspect-[3/4] rounded-[30px] overflow-hidden border-2 border-white/10 shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=400&auto=format&fit=crop" class="w-full h-full object-cover">
                        </div>
                        <div class="bg-[#F8C854] px-4 py-2 rounded-full -mt-5 z-10 shadow-lg text-center">
                            <h3 class="text-[#2E1A16] font-bold text-[10px] uppercase tracking-tighter">Donna Stroupe</h3>
                        </div>
                    </div>
                </div>

                <div class="pl-2 mt-4">
                    <div class="quote-line mb-4"></div>
                    <h4 class="font-serif-display text-4xl text-white italic leading-tight">
                        "Great things in business are <span class="text-[#F8C854]">never done by one person</span>, they're done by a team of people."
                    </h4>
                    <p class="text-white/40 text-[10px] uppercase tracking-[0.4em] mt-4 font-light">Crafting the Future of Organic Gold</p>
                </div>
            </div>

            <div class="col-span-4 flex flex-col justify-center items-end pb-12">
                <div class="text-right leading-none">
                    <h2 class="font-serif-display text-[9rem] text-outline opacity-80">Meet</h2>
                    <h2 class="font-serif-display text-[9rem] text-[#F8C854] -mt-8">Our</h2>
                    <h2 class="font-serif-display text-[9rem] text-outline opacity-80 -mt-8">Team</h2>
                </div>
                <div class="mt-4 flex items-center gap-4">
                    <div class="w-12 h-[1px] bg-[#F8C854]"></div>
                    <p class="text-[#F8C854] text-[10px] font-light tracking-[0.3em] uppercase">Creative Minds</p>
                </div>
            </div>

        </main>
        
        <div class="absolute -bottom-10 -left-10 w-64 h-64 border border-[#F8C854]/10 rounded-full"></div>
    </div>

</body>
</html>
