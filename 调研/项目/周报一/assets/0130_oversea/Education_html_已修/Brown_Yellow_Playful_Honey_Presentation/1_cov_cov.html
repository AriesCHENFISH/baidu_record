<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceria & Co. - Cover Page</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans SC', sans-serif; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #2E1A16; overflow: hidden;
        }
        .font-serif-display { font-family: 'Playfair Display', serif; }
        /* 统一导航样式 */
        .single-nav-tag { letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.75rem; font-weight: 600; color: #F8C854; position: relative; padding-bottom: 4px; }
        .single-nav-tag::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 1px; background: rgba(248, 200, 84, 0.5); }
        .glass-action { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px); border: 1px solid rgba(248, 200, 84, 0.2); transition: all 0.3s ease; }
        
        .title-stroke { color: transparent; -webkit-text-stroke: 1.5px #F8C854; }
        .honey-drip { background-color: #F8C854; border-bottom-left-radius: 100px; border-bottom-right-radius: 100px; position: absolute; top: 0; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="page_container">
        <header class="absolute top-0 left-0 w-full px-16 py-10 flex justify-between items-center z-50">
            <div class="flex items-center space-x-3 text-white">
                <i class="fa-solid fa-crown text-[#F8C854] text-sm"></i>
                <span class="font-serif-display text-lg tracking-[0.2em]">LICERIA</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="single-nav-tag">Premium Presentation</span>
                <span class="text-[10px] opacity-40 mt-1 font-light tracking-[0.1em] text-white">EST. 1992</span>
            </div>
            <div class="glass-action px-5 py-2 rounded-lg flex items-center space-x-4 cursor-pointer text-white">
                <span class="text-[0.65rem] font-bold tracking-widest opacity-80 uppercase">Annual Report</span>
                <div class="w-6 h-6 bg-[#F8C854] rounded flex items-center justify-center"><i class="fa-solid fa-arrow-right text-[#2E1A16] text-[10px]"></i></div>
            </div>
        </header>

        <div style="position: absolute; top: 0; right: 40px; width: 300px; height: 200px; z-index: 20;">
            <div style="position:absolute; top:-100px; right:0; width: 220px; height: 160px; background:#F8C854; border-radius: 50%;"></div>
            <div class="honey-drip" style="right: 140px; width: 60px; height: 140px;"></div>
            <div class="honey-drip" style="right: 60px; width: 50px; height: 180px;"></div>
        </div>

        <div class="h-full flex flex-col items-center justify-center text-center">
            <h2 class="text-[#F8C854] tracking-[0.8em] uppercase text-sm mb-8 font-light">Organic Pure Collection</h2>
            <div class="relative">
                <h1 class="font-serif-display text-[11rem] leading-none mb-4 text-[#F8C854] drop-shadow-2xl">HONEY</h1>
                <h1 class="font-serif-display text-[11rem] leading-none title-stroke -mt-10 opacity-40">GLORY</h1>
            </div>
            <div class="mt-12 flex items-center gap-6">
                <div class="w-24 h-[1px] bg-[#F8C854] opacity-30"></div>
                <span class="text-white tracking-[0.4em] text-xs font-medium uppercase">Visual Presentation 2026</span>
                <div class="w-24 h-[1px] bg-[#F8C854] opacity-30"></div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-[15%] bg-[#F8C854] clip-path-polygon flex items-center justify-center" style="clip-path: polygon(0 40%, 100% 0, 100% 100%, 0% 100%);">
            <span class="text-[#2E1A16] font-serif-display italic text-lg tracking-widest pt-8">Sustainable · Organic · Pure</span>
        </div>
    </div>
</body>
</html>
