<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Shodwe - Premium Presentation</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F5F7FA; /* 还原干净的浅灰背景 */
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 还原：经典的柔和光晕 */
        .blur-orb-top {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(46, 92, 190, 0.2) 0%, rgba(137, 196, 244, 0.1) 40%, transparent 70%);
            top: -250px;
            left: -150px;
            filter: blur(80px);
            z-index: 1;
        }

        .blur-orb-bottom {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(137, 196, 244, 0.25) 0%, rgba(46, 92, 190, 0.15) 50%, transparent 70%);
            bottom: -300px;
            right: -150px;
            filter: blur(100px);
            z-index: 1;
        }

        /* 还原：右下角巨大的装饰数字 */
        .big-number-bg {
            position: absolute;
            bottom: -100px;
            right: -20px;
            font-size: 480px;
            font-weight: 800;
            color: #FFFFFF; /* 纯白，利用背景色差产生微妙视觉 */
            line-height: 1;
            z-index: 2;
            opacity: 0.9;
            pointer-events: none;
            user-select: none;
        }

        /* 导航胶囊 - 保持美化后的精致质感 */
        .nav-pill {
            border: 1px solid #4A6FA5;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        /* 标题排版装饰线 */
        .gradient-accent-line {
            background: linear-gradient(90deg, #2E5CBE, #89C4F4, transparent);
            box-shadow: 0 2px 10px rgba(46, 92, 190, 0.1);
        }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- 还原的背景元素 -->
        <div class="blur-orb-top"></div>
        <div class="blur-orb-bottom"></div>
        <div class="big-number-bg">01</div>

        <!-- 内容层 -->
        <div class="relative z-10 w-full h-full flex flex-col justify-between px-20 py-16">
            
            <!-- 头部导航 -->
            <div class="flex justify-end">
                <nav class="nav-pill rounded-full px-12 py-3 w-[640px] flex justify-between items-center">
                    <span class="text-[#666] text-sm font-bold tracking-[0.2em] uppercase">Studio Shodwe</span>
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-[#2E5CBE]"></div>
                        <span class="text-[#666] text-sm font-medium tracking-wide">Project Concept</span>
                    </div>
                    <span class="text-[#333] text-sm font-bold tracking-widest">2024</span>
                </nav>
            </div>

            <!-- 主标题区域：保留了美化后的排版重心 -->
            <div class="flex flex-col flex-grow justify-center pl-4">
                <div class="mb-2">
                    <span class="text-[#2E5CBE] text-xs font-bold tracking-[0.5em] uppercase">Visual Excellence</span>
                </div>
                <h1 class="text-[#333] font-black text-[150px] leading-[0.8] tracking-tighter uppercase">
                    Project
                </h1>
                <div class="flex items-center gap-10 mt-2">
                    <h2 class="text-[#333] text-6xl font-light tracking-[0.35em] uppercase">
                        Presentation
                    </h2>
                    <!-- 动态修饰线 -->
                    <div class="h-2 flex-grow max-w-[400px] gradient-accent-line rounded-full"></div>
                </div>
                
                <!-- 引导语 -->
                <p class="mt-12 text-[#666] text-lg font-light leading-relaxed max-w-lg italic">
                    A comprehensive design study on minimalist aesthetics and strategic visual communication for Studio Shodwe’s upcoming fiscal cycle.
                </p>
            </div>

            <!-- 底部作者信息 -->
            <div class="flex justify-between items-end">
                <div class="flex items-center gap-6">
                    <div class="flex flex-col">
                        <span class="text-[#2E5CBE] text-[10px] font-bold tracking-[0.3em] uppercase mb-1">Presented By</span>
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-circle-user text-3xl text-[#2E5CBE]"></i>
                            <span class="text-[#333] text-2xl font-bold tracking-wide uppercase">Murad Nasser</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col items-end opacity-40">
                    <span class="text-[10px] text-[#333] tracking-[0.4em] uppercase font-medium">All Rights Reserved // 2024</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
