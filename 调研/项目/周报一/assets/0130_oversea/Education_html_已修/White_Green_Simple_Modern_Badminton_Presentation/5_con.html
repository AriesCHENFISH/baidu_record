<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactics - Badminton Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #2B522C; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .main-hero-img {
            position: absolute; width: 800px; height: 500px;
            right: 0; top: 110px;
            border-radius: 40px 0 0 40px;
            box-shadow: -20px 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .floating-card {
            background: rgba(240, 244, 239, 0.95);
            box-shadow: 20px 20px 50px rgba(0,0,0,0.3);
        }
        .tag-pill {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div id="page_container" class="p-16">
        <header class="relative z-20 flex justify-between items-start mb-12">
            <div>
                <span class="tag-pill px-4 py-1 rounded-full text-xs font-bold text-white tracking-widest uppercase mb-4 inline-block">Advanced Strategy</span>
                <h1 class="text-7xl font-black text-white uppercase tracking-tighter leading-none">Core <span class="italic text-white opacity-40">Tactics</span></h1>
            </div>
            <div class="text-right">
                <i class="fa-solid fa-shuttlecock text-white/20 text-5xl mb-2"></i>
                <p class="text-white/40 text-[10px] tracking-[0.5em] uppercase">Rimberio Academy</p>
            </div>
        </header>

        <div class="relative h-[480px]">
            <div class="main-hero-img z-0">
                <img src="https://images.unsplash.com/photo-1521537634581-0dced2fee2ef?q=80&w=1470&auto=format&fit=crop" 
                     class="w-full h-full object-cover" alt="Smash Technique">
                <div class="absolute inset-0 bg-gradient-to-l from-transparent to-[#2B522C]/60"></div>
            </div>

            <div class="floating-card absolute left-0 top-1/2 -translate-y-1/2 w-[550px] p-12 rounded-3xl z-10">
                <h3 class="text-3xl font-black text-[#2B522C] mb-6 flex items-center gap-4">
                    <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    Attacking Play
                </h3>
                <p class="text-[#2B522C]/70 leading-relaxed mb-8">
                    Modern badminton relies heavily on high-speed smashes and aggressive net control. The objective is to force a weak return and finish the point early with precision.
                </p>
                
                <div class="grid grid-cols-2 gap-6">
                    <div class="border-l-4 border-[#336534] pl-4">
                        <span class="block font-black text-xl text-[#2B522C]">85%</span>
                        <span class="text-xs text-[#2B522C]/50 uppercase font-bold tracking-tighter">Smash Accuracy</span>
                    </div>
                    <div class="border-l-4 border-[#336534] pl-4">
                        <span class="block font-black text-xl text-[#2B522C]">12ms</span>
                        <span class="text-xs text-[#2B522C]/50 uppercase font-bold tracking-tighter">Reaction Time</span>
                    </div>
                </div>

                <button class="mt-10 bg-[#2B522C] text-white px-8 py-3 rounded-xl font-bold text-sm flex items-center gap-3 hover:bg-[#336534] transition-colors">
                    READ ANALYSIS <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </div>
        </div>

        <div class="absolute bottom-8 right-16 flex items-center gap-8 opacity-20">
            <div class="text-white text-xs font-mono uppercase">System: Tactical_Sync_v2</div>
            <div class="w-12 h-12 border-2 border-white rounded-full flex items-center justify-center">
                <i class="fa-solid fa-rotate text-white"></i>
            </div>
        </div>
    </div>
</body>
</html>
