<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundamental Soccer Skills - Presentation Slide</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Fonts: Noto Sans SC (Domestic CDN as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container - Strict 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            margin: 0 auto;
            background: linear-gradient(135deg, #4A89C6 0%, #3A6CA0 100%); /* Sky Blue Gradient */
            overflow: hidden;
            color: #FFFFFF;
        }

        /* Custom Utilities not in standard Tailwind configuration */
        .skew-box {
            transform: skewX(-25deg);
        }
        
        /* Typography adjustments */
        h1 {
            line-height: 0.9;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <!-- Logo Section (Top Left) -->
        <div class="absolute top-10 left-10 z-20">
            <div class="bg-white text-black px-6 py-2 rounded-full flex items-center gap-3 shadow-lg">
                <i class="fa-solid fa-futbol text-lg"></i>
                <span class="font-bold tracking-wide text-sm">Fradel and Spies Co.</span>
            </div>
        </div>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-12 h-full w-full">
            
            <!-- Left Column: Visual Imagery Gallery (5 Columns) -->
            <div class="col-span-5 relative h-full flex flex-col justify-center pl-10 pr-4">
                <!-- Decorative Geometric Backdrop for Images -->
                <div class="absolute top-1/2 left-4 -translate-y-1/2 w-full h-[85%] bg-white/10 rounded-3xl -z-10 backdrop-blur-sm border border-white/20"></div>

                <div class="grid grid-cols-2 gap-4 h-[75%]">
                    <!-- Main Vertical Image -->
                    <div class="row-span-2 relative overflow-hidden rounded-xl shadow-2xl group">
                        <img src="https://images.unsplash.com/photo-1560272564-c83b66b1ad12?q=80&w=800&auto=format&fit=crop" 
                             alt="Soccer player heading ball" 
                             class="w-full h-full object-cover">
                        <!-- 400*600 -->
                        <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
                    </div>

                    <!-- Top Small Image -->
                    <div class="relative overflow-hidden rounded-xl shadow-xl border-2 border-white/20">
                        <img src="https://images.unsplash.com/photo-1511886929837-354d827aae26?q=80&w=400&auto=format&fit=crop" 
                             alt="Feet controlling soccer ball" 
                             class="w-full h-full object-cover">
                        <!-- 250*250 -->
                    </div>

                    <!-- Bottom Small Image -->
                    <div class="relative overflow-hidden rounded-xl shadow-xl border-2 border-white/20">
                        <img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=400&auto=format&fit=crop" 
                             alt="Soccer ball in net" 
                             class="w-full h-full object-cover">
                        <!-- 250*250 -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Content & Logic (7 Columns) -->
            <div class="col-span-7 flex flex-col justify-center pr-16 pl-8 relative">
                
                <!-- Background Geometric Decoration (Circle) -->
                <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-white/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4 pointer-events-none"></div>

                <!-- Title Section -->
                <div class="mb-12">
                    <h1 class="text-[90px] font-black uppercase tracking-tighter text-white drop-shadow-md">
                        Fundamental<br>
                        <span class="text-white/90">Skill</span>
                    </h1>
                </div>

                <!-- List Section -->
                <div class="w-full max-w-xl mb-10">
                    <ul class="flex flex-col">
                        <!-- List Item 1 -->
                        <li class="border-b border-white/30 py-4 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle text-[10px] text-[#7FA956]"></i>
                                <span class="text-2xl font-bold tracking-wide">Dribbling</span>
                            </div>
                            <i class="fa-solid fa-arrow-right text-white/0 group-hover:text-white transition-colors duration-300"></i>
                        </li>

                        <!-- List Item 2 -->
                        <li class="border-b border-white/30 py-4 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle text-[10px] text-[#7FA956]"></i>
                                <span class="text-2xl font-bold tracking-wide">Passing</span>
                            </div>
                        </li>

                        <!-- List Item 3 -->
                        <li class="border-b border-white/30 py-4 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle text-[10px] text-[#7FA956]"></i>
                                <span class="text-2xl font-bold tracking-wide">Shooting</span>
                            </div>
                        </li>

                        <!-- List Item 4 -->
                        <li class="border-b border-white/30 py-4 flex items-center justify-between group">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle text-[10px] text-[#7FA956]"></i>
                                <span class="text-2xl font-bold tracking-wide">Tackling</span>
                            </div>
                        </li>
                    </ul>
                </div>

                <!-- Description Text -->
                <div class="max-w-lg mb-8">
                    <p class="text-gl text-white/80 leading-relaxed font-light">
                        Mastering the basics is crucial for player development. 
                        Effective training focuses on precision, control, and tactical awareness 
                        to build a strong foundation for competitive play.
                    </p>
                </div>

                <!-- Footer Decoration / Stripes -->
                <div class="absolute bottom-12 right-12 flex items-center gap-3">
                    <!-- Skewed Stripes -->
                    <div class="w-4 h-10 bg-white skew-box opacity-60"></div>
                    <div class="w-4 h-10 bg-white skew-box opacity-80"></div>
                    <!-- Long Bar -->
                    <div class="w-64 h-10 bg-white skew-box flex items-center justify-center">
                        <!-- Decorative thin line inside -->
                        <div class="w-[90%] h-[2px] bg-[#4A89C6]"></div>
                    </div>
                    <div class="w-4 h-10 bg-white skew-box opacity-80"></div>
                    <div class="w-4 h-10 bg-white skew-box opacity-60"></div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
