<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Analysis - Smart Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { deepBg: '#050510', navBg: '#1F1D36', lightMint: '#D0F4DE', softCyan: '#8DE4E6', mutedBlue: '#5DAFCC', textGray: '#B0B0B8', glowPurple: '#2D2B55' } } } }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #050510; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
    </style>
</head>
<body>
    <div class="page_container">
        <div class="absolute top-[-150px] left-[-150px] w-[600px] h-[600px] rounded-full bg-glowPurple blur-[120px] opacity-60 z-0"></div>
        <div class="absolute bottom-[-200px] right-[-100px] w-[700px] h-[700px] rounded-full bg-glowPurple blur-[140px] opacity-50 z-0"></div>

        <header class="relative z-20 w-full pt-16 px-16 flex justify-start items-center">
            <div class="flex items-center">
                <div class="w-[4px] h-12 bg-gradient-to-b from-softCyan to-mutedBlue rounded-full mr-8 shadow-[0_0_15px_rgba(141,228,230,0.4)]"></div>
                <div class="flex flex-col">
                    <h2 class="text-5xl font-black tracking-[0.35em] text-white leading-none uppercase">EXPENSES</h2>
                    <p class="text-[11px] text-mutedBlue tracking-[0.5em] font-medium uppercase mt-3 opacity-80">Operational Expense Report</p>
                </div>
            </div>
        </header>

        <div class="relative z-20 flex flex-col items-center w-full mt-6 px-16">
            <div class="mb-8 text-center">
                <h1 class="text-5xl font-bold text-white tracking-tight">Expense Analysis</h1>
            </div>
            <div class="grid grid-cols-2 gap-12 w-full h-[400px]">
                <div class="flex flex-col p-8 bg-navBg rounded-[32px] border border-white/5 relative overflow-hidden group">
                    <div id="chart-salaries" class="w-full h-[200px] mb-4"></div>
                    <div class="mt-auto">
                        <h2 class="text-2xl font-bold text-white mb-2">Salaries & Wages</h2>
                        <p class="text-textGray text-sm leading-relaxed">Human resource expenditure analysis focusing on operational efficiency and growth scaling.</p>
                    </div>
                </div>
                <div class="flex flex-col p-8 bg-navBg rounded-[32px] border border-white/5 relative overflow-hidden group">
                    <div id="chart-marketing" class="w-full h-[200px] mb-4"></div>
                    <div class="mt-auto">
                        <h2 class="text-2xl font-bold text-white mb-2">Marketing</h2>
                        <p class="text-textGray text-sm leading-relaxed">Strategic marketing investment and brand development cost tracking for the current fiscal period.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const colors = { c1: '#D0F4DE', c2: '#8DE4E6', c3: '#5DAFCC', c4: '#4E86B3', text: '#B0B0B8' };
        function getChartOption(dataValues) {
            return {
                grid: { top: '15%', bottom: '10%', left: '10%', right: '5%', containLabel: true },
                xAxis: { type: 'category', data: ['Q1', 'Q2', 'Q3', 'Q4'], axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: colors.text } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.05)', type: 'dashed' } }, axisLabel: { color: colors.text } },
                series: [{ data: [
                    { value: dataValues[0], itemStyle: { color: colors.c1, borderRadius: [6, 6, 0, 0] } },
                    { value: dataValues[1], itemStyle: { color: colors.c2, borderRadius: [6, 6, 0, 0] } },
                    { value: dataValues[2], itemStyle: { color: colors.c3, borderRadius: [6, 6, 0, 0] } },
                    { value: dataValues[3], itemStyle: { color: colors.c4, borderRadius: [6, 6, 0, 0] } }
                ], type: 'bar', barWidth: '60%' }]
            };
        }
        echarts.init(document.getElementById('chart-salaries')).setOption(getChartOption([8, 12, 16, 20]));
        echarts.init(document.getElementById('chart-marketing')).setOption(getChartOption([10, 15, 12, 25]));
    </script>
</body>
</html>
