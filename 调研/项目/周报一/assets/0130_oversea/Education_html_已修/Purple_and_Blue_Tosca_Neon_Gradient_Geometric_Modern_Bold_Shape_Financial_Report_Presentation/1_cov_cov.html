<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Financial Report 2026 - Centered Cover</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #050510; overflow: hidden; position: relative; font-family: 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; margin: 0 auto; }
        .grid-pattern { position: absolute; inset: 0; background-image: radial-gradient(rgba(78, 134, 179, 0.12) 1px, transparent 1px); background-size: 40px 40px; }
        .logo-tracking { letter-spacing: 0.35em; }
        .bg-text { position: absolute; font-size: 420px; font-weight: 900; color: rgba(255, 255, 255, 0.02); line-height: 1; z-index: 0; top: 50%; left: 50%; transform: translate(-50%, -50%); font-style: italic; pointer-events: none; }
        .glow-sphere { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.2; z-index: 1; }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="grid-pattern z-0"></div>
        <div class="bg-text">2026</div>
        <div class="glow-sphere w-[800px] h-[800px] bg-blue-600 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

        <header class="relative z-50 w-full pt-16 px-16 flex items-center shrink-0">
            <div class="flex items-center">
                <div class="w-[5px] h-12 bg-gradient-to-b from-[#8DE4E6] to-[#4E86B3] rounded-full mr-10 shadow-[0_0_20px_rgba(141,228,230,0.5)]"></div>
                <div class="flex flex-col">
                    <h2 class="text-4xl font-black text-white leading-none uppercase logo-tracking">FRADEL</h2>
                    <p class="text-[11px] text-[#8DE4E6] font-bold uppercase mt-3 tracking-[0.5em]">Systematic Enterprise Solutions</p>
                </div>
            </div>
        </header>

        <main class="relative z-10 w-full flex-1 flex flex-col justify-center items-center text-center">
            <div class="max-w-[1000px] mx-auto">
                <div class="flex items-center justify-center gap-4 mb-8">
                    <div class="h-[1px] w-12 bg-[#8DE4E6]/50"></div>
                    <span class="text-[#8DE4E6] text-xs font-mono font-bold tracking-[0.4em] uppercase">Confidential Document</span>
                    <div class="h-[1px] w-12 bg-[#8DE4E6]/50"></div>
                </div>
                
                <h1 class="text-white text-[140px] font-black leading-[0.85] tracking-tighter">
                    Financial<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#D0F4DE] via-[#8DE4E6] to-[#4E86B3]">Report</span>
                </h1>
                
                <div class="mt-16 flex items-center justify-center gap-20">
                    <div class="flex flex-col items-center">
                        <span class="text-[12px] text-[#5DAFCC] uppercase tracking-[0.3em] mb-2 font-bold">Current Period</span>
                        <span class="text-white font-bold text-3xl tracking-tight">JAN - DEC 2026</span>
                    </div>
                    <div class="w-[1px] h-12 bg-white/10"></div>
                    <div class="flex flex-col items-center">
                        <span class="text-[12px] text-[#5DAFCC] uppercase tracking-[0.3em] mb-2 font-bold">Data Status</span>
                        <div class="flex items-center gap-3">
                            <div class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse"></div>
                            <span class="text-white font-bold text-3xl tracking-tight">AUDITED</span>
                        </div>
                    </div>
                </div>

                <div class="mt-20 w-[400px] mx-auto">
                    <div class="flex justify-between items-end mb-3">
                        <span class="text-[10px] text-[#5DAFCC] font-mono tracking-widest">SYSTEM_INTEGRITY_CHECK</span>
                        <span class="text-[#8DE4E6] font-mono text-lg font-bold">98%</span>
                    </div>
                    <div class="w-full h-[1px] bg-white/10 rounded-full overflow-hidden">
                        <div class="w-[98%] h-full bg-gradient-to-r from-[#8DE4E6] to-[#4E86B3]"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="relative z-50 w-full pb-12 px-16 flex justify-between items-end border-t border-white/5 pt-8">
            <div class="text-[10px] text-[#B0B0B8] font-mono tracking-widest uppercase opacity-60">
                © 2026 Fradel Group. Global Headquarters.
            </div>
            <div class="flex items-center gap-4 text-[#8DE4E6] font-mono text-sm">
                <span class="opacity-40 italic">SLIDE</span>
                <span class="font-bold tracking-widest">01_COVER</span>
            </div>
        </footer>
    </div>
</body>
</html>
