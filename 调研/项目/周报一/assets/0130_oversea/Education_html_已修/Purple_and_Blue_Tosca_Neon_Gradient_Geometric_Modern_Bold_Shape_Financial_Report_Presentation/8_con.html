<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Statement Key Metrics - Financial Keynote</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/echarts.min_5.4.3.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBg: '#050510', mint: '#D0F4DE', cyan: '#8DE4E6', mutedBlue: '#5DAFCC', steelBlue: '#4E86B3', textGray: '#B0B0B8', glowPurple: '#2D2B55',
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; background-color: #050510; position: relative; overflow: hidden; margin: 0 auto;
        }
        .glow-spot { position: absolute; border-radius: 50%; filter: blur(80px); z-index: 1; opacity: 0.6; }
        .dot-pattern { position: absolute; width: 100px; height: 120px; background-image: radial-gradient(#4E86B3 1.5px, transparent 1.5px); background-size: 12px 12px; opacity: 0.3; z-index: 2; }
        .card-gradient-border {
            background: rgba(31, 29, 54, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(93, 175, 204, 0.2); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="glow-spot" style="width: 500px; height: 500px; top: -150px; left: -100px; background: #2D2B55;"></div>
        <div class="glow-spot" style="width: 400px; height: 400px; top: 100px; right: -50px; background: #1F1D36;"></div>
        <div class="dot-pattern" style="top: 140px; left: 40px;"></div>
        <div class="dot-pattern" style="bottom: 40px; right: 40px;"></div>

        <header class="relative z-20 w-full pt-16 px-16 flex justify-start items-center">
            <div class="flex items-center">
                <div class="w-[4px] h-12 bg-gradient-to-b from-cyan to-steelBlue rounded-full mr-8 shadow-[0_0_15px_rgba(141,228,230,0.4)]"></div>
                <div class="flex flex-col">
                    <h2 class="text-5xl font-black tracking-[0.35em] text-white leading-none uppercase">METRICS</h2>
                    <p class="text-[11px] text-mutedBlue tracking-[0.5em] font-medium uppercase mt-3 opacity-80">
                        Income Statement Highlights
                    </p>
                </div>
            </div>
        </header>

        <div style="position: absolute; top: 150px; width: 100%; text-align: center; z-index: 40;">
            <h1 style="font-size: 56px; font-weight: 700; color: #ffffff; letter-spacing: -1px; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                Income Statement Key Metrics
            </h1>
        </div>

        <div style="position: absolute; top: 260px; left: 0; width: 100%; z-index: 30; display: flex; justify-content: center; gap: 32px; padding: 0 64px;">
            
            <div class="card-gradient-border" style="flex: 2; border-radius: 20px; height: 380px; padding: 24px;">
                <h3 style="font-size: 20px; font-weight: 600; color: #ffffff; margin-bottom: 16px;">Revenue & Net Profit Trend (Q1-Q4)</h3>
                <div id="incomeChart" style="width: 100%; height: 300px;"></div>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; gap: 24px;">
                <div class="card-gradient-border" style="padding: 24px; border-radius: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <h2 style="font-size: 40px; font-weight: 700; color: #D0F4DE; line-height: 1; margin-bottom: 8px;">$45.2M</h2>
                    <h3 style="font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 12px;">Total Revenue</h3>
                    <div style="width: 30px; height: 2px; background: #5DAFCC; margin-bottom: 12px;"></div>
                    <div class="flex items-center gap-2 text-sm text-textGray">
                        <i class="fa-solid fa-arrow-trend-up text-mint"></i>
                        <span>+12% YoY Growth</span>
                    </div>
                </div>
                <div class="card-gradient-border" style="padding: 24px; border-radius: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
                    <h2 style="font-size: 40px; font-weight: 700; color: #8DE4E6; line-height: 1; margin-bottom: 8px;">18.5%</h2>
                    <h3 style="font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 12px;">Net Profit Margin</h3>
                    <div style="width: 30px; height: 2px; background: #4E86B3; margin-bottom: 12px;"></div>
                    <div class="flex items-center gap-2 text-sm text-textGray">
                        <i class="fa-solid fa-arrow-trend-up text-cyan"></i>
                        <span>+2.1% from last quarter</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ECharts 初始化
        const chartDom = document.getElementById('incomeChart');
        const myChart = echarts.init(chartDom);
        const option = {
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis', backgroundColor: '#1F1D36', borderColor: '#5DAFCC', textStyle: { color: '#fff' } },
            legend: { data: ['Revenue', 'Net Profit'], top: 0, textStyle: { color: '#B0B0B8' }, icon: 'circle' },
            grid: { top: '15%', left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: {
                type: 'category',
                data: ['Q1', 'Q2', 'Q3', 'Q4'],
                axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                axisLabel: { color: '#B0B0B8' }
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)', type: 'dashed' } },
                axisLabel: { color: '#B0B0B8' }
            },
            series: [
                {
                    name: 'Revenue', type: 'bar', barWidth: 20,
                    itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#8DE4E6' }, { offset: 1, color: '#5DAFCC' }]), borderRadius: [4, 4, 0, 0] },
                    data: [120, 132, 101, 134]
                },
                {
                    name: 'Net Profit', type: 'line', smooth: true, symbol: 'none',
                    lineStyle: { color: '#D0F4DE', width: 3 },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(208, 244, 222, 0.3)' }, { offset: 1, color: 'rgba(208, 244, 222, 0)' }]) },
                    data: [22, 35, 28, 45]
                }
            ]
        };
        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
