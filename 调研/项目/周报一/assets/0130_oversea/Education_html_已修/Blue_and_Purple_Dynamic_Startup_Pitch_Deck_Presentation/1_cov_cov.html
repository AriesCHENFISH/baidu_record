<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Pitch Deck - Professional Keynote Refined</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: '#8C7AE6',
                        accent: '#B33CE0',
                        deepBlue: '#1B3F9B',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #050505; /* Deep rich black */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 1. 背景网格纹理 - 增加科技感 */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }

        /* 2. 呼吸动画光晕 */
        .glow-sphere {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.4;
            animation: breathe 8s infinite ease-in-out alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* 3. 高级镂空文字效果 */
        .text-outline {
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.2);
            position: relative;
        }
        
        /* 4. 主标题渐变 */
        .title-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #E0E7FF 50%, #8C7AE6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(140, 122, 230, 0.3));
        }

        /* 5. 玻璃拟态卡片升级 */
        .glass-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* 卡片顶部的亮光线条 */
        .glass-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        /* 6. 装饰性角落标记 (HUD corners) */
        .corner-mark {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: rgba(255, 255, 255, 0.15);
            border-style: solid;
            z-index: 10;
        }
        .tl { top: 40px; left: 40px; border-width: 2px 0 0 2px; }
        .tr { top: 40px; right: 40px; border-width: 2px 2px 0 0; }
        .bl { bottom: 40px; left: 40px; border-width: 0 0 2px 2px; }
        .br { bottom: 40px; right: 40px; border-width: 0 2px 2px 0; }

        /* 底部渐变线条 */
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #8C7AE6, #B33CE0, transparent);
            box-shadow: 0 -2px 10px rgba(140, 122, 230, 0.5);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="bg-grid"></div>
        <div class="glow-sphere" style="width: 700px; height: 700px; background: #1B3F9B; top: -300px; left: -200px; animation-delay: 0s;"></div>
        <div class="glow-sphere" style="width: 600px; height: 600px; background: #B33CE0; bottom: -250px; right: -150px; opacity: 0.15; animation-delay: 2s;"></div>
        
        <div class="corner-mark tl"></div>
        <div class="corner-mark tr"></div>
        <div class="corner-mark bl"></div>
        <div class="corner-mark br"></div>

        <header class="relative z-10 w-full px-20 pt-14 flex justify-between items-start">
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-8 bg-gradient-to-b from-neon to-deepBlue rounded-full"></div>
                    <span class="text-white font-bold text-lg tracking-widest uppercase">Ingoude</span>
                </div>
                <span class="text-white/30 text-[10px] tracking-[0.3em] pl-5 uppercase">Future Vision Co.</span>
            </div>
            
            <div class="text-right">
                <span class="text-neon font-mono text-xs opacity-70">2025 / Q1 REPORT</span>
            </div>
        </header>

        <main class="relative z-20 flex-1 flex flex-col items-center justify-center text-center mt-[-40px]">
            
            <div class="mb-6 px-4 py-1 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm">
                <p class="text-neon text-[10px] tracking-[4px] uppercase font-bold">Confidential Strategy</p>
            </div>

            <div class="relative">
                <h1 class="text-[110px] font-black leading-[0.85] tracking-tighter text-outline select-none opacity-50">
                    STARTUP
                </h1>
                <h2 class="text-[110px] font-black leading-[0.9] tracking-tighter title-gradient relative z-10 mt-[-10px]">
                    PITCH DECK
                </h2>
                
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[300px] border border-neon/20 rounded-[50%] -rotate-6 pointer-events-none"></div>
            </div>

            <div class="mt-16 glass-box px-10 py-5 flex items-center gap-8 transform transition-transform hover:scale-105 duration-500">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-neon to-white p-[2px]">
                    <div class="w-full h-full rounded-full bg-black flex items-center justify-center">
                        <i class="fa-solid fa-user text-white/50 text-sm"></i>
                    </div>
                </div>
                
                <div class="flex flex-col text-left">
                    <span class="text-white text-xl font-bold tracking-wide uppercase">Neil Tran</span>
                    <span class="text-neon text-xs font-medium tracking-wider">Chief Technology Officer</span>
                </div>

                <div class="w-px h-8 bg-white/10"></div>

                <div class="text-white/40 text-xs font-light text-right leading-tight">
                    <div>Product Launch</div>
                    <div>Keynote Session</div>
                </div>
            </div>

        </main>

        <footer class="relative z-10 px-20 pb-12 w-full">
            <div class="flex justify-between items-end border-t border-white/5 pt-6">
                
                <div class="flex gap-10">
                    <div class="group flex items-center gap-3 cursor-pointer">
                        <i class="fa-solid fa-globe text-neon opacity-70 group-hover:opacity-100 transition-opacity"></i>
                        <span class="text-white/40 text-xs tracking-wider group-hover:text-white/80 transition-colors">www.reallygreatsite.com</span>
                    </div>
                    <div class="group flex items-center gap-3 cursor-pointer">
                        <i class="fa-solid fa-envelope text-neon opacity-70 group-hover:opacity-100 transition-opacity"></i>
                        <span class="text-white/40 text-xs tracking-wider group-hover:text-white/80 transition-colors">hello@reallygreatsite.com</span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-white/20 text-[10px] font-mono">SLIDE 01</span>
                    <div class="w-16 h-[2px] bg-white/10 overflow-hidden rounded-full">
                        <div class="w-1/3 h-full bg-neon"></div>
                    </div>
                    <span class="text-white/20 text-[10px] font-mono">15</span>
                </div>

            </div>
        </footer>

        <div class="bottom-accent"></div>

    </div>

</body>
</html>
