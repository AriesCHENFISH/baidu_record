<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Model Canvas - Strategy Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #1A1A1A;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 保留的主标题美化：描边效果 */
        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
            color: transparent;
        }

        /* 还原之前的玻璃拟态形状 */
        .glass-shape {
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#6B8E85',
                        brandGray: '#E0E0E0',
                        subtle: '#888888'
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container">

        <div class="absolute bottom-[-10%] right-[-10%] w-[900px] h-[900px] rounded-full opacity-60 z-0"
             style="background: radial-gradient(circle, #6B8E85 0%, rgba(26,26,26,0) 70%); filter: blur(60px);">
        </div>

        <div class="absolute top-[20%] right-[-5%] w-[600px] h-[600px] rounded-full border border-white/10 z-0 glass-shape"
             style="background: linear-gradient(135deg, rgba(107, 142, 133, 0.1), rgba(255, 255, 255, 0.02));">
        </div>
        
        <div class="absolute bottom-[-15%] right-[15%] w-[500px] h-[500px] rounded-full border border-white/5 z-0"
             style="background: linear-gradient(to top, rgba(107, 142, 133, 0.15), transparent);">
        </div>

        <div class="absolute top-12 right-16 flex items-center gap-3 z-20">
            <i class="fa-solid fa-shapes text-white text-2xl"></i>
            <h4 class="text-white text-lg font-bold tracking-widest uppercase opacity-90">STUDIO SHODWE</h4>
        </div>

        <div class="absolute top-[20%] left-16 z-20">
            <h1 class="font-bold text-white leading-[0.85] tracking-tighter" style="font-size: 140px;">
                <div class="block">BUSINESS</div>
                <div class="block text-outline">MODEL</div>
                <div class="block">CANVAS</div>
            </h1>
            <div class="w-24 h-2 bg-accent mt-8 rounded-full"></div>
        </div>

        <div class="absolute bottom-12 left-16 z-20">
            <div class="border border-white/40 rounded-full px-6 py-2 backdrop-blur-sm">
                <h6 class="text-white text-sm font-semibold tracking-widest uppercase">
                    OCTOBER 2030
                </h6>
            </div>
        </div>

        <div class="absolute bottom-12 right-16 z-20 text-right">
            <h6 class="text-brandGray text-sm font-bold tracking-widest uppercase opacity-80 mb-1">
                PREPARED BY CHIDI EZE
            </h6>
            <div class="w-32 h-[1px] bg-accent/40 ml-auto mt-2"></div>
        </div>

        <div class="absolute inset-0 z-10 pointer-events-none opacity-[0.07]"
             style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
        </div>

    </div>
</body>
</html>
