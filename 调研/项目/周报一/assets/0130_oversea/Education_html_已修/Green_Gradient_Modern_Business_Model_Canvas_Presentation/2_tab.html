<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Keynote Slide</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .page-container {
            width: 1280px;
            height: 720px;
            background-color: #1A1A1A;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .bg-subtle-gradient {
            background: linear-gradient(135deg, #1A1A1A 0%, #242424 100%);
        }

        /* 装饰线条动画 */
        .agenda-item {
            transition: all 0.3s ease;
            border-left: 2px solid rgba(107, 142, 133, 0.1);
        }
        .agenda-item:hover {
            border-left: 2px solid #6B8E85;
            background: rgba(107, 142, 133, 0.05);
            padding-left: 1.5rem;
        }

        .decorative-glow {
            background: radial-gradient(circle, rgba(107, 142, 133, 0.08) 0%, transparent 70%);
        }
    </style>
</head>
<body class="font-sans antialiased">

    <div class="page-container bg-subtle-gradient flex flex-col p-20">
        
        <div class="decorative-glow absolute -top-40 -left-40 w-[800px] h-[800px] pointer-events-none"></div>

        <header class="relative z-10 mb-16 flex items-end justify-between border-b border-white/10 pb-8">
            <div>
                <h1 class="text-white text-6xl font-bold tracking-tight uppercase">
                    Agenda<span class="text-[#6B8E85]">.</span>
                </h1>
                <p class="text-[#888888] text-lg mt-2 tracking-[0.2em] uppercase font-light">Table of Contents</p>
            </div>
            <div class="text-right">
                <span class="text-[#6B8E85] font-mono text-4xl">08</span>
                <p class="text-[#888888] text-xs uppercase tracking-widest">Core Sections</p>
            </div>
        </header>

        <main class="relative z-10 grid grid-cols-2 gap-x-16 gap-y-6 flex-grow">
            
            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">01</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Executive Summary</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">02</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Value Propositions</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">03</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Customer Segments</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">04</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Revenue Streams</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">05</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Channel Strategy</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">06</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Key Activities</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">07</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Cost Structure</h2>
            </div>

            <div class="agenda-item flex items-center group py-4 px-4 cursor-pointer">
                <span class="text-[#6B8E85] font-mono text-xl mr-6 opacity-40 group-hover:opacity-100">08</span>
                <h2 class="text-white text-2xl font-bold tracking-wider uppercase group-hover:text-[#6B8E85]">Market Expansion</h2>
            </div>

        </main>

        <footer class="relative z-10 flex justify-between items-center mt-12">
            <div class="h-[1px] bg-white/10 flex-grow mr-10"></div>
            <p class="text-[#888888] font-mono text-xs tracking-widest uppercase">© 2026 Strategic Business Report</p>
        </footer>

    </div>

</body>
</html>
