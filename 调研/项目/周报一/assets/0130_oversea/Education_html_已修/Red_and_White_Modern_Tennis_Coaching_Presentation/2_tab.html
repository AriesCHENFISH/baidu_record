<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents - ACE ELITE</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#C9302C', 
                        textDark: '#1A1A1A', 
                        textGray: '#888888', 
                        lightGray: '#F5F5F5' 
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { 
            width: 1280px; 
            height: 720px; 
            background-color: #FFFFFF; 
            position: relative; 
            margin: 0 auto; 
            overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; 
        }
        .logo-ring { animation: rotate 10s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 文本框美化逻辑 */
        .toc-item {
            position: relative;
            background: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f3f4f6;
        }
        .toc-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background-color: #C9302C;
            transition: width 0.3s ease;
        }
        .toc-item:hover {
            background-color: #fafafa;
            transform: translateX(10px);
            box-shadow: 10px 10px 20px rgba(0,0,0,0.02);
            border-color: transparent;
        }
        .toc-item:hover::before {
            width: 4px;
        }
        .toc-item:hover .toc-arrow {
            transform: translateX(5px);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col">
        <header class="w-full h-32 px-16 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4 group">
                <div class="relative w-14 h-14 flex items-center justify-center">
                    <div class="absolute inset-0 border-2 border-dashed border-primary/30 rounded-full logo-ring"></div>
                    <div class="w-11 h-11 bg-primary rounded-full flex items-center justify-center text-white relative z-10 shadow-lg shadow-red-200">
                        <i class="fa-solid fa-table-tennis-paddle-ball text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-bold tracking-tighter text-textDark leading-none">ACE<span class="text-primary">ELITE</span></span>
                    <span class="text-[10px] uppercase tracking-[0.3em] text-textGray font-bold">Tennis Academy</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-5xl font-black text-textDark/5 uppercase tracking-tighter leading-none">Contents</span>
            </div>
        </header>

        <main class="flex-1 px-16 pb-12">
            <div class="mb-10 flex items-center gap-4">
                <div class="h-[2px] w-12 bg-primary"></div>
                <h2 class="text-3xl font-bold text-textDark">Academy Roadmap</h2>
            </div>

            <div class="grid grid-cols-2 gap-x-12 gap-y-5">
                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">01</span>
                        <span class="text-xl font-bold text-textDark">Introduction</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">02</span>
                        <span class="text-xl font-bold text-textDark">Key Skills in Tennis</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">03</span>
                        <span class="text-xl font-bold text-textDark">Physical Training & Conditioning</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">04</span>
                        <span class="text-xl font-bold text-textDark">Mental Aspects of Tennis</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">05</span>
                        <span class="text-xl font-bold text-textDark">Coaching Techniques & Drills</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">06</span>
                        <span class="text-xl font-bold text-textDark">Strategy & Game Planning</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">07</span>
                        <span class="text-xl font-bold text-textDark">Common Mistakes & Solutions</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>

                <div class="toc-item flex items-center justify-between p-5 rounded-xl cursor-pointer">
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-black text-primary/30 italic">08</span>
                        <span class="text-xl font-bold text-textDark">Our Professional Team</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-long text-primary opacity-0 toc-arrow transition-all"></i>
                </div>
            </div>
        </main>

        <div class="absolute bottom-[-50px] right-[-50px] w-96 h-96 bg-primary/5 rounded-full -z-10"></div>
        <div class="absolute top-[20%] right-[-20px] w-1 h-32 bg-primary/10"></div>
    </div>
</body>
</html>
