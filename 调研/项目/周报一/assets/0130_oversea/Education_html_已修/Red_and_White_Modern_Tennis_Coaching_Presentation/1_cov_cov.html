<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Coaching Cover - ACE ELITE</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#C9302C', textDark: '#1A1A1A', textGray: '#888888', lightGray: '#F5F5F5' }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #FFFFFF; position: relative; margin: 0 auto; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .logo-ring { animation: rotate 10s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col">
        <!-- ACE ELITE HEADER -->
        <header class="w-full h-32 px-16 flex items-center justify-between shrink-0 z-20">
            <div class="flex items-center gap-4 group cursor-pointer">
                <div class="relative w-14 h-14 flex items-center justify-center">
                    <div class="absolute inset-0 border-2 border-dashed border-primary/30 rounded-full logo-ring"></div>
                    <div class="w-11 h-11 bg-primary rounded-full flex items-center justify-center text-white relative z-10 shadow-lg shadow-red-200">
                        <i class="fa-solid fa-table-tennis-paddle-ball text-xl"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-bold tracking-tighter text-textDark leading-none">ACE<span class="text-primary">ELITE</span></span>
                    <span class="text-[10px] uppercase tracking-[0.3em] text-textGray font-bold">Tennis Academy</span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="h-[1px] w-24 bg-lightGray"></div>
                <div class="text-[11px] font-bold text-textDark uppercase tracking-widest opacity-40">Est. 2024</div>
            </div>
        </header>

        <!-- Main Content (Cover Style) -->
        <main class="flex-1 px-16 flex items-center justify-between gap-12">
            <!-- Left: Huge Typography -->
            <div class="w-7/12">
                <div class="inline-block px-4 py-1.5 bg-primary/10 rounded-lg mb-6">
                    <span class="text-primary text-xs font-bold uppercase tracking-widest">Premium Training Program</span>
                </div>
                <h1 class="text-[110px] font-black text-textDark leading-[0.85] tracking-tighter mb-8">
                    TENNIS<br><span class="text-primary">COACHING</span>
                </h1>
                <p class="text-lg text-textGray font-medium max-w-md leading-relaxed border-l-4 border-primary pl-6">
                    Helping players reach their full potential through elite techniques and professional mentorship.
                </p>
            </div>

            <!-- Right: Stylized Smaller Image -->
            <div class="w-5/12 h-[480px] relative">
                <!-- Decorative Shapes -->
                <div class="absolute -top-6 -left-6 w-32 h-32 bg-primary/5 rounded-full"></div>
                <!-- Image Container -->
                <div class="w-full h-full rounded-[40px] overflow-hidden shadow-2xl relative z-10">
                    <img 
                        src="https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?q=80&w=2542&auto=format&fit=crop" 
                        class="w-full h-full object-cover" 
                        alt="Tennis Court"
                    >
                    <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
                </div>
                <!-- Floating Info Badge -->
                <div class="absolute -bottom-6 -right-6 bg-textDark p-8 rounded-3xl shadow-xl z-20 max-w-[200px]">
                    <div class="text-primary text-3xl font-bold mb-1">01.</div>
                    <div class="text-white text-sm font-bold leading-tight">Elite Training Excellence</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
