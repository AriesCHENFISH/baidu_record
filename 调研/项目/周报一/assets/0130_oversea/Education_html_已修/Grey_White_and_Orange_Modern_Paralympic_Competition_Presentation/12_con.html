<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Vision - Slide</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #FFFFFF; overflow: hidden; font-family: 'Noto Sans SC', sans-serif;
        }
        .image-shadow { box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15); }
        .layout-grid {
            display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(12, 1fr);
            height: 100%; width: 100%;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <!-- Decor: Circle Top Right -->
        <div class="absolute -top-20 -right-20 w-[400px] h-[400px] bg-[#F5F5F5] rounded-full z-0"></div>
        <!-- Decor: Small Green accent -->
        <div class="absolute top-32 left-12 w-4 h-4 bg-[#C5D696] rounded-full z-0"></div>

        <div class="layout-grid relative z-10 p-12">
            
            <!-- Top Section: Text Content (Upper 50%) -->
            <div class="col-start-1 col-span-7 row-start-1 row-span-5 flex flex-col justify-end pb-8 pl-4">
                <div class="flex items-center mb-6">
                    <span class="text-[#C5D696] tracking-[0.2em] text-sm font-bold uppercase mr-4">Outlook 2030</span>
                    <div class="w-full h-[1px] bg-gray-200"></div>
                </div>
                
                <h1 class="text-[72px] leading-[0.9] font-black text-[#2B2D2F] uppercase mb-6">
                    Breaking<br>
                    Barriers
                </h1>
                
                <p class="text-[#4A4A4A] text-gl font-medium leading-relaxed border-l-4 border-[#C5D696] pl-6 max-w-[600px]">
                    "We envision a world where every athlete is empowered to define their own legacy, transcending physical boundaries through innovation and spirit."
                </p>
            </div>

            <!-- Top Right: Statistic or Icon -->
            <div class="col-start-9 col-span-4 row-start-2 row-span-3 flex flex-col items-end justify-center pr-4">
                <div class="text-right">
                    <span class="block text-[80px] font-black text-[#C5D696] leading-none opacity-40">03</span>
                    <span class="block text-[#2B2D2F] font-bold uppercase tracking-widest mt-2">Core Initiatives</span>
                </div>
            </div>

            <!-- Bottom Section: Wide Image (Lower 50%) -->
            <div class="col-start-2 col-span-11 row-start-6 row-span-6 pt-4 relative">
                
                <!-- The Image Container -->
                <div class="w-full h-full rounded-[2rem] overflow-hidden image-shadow relative z-10 group">
                    <img src="https://images.unsplash.com/photo-1552674605-5d28c4e1902c?q=80&w=1600&auto=format&fit=crop" 
                         alt="Athletes celebrating" 
                         class="w-full h-full object-cover transform scale-100 group-hover:scale-105 transition-transform duration-[2s]">
                    
                    <!-- Gradient Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-r from-[#2B2D2F]/80 to-transparent mix-blend-multiply"></div>
                    
                    <!-- Text Overlay on Image -->
                    <div class="absolute bottom-8 left-8 text-white z-20">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full bg-[#C5D696] flex items-center justify-center text-[#2B2D2F]">
                                <i class="fa-solid fa-play ml-1"></i>
                            </div>
                            <span class="uppercase tracking-widest font-bold text-sm">Watch the Vision</span>
                        </div>
                    </div>
                </div>

                <!-- Decorative shape behind image -->
                <div class="absolute -bottom-6 -right-6 w-32 h-32 bg-[#2B2D2F] rounded-full z-0"></div>
            </div>

        </div>
    </div>

</body>
</html>
