<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusive Innovation</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2B2D2F', secondary: '#C5D696', accent: '#4A4A4A', textMain: '#333333' },
                    fontFamily: { sans: ['Roboto', 'Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .skew-box { transform: skewX(-12deg); }
        .unskew-content { transform: skewX(12deg); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="page_container" class="relative w-[1280px] h-[720px] bg-white mx-auto overflow-hidden">
        
        <div class="absolute bottom-[-50px] left-[-50px] w-[500px] h-[400px] bg-gray-50 rounded-full blur-3xl opacity-60 z-0"></div>

        <div class="relative z-10 w-full h-full grid grid-cols-12 gap-6 p-12">

            <div class="col-span-6 h-full relative flex items-center">
                <div class="absolute top-10 left-4 w-full h-[85%] bg-primary skew-box opacity-5 translate-x-4 translate-y-4"></div>
                
                <div class="relative w-full h-[85%] skew-box overflow-hidden border-l-8 border-secondary shadow-2xl rounded-sm">
                    <div class="w-[120%] h-full unskew-content -ml-[10%] relative">
                        <img src="https://images.unsplash.com/photo-1564850935515-5eec91e4a64e?q=80&w=1280&auto=format&fit=crop" 
                             class="w-full h-full object-cover object-top">
                        <div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent"></div>
                    </div>
                </div>

                <div class="absolute bottom-20 right-[-20px] bg-primary skew-box py-3 px-8 shadow-lg z-20">
                     <span class="text-secondary font-bold text-lg unskew-content block">Future Tech</span>
                </div>
            </div>

            <div class="col-span-6 flex flex-col justify-center h-full pl-8">
                
                <div class="mb-10 text-right pr-4">
                    <h2 class="text-[40px] leading-tight font-light text-accent italic tracking-widest uppercase mb-2">
                        INCLUSIVE
                    </h2>
                    <h1 class="text-[80px] leading-[0.85] font-black text-primary italic tracking-tight uppercase skew-box inline-block">
                        INNOVATION
                    </h1>
                </div>

                <div class="flex flex-col gap-5">
                    
                    <div class="relative group">
                        <div class="absolute inset-0 bg-secondary skew-box rounded-sm shadow-sm"></div>
                        <div class="relative p-4 pl-8 pr-4 flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-microchip text-primary text-lg"></i>
                            </div>
                            <div>
                                <h3 class="text-primary font-bold text-lg">Wearable Tech</h3>
                                <p class="text-primary text-sm leading-snug opacity-80">Data helps refine training and rehabilitation.</p>
                            </div>
                        </div>
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-0 bg-secondary skew-box rounded-sm shadow-sm"></div>
                        <div class="relative p-4 pl-8 pr-4 flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-wheelchair text-primary text-lg"></i>
                            </div>
                            <div>
                                <h3 class="text-primary font-bold text-lg">Prosthetic Evolution</h3>
                                <p class="text-primary text-sm leading-snug opacity-80">New designs improve speed, movement, and precision.</p>
                            </div>
                        </div>
                    </div>

                     <div class="relative group">
                        <div class="absolute inset-0 bg-secondary skew-box rounded-sm shadow-sm"></div>
                        <div class="relative p-4 pl-8 pr-4 flex items-center gap-4">
                            <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-universal-access text-primary text-lg"></i>
                            </div>
                            <div>
                                <h3 class="text-primary font-bold text-lg">Accessibility Tools</h3>
                                <p class="text-primary text-sm leading-snug opacity-80">Broader public use of innovation benefits all.</p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
        
        <div class="absolute top-0 right-0 w-[150px] h-[20px] bg-secondary skew-box translate-x-12 translate-y-12 z-0"></div>

    </div>
</body>
</html>
