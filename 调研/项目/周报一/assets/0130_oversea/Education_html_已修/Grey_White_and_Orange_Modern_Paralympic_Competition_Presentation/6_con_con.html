<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Impact Keynote</title>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2B2D2F',
                        secondary: '#C5D696',
                        textDark: '#333333',
                        textLight: '#FFFFFF',
                        accent: '#4A4A4A',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif', 'Inter', 'Roboto'],
                    },
                    letterSpacing: {
                        widest: '.25em',
                        huge: '.35em',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Reset & Basic Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Page Container Specs */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Utility for skewed decorations */
        .skew-box { transform: skewX(-20deg); }

        /* Custom Clip Path for the Hero Image */
        .hero-clip { clip-path: polygon(0 0, 100% 0, 78% 100%, 0% 100%); }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="absolute top-0 left-0 w-[580px] h-full z-10 hero-clip bg-gray-100">
            <img src="https://images.unsplash.com/photo-1519766304800-67429cf3106c?q=80&w=800&auto=format&fit=crop" 
                 alt="Wheelchair Tennis Athlete" 
                 class="w-full h-full object-cover grayscale-[20%] contrast-110">
        </div>

        <div class="absolute left-[620px] top-[60px] w-[90px] h-[120px] bg-primary skew-box z-20"></div>

        <div class="absolute right-[140px] top-[60px] w-[50px] h-[100px] bg-secondary skew-box z-10 opacity-50"></div>


        <div class="absolute left-[540px] top-[180px] z-30 flex flex-col items-start leading-none pointer-events-none">
            <h1 class="text-[110px] font-black italic text-primary tracking-tighter uppercase drop-shadow-sm" style="transform: skewX(-5deg);">
                CULTURAL
            </h1>
            <h2 class="text-[64px] font-light italic text-primary tracking-huge uppercase ml-2 mt-2" style="transform: skewX(-5deg);">
                IMPACT
            </h2>
        </div>

        <div class="absolute left-[640px] top-[420px] w-[560px] z-30">
            
            <h3 class="text-3xl font-serif italic text-accent mb-10 border-l-4 border-secondary pl-4">
                Shifting Society
            </h3>

            <div class="flex gap-12">
                <div class="flex-1 group">
                    <h4 class="text-lg font-bold text-primary mb-3 uppercase tracking-wide group-hover:text-accent transition-colors">
                        <i class="fa-solid fa-eye text-secondary mr-2 text-sm"></i> Awareness Grows
                    </h4>
                    <p class="text-textDark text-sm leading-relaxed font-light">
                        With global audiences, the Games increase respect for athletes with disabilities and encourage social change.
                    </p>
                </div>

                <div class="flex-1 group">
                    <h4 class="text-lg font-bold text-primary mb-3 uppercase tracking-wide group-hover:text-accent transition-colors">
                        <i class="fa-solid fa-scale-balanced text-secondary mr-2 text-sm"></i> Policy Progress
                    </h4>
                    <p class="text-textDark text-sm leading-relaxed font-light">
                        Countries respond with improved accessibility, sports funding, and support systems driven by Paralympic inspiration.
                    </p>
                </div>
            </div>
        </div>

        <div class="absolute bottom-[50px] left-[560px] z-30">
            <div class="w-14 h-14 rounded-full border border-primary flex items-center justify-center group bg-white shadow-sm">
                <i class="fa-solid fa-arrow-right text-primary text-xl"></i>
            </div>
        </div>

        <div class="absolute bottom-0 right-0 w-[400px] h-[300px] bg-gray-50 -z-0 rounded-tl-[100px]"></div>

    </div>

</body>
</html>
