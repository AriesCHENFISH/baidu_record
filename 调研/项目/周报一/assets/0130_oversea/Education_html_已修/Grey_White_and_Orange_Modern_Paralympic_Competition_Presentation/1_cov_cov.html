<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paralympic Cover Page</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2B2D2F',
                        secondary: '#C5D696',
                        accent: '#4A4A4A',
                        textMain: '#333333',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
        }

        /* 统一的倾斜角度 -12deg */
        .skew-layout { transform: skewX(-12deg); }
        .unskew-layout { transform: skewX(12deg); }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="absolute top-0 right-[-100px] w-[65%] h-full z-10 skew-layout overflow-hidden border-l-8 border-secondary shadow-2xl">
            <div class="absolute inset-0 w-[120%] h-full unskew-layout -ml-[10%]">
                <img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=1280&auto=format&fit=crop" 
                     alt="Paralympic athlete sprinting" 
                     class="w-full h-full object-cover filter brightness-[0.85] contrast-[1.1]">
                
                <div class="absolute inset-0 bg-gradient-to-l from-transparent to-primary/40"></div>
            </div>
        </div>

        <div class="absolute top-0 left-0 w-[45%] h-full z-20 flex flex-col justify-center pl-16 pr-8">

            <div class="absolute top-12 left-12 w-20 h-20 bg-gray-50 rounded-full blur-2xl z-0"></div>
            <div class="w-24 h-2 bg-primary mb-8 rounded-full relative z-10"></div>

            <div class="relative z-10 mb-16">
                <p class="text-accent tracking-[0.4em] uppercase text-sm font-bold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-medal text-secondary"></i>
                    Official Report
                </p>

                <h1 class="text-[85px] font-black text-primary leading-[0.85] tracking-tighter uppercase italic skew-layout origin-bottom-left drop-shadow-sm">
                    Paralympic
                </h1>
                
                <h2 class="text-[60px] font-light text-secondary leading-none tracking-wide uppercase italic skew-layout origin-bottom-left mt-2">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-accent">Competition</span>
                </h2>
                
                <p class="mt-6 text-textMain text-lg font-normal max-w-md">
                    Analysis of athletic performance, cultural impact, and the spirit of unity.
                </p>
            </div>

            <div class="relative z-10 bg-primary skew-layout p-6 shadow-xl w-[360px] border-r-4 border-secondary group hover:translate-x-2 transition-transform duration-500">
                <div class="unskew-layout flex items-center gap-5">
                    <div class="w-14 h-14 bg-gray-700 rounded-full flex items-center justify-center border-2 border-secondary/50">
                        <i class="fa-solid fa-user text-white text-xl"></i>
                    </div>
                    
                    <div>
                        <p class="text-secondary text-xs uppercase tracking-widest mb-1 font-bold">Presented By</p>
                        <h3 class="text-white text-2xl font-bold leading-none mb-1">Alex Morgan</h3>
                        <p class="text-gray-400 text-sm font-light">Lead Sports Analyst</p>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-8 left-16 text-gray-400 text-sm font-mono z-10">
                October 24, 2025
            </div>

        </div>

        <div class="absolute bottom-0 left-[35%] w-32 h-32 bg-secondary/10 skew-layout z-0"></div>

    </div>

</body>
</html>
