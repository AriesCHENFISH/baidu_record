<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fair Categories - Updated Image</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#2B2D2F', secondary: '#C5D696', accent: '#4A4A4A', textMain: '#333333' },
                    fontFamily: { sans: ['Roboto', 'Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .skew-box { transform: skewX(-12deg); }
        .unskew-content { transform: skewX(12deg); }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="page_container" class="relative w-[1280px] h-[720px] bg-white mx-auto overflow-hidden">
        
        <div class="absolute top-[-100px] right-[-100px] w-[600px] h-[600px] bg-gray-50 rounded-full blur-3xl opacity-60 z-0"></div>

        <div class="relative z-10 w-full h-full grid grid-cols-12 gap-6 p-12">
            <div class="col-span-5 flex flex-col justify-center h-full relative z-20 pt-8">
                
                <div class="w-full max-w-[280px] h-[50px] bg-primary skew-box flex items-center justify-center mb-10 ml-4 shadow-lg">
                    <h2 class="text-white text-lg font-medium tracking-wide unskew-content uppercase">
                        Structuring
                    </h2>
                </div>

                <div class="mb-12 relative pl-2">
                    <h1 class="text-[90px] leading-[0.8] font-black text-primary italic tracking-tighter uppercase skew-box origin-bottom-left">
                        FAIR
                    </h1>
                    <h2 class="text-[40px] leading-tight font-light text-textMain italic tracking-wide uppercase mt-2 ml-2">
                        Categories
                    </h2>
                </div>

                <div class="flex flex-col gap-6 pl-2">
                    <div class="relative group">
                        <div class="absolute inset-0 bg-secondary skew-box rounded-sm shadow-md"></div>
                        <div class="relative p-6 pl-10 pr-6">
                            <h3 class="text-primary font-bold text-xl mb-1">Functional Grouping</h3>
                            <p class="text-primary text-sm leading-snug opacity-90">
                                Athletes are classified based on ability, ensuring fair, equal, and inclusive competition.
                            </p>
                        </div>
                    </div>

                    <div class="relative group">
                        <div class="absolute inset-0 bg-secondary skew-box rounded-sm shadow-md"></div>
                        <div class="relative p-6 pl-10 pr-6">
                            <h3 class="text-primary font-bold text-xl mb-1">Sport Diversity</h3>
                            <p class="text-primary text-sm leading-snug opacity-90">
                                From powerlifting to <strong>blind soccer</strong>, sports are adapted creatively for everyone.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative h-full">
                <div class="absolute top-12 right-12 w-[520px] h-[360px] skew-box shadow-2xl border-4 border-white z-10 overflow-hidden">
                    <div class="w-[120%] h-full unskew-content -ml-[10%]">
                        <img src="https://images.unsplash.com/photo-1552318965-5638e4c76cb0?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                             class="w-full h-full object-cover"
                             alt="Soccer player legs and ball on grass">
                    </div>
                </div>
                
                <div class="absolute bottom-16 left-12 w-[340px] h-[220px] skew-box shadow-xl border-4 border-white z-20 overflow-hidden bg-primary">
                    <div class="w-[120%] h-full unskew-content -ml-[10%]">
                        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" 
                             class="w-full h-full object-cover opacity-90"
                             alt="Inclusive interaction">
                    </div>
                </div>

                <div class="absolute top-4 right-4 w-[100px] h-[100px] bg-secondary skew-box opacity-50 -z-10"></div>
            </div>
        </div>
    </div>
</body>
</html>
