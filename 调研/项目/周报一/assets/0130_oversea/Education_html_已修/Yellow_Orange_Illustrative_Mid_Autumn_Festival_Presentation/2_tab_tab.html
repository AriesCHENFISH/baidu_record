<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #1A1025 0%, #2D1E45 50%, #4D3559 100%);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            color: #FFF5D1;
        }

        .font-serif-display {
            font-family: 'Georgia', serif;
        }

        /* 紧凑型目录条目 */
        .content-item {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(253, 228, 127, 0.1);
            transition: all 0.3s ease;
        }

        .content-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 10px;
            border-bottom-color: rgba(253, 228, 127, 0.5);
        }

        /* 装饰背景圆（月影） */
        .moon-glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(253, 228, 127, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -200px;
            left: -100px;
            pointer-events: none;
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(253, 228, 127, 0.3);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
        }
    </style>
</head>
<body>

    <div id="page_container" class="flex flex-col items-center">
        
        <div class="moon-glow-bg"></div>
        <div class="moon-glow-bg" style="top: auto; bottom: -200px; left: auto; right: -100px; background: radial-gradient(circle, rgba(230, 170, 196, 0.08) 0%, transparent 70%);"></div>
        
        <div class="star" style="top: 15%; left: 25%; width: 2px; height: 2px;"></div>
        <div class="star" style="top: 10%; left: 70%; width: 3px; height: 3px;"></div>

            </div>

            <div class="content-item flex items-center py-4 px-2">

    </div>

</body>
