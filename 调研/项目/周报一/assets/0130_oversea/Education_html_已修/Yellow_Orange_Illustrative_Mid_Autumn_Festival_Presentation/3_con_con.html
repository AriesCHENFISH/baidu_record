<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid Autumn Festival - Reimagined</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 70% 30%, #4D3559 0%, #2D1E45 60%, #1A1025 100%);
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 动画：星光闪烁 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .animate-twinkle { animation: twinkle var(--duration) infinite ease-in-out; }

        /* 动画：悬浮效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 4s infinite ease-in-out; }

        /* 文字发光 */
        .title-glow {
            text-shadow: 0 0 20px rgba(253, 228, 127, 0.5), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        /* 玻璃拟态 */
        .refined-glass {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 嫦娥图片遮罩 */
        .character-mask {
            mask-image: linear-gradient(to bottom, black 70%, transparent 95%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 95%);
        }

        /* 月亮多重发光 */
        .super-moon-glow {
            background: linear-gradient(135deg, #FFF5D1 0%, #FDE47F 100%);
            box-shadow: 
                0 0 60px rgba(253, 228, 127, 0.3),
                0 0 120px rgba(253, 228, 127, 0.2),
                inset -20px -20px 40px rgba(244, 164, 66, 0.4);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute inset-0">
            <div class="animate-twinkle absolute bg-white rounded-full" style="--duration: 3s; top: 10%; left: 20%; width: 2px; height: 2px;"></div>
            <div class="animate-twinkle absolute bg-white rounded-full" style="--duration: 4s; top: 30%; left: 45%; width: 3px; height: 3px;"></div>
            <div class="animate-twinkle absolute bg-white rounded-full" style="--duration: 5s; top: 15%; left: 75%; width: 2px; height: 2px;"></div>
            <div class="animate-twinkle absolute bg-white rounded-full" style="--duration: 3.5s; top: 60%; left: 15%; width: 2px; height: 2px;"></div>
            <div class="animate-twinkle absolute bg-white rounded-full" style="--duration: 4.5s; top: 85%; left: 80%; width: 3px; height: 3px;"></div>
        </div>

        <svg class="absolute top-0 right-0 w-full h-full opacity-20 pointer-events-none" viewBox="0 0 1280 720">
            <path d="M1300,100 C1100,150 900,50 700,200 S300,400 0,350" stroke="#FDE47F" stroke-width="1" fill="none" />
            <path d="M1300,150 C1150,200 950,100 750,250 S350,450 0,400" stroke="#E6Aac4" stroke-width="0.5" fill="none" />
        </svg>

        <div class="grid grid-cols-12 h-full relative z-10">
            
            <div class="col-span-5 flex flex-col justify-center pl-20 pr-10">
                <header class="mb-8">
                    <div class="flex items-center gap-4 mb-4">
                        <span class="h-[1px] w-12 bg-gold-400 bg-[#F4A442]"></span>
                        <span class="text-[#FDE47F] tracking-[0.3em] text-sm font-bold uppercase">Heritage & Legend</span>
                    </div>
                    <h1 class="text-7xl font-bold text-white title-glow leading-tight">
                        <span class="font-serif italic text-[#FDE47F]">Mid-Autumn</span><br>
                        Festival
                    </h1>
                </header>

                <div class="refined-glass p-8 relative">
                    <i class="fa-solid fa-quote-left absolute -top-4 -left-4 text-3xl text-[#F4A442] opacity-50"></i>
                    <p class="text-[#FFF5D1] text-lg leading-relaxed font-light text-justify opacity-90">
                        The Mid-Autumn Festival, also known as the Moon Festival, is a traditional festival celebrated by many East and Southeast Asian people. It is a time for family reunions, thanksgiving for the harvest, and praying for good fortune.
                    </p>
                </div>

                <div class="mt-12 flex gap-8 items-center">
                    <div class="flex flex-col items-center">
                        <div class="w-10 h-10 rounded-full border border-[#FDE47F]/30 flex items-center justify-center text-[#FDE47F]">
                            <i class="fa-solid fa-moon"></i>
                        </div>
                        <span class="text-[10px] text-[#FFF5D1]/60 mt-2 tracking-widest uppercase">Unity</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-10 h-10 rounded-full border border-[#FDE47F]/30 flex items-center justify-center text-[#FDE47F]">
                            <i class="fa-solid fa-leaf"></i>
                        </div>
                        <span class="text-[10px] text-[#FFF5D1]/60 mt-2 tracking-widest uppercase">Harvest</span>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative flex items-center justify-center">
                
                <div class="super-moon-glow w-[580px] h-[580px] rounded-full absolute transition-all duration-700">
                    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 30% 30%, transparent 80%, #78350F 100%);"></div>
                </div>

                <div class="relative z-20 animate-float">
                    <img 
                        src="https://images.unsplash.com/photo-1636183478749-0d359489547e?q=80&w=800&auto=format&fit=crop" 
                        class="w-[480px] h-[640px] object-cover object-top character-mask rounded-t-[240px]" 
                        style="filter: drop-shadow(0 0 30px rgba(0,0,0,0.4));"
                        alt="Chang'e"
                    >
                </div>

                <div class="absolute z-30 top-1/4 -right-10 opacity-80 animate-float" style="animation-delay: -1s;">
                    <i class="fa-solid fa-cloud text-[#FFF5D1] text-8xl drop-shadow-lg opacity-40"></i>
                </div>
                <div class="absolute z-10 bottom-1/4 -left-10 opacity-60 animate-float" style="animation-delay: -2s;">
                    <i class="fa-solid fa-cloud text-[#FFF5D1] text-7xl drop-shadow-lg opacity-30"></i>
                </div>
            </div>
        </div>

        <div class="absolute top-0 right-32 flex gap-12 z-20">
            <div class="flex flex-col items-center animate-float" style="animation-duration: 5s;">
                <div class="w-[1px] h-16 bg-[#F4A442]/50"></div>
                <div class="w-12 h-16 bg-gradient-to-b from-[#F4A442] to-[#E6Aac4] rounded-lg shadow-lg flex items-center justify-center relative">
                    <div class="absolute -bottom-4 w-[2px] h-4 bg-[#FDE47F]"></div>
                    <i class="fa-solid fa-star text-white/30 text-xs"></i>
                </div>
            </div>
            <div class="flex flex-col items-center animate-float" style="animation-duration: 6s; animation-delay: -1.5s;">
                <div class="w-[1px] h-24 bg-[#F4A442]/50"></div>
                <div class="w-10 h-14 bg-gradient-to-b from-[#F4A442] to-[#E6Aac4] rounded-lg shadow-lg flex items-center justify-center relative opacity-80">
                    <div class="absolute -bottom-3 w-[2px] h-3 bg-[#FDE47F]"></div>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#1A1025] to-transparent z-40"></div>
    </div>

</body>
</html>
