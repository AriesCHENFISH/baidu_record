<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=720, initial-scale=1.0">
    <title>Mid Autumn Festival - Keynote Slide</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <!-- FontAwesome (CDN) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">

    <!-- Google Fonts via Baidu CDN (Inter & Noto Serif SC for elegant typography) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 
         * Page Container Configuration
         * Fixed 1280x720 as requested 
         */
        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            background: linear-gradient(180deg, #2D1E45 0%, #6E4C6D 55%, #A87C80 100%);
        }

        /* Typography Enhancements */
        .font-serif-display {
            font-family: 'Times New Roman', serif; /* Fallback to standard serif for stability */
            letter-spacing: -0.02em;
        }

        /* 
         * Moon Effect 
         * Creating a glowing moon using CSS shadows and gradients
         */
        .moon-glow {
            background: #FDE47F;
            box-shadow: 0 0 60px 20px rgba(253, 228, 127, 0.4), 
                        inset -20px -20px 50px rgba(244, 164, 66, 0.3);
        }

        /* 
         * Text Glow Effect 
         * Soft bloom for the title text
         */
        .text-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 
                         0 0 40px rgba(253, 228, 127, 0.3);
        }

        /* Lantern Styles */
        .lantern-body {
            background: linear-gradient(180deg, #F4A442 0%, #E6Aac4 100%);
            box-shadow: 0 10px 25px rgba(244, 164, 66, 0.6);
        }

        /* Mountain/Cloud Layers using CSS Shapes */
        .mountain-shape {
            border-radius: 100% 100% 0 0;
            position: absolute;
            bottom: -50px;
        }
    </style>
    
    <!-- Tailwind Configuration for Custom Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepNight: '#2D1E45',
                        twilight: '#6E4C6D',
                        horizon: '#A87C80',
                        moonlight: '#FDE47F',
                        lantern: '#F4A442',
                        cream: '#FFF5D1',
                        ribbon: '#E6Aac4',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <!-- Main Slide Container -->
    <div id="page_container">

        <!-- Layer 1: Stars Background -->
        <!-- Purpose: Adds depth to the night sky -->
        <div class="absolute inset-0 z-0 opacity-60">
            <div class="absolute top-10 left-20 text-white text-xs opacity-50"><i class="fas fa-star"></i></div>
            <div class="absolute top-32 left-1/4 text-white text-[8px] opacity-30"><i class="fas fa-star"></i></div>
            <div class="absolute top-16 right-40 text-white text-xs opacity-60"><i class="fas fa-star"></i></div>
            <div class="absolute top-48 right-1/4 text-white text-[6px] opacity-40"><i class="fas fa-star"></i></div>
            <div class="absolute top-5 left-1/2 text-white text-[10px] opacity-20"><i class="fas fa-star"></i></div>
            <div class="absolute bottom-1/3 left-10 text-white text-[8px] opacity-30"><i class="fas fa-star"></i></div>
            <div class="absolute bottom-1/2 right-20 text-white text-[8px] opacity-40"><i class="fas fa-star"></i></div>
        </div>

        <!-- Layer 2: The Moon -->
        <!-- Purpose: Focal point and light source -->
        <div class="absolute top-[80px] left-1/2 transform -translate-x-1/2 z-10">
            <div class="w-48 h-48 rounded-full moon-glow relative">
                <!-- Subtle crater details using opacity -->
                <div class="absolute top-10 left-8 w-8 h-8 bg-lantern opacity-10 rounded-full"></div>
                <div class="absolute bottom-12 right-10 w-12 h-12 bg-lantern opacity-10 rounded-full"></div>
            </div>
        </div>

        <!-- Layer 3: Floating Clouds -->
        <!-- Purpose: Decorative elements to frame the moon -->
        <div class="absolute top-[140px] left-[35%] z-20 opacity-90 text-cream">
            <i class="fas fa-cloud text-5xl opacity-80 filter blur-[1px]"></i>
        </div>
        <div class="absolute top-[180px] right-[38%] z-20 opacity-80 text-cream">
             <i class="fas fa-cloud text-4xl opacity-70 filter blur-[1px]"></i>
        </div>

        <!-- Layer 4: Floating Lanterns -->
        <!-- Purpose: Festive atmosphere and warm color accents -->
        <!-- Lantern Left Large -->
        <div class="absolute top-[180px] left-[15%] z-20 flex flex-col items-center opacity-90">
            <div class="w-16 h-20 rounded-2xl lantern-body relative border border-white/20">
                <div class="absolute inset-x-0 top-0 h-2 bg-black/20"></div>
                <div class="absolute inset-x-0 bottom-0 h-2 bg-black/20"></div>
            </div>
            <div class="w-[2px] h-10 bg-lantern mt-[-2px]"></div>
            <div class="w-1 h-3 bg-red-500 rounded-full mt-[-2px]"></div>
        </div>
        
        <!-- Lantern Left Small -->
        <div class="absolute top-[280px] left-[8%] z-10 flex flex-col items-center opacity-60 scale-75 blur-[1px]">
            <div class="w-16 h-20 rounded-2xl lantern-body relative border border-white/20"></div>
            <div class="w-[2px] h-8 bg-lantern"></div>
        </div>

        <!-- Lantern Right Large -->
        <div class="absolute top-[200px] right-[15%] z-20 flex flex-col items-center opacity-90">
             <div class="w-16 h-20 rounded-2xl lantern-body relative border border-white/20">
                <div class="absolute inset-x-0 top-0 h-2 bg-black/20"></div>
                <div class="absolute inset-x-0 bottom-0 h-2 bg-black/20"></div>
            </div>
            <div class="w-[2px] h-12 bg-lantern mt-[-2px]"></div>
            <div class="w-1 h-3 bg-red-500 rounded-full mt-[-2px]"></div>
        </div>

        <!-- Lantern Right Small -->
        <div class="absolute top-[120px] right-[10%] z-10 flex flex-col items-center opacity-70 scale-50 blur-[2px]">
            <div class="w-16 h-20 rounded-2xl lantern-body relative"></div>
            <div class="w-[2px] h-16 bg-lantern"></div>
        </div>


        <!-- Layer 5: Typography / Content -->
        <!-- Purpose: Core information delivery with high contrast -->
        <div class="absolute inset-0 flex flex-col items-center justify-center z-40 mt-16">
            
            <!-- Main Title -->
            <div class="text-center">
                <h1 class="font-serif-display text-[96px] leading-tight text-white text-glow">
                    Mid Autumn<br>
                    <span class="italic">Festival</span>
                </h1>
            </div>

            <!-- Divider Element -->
            <div class="flex items-center justify-center gap-4 my-6 opacity-80">
                <div class="h-[1px] w-24 bg-gradient-to-r from-transparent to-moonlight"></div>
                <div class="w-3 h-3 rotate-45 border border-moonlight bg-deepNight"></div>
                <div class="h-[1px] w-24 bg-gradient-to-l from-transparent to-moonlight"></div>
            </div>

            <!-- Date / Subtitle -->
            <div class="text-center">
                <p class="text-cream text-2xl tracking-[0.3em] font-light uppercase opacity-90">
                    17 September 2025
                </p>
            </div>
        </div>

        <!-- Layer 6: Foreground Landscape (Abstract Mountains) -->
        <!-- Purpose: Grounding the composition with "Horizon Glow" palette -->
        <div id="mountains_container" class="absolute bottom-0 w-full h-[250px] z-30 pointer-events-none">
            
            <!-- Back Mountain (Darker, further) -->
            <div class="absolute bottom-[-20px] left-[-100px] w-[800px] h-[300px] bg-twilight opacity-80 mountain-shape"></div>
            
            <!-- Mid Mountain (Lighter) -->
            <div class="absolute bottom-[-40px] right-[-150px] w-[900px] h-[350px] bg-horizon opacity-90 mountain-shape"></div>
            
            <!-- Front Decorative Elements (Simulating rolling hills/clouds) -->
            <div class="absolute bottom-[-80px] left-[20%] w-[800px] h-[200px] bg-deepNight opacity-30 blur-xl rounded-[100%]"></div>
            
            <!-- Minimalist Cloud/Fog at bottom using FontAwesome -->
            <div class="absolute bottom-4 left-10 opacity-40 text-ribbon">
                <i class="fas fa-wind text-4xl"></i>
            </div>
            <div class="absolute bottom-8 right-20 opacity-40 text-ribbon">
                <i class="fas fa-wind text-3xl fa-flip-horizontal"></i>
            </div>
        </div>

    </div>

</body>
</html>
