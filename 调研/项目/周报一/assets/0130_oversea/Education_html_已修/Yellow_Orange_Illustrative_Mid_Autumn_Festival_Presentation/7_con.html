<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Family Activities</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .text-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .moon-glow {
            box-shadow: 0 0 40px rgba(253, 228, 127, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* 星光闪烁动画 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .star-animate {
            animation: twinkle 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div id="page_container" style="width: 1280px; height: 720px; margin: 0 auto; position: relative; overflow: hidden; background: linear-gradient(to bottom, #1a1025, #4a2b6d, #8c5a8d);">
        
        <div class="star-animate" style="position: absolute; top: 10%; left: 15%; color: white; font-size: 8px;"><i class="fa-solid fa-star"></i></div>
        <div class="star-animate" style="position: absolute; top: 25%; left: 45%; color: white; font-size: 5px; animation-delay: 1s;"><i class="fa-solid fa-star"></i></div>
        <div class="star-animate" style="position: absolute; top: 15%; right: 20%; color: white; font-size: 7px; animation-delay: 1.5s;"><i class="fa-solid fa-star"></i></div>
        <div class="star-animate" style="position: absolute; top: 40%; left: 80%; color: white; font-size: 6px; animation-delay: 2s;"><i class="fa-solid fa-star"></i></div>

        <div style="width: 100%; text-align: center; padding-top: 80px; position: relative; z-index: 30;">
            <h1 class="text-glow" style="font-family: 'Times New Roman', serif; font-size: 68px; font-weight: 400; color: #FFFFFF; letter-spacing: 4px; text-transform: uppercase;">
                Traditional Activities
            </h1>
            <div style="width: 80px; background: #FDE47F; margin: 20px auto; height: 2px; border-radius: 2px;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%; padding: 0 120px; margin-top: 60px; position: relative; z-index: 40;">
            
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;">
                <div class="moon-glow" style="width: 150px; height: 150px; background: radial-gradient(circle, #FDE47F 0%, #F4A442 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 35px;">
                    <i class="fa-solid fa-moon" style="font-size: 64px; color: #78350F;"></i>
                    <div style="position: absolute; bottom: -10px; left: -25px; color: #FFF5D1; opacity: 0.8; font-size: 36px;">
                        <i class="fa-solid fa-cloud"></i>
                    </div>
                </div>
                <h2 style="font-family: 'Times New Roman', serif; font-size: 34px; color: #FDE47F; margin-bottom: 20px; tracking: 1px;">Moon Gazing</h2>
                <p style="font-size: 15px; line-height: 1.6; color: #f3e8ff; font-weight: 300; opacity: 0.8; max-width: 240px;">
                    Appreciating the full moon<br>symbolizing family reunion.
                </p>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;">
                <div class="moon-glow" style="width: 150px; height: 150px; background: radial-gradient(circle, #FDE47F 0%, #F4A442 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 35px;">
                    <i class="fa-solid fa-cookie-bite" style="font-size: 64px; color: #78350F;"></i>
                    <div style="position: absolute; top: -20px; right: -5px;">
                        <img src="https://images.unsplash.com/photo-1589634790382-3d7172b8c541?q=80&w=100&auto=format&fit=crop" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 3px solid #FFF;" alt="Rabbit">
                    </div>
                </div>
                <h2 style="font-family: 'Times New Roman', serif; font-size: 34px; color: #FDE47F; margin-bottom: 20px; tracking: 1px;">Sharing Food</h2>
                <p style="font-size: 15px; line-height: 1.6; color: #f3e8ff; font-weight: 300; opacity: 0.8; max-width: 240px;">
                    Eating traditional mooncakes<br>with sweet lotus fillings.
                </p>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;">
                <div class="moon-glow" style="width: 150px; height: 150px; background: radial-gradient(circle, #FDE47F 0%, #F4A442 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 35px;">
                    <i class="fa-solid fa-fire-burner" style="font-size: 64px; color: #78350F;"></i>
                    <div style="position: absolute; bottom: -10px; right: -25px; color: #FFF5D1; opacity: 0.8; font-size: 36px;">
                        <i class="fa-solid fa-cloud"></i>
                    </div>
                </div>
                <h2 style="font-family: 'Times New Roman', serif; font-size: 34px; color: #FDE47F; margin-bottom: 20px; tracking: 1px;">Lighting Up</h2>
                <p style="font-size: 15px; line-height: 1.6; color: #f3e8ff; font-weight: 300; opacity: 0.8; max-width: 240px;">
                    Lighting colorful lanterns<br>to guide the way to prosperity.
                </p>
            </div>
        </div>

        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 280px; z-index: 10; opacity: 0.4; overflow: hidden;">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1280&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover; mask-image: linear-gradient(to top, black, transparent);" alt="Mountains">
        </div>

        <div style="position: absolute; bottom: 80px; left: 10%; color: #FFF5D1; opacity: 0.3; font-size: 50px; z-index: 15;"><i class="fa-solid fa-cloud"></i></div>
        <div style="position: absolute; bottom: 120px; right: 10%; color: #FFF5D1; opacity: 0.3; font-size: 60px; z-index: 15;"><i class="fa-solid fa-cloud"></i></div>

    </div>

</body>
</html>
