<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Minimal Industrial</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'brand-bg': '#000000', 'brand-gold': '#E1B941', 'brand-border': '#8C7840', 'brand-text': '#CFCFCF' }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            background-color: #000000; overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }
        .grayscale-img { filter: grayscale(100%) contrast(1.1); }
    </style>
</head>
<body>

    <div id="page_container">
        <div class="grid grid-cols-12 h-full w-full">
            
            <div class="col-span-5 pl-20 pr-12 flex flex-col justify-center relative z-10">
                <div class="mb-12">
                    <h1 class="text-brand-gold text-[80px] font-black uppercase tracking-tighter leading-none mb-6">
                        Contact Us
                    </h1>
                    <div class="w-24 h-2 bg-brand-gold shadow-lg"></div>
                </div>

                <div class="mb-12">
                    <p class="text-brand-text text-base leading-relaxed opacity-60 italic">
                        Ready to transform your vision into reality? Reach out to our architectural advisory team today.
                    </p>
                </div>

                <div class="space-y-6">
                    <div class="flex items-center group">
                        <div class="w-14 h-14 bg-brand-gold flex items-center justify-center shadow-xl">
                            <i class="fa-solid fa-phone text-black text-xl"></i>
                        </div>
                        <div class="h-14 flex-grow border border-brand-border/50 border-l-0 flex items-center px-8 bg-brand-gold/5">
                            <p class="text-white text-lg font-bold tracking-wider">+123-456-7890</p>
                        </div>
                    </div>

                    <div class="flex items-center group">
                        <div class="w-14 h-14 bg-brand-gold flex items-center justify-center shadow-xl">
                            <i class="fa-solid fa-envelope text-black text-xl"></i>
                        </div>
                        <div class="h-14 flex-grow border border-brand-border/50 border-l-0 flex items-center px-8 bg-brand-gold/5">
                            <p class="text-white text-lg font-bold tracking-wider">hello@arch-studio.com</p>
                        </div>
                    </div>

                    <div class="flex items-center group">
                        <div class="w-14 h-14 bg-brand-gold flex items-center justify-center shadow-xl">
                            <i class="fa-solid fa-location-dot text-black text-xl"></i>
                        </div>
                        <div class="h-14 flex-grow border border-brand-border/50 border-l-0 flex items-center px-8 bg-brand-gold/5">
                            <p class="text-white text-lg font-bold tracking-wider">123 Design Avenue, NY</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 relative h-full">
                <div class="absolute top-0 right-0 w-full h-full bg-[#0a0a0a] z-0"></div>

                <div class="absolute bottom-0 left-0 w-[450px] h-[550px] z-0 overflow-hidden opacity-30">
                    <img src="https://images.unsplash.com/photo-1486325212027-8081e485255e?auto=format&fit=crop&w=800" 
                         class="w-full h-full object-cover grayscale-img">
                </div>

                <div class="absolute top-1/2 -translate-y-1/2 right-16 w-[580px] h-[520px] z-10 p-6 border border-brand-gold/30 bg-black shadow-2xl">
                     <div class="w-full h-full overflow-hidden relative border-2 border-brand-gold">
                        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000" 
                             class="w-full h-full object-cover grayscale-img transition-all duration-700 hover:grayscale-0">
                        <div class="absolute bottom-8 left-8 bg-brand-gold text-black px-4 py-2 font-black uppercase text-xs tracking-widest">
                            Global HQ Projects
                        </div>
                     </div>
                </div>

                <div class="absolute bottom-0 right-0 w-[300px] h-[200px] z-0 overflow-hidden opacity-20">
                     <img src="https://images.unsplash.com/photo-1479839672679-a46483c0e7c8?auto=format&fit=crop&w=600" 
                          class="w-full h-full object-cover grayscale-img">
                </div>
            </div>
        </div>
        <div class="absolute bottom-10 left-20 flex gap-4 opacity-30">
            <div class="w-2 h-2 bg-brand-gold rounded-full animate-pulse"></div>
            <div class="w-2 h-2 bg-brand-gold rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 bg-brand-gold rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
        </div>
    </div>

</body>
</html>
