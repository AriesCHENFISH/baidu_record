<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Architecture Keynote</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #000000;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            color: #CFCFCF;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* 汇报人卡片装饰 */
        .presenter-card {
            background: #E1B941;
            color: #000;
            padding: 20px 30px;
            border-left: 8px solid #8C7840;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
        }

        .title-stroke {
            -webkit-text-stroke: 1px #E1B941;
            color: transparent;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#E1B941',
                        darkGold: '#8C7840',
                        textGrey: '#CFCFCF',
                    }
                }
            }
        }
    </script>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute left-0 top-0 h-full w-[80px] border-r border-darkGold/30 flex flex-col items-center pt-10 z-20">
            <div class="text-gold text-2xl mb-8">
                <i class="fa-solid fa-table-cells-large"></i>
            </div>
            <div class="[writing-mode:vertical-rl] text-darkGold/50 uppercase tracking-[0.5em] text-[10px] font-bold">
                ESTABLISHED 2026 • VISIONARY
            </div>
        </div>

        <div class="absolute left-[80px] top-0 w-[1200px] h-full flex flex-col px-16 pt-12">

            <header class="flex justify-end items-center w-full mb-16">
                <div class="flex items-center gap-4">
                    <span class="text-gold font-bold tracking-widest text-sm uppercase">Industry Standard</span>
                    <div class="text-gold text-2xl border-2 border-gold rounded-full w-12 h-12 flex items-center justify-center">
                        <i class="fa-solid fa-city text-base"></i>
                    </div>
                </div>
            </header>

            <div class="relative h-[380px] w-full flex items-center">
                <div class="w-[580px] h-full overflow-hidden grayscale brightness-75 border-l border-darkGold/20">
                    <img src="https://images.unsplash.com/photo-1486325212027-8081e485255e?q=80&w=1280&auto=format&fit=crop" 
                         class="w-full h-full object-cover">
                </div>

                <div class="absolute left-[420px] top-1/2 -translate-y-1/2 z-10">
                    <h2 class="title-stroke text-[110px] font-black uppercase leading-none opacity-30 mb-[-60px] ml-4">Architecture</h2>
                    <h1 class="text-[140px] font-black text-gold leading-none tracking-tighter uppercase drop-shadow-2xl">
                        CONSTRUCTION
                    </h1>
                    <div class="w-40 h-2 bg-gold mt-6"></div>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-12 mt-20 w-3/4">
                <div class="flex flex-col gap-2">
                    <h4 class="text-gold font-bold uppercase tracking-widest text-sm italic">Core Mission</h4>
                    <p class="text-white text-xl font-light">Visionary Design.</p>
                </div>
                <div class="flex flex-col gap-2 border-l border-darkGold/30 pl-8">
                    <h4 class="text-gold font-bold uppercase tracking-widest text-sm italic">Engineering</h4>
                    <p class="text-white text-xl font-light">Structural Integrity.</p>
                </div>
                <div class="flex flex-col gap-2 border-l border-darkGold/30 pl-8">
                    <h4 class="text-gold font-bold uppercase tracking-widest text-sm italic">Sustainability</h4>
                    <p class="text-white text-xl font-light">Future Materials.</p>
                </div>
            </div>

            <div class="absolute bottom-16 right-16 z-30">
                <div class="presenter-card">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black uppercase tracking-[0.2em] opacity-60 mb-1">Presented by</span>
                        <h3 class="text-2xl font-black uppercase tracking-tight">Johnathan Doe</h3>
                        <p class="text-sm font-bold opacity-80 mt-1 border-t border-black/20 pt-1">Senior Project Director</p>
                    </div>
                    <div class="mt-4 flex gap-4 text-xs font-bold items-center">
                        <i class="fa-solid fa-calendar-days opacity-50"></i>
                        <span>JANUARY 2026</span>
                    </div>
                </div>
            </div>

        </div>

        <div class="absolute -right-20 -bottom-20 w-[600px] h-[600px] bg-gold/5 blur-[120px] rounded-full pointer-events-none"></div>
    </div>

</body>
</html>
