<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Cover - Programming</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepBlack: '#020204',
                        accentPurple: '#9D50E6',
                        accentPink: '#FF7EB6',
                        accentBlue: '#2A3C95',
                        accentCyan: '#22D3EE',
                        accentYellow: '#FACC15',
                        accentGreen: '#10B981'
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .page_container {
            width: 1280px; height: 720px; margin: 0 auto; position: relative;
            background-color: #020204; overflow: hidden; color: #FFF;
        }

        .bg-grid {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* 动态流光边框 */
        .gradient-border {
            position: relative;
            background: #000;
            border-radius: 12px;
        }
        .gradient-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 14px;
            background: linear-gradient(45deg, #2A3C95, #9D50E6, #FF7EB6, #FACC15, #22D3EE);
            z-index: -1;
            filter: blur(2px);
            opacity: 0.8;
        }

        .title-gradient {
            background: linear-gradient(to right, #22D3EE, #9D50E6, #FF7EB6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="page_container bg-grid">
        
        <!-- Colorful Ambient Lights -->
        <div class="absolute top-[-200px] left-[-100px] w-[600px] h-[600px] bg-accentBlue opacity-20 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-100px] right-[-100px] w-[600px] h-[600px] bg-accentPurple opacity-20 blur-[100px] rounded-full"></div>
        <div class="absolute top-[20%] right-[20%] w-[300px] h-[300px] bg-accentCyan opacity-10 blur-[80px] rounded-full"></div>

        <!-- Top Navigation -->
        <div class="relative z-20 px-16 py-10 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="flex gap-1">
                    <div class="w-2 h-2 rounded-full bg-accentCyan"></div>
                    <div class="w-2 h-2 rounded-full bg-accentPurple"></div>
                    <div class="w-2 h-2 rounded-full bg-accentPink"></div>
                </div>
                <h2 class="text-xl font-bold tracking-tight text-gray-300">Thynk<span class="text-white">.edu</span></h2>
            </div>
            <div class="px-4 py-1 rounded-full border border-accentYellow/30 bg-accentYellow/5 text-accentYellow text-xs font-mono tracking-widest">
                2026 CURRICULUM
            </div>
        </div>

        <!-- Main Title Section (Centered with Staggered Layout) -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 w-full max-w-6xl text-center">
            
            <!-- Decorative Tag (Centered) -->
            <div class="flex items-center justify-center gap-2 mb-8">
                <span class="px-2 py-0.5 rounded bg-accentBlue text-[10px] font-bold tracking-wide">CORE MODULE</span>
                <span class="h-px w-10 bg-white/20"></span>
                <span class="text-accentCyan text-sm font-mono uppercase">Introduction to Computer Science</span>
            </div>
            
            <!-- Multi-color Gradient Title with Misalignment (Offset) -->
            <!-- Flex column to stack, margin-left/right to creating staggering -->
            <h1 class="text-8xl font-bold leading-none mb-8 title-gradient drop-shadow-2xl flex flex-col gap-2">
                <span class="block -ml-40">Programming</span>
                <span class="block ml-40 text-white">Fundamentals</span>
            </h1>
            
            <p class="text-gray-400 text-xl max-w-2xl mx-auto font-light leading-relaxed mt-4">
                Mastering the syntax of the future. From <span class="text-accentYellow">Python</span> logic to <span class="text-accentBlue">C++</span> performance and <span class="text-accentPink">UI</span> design.
            </p>

            <!-- Tech Stack Icons (Centered) -->
            <div class="flex justify-center gap-8 mt-12 opacity-80">
                <i class="fa-brands fa-python text-4xl text-blue-400 hover:text-yellow-400 transition-colors transform hover:scale-110 duration-300"></i>
                <i class="fa-brands fa-js text-4xl text-yellow-400 hover:text-white transition-colors transform hover:scale-110 duration-300"></i>
                <i class="fa-brands fa-react text-4xl text-cyan-400 hover:text-white transition-colors transform hover:scale-110 duration-300"></i>
                <i class="fa-brands fa-swift text-4xl text-orange-500 hover:text-white transition-colors transform hover:scale-110 duration-300"></i>
                <i class="fa-brands fa-rust text-4xl text-white hover:text-red-400 transition-colors transform hover:scale-110 duration-300"></i>
            </div>
        </div>

        <!-- Presenter Card (Multi-color Border) - Kept Unchanged -->
        <div class="absolute bottom-16 right-16 z-20">
            <div class="gradient-border p-[1px]"> 
                <div class="glass-card p-6 rounded-xl w-[360px] flex items-center gap-5 bg-deepBlack/90">
                    <!-- Avatar -->
                    <div class="relative flex-shrink-0">
                        <div class="w-16 h-16 rounded-full p-0.5 bg-gradient-to-tr from-accentYellow to-accentPink">
                             <img src="https://ui-avatars.com/api/?name=Alex+Morgan&background=111&color=fff" alt="Presenter" class="rounded-full w-full h-full object-cover border-2 border-deepBlack">
                        </div>
                        <div class="absolute bottom-0 right-0 w-4 h-4 bg-accentGreen border-2 border-deepBlack rounded-full"></div>
                    </div>
                    
                    <!-- Info -->
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Speaker</span>
                            <span class="px-1.5 py-0.5 rounded bg-accentPurple/20 text-[10px] text-accentPurple font-bold">LEAD</span>
                        </div>
                        <h3 class="text-xl font-bold text-white leading-tight">Alex Morgan</h3>
                        <div class="flex items-center gap-2 mt-1 text-xs">
                            <span class="text-accentCyan">@ThynkUnltd</span>
                            <span class="text-gray-600">|</span>
                            <span class="text-accentPink">Full Stack Dev</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
