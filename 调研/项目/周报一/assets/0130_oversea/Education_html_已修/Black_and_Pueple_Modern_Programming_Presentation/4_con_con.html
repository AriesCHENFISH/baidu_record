<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 02 - Frontend</title>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { deepBlack: '#020204', accentPink: '#FF7EB6', accentPurple: '#9D50E6' },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden;}
        .clip-shape { clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%); }
    </style>
</head>
<body>
    <div class="relative w-[1280px] h-[720px] mx-auto bg-deepBlack text-white overflow-hidden font-sans">
        
        <!-- Background Gradients -->
        <div class="absolute bottom-0 left-0 w-[800px] h-[800px] bg-gradient-to-tr from-accentPurple to-transparent opacity-10 rounded-full blur-3xl"></div>
        
        <!-- Grid Overlay -->
        <div class="absolute inset-0 z-0 opacity-10" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 30px 30px;"></div>

        <div class="grid grid-cols-2 h-full relative z-10">
            
            <!-- Left Column: Content -->
            <div class="p-16 flex flex-col justify-center">
                <!-- Tag -->
                <div class="inline-flex items-center space-x-2 bg-white/5 border border-white/10 rounded-full px-4 py-1 w-fit mb-8">
                    <span class="w-2 h-2 bg-accentPink rounded-full animate-pulse"></span>
                    <span class="text-xs font-bold tracking-widest text-white/80">UI / UX DESIGN</span>
                </div>

                <h1 class="text-6xl font-bold leading-tight mb-6">
                    User-Centric<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-accentPink to-purple-400">Interfaces</span>
                </h1>

                <p class="text-gray-400 text-lg leading-relaxed mb-10 max-w-md">
                    Crafting pixel-perfect, responsive web applications. We bridge the gap between graphical design and technical implementation using modern frameworks like React and Vue.
                </p>

                <!-- Visual Tech Stack Tags (Static) -->
                <div class="flex flex-wrap gap-3">
                    <span class="px-4 py-2 bg-gray-800 rounded-md text-sm font-mono border border-gray-700 text-blue-300">#ReactJS</span>
                    <span class="px-4 py-2 bg-gray-800 rounded-md text-sm font-mono border border-gray-700 text-green-300">#TailwindCSS</span>
                    <span class="px-4 py-2 bg-gray-800 rounded-md text-sm font-mono border border-gray-700 text-yellow-300">#Motion</span>
                </div>
            </div>

            <!-- Right Column: Visuals -->
            <div class="relative h-full flex items-center justify-center">
                
                <!-- Main Image Container -->
                <div class="relative w-[500px] h-[400px]">
                    <!-- Decorative Frame -->
                    <div class="absolute -inset-4 border-2 border-white/10 rounded-[40px] z-0"></div>
                    <div class="absolute -inset-4 border-2 border-accentPink/30 rounded-[40px] translate-x-2 translate-y-2 z-0"></div>
                    
                    <!-- Image Masked -->
                    <div class="w-full h-full rounded-[30px] overflow-hidden relative z-10 shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=800&auto=format&fit=crop" 
                             alt="Frontend Coding" 
                             class="w-full h-full object-cover opacity-80 hover:scale-105 transition-transform duration-700">
                        
                        <!-- Overlay Glass Box -->
                        <div class="absolute bottom-0 left-0 right-0 h-1/3 bg-black/60 backdrop-blur-md border-t border-white/10 p-6 flex justify-between items-center">
                            <div>
                                <h4 class="text-sm font-bold text-white uppercase tracking-wider">Compile Status</h4>
                                <p class="text-xs text-green-400 mt-1">● Build Successful (124ms)</p>
                            </div>
                            <i class="fa-solid fa-code text-2xl text-white/20"></i>
                        </div>
                    </div>

                    <!-- Floating Color Palette Element -->
                    <div class="absolute -right-12 top-10 bg-gray-900 p-3 rounded-xl border border-white/10 shadow-xl z-20 flex flex-col gap-2">
                        <div class="w-8 h-8 rounded-full bg-accentPink"></div>
                        <div class="w-8 h-8 rounded-full bg-accentPurple"></div>
                        <div class="w-8 h-8 rounded-full bg-blue-500"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
