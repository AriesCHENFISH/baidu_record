<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Dimensions - Keithston Brand</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { coffee: '#1C0F0A' }, // 核心棕色
                    fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; overflow: hidden; background-color: #FFFFFF; }
    </style>
</head>
<body>
    <div id="page_container" class="flex h-full font-sans">
        
        <!-- LEFT COLUMN: Visuals (60% Width) -->
        <div class="w-[60%] h-full relative">
            <img src="https://images.unsplash.com/photo-1533235655767-a89a59b67160?q=80&w=1280&auto=format&fit=crop" 
                 class="absolute inset-0 w-full h-full object-cover">
            
            <!-- Minimal Overlay just for text contrast if needed, but keeping it clean -->
            <div class="absolute inset-0 bg-black/10"></div>

            <!-- Floating Label (Static) -->
            <div class="absolute top-12 left-12 bg-white px-4 py-2 shadow-lg">
                <span class="text-coffee font-bold text-xs uppercase tracking-widest">Figure 1.1: Aerial View</span>
            </div>
        </div>

        <!-- RIGHT COLUMN: The "Brown Block" Content (40% Width) -->
        <div class="w-[40%] bg-coffee h-full p-16 flex flex-col justify-center text-white relative">
            
            <!-- Decorative geometry -->
            <div class="absolute top-0 left-0 w-4 h-full bg-white/5"></div>

            <!-- Header -->
            <div class="mb-12">
                <i class="fa-solid fa-ruler-combined text-4xl mb-6 text-white/80"></i>
                <h1 class="text-4xl font-black uppercase leading-[0.9] tracking-tight">
                    Field<br>Dimensions
                </h1>
                <div class="w-20 h-1 bg-white mt-6"></div>
            </div>

            <!-- Stats List (Static & Visible) -->
            <div class="space-y-10">
                
                <!-- Stat 1 -->
                <div class="group">
                    <h4 class="text-xs font-bold text-white/50 uppercase tracking-widest mb-1">Infield Baseline</h4>
                    <div class="flex items-baseline gap-2">
                        <span class="text-5xl font-light text-white">90</span>
                        <span class="text-lg font-bold text-white/40">ft</span>
                    </div>
                    <p class="text-xs text-white/60 mt-2 border-l border-white/20 pl-3">
                        Exact distance between bases forming a perfect square diamond.
                    </p>
                </div>

                <!-- Stat 2 -->
                <div class="group">
                    <h4 class="text-xs font-bold text-white/50 uppercase tracking-widest mb-1">Pitching Rubber</h4>
                    <div class="flex items-baseline gap-2">
                        <span class="text-5xl font-light text-white">60.6</span>
                        <span class="text-lg font-bold text-white/40">ft</span>
                    </div>
                    <p class="text-xs text-white/60 mt-2 border-l border-white/20 pl-3">
                        Distance from the front of the rubber to the rear point of home plate.
                    </p>
                </div>

            </div>

            <!-- Footer -->
            <div class="mt-auto pt-8 border-t border-white/10">
                <p class="text-[10px] text-white/30 uppercase tracking-widest">
                    MLB Official Regulation Section 2.0
                </p>
            </div>

        </div>

    </div>
</body>
</html>
