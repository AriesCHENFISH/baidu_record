<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Baseball - Cover - Keithston and Partners</title>
    <!-- Google Fonts: Inter & Noto Sans SC -->
    <link href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#F5F5F5',
                        darkOverlay: '#1C0F0A', // The specific dark brown/black from your reference
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Container Setup */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #FFFFFF;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Decorative Stroke Text Effect */
        .text-stroke {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
            color: transparent;
        }
    </style>
</head>
<body>

    <div id="page_container" class="grid grid-cols-12 h-full font-sans">

        <!-- LEFT COLUMN: Content & Typography (Span 7) -->
        <div class="col-span-7 bg-white h-full flex flex-col justify-between p-16 relative z-10 border-r border-gray-100">
            
            <!-- 1. Top Header -->
            <div class="flex justify-between items-start w-full">
                <!-- Brand -->
                <div>
                    <p class="text-xs font-bold tracking-[0.2em] uppercase text-gray-400 mb-1">
                        Keithston and Partners
                    </p>
                    <div class="h-0.5 w-12 bg-black"></div>
                </div>
            </div>

            <!-- 2. Main Title Area -->
            <div class="mt-8">
                <!-- Decorative Tag -->
                <span class="inline-block py-1 px-3 border border-black rounded-full text-[10px] font-bold uppercase tracking-wider mb-6 hover:bg-black hover:text-white transition-colors duration-300">
                    2026 Season Analysis
                </span>

                <!-- Giant Typography -->
                <h1 class="text-[5.5rem] font-black text-primary leading-[0.85] tracking-tight uppercase mb-6">
                    Intro<span class="text-gray-300">.</span><br>
                    <span class="italic">duction</span><br>
                    To Baseball
                </h1>

                <!-- Short Description -->
                <p class="text-base text-gray-600 font-light leading-relaxed max-w-lg border-l-4 border-darkOverlay pl-6">
                    A comprehensive guide to the rules, strategies, and cultural impact of the game, designed for professionals and enthusiasts alike.
                </p>
            </div>

            <!-- 3. Footer / Presenter Info -->
            <div class="mt-auto pt-8 border-t border-gray-100 flex items-center gap-6">
                <!-- Avatar Placeholder -->
                <div class="w-12 h-12 rounded-full bg-gray-100 overflow-hidden border border-gray-200">
                     <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale opacity-80" alt="Presenter">
                </div>
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Presented By</p>
                    <p class="text-sm font-bold text-black">Phyllis Schwaiger</p>
                </div>
                
                <!-- Start Button / Icon -->
                <div class="ml-auto group cursor-pointer flex items-center gap-3">
                    <span class="text-xs font-bold uppercase tracking-widest group-hover:mr-2 transition-all">Start</span>
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center group-hover:bg-darkOverlay transition-colors">
                        <i class="fa-solid fa-arrow-right transform -rotate-45 group-hover:rotate-0 transition-transform duration-300"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Visual & Brand Color (Span 5) -->
        <div class="col-span-5 h-full relative bg-darkOverlay overflow-hidden">
            
            <!-- Background Image -->
            <div class="absolute inset-0 z-0">
                <!-- Using a moody, close-up shot of equipment to differ from the 'field' shot in the inner page -->
                <img src="https://images.unsplash.com/photo-1588691866367-9d7a26f04302?q=80&w=800&auto=format&fit=crop" 
                     alt="Baseball glove and ball close up" 
                     class="w-full h-full object-cover opacity-60 mix-blend-luminosity">
            </div>

            <!-- Gradient Overlays -->
            <div class="absolute inset-0 bg-gradient-to-b from-darkOverlay/90 via-transparent to-darkOverlay/90 z-10"></div>
            <div class="absolute inset-0 bg-darkOverlay/20 z-10"></div>

            <!-- Content Overlay -->
            <div class="relative z-20 h-full flex flex-col p-10">
                
                <!-- Menu Icon (Top Right) -->
                <div class="flex justify-end">
                    <div class="w-10 h-10 border border-white/20 rounded-full flex items-center justify-center text-white cursor-pointer hover:bg-white hover:text-black transition-all">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </div>
                </div>

                <!-- Decorative Elements in the dark space -->
                <div class="flex-grow flex flex-col justify-center items-center relative">
                    <!-- Giant Background Number/Letter -->
                    <span class="text-[15rem] font-black text-stroke opacity-10 absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 select-none">
                        B
                    </span>
                    
                    <!-- Floating Icon -->
                    <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 mb-6 shadow-2xl">
                        <i class="fa-solid fa-baseball text-4xl text-white"></i>
                    </div>
                    
                    <h2 class="text-white text-2xl font-bold tracking-widest uppercase text-center">
                        Professional<br>Edition
                    </h2>
                </div>

                <!-- Bottom Stats/Decor -->
                <div class="flex justify-between items-end text-white/50 text-[10px] font-mono border-t border-white/10 pt-4">
                    <span>EST. 1998</span>
                    <span>VOL. 24</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
