<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page 01 - Competitive Analysis Cover</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#F7F7F2',
                        textMain: '#1E1E1E',
                        accentLight: '#DCC1A7',
                        accentDark: '#4A3B32',
                        lineColor: '#1E1E1E',
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px; height: 720px;
            background-color: #F7F7F2;
            position: relative; overflow: hidden; margin: 0 auto;
        }
        /* 顶部锯齿装饰 */
        .header-deco { clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); }
        /* 复古硬阴影 */
        .retro-shadow { box-shadow: 8px 8px 0px #1E1E1E; }
        /* 背景装饰线条 */
        .bg-line { position: absolute; background-color: #1E1E1E; opacity: 0.05; }
    </style>
</head>
<body class="flex flex-col text-textMain">

    <div id="page_container" class="flex flex-col">
        
        <div class="bg-line w-[1px] h-full left-[20%] top-0"></div>
        <div class="bg-line w-[1px] h-full left-[80%] top-0"></div>
        <div class="bg-line w-full h-[1px] top-[40%] left-0"></div>

        <header class="h-20 flex items-stretch border-b border-lineColor bg-white/30 z-10">
            <div class="bg-accentLight px-10 flex items-center border-r border-lineColor header-deco">
                <h1 class="text-2xl font-black tracking-tighter uppercase">
                    Strategic <span class="text-accentDark">Presentation</span>
                </h1>
            </div>
            <div class="flex-1 flex items-center px-8 bg-white/50">
                <div class="flex items-center gap-4">
                    <span class="w-2 h-2 bg-accentDark rounded-full"></span>
                    <p class="text-[10px] font-bold tracking-[0.2em] text-gray-500 uppercase">FY2026 Competitive Intelligence Series</p>
                </div>
            </div>
            <div class="w-64 flex border-l border-lineColor">
                <div class="flex-1 bg-accentDark flex items-center justify-center text-accentLight">
                    <i class="fa-solid fa-chess-king text-xl"></i>
                </div>
                <div class="flex-1 bg-white flex items-center justify-center border-l border-lineColor">
                    <p class="text-xs font-black italic">VOL.01</p>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col justify-center px-24 relative z-10">
            
            <div class="mb-12">
                <p class="text-accentDark font-black uppercase tracking-[0.5em] text-sm mb-4">Market Positioning Report</p>
                <h1 class="text-[120px] font-black leading-[0.85] tracking-tighter uppercase">
                    Competitive<br>
                    <span class="text-accentDark">Analysis.</span>
                </h1>
            </div>

            <div class="flex items-stretch gap-0 mt-8">
                <div class="bg-white border-2 border-lineColor p-8 retro-shadow flex gap-12">
                    <div class="flex flex-col gap-1">
                        <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Reporter</p>
                        <p class="text-xl font-black uppercase">Wang Xiaoming</p>
                    </div>
                    <div class="w-px bg-lineColor/20"></div>
                    <div class="flex flex-col gap-1">
                        <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Date</p>
                        <p class="text-xl font-black uppercase">2026.01.08</p>
                    </div>
                </div>
                
                <div class="w-20 bg-accentDark flex items-center justify-center text-accentLight ml-6 retro-shadow border-2 border-lineColor">
                    <i class="fa-solid fa-arrow-down text-2xl"></i>
                </div>
            </div>

        </main>

        <footer class="h-16 border-t border-lineColor flex items-center justify-between px-12 bg-white z-10">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 border border-lineColor flex items-center justify-center hover:bg-accentLight transition-colors cursor-pointer">
                    <i class="fa-solid fa-chevron-left text-xs"></i>
                </div>
                <div class="w-10 h-10 border border-lineColor bg-textMain text-white flex items-center justify-center cursor-pointer">
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
            </div>
            <div class="flex items-center gap-8">
                <p class="text-[10px] font-bold tracking-widest text-gray-400 uppercase">Confidential & Internal Use Only</p>
                <div class="h-8 w-px bg-lineColor opacity-10"></div>
                <p class="text-sm font-black tracking-widest uppercase">Page <span class="text-lg">01</span></p>
            </div>
        </footer>

    </div>

</body>
</html>
