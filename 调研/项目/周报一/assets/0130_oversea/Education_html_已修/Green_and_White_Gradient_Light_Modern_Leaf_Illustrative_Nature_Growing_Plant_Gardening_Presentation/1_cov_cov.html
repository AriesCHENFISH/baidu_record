<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Larana Garden - Modern Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; }
        #page_container {
            width: 1280px; height: 720px;
            margin: 0 auto; position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 0% 0%, #F3F9E3 0%, #B9D793 100%);
        }
        .bg-blur {
            position: absolute; border-radius: 50%; filter: blur(80px); z-index: 0;
        }
        .text-glow { text-shadow: 0 10px 30px rgba(47, 65, 24, 0.1); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-blur w-[600px] h-[600px] bg-white opacity-40 -top-40 -left-20"></div>
        <div class="bg-blur w-[500px] h-[500px] bg-[#4B6331] opacity-10 bottom-0 right-0"></div>

        <div class="relative z-10 w-full h-full flex flex-col justify-between px-20 py-16">
            <header class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-14 h-14 rounded-full bg-[#4B6331] shadow-lg">
                        <i class="fas fa-leaf text-[#B9D793] text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold tracking-[0.3em] text-[#2F4118]">LARANA</h2>
                        <h3 class="text-xs tracking-[0.5em] text-[#4B6331] opacity-60 font-bold uppercase">Garden Academy</h3>
                    </div>
                </div>
            </header>

            <main class="flex flex-col items-center text-center">
                <div class="w-20 h-1 bg-[#4B6331] mb-10 opacity-30"></div>
                <h1 class="text-[140px] font-black leading-none text-[#2F4118] tracking-tighter text-glow">
                    Gardening
                </h1>
                <div class="mt-6 space-y-4">
                    <p class="text-3xl font-light tracking-[0.4em] text-[#4B6331] uppercase">
                        Mastering the Green Art
                    </p>
                    <p class="text-lg italic font-serif text-[#6B7F49] opacity-80">
                        Growing Life, One Plant at a Time • Since 2026
                    </p>
                </div>
                <div class="w-20 h-1 bg-[#4B6331] mt-10 opacity-30"></div>
            </main>

            <footer class="flex justify-between items-end">
                <div class="px-8 py-3 rounded-full bg-white/40 backdrop-blur-md border border-white/60 shadow-sm">
                    <span class="text-xs font-bold tracking-widest text-[#2F4118] uppercase">Vol. 01 Comprehensive Guide</span>
                </div>
                
                <div class="flex flex-col items-end gap-1 border-r-4 border-[#4B6331] pr-6">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold tracking-widest text-[#4B6331] opacity-60 uppercase">Presenter</span>
                        <span class="text-lg font-bold tracking-widest text-[#2F4118]">Alex Rivers</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-bold tracking-widest text-[#4B6331] opacity-60 uppercase">Date</span>
                        <span class="text-sm font-medium tracking-widest text-[#4B6331]">January 08, 2026</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
