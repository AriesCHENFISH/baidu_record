<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Preparation - Larana Garden</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
        }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #2F4118 0%, #4B6331 100%);
        }

        .glass-card {
            background: rgba(107, 127, 73, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .decorative-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="decorative-blob" style="width: 600px; height: 600px; background: #4B6331; top: -200px; left: -200px; opacity: 0.6;"></div>
        <div class="decorative-blob" style="width: 500px; height: 500px; background: #6B7F49; bottom: -100px; right: -100px; opacity: 0.4;"></div>

        <nav class="relative z-50 flex items-center pt-8 w-full">
            <div class="flex items-center bg-[#B9D793] rounded-r-full pl-12 pr-10 py-3 shadow-lg">
                <div class="text-[#2F4118] text-3xl mr-3"><i class="fa-solid fa-leaf"></i></div>
                <div class="flex flex-col">
                    <span class="text-[#2F4118] font-bold text-lg leading-tight tracking-widest">LARANA</span>
                    <span class="text-[#2F4118] font-light text-sm leading-tight tracking-widest opacity-70">GARDEN</span>
                </div>
            </div>
        </nav>

        <div style="display: grid; grid-template-columns: 1.1fr 0.9fr; height: calc(100% - 100px); padding-left: 60px; position: relative; z-index: 10;">
            
            <div style="display: flex; flex-direction: column; justify-content: center; padding-right: 40px;">
                
                <h1 style="font-size: 64px; color: #FFFFFF; font-weight: 700; line-height: 1.1; margin-bottom: 40px; text-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                    Soil Preparation
                </h1>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px;">
                    
                    <div class="glass-card" style="padding: 24px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 160px;">
                        <div style="font-size: 40px; color: #B9D793;">
                            <i class="fa-solid fa-sack-xmark"></i>
                        </div>
                        <h3 style="color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: center;">Types of soil</h3>
                    </div>

                    <div class="glass-card" style="padding: 24px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 160px;">
                        <div style="font-size: 40px; color: #F3F9E3;">
                            <i class="fa-solid fa-flask-vial"></i>
                        </div>
                        <h3 style="color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: center;">Testing pH</h3>
                    </div>

                    <div class="glass-card" style="padding: 24px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 160px;">
                        <div style="font-size: 36px; color: #8F6946;">
                            <i class="fa-solid fa-mound"></i>
                        </div>
                        <h3 style="color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: center;">Improving soil</h3>
                    </div>

                    <div class="glass-card" style="padding: 24px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 160px;">
                        <div style="position: relative;">
                            <i class="fa-solid fa-layer-group" style="font-size: 40px; color: #B9D793;"></i>
                            <div style="position: absolute; top: -10px; right: -20px; background: #E8F3C9; color: #2F4118; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 10px;">TIP</div>
                        </div>
                        <h3 style="color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: center;">Importance of mulching</h3>
                    </div>
                </div>

                <p style="color: #F3F9E3; font-size: 14px; line-height: 1.6; opacity: 0.8; max-width: 500px; font-style: italic;">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco.
                </p>
            </div>

            <div style="display: flex; align-items: center; justify-content: center; position: relative;">
                <div style="position: relative; width: 560px; height: 560px; display: flex; align-items: center; justify-content: center;">
                    <div style="position: absolute; width: 560px; height: 560px; border: 2px solid rgba(185, 215, 147, 0.1); border-radius: 50%;"></div>
                    
                    <div style="width: 520px; height: 520px; border-radius: 50%; overflow: hidden; border: 8px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
                        <img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Small seedling" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>

                    <div style="position: absolute; bottom: 80px; left: 0; width: 80px; height: 80px; background: #B9D793; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2);">
                        <i class="fa-solid fa-seedling" style="color: #2F4118; font-size: 32px;"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
