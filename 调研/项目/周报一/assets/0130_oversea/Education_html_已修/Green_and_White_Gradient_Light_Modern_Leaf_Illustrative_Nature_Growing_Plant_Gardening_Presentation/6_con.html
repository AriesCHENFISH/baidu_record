<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Gardens - Larana Garden</title>
    
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #F3F9E3 0%, #B9D793 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <div class="absolute -top-10 -left-10 text-[#2F4118] opacity-10 transform rotate-45 blur-sm z-0">
            <i class="fa-solid fa-leaf text-[200px]"></i>
        </div>
        <div class="absolute -bottom-20 -right-20 text-[#4B6331] opacity-20 transform -rotate-45 blur-md z-0">
            <i class="fa-solid fa-leaf text-[300px]"></i>
        </div>

        <nav class="relative z-50 flex items-center pt-8 w-full">
            <div class="flex items-center bg-[#4B6331] rounded-r-full pl-12 pr-10 py-3 shadow-lg">
                <div class="text-white text-3xl mr-3">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-bold text-lg leading-tight tracking-widest">LARANA</span>
                    <span class="text-white font-light text-sm leading-tight tracking-widest">GARDEN</span>
                </div>
            </div>
        </nav>

        <div class="relative z-10 flex flex-col items-center mt-10 w-full px-16 h-full">
            
            <div class="mb-12 text-center">
                <h1 class="text-6xl font-extrabold text-[#2F4118] tracking-tight">
                    Types of Gardens
                </h1>
            </div>

            <div class="grid grid-cols-5 gap-6 w-full h-[400px]">
                
                <div class="flex flex-col items-center">
                    <div class="w-full h-[320px] rounded-2xl overflow-hidden shadow-xl border-[3px] border-white relative">
                        <img src="https://images.unsplash.com/photo-1592419044706-39796d40f98c?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover" alt="Vegetable">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#2F4118]/60 to-transparent"></div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-xl font-bold text-[#2F4118]">Vegetable</h3>
                    </div>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-full h-[320px] rounded-2xl shadow-lg border-[3px] border-white glass-card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-[#4B6331] mb-4 text-4xl">
                            <i class="fa-solid fa-spa"></i>
                        </div>
                        <h3 class="text-xl font-bold text-[#2F4118] mb-3">Flower Garden</h3>
                        <p class="text-sm text-[#4B6331] leading-relaxed">
                            Focuses on aesthetic beauty with a variety of seasonal blooms and colorful perennials.
                        </p>
                    </div>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-full h-[320px] rounded-2xl overflow-hidden shadow-xl border-[3px] border-white relative">
                        <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover" alt="Herb">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#2F4118]/60 to-transparent"></div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-xl font-bold text-[#2F4118]">Herb</h3>
                    </div>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-full h-[320px] rounded-2xl shadow-lg border-[3px] border-white glass-card flex flex-col items-center justify-center p-6 text-center">
                        <div class="text-[#4B6331] mb-4 text-4xl">
                            <i class="fa-solid fa-house-chimney-window"></i>
                        </div>
                        <h3 class="text-xl font-bold text-[#2F4118] mb-3">Indoor Garden</h3>
                        <p class="text-sm text-[#4B6331] leading-relaxed">
                            Perfect for urban spaces, using houseplants and air-purifying species in containers.
                        </p>
                    </div>
                </div>

                <div class="flex flex-col items-center">
                    <div class="w-full h-[320px] rounded-2xl overflow-hidden shadow-xl border-[3px] border-white relative">
                        <img src="https://images.unsplash.com/photo-1556910103-1c02745a30bf?q=80&w=600&auto=format&fit=crop" class="w-full h-full object-cover" alt="Hydroponic">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#2F4118]/60 to-transparent"></div>
                    </div>
                    <div class="mt-4 text-center">
                        <h3 class="text-xl font-bold text-[#2F4118]">Hydroponic</h3>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
