<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Slide - Staggered Design</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #F0F0F0; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .aurora { position: absolute; border-radius: 50%; filter: blur(100px); z-index: 1; opacity: 0.5; }
        .text-outline { -webkit-text-stroke: 2px rgba(34, 34, 34, 0.1); color: transparent; font-weight: 900; }
    </style>
</head>
<body>
    <div id="page_container" class="flex flex-col items-center justify-center">
        <!-- Background Elements -->
        <div class="aurora w-[800px] h-[800px] bg-[#7B8BFF] -top-96 -left-48"></div>
        <div class="aurora w-[600px] h-[600px] bg-[#001AFF] -bottom-48 -right-24"></div>
        <div class="absolute inset-0 flex items-center justify-center z-0">
            <span class="text-outline text-[450px] tracking-tighter select-none">2024</span>
        </div>

        <!-- Main Content -->
        <div class="relative z-10 w-full flex flex-col items-center">
            <!-- Staggered Title -->
            <div class="relative w-full max-w-5xl">
                <!-- Top Left Staggered Word -->
                <h1 class="text-[#222222] text-[150px] font-black leading-none tracking-tighter italic -ml-24">
                    PROJECT
                </h1>
                <!-- Bottom Right Staggered Word -->
                <h1 class="text-[#001AFF] text-[150px] font-black leading-none tracking-tighter text-right -mr-24 -mt-4">
                    PRESENTATION
                </h1>
            </div>

            <!-- Presenter Info -->
            <div class="mt-20 flex flex-col items-center gap-4">
                <div class="w-16 h-[2px] bg-[#222222]"></div>
                <div class="flex items-center gap-6">
                    <p class="text-sm font-bold tracking-[0.4em] text-[#222222] uppercase">Strategic Review</p>
                    <span class="text-[#CCCCCC]">/</span>
                    <p class="text-xl font-light text-[#555555]">Presented by <span class="font-bold text-[#222222]">Morgan Maxwell</span></p>
                </div>
            </div>
        </div>

        <!-- Brand Footer -->
        <div class="absolute bottom-12 w-full px-16 flex justify-between items-center z-20">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shapes text-[#001AFF]"></i>
                <p class="text-[10px] font-bold tracking-[0.5em] text-[#222222] uppercase">Thynk Unlimited Agency</p>
            </div>
            <p class="text-[10px] font-mono text-[#999999]">CONFIDENTIAL SLIDE v1.0</p>
        </div>
    </div>
</body>
</html>
