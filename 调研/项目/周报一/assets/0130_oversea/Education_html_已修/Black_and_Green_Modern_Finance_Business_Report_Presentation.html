                            &lt;div class=&quot;w-10 h-10 rounded-full bg-brandAccent flex items-center justify-center text-bgDark&quot;&gt;
                                &lt;i class=&quot;fa-solid fa-arrow-trend-up text-lg&quot;&gt;&lt;/i&gt;

   </iframe>
  </div>
  <script>
   // 自动调整iframe高度
    function resizeIframes() {
        document.querySelectorAll('.responsive-iframe').forEach(iframe => {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const height = Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight,
                    doc.body.offsetHeight,
                    doc.documentElement.offsetHeight,
                    doc.body.clientHeight,
                    doc.documentElement.clientHeight
                );
                iframe.style.height = height + 'px';
            } catch (e) {
                console.log('无法调整iframe高度:', e);
            }
        });
    }
    
    // 初始调整
    window.addEventListener('load', resizeIframes);
    
    // 内容加载后调整
    document.querySelectorAll('.responsive-iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            resizeIframes();
            // 对动态内容进行定期检查
            setInterval(resizeIframes, 1000);
        });
    });
  </script>
 </body>
