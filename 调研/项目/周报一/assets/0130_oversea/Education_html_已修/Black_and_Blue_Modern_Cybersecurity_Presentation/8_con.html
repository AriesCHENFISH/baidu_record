<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Workplace - Refined</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #000000 70%);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #6b21a8 0%, #d946ef 100%);
        }

        /* Styles copied from Reference Page 10 */
        .cyber-card {
            background: linear-gradient(160deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 40px;
            box-shadow: 0 0 60px rgba(76, 29, 149, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .cyber-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #4f46e5, #d946ef, #4f46e5);
            z-index: -1;
            border-radius: 42px;
            background-size: 400%;
            opacity: 0.5;
            filter: blur(10px);
            animation: borderGlow 10s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .icon-circle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .list-item-group:hover .icon-circle {
            background: rgba(217, 70, 239, 0.2);
            border-color: rgba(217, 70, 239, 0.5);
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.3);
        }

        .glow-sphere {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="glow-sphere bg-indigo-600 w-[700px] h-[700px] top-[-100px] left-[-200px] opacity-30"></div>
        <div class="glow-sphere bg-purple-600 w-[600px] h-[600px] bottom-[-100px] right-[-100px] opacity-30"></div>

        <div class="absolute top-0 w-full flex justify-end items-center px-16 pt-12 pb-4 z-50">
            <div class="btn-gradient px-8 py-3 rounded-full text-white font-bold shadow-lg" style="box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4);">
                Page 08
            </div>
        </div>

        <div class="relative z-10 grid grid-cols-12 gap-12 px-16 h-full items-center">
            
            <div class="col-span-5 flex justify-center items-center relative">
                <div class="absolute w-[300px] h-[300px] bg-purple-500 rounded-full filter blur-[80px] opacity-40 animate-pulse"></div>
                
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" 
                     alt="Abstract 3D Shape" 
                     class="relative z-10 w-full max-w-[420px] h-auto object-contain drop-shadow-2xl"
                     style="mask-image: linear-gradient(to bottom, black 80%, transparent 100%);">
            </div>

            <div class="col-span-7 pl-6">
                <div class="cyber-card p-12">
                    
                    <div class="mb-10 border-b border-white/10 pb-6">
                        <h1 class="text-5xl font-extrabold text-white leading-tight mb-3">
                            Cybersecurity in<br>
                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">The Workplace</span>
                        </h1>
                        <p class="text-gray-400 text-base font-light tracking-wide">
                            Building a resilient defense through culture and habit.
                        </p>
                    </div>

                    <div class="space-y-8">
                        
                        <div class="list-item-group flex items-start gap-6 group cursor-default">
                            <div class="icon-circle text-cyan-400">
                                <i class="fa-solid fa-chalkboard-user text-2xl"></i>
                            </div>
                            <div>
                                <h4 class="text-white font-bold text-xl mb-1 group-hover:text-cyan-300 transition-colors">Regular Training</h4>
                                <p class="text-gray-400 text-sm font-light">Empower employees with up-to-date knowledge on phishing tactics and safe practices.</p>
                            </div>
                        </div>

                        <div class="list-item-group flex items-start gap-6 group cursor-default">
                            <div class="icon-circle text-purple-400">
                                <i class="fa-solid fa-mobile-screen-button text-2xl"></i>
                            </div>
                            <div>
                                <h4 class="text-white font-bold text-xl mb-1 group-hover:text-purple-300 transition-colors">Multi-Factor Auth</h4>
                                <p class="text-gray-400 text-sm font-light">Implement MFA to add a critical layer of security beyond just passwords.</p>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
