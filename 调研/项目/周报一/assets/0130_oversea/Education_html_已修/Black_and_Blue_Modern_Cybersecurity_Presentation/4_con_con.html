<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Cybersecurity Principles - Refined</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #page_container {
            width: 1280px;
            height: 720px;
            position: relative;
            background-color: #000000;
            margin: 0 auto;
            overflow: hidden;
            background: radial-gradient(circle at 50% 120%, #1e1b4b 0%, #000000 70%);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #6b21a8 0%, #d946ef 100%);
        }

        .glow-sphere {
            background: radial-gradient(circle, rgba(217, 70, 239, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(80px);
            position: absolute;
            pointer-events: none;
        }

        /* Styles copied from Reference Page 10 */
        .cyber-card {
            background: linear-gradient(160deg, rgba(30, 27, 75, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 40px;
            box-shadow: 0 0 60px rgba(76, 29, 149, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }

        .cyber-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.6), inset 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .cyber-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #4f46e5, #d946ef, #4f46e5);
            z-index: -1;
            border-radius: 42px;
            background-size: 400%;
            opacity: 0.5;
            filter: blur(10px);
            animation: borderGlow 10s linear infinite;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Updated Icon Box for internal layout */
        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="page_container">

        <div class="glow-sphere" style="top: -150px; left: 20%; width: 800px; height: 500px; background: radial-gradient(circle, rgba(76, 29, 149, 0.3) 0%, rgba(0,0,0,0) 70%);"></div>
        
        <div class="absolute top-0 w-full flex justify-end items-center px-16 pt-12 pb-4 z-50">
            <div class="btn-gradient px-8 py-3 rounded-full text-white font-bold shadow-lg" style="box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4);">
                Page 04
            </div>
        </div>

        <div class="relative w-full h-full flex flex-col items-center justify-center pt-8 px-16 z-20">

            <div class="text-center mb-16">
                <h1 class="text-5xl font-extrabold text-white mb-6 drop-shadow-xl tracking-tight">
                    Key Cybersecurity <span style="color: #E879F9;">Principles</span>
                </h1>
                <div class="w-32 h-1.5 bg-gradient-to-r from-purple-600 via-pink-500 to-indigo-500 mx-auto rounded-full"></div>
            </div>

            <div class="grid grid-cols-3 gap-10 w-full max-w-6xl">

                <div class="h-[360px]">
                    <div class="cyber-card p-8 flex flex-col items-center justify-center text-center">
                        <div class="icon-box border-cyan-500/30 shadow-[0_0_20px_rgba(34,211,238,0.3)]">
                            <i class="fa-solid fa-user-shield text-4xl text-cyan-400"></i>
                        </div>
                        <h3 class="text-white text-2xl font-bold mb-4">Confidentiality</h3>
                        <div class="w-12 h-1 bg-cyan-500/50 rounded-full mb-6"></div>
                        <p class="text-gray-300 text-base font-light leading-relaxed">
                            Ensuring sensitive information is accessible only to authorized users.
                        </p>
                    </div>
                </div>

                <div class="h-[360px]">
                    <div class="cyber-card p-8 flex flex-col items-center justify-center text-center">
                        <div class="icon-box border-fuchsia-500/30 shadow-[0_0_20px_rgba(217,70,239,0.3)]">
                            <i class="fa-solid fa-file-contract text-4xl text-fuchsia-400"></i>
                        </div>
                        <h3 class="text-white text-2xl font-bold mb-4">Integrity</h3>
                        <div class="w-12 h-1 bg-fuchsia-500/50 rounded-full mb-6"></div>
                        <p class="text-gray-300 text-base font-light leading-relaxed">
                            Maintaining data accuracy and preventing unauthorized modifications.
                        </p>
                    </div>
                </div>

                <div class="h-[360px]">
                    <div class="cyber-card p-8 flex flex-col items-center justify-center text-center">
                        <div class="icon-box border-indigo-500/30 shadow-[0_0_20px_rgba(99,102,241,0.3)]">
                            <i class="fa-solid fa-server text-4xl text-indigo-400"></i>
                        </div>
                        <h3 class="text-white text-2xl font-bold mb-4">Availability</h3>
                        <div class="w-12 h-1 bg-indigo-500/50 rounded-full mb-6"></div>
                        <p class="text-gray-300 text-base font-light leading-relaxed">
                            Guaranteeing that information and systems are accessible when needed.
                        </p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</body>
</html>
