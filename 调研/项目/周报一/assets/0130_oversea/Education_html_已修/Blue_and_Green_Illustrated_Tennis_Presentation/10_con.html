<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Slams - Tennis Presentation</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { t_primary: '#3F6283', t_container: '#6292C2', t_accent: '#DDEE56', t_highlight: '#F0F4C3', t_shadow: '#324E68' }, fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] } } } }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #3F6283; position: relative; margin: 0 auto; overflow: hidden; }
        .text-shadow-hard { text-shadow: 4px 4px 0px #324E68; }
        .title-italic { font-style: italic; font-weight: 900; }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="page_container">
        <header class="relative z-20 w-full h-[100px] bg-t_accent p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm cursor-default">home</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">content</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">contact</div>
                </nav>
            </div>
        </header>

        <main class="h-[620px] px-12 pt-10">
            <div class="text-center mb-10">
                <h1 class="text-6xl text-white title-italic uppercase text-shadow-hard inline-block relative">
                    Grand <span class="text-t_accent">Slams</span>
                    <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-24 h-2 bg-white/20 rounded-full"></div>
                </h1>
            </div>

            <div class="grid grid-cols-4 gap-6 px-4">
                
                <div class="group bg-t_container/20 border-2 border-white/20 rounded-3xl p-5 relative overflow-hidden hover:-translate-y-3 transition-transform duration-300">
                    <div class="absolute top-0 right-0 p-4 opacity-10 text-white text-6xl font-black italic">01</div>
                    <div class="w-12 h-12 bg-[#3498db] rounded-xl mb-4 flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                    <h3 class="text-white text-xl font-black italic mb-1 uppercase">Australian Open</h3>
                    <p class="text-t_accent text-xs font-bold uppercase tracking-widest mb-3">January • Hard Court</p>
                    <div class="h-[250px] rounded-lg overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1626245550570-71c4c6930096?q=80&w=400" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                    </div>
                </div>

                <div class="group bg-t_container/20 border-2 border-white/20 rounded-3xl p-5 relative overflow-hidden hover:-translate-y-3 transition-transform duration-300 delay-75">
                    <div class="absolute top-0 right-0 p-4 opacity-10 text-white text-6xl font-black italic">02</div>
                    <div class="w-12 h-12 bg-[#e67e22] rounded-xl mb-4 flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-shoe-prints"></i>
                    </div>
                    <h3 class="text-white text-xl font-black italic mb-1 uppercase">French Open</h3>
                    <p class="text-t_accent text-xs font-bold uppercase tracking-widest mb-3">May • Clay Court</p>
                    <div class="h-[250px] rounded-lg overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1590416972767-f3177894a821?q=80&w=400" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                    </div>
                </div>

                <div class="group bg-t_container/20 border-2 border-white/20 rounded-3xl p-5 relative overflow-hidden hover:-translate-y-3 transition-transform duration-300 delay-150">
                    <div class="absolute top-0 right-0 p-4 opacity-10 text-white text-6xl font-black italic">03</div>
                    <div class="w-12 h-12 bg-[#2ecc71] rounded-xl mb-4 flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <h3 class="text-white text-xl font-black italic mb-1 uppercase">Wimbledon</h3>
                    <p class="text-t_accent text-xs font-bold uppercase tracking-widest mb-3">July • Grass Court</p>
                    <div class="h-[250px] rounded-lg overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1622279457486-62dcc4a4977b?q=80&w=400" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                    </div>
                </div>

                <div class="group bg-t_container/20 border-2 border-white/20 rounded-3xl p-5 relative overflow-hidden hover:-translate-y-3 transition-transform duration-300 delay-200">
                    <div class="absolute top-0 right-0 p-4 opacity-10 text-white text-6xl font-black italic">04</div>
                    <div class="w-12 h-12 bg-[#2980b9] rounded-xl mb-4 flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-city"></i>
                    </div>
                    <h3 class="text-white text-xl font-black italic mb-1 uppercase">US Open</h3>
                    <p class="text-t_accent text-xs font-bold uppercase tracking-widest mb-3">August • Hard Court</p>
                    <div class="h-[250px] rounded-lg overflow-hidden border border-white/10">
                        <img src="https://images.unsplash.com/photo-1589315181774-686414777a45?q=80&w=400" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                    </div>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
