<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History of Tennis - Creative Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Global Settings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Typography Utilities */
        .text-shadow-hard {
            text-shadow: 4px 4px 0px rgba(50, 78, 104, 0.5);
        }
        
        /* Utility for strictly hiding scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div id="page_container" class="w-[1280px] h-[720px] bg-[#3F6283] relative mx-auto overflow-hidden shadow-none">
        
        <header class="relative z-20 w-full h-[100px] bg-[#DDEE56] p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm cursor-default">
                        home
                    </div>
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">
                        content
                    </div>
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">
                        contact
                    </div>
                </nav>
            </div>
        </header>

        <div class="w-full h-[620px] flex px-20 pt-16 pb-12">
            
            <div class="w-7/12 pr-12 flex flex-col justify-center relative z-10">
                <h1 class="text-white text-8xl font-black italic tracking-tighter leading-[0.9] text-shadow-hard mb-10">
                    History of<br>Tennis
                </h1>
                
                <div class="w-24 h-2 bg-[#DDEE56] mb-8 rounded-full"></div>

                <p class="text-white text-xl font-light leading-relaxed opacity-90 text-justify">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas hendrerit leo in felis ultrices, ut vulputate sem tincidunt. Etiam mattis venenatis nunc, in eleifend purus. Etiam tincidunt justo dui, non.
                </p>

                </div>

            <div class="w-5/12 flex items-center justify-center relative">
                
                <div class="w-[420px] h-[480px] bg-[#6292C2] rounded-[40px] shadow-2xl relative flex items-end justify-center overflow-visible">
                    
                    <div class="absolute inset-4 bg-[#3F6283] rounded-[32px] overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=800&auto=format&fit=crop" 
                             alt="Tennis Court Abstract" 
                             class="w-full h-full object-cover opacity-80 mix-blend-overlay">
                        
                        <div class="absolute bottom-6 left-6 text-white opacity-20">
                            <i class="fa-solid fa-table-tennis-paddle-ball text-6xl"></i>
                        </div>
                    </div>

                    <div class="absolute bottom-0 w-[280px] h-[360px] z-20">
                         <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=600&auto=format&fit=crop" 
                              class="w-full h-full object-cover rounded-t-2xl shadow-lg border-4 border-[#F0F4C3]"
                              alt="Tennis Umpire Chair View">
                    </div>

                    <div class="absolute -top-10 -right-10 w-28 h-28 bg-[#DDEE56] rounded-full shadow-lg border-[6px] border-[#F0F4C3] flex items-center justify-center z-30">
                        <div class="w-20 h-20 border-r-[3px] border-white rounded-full opacity-60 transform rotate-45"></div>
                    </div>

                    <div class="absolute -top-4 -right-24 flex flex-col gap-2 z-10 opacity-60">
                         <div class="w-24 h-1 bg-white rounded-full"></div>
                         <div class="w-32 h-1 bg-white rounded-full ml-4"></div>
                         <div class="w-20 h-1 bg-white rounded-full ml-2"></div>
                    </div>

                </div>
            </div>
        </div>

        <div class="absolute bottom-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
            <div class="absolute -bottom-20 -left-20 text-[#324E68] opacity-10 transform rotate-12">
                <i class="fa-solid fa-baseball-bat-ball text-[400px]"></i>
            </div>
        </div>

    </div>
</body>
</html>
