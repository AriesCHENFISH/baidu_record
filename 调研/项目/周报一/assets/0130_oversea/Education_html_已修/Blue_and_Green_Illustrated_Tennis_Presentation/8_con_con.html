<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis Keynote - Famous Players</title>
    
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        t_primary: '#3F6283',
                        t_container: '#6292C2',
                        t_accent: '#DDEE56',
                        t_highlight: '#F0F4C3',
                        t_white: '#FFFFFF',
                        t_shadow: '#324E68',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #3F6283;
            overflow: hidden;
        }
        .text-depth { text-shadow: 4px 4px 0px #324E68; }
        .title-italic { font-style: italic; font-weight: 800; letter-spacing: -0.02em; }
    </style>
</head>
<body>

    <div id="page_container">
        <!-- Unified Header Section -->
        <header class="relative z-20 w-full h-[100px] bg-t_accent p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm cursor-default">home</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">content</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">contact</div>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="w-full h-[620px] flex items-center justify-center">
            <div class="relative w-[900px] h-[420px] bg-t_container rounded-[40px] flex items-center shadow-[0_30px_60px_-10px_rgba(50,78,104,0.6)]">
                
                <div class="absolute -top-12 -left-12 text-t_accent opacity-20 text-9xl z-0">
                    <i class="fa-solid fa-table-tennis-paddle-ball"></i>
                </div>

                <div class="w-5/12 h-full relative z-10 flex items-end justify-center">
                    <div class="absolute bottom-0 left-0 w-[420px] h-[550px] overflow-hidden rounded-t-[100px] rounded-b-[40px] shadow-2xl transform -translate-x-12 translate-y-8 bg-white border-4 border-white">
                        <img src="https://images.unsplash.com/photo-1530915536962-d3a92994e431?q=80&w=800&auto=format&fit=crop" alt="Tennis Player Serving" class="w-full h-full object-cover">
                    </div>
                    <div class="absolute top-[-40px] right-[-20px] w-20 h-20 bg-t_accent rounded-full border-4 border-white shadow-lg flex items-center justify-center animate-bounce">
                         <div class="w-full h-full rounded-full border-b-4 border-white opacity-50 absolute rotate-45"></div>
                    </div>
                </div>

                <div class="w-7/12 h-full flex flex-col justify-center pr-12 pl-4 z-10 text-right">
                    <div class="mb-6">
                        <h1 class="text-7xl text-white title-italic uppercase leading-none text-depth transform -rotate-1 origin-bottom-right">
                            Famous<br>Players
                        </h1>
                    </div>
                    <div class="text-white opacity-95">
                        <p class="text-lg leading-relaxed font-medium mb-4">
                            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas hendrerit leo in felis ultrices, ut vulputate sem tincidunt.
                        </p>
                        <p class="text-base leading-relaxed font-light opacity-80">
                            Etiam mattis venenatis nunc, in eleifend purus. Etiam tincidunt justo dui, non vehicula est posuere at. Curabitur vitae ullamcorper.
                        </p>
                    </div>
                    <div class="flex justify-end mt-6">
                        <div class="h-2 w-24 bg-t_accent rounded-full"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer (URL Removed) -->
        <footer class="absolute bottom-6 w-full text-center z-20"></footer>
    </div>

</body>
</html>
