<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techniques & Skills - Tennis Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        /* CSS Reset & Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Styles - Strictly 1280x720 */
        #page_container {
            width: 1280px;
            height: 720px;
            background-color: #3F6283; /* Primary Background */
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            /* No outer shadow as requested */
        }

        /* Typography Utilities */
        .text-shadow-hard {
            text-shadow: 4px 4px 0px #324E68;
        }
    </style>
</head>
<body>

    <div id="page_container">
        
        <header class="relative z-20 w-full h-[100px] bg-[#DDEE56] p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm cursor-default">
                        home
                    </div>
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">
                        content
                    </div>
                    <div class="bg-[#F0F4C3] px-10 py-2 rounded-full shadow-sm text-[#3F6283] font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">
                        contact
                    </div>
                </nav>
            </div>
        </header>

        <main class="grid grid-cols-12 gap-8 h-[calc(720px-100px)] w-full px-16 pt-12 pb-8">
            
            <div class="col-span-6 flex flex-col justify-center pr-8 z-10">
                <div class="w-20 h-2 bg-[#DDEE56] mb-6 rounded-full"></div>

                <h1 class="text-white text-8xl font-black italic leading-[0.9] tracking-tight mb-8 text-shadow-hard uppercase">
                    Techniques <br>
                    <span class="text-[#DDEE56]"> & Skills</span>
                </h1>

                <div class="bg-[#324E68]/30 p-6 rounded-lg border-l-4 border-[#DDEE56]">
                    <p class="text-white text-lg leading-relaxed font-light opacity-90">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas hendrerit leo in felis ultrices, ut vulputate sem tincidunt. Etiam mattis venenatis nunc, in eleifend purus. Etiam tincidunt justo dui, non.
                    </p>
                </div>
                
                <div class="mt-8 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#DDEE56] flex items-center justify-center text-[#3F6283]">
                        <i class="fa-solid fa-play text-xl"></i>
                    </div>
                    <p class="text-white font-bold tracking-wide">WATCH TUTORIAL</p>
                </div>
            </div>

            <div class="col-span-6 relative flex items-center justify-center">
                
                <div class="absolute w-[450px] h-[480px] bg-[#6292C2] rounded-[40px] rotate-3 right-4 top-4 border-2 border-[#FFFFFF]/10 z-0"></div>

                <div class="absolute left-[-40px] top-[40%] z-20 flex gap-2 opacity-60">
                     <div class="w-16 h-1 bg-white rounded-full"></div>
                     <div class="w-10 h-1 bg-white rounded-full"></div>
                     <div class="w-4 h-1 bg-white rounded-full"></div>
                </div>
                
                <div class="relative z-10 w-[420px] h-[520px] overflow-hidden rounded-[30px] border-4 border-white shadow-2xl rotate-[-2deg]">
                    <img src="https://images.unsplash.com/photo-1599474924187-334a4ae513ab?q=80&w=1000&auto=format&fit=crop" 
                         alt="Professional Tennis Player Serving" 
                         class="w-full h-full object-cover">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-[#3F6283]/80 to-transparent"></div>
                    
                    <div class="absolute bottom-6 left-6">
                        <p class="text-[#DDEE56] font-bold uppercase text-sm tracking-widest mb-1">Pro Level</p>
                        <p class="text-white font-medium text-lg">Serve Mastery</p>
                    </div>
                </div>

                <div class="absolute left-[-60px] top-[35%] w-24 h-24 bg-[#DDEE56] rounded-full shadow-lg border-4 border-white z-30 flex items-center justify-center text-[#3F6283]">
                    <i class="fa-solid fa-baseball text-5xl opacity-80 rotate-45"></i>
                </div>

            </div>
        </main>

        </div>

</body>
</html>
