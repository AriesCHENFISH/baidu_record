<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents - Tennis Presentation</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        t_primary: '#3F6283', 
                        t_container: '#6292C2', 
                        t_accent: '#DDEE56', 
                        t_highlight: '#F0F4C3', 
                        t_shadow: '#324E68' 
                    }, 
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'] } 
                } 
            } 
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; background-color: #3F6283; position: relative; margin: 0 auto; overflow: hidden; }
        .text-shadow-hard { text-shadow: 4px 4px 0px #324E68; }
        .title-italic { font-style: italic; font-weight: 900; letter-spacing: -0.02em; }
        /* 背景大文字水印 */
        .bg-watermark {
            position: absolute;
            font-size: 260px;
            font-weight: 900;
            font-style: italic;
            color: rgba(255, 255, 255, 0.03);
            line-height: 1;
            z-index: 0;
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- 背景装饰：水印文字 -->
        <div class="bg-watermark -bottom-10 -right-10">AGENDA</div>
        <div class="bg-watermark -top-10 -left-10">TENNIS</div>

        <!-- 统一页眉 -->
        <header class="relative z-20 w-full h-[100px] bg-t_accent p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm cursor-default">home</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">content</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">contact</div>
                </nav>
            </div>
        </header>

        <main class="relative z-10 h-[620px] px-20 flex flex-col justify-center">
            <!-- 标题部分 -->
            <div class="mb-10 flex items-end gap-6">
                <h1 class="text-8xl text-white title-italic uppercase text-shadow-hard">Contents</h1>
                <div class="h-2 flex-grow bg-t_accent mb-4 rounded-full opacity-50"></div>
            </div>

            <!-- 目录网格：8项 -->
            <div class="grid grid-cols-2 gap-x-16 gap-y-6">
                <!-- 01 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">01</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Introduction to Tennis</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 02 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">02</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Essential Equipment</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 03 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">03</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Techniques & Skills</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 04 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">04</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Famous Players</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 05 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">05</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Major Tournaments</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 06 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">06</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Court Surfaces</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 07 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">07</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Scoring System</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>

                <!-- 08 -->
                <div class="group flex items-center gap-6">
                    <div class="text-4xl font-black italic text-t_accent text-shadow-hard w-16">08</div>
                    <div class="h-16 flex-grow bg-t_shadow/40 border-l-4 border-t_accent rounded-r-xl flex items-center px-6 transition-all hover:bg-t_shadow/60 hover:translate-x-2">
                        <span class="text-white text-xl font-bold uppercase tracking-widest">Physical Benefits</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-t_accent opacity-50"></i>
                    </div>
                </div>
            </div>

            <!-- 底部装饰条 -->
            <div class="mt-12 flex gap-3">
                <div class="w-12 h-1 bg-t_accent rounded-full"></div>
                <div class="w-6 h-1 bg-t_accent rounded-full opacity-60"></div>
                <div class="w-3 h-1 bg-t_accent rounded-full opacity-30"></div>
            </div>
        </main>
    </div>
</body>
</html>
