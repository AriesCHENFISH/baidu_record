<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major Tournaments - Tennis Keynote</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        #page_container { width: 1280px; height: 720px; margin: 0 auto; position: relative; background-color: #3F6283; overflow: hidden; }
        .text-shadow-lg { text-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .title-italic { font-style: italic; font-weight: 800; letter-spacing: -0.02em; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        t_primary: '#3F6283',
                        t_container: '#6292C2',
                        t_accent: '#DDEE56',
                        t_highlight: '#F0F4C3',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="page_container">
        <!-- Unified Header Section -->
        <header class="relative z-20 w-full h-[100px] bg-t_accent p-3">
            <div class="w-full h-full border-2 border-dashed border-white rounded-lg flex items-center justify-center gap-16">
                <nav class="flex gap-12">
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm cursor-default">home</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">content</div>
                    <div class="bg-t_highlight px-10 py-2 rounded-full shadow-sm text-t_primary font-bold uppercase tracking-wide text-sm opacity-80 cursor-default">contact</div>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="grid grid-cols-12 gap-8 h-[620px] px-20 items-center">
            <div class="col-span-5 flex items-center justify-center relative">
                <div class="absolute top-0 right-0 w-32 h-32 bg-t_accent rounded-full opacity-20 blur-2xl transform translate-x-1/2 -translate-y-1/2"></div>
                <div class="bg-t_container p-8 rounded-3xl shadow-2xl relative w-full h-[420px] border border-white/10">
                    <div class="absolute -top-6 -right-6 z-20 bg-t_accent rounded-full p-1 shadow-lg w-20 h-20 flex items-center justify-center">
                        <i class="fas fa-baseball-ball text-4xl text-white opacity-80 rotate-45"></i> 
                    </div>
                    <div class="w-full h-full overflow-hidden rounded-2xl relative">
                        <img src="https://images.unsplash.com/photo-1627627256672-027a4613d528?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-t_primary/80 to-transparent mix-blend-multiply"></div>
                    </div>
                </div>
            </div>

            <div class="col-span-7 flex flex-col justify-center pl-8 pr-4">
                <div class="w-16 h-2 bg-t_accent mb-6 rounded-full"></div>
                <h1 class="text-white text-7xl title-italic tracking-tight leading-none mb-8 text-shadow-lg">
                    Major <br><span class="text-t_accent">Tournaments</span>
                </h1>
                <div class="bg-t_container/30 p-6 rounded-xl border-l-4 border-t_accent backdrop-blur-sm">
                    <p class="text-white text-lg font-light leading-relaxed opacity-90">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas hendrerit leo in felis ultrices, ut vulputate sem tincidunt. Etiam mattis venenatis nunc, in eleifend purus.
                    </p>
                </div>
                <div class="mt-8 flex items-center gap-4">
                     <div class="w-10 h-10 rounded-full bg-t_highlight flex items-center justify-center text-t_primary">
                         <i class="fas fa-arrow-right"></i>
                     </div>
                     <p class="text-t_highlight font-medium tracking-wide uppercase text-sm">Explore Details</p>
                </div>
            </div>
        </div>

        <!-- Footer (URL Removed) -->
        <footer class="absolute bottom-6 w-full text-center z-20"></footer>
    </div>
</body>
</html>
