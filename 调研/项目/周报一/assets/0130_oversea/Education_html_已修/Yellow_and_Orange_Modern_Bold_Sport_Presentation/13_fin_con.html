<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Sports Thank You Slide</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Using provided link + Oswald for the Retro Sporty Look) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Rubik:ital,wght@0,400;0,700;1,900&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset & Basic Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Font Families */
        .font-sport {
            font-family: 'Rubik', sans-serif;
        }
        .font-condensed {
            font-family: 'Oswald', sans-serif;
        }
        .font-body {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Page Container - Strict 1280x720 */
        .page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #F9FA5D; /* Lemon Yellow Background */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e5e5e5; /* Thin border for visibility in browser */
        }

        /* Retro Hard Shadow Utility */
        .retro-shadow {
            text-shadow: 6px 6px 0px #3131C6; /* Sporty Blue Shadow */
        }
        
        .box-shadow-hard {
            box-shadow: 8px 8px 0px #3131C6;
        }

        /* Outline Text Effect */
        .text-outline {
            -webkit-text-stroke: 2px #3131C6;
            color: transparent;
        }
        
        /* Grid Texture Overlay (Optional for retro feel) */
        .texture-grid {
            background-image: radial-gradient(#3131C6 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="page_container font-sport">
        
        <!-- Decorative Background Texture -->
        <div class="texture-grid absolute inset-0 z-0 pointer-events-none"></div>

        <!-- Decorative Geometric Shapes -->
        <!-- Blue Circle Top Right -->
        <div class="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-[#3131C6] z-0 opacity-20"></div>
        <!-- Orange Triangle/Div Bottom Left -->
        <div class="absolute bottom-10 left-10 w-32 h-32 z-0">
             <div class="w-full h-full border-4 border-[#E05320] rounded-full opacity-30"></div>
        </div>

        <!-- Header Section: Navigation / Top Text -->
        <header class="relative z-10 flex justify-between items-start px-12 pt-10 w-full h-auto">
            <!-- Left -->
            <div class="w-1/3 text-left">
                <h3 class="text-[#3131C6] text-2xl font-black uppercase tracking-tighter italic">
                    Evolving For
                </h3>
            </div>
            
            <!-- Center -->
            <div class="w-1/3 text-center">
                <div class="inline-block bg-[#3131C6] px-4 py-1 transform -skew-x-12">
                     <p class="text-white text-lg font-bold uppercase tracking-widest not-italic transform skew-x-12">
                        The Next
                    </p>
                </div>
            </div>

            <!-- Right -->
            <div class="w-1/3 text-right">
                <h3 class="text-[#3131C6] text-2xl font-black uppercase tracking-tighter italic">
                    Generation
                </h3>
            </div>
        </header>

        <!-- Main Content Area: Centered Image & Massive Typography -->
        <main class="relative z-10 flex-grow flex items-center justify-center w-full">
            
            <!-- Image Container with Hard Shadow Frame -->
            <div class="relative w-[800px] h-[400px] bg-white border-4 border-[#3131C6] box-shadow-hard transform -rotate-1 z-10">
                <!-- Image Wrapper -->
                <div class="w-full h-full overflow-hidden relative">
                    <!-- Unsplash Image: Basketball court/hoop vibe -->
                    <img src="https://images.unsplash.com/photo-1574623452334-1e0ac1590b52?q=80&w=1280&auto=format&fit=crop" 
                         alt="Outdoor Basketball Court" 
                         class="w-full h-full object-cover filter grayscale contrast-125 sepia-[.3]">
                    <!-- 800*400 -->
                    
                    <!-- Color Tint Overlay -->
                    <div class="absolute inset-0 bg-[#3131C6] mix-blend-multiply opacity-20"></div>
                </div>

                <!-- Decorative Tags on Image Frame -->
                <div class="absolute -top-3 -left-3 bg-[#E05320] text-white px-2 py-1 text-xs font-bold border border-black z-20">
                    <p>EST. 2024</p>
                </div>
                <div class="absolute -bottom-4 -right-4 bg-[#F9FA5D] text-[#3131C6] px-2 py-1 text-xs font-bold border-2 border-[#3131C6] z-20">
                    <p><i class="fa-solid fa-star"></i> GAME ON</p>
                </div>
            </div>

            <!-- Huge Typography Overlay (Absolute Positioned over Image) -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 w-full text-center pointer-events-none">
                <div class="flex flex-col items-center justify-center leading-[0.85]">
                    <!-- 'THANK' - Hollow Outline Style -->
                    <h1 class="font-condensed text-[160px] font-bold uppercase tracking-tighter text-transparent" style="-webkit-text-stroke: 3px #E05320;">
                        THANK
                    </h1>
                    <!-- 'YOU' - Solid Filled Style with Retro Shadow -->
                    <h1 class="font-condensed text-[160px] font-bold text-[#E05320] uppercase tracking-tighter retro-shadow">
                        YOU
                    </h1>
                </div>
            </div>

        </main>

        <!-- Footer Section: Contact Info -->
        <footer class="relative z-10 px-12 pb-10 w-full flex justify-between items-end">
            
            <!-- Website -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-[#3131C6] flex items-center justify-center text-[#F9FA5D]">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="flex flex-col">
                    <p class="text-[#996633] font-bold text-sm tracking-wide">VISIT US</p>
                    <p class="text-[#3131C6] font-black text-xl tracking-tight uppercase border-b-2 border-[#E05320]">
                        www.reallygreatsite.com
                    </p>
                </div>
            </div>

            <!-- Email -->
            <div class="flex items-center gap-3">
                 <div class="flex flex-col items-end">
                    <p class="text-[#996633] font-bold text-sm tracking-wide">CONTACT</p>
                    <p class="text-[#3131C6] font-black text-xl tracking-tight lowercase">
                        hello@reallygreatsite.com
                    </p>
                </div>
                <div class="w-8 h-8 rounded-full bg-[#E05320] flex items-center justify-center text-white">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
            </div>

        </footer>

        <!-- Decorative Line element at the very bottom -->
        <div class="absolute bottom-0 left-0 w-full h-2 flex">
            <div class="w-1/3 bg-[#3131C6]"></div>
            <div class="w-1/3 bg-[#E05320]"></div>
            <div class="w-1/3 bg-[#3131C6]"></div>
        </div>

    </div>

</body>
</html>
