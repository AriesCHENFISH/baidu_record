<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Web3 Matters - Keynote</title>
    <!-- Tailwind CSS -->
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <!-- Google Fonts (Domestic Mirror as requested) -->
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">

    <style>
        /* CSS Reset & Reconstruction */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Container Definition */
        #page_container {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            position: relative;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Custom Utility Classes for gradients strictly following rules */
        .bg-aurora {
            position: absolute;
            width: 1400px;
            height: 1000px;
            top: -200px;
            left: -400px;
            background: radial-gradient(circle at 50% 50%, #0011FF, #00008B, transparent 70%);
            opacity: 0.6;
            filter: blur(80px);
            z-index: 1;
        }

        .bg-aurora-secondary {
            position: absolute;
            width: 600px;
            height: 600px;
            bottom: -100px;
            left: 200px;
            background: radial-gradient(circle, #00008B, transparent);
            opacity: 0.4;
            filter: blur(60px);
            z-index: 1;
        }

        /* Glassmorphism subtle layer for right panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(10px); /* Optional browser support */
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Text Utilities */
        .text-glow {
            text-shadow: 0 0 20px rgba(0, 17, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div id="page_container">
        
        <!-- Background Elements (Layer 1) -->
        <!-- Primary Blue Gradient Mesh mimicking the "Spotlight" effect -->
        <div class="bg-aurora"></div>
        <!-- Secondary darker ambient light -->
        <div class="bg-aurora-secondary"></div>

        <!-- Content Grid (Layer 2) -->
        <div class="relative z-10 grid grid-cols-12 h-full w-full">

            <!-- LEFT COLUMN: Hero Title (Span 5) -->
            <div class="col-span-5 flex flex-col justify-center pl-16 pr-8 h-full">
                <!-- Decorative element -->
                <div class="w-12 h-1 bg-white mb-8 opacity-80"></div>

                <!-- Main Title -->
                <h1 class="text-8xl font-bold text-white leading-[1.1] tracking-tight mb-6 text-glow">
                    Why Web3<br>
                    Matters
                </h1>

                <!-- Subtitle -->
                <p class="text-xl text-gray-300 font-light tracking-wide border-l-4 border-blue-700 pl-4">
                    Solving Key Web2 Limitations
                </p>
                
                <!-- Abstract Design decoration -->
                <div class="mt-20 opacity-50">
                     <i class="fa-solid fa-cube text-6xl text-blue-800"></i>
                </div>
            </div>

            <!-- RIGHT COLUMN: Content List (Span 7) -->
            <div class="col-span-7 h-full glass-panel flex flex-col justify-between p-16">
                
                <!-- Top Meta Data -->
                <div class="flex justify-between items-start border-b border-gray-800 pb-4 mb-8">
                    <span class="text-gray-400 font-mono text-sm tracking-widest">YEAR: 2027</span>
                    <span class="text-white font-mono text-sm tracking-widest bg-blue-900/30 px-3 py-1 rounded">
                        WEB3 / TECH
                    </span>
                </div>

                <!-- The Transformation List -->
                <ul class="flex flex-col gap-10">
                    
                    <!-- Item 1 -->
                    <li class="group">
                        <!-- Web2 Context (Problem) -->
                        <p class="text-gray-500 text-sm font-medium uppercase tracking-wider mb-2 pl-8">
                            Centralized Control
                        </p>
                        <!-- Web3 Solution (Hero) -->
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-angles-right text-[#0011FF] text-xl transform group-hover:translate-x-1 transition-transform duration-300"></i>
                            <h3 class="text-4xl text-white font-semibold">User Autonomy</h3>
                        </div>
                    </li>

                    <!-- Item 2 -->
                    <li class="group">
                        <p class="text-gray-500 text-sm font-medium uppercase tracking-wider mb-2 pl-8">
                            Data Exploitation
                        </p>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-angles-right text-[#0011FF] text-xl transform group-hover:translate-x-1 transition-transform duration-300"></i>
                            <h3 class="text-4xl text-white font-semibold">Privacy & Consent</h3>
                        </div>
                    </li>

                    <!-- Item 3 -->
                    <li class="group">
                        <p class="text-gray-500 text-sm font-medium uppercase tracking-wider mb-2 pl-8">
                            Limited Monetization
                        </p>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-angles-right text-[#0011FF] text-xl transform group-hover:translate-x-1 transition-transform duration-300"></i>
                            <h3 class="text-4xl text-white font-semibold">Creator-Owned</h3>
                        </div>
                    </li>

                    <!-- Item 4 -->
                    <li class="group">
                        <p class="text-gray-500 text-sm font-medium uppercase tracking-wider mb-2 pl-8">
                            Security Concerns
                        </p>
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-angles-right text-[#0011FF] text-xl transform group-hover:translate-x-1 transition-transform duration-300"></i>
                            <h3 class="text-4xl text-white font-semibold">Blockchain Integrity</h3>
                        </div>
                    </li>

                </ul>

                <!-- Bottom Decoration -->
                <div class="mt-auto pt-8 flex justify-end">
                     <!-- 40x40 purely decorative placeholder -->
                    <div class="w-10 h-1 bg-gradient-to-r from-blue-900 to-blue-600 rounded-full"></div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
