<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infrastructure - Smart Contracts</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; position: relative; 
            background-color: #000000; 
            overflow: hidden; margin: 0 auto; font-family: 'Noto Sans SC', sans-serif;
        }

        .bg-aurora {
            position: absolute; width: 1400px; height: 1000px; top: -200px; left: -400px;
            background: radial-gradient(circle at 50% 50%, #0011FF, #00008B, transparent 70%);
            opacity: 0.6; filter: blur(80px); z-index: 0; pointer-events: none;
        }

        .bg-aurora-secondary {
            position: absolute; width: 600px; height: 600px; bottom: -100px; left: 200px;
            background: radial-gradient(circle, #00008B, transparent);
            opacity: 0.4; filter: blur(60px); z-index: 0; pointer-events: none;
        }
        
        /* Glass Panel for Image Container */
        .glass-frame {
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(60, 130, 246, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        .text-glow { text-shadow: 0 0 30px rgba(0, 17, 255, 0.6); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-aurora"></div>
        <div class="bg-aurora-secondary"></div>

        <div class="relative z-10 grid grid-cols-12 h-full w-full p-16 gap-12 items-center">
            
            <!-- Left Content -->
            <div class="col-span-5 flex flex-col justify-center relative">
                <div class="absolute -left-10 top-0 w-1 h-32 bg-gradient-to-b from-blue-600 to-transparent"></div>
                
                <div class="flex items-center gap-3 mb-8">
                    <span class="px-3 py-1 border border-blue-500 text-blue-400 text-xs font-bold uppercase tracking-widest rounded-full bg-blue-900/20">Core Technology</span>
                </div>
                
                <!-- Main Title: Consistent Size (text-8xl) -->
                <h1 class="text-8xl font-bold text-white leading-[0.9] tracking-tight mb-8 text-glow">
                    Smart<br>
                    <span class="text-blue-500">Contract</span>
                </h1>
                
                <div class="space-y-10 mt-4">
                    <div class="group">
                        <h3 class="text-white text-2xl font-bold mb-2 flex items-center gap-3">
                            <i class="fa-solid fa-robot text-blue-500"></i> Automated
                        </h3>
                        <p class="text-gray-400 font-light text-lg leading-relaxed border-l border-gray-700 pl-4 group-hover:border-blue-500 transition-colors">
                            Code that runs exactly as programmed without any possibility of downtime or censorship.
                        </p>
                    </div>

                    <div class="group">
                        <h3 class="text-white text-2xl font-bold mb-2 flex items-center gap-3">
                            <i class="fa-solid fa-handshake-simple-slash text-blue-500"></i> Trustless
                        </h3>
                        <p class="text-gray-400 font-light text-lg leading-relaxed border-l border-gray-700 pl-4 group-hover:border-blue-500 transition-colors">
                            Eliminating intermediaries. Mathematics replaces the need for institutional trust.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Right Image Visualization -->
            <div class="col-span-7 h-full flex items-center relative py-8 pl-8">
                <div class="glass-frame w-full h-full rounded-2xl relative p-2 overflow-hidden transform group">
                    
                    <!-- Decorative Browser Bar -->
                    <div class="h-8 bg-black/60 w-full flex items-center px-4 gap-2 border-b border-white/5 absolute top-2 left-2 right-2 z-20 rounded-t-xl backdrop-blur-md">
                        <div class="w-3 h-3 rounded-full bg-red-500"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        <div class="ml-auto text-xs text-blue-400 font-mono">protocol_v3.sol</div>
                    </div>
                    
                    <!-- Main Image Source -->
                    <div class="relative w-full h-full rounded-xl overflow-hidden bg-black">
                        <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=2670&auto=format&fit=crop" 
                             alt="Coding Interface" 
                             class="w-full h-full object-cover opacity-60 mix-blend-luminosity group-hover:scale-105 transition-transform duration-1000">
                        
                        <!-- Overlay Elements (The "Code" Look) -->
                        <div class="absolute inset-0 bg-gradient-to-t from-blue-900/40 to-transparent mix-blend-overlay"></div>
                        
                        <!-- Floating Verification Card -->
                        <div class="absolute bottom-10 right-10 p-5 bg-black/80 backdrop-blur-xl border border-blue-500/50 rounded-xl shadow-[0_0_30px_rgba(0,0,255,0.2)]">
                            <div class="flex items-center justify-between mb-3 border-b border-white/10 pb-2">
                                <span class="text-gray-400 text-xs uppercase tracking-wider">Status</span>
                                <span class="text-green-400 text-xs font-bold"><i class="fa-solid fa-check-circle mr-1"></i> EXECUTED</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded bg-blue-600 flex items-center justify-center text-white">
                                    <i class="fa-brands fa-ethereum text-xl"></i>
                                </div>
                                <div>
                                    <div class="text-white font-mono text-xl font-bold">1,402 ETH</div>
                                    <div class="text-gray-500 text-xs font-mono">TxID: 0x8f...2a9</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
