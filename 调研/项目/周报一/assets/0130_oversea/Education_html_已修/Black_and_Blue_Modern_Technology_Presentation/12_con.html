<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Security</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container { 
            width: 1280px; height: 720px; 
            margin: 0 auto; position: relative; 
            background-color: #000000; 
            overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; 
        }

        /* --- 统一背景装饰 (Standardized Background Decoration) --- */
        .bg-aurora {
            position: absolute; width: 1400px; height: 1000px; top: -300px; left: -400px;
            background: radial-gradient(circle at 50% 50%, #0011FF, #00008B, transparent 70%);
            opacity: 0.6; filter: blur(90px); z-index: 0; pointer-events: none;
        }

        .bg-aurora-secondary {
            position: absolute; width: 800px; height: 800px; bottom: -200px; right: -200px;
            background: radial-gradient(circle, #4B0082, transparent);
            opacity: 0.4; filter: blur(80px); z-index: 0; pointer-events: none;
        }

        .bg-icon-decoration {
            position: absolute; bottom: -80px; left: -50px;
            font-size: 500px; color: rgba(255, 255, 255, 0.03);
            transform: rotate(15deg); z-index: 0; pointer-events: none;
        }
        /* ------------------------------------------------------- */

        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-glow { text-shadow: 0 0 30px rgba(0, 17, 255, 0.6); }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- Background Elements -->
        <div class="bg-aurora"></div>
        <div class="bg-aurora-secondary"></div>
        <div class="bg-icon-decoration">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="relative z-10 flex flex-col h-full p-16">
            
            <!-- Header Section -->
            <div class="w-full flex justify-between items-end mb-12 border-b border-white/10 pb-8">
                <div>
                    <h1 class="text-8xl font-bold text-white leading-none tracking-tight text-glow">
                        Sovereign<br>
                        <span class="text-blue-500">Identity</span>
                    </h1>
                </div>
                <div class="text-right pb-2">
                    <div class="text-6xl font-mono text-gray-500 opacity-30 font-bold">02</div>
                    <div class="text-blue-400 tracking-widest text-sm font-bold uppercase">Security Protocol</div>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="grid grid-cols-12 gap-10 flex-1">
                
                <!-- Text Content -->
                <div class="col-span-7 flex flex-col justify-between">
                    <div>
                        <h3 class="text-2xl text-white font-bold mb-4 flex items-center gap-3">
                            <i class="fa-solid fa-fingerprint text-blue-500"></i> Zero-Knowledge Proofs
                        </h3>
                        <p class="text-gray-400 text-lg leading-relaxed">
                            Verify information without revealing the underlying data. In the Web3 era, users own their digital footprint. Authentication happens on the user's terms, eliminating centralized data breaches.
                        </p>
                    </div>

                    <div class="glass-panel p-6 rounded-lg mt-8 flex items-center gap-6">
                        <div class="flex-1">
                            <div class="h-1 w-full bg-gray-700 rounded-full mb-2">
                                <div class="h-full w-3/4 bg-blue-500 rounded-full shadow-[0_0_10px_#3b82f6]"></div>
                            </div>
                            <span class="text-xs text-gray-400 uppercase tracking-wider">Encryption Level</span>
                        </div>
                        <div class="text-white font-mono text-xl">AES-256</div>
                    </div>
                </div>

                <!-- Visual/Image Area -->
                <div class="col-span-5 relative">
                    <div class="absolute inset-0 bg-blue-600 rounded-2xl transform rotate-3 opacity-20"></div>
                    <div class="glass-panel w-full h-full rounded-2xl overflow-hidden relative border-0">
                        <!-- Image Source -->
                        <img src="https://images.unsplash.com/photo-1558494949-ef526b0042a0?q=80&w=2668&auto=format&fit=crop" 
                             alt="Digital Security" 
                             class="w-full h-full object-cover opacity-90 hover:scale-105 transition-duration-500">
                        
                        <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md text-blue-400 px-3 py-1 rounded-full text-xs border border-blue-500/30">
                            <i class="fa-solid fa-lock mr-1"></i> SECURE
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
