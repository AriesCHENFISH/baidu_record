<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Evolution - The Shift</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container {
            width: 1280px; height: 720px; position: relative; 
            background-color: #000000; 
            overflow: hidden; margin: 0 auto; font-family: 'Noto Sans SC', sans-serif;
        }

        .bg-aurora {
            position: absolute; width: 1400px; height: 1000px; top: -200px; left: -400px;
            background: radial-gradient(circle at 50% 50%, #0011FF, #00008B, transparent 70%);
            opacity: 0.6; filter: blur(80px); z-index: 0; pointer-events: none;
        }

        .glass-strip-unified {
            background: linear-gradient(90deg, rgba(37, 99, 235, 0.1), rgba(0, 0, 0, 0.6));
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(59, 130, 246, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative; overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .glass-strip-unified:hover { transform: translateX(10px); background: linear-gradient(90deg, rgba(37, 99, 235, 0.2), rgba(0, 0, 0, 0.8)); }

        .text-glow { text-shadow: 0 0 30px rgba(0, 17, 255, 0.6); }
    </style>
</head>
<body>
    <div id="page_container">
        <div class="bg-aurora"></div>
        <i class="fa-solid fa-network-wired absolute -bottom-20 right-0 text-[400px] text-blue-900/10 z-0"></i>

        <div class="relative z-10 grid grid-cols-12 h-full w-full p-16 gap-12">
            
            <!-- Left Column: Title + Visual Image -->
            <div class="col-span-5 flex flex-col h-full">
                <!-- Consistent Title Size (text-8xl) -->
                <div class="mb-8">
                    <span class="text-blue-400 font-mono text-sm tracking-widest uppercase mb-2 block">Evolution Timeline</span>
                    <h1 class="text-8xl text-white font-bold tracking-tight leading-[0.9] text-glow">
                        The<br>
                        <span class="text-blue-500">Shift</span>
                    </h1>
                </div>

                <!-- NEW: Visual Image Component on the Left -->
                <div class="flex-1 relative rounded-2xl overflow-hidden border border-white/10 group">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
                    <!-- Image Source -->
                    <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2672&auto=format&fit=crop" 
                         alt="Global Connectivity" 
                         class="w-full h-full object-cover opacity-80 group-hover:scale-110 transition-transform duration-700">
                    
                    <div class="absolute bottom-6 left-6 z-20">
                        <p class="text-white font-bold text-lg">Connectivity Reimagined</p>
                        <p class="text-gray-400 text-xs mt-1">From Read-Only to Ownership</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: The 3 Stages List -->
            <div class="col-span-7 flex flex-col justify-center gap-5 pl-8">
                
                <!-- Web 1.0 -->
                <div class="glass-strip-unified rounded-xl p-5 flex items-center gap-6">
                    <div class="w-16 h-16 shrink-0 rounded bg-black/40 flex items-center justify-center text-gray-400 text-2xl border border-white/10">
                        <i class="fa-solid fa-desktop"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-end">
                            <h3 class="text-white text-xl font-bold">Web 1.0</h3>
                            <span class="text-gray-500 font-mono text-xs">1990 - 2004</span>
                        </div>
                        <p class="text-blue-400/70 text-xs font-mono uppercase tracking-widest mt-1">Read-Only</p>
                        <p class="text-gray-400 text-sm mt-1">Static pages. Information economy.</p>
                    </div>
                </div>

                <!-- Web 2.0 -->
                <div class="glass-strip-unified rounded-xl p-5 flex items-center gap-6">
                    <div class="w-16 h-16 shrink-0 rounded bg-black/40 flex items-center justify-center text-blue-300 text-2xl border border-white/10">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-end">
                            <h3 class="text-white text-xl font-bold">Web 2.0</h3>
                            <span class="text-gray-500 font-mono text-xs">2005 - 2020</span>
                        </div>
                        <p class="text-blue-400/70 text-xs font-mono uppercase tracking-widest mt-1">Read-Write</p>
                        <p class="text-gray-400 text-sm mt-1">Platforms. Social & Mobile economy.</p>
                    </div>
                </div>

                <!-- Web 3.0 (Highlighted) -->
                <div class="glass-strip-unified rounded-xl p-6 flex items-center gap-6 border-l-4 border-l-blue-500 bg-gradient-to-r from-blue-900/30 to-black">
                    <div class="w-20 h-20 shrink-0 rounded bg-blue-600 flex items-center justify-center text-white text-3xl shadow-[0_0_20px_rgba(37,99,235,0.6)]">
                        <i class="fa-solid fa-cube"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-end">
                            <h3 class="text-white text-3xl font-bold">Web 3.0</h3>
                            <span class="text-blue-400 font-mono text-sm font-bold">NOW</span>
                        </div>
                        <p class="text-blue-300 text-sm font-mono uppercase tracking-widest font-bold mt-1">Read-Write-Own</p>
                        <p class="text-gray-200 text-base mt-2">Decentralized. Tokenized ownership economy.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
