<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Page - Web3 Keynote</title>
    <script src="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/tailwindcss_3.4.16.js"></script>
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/font-awesome/6.4.0/css/font-awesome_all.min_6.4.0.css">
    <link rel="stylesheet" href="https://edu-wenku.bdimg.com/v1/genflow2025/report_resource/Noto%2BSans%2BSC-wght%40300%3B400%3B500%3B700%26display%3Dswap.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #page_container { 
            width: 1280px; height: 720px; 
            margin: 0 auto; position: relative; 
            background-color: #000000; 
            overflow: hidden; 
            font-family: 'Noto Sans SC', sans-serif; 
        }

        /* --- Background Atmosphere --- */
        .bg-aurora-main {
            position: absolute; width: 1200px; height: 1200px; top: -400px; right: -200px;
            background: radial-gradient(circle, #0011FF, #00008B, transparent 70%);
            opacity: 0.6; filter: blur(100px); z-index: 0; pointer-events: none;
        }

        .bg-aurora-bottom {
            position: absolute; width: 800px; height: 600px; bottom: -200px; left: -100px;
            background: radial-gradient(circle, #00008B, transparent 60%);
            opacity: 0.4; filter: blur(80px); z-index: 0; pointer-events: none;
        }

        /* Tech Grid Background */
        .bg-grid {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            z-index: 0; pointer-events: none;
        }

        /* --- Glassmorphism Elements --- */
        .glass-card-presenter {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #3b82f6;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .title-glow {
            text-shadow: 0 0 50px rgba(0, 17, 255, 0.5);
        }

        .deco-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.8), transparent);
        }
    </style>
</head>
<body>
    <div id="page_container">
        <!-- Background Layer -->
        <div class="bg-aurora-main"></div>
        <div class="bg-aurora-bottom"></div>
        <div class="bg-grid"></div>
        
        <!-- Large Decorative Icon -->
        <i class="fa-brands fa-hive absolute top-20 right-40 text-[600px] text-white/5 animate-pulse z-0"></i>

        <div class="relative z-10 flex flex-col justify-between h-full p-16">
            
            <!-- Top Section: Brand/Logo Area -->
            <div class="flex justify-between items-start">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center text-white shadow-[0_0_15px_rgba(37,99,235,0.8)]">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div>
                        <div class="text-white font-bold tracking-wider leading-none">SALFORD</div>
                        <div class="text-blue-400 text-[10px] tracking-[0.2em] uppercase">Tech Solutions</div>
                    </div>
                </div>
                
                <div class="text-right">
                    <div class="text-white/40 font-mono text-sm">CONFIDENTIAL</div>
                </div>
            </div>

            <!-- Middle Section: Main Title -->
            <div class="flex-1 flex flex-col justify-center">
                <div class="relative">
                    <div class="absolute -left-8 top-4 w-1 h-32 bg-gradient-to-b from-blue-500 to-transparent"></div>
                    
                    <p class="text-blue-400 text-lg tracking-[0.4em] uppercase mb-4 font-bold pl-2">Keynote Presentation</p>
                    
                    <h1 class="text-9xl font-bold text-white leading-[0.9] tracking-tighter title-glow mix-blend-screen">
                        Web3<br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-blue-200 to-white">Digital Era</span>
                    </h1>
                    
                    <div class="mt-8 max-w-xl pl-2">
                        <div class="deco-line w-24 mb-6"></div>
                        <p class="text-gray-400 text-xl font-light leading-relaxed">
                            Exploring the decentralized future, sovereign identity, and the next generation of value exchange.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Bottom Section: Footer & Presenter Info -->
            <div class="flex items-end justify-between">
                
                <!-- Date / Location -->
                <div class="mb-2">
                    <div class="text-gray-500 text-sm font-mono uppercase tracking-widest mb-1">Date</div>
                    <div class="text-white text-lg">October 24, 2025</div>
                    <div class="text-blue-500 text-sm mt-1">London, UK</div>
                </div>

                <!-- Presenter Card -->
                <div class="glass-card-presenter p-6 rounded-r-xl rounded-tl-xl min-w-[320px] transform hover:-translate-y-2 transition-transform duration-500">
                    <div class="flex items-center gap-5">
                        <!-- User Avatar Placeholder -->
                        <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-700 to-black border-2 border-blue-500/50 flex items-center justify-center overflow-hidden shrink-0">
                            <i class="fa-solid fa-user text-gray-400 text-2xl"></i>
                        </div>
                        
                        <div>
                            <div class="text-blue-400 text-[10px] font-bold uppercase tracking-wider mb-1">Presented By</div>
                            <h3 class="text-white text-xl font-bold leading-none mb-1">Alex Morgan</h3>
                            <p class="text-gray-400 text-sm font-light">Lead Blockchain Architect</p>
                        </div>
                    </div>
                    
                    <!-- Decorative footer inside card -->
                    <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center">
                        <div class="flex gap-2">
                            <i class="fa-brands fa-linkedin text-gray-500 hover:text-white cursor-pointer transition-colors"></i>
                            <i class="fa-brands fa-twitter text-gray-500 hover:text-white cursor-pointer transition-colors"></i>
                        </div>
                        <div class="text-[10px] text-gray-500 font-mono">ID: 884-XJ</div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
