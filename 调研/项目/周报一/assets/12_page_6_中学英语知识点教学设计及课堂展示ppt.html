          &lt;!-- 左侧列：知识目标与技能目标 --&gt;

            &lt;!-- 知识目标卡片 (辅色背景) --&gt;

            &lt;p class=&quot;text-gray-300 text-[15px] leading-relaxed&quot;&gt;
              在中学英语教学中，相较于知识与技能目标，情感态度目标的达成往往更具挑战性。我们需要在激发表层兴趣的基础上，深入解决动机维持、体验公平与系统渗透这三大核心问题。
            &lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;!-- 右侧：三个难点卡片 --&gt;
        &lt;div class=&quot;w-2/3 h-full flex flex-col gap-4&quot;&gt;
          
          &lt;!-- 卡片1：深层动机与持久兴趣 --&gt;
          &lt;div class=&quot;flex-1 bg-[#1A1A1A] rounded-lg p-6 border-l-4 border-[#D9FF00] flex gap-4 relative overflow-hidden&quot;&gt;
            &lt;div class=&quot;flex-shrink-0&quot;&gt;
              &lt;div class=&quot;w-12 h-12 rounded-full bg-[#D9FF00] flex items-center justify-center&quot;&gt;
                &lt;span class=&quot;text-black font-bold text-xl font-heading&quot;&gt;01&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;flex-1 z-10&quot;&gt;
              &lt;h3 class=&quot;text-white text-[20px] font-bold mb-2 font-heading&quot;&gt;深层动机与持久兴趣的维持&lt;/h3&gt;

              &lt;/p&gt;

                &lt;span class=&quot;text-[#D9FF00] font-bold text-xl font-heading&quot;&gt;02&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;flex-1&quot;&gt;

              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

              &lt;div class=&quot;w-12 h-12 rounded-full bg-[#D9FF00] flex items-center justify-center&quot;&gt;
                &lt;span class=&quot;text-black font-bold text-xl font-heading&quot;&gt;03&lt;/span&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;flex-1 z-10&quot;&gt;

    &lt;/div&gt;

  <script>
   // 自动调整iframe高度
    function resizeIframes() {
        document.querySelectorAll('.responsive-iframe').forEach(iframe => {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const height = Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight,
                    doc.body.offsetHeight,
                    doc.documentElement.offsetHeight,
                    doc.body.clientHeight,
                    doc.documentElement.clientHeight
                );
                iframe.style.height = height + 'px';
            } catch (e) {
                console.log('无法调整iframe高度:', e);
            }
        });
    }
    
    // 初始调整
    window.addEventListener('load', resizeIframes);
    
    // 内容加载后调整
    document.querySelectorAll('.responsive-iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            resizeIframes();
            // 对动态内容进行定期检查
            setInterval(resizeIframes, 1000);
        });
    });
  </script>
