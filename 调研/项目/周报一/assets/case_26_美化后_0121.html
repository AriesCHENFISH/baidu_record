<script>
    /**
     * iframe 加载完成后，自动调整高度以适应内容
     */
    function resizeIframe(obj) {
        try {
            // 获取 iframe 内部内容的实际高度
            var contentHeight = obj.contentWindow.document.body.scrollHeight;
            var contentWidth = obj.contentWindow.document.body.scrollWidth;
            
            // 如果内容高度小于 720，保持 720；否则使用内容高度
            var finalHeight = Math.max(contentHeight, 720);
            
            // 防止某些 absolute 定位的页面计算高度为 0
            if (finalHeight <= 0) finalHeight = 720;

            obj.style.height = finalHeight + 'px';
            
            console.log('Resized iframe to: ' + finalHeight + 'px');
        } catch (e) {
            console.error('Error resizing iframe:', e);
        }
    }

    // 针对某些动态渲染的页面（如 echarts），可能需要延迟再次计算高度
    window.addEventListener('load', function() {
        var iframes = document.querySelectorAll('iframe');
        iframes.forEach(function(iframe) {
            // 这里设置一个延时，确保 iframe 内部 JS 执行完毕
            setTimeout(function(){ resizeIframe(iframe) }, 500);
            setTimeout(function(){ resizeIframe(iframe) }, 2000);
        });
    });
</script>
