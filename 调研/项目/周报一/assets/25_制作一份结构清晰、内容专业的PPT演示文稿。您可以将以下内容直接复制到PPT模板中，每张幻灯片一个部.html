                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center rounded-lg bg-[#E3EFFD]"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-[20px] h-[20px] text-[#0C5DBF]"&gt;
                                  &lt;path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/&gt;
                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-black font-heading"&gt;职能转变&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;!-- 描述文本 --&gt;
                      &lt;p class="text-[#333333] text-[16px] leading-[1.8]"&gt;
                          从传统的农村管理模式向现代社区化治理转型。工作重心由农业生产服务转向社区公共服务与综合治理。
                      &lt;/p&gt;
                  &lt;/div&gt;

                  &lt;!-- 卡片 2: 新事务涌现 (特殊样式: 蓝底白字 - 强调核心挑战) --&gt;
                  &lt;div class="bg-[#0C5DBF] rounded-[8px] p-[30px] flex flex-col gap-[20px] shadow-sm relative overflow-hidden"&gt;
                      &lt;!-- 装饰背景 --&gt;
                      &lt;div class="absolute -right-4 -top-4 w-24 h-24 bg-white opacity-10 rounded-full"&gt;&lt;/div&gt;
                      
                      &lt;div class="flex items-center gap-[12px] relative z-10"&gt;
                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-full h-full text-white"&gt;
                                  &lt;path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/&gt;
                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-white font-heading"&gt;新事务涌现&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;p class="text-white/90 text-[16px] leading-[1.8] relative z-10"&gt;
                          需应对物业管理、社区环境卫生、公共设施维护等全新任务，对基层干部的治理能力提出更高要求。
                      &lt;/p&gt;
                  &lt;/div&gt;

                  &lt;!-- 卡片 3: 新矛盾点 --&gt;
                  &lt;div class="bg-white rounded-[8px] p-[30px] flex flex-col gap-[20px] shadow-sm border border-gray-100"&gt;
                      &lt;div class="flex items-center gap-[12px]"&gt;
                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center rounded-lg bg-[#E3EFFD]"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-[20px] h-[20px] text-[#0C5DBF]"&gt;
                                  &lt;path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/&gt;
                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-black font-heading"&gt;新矛盾点&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;p class="text-[#333333] text-[16px] leading-[1.8]"&gt;
                          物业费收缴难、公共设施维护责任不清等问题凸显，传统村规民约在新型社区治理中面临适用性挑战。
                      &lt;/p&gt;
                  &lt;/div&gt;

                  &lt;!-- 卡片 4: 生活成本增加 --&gt;
                  &lt;div class="bg-white rounded-[8px] p-[30px] flex flex-col gap-[20px] shadow-sm border border-gray-100"&gt;
                      &lt;div class="flex items-center gap-[12px]"&gt;
                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center rounded-lg bg-[#E3EFFD]"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-[20px] h-[20px] text-[#0C5DBF]"&gt;
                                  &lt;path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/&gt;
                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-black font-heading"&gt;生活成本增加&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;p class="text-[#333333] text-[16px] leading-[1.8]"&gt;
                          水电燃气、物业管理费等刚性支出显著上升，对于以农业收入和外出务工收入为主的村民造成一定压力。
                      &lt;/p&gt;
                  &lt;/div&gt;

                  &lt;!-- 卡片 5: 生产生活冲突 --&gt;
                  &lt;div class="bg-white rounded-[8px] p-[30px] flex flex-col gap-[20px] shadow-sm border border-gray-100"&gt;
                      &lt;div class="flex items-center gap-[12px]"&gt;
                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center rounded-lg bg-[#E3EFFD]"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-[20px] h-[20px] text-[#0C5DBF]"&gt;
                                  &lt;path d="M7 2v11h3v9l7-12h-4l4-8z"/&gt;
                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-black font-heading"&gt;生产生活冲突&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;p class="text-[#333333] text-[16px] leading-[1.8]"&gt;
                          集中居住导致原有农业生产便利性下降，农机具存放困难、粮食晾晒场地缺失，居住空间与生产空间物理分离。
                      &lt;/p&gt;
                  &lt;/div&gt;

                  &lt;!-- 卡片 6: 组织建设 --&gt;
                  &lt;div class="bg-white rounded-[8px] p-[30px] flex flex-col gap-[20px] shadow-sm border border-gray-100"&gt;
                      &lt;div class="flex items-center gap-[12px]"&gt;
                          &lt;div class="w-[32px] h-[32px] flex items-center justify-center rounded-lg bg-[#E3EFFD]"&gt;
                              &lt;svg viewBox="0 0 24 24" fill="currentColor" class="w-[20px] h-[20px] text-[#0C5DBF]"&gt;

                              &lt;/svg&gt;
                          &lt;/div&gt;
                          &lt;h3 class="text-[22px] font-bold text-black font-heading"&gt;组织建设&lt;/h3&gt;
                      &lt;/div&gt;
                      &lt;p class="text-[#333333] text-[16px] leading-[1.8]"&gt;
                          需加强基层党组织建设，改进组织设置和工作方式，增强凝聚力，以适应新时代基层治理的复杂挑战。
                      &lt;/p&gt;
                  &lt;/div&gt;

              &lt;/div&gt;
          &lt;/div&gt;
      &lt;/div&gt;

                &lt;h1 class="font-heading text-[36px] font-bold leading-tight text-[#207EF0]"&gt;
                    居住区规划特点

            &lt;div class="absolute top-[90px] left-0 w-full h-[610px] px-[60px] flex"&gt;
                
                &lt;!-- 左半部分：传统分散居住特征 --&gt;

                    &lt;!-- 上方文本块 --&gt;
                    &lt;div class="absolute top-0 w-full text-center px-4"&gt;
                        &lt;h3 class="text-[#0C5DBF] text-[22px] font-bold mb-3 tracking-wide font-heading"&gt;原分散居住模式特征&lt;/h3&gt;
                        &lt;p class="text-[#374151] text-[14px] leading-relaxed px-6"&gt;
                            柳新村建设前，村民住宅呈自然散落状态，布局受地形与宗族关系影响较大。&lt;br&gt;
                            这种模式虽然土地集约度低，但保留了传统乡村的空间肌理与邻里关系。
                        &lt;/p&gt;
                    &lt;/div&gt;

                        &lt;p class="text-[#374151] text-[14px] leading-relaxed px-6"&gt;
                            基础设施配套滞后，难以实现规模化公共服务。&lt;br&gt;
                            用地粗放，人均建设用地指标偏高，土地利用率较低。
                        &lt;/p&gt;

                        &lt;/div&gt;
                    &lt;/div&gt;
                &lt;/div&gt;

                &lt;!-- 右半部分：新型集中居住规划 --&gt;
                &lt;div class="w-1/2 h-full relative z-10"&gt;
                    &lt;!-- 上方文本块 --&gt;
                    &lt;div class="absolute top-0 w-full text-center px-4"&gt;
                        &lt;h3 class="text-[#0C5DBF] text-[22px] font-bold mb-3 tracking-wide font-heading"&gt;新型小区规划指标&lt;/h3&gt;

  <script>
   // 自动调整iframe高度
    function resizeIframes() {
        document.querySelectorAll('.responsive-iframe').forEach(iframe => {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const height = Math.max(
                    doc.body.scrollHeight,
                    doc.documentElement.scrollHeight,
                    doc.body.offsetHeight,
                    doc.documentElement.offsetHeight,
                    doc.body.clientHeight,
                    doc.documentElement.clientHeight
                );
                iframe.style.height = height + 'px';
            } catch (e) {
                console.log('无法调整iframe高度:', e);
            }
        });
    }
    
    // 初始调整
    window.addEventListener('load', resizeIframes);
    
    // 内容加载后调整
    document.querySelectorAll('.responsive-iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            resizeIframes();
            // 对动态内容进行定期检查
            setInterval(resizeIframes, 1000);
        });
    });
  </script>
